然生态系统、生态廊道、重要栖息地以及自然和人文景观的不利影响的，由县级以上人民政府林业草原、自然资源、生态环境、水行政、农业农村等有关部门按照职责分工责令改正，可以处10万元以下的罚款；造成生态破坏的，责令限期修复或者采取其他补救措施，相关活动在核心保护区开展的，处10万元以上50万元以下的罚款，在一般控制区开展的，处5万元以上20万元以下的罚款。 第四十四条 本条例第四十条、第四十一条、第四十三条规定的违法行为，发生在自然保护区区域内海岸线向海一侧的，海警机构在职责范围内依法实施处罚。 对本条例第四十条、第四十一条、第四十三条规定的违法行为，有关行政法规规定的罚款数额高于本条例规定的，适用其规定。 第四十五条 自然保护区区域内的单位、个人以及进入自然保护区的人员不服从自然保护区管理机构管理的，自然保护区管理机构有权予以劝阻、制止；构成扰乱公共秩序等违反治安管理行为的，由公安机关依法给予治安管理处罚。 第四十六条 违反本条例规定，破坏自然资源或者污染环境、破坏生态的，依法承担民事责任；构成犯罪的，依法追究刑事责任。 第五章 附 则 第四十七条 涉及国家海洋权益的自然保护区，由国务院林业草原主管部门会同有关部门根据本条例制定具体管理办法。 省、自治区、直辖市人民政府可以根据本条例，制定实施办法。 第四十八条 本条例自2026年3月15日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"},{"slug":"regulation-20251011-430d7532","title":"密云水库水源保护条例","publish_date":"2025-10-11"}],"updated_at":"2026-11-16T09:21:19.760Z"},{"slug":"policy-20260129-fa70b9ff","title":"国务院关于同意将湖南省芷江侗族自治县列为国家历史文化名城的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2026〕7号","publish_date":"2026-01-29","effective_date":"","status":"现行有效","level":"国家级","region":"芷江","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202601/content_7056522.htm","summary":"历史文化名城名镇名村保护条例》要求，深入研究发掘文化遗产内涵与价值，系统开展考古调查和史料研究，厘清沅州古城的空间格局和发展脉络，明确保护的原则和重点，强化文化遗产保护利用，传承弘扬中华优秀传统文化，","themes":["历史文化名城"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于同意将湖南省芷江侗族自治县 列为国家历史文化名城的批复 国函〔2026〕7号 湖南省人民政府： 你省关于申报芷江侗族自治县为国家历史文化名城的请示收悉。现批复如下： 一、同意将芷江侗族自治县列为国家历史文化名城。芷江侗族自治县历史悠久、文化厚重，文化遗产资源丰富，传统格局和历史风貌保存较好，地域特色鲜明，具有重要的历史文化价值。 二、你省、怀化市及芷江侗族自治县人民政府要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，按照党中央、国务院决策部署，牢固树立保护历史文化遗产责任重大的观念，落实《中华人民共和国文物保护法》、《历史文化名城名镇名村保护条例》要求，深入研究发掘文化遗产内涵与价值，系统开展考古调查和史料研究，厘清沅州古城的空间格局和发展脉络，明确保护的原则和重点，强化文化遗产保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好芷江侗族自治县历史文化名城保护规划和文物保护等专项规划，制定并严格实施保护管理规定，明确各类保护对象的清单以及保护内容、要求和责任。正确处理城市建设与文化遗产保护的关系，摸清文物资源家底，加强文物保护，完善“先调查、后建设”、“先考古、后出让”制度，重视城市格局保护和风貌管控，加强整体性保护、系统性保护；保护修复历史文化街区，补足配套基础设施和公共服务设施短板，不断提升人居环境品质；加强不可移动文物和历史建筑修缮保护，推动文物活化利用，充分发挥不可移动文物和历史建筑的使用价值。不得改变与名城相互依存的自然景观和环境，不得进行任何与名城环境和风貌不相协调的建设活动，不得损坏或者擅自迁移、拆除不可移动文物和历史建筑，相关建设项目要依法履行报批程序。进一步强化责任落实，对不履职尽责、保护不力，造成名城历史文化价值受到严重影响的行为，依法依规加大监督问责力度。 三、你省与住房城乡建设部、国家文物局要加强对芷江侗族自治县国家历史文化名城保护工作的指导、监督和检查。 国务院 2026年1月26日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.790Z"},{"slug":"policy-20260121-240aa4ba","title":"自然资源部 住房城乡建设部关于进一步支持城市更新行动若干措施的通知","type":"policy","type_label":"政策","issuer":"自然资源部 住房城乡建设部","doc_no":"自然资发〔2025〕226号","publish_date":"2026-01-21","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202601/content_7055533.htm","summary":"规划许可手续。 四、鼓励资源资产组合供应整体运营 （七）更加注重特色发展，积极开展更新地区自然、景观和文化遗产等特色资源调查和活化利用，并结合国土空间规划优化功能结构和用途管控，建立健全多门类资源资产","themes":["城市更新","国土空间规划"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>自然资源部 住房城乡建设部关于进一步支持城市更新行动若干措施的通知 自然资发〔2025〕226号 各省、自治区、直辖市和国务院审批国土空间总体规划城市及新疆生产建设兵团自然资源主管部门、住房城乡建设部门： 为落实《中共中央 国务院关于推动城市高质量发展的意见》《中共中央办公厅 国务院办公厅关于持续推进城市更新行动的意见》要求，结合各地城市更新实践需求，在已有支持城市更新的规划和土地政策指引基础上，现就进一步支持城市更新行动的措施通知如下。 一、增强详细规划适应性 （一）依据国土空间总体规划和城市更新专项规划确定的城市更新目标和工作重点，结合“十五五”城市更新行动需求，对拟实施城市更新区域的详细规划进行评估、优化。可按照法定程序和相关要求，采取技术修正、优化调整等方式优化原有详细规划，并纳入国土空间规划“一张图”（以下简称“一张图”）实施监督。可结合完善公众参与和监督方式，制定简化详细规划修改程序。 （二）可结合新产业、新业态发展需求，制定土地混合开发和空间复合利用正面清单和管控要求，经详细规划审批机关批准；城市更新项目实施中，符合正面清单的，即视为符合详细规划。 （三）在保证公共安全和公共利益、不影响周边利害关系人合法权益、不改变建筑主体结构、不破坏历史风貌和景观环境、落实用地需求的前提下，可对改善社区公共服务（市政）设施（包括小区车辆停放场地及充电设施等）、提升社区公共空间服务功能（包括加装电梯、无障碍设施、小区绿化场地、健身步道等）等微更新项目，制定规划许可豁免清单。 二、优化过渡期支持政策 （四）利用存量土地、房产资源发展国家支持产业、行业的，可享受一定年期内不改变用地主体和规划条件的过渡期政策，过渡期原则上不超过5年。过渡期届满时，符合产业发展方向和履约监管要求的，依法依约定按照新用途办理用地手续；不符合的，按照约定退出过渡期支持政策，维持原有土地用途。过渡期满办理土地有偿使用手续的，可采取租赁或协议出让方式。 三、推进存量土地和空间的临时利用 （五）可在维护相关方合法权益、保障安全、不影响远期规划实施前提下，制定空闲建设用地（不含临时用地）的临时利用规则，明确期限及到期恢复措施，纳入“一张图”实施监管。 （六）可在与相关部门做好工作衔接的基础上，制定存量建（构）筑物不增加容积率和高度情况下的临时利用管控规则，对用途实行正面清单管理，纳入正面清单的无需办理规划许可手续。 四、鼓励资源资产组合供应整体运营 （七）更加注重特色发展，积极开展更新地区自然、景观和文化遗产等特色资源调查和活化利用，并结合国土空间规划优化功能结构和用途管控，建立健全多门类资源资产在特定国土空间范围内组合供应、整体运营和合理分配的机制，形成推动城市更新行动的新动能、新优势。 五、创新不动产登记服务 （八）可按照产权调整协议约定等，预编不动产单元，为原所有权、抵押权等权利主体办理预告登记，保障不动产权利在更新实施中的延续性。 （九）对老旧住房自主更新项目，可采用直接按户首次登记等方式提供不动产登记服务。涉及通过转让、置换等方式归集产权的，可灵活采用不同登记类型提供服务。 （十）对土地带建筑一并收储供应的，可根据有偿使用合同或划拨决定书中明确的建筑物权属、界址、面积、用途等信息，在确保安全底线基础上，探索简化申请材料提供登记服务。 六、妥善处置历史遗留问题 （十一）按照依法依规、尊重历史、公平公正、包容审慎的原则，根据其成因并兼顾土地管理政策的延续性，在保障无过错方利益的前提下，妥善处置历史遗留问题。对于历史形成的没有合法用地手续的建设用地，根据全国国土调查结果，区分发生的不同时期依法依规分类明确认定标准和处置政策，予以妥善处理，并纳入“一张图”实施监督，确保底数清晰、封闭运行，严守底线、控制风险。 自然资源部和住房城乡建设部将加强工作指导和政策协调，适时开展业务培训和交流，总结可复制推广的经验做法。各级自然资源、住房城乡建设部门加强沟通协作，结合实际优化、细化有关措施，研究破解难点问题，及时总结实践经验，重要事项及时报告。 自然资源部 住房城乡建设部 2025年12月31日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.810Z"},{"slug":"policy-20260119-b67383f0","title":"教育部等七部门关于深入推进中华优秀语言文化传承发展 提高全民语言文化素养的意见","type":"policy","type_label":"政策","issuer":"教育部 国家语委 中央宣传部 中央网信办 文化和旅游部 国家文物局 共青团中央","doc_no":"教语信〔2025〕3号","publish_date":"2026-01-19","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202601/content_7055236.htm","summary":"推广力度，科学保护各民族语言文字，实施国家语言文化传承发展系列工程，推动中华优秀语言文化创造性转化和创新性发展，形成更多标志性成果，融入学校教育体系和终身教育体系，融入中华优秀传统文化、革命文化和","themes":["文化传承"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>教育部等七部门关于深入推进 中华优秀语言文化传承发展 提高全民语言文化素养的意见 教语信〔2025〕3号 语言是人类交流思想的工具、传承文明的载体、增进理解的桥梁。一个国家文化的魅力、一个民族的凝聚力主要通过语言表达和传递。中华优秀语言文化源远流长、内涵丰富，是中国特色社会主义文化的重要内容，是强化以文化人价值引领的重要基础，是落实立德树人根本任务的重要支撑。为深入贯彻落实《教育强国建设规划纲要（2024—2035年）》关于实施国家语言文化传承发展系列工程和提高全民语言文化素养的部署要求，现提出如下意见。 一、总体要求 以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，全面贯彻习近平文化思想，全面贯彻习近平总书记关于教育的重要论述和关于语言文化的重要指示批示精神，担负新时代新的文化使命，落实立德树人根本任务，以社会主义核心价值观为引领，加大国家通用语言文字推广力度，科学保护各民族语言文字，实施国家语言文化传承发展系列工程，推动中华优秀语言文化创造性转化和创新性发展，形成更多标志性成果，融入学校教育体系和终身教育体系，融入中华优秀传统文化、革命文化和社会主义先进文化教育，融入经济社会发展，持续提升全民特别是青少年的语言文化素养，助力培养担当民族复兴大任的时代新人，奠基国家语言能力建设，服务铸牢中华民族共同体意识，服务推动构建人类命运共同体，为建设教育强国、文化强国和人才强国提供有力支撑。 到2030年，中华优秀语言文化传承发展体系基本建成，实现科学阐释、教育普及、资源开发、数字赋能、队伍建设、推广传播、交流互鉴等协同发展；全民语言文化素养提升机制基本建成，全民语言文化基本素养普及率明显提升。到2035年，中华优秀语言文化传承发展和全民语言文化素养水平全面提升，服务强国建设的能力全面增强。 二、主要任务 （一）科学研究阐释 深入研究阐释习近平总书记关于语言文化的重要指示批示精神，系统科学阐发其中蕴含的道理学理哲理，更好转化为知识话语、研究范式、学术理论和教育教学内容。 深刻理解“两个结合”的根本要求，研究阐释新时代党的创新理论关于语言文化的重大基础性问题，深入研究加快建设教育强国、塑造立德树人新格局、增强思政引领力对传承发展中华优秀语言文化的实践要求。研究阐发中国语言文字本体文化内涵及其传承的中华基因、蕴含的中华民族精神、承载的中华民族文明智慧，科学阐明中国语言文字与中华文明突出特性之间的内在关联，系统挖掘中国语言文字的历史渊源和当代价值，增强语载思想、言传精神、文增智慧、字通根脉的独特功能，发挥语言文字在传承和弘扬中国特色社会主义文化中的基础作用。持续推出中华优秀语言文化标识性成果，有力支撑构建中国哲学社会科学自主知识体系。重点实施古文字与中华文明传承发展工程，引导全社会深刻理解甲骨文是中华优秀传统文化的根脉，理解中华民族的形成和发展离不开汉文字的维系。 科学阐释全面推广普及国家通用语言文字、以语言相通促进心灵相通和命运相通的深刻内涵，充分发挥中华优秀语言文化教育对铸牢中华民族共同体意识的重要作用，引导全社会了解中华优秀语言文化的发展脉络、价值理念和世界影响，不断增强中华文化认同，服务加强中华民族共同体理论体系建设和构筑中华民族共有精神家园，服务铸牢中华民族共同体意识。 （二）推进教育普及 创新开展中华优秀语言文化教育，切实增强语言育人、以文化人和立德树人的实效性。重点实施中华经典诵读工程，拓宽中华经典诵写讲大赛新赛道新赛项。大力实施全民语言文化素养提升行动，加强语言文化素养监测、反馈、指导，建立语言文化素养指数。编制中华优秀语言文化读本和公共领域语言礼仪指南。深入开展普及教育活动，引导全民在学习传承中华优秀语言文化中树立科学的意识与态度、掌握必备的知识与信息、学会基本的技能与方法、养成良好的行为与习惯、尊崇健康的审美与风尚。 推动各地区健全语言文化教育长效机制，将中华优秀语言文化教育贯穿国民教育体系、融入城乡生产生活，开展语言文化教育特色工作，持续提升中华优秀语言文化认知水平；增强教师语言文化教育教学能力，发挥示范引领作用。指导各学校创新语言文化教育模式，将中华优秀语言文化教育融入德智体美劳教育体系，纳入大中小学思政课程与课程思政建设，融入学科体系、教学体系、管理体系；统筹推动价值引领、实践体验、环境营造，探索建立知信行一体强化、大中小一体贯通、家校社一体协同的中华优秀语言文化教育模式；开展追溯甲骨文、金文、篆书等文字发展演变，用好古代书画、古碑碣、摩崖石刻等文物资源，传承书法、篆刻等中华文化瑰宝，展现印刷术、造纸术等中国古代文明成就，以及反映新时代伟大成就的语言文化教育。中小学校注重用好课程教材中的语言育人元素，加强普通话和规范汉字书写教育，创新开展专题讲座、研学实践、展示交流等。高等学校开设大学语文、中国书法、数字中文、数字人文、大语言模型技术等公共课程，将培养学生语言文化素养与提升学科专业能力、岗位职业素养和社会适应能力结合。鼓励各有关单位实施语言文化特色项目，提倡图书馆、博物馆、文化馆、出版社等开展语言文化活动。大力倡导语言礼仪、文明语言和语言伦理，服务培育自尊自信、理性平和、积极向上的社会心态，助力提升全民思想道德素质、科学文化素质和身心健康素质。 （三）保护开发资源 加强国家语言资源治理，发挥语言文字的教育资源、科技资源、文化资源、经济资源、安全资源和战略资源作用，把语言资源优势转化为文化发展优势。重点实施中国语言资源保护工程，完善国家语言资源库，夯实语言资源建设基础。 加强语言资源的调查整理、科学保护和规范储备；宣传好甲骨文入选联合国教科文组织《世界记忆名录》的意义，健全古文字资源保护和传承机制；实施“中国语言记忆”行动，在文化生态保护区中加大语言资源保护，鼓励设立城乡语言文化档案。加强语言资源开发共享，聚焦中华典籍、红色经典和中国成就、中国经验等文献提炼语言育人资源；支持学校建设语言文化教育环境；重点支持中国语言资源博物馆建设，鼓励有条件的地方和单位合理利用文物建筑、工业遗产、校园设施等布局语言资源博物馆、语言文字博物馆、语言文化园等语言文化传承场馆；鼓励城乡社区、交通场站、国家文化公园等公共场所建设语言文化景观；开发文字和书法资源，推出主题旅游线路。加强语言资源服务赋能，依托国家关键领域语言科技赋能计划，支撑语言文化传承发展；支持语言资源、语言数据和语言资产转化利用；支持中华老字号、地名文化遗产等领域的语言文化研究与传播；支持面向儿童、老年人、语言障碍人群等开展语言文化服务。 （四）强化数字赋能 落实数字中国建设要求，全方位释放语言文字数据要素价值，推动语言文化与科技创新双向赋能。重点依托国家数字中文建设工程，深化语言文字与信息技术融合，加强人工智能应用，服务中华优秀语言文化传承发展。 加快推进语言文化资源数据化建设，加强规模采集、标注加工、规范存储及安全治理，健全语料库数据集质量测评机制；依托国家关键语料数据基础设施建设计划，重点建设甲骨文、古今汉语和语言文化的语料库、资源库等；实施新型语料库建设工程，完善相关建设规范，编制典型应用推广指南。加快推进语言文化成果数字化应用，建好国家语言资源服务平台、中国语言文字数字博物馆等，支持地方建设语言资源数字化平台；推动古籍数字化关键技术创新；继续实施中华精品字库工程，丰富中国历代书法名家字库；建设语言文化数字公共服务产品，支持发展语言数字产业。加快推进语言文化传承智慧化赋能，实施“人工智能+”语言文化传承项目，建设垂直领域大语言模型；多渠道推动提升中文在全球数字空间的使用占比、价值引领和文化贡献；建立大语言模型能力素养监测机制，引导全民特别是青少年有益、安全、公平使用人工智能，提升话语表达力、价值判断力和文化鉴别力。 （五）建强人才队伍 建设规模充足、结构合理和素质优良的语言文化人才队伍。重点依托国家语言能力建设工程，加强研究型、应用型和复合型语言文化人才的培养、储备和使用。 加大语言学科建设力度，支持实施古文字学强基计划，促进古文字学学科建设和拔尖创新人才培养，确保甲骨文等冷门“绝学”有人做、有传承；支持高校探索开设语言科学专业；推进语言学科与相关学科融合；支持有条件的高校探索“专业技能+语言能力+跨域文化”人才培养，助力中华文化“走出去”。加大语言人才激励力度，建立国家语言文化传承发展重大工程项目首席专家制度，造就一批语言文化领军人物；依托国家语言文字关键研究领域领航计划，加强语言文化创新团队建设；依托现有专业平台，提升语言文化教育相关学科领域课程教材建设专业队伍水平。加大语言人才汇聚力度，实施国家语言文化传承人计划，培育“语言资源守护者”“语言技术工程师”“语言文化代言人”；打造“中国语言科学大会”品牌，支持建设全球语言服务平台，开展中国语言能力素养展示活动，汇聚高端语言文化人才。 （六）加强推广传播 加快建设语言文化传播体系，增强中华优秀语言文化的吸引力、传播力和影响力。重点实施中华语言文化传播工程，优化传播理念，创新传播方式，提升传播效果。 聚力打造语言文化传播矩阵，建设中国语言文化信息传播平台，创新舞台艺术、视听媒介、数字出版、微课堂等传播方式；科学建设中国语言文化地图，推动优质资源全国共享；支持建设中华优秀语言文化传承单位，建好用好语言文字推广应用类全国示范性特色学校；鼓励举办中华优秀语言文化品牌活动，打造数字化精品课程、精品产品、精品案例；办好“文质彬彬·每日好词语”等宣传活动。汇聚优质阅读资源，探索建设阅读标准体系，深入实施青少年学生读书行动，着力加强“书香校园”建设，助力推进全民阅读、建设“书香中国”；深入开展“典耀中华”主题读书、中华经典润校园进万家、全国校园节庆日诵读展示等系列活动，发布典型案例和品牌活动。实施“同根同心”港澳台语言文化交流工程，开展中华经典诵读港澳展演、中小学教师培训，举办海峡两岸及港澳大学生汉字创意设计大会，建好用好两岸中华语文知识库网站。 （七）深化交流互鉴 建设中华优秀语言文化交流品牌，打造语言文化合作新亮点，促进文明交流互鉴。重点实施中华思想文化术语传播工程，构建集典籍精粹、当代阐释、国际表达于一体的中华思想文化术语阐释体系，服务构建中国话语和中国叙事体系。 加强国际中文教育，持续举办世界中文大会；拓展“汉语桥”“国际中文日”“新汉学计划”“中文水平考试（HSK）”等国际中文教育品牌项目影响力；支持全球中文学习平台、中文联盟建设；支持开展海外华文教育；推动中文在国际组织、经贸往来、科教合作以及民间交往等领域的应用，提升中文在世界现实生活的使用比例。开发汇聚多语种中国故事系列资源，推动更多语言文化精品走出国门，为世界贡献公共文化产品；推进中华文化优秀课程多语种数字化全球传播计划，生动讲述语言文化里的中国；实施中华经典海外传播工程，开展中外青少年研习交流、海外教师研修、外国留学生诵读中华经典等活动；聚焦高质量共建“一带一路”等重大举措，开展国际语言文化交流，传播好中国声音；积极与联合国教科文组织等国际组织合作，主动参与全球语言治理，贡献中国力量。 三、组织实施 加强党对中华优秀语言文化传承发展的领导，把坚持和加强党的领导贯穿各项工作全过程，确保正确政治方向。教育部、国家语委、中央宣传部、中央网信办、文化和旅游部、国家文物局、共青团中央会同有关部门统筹推进全国语言文化传承发展工作，建立多部门协同工作机制和分区域专家指导机制。各地区统筹将语言文化传承发展工作纳入发展规划，制定专项方案，明确任务分工；纳入行业管理、城乡管理和文明城市、文明村镇、文明单位、文明校园建设内容；有机融入学校考核和学生综合素质评价体系。各地区、各学校和各有关单位加大统筹力度，优化资源配置与支出结构，加强工作经费保障，强化社会多元参与。落实《信息技术产品国家通用语言文字使用管理规定》，规范各类新媒体语言文字使用，加强网络语言文字治理，建设健康文明的网络语言环境。加大宣传力度，引导社会抵制不良语言现象，守牢宣传思想文化阵地，营造良好社会风尚。 教育部 国家语委 中央宣传部 中央网信办 文化和旅游部 国家文物局 共青团中央 2025年12月16日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.823Z"},{"slug":"policy-20251203-f0cf5785","title":"国务院关于《长三角国土空间规划（2023—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕111号","publish_date":"2025-12-03","effective_date":"","status":"现行有效","level":"国家级","region":"长三角","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202512/content_7050165.htm","summary":"划定地质灾害、洪涝等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。发挥区域协调发展战略、区域重大战略、主体功能区战略、","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《长三角国土空间规划 （2023—2035年）》的批复 国函〔2025〕111号 自然资源部： 你部关于报请批准《长三角国土空间规划（2023—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部组织起草的《长三角国土空间规划（2023—2035年）》（以下简称《规划》）。《规划》是国家级国土空间专项规划，是长三角空间发展的指南、可持续发展的空间蓝图，是各类开发保护建设活动的基本依据，请认真组织实施。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻落实党的二十大和二十届历次全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，紧扣一体化和高质量这两个关键词，落实长三角一体化发展战略部署，建设世界级城市群，支撑长三角在中国式现代化中走在前列，更好发挥先行探路、引领示范、辐射带动作用。 二、筑牢安全发展的空间基础。到2035年，长三角耕地保有量不低于16148万亩，其中永久基本农田保护面积不低于14290万亩；生态保护红线面积不低于7.7万平方千米；用水总量不超过国家下达指标。明确自然灾害风险重点防控区域，划定地质灾害、洪涝等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。发挥区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略叠加效应，优化重大生产力布局，发挥重点区域增长极作用，构建优势互补、高质量发展的国土空间体系。按照主体功能定位，推动长三角一体化发展，持续优化城镇空间，共同保护生态空间，积极拓展农业空间，深度统筹陆海空间，增强区域整体竞争力和综合承载力，深度融入共建“一带一路”，强化长三角在长江经济带中的引领带动作用，加强与周边省份及区域重大战略地区的协同联动。 四、系统优化国土空间开发保护格局。优化以都市圈为引领的空间格局，支持上海发挥龙头带动作用，加强上海大都市圈与苏锡常都市圈空间融合，以及与南京、杭州、合肥、宁波都市圈空间统筹，支撑世界级城市群建设。强化科技创新和产业创新空间跨区域协同，重点保障长三角G60科创走廊、沿沪宁产业创新带、宁杭生态经济带等空间需求，优化沿江、沿海地区传统产业用地布局，加强传统产业集群向苏北、皖北、安徽沿江等地区有序升级转移的空间保障。推动生态空间跨区域协同，筑牢重要生态屏障和生态廊道，支持长江、大运河国家文化公园建设，推动太湖周边、江淮湖群、黄河故道、浙皖省际毗邻地区彰显国土空间特色魅力，提升文化和自然资源资产价值。优化陆海统筹、江海联动的空间格局，推进沿海地区港航功能、港产城等重要空间的协同布局，合理有序利用深远海空间，释放海洋空间发展潜能。提高国土空间安全韧性，完善粮食应急保供空间布局，统筹流域防洪排涝空间，推动防灾减灾设施协同布局，加强水利、交通、能源、新型信息等基础设施空间保障，促进重要通道设施互联互通。 五、维护规划严肃性权威性。《规划》是对长三角国土空间作出的全局安排，是区域国土空间保护、开发、利用、修复的政策和总纲，是有关地方各级编制实施国土空间规划的重要依据，必须严格执行。要自觉接受国土空间规划的指导约束，不得随意修改、违规变更，对不符合国土空间规划的用地用海、未批先建等违法违规行为要严肃查处。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。上海市、江苏省、浙江省、安徽省人民政府要加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，将《规划》确定的目标指标、重点任务等纳入有关地方各级国土空间规划，加快形成统一的国土空间规划体系，统筹国土空间开发保护。强化对水利、交通、能源、农业、信息、市政等基础设施以及公共服务设施、军事设施、生态环境保护、文物保护、林业草原等专项规划的指导约束，在国土空间规划“一张图”上协调解决矛盾问题，合理优化空间布局。长三角四省市要充分发挥国土空间规划委员会作用，加强对跨省域规划编制实施管理的统筹协调，强化对交界地区市县级国土空间规划的传导要求。按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建立国土空间规划实施监测网络，提高空间治理数字化水平。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年11月30日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.852Z"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第822号","publish_date":"2025-11-21","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202511/content_7049205.htm","summary":"国务院应急管理部门承担。 县级以上地方人民政府根据实际需要建立的森林草原防灭火指挥机构（机制），负责组织、协调、指导、督促本行政区域的森林草原防灭火工作，日常工作由本级人民政府应急管理部门承担。 第五条","themes":["森林草原","灾害防治"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第822号 《森林草原防灭火条例》已经2025年10月31日国务院第71次常务会议通过，现予公布，自2026年1月1日起施行。 总理 李强 2025年11月16日 森林草原防灭火条例 第一章 总 则 第一条 为了有效预防和扑救森林草原火灾，保障人民生命财产安全，保护森林草原资源，维护生态安全，制定本条例。 第二条 本条例适用于中华人民共和国境内森林草原火灾的预防、扑救和灾后处置。城市市区的森林草原防灭火工作按照国家有关规定执行。 第三条 森林草原防灭火工作应当贯彻党和国家路线方针政策、决策部署。 森林草原防灭火工作应当坚持预防为主、积极消灭、生命至上、安全第一的工作方针，坚持协调联动、分级负责、属地为主、科学扑救、快速反应、安全高效的原则。 第四条 国家森林草原防灭火指挥部负责组织、协调、指导、督促全国森林草原防灭火工作，日常工作由国务院应急管理部门承担。 县级以上地方人民政府根据实际需要建立的森林草原防灭火指挥机构（机制），负责组织、协调、指导、督促本行政区域的森林草原防灭火工作，日常工作由本级人民政府应急管理部门承担。 第五条 县级以上人民政府组织领导应急管理、林业草原、公安、消防救援等部门按照职责分工密切配合做好森林草原防灭火工作。 县级以上人民政府其他有关部门按照职责分工，负责相应的森林草原防灭火工作。 第六条 地方各级人民政府负责本行政区域的森林草原防灭火工作，实行地方人民政府行政首长负责制。 第七条 森林草原防灭火工作涉及两个以上行政区域的，有关地方人民政府应当确定联防区域，制定联防制度，建立联防机制。 第八条 县级以上地方人民政府应当将森林草原防灭火基础设施建设纳入国民经济和社会发展有关规划，将森林草原防灭火经费纳入本级预算。 第九条 国家鼓励和支持森林草原防灭火科学研究、技术创新和装备研发，加强森林草原防灭火人才培养，推广和应用先进的科学技术、装备，制定和完善森林草原防灭火标准，提高森林草原防灭火科技、装备、标准化水平和监测预警能力。 第十条 国务院有关部门和县级以上地方人民政府应当提升森林草原防灭火工作信息化、智能化水平，整合、完善火灾监测预警、预防管理、指挥通信等系统，通过信息技术深度应用，实现信息共享、互联互通。 第十一条 各级人民政府及其有关部门应当加强森林草原防灭火宣传教育，组织经常性的森林草原防灭火宣传活动，普及森林草原防灭火知识，提高公民的森林草原防火意识和安全意识，为森林草原防灭火工作营造良好社会氛围。 第十二条 国家鼓励通过保险等形式分散森林草原火灾风险，提高林业和草原防灾减灾能力和灾后恢复重建能力。 第十三条 对在森林草原防灭火工作中作出突出贡献的单位和个人，按照国家有关规定给予表彰和奖励。 第二章 森林草原火灾的预防 第十四条 国务院林业草原主管部门应当制定森林草原火险区划等级标准。省级人民政府林业草原主管部门应当按照森林草原火险区划等级标准，以县为单位确定本行政区域的森林草原火险区划等级，报本级森林草原防灭火指挥机构（机制）和国务院林业草原主管部门备案，并及时向社会公布。 第十五条 国务院林业草原主管部门会同国务院应急管理部门等有关部门，在充分衔接相关规划的基础上，根据全国森林草原火险区划等级和实际工作需要，编制全国森林草原火灾防治方案，报国务院或者国务院授权的部门批准后组织实施。 县级以上地方人民政府林业草原主管部门会同同级应急管理部门等有关部门，根据全国森林草原火灾防治方案，结合本地实际，编制本行政区域的森林草原火灾防治方案，报本级人民政府批准后组织实施。 第十六条 国务院应急管理部门会同国务院林业草原主管部门等有关部门按照有关规定编制国家森林草原火灾应急预案，报国务院批准。 县级以上地方人民政府应急管理部门会同同级林业草原主管部门等有关部门按照有关规定编制森林草原火灾应急预案，报本级人民政府批准，并报上一级人民政府应急管理部门备案。 县级人民政府应当组织乡级人民政府、街道办事处根据森林草原火灾应急预案制定森林草原火灾应急处置方案；居民委员会、村民委员会应当按照森林草原火灾应急预案和森林草原火灾应急处置方案的规定，协助做好森林草原火灾应急处置工作。 县级以上人民政府及其有关部门应当定期组织开展森林草原火灾应急预案的演练。 第十七条 森林草原火灾应急预案应当包括下列内容： （一）主要任务； （二）组织指挥体系； （三）处置力量； （四）预警和信息报告； （五）应急响应； （六）综合保障； （七）后期处置。 第十八条 国家综合性消防救援队伍承担国家规定的森林草原火灾扑救以及预防相关工作。 地方森林草原消防队伍由县级以上地方人民政府或者规模较大的森林、林木、林地、草原经营单位根据实际需要建立，相关人员应当取得国家规定的职业资格，具体办法由国务院应急管理部门、林业草原主管部门会同有关部门制定。 地方半专业（兼职）森林草原消防队伍由乡级人民政府、街道办事处和森林、林木、林地、草原经营单位根据实际需要建立。 国家引导和规范社会力量有序参与森林草原防灭火工作。 县级以上人民政府按照规定及时调配力量开展森林草原防灭火工作。 第十九条 各类森林草原防灭火队伍应当建立防灭火安全制度，按照有关标准配备个人防护装备，定期进行培训和演练，并组织扑救安全教育和安全避险演练，建立联防联训联战机制，加强衔接配合。 第二十条 森林、林木、林地、草原经营单位和个人在其经营区域内承担森林草原防灭火责任，应当建立森林草原防灭火责任制，划定森林草原防灭火责任区，确定森林草原防灭火责任人，并配备森林草原防灭火设施设备，定期排查并及时消除火灾隐患。 第二十一条 承担电力、通信线路和石油天然气管道的森林草原防灭火责任的经营单位，应当在森林草原火灾危险地段和危险时段，采取相应防灭火措施，排查和消除火灾隐患，并组织开展防火巡护。 铁路、公路的经营管理单位应当负责本单位经营管理的林地、草原的防灭火工作，并配合县级以上地方人民政府做好铁路、公路沿线森林草原火灾危险地段和危险时段的防灭火工作。 农牧场、工矿等企业事业单位以及旅游区、开发区经营管理机构，应当负责其经营管理区域内的森林草原防灭火工作，并配合有关单位做好周边地区的防灭火工作。 第二十二条 专职或者兼职护林员、草管员负责巡护森林草原，发现火情应当及时处理并按照有关规定报告，做好防火宣传，并协助有关部门调查森林草原火灾案件。 第二十三条 国务院有关部门和县级以上地方人民政府应当按照国家有关规定，加强防火道、隔离带、通信基站、应急广播、瞭望塔、应急水源（储水）等基础设施建设，推动防灭火装备转型升级，建立健全森林草原防灭火物资储备保障体系，及时补充更新防灭火物资。 第二十四条 国务院和省级人民政府应当根据森林草原防灭火实际需要，开展航空消防建设，充分利用卫星遥感技术和现有军用、民用航空基础设施，建立相关单位参与的森林草原防灭火航空协作机制。 第二十五条 县级以上地方人民政府应当根据本行政区域内森林草原资源分布状况和森林草原火灾发生规律，划定森林草原防火区，规定森林草原防火期，并向社会公布。 防火期内，县级以上地方人民政府及其有关部门和森林、林木、林地、草原经营单位和个人，应当根据森林草原火险气象等级预报和预警信息，在防火区内采取相应的火灾预防和应急准备措施。 第二十六条 在防火区内开办农牧场、工矿等企业事业单位，设立旅游区或者新建开发区的，其森林草原防灭火设施应当与该建设项目同步规划、同步设计、同步施工、同步验收；在林区成片造林、在天然草原成片种草的，应当同时配套建设森林草原防灭火设施。森林草原防灭火设施应当由建设单位负责组织验收，验收合格后方可投入使用。县级以上地方人民政府有关部门应当加强对建设单位验收活动和验收结果的监督核查。 森林草原防灭火设施验收标准由省级人民政府组织有关部门制定。 第二十七条 防火期内，禁止在防火区内野外用火。因防治病虫鼠害、冻害等特殊情况确需野外用火的，应当经县级人民政府批准，并按照要求采取防火措施，严防失火；需要在防火区内进行非军事实弹演习、爆破等活动的，应当经县级以上地方人民政府批准，并采取必要的防火措施。 防火期内，中国人民解放军、中国人民武装警察部队和民兵组织进入防火区进行实弹演习、爆破等活动，处置突发事件和执行其他紧急任务的，应当事前采取必要的防火措施，并通报县级以上地方人民政府。 任何人不得在防火区内丢弃火种。 第二十八条 防火期内，森林、林木、林地、草原经营单位和个人应当在防火区内设置防火警示宣传标志或者设备，并向进入其经营区域的人员告知防火注意事项。 防火期内，进入防火区的各种机动车辆和机械设备应当按照规定安装防火装置、配备灭火器材。在防火区内野外作业的机械设备，应当采取防火措施；作业人员应当遵守防火安全操作规程，防止失火。 第二十九条 防火期内，县级以上地方人民政府林业草原主管部门、国务院确定的重点国有林区的管理机构可以设立临时性的防火检查站，结合实际对进入防火区的车辆和人员进行防火登记、检查，开展针对性防灭火宣传教育。 第三十条 防火期内，预报有高温、干旱、大风等高火险天气的，县级以上地方人民政府应当在防火区内划定森林草原高火险区，规定森林草原高火险期。高火险期内，必要时县级以上地方人民政府可以发布命令，严禁一切野外用火；对可能引起森林草原火灾的居民生活用火应当严格管理。 第三十一条 高火险期内进入高火险区的，应当经县级以上地方人民政府批准，严格按照批准的时间、地点、范围活动，并接受县级以上地方人民政府林业草原主管部门和同级相关部门的监督管理。 第三十二条 国家建立森林草原火险分级预警制度，按照森林草原火险的紧急程度、发展势态和可能造成的危害程度分为一级、二级、三级和四级，分别用红色、橙色、黄色和蓝色标示，一级为最高级别。 县级以上人民政府应急管理部门应当会同同级林业草原主管部门、气象主管机构等，加强森林草原火险监测预警技术研究，综合运用现代化火灾感知方式和多渠道信息加强火险监测预警，建立联合会商机制，及时制作发布森林草原火险预警信息。 气象主管机构应当加强森林草原火险气象等级预报能力建设，依法提供森林草原火险气象等级预报服务。广播、电视、报刊以及网络服务提供者、电信运营商应当及时、准确、无偿播发或者刊载森林草原火险气象等级预报和预警信息。 森林草原火险预警信息发布后，县级以上地方人民政府应当根据预警级别依法采取相应措施。 第三十三条 县级以上人民政府应急管理部门、林业草原主管部门等有关部门应当按照职责分工对防火区内有关单位的森林草原防灭火组织建设、责任制落实、设施建设等情况进行检查。必要时，县级以上人民政府可以组织相关部门联合检查。检查中发现森林草原火灾隐患，应当及时下达森林草原火灾隐患整改通知书，责令限期消除隐患。被检查单位应当积极配合，不得阻挠、妨碍检查活动。 第三章 森林草原火灾的扑救 第三十四条 县级以上地方人民政府应当公布森林草原火警电话等报警方式，建立森林草原防灭火值班制度。任何人发现森林草原火情，应当立即报警。 森林、林木、林地、草原经营单位和个人对其经营区域内发生的火情，应当立即向当地人民政府或者森林草原防灭火指挥机构（机制）报告并采取有效处置措施。 接到报警、报告的当地人民政府或者森林草原防灭火指挥机构（机制）应当立即派人赶赴现场调查核实，采取相应的处置措施，并按照有关规定逐级报告上级人民政府和森林草原防灭火指挥机构（机制），必要时可以越级上报。具备条件的，应当进行网络直报或者自动速报。 第三十五条 发生下列森林草原火情，省级人民政府森林草原防灭火指挥机构（机制）应当立即报告国家森林草原防灭火指挥部，由国家森林草原防灭火指挥部按照规定报告国务院，并及时通报国务院有关部门和军队有关单位： （一）过火森林面积超过100公顷的森林火情，或者过火草原面积超过5000公顷的草原火情； （二）造成3人以上死亡或者10人以上重伤的森林草原火情； （三）威胁居民区或者重要设施的森林草原火情； （四）火场距国界或者实际控制线5公里以内，并对我国或者相邻国家和地区森林草原资源构成威胁的森林草原火情； （五）经研判需要报告的其他森林草原火情。 省级人民政府直接向国务院报告的森林草原火情信息，应当同时抄送国家森林草原防灭火指挥部，国家森林草原防灭火指挥部根据需要及时通报有关单位。 第三十六条 接到火情报告后，地方各级人民政府应当立即按照应急预案开展处置工作。 国家森林草原防灭火指挥部根据森林草原火灾应对工作需要，适时启动应急响应，组织应急处置。 第三十七条 发生森林草原火灾，县级以上人民政府有关部门和单位在本级人民政府的统一领导下，按照本级森林草原火灾应急预案分工，履行扑救职责。 第三十八条 扑救森林草原火灾应当根据需要及时设立火场前线指挥部，设立时机、级别、规模等由县级以上地方人民政府确定。火场前线指挥部由县级以上地方人民政府负责人担任总指挥，同时应当设置专业指挥。各类参与火灾扑救的救援力量应当接受火场前线指挥部的统一指挥。 火场前线指挥部应当在核实火灾准确位置、范围以及风力、风向、火势的基础上，根据火灾现场天气、地理等条件，合理确定扑救方案、划分扑救地段、确定扑救责任人，科学防范和处置险情。军事设施、核设施、危险化学品生产储存设施设备、油气管道、铁路线路等重要目标物和重大危险源受到火灾威胁时，应当在专业人员指导下消除威胁、科学施救。 第三十九条 扑救森林草原火灾，应当及时解救、疏散、撤离受火灾威胁的群众，并做好火灾扑救人员的管理和安全防护，保障扑救人员安全，尽最大可能避免人员伤亡。 扑救森林草原火灾，应当以各类森林草原防灭火队伍为主，必要时可以组织干部群众协助扑救，但不得安排未经相关专业培训的人员直接灭火，不得动员残疾人、孕妇和未成年人以及其他不适宜的人员参加灭火。 第四十条 扑救森林草原火灾时，有关地方人民政府应当立即就地就近组织地方森林草原消防队伍、国家综合性消防救援队伍等力量参与扑救。 在执行森林草原防灭火任务时，国家综合性消防救援队伍力量调动按照有关规定执行。国家综合性消防救援队伍执行森林草原火灾扑救任务时，其现场最高指挥员进入火场前线指挥部，负责专业指挥工作，参与决策和组织现场指挥。 第四十一条 因扑救森林草原火灾需要，县级以上人民政府可以决定采取开设防火隔离带、清除障碍物、应急取水、局部交通管制等应急措施。 第四十二条 国家实行森林草原火灾信息统一发布制度。森林草原火灾信息由县级以上人民政府应急管理部门向社会发布。特别重大、重大森林草原火灾信息，由省级人民政府发布，必要时由国家森林草原防灭火指挥部或者国务院应急管理部门发布。 县级以上人民政府应急管理部门应当通过多种方式及时、准确向社会发布森林草原火灾和应对工作情况，回应社会关切。任何单位和个人不得编造、故意传播有关森林草原火灾和火灾应对等的虚假信息。 第四十三条 森林草原火灾明火扑灭后，扑救队伍应当对火灾现场进行全面检查，清理余火。当地人民政府应当组织足够人员看守火场，按照规定经检查验收合格后，方可撤出看守人员。 第四十四条 县级以上人民政府应当建立工作机制，因扑救森林草原火灾需要，可以征用场地、物资、设备和交通运输工具等。灭火工作结束后，应当及时返还，并依法给予公平、合理的补偿。 第四章 灾后处置 第四十五条 根据受害森林草原面积和伤亡人数，森林草原火灾分为一般、较大、重大和特别重大四个等级。 森林火灾分为： （一）一般森林火灾：受害森林面积0.067公顷以上10公顷以下的，或者死亡1人以上3人以下的，或者重伤1人以上10人以下的； （二）较大森林火灾：受害森林面积10公顷以上100公顷以下的，或者死亡3人以上10人以下的，或者重伤10人以上50人以下的； （三）重大森林火灾：受害森林面积100公顷以上1000公顷以下的，或者死亡10人以上30人以下的，或者重伤50人以上100人以下的； （四）特别重大森林火灾：受害森林面积1000公顷以上的，或者死亡30人以上的，或者重伤100人以上的。 草原火灾分为： （一）一般草原火灾：受害草原面积10公顷以上1000公顷以下的，或者死亡1人以上3人以下的，或者重伤1人以上10人以下的； （二）较大草原火灾：受害草原面积1000公顷以上5000公顷以下的，或者死亡3人以上10人以下的，或者重伤10人以上50人以下的； （三）重大草原火灾：受害草原面积5000公顷以上8000公顷以下的，或者死亡10人以上30人以下的，或者重伤50人以上100人以下的； （四）特别重大草原火灾：受害草原面积8000公顷以上的，或者死亡30人以上的，或者重伤100人以上的。 本条所称“以上”包括本数，“以下”不包括本数。 第四十六条 县级以上人民政府应当组织有关部门及时对森林草原火灾发生原因、受害面积和蓄积、人员伤亡、其他经济损失、生态环境影响以及应急救援处置等情况进行调查评估，并形成调查评估报告。森林草原火灾有责任单位、责任人的，当地人民政府应当根据调查评估报告确定火灾责任单位、责任人，并依法处理。 森林草原火灾调查评估工作按照国家有关规定执行。森林草原火灾损失评估标准，由国务院林业草原主管部门会同有关部门制定。 第四十七条 森林草原火灾等级根据调查评估报告确定，发生在灌木林地、疏林地、未成林造林地、苗圃地等林地起火未造成林木受害，或者受害森林面积不足0.067公顷，或者受害草原面积不足10公顷，并且未造成人员死亡、重伤的，不统计为火灾。 县级以上地方人民政府森林草原防灭火指挥机构（机制）应当按照国家有关规定对森林草原火灾情况进行统计，报上级人民政府森林草原防灭火指挥机构（机制）和本级人民政府统计机构，并及时通报本级人民政府有关部门。 森林草原火灾统计调查项目和统计调查制度由国务院应急管理部门会同有关部门依法制定。 第四十八条 对因扑救森林草原火灾负伤、致残或者死亡的人员，按照国家有关规定给予医疗救治、抚恤优待；符合烈士评定条件的，按照国家有关规定评定为烈士。 参加森林草原火灾扑救的人员按照国家有关规定享受人身保险等相应保险待遇。 用人单位应当保证其职工在参加森林草原火灾扑救期间的工资待遇和福利不变。 第四十九条 参加森林草原火灾扑救的人员的有关补贴补助以及扑救森林草原火灾所发生的其他费用，按照省级人民政府规定的标准，由火灾责任单位或者责任人支付；起火原因不清的，由起火单位支付；以上费用可以由当地人民政府先行垫付。 第五十条 森林草原火灾发生后，森林、林木、林地、草原经营单位和个人应当及时采取更新造林等措施，恢复火烧迹地森林植被和林业、牧业生产条件，当地人民政府应当为森林草原资源的灾后恢复提供必要支持。 第五章 法律责任 第五十一条 违反本条例规定，地方各级人民政府，县级以上地方人民政府应急管理部门、林业草原主管部门或者其他有关部门及其工作人员，有下列行为之一的，由其上级行政机关责令改正；情节严重的，对负有责任的领导人员和直接责任人员依法给予处分： （一）未按照有关规定编制森林草原火灾应急预案，或者未定期组织开展森林草原火灾应急预案的演练； （二）发现森林草原火灾隐患未及时下达森林草原火灾隐患整改通知书； （三）对不符合森林草原防灭火要求的野外用火予以批准，或者对不符合森林草原防灭火要求的非军事实弹演习、爆破等活动予以批准； （四）瞒报、谎报或者故意拖延报告森林草原火情； （五）在预警信息发布后未依法采取相应措施； （六）未及时采取相应的处置措施或者处置不力； （七）在森林草原火灾调查评估中弄虚作假； （八）不依法履行职责的其他行为。 第五十二条 违反本条例规定，森林、林木、林地、草原经营单位或者个人未履行森林草原防灭火责任的，由县级以上地方人民政府林业草原主管部门、应急管理部门按照职责分工责令改正，对单位处2万元以上10万元以下罚款，对个人处1000元以上1万元以下罚款；拒不改正的，对单位处5万元以上20万元以下罚款，对个人处2000元以上2万元以下罚款。 第五十三条 违反本条例规定，防火区内的有关单位或者个人拒绝接受森林草原防灭火检查，或者接到森林草原火灾隐患整改通知书逾期不消除火灾隐患的，由县级以上地方人民政府林业草原主管部门、应急管理部门按照职责分工责令改正，对单位处1万元以上2万元以下罚款，对个人处300元以上3000元以下罚款。 第五十四条 违反本条例规定，防火期内未经批准擅自在防火区内野外用火的，由县级以上地方人民政府林业草原主管部门责令停止违法行为，对单位处2万元以上10万元以下罚款，对个人处300元以上5000元以下罚款。 第五十五条 违反本条例规定，防火期内未经批准在防火区内进行非军事实弹演习、爆破等活动的，由县级以上地方人民政府林业草原主管部门责令停止违法行为，处10万元以上20万元以下罚款。 第五十六条 违反本条例规定，有下列行为之一的，由县级以上地方人民政府林业草原主管部门责令改正，对单位处5000元以上2万元以下罚款，对个人处300元以上3000元以下罚款： （一）防火期内，森林、林木、林地、草原经营单位和个人未在防火区内设置防火警示宣传标志或者设备，或者经批准的野外用火未按照要求采取防火措施； （二）防火期内，进入防火区的机动车辆和机械设备未按照规定安装防火装置、配备灭火器材； （三）防火期内，在防火区内野外作业的机械设备未采取防火措施或者从事野外作业的机械设备作业人员不遵守防火安全操作规程； （四）进入防火区的车辆和人员拒绝接受防火登记、检查； （五）高火险期内，未经批准擅自进入高火险区活动或者未严格按照批准的时间、地点、范围活动； （六）在防火区内丢弃火种； （七）破坏森林草原防灭火设施设备； （八）在防火区内开办农牧场、工矿等企业事业单位，设立旅游区，新建开发区，或者在林区成片造林、在天然草原成片种草未同时配套建设森林草原防灭火设施，或者新建设森林草原防灭火设施未经验收合格投入使用。 第五十七条 编造并传播有关森林草原火灾和火灾应对等的虚假信息，或者明知是虚假信息而进行传播的，依法予以处罚。 第五十八条 森林草原火灾有责任单位和责任人的，县级以上人民政府林业草原主管部门可以责令其补种树木、恢复植被。 第五十九条 违反本条例规定，构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第六章 附 则 第六十条 森林草原消防车辆按照国家规定享受应急救援车辆相关政策，涉及车辆编制核定和配备的，按照党政机关特种专业技术用车有关规定办理。 森林草原消防车辆应当按照规定喷涂标志图案，安装报警器、标志灯具。 第六十一条 在中华人民共和国边境地区发生的森林草原火灾，按照中华人民共和国政府与有关国家政府签订的有关协定或者部门间合作机制开展扑救工作；没有协定或者机制的，由中华人民共和国政府和有关国家政府协商办理。 第六十二条 对设在林牧区的军事设施、军工设施的森林草原防灭火工作，以及军事区域森林草原防灭火基础设施建设、设施设备配备工作，军事法规、规章另有规定的，从其规定。 中国人民解放军、中国人民武装警察部队和民兵组织执行森林草原火灾扑救任务的，依照有关法律法规的规定执行。 第六十三条 本条例自2026年1月1日起施行。《森林防火条例》和《草原防火条例》同时废止。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"},{"slug":"regulation-20251011-430d7532","title":"密云水库水源保护条例","publish_date":"2025-10-11"}],"updated_at":"2026-11-16T09:21:19.869Z"},{"slug":"policy-20251106-0aa71698","title":"国务院关于《成渝地区双城经济圈国土空间规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕106号","publish_date":"2025-11-06","effective_date":"","status":"现行有效","level":"国家级","region":"成渝","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202511/content_7047287.htm","summary":"划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。发挥区域协调发展战略、区域重大战略、主体","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《成渝地区双城经济圈国土空间规划 （2021—2035年）》的批复 国函〔2025〕106号 重庆市、四川省人民政府，自然资源部： 你们关于报请批准《成渝地区双城经济圈国土空间规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《成渝地区双城经济圈国土空间规划（2021—2035年）》（以下简称《规划》）。《规划》是国家级国土空间专项规划，是成渝地区双城经济圈空间发展的指南、可持续发展的空间蓝图，是各类开发保护建设活动的基本依据，请认真组织实施。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻落实党的二十大和二十届历次全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，不断优化国土空间开发保护格局，支撑成渝地区双城经济圈建设成为具有全国影响力的重要经济中心、科技创新中心、改革开放新高地、高品质生活宜居地，更好发挥全国高质量发展的重要增长极和新的动力源作用。 二、筑牢安全发展的空间基础。到2035年，成渝地区双城经济圈耕地保有量不低于7417.58万亩，其中永久基本农田保护面积不低于6327.78万亩；生态保护红线面积不低于1.58万平方千米；城镇开发边界扩展倍数控制在基于2020年城镇建设用地规模的1.32倍以内；用水总量不超过国家下达指标。明确自然灾害风险重点防控区域，划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。发挥区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略叠加效应，优化重大生产力布局，发挥重点区域增长极作用，构建优势互补、高质量发展的国土空间体系。按照主体功能定位，深化成渝地区协同发展，增强区域整体竞争力和综合承载力，推动西部陆海新通道建设，深度融入共建“一带一路”，支撑新时代西部大开发，加强与京津冀、长江经济带、粤港澳大湾区、长三角地区等区域重大战略地区的协同联动。 四、系统优化国土空间开发保护格局。统筹布局农业、生态、城镇等功能空间，更好发挥优势地区示范引领作用，推动成渝地区双城经济圈高质量一体化发展。打造新时代更高水平的“天府粮仓”，加强对四川盆地集中连片优质耕地的重点保护。共保“巴山蜀水”生态空间，加强对四川盆地周边岷山—邛崃山—凉山、米仓山—大巴山、武陵山、大娄山等重点生态区的全面保护，统筹跨区域生态系统治理与修复，筑牢长江上游生态屏障。加快推动现代化城市群和都市圈建设，优化城镇和产业创新空间布局，提升重庆、成都中心城市综合能级和国际竞争力，培育发展重庆、成都现代化都市圈，促进融合发展，形成特色鲜明、布局合理、集约高效的城市群发展格局。建设区域一体化的现代基础设施网络，强化成渝地区门户枢纽功能，合力建设世界级机场群和轨道上的双城经济圈，形成国际性综合交通枢纽集群。增强对地震、地质灾害等自然灾害的应对能力，强化应对气候变化和极端天气的防灾减灾救灾基础设施，统筹布局区域性防灾减灾设施，全面提升国土空间韧性。彰显巴蜀文化的丰富内涵和时代价值，构建文化资源、自然资源、景观资源整体保护的空间体系，凸显成渝地区多元独特的自然和文化景观魅力。 五、维护规划严肃性权威性。《规划》是对成渝地区双城经济圈国土空间作出的全局安排，是区域国土空间保护、开发、利用、修复的政策和总纲，是有关地方各级编制实施国土空间规划的重要依据，必须严格执行。要自觉接受国土空间规划的指导约束，不得随意修改、违规变更，对不符合国土空间规划的用地、未批先建等违法违规行为要严肃查处。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。重庆市、四川省人民政府要加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，将《规划》确定的目标指标、重点任务等纳入有关地方各级国土空间规划，加快形成统一的国土空间规划体系，统筹国土空间开发保护。强化对水利、交通、能源、农业、信息、市政等基础设施以及公共服务设施、军事设施、生态环境保护、文物保护、林业草原等专项规划的指导约束，在国土空间规划“一张图”上协调解决矛盾问题，合理优化空间布局。重庆市、四川省要充分发挥国土空间规划委员会作用，加强对跨省域规划编制实施管理的统筹协调，强化对交界地区市县级国土空间规划的传导要求。按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建立国土空间规划实施监测网络，提高空间治理数字化水平。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年11月1日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.886Z"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第820号","publish_date":"2025-11-06","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202511/content_7047289.htm","summary":"经济社会高质量发展中的重要作用，根据有关法律，制定本条例。 第二条　在中华人民共和国领域及管辖的其他海域开展生态环境监测及其相关活动，适用本条例。法律、行政法规另有规定的，依照其规定。 本条例所称","themes":["生态环境","监测"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第820号 《生态环境监测条例》已经2025年10月17日国务院第70次常务会议通过，现予公布，自2026年1月1日起施行。 总理 李强 2025年10月31日 生态环境监测条例 第一章 总 则 第一条 为了规范生态环境监测活动，提升生态环境监测能力和水平，保障生态环境监测数据质量，更好发挥生态环境监测在支撑生态文明和美丽中国建设、服务经济社会高质量发展中的重要作用，根据有关法律，制定本条例。 第二条 在中华人民共和国领域及管辖的其他海域开展生态环境监测及其相关活动，适用本条例。法律、行政法规另有规定的，依照其规定。 本条例所称生态环境监测，包括政府及其有关部门为履行生态环境保护等职责开展或者组织开展的生态环境监测（以下统称公共监测），以及负有法定监测义务的企业事业单位和其他生产经营者（以下统称企事业单位）就其相关活动对生态环境的影响开展的自行监测。 第三条 生态环境监测工作应当贯彻党和国家路线方针政策、决策部署，坚持依法监测、科学监测、诚信监测，构建政府主导、部门协同、企事业单位履责、社会参与、公众监督的机制。 第四条 国家建立健全生态环境监测制度，完善生态环境监测规范和标准。开展生态环境监测应当遵守生态环境监测规范和标准。 第五条 国家加强生态环境监测能力建设，加快建立现代化生态环境监测体系，构建陆海统筹、天地一体、上下协同、信息共享的生态环境监测网络，全面提升生态环境监测的自动化、数字化、智能化水平。 第六条 县级以上人民政府应当加强对生态环境监测工作的组织领导和支持保障，统筹协调解决生态环境监测工作中的重大问题，按照财政事权和支出责任划分原则将开展生态环境监测工作所需经费列入本级预算。 第七条 国务院生态环境主管部门在其职责范围内负责全国的生态环境监测工作。国务院自然资源、住房和城乡建设、交通运输、水行政、农业农村、气象、林业草原、疾病预防控制等有关部门按照职责分工，负责生态环境监测有关工作。 地方人民政府生态环境主管部门在其职责范围内负责本行政区域内生态环境监测工作。地方人民政府有关部门按照职责分工，负责本行政区域内生态环境监测有关工作。 第八条 地方各级人民政府应当建立健全防范和惩治生态环境监测数据弄虚作假的责任体系和工作机制，确保生态环境监测数据真实、准确、全面。 第九条 国家鼓励、支持生态环境监测先进技术和装备的研究、开发和应用，加大生态环境监测专业人才培养力度，促进生态环境监测国际交流合作。 国家建立健全生态环境监测数据汇交制度和集成共享机制，鼓励、支持生态环境监测数据深度开发和应用。 第二章 公共监测 第十条 地方各级人民政府、县级以上人民政府有关部门应当认真履行生态环境监测职责，依照法律、法规规定以及生态环境保护工作需要，开展或者组织开展生态环境质量监测、生态环境监督监测、突发生态环境事件应急监测等公共监测。 第十一条 国务院生态环境主管部门会同国务院有关部门组织国家生态环境监测网络。设区的市级以上地方人民政府生态环境主管部门会同同级有关部门组织本行政区域内地方生态环境监测网络。 组织生态环境监测网络，应当坚持布局合理、功能完善、分级分类、共建共享的原则，推进国家生态环境监测网络和地方生态环境监测网络互联互通。 第十二条 国务院生态环境主管部门会同国务院有关部门统一规划国家生态环境质量监测站点设置。省、自治区、直辖市人民政府生态环境主管部门会同同级有关部门统一规划本行政区域内地方生态环境质量监测站点设置。设置、调整和撤销地方生态环境质量监测站点，应当报国务院生态环境主管部门或者国务院有关部门备案。 生态环境质量监测站点设置应当符合生态环境监测规范的要求，避免重复建设。 第十三条 生态环境主管部门、其他有关部门应当按照职责分工，加强对生态环境质量监测站点的管理，保证生态环境质量监测站点正常运行。 地方各级人民政府应当依法为生态环境质量监测站点的建设、运行提供保障，并采取措施加强对生态环境质量监测站点的保护。 任何单位和个人不得侵占、损毁生态环境质量监测站点及其设施、设备，不得干扰生态环境质量监测站点正常运行。 第十四条 国务院生态环境主管部门会同国务院有关部门组织开展重点区域、流域、海域生态环境质量监测，为推动区域协调发展、科学实施生态保护补偿、优化产业布局等提供支撑。 县级以上地方人民政府及其有关部门可以根据实际需要，联合组织开展跨行政区域的生态环境质量监测，推动监测信息共享、监测数据互认。 第十五条 国务院生态环境主管部门和省、自治区、直辖市人民政府生态环境主管部门按照有关规定统一发布生态环境质量监测信息，定期发布生态环境状况公报。 任何单位和个人不得违法发布生态环境质量监测信息。 第十六条 生态环境主管部门、其他有关部门应当按照职责分工，依法加强对各类污染源（包括移动污染源）等的监督监测，并根据监测结果向有关单位或者个人提出相关建议、要求或者作出处理决定。 鼓励在生态环境监督监测中使用遥感监测等非接触式技术手段，提升监测效率，减少对正常生产经营活动等的影响。 第十七条 生态环境主管部门、其他有关部门应当加强对生态环境风险的监测预警，提升生态环境风险预警能力；发现可能危害生态环境安全或者公众健康情形的，县级以上人民政府应当依法及时发布预警信息。 第十八条 县级以上人民政府应当建立健全突发生态环境事件应急监测管理体系，将突发生态环境事件应急监测纳入相应的应急预案，提高突发生态环境事件应急监测响应能力。 突发生态环境事件发生后，生态环境主管部门和其他有关部门应当根据应急处置工作统一部署开展应急监测。突发生态环境事件应急处置工作结束后，有关人民政府应当立即组织评估事件造成的环境影响和损失，并及时将评估结果向社会公布。 第十九条 地方各级人民政府、县级以上人民政府有关部门工作人员不得以任何方式对公共监测数据弄虚作假或者明示、暗示有关单位、个人对公共监测数据弄虚作假，不得对依法履行职责或者拒绝、抵制监测违法行为的单位、个人打击报复。 第三章 自行监测 第二十条 企事业单位对其生产经营等活动中污染物、温室气体等的排放情况以及建设项目、突发生态环境事件等对生态环境的影响，依照法律、法规规定开展自行监测。 第二十一条 开展自行监测应当按照生态环境监测有关规范和标准制定监测方案，明确监测点位设置、监测指标、监测频次、监测方式等。 自行监测的主要监测点位应当按照规定安装、使用可以获取监测活动过程和监测设备运行情况的视频监控设备，并与生态环境主管部门或者其他有关部门联网。 第二十二条 开展自行监测应当使用符合国家标准和规范的监测设备，并对监测设备进行经常性维护、保养和定期检定、校准，保证监测设备正常运行。 第二十三条 依照法律、法规规定应当安装、使用自动监测设备的企事业单位，其自动监测设备应当与生态环境主管部门联网。 企事业单位发现自动监测设备传输数据异常的，应当及时报告生态环境主管部门，并对自动监测设备进行检查、修复。 第二十四条 采用手工监测方式开展自行监测的，应当如实记录手工监测期间的生产负荷、污染防治设施运行情况等工况，确保监测数据具有代表性。 第二十五条 企事业单位应当建立健全监测数据质量管理制度。企事业单位及其负责人对监测数据的真实性、准确性负责。 企事业单位不得实施或者明示、暗示有关单位、个人实施下列对监测数据弄虚作假的行为： （一）未实际开展监测，直接出具监测报告； （二）篡改、伪造原始监测记录、监测数据； （三）故意漏检监测项目或者改变监测条件； （四）调换监测样品或者擅自改变采样点位、时间等，干扰采样环境或者采样活动； （五）通过不正常运行、破坏监测设备，擅自修改监测设备参数设置，虚假标记自动监测设备状况或者生产设施、污染防治设施工况，或者使用作弊工具等手段，使监测数据失真； （六）其他对监测数据弄虚作假的行为。 第二十六条 企事业单位应当依照法律、法规规定的期限保存自行监测的原始监测记录；法律、法规没有规定保存期限的，原始监测记录至少保存5年。 企事业单位应当依法公开自行监测相关信息，接受社会监督。 第四章 技术服务机构 第二十七条 政府及其有关部门、企事业单位可以委托依法设立的技术服务机构开展生态环境监测相关服务（以下简称监测服务）。 第二十八条 开展监测服务的技术服务机构应当具备相应的设施设备、技术能力、技术人员和管理能力，并按照规定向生态环境主管部门备案。其中从事检验检测活动的，应当依法取得检验检测机构资质认定。 技术服务机构办理备案，应当向生态环境主管部门提交书面承诺，书面承诺应当包括其设施设备、技术能力、技术人员、管理能力方面的信息，技术服务机构对信息的真实性负责。 生态环境主管部门应当将备案的技术服务机构及其书面承诺、业务范围等向社会公布，并提供备案信息查询服务。 技术服务机构具体管理办法由国务院生态环境主管部门会同国务院有关部门制定。 第二十九条 技术服务机构不得超出其业务范围接受委托，不得违反约定将受托业务转委托。 技术服务机构应当独立、客观、公正开展监测服务，不得同时接受可能存在利益冲突的委托。 第三十条 技术服务机构接受委托开展监测服务，应当遵守生态环境监测规范和标准。 委托单位及其有关人员应当配合技术服务机构开展监测服务，并提供必要的便利和条件。 委托单位应当按规定对技术服务机构监测服务活动加强监督。 第三十一条 技术服务机构接受委托开展生态环境监测设备运行维护，应当建立运行维护记录制度；对发现的影响生态环境监测设备正常运行的问题，应当及时处理，不得隐瞒。 第三十二条 接受委托开展监测服务的技术服务机构应当建立监测数据质量管理制度，不得以任何方式对监测数据弄虚作假。 本条例第二十五条的规定，适用于接受委托开展监测服务的技术服务机构。 技术服务机构及其负责人对技术服务机构出具的监测数据的真实性、准确性负责。 第三十三条 接受委托开展监测服务的技术服务机构应当按照规定保存其开展业务的相关数据、报告、记录以及委托合同等材料，保证业务活动全过程可追溯。 第五章 监督管理 第三十四条 国务院生态环境主管部门推动通过生态环境监测管理服务平台开展监测数据报送、技术服务机构备案、相关信息公布等管理与服务，并与国务院有关部门建立信息共享机制。 第三十五条 生态环境主管部门、其他有关部门应当按照职责分工，加强对生态环境监测活动的监督检查。生态环境主管部门、其他有关部门应当加强协调配合，能够联合检查的实行联合检查，鼓励通过非现场检查、使用非接触式技术手段开展监督检查。 生态环境主管部门、其他有关部门根据需要对企事业单位、技术服务机构及相关场所等进行现场检查的，可以要求有关单位、个人就相关事项作出说明，查阅、复制相关资料，查询、检查相关信息系统，查封涉嫌违法的相关设备、场所等，并可以开展现场监测。有关单位、个人应当予以配合，不得拒绝、阻碍。 检查人员对检查中知悉的国家秘密、工作秘密、商业秘密、个人隐私和个人信息，依法负有保密义务。 第三十六条 国务院生态环境主管部门会同国务院有关部门建立生态环境监测信用评价制度，依法依规将相关违法违规行为记入信用记录，纳入全国信用信息共享平台。 第三十七条 生态环境主管部门根据技术服务机构的规模、技术能力、技术人员水平、管理能力、信用状况等，对技术服务机构实行分级分类监管，引导技术服务机构规模化发展，提升专业化水平和市场公信力。 第三十八条 生态环境监测相关行业组织应当建立健全行业规范，加强行业自律管理，促进行业健康发展。 第三十九条 任何单位和个人对违反本条例规定的行为，有权向生态环境主管部门和其他有关部门举报。接到举报的部门应当依法及时处理。 第六章 法律责任 第四十条 侵占、损毁生态环境质量监测站点及其设施、设备，或者干扰生态环境质量监测站点正常运行的，由生态环境主管部门或者其他有关部门依据职责责令改正，处2万元以上20万元以下的罚款。 第四十一条 地方各级人民政府、县级以上人民政府有关部门工作人员有下列情形之一的，依法给予处分，并予以通报： （一）对公共监测数据弄虚作假或者明示、暗示有关单位、个人对公共监测数据弄虚作假； （二）对依法履行职责或者拒绝、抵制监测违法行为的单位、个人打击报复； （三）其他滥用职权、玩忽职守、徇私舞弊的情形。 第四十二条 企事业单位在开展自行监测中有下列情形之一的，由生态环境主管部门或者其他有关部门依据职责责令改正，处2万元以上20万元以下的罚款；拒不改正的，责令停产停业： （一）不遵守生态环境监测规范或者标准，导致监测数据失真； （二）使用不符合国家标准或者规范的监测设备，或者未对监测设备进行经常性维护、保养或者定期检定、校准； （三）未按照规定在主要监测点位安装、使用视频监控设备； （四）未按照规定安装、使用自动监测设备，或者发现自动监测设备传输数据异常未及时报告并对自动监测设备进行检查、修复； （五）主要监测点位视频监控设备或者自动监测设备未与生态环境主管部门或者其他有关部门联网； （六）未记录或者未如实记录手工监测期间的生产负荷、污染防治设施运行情况等工况； （七）未建立监测数据质量管理制度； （八）未保存或者未按照规定期限保存原始监测记录； （九）未依法公开或者不如实公开自行监测相关信息。 生态环境主管部门或者其他有关部门发现企事业单位使用的监测设备不符合国家标准或者规范的，除依照前款规定对企事业单位予以处罚外，可以将该设备有关情况以及其生产者、销售者向社会公布，并通报市场监督管理部门，由市场监督管理部门对生产者、销售者依法处理。 第四十三条 技术服务机构有下列情形之一的，由生态环境主管部门责令改正，处2万元以上20万元以下的罚款；有违法所得的，没收违法所得；拒不改正的，责令停业： （一）不具备相应的设施设备、技术能力、技术人员、管理能力； （二）未按照规定备案； （三）超出其业务范围接受委托，违反约定将受托业务转委托，或者同时接受可能存在利益冲突的委托； （四）开展监测服务不遵守生态环境监测规范或者标准，导致监测数据失真； （五）开展生态环境监测设备运行维护未建立运行维护记录制度，或者隐瞒、不及时处理发现的影响生态环境监测设备正常运行的问题； （六）未建立监测数据质量管理制度； （七）未按照规定保存其开展业务的相关数据、报告、记录、委托合同等材料。 第四十四条 企事业单位实施或者明示、暗示有关单位、个人对监测数据弄虚作假的，由生态环境主管部门或者其他有关部门依据职责责令改正，处10万元以上100万元以下的罚款，对直接负责的主管人员和其他直接责任人员处5万元以上20万元以下的罚款；情节严重的，责令停产停业。 第四十五条 接受委托开展监测服务的技术服务机构对监测数据弄虚作假的，由生态环境主管部门处10万元以上50万元以下的罚款；情节严重的，处50万元以上200万元以下的罚款，禁止从事监测服务，对其中取得监测服务相关资质的，由授予其资质的部门吊销其资质证书。 技术服务机构因前款规定的违法行为受到处罚的，对其直接负责的主管人员和其他直接责任人员处1万元以上5万元以下的罚款，5年内禁止从事监测服务；情节严重的，10年内禁止从事监测服务；构成犯罪的，依法追究刑事责任，终身禁止从事监测服务。 第四十六条 违反本条例规定，给他人造成损失的，依法承担赔偿责任；构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第七章 附 则 第四十七条 军队的生态环境监测工作按照中央军事委员会的有关规定执行。 第四十八条 生态环境监测数据安全保护，依照《中华人民共和国数据安全法》、《网络数据安全管理条例》的规定执行。 第四十九条 本条例自2026年1月1日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251011-430d7532","title":"密云水库水源保护条例","publish_date":"2025-10-11"}],"updated_at":"2026-11-16T09:21:19.902Z"},{"slug":"policy-20251023-e7204e80","title":"工业和信息化部关于公布第七批国家工业遗产及通过复核的第三批国家工业遗产名单的通知","type":"policy","type_label":"政策","issuer":"工业和信息化部","doc_no":"工信部政法函〔2025〕273号","publish_date":"2025-10-23","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202510/content_7045453.htm","summary":"工业和信息化部关于公布第七批国家工业遗产及通过复核的第三批国家工业遗产名单的通知 工信部政法函〔2025〕273号 各省、自治区、直辖市及新疆生产建设兵团工业和信息化主管部门，有关中央企业： 为","themes":["工业遗产"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>工业和信息化部关于公布第七批国家工业遗产及通过复核的第三批国家工业遗产名单的通知 工信部政法函〔2025〕273号 各省、自治区、直辖市及新疆生产建设兵团工业和信息化主管部门，有关中央企业： 为贯彻落实习近平总书记关于文化遗产保护传承的重要论述，加强工业遗产保护利用，根据《国家工业遗产管理办法》（工信部政法〔2023〕24号）和《工业和信息化部办公厅关于组织开展第七批国家工业遗产认定申报和第三批复核工作的通知》（工信厅政法函〔2025〕72号），经项目单位自愿申报、省级工业和信息化主管部门与中央企业初审推荐、形式审查、专家评审、现场核查及社会公示等程序，我部确定了第七批国家工业遗产和通过复核的第三批国家工业遗产名单，现予以公布。 请各地工业和信息化主管部门、有关中央企业加强工业遗产整体性系统性保护，加大资源保障，强化监督管理；积极推动工业遗产活化利用，探索“工业遗产+”科普教育、旅游休闲、产业重塑等新模式新业态；加大宣传推广力度，深入挖掘、系统展示工业遗产的价值内涵，营造全社会关心关注工业遗产的浓厚氛围。 《工业和信息化部关于公布第三批国家工业遗产名单的通告》（工信部产业函〔2019〕403号）同时作废。 附件： 1.第七批国家工业遗产名单 2.通过复核的第三批国家工业遗产名单 工业和信息化部 2025年10月17日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.932Z"},{"slug":"policy-20251017-07d7c523","title":"国家文物局关于加强文物建筑修缮工程全流程管理的通知","type":"policy","type_label":"政策","issuer":"国家文物局","doc_no":"文物保发〔2025〕41号","publish_date":"2025-10-17","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202510/content_7044745.htm","summary":"构件、形制和历史信息。在没有油饰彩画传统的地区，或油饰彩画已基本缺失的建筑群，一般不恢复油饰彩画，1911年以前的彩画、灰塑原则上均应进行现状科技保护，严禁翻新古代壁画和彩塑。注意保存墙体历史沧桑感，","themes":["文物保护","修缮工程"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国家文物局关于加强文物建筑修缮工程全流程管理的通知 文物保发〔2025〕41号 各省、自治区、直辖市文物局（文化旅游厅/局），新疆生产建设兵团文物局： 为加强文物建筑修缮工程全流程管理，落实不改变文物原状和最小干预原则，根据《中华人民共和国文物保护法》等法律法规，现就有关事项通知如下。 一、加强工程前期管理 （一）做好项目统筹谋划。各级文物行政部门要按照《国家文物局关于进一步优化文物保护项目审批的通知》要求，认真做好项目申报。要加强统筹，对辖区内保存状况不佳，或多年未开展修缮的文物建筑，主动开展实地核查，督促地方人民政府、管理使用单位、管理责任人履行管理职责，及时开展修缮。文物建筑管理使用单位或管理责任人应统筹做好保护修缮、安防消防防雷、装修、管线设施、展示陈列等各类项目衔接，避免重复扰动。 （二）认真开展勘察设计。要严格按照文物保护工程设计文件编制深度要求和立项批复意见，编制文物建筑修缮工程勘察设计方案。需要开展考古工作的，责任设计师应对考古工作的范围提出意见，确保考古工作有效支撑修缮工程。原则上不应以恢复至某一特定历史时期为修缮目标，应甄别、评估、保存各时期有价值、有时代特征的构件、形制和历史信息。在没有油饰彩画传统的地区，或油饰彩画已基本缺失的建筑群，一般不恢复油饰彩画，1911年以前的彩画、灰塑原则上均应进行现状科技保护，严禁翻新古代壁画和彩塑。注意保存墙体历史沧桑感，不宜整体粉刷古塔。责任设计师负责统筹文物建筑修缮外观效果，对粉刷、勾缝、油饰、彩画等的新旧并存情况，应牵头提出技术措施，确保新、旧总体协调，兼顾可识别性。 （三）从严控制项目审批。各级文物行政部门要严格落实不改变文物原状和最小干预原则，组织对文物建筑修缮立项和技术方案进行谨慎、细致地评审和审批，严禁超范围审批。不断提高审批办理人员的专业技术水平，鼓励依托承担文物保护工程技术监督职能的专业技术单位开展技术评审，支撑行政审批工作。市县级文物行政部门批复木结构古建筑落架方案的，应事先征求省级文物行政部门意见，其他类型文物建筑不得落架。 （四）强化重点项目管理。国家文物局在全国重点文物保护单位保护项目计划审批中加大重点项目比例，将世界文化遗产、壁画彩塑，以及涉及国家重大战略、社会广泛关注、技术难度大的文物保护工程列为重点项目，加大资金保障力度。鼓励重点项目先行先试文物保护工程改革举措，强化责任设计师的主导作用，探索开展工程实训。重点项目应在工程竣工验收后编辑出版文物保护工程报告。 二、加强实施过程管控 （五）提升业主管理能力。文物建筑管理使用单位应将修缮工程管理作为主要任务之一，不断提高专业技术能力，修缮工程业主代表应具备工程管理经验或相关专业背景。支持世界文化遗产地管理机构、大型文物建筑群管理使用单位组建直属勘察设计和施工队伍，并允许其依法承揽本单位的文物建筑修缮工程。 （六）强化施工程序管控。项目各参与方必须落实古建筑修缮项目施工规程和文物建筑保护工程施工组织设计编制要求。严格执行现场复核、补充勘察、工程洽商、施工记录、阶段验收等相关程序，及时、规范形成工程资料。构件登记、关键工序、隐蔽工程、试验样板必须做好影像记录，鼓励开展全过程工程摄影和数字化记录。严格履行设计变更报批程序，严查以工程洽商替代设计变更的行为。施工现场应设立文物保护警示标识，施工前应对参与人员进行文物保护法律法规、安全责任等培训。 （七）加强现场技术管理。施工单位应严格控制施工范围和干预力度，研究、坚持传统材料和工艺做法。逐个做好梁架、斗栱、柱等关键结构构件、屋顶构造节点及装饰构件的修缮做法论证和记录。加强现场材料制备的试验检验，做好木材含水率、各类灰土、瓦件、砖石的检测和质量管理。砖石构件风化、断裂但不影响其结构和使用安全的，原则上应予保留续用。古建筑修缮施工区域内严禁使用明火，近现代建筑修缮不得使用防水卷材热熔法。 （八）加大工程监管力度。国家文物局建立统一的文物保护工程全流程平台，逐步对接各省已有的文物保护工程管理平台，统一排查超范围审批情况。各级文物行政部门和技术监督部门应按照文物保护工程检查、验收管理有关规定，根据立项和方案批复、勘察设计方案、施工组织设计等，对工程程序、质量、效果进行检查，按照文物保护工程安全检查督察办法要求，对工程安全管理进行检查、督察。建立施工、监理单位主要管理人员在岗备案制度，督促勘察设计单位做好现场跟进。 三、加强竣工验收和资质管理 （九）加强竣工资料整理。文物建筑修缮工程业主单位组织编制竣工报告，经相应级别技术监督部门审查后，可以申请竣工验收。竣工报告应包括各建筑单体修缮前后的各方向同角度对比照片。业主单位应按照《文物保护工程文件归档整理规范》整理竣工档案。全国重点文物保护单位文物建筑修缮重点项目的工程报告应在验收后三年内发表，竣工后具备条件的可在隐蔽位置设小型碑记。省级文物行政部门要支持并监督工程报告出版。鼓励拍摄文物建筑修缮专题纪录片，设置专题展陈。 （十）规范竣工验收管理。各级文物行政部门和技术监督部门按照《文物保护工程管理办法》和文物保护工程竣工验收管理有关要求，组织开展文物建筑修缮工程竣工验收。竣工验收结论不得以专家意见或四方验评意见代替。竣工验收完成后，工程竣工档案抄报相应级别技术监督部门，其中竣工报告抄报上一级文物行政部门和技术监督部门。 （十一）严格资质资格管理。严格落实文物保护工程资质单位和责任设计师、责任工程师、责任监理师分级分类管理，严肃查处违法违规行为。技术监督部门应基于技术监督行为生成监管记录，逐步建立监管记录共享机制，加强文物保护工程资质单位和责任设计师、责任工程师、责任监理师信用动态监管。 四、推动建立技术监督体系 （十二）完善技术监督体系设置。推动依托现有文物保护与考古等机构内部设置文物保护工程技术监督部门，承担技术监督任务，通过开工报告、关键节点监督、材料检验检测、工地检查、竣工报告审核、验收、监管记录生成、竣工档案保存、提出责令整改或停工建议等措施，配合各级文物行政部门对文物建筑修缮工程进行全流程监管，确保规章制度、标准规范、批复文件的准确执行，督促落实文物保护理念原则与质量、安全、进度要求。 （十三）建立国家级技术监督队伍。国家文物局依托直属单位建立文物保护工程技术监督队伍，组织检查、验收全国重点文物保护单位重点项目，抽查全国重点文物保护单位一般项目，指导各地做好技术监督工作。 （十四）加强各地技术监督力量。省级文物行政部门应尽快明确在具有专业能力的直属机构内部设立文物保护工程技术监督部门，独立设置的省级古建院所、文保中心应承担技术监督工作，未单独设置省级古建院所、文保中心的省份，由省级文物考古研究院所承担技术监督工作。鼓励设区的市依托文物保护管理所、文保中心等强化技术监督力量。 五、加大工作保障力度 （十五）加强人才培养。支持普通高校、职业技术院校开展文物建筑相关学科建设，培育调查研究、勘察设计、施工、保护技术、管理等全链条人才。加快推进文物修复师职业技能等级认定。推进传统营造技艺相关非遗代表性传承人与文物建筑修缮专业技术人员联合培训。鼓励各地探索传统营造技艺相关非遗代表性传承人参与本地区未定级文物建筑修缮的工作机制。 （十六）完善经费保障。加强文物建筑修缮前期勘察研究方案编制与工程报告出版，国家文物局和省级文物行政部门通过现有资金渠道予以支持。稳步推进中央专项彩票公益金支持国家古迹文物保护项目。鼓励地方人民政府对低级别文物建筑修缮项目给予奖补。各级文物行政部门要为技术监督工作提供必要保障。 （十七）规范物料管理。探索试点恢复传统建筑材料制造场所。支持世界文化遗产地、大型文物建筑群管理使用单位、省级古建院所建立修缮料场，储备常用修缮材料。修缮中无法续用的、有保存价值的旧构件，特别是有纪年、款识的构件、装饰构件和重要古建筑的结构构件，应妥善登记保存，不得丢弃或转移。 （十八）加强科技支撑。深化文物建筑材质特性、病害形成机理及发展预测方法研究，支持文物建筑病害探测、原位诊断、修缮、技术监督关键技术和装备研发。支持古建院所、文保中心、文物考古研究院所等专业机构配置调查测绘、摄影摄像、材料取样、检测检验、图档储存等相关装备设施。支持文物建筑保护相关方向的国家文物局重点科研基地积极参与相关研究。系统开展文物建筑修缮领域标准规范制修订。 （十九）完善制度建设。适时组织《文物保护工程管理办法》修订，有序开展资质资格、经费预算、勘察设计、审批、工程检查、验收、竣工报告、物料管理等各相关规章制度制修订，编制未定级文物建筑修缮技术导则，鼓励各地出台乡土建筑修缮利用技术导则，细化分级分类管理，健全完善符合中国国情的文物建筑修缮工作体系。 特此通知。 国家文物局 2025年9月30日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.951Z"},{"slug":"regulation-20251011-430d7532","title":"密云水库水源保护条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第819号","publish_date":"2025-10-11","effective_date":"","status":"现行有效","level":"国家级","region":"北京","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202510/content_7043917.htm","summary":"、行政法规规定和职责分工，加强对密云水库水源保护工作的指导监督。 第五条　北京市人民政府、河北省人民政府应当共同制定密云水库水源保护总体方案，明确工作目标、重点任务、保障措施、落实机制等事项。 第六条","themes":["水源保护","生态保护"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第819号 《密云水库水源保护条例》已经2025年8月29日国务院第67次常务会议通过，现予公布，自2025年12月1日起施行。 总理 李强 2025年10月6日 密云水库水源保护条例 第一条 为了加强密云水库水源保护，促进密云水库流域绿色发展，统筹地表水与地下水、当地水与外调水，多水源保障首都水安全，制定本条例。 第二条 本条例适用于密云水库及其上游潮河、白河干流和重要支流的水源保护及相关活动。 本条例所称密云水库流域，是指密云水库及其上游潮河、白河干流和重要支流涉及的北京市密云区、怀柔区、延庆区和河北省赤城县、沽源县、滦平县、兴隆县、丰宁满族自治县的相关乡级行政区域。前述重要支流和相关乡级行政区域由北京市人民政府、河北省人民政府确定。 第三条 密云水库水源保护应当贯彻党和国家路线方针政策、决策部署，立足密云水库流域主体功能定位，坚持保护优先、统筹保护与发展，坚持源头控制、系统治理，强化区域协同联动，实现水源保护、绿色发展、民生改善相统一。 密云水库水源保护应当与全面提升密云水库流域防洪等防灾减灾救灾能力相结合。 第四条 北京市人民政府、河北省人民政府应当密切协作，加强对密云水库水源保护工作的统筹，协调解决工作中的重大问题，督促检查工作落实情况。 密云水库流域地方人民政府负责本行政区域内密云水库水源保护工作。密云水库流域县级以上地方人民政府有关部门按照职责分工负责本行政区域内密云水库水源保护相关工作。 国务院生态环境、水行政、自然资源、农业农村等主管部门应当加强工作协同，加大对密云水库水源保护工作的支持力度，并依照法律、行政法规规定和职责分工，加强对密云水库水源保护工作的指导监督。 第五条 北京市人民政府、河北省人民政府应当共同制定密云水库水源保护总体方案，明确工作目标、重点任务、保障措施、落实机制等事项。 第六条 密云水库流域县级以上地方人民政府编制本行政区域国土空间规划，应当充分考虑密云水库水源保护需要，落实密云水库水源保护要求。 第七条 密云水库流域产业结构和布局应当与流域生态系统、资源环境承载能力以及密云水库水源保护要求相适应。 密云水库流域县级以上地方人民政府应当加快密云水库流域产业结构调整和布局优化，按照密云水库流域主体功能定位，依法加强对各类开发建设活动的管理，严禁不符合主体功能定位的各类开发建设活动。 第八条 密云水库流域县级以上地方人民政府应当结合密云水库水源保护要求，严格用水总量和强度控制，落实水资源管控指标。 第九条 北京市人民政府、河北省人民政府应当组织开展密云水库流域总氮等主要水污染物来源调查、溯源解析以及迁移转化规律研究，共同确定主要水污染物控制的重点领域、区域和主要措施，并纳入密云水库流域有关地方规划。 根据密云水库水源保护需要，北京市人民政府、河北省人民政府可以对密云水库流域制定严于国家水污染物排放标准的地方水污染物排放标准，报国务院生态环境主管部门备案。 第十条 密云水库流域县级以上地方人民政府应当在密云水库流域依法划定畜禽禁养区。 畜禽禁养区内禁止新建、扩建畜禽规模养殖场，现有的畜禽规模养殖场应当逐步关闭或者搬迁。 第十一条 密云水库流域地方人民政府应当在密云水库流域开展下列工作： （一）组织开展农业面源污染综合防治，推广农作物病虫害绿色防控产品和技术，建立农业投入品使用监测机制； （二）组织开展密云水库周边村庄，潮河、白河干流和重要支流沿线村庄生活垃圾治理，促进生活垃圾规范化收集、运输、处理； （三）加大农村生活污水治理力度，通过在密云水库周边村庄，潮河、白河干流和重要支流沿线村庄建设生活污水收集处理设施等措施，实现生活污水收集处理全覆盖； （四）组织开展生态清洁小流域建设。 第十二条 密云水库流域地方人民政府应当组织开展密云水库流域生态保护修复，采取下列措施恢复和增强水体自净能力，减少入河入库污染物对密云水库水质的影响： （一）建设水源涵养林； （二）在水库周边建设库滨带； （三）在水库入库口建设生态廊道； （四）依托现有排水沟渠建设植草过滤带； （五）科学规范增殖放流； （六）其他生态保护修复措施。 密云水库流域生态保护修复涉及的重大工程，依法纳入国家级、省级生态保护修复重大工程规划。 第十三条 在密云水库流域新建、改建、扩建建设项目，应当依法履行建设项目水土流失防治责任，采取有效措施加强水土流失防治。 第十四条 在密云水库管理范围以及潮河、白河干流河道管理范围内，禁止实施下列行为： （一）违法建设建筑物、构筑物； （二）未经处理达标、直接排放污水； （三）施用化肥农药； （四）采砂或者堆放矿渣、石渣、煤灰、垃圾等固体废物； （五）网箱养殖； （六）法律、行政法规规定禁止实施的其他行为。 第十五条 在密云水库管理范围以及潮河、白河干流河道管理范围外100米范围内，除生态修复设施、水工程设施、公用基础设施以及北京市人民政府、河北省人民政府确定的不造成水污染的必要项目外，禁止新建、扩建其他建设项目。 前款规定区域内严格控制化肥、农药施用，具体办法由北京市人民政府、河北省人民政府制定。 第十六条 在密云水库管理范围以及潮河、白河干流河道管理范围外1000米范围内，禁止新建、扩建尾矿库、化工园区和化工项目。 根据密云水库水源保护需要，北京市人民政府、河北省人民政府可以确定在前款规定区域内禁止或者限制新建、扩建的其他建设项目。 第十七条 本条例第十四条、第十五条、第十六条规定的区域与依法划定的饮用水水源保护区重合的部分，其保护措施依照有关法律、行政法规关于饮用水水源保护区的规定执行。 第十八条 密云水库流域县级以上地方人民政府应当健全完善水量水质监测网络，建立断面考核机制和监测信息共享机制。 潮河、白河干流和重要支流水量水质的省界监测断面、监测指标、监测标准等事项，由北京市人民政府、河北省人民政府共同确定。省界监测断面设有国家水文站点、水质监测站点的，可以直接采用其监测数据。 第十九条 密云水库流域县级以上地方人民政府生态环境、水行政、自然资源、农业农村等主管部门应当按照职责分工加强日常监管，并建立健全部门联合执法和信息共享机制，及时查处违反密云水库水源保护有关规定的违法行为。 北京市人民政府、河北省人民政府应当推进密云水库水源保护区域联合执法，推动执法标准统一。 第二十条 密云水库流域各级河长应当认真履行职责，加强对河道环境的日常巡查管护，及时推动整改发现的河道环境问题。 第二十一条 密云水库流域县级以上地方人民政府及其有关部门、乡镇人民政府应当采取多种方式，加强对水源保护、绿色发展以及有关法律、法规的宣传教育。 第二十二条 国务院有关部门和相关地方人民政府加大对密云水库流域绿色发展的支持力度。 国务院有关部门应当结合各自职责，加强对密云水库流域绿色发展的指导，并在公共资源配置、绿色产业布局、就业促进等方面依法依规给予支持。 鼓励、支持金融机构按照市场化、法治化原则提供与密云水库流域绿色发展相适应的金融服务，引导社会资本依法依规参与密云水库流域绿色发展。 第二十三条 密云水库流域县级以上地方人民政府应当制定专项政策，明确支持和促进密云水库流域绿色发展的具体措施。 第二十四条 北京市人民政府、河北省人民政府应当就密云水库水源保护协商建立地区间横向生态保护补偿机制，综合考虑密云水库水源保护现状、保护成本、保护成效以及地区经济社会发展水平、财政承受能力等因素，合理确定、动态调整补偿标准。 北京市人民政府、河北省人民政府统筹使用不同渠道生态保护补偿资金，对密云水库水源保护实施财政纵向补偿。中央财政按照生态保护补偿制度有关规定予以支持。 鼓励充分发挥市场机制在密云水库流域生态保护补偿中的作用，推进生态保护补偿市场化发展。 第二十五条 密云水库流域地方人民政府及其有关部门在密云水库水源保护工作中不履行或者不正确履行职责的，依照法律、法规和国家有关规定追究责任，对直接负责的主管人员和其他直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任。 第二十六条 违反本条例第十条第二款、第十三条、第十四条规定的，依照有关法律、行政法规的规定予以处罚。有关法律、行政法规对本条例第十四条第三项、第五项行为未作处罚规定的，由密云水库流域县级以上地方人民政府生态环境、水行政、农业农村等主管部门按照职责分工，责令停止违法行为；情节严重的，对单位处2万元以上5万元以下的罚款，对个人处500元以上2000元以下的罚款；有违法所得的，没收违法所得。 第二十七条 违反本条例第十五条第一款、第十六条规定的，由密云水库流域县级以上地方人民政府生态环境、水行政、自然资源等主管部门按照职责分工，责令停止违法行为，限期恢复原状，处5万元以上20万元以下的罚款；情节严重的，处20万元以上100万元以下的罚款；有违法所得的，没收违法所得；构成犯罪的，依法追究刑事责任。 第二十八条 密云水库水源保护及相关活动除应当遵守本条例外，还应当遵守生态环境保护、防灾减灾救灾等有关法律、行政法规的规定。 第二十九条 本条例自2025年12月1日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:19.973Z"},{"slug":"regulation-20250721-f8b28498","title":"住房租赁条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第812号","publish_date":"2025-07-21","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202507/content_7032956.htm","summary":"全国住房租赁活动的监督管理工作。 县级以上地方人民政府房产管理部门负责本行政区域内住房租赁活动的监督管理工作。 县级以上人民政府市场监督管理、公安等部门依照本条例和其他有关法律、法规的规定，在各自的","themes":["住房保障","城市更新"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第812号 《住房租赁条例》已经2025年6月27日国务院第62次常务会议通过，现予公布，自2025年9月15日起施行。 总理 李强 2025年7月16日 住房租赁条例 第一章 总 则 第一条 为了规范住房租赁活动，维护住房租赁活动当事人合法权益，稳定住房租赁关系，促进住房租赁市场高质量发展，推动加快建立租购并举的住房制度，制定本条例。 第二条 城镇国有土地上住房租赁活动及其监督管理，适用本条例。 第三条 住房租赁市场发展应当贯彻党和国家路线方针政策、决策部署，坚持市场主导与政府引导相结合。 第四条 国务院住房城乡建设主管部门负责全国住房租赁活动的监督管理工作。 县级以上地方人民政府房产管理部门负责本行政区域内住房租赁活动的监督管理工作。 县级以上人民政府市场监督管理、公安等部门依照本条例和其他有关法律、法规的规定，在各自的职责范围内负责住房租赁活动的监督管理工作。 第五条 国家鼓励居民家庭将自有房源用于租赁，支持企业盘活改造老旧厂房、商业办公用房、自持商品住房等用于租赁，多渠道增加租赁住房供给。 国家鼓励出租人和承租人依法建立稳定的住房租赁关系，推动租购住房在享受公共服务上具有同等权利。 第六条 从事住房租赁活动，应当遵守法律、法规，遵循平等、自愿、公平、诚信原则，不得危害国家安全、损害公共利益和他人合法权益，不得违背公序良俗。 第二章 出租与承租 第七条 用于出租的住房应当符合建筑、消防、燃气、室内装饰装修等方面的法律、法规、规章和强制性标准，不得危及人身安全和健康。 厨房、卫生间、阳台、过道、地下储藏室、车库等非居住空间，不得单独出租用于居住。 租赁住房单间租住人数上限和人均最低租住面积，应当符合设区的市级以上地方人民政府规定的标准。 第八条 出租人和承租人应当使用实名签订住房租赁合同。 出租人应当按照规定，通过住房租赁管理服务平台等方式将住房租赁合同向租赁住房所在地房产管理部门备案。房产管理部门应当提高住房租赁合同备案服务水平，不得就住房租赁合同备案收取任何费用。 出租人未办理住房租赁合同备案的，承租人可以办理备案。 第九条 出租人应当遵守下列规定： （一）向承租人出示身份证明材料、拟出租住房的不动产权属证书或者其他证明其具有合法出租权利的材料，并配合承租人依法查询、核实拟出租住房有关信息； （二）核验承租人的身份证明材料，不得将住房出租给拒绝出示身份证明材料的单位或者个人； （三）不得擅自进入租赁住房，但是经承租人同意或者依法可以进入的除外。 第十条 出租人收取押金的，应当在住房租赁合同中约定押金的数额、返还时间以及扣减押金的情形等事项。除住房租赁合同约定的情形以外，出租人无正当理由不得扣减押金。 第十一条 承租人应当遵守下列规定： （一）向出租人出示身份证明材料； （二）安全、合理使用租赁住房，不得损坏、擅自拆除、停用消防设施或者改动租赁住房承重结构，不得私拉乱接水、电、燃气管线； （三）未经出租人同意，不得擅自改变租赁住房用途、拆改室内设施或者改动租赁住房其他结构； （四）遵守物业管理规约，不得任意弃置垃圾、超标准排放污染物或者产生噪声、违反规定饲养动物、违章搭建、侵占公共通道、高空抛物或者实施其他损害他人合法权益的行为； （五）对出租人依法确需进入租赁住房的，予以配合。 第十二条 出租人依法解除住房租赁合同的，应当通知承租人，并为承租人腾退租赁住房留出合理时间。 出租人不得采取暴力、威胁或者其他非法方式迫使承租人解除住房租赁合同或者腾退租赁住房。 第十三条 住房租赁合同连续履行达到规定期限的，出租人按照有关规定享受相应的政策支持，承租人按照有关规定享受相应的基本公共服务。 第三章 住房租赁企业 第十四条 国家完善政策措施，培育市场化、专业化的住房租赁企业。 住房租赁企业，是指以自有住房或者依法取得经营管理权的他人住房开展住房租赁经营业务的企业。住房租赁企业应当具备与其经营规模相适应的自有资金、从业人员和管理能力。 住房租赁企业出租住房，适用本条例有关出租人的规定。 第十五条 住房租赁企业依法登记的经营范围应当使用“住房租赁”的表述。 住房租赁企业应当自领取营业执照之日起30日内，向所在地县级以上地方人民政府房产管理部门报送开业信息。房产管理部门应当将住房租赁企业开业信息向社会公开。 住房租赁企业应当在其经营场所醒目位置公示本企业开业信息、服务规范和标准等。 第十六条 住房租赁企业发布的住房地址、面积、租金等房源信息应当真实、准确、完整，在其经营场所、互联网等不同渠道发布的房源信息应当一致，发布的房源图片应当与实物房源一致，不得发布虚假或者误导性房源信息，不得隐瞒或者拒绝提供拟出租住房的有关重要信息。 第十七条 住房租赁企业应当建立住房租赁档案，如实记载相关信息，并健全住房租赁信息查验等内部管理制度。 住房租赁企业不得非法收集、使用、加工、传输他人个人信息，不得非法买卖、提供或者公开他人个人信息。 第十八条 住房租赁企业应当按照规定向所在地县级以上地方人民政府房产管理部门报送其经营的租赁住房信息及其变化情况。 第十九条 从事转租经营的住房租赁企业应当按照规定设立住房租赁资金监管账户并向社会公示，并通过该账户办理住房租赁资金收付业务，具体办法由国务院住房城乡建设主管部门会同国务院有关部门制定。 第二十条 自然人转租他人住房开展住房租赁经营业务，经营规模达到国务院住房城乡建设主管部门会同国务院市场监督管理部门等有关部门规定标准的，适用本条例有关住房租赁企业的规定。 第四章 经纪机构 第二十一条 从事住房租赁业务的房地产经纪机构（以下简称住房租赁经纪机构）应当具备与其经营规模相适应的自有资金、从业人员和管理能力。 第二十二条 住房租赁经纪机构应当将其从业人员名单向所在地县级以上地方人民政府房产管理部门备案。住房租赁经纪机构的从业人员不得同时在两个或者两个以上住房租赁经纪机构从事业务。 住房租赁经纪机构的从业人员不得以个人名义承接住房租赁经纪业务。 第二十三条 住房租赁经纪机构发布房源信息前，应当核对并记录委托人的身份信息、住房权属信息，实地查看房源，与委托人签订住房租赁经纪服务合同，编制住房状况说明书。住房租赁经纪服务合同、住房状况说明书应当加盖住房租赁经纪机构印章，并按照有关规定保存。 第二十四条 本条例第十五条第二款和第三款、第十六条、第十七条的规定，适用于住房租赁经纪机构。 第二十五条 住房租赁经纪机构不得有下列行为： （一）为出租不符合建筑、消防、燃气、室内装饰装修等方面的法律、法规、规章或者强制性标准的住房提供经纪服务； （二）为单独出租厨房、卫生间、阳台、过道、地下储藏室、车库等非居住空间用于居住提供经纪服务； （三）为单间租住人数上限或者人均最低租住面积不符合规定标准的住房出租提供经纪服务； （四）代收、代付住房租金、押金； （五）未经当事人同意，以当事人名义签订住房租赁合同； （六）法律、法规、规章禁止从事的其他行为。 第二十六条 住房租赁经纪机构应当对收费服务项目明码标价，不得在标价之外加价或者收取未予标明的费用。 第二十七条 出租人和承租人通过住房租赁经纪机构签订住房租赁合同的，由住房租赁经纪机构办理住房租赁合同备案。 第五章 监督管理 第二十八条 国务院住房城乡建设主管部门会同国务院市场监督管理部门制定并公布住房租赁合同、住房租赁经纪服务合同示范文本。 第二十九条 设区的市级以上地方人民政府应当建立住房租金监测机制，定期公布本行政区域内不同区域、不同类型住房的租金水平信息。 第三十条 县级以上地方人民政府房产管理部门应当通过住房租赁管理服务平台开展合同备案、租赁住房信息管理、统计监测等管理与服务，并与民政、自然资源、教育、市场监督管理、金融管理、公安、税务、统计等部门建立信息共享机制。 第三十一条 县级以上地方人民政府房产管理部门应当会同有关部门加强对住房租赁活动的监督检查，依法及时处理违法行为。 第三十二条 县级以上地方人民政府房产管理部门可以委托实施单位承担住房租赁管理的支持辅助等相关具体工作。房产管理部门委托的实施单位不得以营利为目的。 县级以上地方人民政府房产管理部门应当对其委托的实施单位加强监督，并对实施单位在委托范围内的行为后果承担法律责任。 第三十三条 县级以上地方人民政府房产管理部门应当会同有关部门、住房租赁相关行业组织加强住房租赁行业诚信建设，建立住房租赁企业、住房租赁经纪机构及其从业人员信用评价制度，将相关违法违规行为记入信用记录，纳入全国信用信息共享平台，并根据信用状况实施分级分类监管。 第三十四条 住房租赁相关行业组织应当建立健全行业规范，加强行业自律管理，促进行业健康发展。 第三十五条 在住房租赁活动中，因押金返还、住房维修、住房腾退等产生纠纷的，由出租人和承租人协商解决；协商不成的，可以依法申请调解、仲裁或者提起诉讼。 第三十六条 提供住房租赁信息发布服务的网络平台经营者（以下简称网络平台经营者）应当核验住房租赁信息发布者的真实身份信息。 网络平台经营者知道或者应当知道信息发布者有提供虚假信息等违法情形的，应当依法采取删除相关信息等必要措施，保存相关记录，并向有关部门报告。 网络平台经营者不得代收、代付住房租金、押金。 第三十七条 出租人应当按规定如实登记并报送承租人及实际居住人信息，发现违法犯罪活动应当及时向公安机关报告。具体办法由国务院公安部门制定。 承租人不得利用租赁住房实施违法犯罪活动。 第六章 法律责任 第三十八条 有下列情形之一的，依照有关法律、法规、规章的规定处罚： （一）出租不符合建筑、消防、燃气、室内装饰装修等方面的法律、法规、规章或者强制性标准的住房； （二）损坏、擅自拆除、停用消防设施； （三）改动租赁住房承重结构； （四）私拉乱接水、电、燃气管线。 第三十九条 将厨房、卫生间、阳台、过道、地下储藏室、车库等非居住空间单独出租用于居住，或者租赁住房不符合规定的单间租住人数上限或者人均最低租住面积标准的，由县级以上地方人民政府房产管理部门责令改正，给予警告；拒不改正的，对单位处2万元以上10万元以下的罚款，对个人处2000元以上1万元以下的罚款；有违法所得的，没收违法所得。 第四十条 住房租赁企业、住房租赁经纪机构不具备与其经营规模相适应的自有资金、从业人员、管理能力的，由县级以上地方人民政府房产管理部门责令改正，给予警告；拒不改正、造成严重后果的，责令停业整顿。 第四十一条 住房租赁企业、住房租赁经纪机构有下列情形之一的，由县级以上地方人民政府房产管理部门责令改正，给予警告；拒不改正的，处2万元以上10万元以下的罚款： （一）未按照规定报送开业信息； （二）未在其经营场所醒目位置公示本企业开业信息、服务规范和标准等； （三）未建立住房租赁档案并如实记载相关信息，或者未健全住房租赁信息查验等内部管理制度； （四）未按照规定办理住房租赁合同备案。 住房租赁企业未按照规定报送其经营的租赁住房信息及其变化情况，或者住房租赁经纪机构未按照规定与委托人签订住房租赁经纪服务合同或者未编制住房状况说明书的，依照前款规定处罚。 第四十二条 住房租赁企业、住房租赁经纪机构发布虚假或者误导性房源信息，隐瞒或者拒绝提供拟出租住房有关重要信息的，由县级以上地方人民政府房产管理部门责令改正，给予警告，处2万元以上10万元以下的罚款；有违法所得的，没收违法所得；拒不改正的，责令停业整顿；情节严重的，由县级以上地方人民政府房产管理部门提请同级市场监督管理部门依法吊销其营业执照。 住房租赁企业、住房租赁经纪机构非法收集、使用、加工、传输他人个人信息，或者非法买卖、提供或者公开他人个人信息的，依照有关个人信息保护的法律、法规的规定处罚。 第四十三条 从事转租经营的住房租赁企业未按照规定设立住房租赁资金监管账户并向社会公示，或者未按照规定通过该账户办理住房租赁资金收付业务的，由县级以上地方人民政府房产管理部门责令改正，给予警告，处2万元以上10万元以下的罚款；拒不改正的，处10万元以上50万元以下的罚款。 第四十四条 住房租赁经纪机构有下列情形之一的，由县级以上地方人民政府房产管理部门责令改正，给予警告，处2万元以上10万元以下的罚款；有违法所得的，没收违法所得；拒不改正的，责令停业整顿： （一）发布房源信息前未核对并记录委托人的身份信息、住房权属信息，或者未实地查看房源； （二）为出租不符合建筑、消防、燃气、室内装饰装修等方面的法律、法规、规章或者强制性标准的住房提供经纪服务； （三）为单独出租厨房、卫生间、阳台、过道、地下储藏室、车库等非居住空间用于居住提供经纪服务； （四）为单间租住人数上限或者人均最低租住面积不符合规定标准的住房出租提供经纪服务； （五）代收、代付住房租金、押金； （六）未经当事人同意，以当事人名义签订住房租赁合同； （七）未按规定将其从业人员名单备案。 网络平台经营者代收、代付住房租金、押金的，依照前款规定处罚。 第四十五条 住房租赁经纪机构的从业人员同时在两个或者两个以上住房租赁经纪机构从事业务，或者以个人名义承接住房租赁经纪业务的，由县级以上地方人民政府房产管理部门责令改正，给予警告，可以处1万元以下的罚款；有违法所得的，没收违法所得；拒不改正的，1年内不得从事住房租赁经纪业务；情节严重的，5年内不得从事住房租赁经纪业务。 第四十六条 网络平台经营者未履行核验责任的，县级以上地方人民政府房产管理部门应当通报网信部门，由网信部门依据职责予以处置，可以处10万元以下的罚款；情节严重的，可以责令暂停相关业务或者停业整顿。 第四十七条 房产管理部门和其他有关部门工作人员在住房租赁活动监督管理工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分。 第四十八条 违反本条例规定，给他人造成损失的，依法承担赔偿责任；构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第七章 附 则 第四十九条 保障性住房的租赁活动及其监督管理，国家另有规定的，从其规定。 集体土地上住房租赁活动，由省、自治区、直辖市人民政府根据实际情况，制定管理办法。 第五十条 本条例自2025年9月15日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:19.993Z"},{"slug":"regulation-20250627-4b8236b5","title":"蓄滞洪区运用补偿办法","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第811号","publish_date":"2025-06-27","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202506/content_7029704.htm","summary":"本办法。 第二条　本办法适用于国家蓄滞洪区。国家蓄滞洪区名录由国务院水行政主管部门根据国家确定的重要江河、湖泊流域的防洪规划拟订，报国务院批准后公布。 第三条　蓄滞洪区运用补偿，遵循下列原则： （一）","themes":["防洪","区域治理"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第811号 《蓄滞洪区运用补偿办法》已经2025年6月13日国务院第61次常务会议通过，现予公布，自公布之日起施行。 总理 李强 2025年6月23日 蓄滞洪区运用补偿办法 第一章 总 则 第一条 为了保障蓄滞洪区的正常运用，确保受洪水威胁的重点地区的防洪安全，合理补偿蓄滞洪区内居民因蓄滞洪遭受的损失，根据《中华人民共和国防洪法》，制定本办法。 第二条 本办法适用于国家蓄滞洪区。国家蓄滞洪区名录由国务院水行政主管部门根据国家确定的重要江河、湖泊流域的防洪规划拟订，报国务院批准后公布。 第三条 蓄滞洪区运用补偿，遵循下列原则： （一）保障蓄滞洪区居民的基本生活； （二）有利于蓄滞洪区恢复农业生产； （三）与国家财政承受能力相适应。 第四条 蓄滞洪区运用前，蓄滞洪区所在地地方各级人民政府应当组织有关部门和单位做好蓄滞洪区内人员、财产的转移和保护工作，尽量减少蓄滞洪造成的损失。 第五条 国务院财政主管部门和水行政主管部门依照本办法的规定，负责全国蓄滞洪区运用补偿工作的组织实施和监督管理。 国务院水行政主管部门在国家确定的重要江河、湖泊设立的流域管理机构，对所辖区域内蓄滞洪区运用补偿工作实施监督、指导。 蓄滞洪区所在地地方各级人民政府依照本办法的规定，负责本行政区域内蓄滞洪区运用补偿工作的具体实施和管理。上一级人民政府应当对下一级人民政府的蓄滞洪区运用补偿工作实施监督。 蓄滞洪区所在地县级以上地方人民政府财政、水行政、发展改革、自然资源、住房城乡建设、农业农村、应急管理、林业草原等有关部门按照职责分工，负责蓄滞洪区运用补偿的有关工作。 第六条 国家鼓励、支持在蓄滞洪区推行洪水保险制度，鼓励保险机构根据蓄滞洪区运用后损失情况，开展洪水保险快速理赔和灾害应急预付赔款服务。 第七条 任何组织和个人不得骗取、侵吞和挪用蓄滞洪区运用补偿资金。 第八条 审计机关应当加强对蓄滞洪区运用补偿资金的管理和使用情况的审计监督。 第九条 蓄滞洪区所在地地方各级人民政府有关部门应当充分运用现代信息技术手段，建立健全信息共享机制，提高蓄滞洪区运用补偿工作效率和水平。 第二章 补偿对象、范围和标准 第十条 蓄滞洪区内具有常住户口的居民，依法直接从事种植、养殖的农业生产者，以及蓄滞洪区内住房的所有权人（以下统称区内居民），在蓄滞洪区运用后依照本办法的规定获得补偿。 区内居民除依照本办法获得蓄滞洪区运用补偿外，同时按照国家有关规定享受与其他洪水灾区受灾者同样的政府救助和社会捐助。 第十一条 蓄滞洪区运用后，对区内居民遭受的下列损失给予补偿： （一）农作物、专业养殖和经济林水毁损失； （二）住房水毁损失； （三）无法转移的农业生产机械、家庭主要耐用消费品和饲养的畜禽水毁损失。 第十二条 蓄滞洪区运用后造成的下列损失，不予补偿： （一）根据国家有关规定应当退田而拒不退田，应当迁出而拒不迁出，或者退田、迁出后擅自返耕、返迁造成的水毁损失； （二）违反蓄滞洪区建设与管理规划、方案建造的住房水毁损失； （三）按照转移命令能转移而未转移的农业生产机械、家庭主要耐用消费品和饲养的畜禽水毁损失。 第十三条 蓄滞洪区运用后，对本办法第十一条规定范围内的损失实行分类定值补偿，补偿标准按照下列规定执行： （一）农作物按照蓄滞洪区运用前三年平均年产值的50%至70%补偿，专业养殖、经济林按照蓄滞洪区运用前三年平均年产值的40%至50%补偿。具体补偿标准由蓄滞洪区所在地省、自治区、直辖市人民政府（以下统称省级人民政府）根据蓄滞洪区运用后的实际水毁情况在上述幅度内确定。 （二）住房按照水毁损失的70%补偿。 （三）农业生产机械、家庭主要耐用消费品和饲养的畜禽，按照水毁损失的50%补偿。但是，农业生产机械、家庭主要耐用消费品和饲养的畜禽的总价值在2000元以下的，按照水毁损失的100%补偿；水毁损失超过2000元不足4000元的，按照2000元补偿。 分类定值补偿的具体办法，由蓄滞洪区所在地省级人民政府按照有利于蓄滞洪区运用和管理的原则制定。 第十四条 已下达蓄滞洪转移命令，因情况变化未实施蓄滞洪造成损失的，给予适当补偿。 第三章 补偿程序 第十五条 蓄滞洪区所在地县级人民政府应当组织有关部门和乡镇人民政府、街道办事处对区内居民的承包土地、流转土地、住房、农业生产机械和家庭主要耐用消费品逐户进行补偿登记，并由村民委员会、居民委员会张榜公布；在规定时间内无异议的，由县、乡、村分级建档立卡。 以村或者居民委员会为单位进行财产补偿登记时，应当有村民委员会成员、居民委员会成员和村民代表、居民代表参加。 财产补偿登记涉及已经依法登记的不动产的，有关登记事项以不动产登记簿记载的为准。 第十六条 财产补偿登记已公布的区内居民的承包土地、流转土地、住房或者其他财产发生变更时，村民委员会、居民委员会应当于每年汛前汇总，并向乡镇人民政府、街道办事处提出变更登记申请，由乡镇人民政府、街道办事处核实登记后，报蓄滞洪区所在地县级人民政府指定的部门备案。 第十七条 蓄滞洪区所在地县级人民政府应当及时将区内居民的承包土地、流转土地、住房、农业生产机械和家庭主要耐用消费品的财产补偿登记情况及变更登记情况汇总后抄报所在流域管理机构备案。流域管理机构应当根据每年汛期预报，对财产补偿登记及变更登记情况进行必要的抽查。 第十八条 蓄滞洪区运用后，所在地省级人民政府或者其授权的主管部门应当及时组织对蓄滞洪区运用的淹没范围予以界定。 蓄滞洪区所在地县级人民政府应当及时组织有关部门和乡镇人民政府、街道办事处核查淹没范围内损失情况，按照规定的补偿标准提出补偿方案，经省级人民政府或者其授权的主管部门核实后，由省级人民政府报国务院。补偿方案由国务院财政主管部门、水行政主管部门和应急管理部门审查、核定，提出补偿资金总额，报国务院批准后下达。省级人民政府上报的补偿方案应当附具所在流域管理机构签署的意见。 以村或者居民委员会为单位核查损失时，应当有村民委员会成员、居民委员会成员和村民代表、居民代表参加，并对损失情况张榜公布。 根据实际需要，可以委托专业机构参与核查损失情况。 第十九条 蓄滞洪区运用补偿资金由中央财政和蓄滞洪区所在地省级财政共同承担，中央财政承担补偿资金总额的70%。 蓄滞洪区运用后，补偿资金应当及时、足额拨付到位。资金管理办法由国务院财政主管部门会同水行政主管部门制定。 第二十条 蓄滞洪区所在地县级人民政府在补偿资金预算下达后，应当及时制定具体补偿方案，由乡镇人民政府、街道办事处逐户确定具体补偿金额，并由村民委员会、居民委员会张榜公布。 具体补偿金额经公布无异议后，按照国库集中支付制度有关规定将补偿资金支付至区内居民银行账户。 第二十一条 蓄滞洪区运用后损失严重的，在补偿方案由国务院有关部门审查、核定前，蓄滞洪区所在地省级人民政府或者其授权的主管部门可以向国务院水行政主管部门、财政主管部门申请预先下达部分补偿资金预算，并及时组织将补偿资金支付至区内居民银行账户。预先下达的补偿资金在后期据实结算。 第二十二条 补偿资金发放完毕后，蓄滞洪区所在地省级人民政府或者其授权的主管部门应当及时将补偿工作情况报国务院财政主管部门、水行政主管部门和应急管理部门。 第四章 法律责任 第二十三条 地方各级人民政府和县级以上人民政府有关部门及其工作人员，以及其他依法履行公职的人员，在蓄滞洪区运用补偿工作中滥用职权、玩忽职守、徇私舞弊，或者骗取、侵吞、挪用补偿资金的，对负有责任的领导人员和直接责任人员依法给予处分。 第二十四条 区内居民在财产补偿登记时弄虚作假，或者在蓄滞洪区运用补偿过程中谎报、虚报损失的，由县级人民政府责令改正，予以警告；多领、冒领补偿资金的，追回多领、冒领的资金。 第二十五条 违反本办法规定，构成犯罪的，依法追究刑事责任。 第五章 附 则 第二十六条 财产补偿登记、变更登记不得向区内居民收取任何费用，所需费用由蓄滞洪区所在地县级人民政府统筹解决。 第二十七条 省级人民政府批准的防洪规划中确定的蓄滞洪区的运用补偿办法，由有关省级人民政府制定。 第二十八条 本办法自公布之日起施行。2000年5月27日国务院发布的《蓄滞洪区运用补偿暂行办法》同时废止。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.023Z"},{"slug":"policy-20250526-93b5ee40","title":"重庆市地方标准《工业建筑民用化改造技术标准》（DBJ50/T-518-2025）","type":"policy","type_label":"政策","issuer":"重庆市住房和城乡建设委员会","doc_no":"DBJ50/T-518-2025（发布通知：渝建标〔2025〕18号）","publish_date":"2025-05-26","effective_date":"2025-08-01","status":"现行有效","level":"地方级","region":"重庆","source_name":"工作区研究资料收录（标准发布通知原文 OCR）","source_url":"","summary":"重庆市住房和城乡建设委员会2025年5月26日以渝建标〔2025〕18号发布《工业建筑民用化改造技术标准》，标准编号 DBJ50/T-518-2025，自2025年8月1日起施行，为重庆市工程建设地方标准，由市住房城乡建设委负责管理、重庆建工住宅建设有限公司负责具体技术内容解释，标准文本可在标准备案后登录重庆市住房和城乡建设技术发展中心官网免费下载。","themes":["老旧厂房改造","城市更新","工业遗产","绿色低碳"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>重庆市住房和城乡建设委员会文件 渝建标〔2025〕18号 重庆市住房和城乡建设委员会 关于发布《工业建筑民用化改造技术标准》的通知 各区县(自治县)住房城乡建委,两江新区、重庆高新区建设局,万盛经开区住房城乡建设局、双桥经开区住房城乡建设局、经开区生态环境建管局,有关单位: 现批准《工业建筑民用化改造技术标准》为我市工程建设地方标准,编号为DBJ50/T-518-2025,自2025年8月1日起施行。标准文本可在标准备案后登录重庆市住房和城乡建设技术发展中心官网免费下载。 本标准由重庆市住房和城乡建设委员会负责管理,重庆建工住宅建设有限公司负责具体技术内容解释。 重庆市住房和城乡建设委员会 2025年5月26日 说明：本条目依据工作区留存的标准发布通知原文 OCR 整理；工作区留存材料未包含标准正文条款，标准全文以主管部门发布版本为准。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:05:28.561Z"},{"slug":"policy-20250409-4dfdda38","title":"关于开展2025年度中央财政支持实施城市更新行动的通知","type":"policy","type_label":"政策","issuer":"财政部办公厅 住房城乡建设部办公厅","doc_no":"财办建〔2025〕11号","publish_date":"2025-04-09","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202504/content_7017720.htm","summary":"全覆盖样板区建设等；三是生活垃圾分类处理、建筑垃圾治理、综合杆箱、危旧桥梁、机械停车设施等市政基础设施提升改造；四是历史文化街区、老旧小区、口袋公园、绿地开放共享等既有片区更新改造，注重文化、旅游、","themes":["城市更新","财政支持"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>关于开展2025年度中央财政支持实施城市更新行动的通知 财办建〔2025〕11号 各省、自治区、直辖市财政厅（局）、住房城乡建设厅（局、委）： 为贯彻党的二十大、二十届三中全会关于实施城市更新行动的决策部署，落实中央经济工作会议和政府工作报告有关要求，中央财政继续支持部分城市实施城市更新行动，探索建立可持续的城市更新机制，推动补齐城市基础设施的短板弱项，加强消费型基础设施建设，注重向提振消费方面发力，促进城市基础设施建设由“有没有”向“好不好”转变，解决人民群众的急难愁盼问题，实现城市高质量发展。现就有关要求通知如下： 一、工作目标 财政部会同住房城乡建设部通过竞争性选拔，确定部分基础条件好、积极性高、特色突出的城市，在城市层面探索整合各类资源，探索建立资金、用地、金融等各类要素保障机制，形成工作合力。中央财政对入围城市给予定额补助。入围城市制定城市更新工作方案，统筹使用中央和地方资金，完善法规制度、规划标准、投融资机制及相关配套政策，探索城市更新可复制、可推广的机制和模式。力争通过三年探索，城市地下管网等基础设施水平明显提升，生活污水收集处理效能进一步提高，老旧片区宜居环境建设取得明显成效，形成可复制、可推广的模式和经验。 二、支持范围和申报条件 2025年，中央财政支持实施城市更新工作的范围为大城市及以上城市，共评选不超过20个城市，主要向超大特大城市以及黄河、珠江等重点流域沿线大城市倾斜。 每省（区、市）可推荐1个城市参评，申报城市需同时满足以下基础条件： 1.建立推动城市更新工作的组织领导和协调工作机制，并制定中央财政支持实施城市更新行动工作方案，具体实施范围集中在城市老城区； 2.城市财力应满足城市更新投入需要，地方政府债务风险低，不得因开展城市更新形成新的政府隐性债务； 3.2023年（含）以来，在住房和城乡建设领域未出现重大生产安全事故或重大负面舆情事件。 三、遴选组织方式 城市选拔采取竞争性评审的方式选拔确定，重点向基础工作扎实、条件俱备、积极性高的城市倾斜。 （一）省级推荐。省级财政、住房城乡建设部门对照申报工作要求，择优推荐本地区符合条件的城市参与评审，组织编制工作方案，并提供必要的支撑材料。直辖市可由城市政府有关部门直接申报。 （二）书面评审。财政部、住房城乡建设部组织专家对城市申报方案进行审查。按照120%差额比例确定进入现场答辩的城市名单。 （三）现场答辩。进入现场答辩的各城市派员参加公开答辩，具体要求另行通知。 （四）集中公示。综合书面评审和现场答辩得分情况，确定入围城市。入围城市经过公示，无异议的确定为中央财政支持实施城市更新行动城市。存在违规行为并经查实的，取消资格。 四、补助标准和支持范围 （一）中央财政资金补助标准。中央财政按区域对实施城市更新行动城市给予定额补助。其中：东部地区每个城市补助总额不超过8亿元，中部地区每个城市补助总额不超过10亿元，西部地区每个城市补助总额不超过12亿元，直辖市每个城市补助总额不超过12亿元。资金根据工作推进情况分年拨付到位。 （二）资金支持方向。中央财政资金支持城市更新的样板项目建设和机制建设2个方向： 1.城市更新重点样板项目。一是城市供排水、燃气、供热等城市地下管网更新改造和经济集约型综合管廊建设；二是城市生活污水处理“厂网一体”、城市生活污水管网全覆盖样板区建设等；三是生活垃圾分类处理、建筑垃圾治理、综合杆箱、危旧桥梁、机械停车设施等市政基础设施提升改造；四是历史文化街区、老旧小区、口袋公园、绿地开放共享等既有片区更新改造，注重文化、旅游、餐饮、休闲娱乐等一体打造，加强消费型基础设施建设。 2.城市更新机制建设。一是项目储备和生成机制。近远结合、系统谋划建设项目，城市更新项目谋划、储备、实施时序的方式，可形成的机制包括但不限于城市体检、城市更新专项规划、房屋全生命周期安全管理、城市更新项目储备库建设、建设成效后评估机制等。二是资金安排和筹措机制。建立有利于统筹用好财政、金融资源的机制。财政资金方面，充分运用好国债资金、中央预算内投资、地方政府一般公共预算、地方政府专项债券、其他政府性基金预算、国资预算等，最大程度发挥财政资金效能。金融支持方面，探索优化金融机构信贷支持模式，鼓励社会资本进入。同时，建立合理的成本分担机制，如污水全覆盖样板区和“厂网一体”运行维护机制，以污水收集效能提升为导向的按效付费机制，居民小区二次供水设施专业化服务机制，建立地下管网“一张图”设施动态更新机制和长效运行机制等。三是用地保障和审批机制，包括盘活利用存量低效用地、规划制度，适用于改造类项目的城市更新项目审批制度，城市更新有关法规制度和技术标准等。中央资金可用于上述三类机制建立过程中的相关支出。 各城市要按照因地制宜、因城施策的原则，突出本次城市更新的重点内容，聚焦城市老城区，集中打造城市更新的样板项目，形成样板片区。同时，应与现有支持政策做好统筹衔接，具体项目上不得重复申请中央预算内投资、车购税资金、超长期特别国债等其他渠道中央资金，防止交叉重复。 五、日常跟踪、监督检查及绩效管理 省级住房城乡建设、财政部门应建立对入围城市的日常跟踪及监督机制，及时将工作进展、存在问题及经验做法等报住房城乡建设部、财政部，原则上每个城市每年不少于1期。 财政部、住房城乡建设部按照《中央财政支持城市更新行动绩效评价办法》（财办建〔2024〕46号）及中央资金预算管理有关要求开展绩效评价。 六、其他事项 （一）参与申报的各省级财政、住房城乡建设部门（直辖市可由城市政府直接报送）应于4月30日前联合行文报送财政部、住房城乡建设部，并组织申报城市通过财政部、住房城乡建设部邮箱报送电子版（含佐证材料），或通过光盘等移动存储方式邮寄，申报材料不得包含任何涉密文件、涉密内容，电子版材料大小不超过8GB。 （二）各申报城市应按要求编制工作方案，减少申报工作支出。各地不得委托财政部、住房城乡建设部及其所属行政、企事业单位和工作人员以任何方式（署名或者不署名）参与工作方案的编制工作；不得简单交给中介机构或技术团队“编本子、讲故事”，印制豪华材料。除报送两部门的正式文件外，申报城市实施方案及相关支撑材料一律报送电子版。 （三）请各地严格按照通知明确的数量和要求推荐城市、报送材料等，并对报送内容真实性负责。对不按要求报送或申报内容明显不实的城市，将取消当年申报资格。 （四）经竞争性评审确定入围的城市，请将三年行动总体绩效目标表、2025年度绩效目标表加盖城市人民政府公章后，于公示期结束前报财政部、住房城乡建设部备案。 联系方式： 财政部经济建设司： 电话：010—68554521，邮箱：shikelu@mof.gov.cn 住房城乡建设部城市建设司： 电话：010—58933160，邮箱：chengshui@mohurd.gov.cn 财政部办公厅 住房城乡建设部办公厅 2025年4月3日 附件下载： 附件1-方案编制大纲 附件2-绩效指标体系 附件3-城市更新典型片区实施内容汇总表 附件4-实施城市更新机制建设示范项目汇总表\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.043Z"},{"slug":"policy-20250408-6d61cde6","title":"国务院关于《黄河流域国土空间规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕37号","publish_date":"2025-04-08","effective_date":"","status":"现行有效","level":"国家级","region":"黄河流域","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202504/content_7017568.htm","summary":"用地使用面积下降不少于40%；用水总量不超过国家下达指标。明确自然灾害风险重点防控区域，划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《黄河流域国土空间规划 （2021—2035年）》的批复 国函〔2025〕37号 自然资源部： 你部关于报请批准《黄河流域国土空间规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部组织起草的《黄河流域国土空间规划（2021—2035年）》（以下简称《规划》）。《规划》是国家级国土空间专项规划，是黄河流域空间发展的指南、可持续发展的空间蓝图，是各类开发保护建设活动的基本依据，请认真组织实施。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻落实党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，坚持共同抓好大保护，协同推进大治理，落实黄河流域生态保护和高质量发展战略部署，强化水资源刚性约束，统筹推进山水林田湖草沙冰一体化保护和系统治理，保障国家能源与粮食安全，不断优化国土空间开发保护格局，推动城乡人居环境明显改善、美丽中国建设取得显著成效，开创黄河流域生态保护和高质量发展新局面，让黄河成为造福人民的幸福河。 二、筑牢安全发展的空间基础。到2035年，黄河流域耕地保有量不低于25921.71万亩，其中永久基本农田保护面积不低于21544.88万亩；生态保护红线面积不低于39.60万平方千米；城镇开发边界扩展倍数控制在基于2020年城镇建设用地规模的1.3倍以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过国家下达指标。明确自然灾害风险重点防控区域，划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。深入实施区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略和乡村振兴战略，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。按照主体功能定位，推动黄河源区、黄河“几”字弯地区、黄河下游地区协同发展，增强区域整体竞争力和综合承载力，深度融入共建“一带一路”，加强与京津冀、长江经济带、粤港澳大湾区、长三角地区等区域重大战略地区的协同联动。 四、系统优化国土空间开发保护格局。在黄河源区，一体化保护高寒地区生态系统整体性，支撑打造生态文明建设高地；以自然恢复为主全面推进黄河源区生态修复，筑牢三江源“中华水塔”生态安全屏障。在黄河“几”字弯地区，重点治理晋陕宁蒙黄土区水土流失，推进黄河左右岸线流沙及沿线“沙头、沙口、沙源”治理；打造规模连片高质量的粮食生产基地，合理拓展粮食生产潜力空间；推进沿黄城市集聚集约发展，培育新兴增长极；充分利用沙漠、戈壁、荒漠等建设重要清洁能源走廊；实施地表水地下水联合调蓄和战略储备，坚决遏制挖湖造景。在黄河下游地区，增强山东半岛、中原城市群与京津冀、长三角等城市群之间的区域联系和融合发展；实施滩区差别化空间管控，增强下游洪涝灾害防御能力；加强生态系统综合治理，强化黄河入海口地区绿色低碳高质量发展空间保障。完善主体功能区配套政策，推动黄河源区、黄河“几”字弯地区、黄河下游地区优化人口、资源、产业合理配置，推动区域整体统筹产业链、供应链布局，依托城市群、都市圈和中心城市打造产业科技创新高地，为构建新发展格局提供支撑。统筹传统和新型基础设施空间布局，构建现代化基础设施网络，强化应对气候变化和极端天气的防灾减灾救灾基础设施，全面提升国土空间韧性。弘扬黄河文化，强化文化遗产与自然遗产整体保护和系统活化利用，健全跨行政区协同机制，将各类遗产保护管理纳入国土空间规划，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对黄河流域国土空间作出的全局安排，是区域国土空间保护、开发、利用、修复的政策和总纲，是有关地方各级编制实施国土空间规划的重要依据，必须严格执行。要自觉接受国土空间规划的指导约束，不得随意修改、违规变更，对不符合国土空间规划的用地用海、未批先建等违法违规行为要严肃查处。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。黄河流域各省（自治区）人民政府要加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，将《规划》确定的目标指标、重点任务等纳入有关地方各级国土空间规划，加快形成统一的国土空间规划体系，统筹国土空间开发保护。强化对水利、交通、能源、农业、信息、市政等基础设施以及公共服务设施、军事设施、生态环境保护、文物保护、林业草原等专项规划的指导约束，在国土空间规划“一张图”上协调解决矛盾问题，合理优化空间布局。黄河流域各省（自治区）要充分发挥国土空间规划委员会作用，加强对跨省域规划编制实施管理的统筹协调，强化对交界地区市县级国土空间规划的传导要求。按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建立国土空间规划实施监测网络，提高空间治理数字化水平。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年4月1日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.060Z"},{"slug":"policy-20250213-0a568f5f","title":"国务院关于《武汉市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕23号","publish_date":"2025-02-13","effective_date":"","status":"现行有效","level":"国家级","region":"武汉","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202502/content_7003572.htm","summary":"省会，中部地区的中心城市，国家历史文化名城，国际性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，","themes":["国土空间规划"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>国务院关于《武汉市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕23号 湖北省人民政府、自然资源部： 你们关于报请批准《武汉市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《武汉市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是武汉市各类开发保护建设活动的基本依据，请认真组织实施。武汉是湖北省省会，中部地区的中心城市，国家历史文化名城，国际性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥中部经济中心、科技创新中心、商贸物流中心、对外交往中心以及长江中游航运中心等功能，奋力谱写中国式现代化武汉篇章。 二、筑牢安全发展的空间基础。到2035年，武汉市耕地保有量不低于341.79万亩，其中永久基本农田保护面积不低于310.94万亩；生态保护红线面积不低于794.54平方千米；城镇开发边界面积控制在1813.35平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过39.0亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。主动融入共建“一带一路”，深度参与长江经济带高质量发展，共抓长江大保护，带动中部地区加快崛起，推进长江中游城市群联动发展，加强武汉都市圈国土空间开发保护利用的区域协同，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，完善汉口、武昌、汉阳地区相对独立的功能布局。强化对长江、汉江及其洲岛岸线的系统保护和开发利用，严格河湖水域空间管控，整体提升河湖水网生态系统的质量和稳定性，统筹推进生态空间保护和蓄滞洪区建设，加强北部山区生态保护修复。优化现代都市农业空间布局，拓展特色优势农产品生产空间。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障科技创新和产业创新深度融合发展的空间需求，为优化先进制造业布局、推动传统产业转型升级、培育产业创新中心和制造业创新中心提供土地政策保障。系统提升航空、铁路枢纽功能，加强武汉长江中游航运中心建设，充分发挥内河航运作用，支持打造长江黄金水道，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，加强洪涝灾害防治，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，保护好“江、湖、山、城”的空间格局，加强八七会议会址、中国共产党第五次全国代表大会旧址等红色文化遗产和武昌起义军政府旧址等近代历史文化遗存保护。加强对城市建筑高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对武汉市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。湖北省人民政府、自然资源部要指导督促武汉市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。武汉市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年2月10日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.076Z"},{"slug":"policy-20250127-6883e864","title":"国务院关于《京津冀国土空间规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕19号","publish_date":"2025-01-27","effective_date":"","status":"现行有效","level":"国家级","region":"京津冀","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7001456.htm","summary":"划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。深入实施区域协调发展战略、区域重大战略、","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《京津冀国土空间规划 （2021—2035年）》的批复 国函〔2025〕19号 自然资源部： 你部关于报请批准《京津冀国土空间规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部组织起草的《京津冀国土空间规划（2021—2035年）》（以下简称《规划》）。《规划》是国家级国土空间专项规划，是京津冀地区空间发展的指南、可持续发展的空间蓝图，是各类开发保护建设活动的基本依据，请认真组织实施。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻落实党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，落实京津冀协同发展战略部署，支撑京津冀建成世界一流城市群，更好发挥高质量发展动力源作用，成为中国式现代化建设的先行区、示范区。 二、筑牢安全发展的空间基础。到2035年，京津冀地区耕地保有量不低于9433.99万亩，其中永久基本农田保护面积不低于8224.44万亩；生态保护红线面积不低于4.23万平方千米，其中海洋生态保护红线面积不低于0.14万平方千米；城镇开发边界扩展倍数控制在基于2020年城镇建设用地规模的1.3倍以内；单位国内生产总值建设用地使用面积下降不少于40%；大陆自然岸线保有率不低于国家下达任务；用水总量不超过国家下达指标。明确自然灾害风险重点防控区域，划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。深入实施区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略和乡村振兴战略，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。按照主体功能定位，构建有利于有序疏解北京非首都功能的空间格局，深化京津冀地区协同发展，增强区域整体竞争力和综合承载力，深度融入共建“一带一路”，加强与黄河流域、长江经济带、粤港澳大湾区、长三角地区等区域重大战略地区的协同联动。 四、系统优化国土空间开发保护格局。牢牢牵住疏解北京非首都功能这个“牛鼻子”，支撑首都功能区域优化布局。北京市立足“四个中心”建设，加强控增量和疏存量相结合，推进城市功能重组优化，提升北京城市副中心对首都功能的服务保障能力。天津市加强滨海新区与北京城市副中心、河北雄安新区的协同联动，加强北方国际航运核心区建设，提升对外开放门户功能。河北雄安新区着力提升北京非首都功能疏解集中承载地功能。河北省发挥环京地区优势，以及生态、矿产、港口、海洋等特色资源优势，强化支撑区域产业链创新链构建、农产品供应保障、能源保供、生态环境优化、文旅康养服务等功能，以石家庄市辐射带动冀南地区加强与北京、天津、河北雄安新区的协同联动。京津冀三省市加强对重点交界地区的空间统筹和联合管控。巩固黄淮海平原农产品主产区，夯实华北粮仓空间基础。在北京市、天津市、河北环京地区重点推动现代都市农业发展，发挥农产品就近保障功能，支持发展高效节水农业、生猪和奶牛养殖、海洋牧场等，提升区域粮食生产和重要农产品供给能力。县域统筹推动城乡融合，促进城乡要素双向流动，加强城乡基础设施和公共服务设施一体化布局，支持乡村振兴。筑牢华北生态屏障，保障京津冀地区生态安全。推进北方防沙带建设，提升燕山—太行山等地区水源涵养功能，改善重要河湖湿地水生态，加大渤海湾综合整治力度，协同推进山水林田湖草沙一体化保护和系统治理。强化现代化基础设施对京津冀高质量发展的支撑保障。建设都市圈多层次轨道交通网络，打造世界级机场群、港口群，完善区域一体化公路交通网络和物流网络布局，完善水利基础设施配置，构建多水源供水网络。增强区域应对气候变化的安全韧性，统筹协调区域和城市防洪排涝功能，提高海河流域河道行洪能力，强化蓄滞洪区规划管控，加强城市内外河湖水系衔接，构建海岸带综合防护体系，平急结合优化防灾减灾救灾资源的区域布局。整体保护区域文化遗产和自然遗产，打造高品质休闲游憩空间，创造优良人居环境，展现京畿特色文化底蕴。 五、维护规划严肃性权威性。《规划》是对京津冀地区国土空间作出的全局安排，是区域国土空间保护、开发、利用、修复的政策和总纲，是有关地方各级编制实施国土空间规划的重要依据，必须严格执行。要自觉接受国土空间规划的指导约束，不得随意修改、违规变更，对不符合国土空间规划的用地用海、未批先建等违法违规行为要严肃查处。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。京津冀三省市人民政府要加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，将《规划》确定的目标指标、重点任务等纳入有关地方各级国土空间规划，加快形成统一的国土空间规划体系，统筹国土空间开发保护。强化对水利、交通、能源、农业、信息、市政等基础设施以及公共服务设施、军事设施、生态环境保护、文物保护、林业草原等专项规划的指导约束，在国土空间规划“一张图”上协调解决矛盾问题，合理优化空间布局。京津冀三省市要充分发挥国土空间规划委员会作用，加强对跨省域规划编制实施管理的统筹协调，强化对交界地区市县级国土空间规划的传导要求。按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建立国土空间规划实施监测网络，提高空间治理数字化水平。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月26日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.102Z"},{"slug":"regulation-20250127-4ea95f9d","title":"古树名木保护条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第800号","publish_date":"2025-01-27","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7001414.htm","summary":"组织领导。县级以上地方人民政府林业主管部门、城市绿化主管部门（以下统称县级以上地方人民政府古树名木主管部门）按照职责分工负责本行政区域内古树名木保护管理工作。县级以上地方人民政府其他有关部门在各自职责","themes":["古树名木","生态保护"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第800号 《古树名木保护条例》已经2025年1月3日国务院第50次常务会议通过，现予公布，自2025年3月15日起施行。 总理 李强 2025年1月25日 古树名木保护条例 第一条 为了加强对古树名木的保护，推进生态文明建设，传承中华优秀传统文化，制定本条例。 第二条 本条例所称古树，是指树龄100年以上的树木，不包括人工培育、以生产木材为主要目的的商品林中的树木。 本条例所称名木，是指具有重要历史、文化、科学、景观价值或者具有重要纪念意义的树木。 第三条 国家保护古树名木，禁止损害古树名木及其生长环境。 第四条 古树名木保护管理工作坚持中国共产党的领导，坚持保护第一、合理利用、分级管理的原则，构建政府主导、属地负责、社会参与的工作机制。 第五条 全国绿化委员会负责组织领导全国古树名木保护管理工作。国务院林业主管部门、住房城乡建设主管部门（以下统称国务院古树名木主管部门）按照职责分工负责全国古树名木保护管理工作。国务院其他有关部门在各自职责范围内负责古树名木保护管理相关工作。 县级以上地方人民政府应当加强对古树名木保护管理工作的组织领导。县级以上地方人民政府林业主管部门、城市绿化主管部门（以下统称县级以上地方人民政府古树名木主管部门）按照职责分工负责本行政区域内古树名木保护管理工作。县级以上地方人民政府其他有关部门在各自职责范围内负责古树名木保护管理相关工作。 乡镇人民政府、街道办事处以及村民委员会、居民委员会应当协助做好古树名木保护管理相关工作。 第六条 县级以上人民政府开展古树名木保护管理工作所需经费，应当按照财政事权和支出责任划分原则列入本级预算。 国家鼓励通过认捐、认养等多种形式资助古树名木保护事业。 第七条 国家鼓励、支持古树名木保护科学研究和先进技术推广应用，提高古树名木保护管理水平。 国务院有关部门、县级以上地方人民政府及其有关部门应当采取多种形式，组织开展古树名木保护宣传教育，传承古树名木文化，增强全社会的古树名木保护意识，营造保护古树名木的良好社会氛围。 第八条 对古树按照下列标准实行分级保护： （一）树龄500年以上的，实行一级保护； （二）树龄300年以上不满500年的，实行二级保护； （三）树龄100年以上不满300年的，实行三级保护。 省、自治区、直辖市人民政府根据实际情况，可以决定对城市内树龄300年以上不满500年的古树实行一级保护、树龄100年以上不满300年的古树实行二级保护。 对名木均实行一级保护，不受树龄限制。 第九条 全国绿化委员会每10年组织开展一次全国古树名木资源普查。普查间隔期内，县级以上地方人民政府古树名木主管部门适时开展古树名木资源补充调查。在普查、补充调查以及古树名木认定等工作中，县级以上地方人民政府古树名木主管部门可以组织开展古树名木鉴定。 国家鼓励单位、个人提供古树名木资源信息。 第十条 县级以上地方人民政府古树名木主管部门根据古树名木资源普查、补充调查结果认定古树名木，报本级人民政府批准后依法公布。 实行一级保护的古树和名木由省、自治区、直辖市人民政府古树名木主管部门认定，实行二级保护、三级保护的古树分别由设区的市级、县级人民政府古树名木主管部门认定。 对在一定区域内集中生长形成的古树群体，可以实行整体保护，并按照涉及古树名木的最高保护等级，由相应的地方人民政府古树名木主管部门认定为古树群，报本级人民政府批准后依法公布。 古树名木的认定和公布实行动态管理。 古树名木认定和分级保护管理的具体办法由国务院古树名木主管部门规定。 第十一条 县级以上地方人民政府古树名木主管部门应当建立古树名木档案，并按照有关规范和要求，对古树名木设立保护标志，建设相应的保护设施，采取相应的保护措施。 县级人民政府应当按照国务院古树名木主管部门的规定，划定古树名木保护范围，并依法公布。 古树名木保护范围划定后，应当及时纳入国土空间规划实施监督信息系统。 因生态保护等公共利益需要，造成古树名木相关权利人合法权益受到损害的，县级以上地方人民政府应当依法给予补偿；涉及属于集体所有、私人所有的古树名木的，县级以上地方人民政府可以采取措施合理照顾有关单位、个人的利益。 第十二条 县级人民政府古树名木主管部门应当按照有利于加强古树名木日常养护的原则，明确有关单位、个人作为古树名木的日常养护责任人，与日常养护责任人签订日常养护协议，根据古树名木权属情况、保护等级、养护状况、养护费用等，明确双方权利义务。 对在古树名木保护管理工作中作出突出贡献的单位、个人，按照国家有关规定给予表彰和奖励。 第十三条 县级人民政府古树名木主管部门应当加强对日常养护责任人的技术指导和培训，提高日常养护责任人的科学养护能力。日常养护责任人应当严格履行养护义务，对损害古树名木及其生长环境的行为应当予以制止。 日常养护责任人发现古树名木遭受损害或者出现生长异常等情形的，应当及时报告县级人民政府古树名木主管部门，县级人民政府古树名木主管部门应当及时组织现场调查，并对所涉古树名木采取救治、复壮等措施。 第十四条 禁止采伐古树名木。 因重大植物疫情防控、抢险救灾等特殊紧急情形，依法采取应急处置措施采伐古树名木的，县级人民政府有关部门应当及时通知县级人民政府古树名木主管部门。县级人民政府古树名木主管部门应当在应急处置工作结束后30日内将有关情况逐级报告至省、自治区、直辖市人民政府古树名木主管部门。涉及实行一级保护的古树和名木的，省、自治区、直辖市人民政府古树名木主管部门应当报告国务院古树名木主管部门。 第十五条 古树名木原则上实行原地保护，不得移植。有下列情形之一，确需移植古树名木的，建设单位应当提出移植申请并提交相应的移植和养护方案，按照涉及古树名木的最高保护等级，经认定该古树名木的县级以上地方人民政府古树名木主管部门审核并报本级人民政府批准： （一）国家能源、交通、水利、军事设施等重点建设项目选址确实无法避让古树名木； （二）省、自治区、直辖市能源、交通、水利等重点建设项目选址确实无法避让实行二级保护、三级保护的古树； （三）其他基础设施建设项目选址确实无法避让实行三级保护的古树。 古树名木的生长状况可能危害公众生命安全，采取修剪、支撑等防护措施仍无法消除安全隐患的，由县级人民政府古树名木主管部门提出相应的移植和养护方案，按照管理权限报有关人民政府批准。 第十六条 移植古树名木应当就近实施。 古树名木移植，属于本条例第十五条第一款规定情形的，移植费用和移植后5年内的养护费用由建设单位承担；属于本条例第十五条第二款规定情形的，移植费用和移植后5年内的养护费用由有关县级人民政府承担。 第十七条 任何单位、个人不得实施下列损害古树名木及其生长环境的行为： （一）买卖、运输、加工非法采伐、移植的古树名木； （二）挖根、剥损树皮、过度修剪枝干； （三）向古树名木灌注有毒有害物质； （四）在古树名木保护范围内铺设非通透性硬化地面、使用明火、堆放重物、倾倒易燃易爆物品或者有毒有害物质； （五）在古树名木上刻划、架设线缆、缠绕或者悬挂物体等，攀爬古树名木； （六）破坏古树名木保护设施、保护标志； （七）其他损害古树名木及其生长环境的行为。 第十八条 建设项目选址、建设，应当避开古树名木保护范围；因特殊情况不能避开，确需在古树名木保护范围内新建、扩建建筑物、构筑物或者铺设管线的，应当在施工前报告县级以上地方人民政府古树名木主管部门，并按照要求采取必要的工程措施，尽可能减轻对古树名木及其生长环境的损害。 古树名木保护范围内已有的建筑物、构筑物、管线等，不符合古树名木保护要求的，县级人民政府应当有计划地组织治理。 古树名木保护与文物保护相关时，由县级以上地方人民政府古树名木主管部门和文物主管部门共同制定保护措施。 第十九条 在不损害古树名木及其生长环境的前提下，可以开展下列活动： （一）合理利用古树名木资源开展保护技术、遗传育种、生物学等科学研究，推广应用科研成果； （二）结合历史文化名镇名村、历史文化街区、传统村落以及传统节庆、民俗，挖掘古树名木的历史和文化价值； （三）开展科普宣教，促进古树名木资源与生态旅游融合发展； （四）古树名木属于传统经济树种的，相关权利人依法开展必要的生产经营活动。 第二十条 古树名木死亡的，由认定该古树名木的县级以上地方人民政府古树名木主管部门组织确认、查明原因并提出处置意见报本级人民政府；具有原地保留价值的，予以保留，并根据实际情况采取必要的保护措施。 第二十一条 县级以上地方人民政府古树名木主管部门应当建立古树名木分级保护巡查制度，根据古树名木的保护等级、分布地域、长势情况等确定巡查周期，定期开展巡查。 对位于偏远地区和交通不便地区的古树名木，县级以上人民政府古树名木主管部门可以利用大数据、卫星遥感、无人机等技术手段开展动态监控。 第二十二条 国务院古树名木主管部门应当建立古树名木保护管理信息平台。 县级以上地方人民政府古树名木主管部门应当及时将本行政区域内的古树名木数据信息归集至古树名木保护管理信息平台。 第二十三条 县级以上人民政府古树名木主管部门依照本条例规定，按照职责分工对古树名木保护管理等活动进行监督检查，有权采取下列措施： （一）询问被检查单位、个人，要求其对与监督检查事项有关的情况作出说明； （二）进行现场检查； （三）查阅、复制有关文件、资料，对可能被转移、销毁、隐匿或者篡改的文件、资料予以封存； （四）查封、扣押涉嫌违法活动的场所、设施或者财物。 县级以上人民政府古树名木主管部门依法进行监督检查，有关单位、个人应当予以配合，不得拒绝、阻碍。 第二十四条 对古树名木保护管理工作不力、问题突出的地区，国务院古树名木主管部门可以约谈有关地方人民政府及其有关部门主要负责人，要求其采取措施及时整改。 古树名木保护管理情况，应当纳入领导干部自然资源资产离任审计。 第二十五条 国务院古树名木主管部门、县级以上地方人民政府及其古树名木主管部门、其他有关部门的工作人员在古树名木保护管理工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分。 第二十六条 违反本条例规定，采伐、移植古树名木的，由县级以上地方人民政府古树名木主管部门责令停止违法行为、采取补救措施，没收违法所得，并依照下列规定处以罚款： （一）涉及实行一级保护的古树和名木的，处每株50万元以上100万元以下的罚款； （二）涉及实行二级保护的古树的，处每株20万元以上50万元以下的罚款； （三）涉及实行三级保护的古树的，处每株10万元以上20万元以下的罚款。 违反本条例规定，损害古树名木及其生长环境，造成古树名木死亡的，依照前款规定处罚。 第二十七条 有本条例第十七条第一项、第二项、第三项、第四项规定行为之一的，由县级
