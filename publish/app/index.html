层拥有两到三个房间。与其朴实的外墙相反，土楼内部是为舒适\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.424Z"},{"slug":"case-20071201-ffc308d0","title":"中国南方喀斯特（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2007-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1248","summary":"中国南方喀斯特位于中国，2007年列入联合国教科文组织《世界遗产名录》，列入标准为(vii)(viii)，遗产类型为自然遗产。名录坐标：北纬24.7178，东经103.3442。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：中国南方喀斯特 英文名称：South China Karst 国家/地区：中国 列入年份：2007 世界遗产标准：(vii)(viii) 遗产类型：自然遗产 所属区域：Asia and the Pacific 名录坐标：24.7177777778, 103.344166667 名录编号：1248 官方页面：https://whc.unesco.org/en/list/1248\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;中国南方喀斯特是世界上最壮观的湿热带-亚热带喀斯特景观之一，分布在贵州、广西、云南、重庆等省，占地面积共计97，125公顷。它包含了最重要的岩溶地貌类型，包括塔状岩溶，尖顶岩溶和锥形岩溶地层，以及其他壮观的特征，如天然桥梁，峡谷和大型洞穴系统。石林被公认为世界上最具参考价值的最高等级自然现象。荔波的锥体和塔状溶岩也被认为是这些岩溶类型的世界参考点，形成了独特而美丽的景观。武隆喀斯特因其巨大的落水洞、天然桥梁和洞窟而入选。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.523Z"},{"slug":"case-20071201-549c67ad","title":"开平碉楼与村落（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2007-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1112","summary":"开平碉楼与村落位于中国，2007年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iii)(iv)，遗产类型为文化遗产。名录坐标：北纬22.2588，东经112.5257。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：开平碉楼与村落 英文名称：Kaiping Diaolou and Villages 国家/地区：中国 列入年份：2007 世界遗产标准：(ii)(iii)(iv) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：22.258774, 112.525727 名录编号：1112 官方页面：https://whc.unesco.org/en/list/1112\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;开平碉楼与村落以广东省开平市用于防卫的多层塔楼式乡村民居——雕镂而著称，展现了中西建筑和装饰形式复杂而灿烂的融合，表现了19世纪末及20世纪初开平侨民在几个南亚国家、澳洲以及北美国家发展进程中的重要作用，以及海外开平人与其故里的密切联系。此次收录的遗产包括四组共计20座碉楼，是村落群中近1800座塔楼的代表，代表了近五个世纪塔楼建筑的颠峰，也展现了散居国外的华侨与故土之间仍然紧密的联系。这些建筑分为三种形式：由若干户人家共同兴建的众楼，为临时避难之用，现存473座；由富有人家独自建造的居楼，同时具有防卫和居住的功能，现存1149座；以及出现时间最晚的更楼，为联防预警之用，现存221座。也\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.399Z"},{"slug":"case-20061201-5bbc7975","title":"四川大熊猫栖息地（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2006-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1213","summary":"四川大熊猫栖息地位于中国，2006年列入联合国教科文组织《世界遗产名录》，列入标准为(x)，遗产类型为自然遗产。名录坐标：北纬30.8333，东经103.0000。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：四川大熊猫栖息地 英文名称：Sichuan Giant Panda Sanctuaries - Wolong, Mt Siguniang and Jiajin Mountains 国家/地区：中国 列入年份：2006 世界遗产标准：(x) 遗产类型：自然遗产 所属区域：Asia and the Pacific 名录坐标：30.8333333333, 103.0 名录编号：1213 官方页面：https://whc.unesco.org/en/list/1213\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;四川大熊猫栖息地面积924 500平方公里，目前全世界30%以上的濒危野生大熊猫都生活在那里，包括邛崃山和夹金山的七个自然保护区和九个景区，是全球最大、最完整的大熊猫栖息地，为第三纪原始热带森林遗迹，也是最重要的圈养大熊猫繁殖地。这里也是小熊猫、雪豹及云豹等全球严重濒危动物的栖息地。栖息地还是世界上除热带雨林以外植物种类最丰富的地区之一，生长着属于1000多个属种的5000到6000种植物。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.499Z"},{"slug":"case-20061201-d49a874d","title":"殷墟（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2006-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1114","summary":"殷墟位于中国，2006年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iii)(iv)(vi)，遗产类型为文化遗产。名录坐标：北纬36.1220，东经114.3252。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：殷墟 英文名称：Yin Xu 国家/地区：中国 列入年份：2006 世界遗产标准：(ii)(iii)(iv)(vi) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：36.121978, 114.325162 名录编号：1114 官方页面：https://whc.unesco.org/en/list/1114\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;殷墟考古遗址靠近安阳市，位于北京以南约500公里处，是商代晚期（公元前1300至1046年）的古代都城，代表了中国早期文化、工艺和科学的黄金时代，是中国青铜器时代最繁荣的时期。在殷墟遗址出土了大量王室陵墓、宫殿以及中国后期建筑的原型。遗址中的宫殿宗庙区（1000米×650米）拥有80处房屋地基，还有唯一一座保存完好的商代王室成员大墓“妇好墓”。殷墟出土的大量工艺精美的陪葬品证明了商代手工业的先进水平，现在它们是中国的国宝之一。在殷墟发现了大量甲骨窖穴。甲骨上的文字对于证明中国古代信仰、社会体系以及汉字这一世界上最古老的书写体系之一的发展有着不可估量的价值。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.449Z"},{"slug":"case-20051201-28f81ba9","title":"澳门历史城区（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2005-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1110","summary":"澳门历史城区位于中国，2005年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iii)(iv)(vi)，遗产类型为文化遗产。名录坐标：北纬22.1911，东经113.5364。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：澳门历史城区 英文名称：Historic Centre of Macao 国家/地区：中国 列入年份：2005 世界遗产标准：(ii)(iii)(iv)(vi) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：22.1911111111, 113.5363888889 名录编号：1110 官方页面：https://whc.unesco.org/en/list/1110\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;澳门是一个繁华兴盛的港口，在国际贸易发展中有着重要的战略地位。从16世纪中叶开始，澳门就处于葡萄牙统治之下，直到1999年中国对澳门恢复行使主权。澳门历史城区保留着葡萄牙和中国风格的古老街道、住宅、宗教和公共建筑，见证了东西方美学、文化、建筑和技术影响力的交融。城区还保留了一座堡垒和一座中国最古老的灯塔。此城区是在国际贸易蓬勃发展的基础上，中西方交流最早且持续沟通的见证。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (ii):&lt;/em&gt; The strategic location of Macao on the Chinese territory, and the special relationship established between the Chinese and Portuguese authorities favoured an important interchange of human values in the various fields of culture, sciences, technology, art and architecture over several centuries.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iii): &lt;/em&gt; Macao bears a unique testimony to the first and longest-lasting encounter between the West and China. From the 16th to the 20th centuries, it was the focal point for traders and missionaries, and the different fields of learning. The impact of this encounter can be traced in the fusion of different cultures that characterise the historic core zone of Macao.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iv): &lt;/em&gt; Macao represents an outstanding example of an architectural ensemble that illustrates the development of the encounter between the Western and Chinese civilisations over some four and half centuries, represented in the historical route, with a series of urban spaces and architectural ensembles, that links the ancient Chinese port with the Portuguese city.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (vi): &lt;/em&gt; Macao has been associated with the exchange of a variety\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.340Z"},{"slug":"case-20041201-7545a9fb","title":"瓦尔•迪奥西亚公园文化景观（意大利）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2004-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"意大利","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1026","summary":"瓦尔•迪奥西亚公园文化景观位于意大利，2004年列入联合国教科文组织《世界遗产名录》，列入标准为(iv)(vi)，遗产类型为文化遗产。名录坐标：北纬43.0667，东经11.5500。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：瓦尔•迪奥西亚公园文化景观 英文名称：Val d&amp;apos;Orcia 国家/地区：意大利 列入年份：2004 世界遗产标准：(iv)(vi) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：43.06666667, 11.55 名录编号：1026 官方页面：https://whc.unesco.org/en/list/1026\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;瓦尔·迪奥西亚公园文化景观是西耶那农业腹地的一部分。为了反映理想化的良好治理模式并创造一幅令人愉悦的美景，在公元14和15世纪划入城市国家领土时进行了重新规划和开发。灰白色的平原上耸立着点点突起的圆锥形小山峰，上面散布着一些定居点，这景致给人一种与众不同的美感。瓦尔·迪奥西亚的景观是文艺复兴时期农业美景得到良好管理的证明。列入《世界文化遗产名录》的景点包括:反映创造性土地管理体系的田园景象、小镇和村庄、通往罗马的法兰西珍那古道及其沿途的修道院、客栈、神殿和桥等。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (iv):&lt;/em&gt; The Val d’Orcia is an exceptional reflection of the way the landscape was re-written in Renaissance times to reflect the ideals of good governance and to create an aesthetically pleasing pictures.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (vi):&lt;/em&gt; The landscape of the Val d’Orcia was celebrated by painters from the Siennese School, which flourished during the Renaissance. Images of the Val d’Orcia, and particularly depictions of landscapes where people are depicted as living in harmony with nature, have come to be seen as icons of the Renaissance and have profoundly influenced the development of landscape thinking.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:13.153Z"},{"slug":"case-20041201-19a5fa75","title":"弗兰格尔岛自然保护区（俄罗斯联邦）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2004-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"俄罗斯联邦","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1023","summary":"弗兰格尔岛自然保护区位于俄罗斯联邦，2004年列入联合国教科文组织《世界遗产名录》，列入标准为(ix)(x)，遗产类型为自然遗产。名录坐标：北纬71.1889，东经-179.7153。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：弗兰格尔岛自然保护区 英文名称：Natural System of Wrangel Island Reserve 国家/地区：俄罗斯联邦 列入年份：2004 世界遗产标准：(ix)(x) 遗产类型：自然遗产 所属区域：Europe and North America 名录坐标：71.18888889, -179.7152778 名录编号：1023 官方页面：https://whc.unesco.org/en/list/1023\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;弗兰格尔岛自然保护区位于北极圈内，包括弗兰格尔岛（7,608平方公里）、赫洛德岛（11平方公里）的山地及其附近水域。该区在第四纪冰河时期没有受到冰河的作用，所以有丰富的生物多样性。这里有世界上最大的太平洋海象群，最高密度的古代北极熊牙齿，是从墨西哥海湾迁徙来的灰鲸的主要觅食地和100种候鸟的最北端筑巢地。在这些鸟类中，许多已经处于濒危状态。目前，已经确认岛上有417种类的维管植物，是北极圈内其他岛上植物种类的两倍，多于其他任何一个北极的岛屿。有些物种源于广泛分布的大陆性植物，另外一些是近年来植物杂交的产物，23种为地方特有。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (ix):&lt;/em&gt; The Wrangel Island Reserve is a self-contained island ecosystem and there is ample evidence that it has undergone a long evolutionary process uninterrupted by the glaciation that swept most other parts of the Arctic during the Quaternary period. The number and type of endemic plant species, the diversity within plant communities, the rapid succession and mosaic of tundra types, the presence of relatively recent mammoth tusks and skulls, the range of terrain types and geological formations in the small geographic space are all visible evidence of Wrangel’s rich natural history and its unique evolutionary status within the Arctic. Furthermore, the process is continuing as can be observed in, for example, the unusually high densities and distinct behaviours of the Wrangel lemming populations in comparison with other Arctic populations or in the physical adaptations of the Wrangel Island reindeers, where they may now have evolved into a separate population from their mainland cousins. Species interaction strategies are highly-honed and on display throughout the island, especially near Snowy owl nests which act as protectorates for other species and beacons f\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:13.082Z"},{"slug":"case-20041201-7531a7cc","title":"开普植物保护区（南非）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2004-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"南非","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1007","summary":"开普植物保护区位于南非，2004年列入联合国教科文组织《世界遗产名录》，列入标准为(ix)(x)，遗产类型为自然遗产。名录坐标：北纬-34.3558，东经18.4750。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：开普植物保护区 英文名称：Cape Floral Region Protected Areas 国家/地区：南非 列入年份：2004 世界遗产标准：(ix)(x) 遗产类型：自然遗产 所属区域：Africa 名录坐标：-34.3558051153, 18.4750321846 名录编号：1007 官方页面：https://whc.unesco.org/en/list/1007\u003c/p>\n\u003cp>【官方描述】 该处遗产地位于南非最西南端，于2004年载入世界遗产名录。是世界陆上生态多样性最丰富的中心之一。该扩展遗产地包括国家公园、自然保护区、野生自然保护区、国家森林公园和山区汇水盆地。这些不同的地形为当地的细硬叶凡波斯灌木植被增添了适应地中海式气候和周期性火灾的特征，形成开普植物保护区独有的景观。\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.357Z"},{"slug":"case-20041201-8bf8c99b","title":"高句丽王城、王陵及贵族墓葬（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2004-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1135","summary":"高句丽王城、王陵及贵族墓葬位于中国，2004年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(ii)(iii)(iv)(v)，遗产类型为文化遗产。名录坐标：北纬41.1387，东经126.1762。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：高句丽王城、王陵及贵族墓葬 英文名称：Capital Cities and Tombs of the Ancient Koguryo Kingdom 国家/地区：中国 列入年份：2004 世界遗产标准：(i)(ii)(iii)(iv)(v) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：41.1387222222, 126.176194444 名录编号：1135 官方页面：https://whc.unesco.org/en/list/1135\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;此遗址包括3座王城和40座墓葬的考古遗迹：五女山城、国内城、丸都山城，14座王陵及26座贵族墓葬。这些都属于高句丽文化，从公元前37年到公元668年，高句丽王朝一直统治中国北部地区和朝鲜半岛的北部，这里的文化因此而得名。五女山城是唯一部分挖掘的王城。国内城位于今天的集安市内，在高句丽迁都平壤之后，与其他王城相互依附共为都城。丸都山城是高句丽王朝的都城之一，城内有许多遗迹，其中包括一座雄伟的宫殿和37座墓葬。一些墓葬的顶部设计精巧，无需支柱就可支撑宽敞的墓室，还能承载置于其上的石冢或土冢。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (i):&lt;/em&gt; The tombs represent a masterpiece of the human creative genius in their wall paintings and structures.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (ii):&lt;/em&gt; The Capital Cities of the Koguryo Kingdom are an early example of mountain cities, later imitated by neighbouring cultures. The tombs, particularly the important stele and a long inscription in one of the tombs, show the impact of Chinese culture on the Koguryo (who did not develop their own writing). The paintings in the tombs, while showing artistic skills and specific style, are also an example for strong impact from other cultures.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iii):&lt;/em&gt; The Capital Cities and Tombs of the Ancient Koguryo Kingdom represent exceptional testimony to the vanished Koguryo civilization.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iv):&lt;/em&gt; The system of capital cities represented by Guonei City and Wandu Mountain City also influenced the construction of later capitals built by the Koguryo regime; the Koguryo tombs provide outstanding examples of the evolution of piled-stone and earthen tomb construction.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (v):&lt;/em&gt; The capital cities of the Koguryo Kingdom represent a perfect blending of human creation and nature wh\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.482Z"},{"slug":"case-20031201-bd15876c","title":"云南三江并流保护区（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2003-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1083","summary":"云南三江并流保护区位于中国，2003年列入联合国教科文组织《世界遗产名录》，列入标准为(vii)(viii)(ix)(x)，遗产类型为自然遗产。名录坐标：北纬27.8950，东经98.4064。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：云南三江并流保护区 英文名称：Three Parallel Rivers of Yunnan Protected Areas 国家/地区：中国 列入年份：2003 世界遗产标准：(vii)(viii)(ix)(x) 遗产类型：自然遗产 所属区域：Asia and the Pacific 名录坐标：27.895, 98.40638889 名录编号：1083 官方页面：https://whc.unesco.org/en/list/1083\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;三江并流国家公园，位于云南省西北部山脉地区，涵盖范围达170万公顷， 境内包含8处地理集群保护地。 亚洲三条主要大河的上游：长江上游（金沙江）， 澜沧江（湄公河上游）及怒江（萨尔温江上游）在这一境内由北至南，穿越3000米深陡峭的峡谷和高达6000米的高山，并行奔流数百公里而不相交。它是中国乃至全世界生物多样性最丰富的地区之一。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion (vii): Superlative natural phenomena or natural beauty and aesthetic importance The deep, parallel gorges of the Jinsha, Lancang and Nu Jiang are the outstanding natural feature of the site; while large sections of the three rivers lie just outside the site boundaries, the river gorges are nevertheless the dominant scenic element in the area. High mountains are everywhere, with the glaciated peaks of the Meili, Baima and Haba Snow Mountains providing a spectacular scenic skyline. The Mingyongqia Glacier is a notable natural phemonenon, descending to 2700 m altitude from Mt Kawagebo (6740 m), and is claimed to be the gla cier descending to the lowest altitude for such a low latitude (28Â° N) in the northern hemisphere. Other outstanding scenic landforms are the alpine karst (especially the &#39;stone moon&#39; in the Moon Mountain Scenic Area above the Nu Jiang Gorge) and the &#39;tortoise shell&#39; weathering of the alpine Danxia.&lt;/p&gt; &lt;p&gt;Criterion (viii): The property is of outstanding value for displaying the geological history of the last 50 million years associated with the collision of the Indian Plate with the Eurasian Plate, the closure of the ancient Tethys Sea, and the uplift\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.323Z"},{"slug":"case-20021201-295d6dac","title":"晚期的巴洛克城镇瓦拉迪那托（西西里东南部）（意大利）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2002-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"意大利","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1024","summary":"晚期的巴洛克城镇瓦拉迪那托（西西里东南部）位于意大利，2002年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(ii)(iv)(v)，遗产类型为文化遗产。名录坐标：北纬36.7924，东经14.7057。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：晚期的巴洛克城镇瓦拉迪那托（西西里东南部） 英文名称：Late Baroque Towns of the Val di Noto (South-Eastern Sicily) 国家/地区：意大利 列入年份：2002 世界遗产标准：(i)(ii)(iv)(v) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：36.7924166667, 14.7057222222 名录编号：1024 官方页面：https://whc.unesco.org/en/list/1024\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;西西里岛东南部的八座城镇——卡尔塔吉罗内、米利泰洛瓦尔迪卡塔尼亚、卡塔尼亚、莫迪卡、诺托、帕拉佐洛、拉古萨和希克利——均于1693年地震后，在当时城镇的原址或其附近重建。这些城镇体现了一项规模宏大的集体重建工程，在建筑和艺术方面取得了卓越成就。它们既延续了当时的晚期巴洛克风格，又在城镇规划和城市建筑方面展现出独特的创新。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (i):&lt;/em&gt; This group of towns in south-eastern Sicily provides outstanding testimony to the exuberant genius of late Baroque art and architecture.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (ii):&lt;/em&gt; The towns of the Val di Noto represent the culmination and final flowering of Baroque art in Europe.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iv):&lt;/em&gt; The exceptional quality of the late Baroque art and architecture in the Val di Noto lies in its geographical and chronological homogeneity, as well as its quantity, the result of the 1693 earthquake in this region.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (v):&lt;/em&gt; The eight towns of south-eastern Sicily that make up this nomination, which are characteristic of the settlement pattern and urban form of this region, are permanently at risk from earthquakes and eruptions of Mount Etna.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:13.103Z"},{"slug":"case-20011201-a25ede0e","title":"法伦的大铜山采矿区（瑞典）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2001-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"瑞典","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1027","summary":"法伦的大铜山采矿区位于瑞典，2001年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iii)(v)，遗产类型为文化遗产。名录坐标：北纬60.6047，东经15.6308。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：法伦的大铜山采矿区 英文名称：Mining Area of the Great Copper Mountain in Falun 国家/地区：瑞典 列入年份：2001 世界遗产标准：(ii)(iii)(v) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：60.60472, 15.63083 名录编号：1027 官方页面：https://whc.unesco.org/en/list/1027\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;法伦大矿坑庞大的开采挖掘是其最惊人的景观，表现了该地区的采矿活动至少开始于13世纪。17世纪开始规划的法伦镇有许多精美的历史性建筑，加之达拉纳地区工业经济时代和家庭经济时代的大量居民遗址，展示给世人一幅几个世纪前世界上最重要的采矿区的生动画面。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (ii):&lt;/em&gt; Copper mining at Falun was influenced by German technology, but this was to become the major producer of copper in the 17th century and exercised a profound influence on mining technology in all parts of the world for two centuries.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iii):&lt;/em&gt; The entire Falun landscape is dominated by the remains of copper mining and production, which began as early as the 9th century and came to an end in the closing years of the 20th century.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (v):&lt;/em&gt; The successive stages in the economic and social evolution of the copper industry in the Falun region, from a form of “cottage industry” to full industrial production, can be seen in the abundant industrial, urban, and domestic remains characteristic of this industry that still survive.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:13.186Z"},{"slug":"case-20011201-e659ac22","title":"提沃利城的伊斯特别墅（意大利）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2001-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"意大利","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1025","summary":"提沃利城的伊斯特别墅位于意大利，2001年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(ii)(iii)(iv)(vi)，遗产类型为文化遗产。名录坐标：北纬41.9639，东经12.7963。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：提沃利城的伊斯特别墅 英文名称：Villa d&amp;apos;Este, Tivoli 国家/地区：意大利 列入年份：2001 世界遗产标准：(i)(ii)(iii)(iv)(vi) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：41.96391667, 12.79625 名录编号：1025 官方页面：https://whc.unesco.org/en/list/1025\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;提沃利城的伊斯特别墅及其宫殿和花园，全面系统而鲜明地反映了最精致的文艺复兴文化。别墅独具匠心的设计以及它花园里的建筑组成部分（喷泉、装饰水池等）构成了一个典型的16世纪意大利花园。伊斯特别墅是欧洲花园发展的一个早期模型。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (i):&lt;/em&gt; The Villa d’Este is one of the most outstanding examples of Renaissance culture at its apogee.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (ii):&lt;/em&gt; The gardens of the Villa d’Este had a profound influence on the development of garden design throughout Europe.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iii):&lt;/em&gt; The principles of Renaissance design and aesthetics are illustrated in an exceptional manner by the gardens of the Villa d’Este.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iv):&lt;/em&gt; The gardens of the Villa d’Este are among the earliest and finest of the &lt;em&gt;giardini delle meraviglie&lt;/em&gt; and symbolize the flowering of Renaissance culture.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:13.132Z"},{"slug":"case-20011201-ad01bde7","title":"巴干达国王们的卡苏比陵（乌干达）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2001-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"乌干达","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1022","summary":"巴干达国王们的卡苏比陵位于乌干达，2001年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(iii)(iv)(vi)，遗产类型为文化遗产。名录坐标：北纬0.3297，东经32.5542。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：巴干达国王们的卡苏比陵 英文名称：Tombs of Buganda Kings at Kasubi 国家/地区：乌干达 列入年份：2001 世界遗产标准：(i)(iii)(iv)(vi) 遗产类型：文化遗产 所属区域：Africa 名录坐标：0.3297128643, 32.5542099716 名录编号：1022 官方页面：https://whc.unesco.org/en/list/1022\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;巴干达国王们的卡苏比陵，位于坎帕拉的一座面积有30公顷的小山上，山上大部分地区以农业为主，当地人以传统方式耕种这里的土地。山腰的中心地带是过去巴干达王国的王宫，建成于1882年，1884年以后成为皇家墓地。穹隆屋顶的陵墓主建筑内有四位皇室成员的墓，都呈圆形。卡苏比陵是最原始材料建筑的典范，主要由树木、稻草、芦杆、 篱笆条等材料建成。卡苏比陵的主要意义在于其所体现的精神价值、信仰价值、连续性和一种归属感。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion i The Kasubi Tombs site is a masterpiece of human creativity both in its conception and its execution. Criterion iii The Kasubi Tombs site bears eloquent witness to the living cultural traditions of the Baganda. Criterion iv The spatial organization of the Kasubi Tombs site represents the best extant example of a Baganda palace/architectural ensemble. Built in the finest traditions of Ganda architecture and palace design, it reflects technical achievements developed over many centuries. Criterion vi The built and natural elements of the Kasubi Tombs site are charged with historical, traditional, and spiritual values. It is a major spiritual centre for the Baganda and is the most active religious place in the kingdom.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:13.040Z"},{"slug":"case-20011201-f788ca1b","title":"措迪洛山（博茨瓦纳）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2001-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"博茨瓦纳","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1021","summary":"措迪洛山位于博茨瓦纳，2001年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(iii)(vi)，遗产类型为文化遗产。名录坐标：北纬-18.7500，东经21.7333。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：措迪洛山 英文名称：Tsodilo 国家/地区：博茨瓦纳 列入年份：2001 世界遗产标准：(i)(iii)(vi) 遗产类型：文化遗产 所属区域：Africa 名录坐标：-18.75, 21.73333333 名录编号：1021 官方页面：https://whc.unesco.org/en/list/1021\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;被誉为“沙漠卢浮宫”的措迪洛山是世界上岩石艺术最集中的地区之一。在卡拉哈里沙漠(Kalahari Desert)仅10平方公里的地方就保存了4500多幅绘画作品。这个地区的考古发现按年代顺序记载了至少10万年间的人类活动和环境变化。恶劣环境中生存的当地居民十分敬畏措迪洛山，将其作为对祖先神灵的膜拜之地。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;strong&gt;Criterion i:&lt;/strong&gt; For many thousands of years the rocky outcrops of Tsodilo in the harsh landscape of the Kalahari Desert have been visited and settled by humans, who have left rich traces of their presence in the form of outstanding rock art.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Criterion iii:&lt;/strong&gt; Tsodilo is a site that has witnessed visits and settlement by successive human communities for many millennia.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Criterion vi: &lt;/strong&gt;The Tsodilo outcrops have immense symbolic and religious significance for the human communities who continue to survive in this hostile environment.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.948Z"},{"slug":"case-20011201-8308b7c7","title":"巴西大西洋群岛：费尔南多－迪诺罗尼亚群岛和罗卡斯岛保护区（巴西）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2001-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"巴西","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1000","summary":"巴西大西洋群岛：费尔南多－迪诺罗尼亚群岛和罗卡斯岛保护区位于巴西，2001年列入联合国教科文组织《世界遗产名录》，列入标准为(vii)(ix)(x)，遗产类型为自然遗产。名录坐标：北纬-3.8579，东经-32.4251。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：巴西大西洋群岛：费尔南多－迪诺罗尼亚群岛和罗卡斯岛保护区 英文名称：Brazilian Atlantic Islands: Fernando de Noronha and Atol das Rocas Reserves 国家/地区：巴西 列入年份：2001 世界遗产标准：(vii)(ix)(x) 遗产类型：自然遗产 所属区域：Latin America and the Caribbean 名录坐标：-3.8579444444, -32.4251111111 名录编号：1000 官方页面：https://whc.unesco.org/en/list/1000\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;南大西洋露出海面的海底山脉形成了费尔南多－迪诺罗尼亚群岛和巴西沿海的罗卡环形礁。这个区域包括了南大西洋大部分岛屿，对于鲔鱼、鲨鱼、海龟和海洋哺乳动物的生长和繁衍具有重要意义。巴西大西洋群岛也是西大西洋上热带海鸟最集中的地方。在拜亚海区生活有大量海豚，在落潮期，罗卡环形礁给游客展示出一幅怡人的海岸美景，泻湖和潮水坑星罗棋布，里面还有各种鱼类。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (ix):&lt;/em&gt; FNNMP/AdRBR represents over half the insular coastal waters of the Southern Atlantic Ocean. These highly productive waters provide feeding ground for species such as tuna, billfish, cetaceans, sharks, and marine turtles as they migrate to the Eastern Atlantic coast of Africa. An oasis of marine life in relatively barren, open ocean, the islands play a key role in the process of reproduction, dispersal and colonisation by marine organisms in the entire Tropical South Atlantic.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (vii)&lt;/em&gt;: Baía dos Golfinhos is the only know place in the world with such a high population of resident dolphins and Atoll das Rocas demonstrates a spectacular seascape at low tide when the exposed reef surrounding shallow lagoons and tidal pools forms a natural aquarium. Both sites have also exceptional submarine landscapes that have been recognised worldwide by a number of specialised diving literatures.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (x):&lt;/em&gt; FNNMP/AdRBR is a key site for the protection of biodiversity and endangered species in the Southern Atlantic. Providing a large proportion of the insular habitat of the South Atlantic, the site is a repository for the maintena\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.216Z"},{"slug":"case-20011201-368fb27a","title":"云岗石窟（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2001-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1039","summary":"云岗石窟位于中国，2001年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(ii)(iii)(iv)，遗产类型为文化遗产。名录坐标：北纬40.1097，东经113.1222。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：云岗石窟 英文名称：Yungang Grottoes 国家/地区：中国 列入年份：2001 世界遗产标准：(i)(ii)(iii)(iv) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：40.10972, 113.12222 名录编号：1039 官方页面：https://whc.unesco.org/en/list/1039\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;云岗石窟，位于山西省大同市，现存洞窟252座、石像51 000尊，代表了5世纪至6世纪时期中国高超的佛教艺术成就。“昙曜五窟”整体布局严整，风格和谐统一，是中国佛教艺术发展史的第一个巅峰。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion (i): The assemblage of statuary of the Yungang Grottoes is a masterpiece of early Chinese Buddhist cave art.&lt;/p&gt; &lt;p&gt;Criterion (ii): The Yungang cave art represent the successful fusion of Buddhist religious symbolic art from south and central Asia with Chinese cultural traditions, starting in the 5th century CE under Imperial auspices.&lt;/p&gt; &lt;p&gt;Criterion (iii): The power and endurance of Buddhist belief in China are vividly illustrated by the Yungang grottoes.&lt;/p&gt; &lt;p&gt;Criterion (iv): The Buddhist tradition of religious cave art achieved its first major impact at Yungang, where it developed its own distinct character and artistic power.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.299Z"},{"slug":"case-20001201-e2b6ee91","title":"苏里南中心自然保护区（苏里南）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"苏里南","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1017","summary":"苏里南中心自然保护区位于苏里南，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(ix)(x)，遗产类型为自然遗产。名录坐标：北纬4.0000，东经-56.5000。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：苏里南中心自然保护区 英文名称：Central Suriname Nature Reserve 国家/地区：苏里南 列入年份：2000 世界遗产标准：(ix)(x) 遗产类型：自然遗产 所属区域：Latin America and the Caribbean 名录坐标：4.0, -56.5 名录编号：1017 官方页面：https://whc.unesco.org/en/list/1017\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;苏里南中心自然保护区占地面积为160万公顷，这里生长着苏里南中西部地区所特有的原始热带雨林，对科珀纳默上游和很多河流，吕西河、奥斯特河、泽伊德河、萨拉马卡河和格兰里奥河的源头都起着重要的保护作用，保护区里存在着多种原始地形和生态系统，具有十分显著的保护价值。苏里南中心自然保护区山地森林和低地森林里植物种类繁多，目前发现的维管植物种类已经超过五千种。保护区里还生存有许多当地特有的动物，其中有美洲虎、巨犰狳、大河水獭、貘、树獭和8种灵长类动物，这里还栖息着400多种鸟类，有哈痞鹰、圭亚那动冠散鸟以及深红色金刚鹦鹉等。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criteria (ix) and (x):&lt;/em&gt; The site encompasses significant vertical relief, topography and soil conditions that have resulted in a variety of ecosystems. This ecosystem variation allows organisms within these ecosystems to move in response to disturbance, adapt to change and maintain gene flow between populations. The site’s size, undisturbed state (in general a rare condition in Amazonian forest parks) and protection of the entire Coppename watershed, will allow long-term functioning of the ecosystem. The site contains a high diversity of plant and animal species, many of which are endemic to the Guyana Shield and are globally threatened.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.790Z"},{"slug":"case-20001201-c71dd8b3","title":"阿雷基帕城历史中心（秘鲁）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"秘鲁","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1016","summary":"阿雷基帕城历史中心位于秘鲁，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(iv)，遗产类型为文化遗产。名录坐标：北纬-16.3984，东经-71.5368。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：阿雷基帕城历史中心 英文名称：Historical Centre of the City of Arequipa 国家/地区：秘鲁 列入年份：2000 世界遗产标准：(i)(iv) 遗产类型：文化遗产 所属区域：Latin America and the Caribbean 名录坐标：-16.398353, -71.536777 名录编号：1016 官方页面：https://whc.unesco.org/en/list/1016\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;秘鲁阿雷基帕城历史中心由火山岩石建成，它代表了欧洲与本土建筑技术、风格的融合，这些技术和风格体现在殖民宗主、克里奥尔人和印度人的作品中。城市灵动的城墙、拱门、拱形屋顶、院子、开阔的空间，以及建筑正面复杂的巴洛克式装饰，这些都表明了欧洲与本土风格的双重影响。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion i The ornamented architecture in the historic centre of Arequipa represents a masterpiece of the creative integration of European and native characteristics, crucial for the cultural expression of the entire region. Criterion iv The historic centre of Arequipa is an outstanding example of a colonial settlement, challenged by the natural conditions, the indigenous influences, the process of conquest and evangelization, as well as the spectacular nature of its setting.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.742Z"},{"slug":"case-20001201-069bd5e8","title":"穆鲁山国家公园（马来西亚）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"马来西亚","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1013","summary":"穆鲁山国家公园位于马来西亚，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(vii)(viii)(ix)(x)，遗产类型为自然遗产。名录坐标：北纬4.1333，东经114.9167。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：穆鲁山国家公园 英文名称：Gunung Mulu National Park 国家/地区：马来西亚 列入年份：2000 世界遗产标准：(vii)(viii)(ix)(x) 遗产类型：自然遗产 所属区域：Asia and the Pacific 名录坐标：4.13333, 114.91667 名录编号：1013 官方页面：https://whc.unesco.org/en/list/1013\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;穆鲁山国家公园，位于沙捞越州的巴婆罗岛，因其生物多样性和喀斯特地貌而闻名，世界上大多数研究喀斯特地貌的研究都在此进行。这座52 864公顷的公园包含17 个植物园，有维管植物3500多种。公园的棕榈树种类异常丰富，已知的就有20属，109种。公园位于2377米高的穆鲁山山麓，已开发的山洞至少达295公里，洞中景观壮丽，并栖息着上百万只蝙蝠。沙捞越洞穴，长600米，宽415米，高80米，是已知世界上最大的洞穴。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criteria (vii), (viii), (ix) and (x): The concentration of caves in Mulu&#39;s Melinau Formation with its geomorphic and structural characteristics is an outstanding feature which allows a greater understanding of Earth&#39;s history. The caves of Mulu are important for their classic features of underground geomorphology, demonstrating an evolutionary history of more than 1.5 million years. One of the world&#39;s finest examples of the collapse process in Karstic terrain can be also found. GMNP provides outstanding scientific opportunities to study theories on the origins of cave faunas. With its deeply-incised canyons, wild rivers, rainforest-covered mountains, spectacular limestone pinnacles, cave passages and decorations, Mulu has outstanding scenic values. GMNP also provides significant natural habitat for a wide range of plant and animal diversity both above and below ground. It is botanically-rich in species and high in endemism, including one of the richest sites in the world for palm species.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.619Z"},{"slug":"case-20001201-881db872","title":"基纳巴卢山公园（马来西亚）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"马来西亚","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1012","summary":"基纳巴卢山公园位于马来西亚，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(ix)(x)，遗产类型为自然遗产。名录坐标：北纬6.1470，东经116.6420。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：基纳巴卢山公园 英文名称：Kinabalu Park 国家/地区：马来西亚 列入年份：2000 世界遗产标准：(ix)(x) 遗产类型：自然遗产 所属区域：Asia and the Pacific 名录坐标：6.147, 116.642 名录编号：1012 官方页面：https://whc.unesco.org/en/list/1012\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;基纳巴卢山公园，位于沙巴婆罗岛北端，被喜玛拉雅山和新几内亚之间的最高的山——基纳巴卢山（4095米）所环绕。公园植被丰富，从热带低地、雨林小山到热带高山森林、亚高山森林和生活在更高海拔的灌木，应有尽有。基纳巴卢山公园被誉为东南亚植物多样性展示中心，种类极其丰富，有喜玛拉雅山、中国、澳大利亚、马来西亚，以及泛热带的各种植物。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criteria (ix) and (x): The site has a diverse biota and high endemism. The altitudinal and climatic gradient from tropical forest to alpine conditions combine with precipitous topography, diverse geology and frequent climate oscillations to provide conditions ideal for the development of new species. The Park contains high biodiversity with representatives from more than half the families of all flowering plants. The majority of Borneo’s mammals, birds, amphibians and invertebrates (many threatened and vulnerable) occur in the Park.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.566Z"},{"slug":"case-20001201-9d95c1fb","title":"埃奇米河津教堂与兹瓦尔特诺茨考古遗址（亚美尼亚）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"亚美尼亚","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1011","summary":"埃奇米河津教堂与兹瓦尔特诺茨考古遗址位于亚美尼亚，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iii)，遗产类型为文化遗产。名录坐标：北纬40.1587，东经44.3246。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：埃奇米河津教堂与兹瓦尔特诺茨考古遗址 英文名称：Cathedral and Churches of Echmiatsin and the Archaeological Site of Zvartnots 国家/地区：亚美尼亚 列入年份：2000 世界遗产标准：(ii)(iii) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：40.1586666667, 44.3246388889 名录编号：1011 官方页面：https://whc.unesco.org/en/list/1011\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;埃奇米河津教堂与兹瓦尔特诺茨考古遗址形象地展示了亚美尼亚圆顶四瓣形教堂的发展演变过程，对该地区的建筑和艺术发展都产生了深远的影响。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (ii):&lt;/em&gt; The developments in ecclesiastical architecture represented in an outstanding manner by the churches at Echmiatsin and the archaeological site of Zvartnots had a profound influence on church design over a wide region.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iii):&lt;/em&gt; The churches at Echmiatsin and the archaeological site of Zvartnots vividly depict both the spirituality and the innovatory artistic achievement of the Armenian Church from its foundation.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.523Z"},{"slug":"case-20001201-aba909b6","title":"乳香之路（阿曼）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"阿曼","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1010","summary":"乳香之路位于阿曼，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(iv)，遗产类型为文化遗产。名录坐标：北纬17.0167，东经54.0500。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：乳香之路 英文名称：Land of Frankincense 国家/地区：阿曼 列入年份：2000 世界遗产标准：(iii)(iv) 遗产类型：文化遗产 所属区域：Arab States 名录坐标：17.0166666667, 54.05 名录编号：1010 官方页面：https://whc.unesco.org/en/list/1010\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;瓦迪•道卡的乳香树和什斯尔/乌芭尔以及相关的科尔罗里和巴厘德港口的商队绿洲遗迹，都表明这里的乳香贸易繁荣了很多世纪。这项贸易在古代和中世纪是最重要的商业活动之一。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion iii The group of archaeological sites in Oman represent the production and distribution of frankincense, one of the most important luxury items of trade in the Old World in antiquity. Criterion iv The Oasis of Shishr and the entrepots of Khor Rori and Al-Balid are outstanding examples of medieval fortified settlements in the Persian Gulf region.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.491Z"},{"slug":"case-20001201-e802c933","title":"图尔奈圣母大教堂（比利时）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"比利时","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1009","summary":"图尔奈圣母大教堂位于比利时，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iv)，遗产类型为文化遗产。名录坐标：北纬50.6060，东经3.3893。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：图尔奈圣母大教堂 英文名称：Notre-Dame Cathedral in Tournai 国家/地区：比利时 列入年份：2000 世界遗产标准：(ii)(iv) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：50.60603, 3.38926 名录编号：1009 官方页面：https://whc.unesco.org/en/list/1009\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;图尔奈圣母大教堂建于12世纪上半叶，因其罗马式的中厅、柱头上的大量雕塑以及上有五座塔楼的耳堂而显得与众不同。耳堂上的那五座塔楼均为哥特式艺术风格的先驱，后重建于13世纪的高坛则是纯粹的哥特式风格。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (ii):&lt;/em&gt; The Cathedral of Notre-Dame in Tournai bears witness to a considerable exchange of influence between the architecture of the Ile de France, the Rhineland, and Normandy during the short period at the beginning of the 12th century that preceded the flowering of Gothic architecture.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iv):&lt;/em&gt; In its imposing dimensions, the Cathedral of Notre-Dame in Tournai is an outstanding example of the great edifices of the school of the north of the Seine, precursors of the vastness of the Gothic cathedrals.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.448Z"},{"slug":"case-20001201-5ddafc97","title":"古巴东南第一个咖啡种植园考古风景区（古巴）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"古巴","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1008","summary":"古巴东南第一个咖啡种植园考古风景区位于古巴，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(iv)，遗产类型为文化遗产。名录坐标：北纬20.0115，东经-75.6307。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：古巴东南第一个咖啡种植园考古风景区 英文名称：Archaeological Landscape of the First Coffee Plantations in the South-East of Cuba 国家/地区：古巴 列入年份：2000 世界遗产标准：(iii)(iv) 遗产类型：文化遗产 所属区域：Latin America and the Caribbean 名录坐标：20.011508, -75.630705 名录编号：1008 官方页面：https://whc.unesco.org/en/list/1008\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;这个座落在喜瑞拉梅斯特拉(the Sierra Maestra)丘陵间的19世纪咖啡种植园遗迹见证了在不规则土地上进行农业种植的创新形式，清晰地展示了加勒比海地区和拉丁美洲地区经济、社会和技术发展的历史。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion iii The remains of the 19th and early 20th century coffee plantations in eastern Cuba are unique and eloquent testimony to a form of agricultural exploitation of virgin forest, the traces of which have disappeared elsewhere in the world. Criterion iv The production of coffee in eastern Cuba during the 19th and early 20th centuries resulted in the creation of a unique cultural landscape, illustrating a significant stage in the development of this form of agriculture.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.410Z"},{"slug":"case-20001201-2e17f8c2","title":"斯皮耶纳新石器时代的燧石矿（比利时）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"比利时","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1006","summary":"斯皮耶纳新石器时代的燧石矿位于比利时，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(iii)(iv)，遗产类型为文化遗产。名录坐标：北纬50.4201，东经3.9823。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：斯皮耶纳新石器时代的燧石矿 英文名称：Neolithic Flint Mines at Spiennes (Mons) 国家/地区：比利时 列入年份：2000 世界遗产标准：(i)(iii)(iv) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：50.4201134823, 3.9822689106 名录编号：1006 官方页面：https://whc.unesco.org/en/list/1006\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;斯皮耶纳新石器时代的燧石矿面积达100多公顷，是欧洲最大且最早的古代矿坑汇集地。这些燧石矿的非凡在于提炼技术的多样化，及其与当时人类聚落之间的直接联系。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (i):&lt;/em&gt; The Neolithic flint mines at Spiennes provide exceptional testimony to early human inventiveness and application.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iii):&lt;/em&gt; The arrival of the Neolithic cultures marked a major milestone in human cultural and technological development, which is vividly illustrated by the vast complex of ancient flint mines at Spiennes.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iv):&lt;/em&gt; The flint mines at Spiennes are outstanding examples of the Neolithic mining of flint, which marked a seminal stage of human technological and cultural progress.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.310Z"},{"slug":"case-20001201-2b5962f6","title":"建筑师维克多•奥尔塔设计的主要城市建筑(布鲁塞尔)（比利时）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"比利时","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1005","summary":"建筑师维克多•奥尔塔设计的主要城市建筑(布鲁塞尔)位于比利时，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(ii)(iv)，遗产类型为文化遗产。名录坐标：北纬50.8242，东经4.3557。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：建筑师维克多•奥尔塔设计的主要城市建筑(布鲁塞尔) 英文名称：Major Town Houses of the Architect Victor Horta (Brussels) 国家/地区：比利时 列入年份：2000 世界遗产标准：(i)(ii)(iv) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：50.8242222222, 4.3556666667 名录编号：1005 官方页面：https://whc.unesco.org/en/list/1005\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;在布鲁塞尔，有四座出自设计名师、&amp;ldquo;新艺术运动&amp;rdquo;(Art Nouveau)最早发起人之一维克多&amp;middot;奥尔塔(Victor Horta)之手的建筑，它们分别是塔塞尔公馆(H&amp;ocirc;tel Tassel)、索勒维公馆(H&amp;ocirc;tel Solvay)、埃特维尔德公馆(H&amp;ocirc;tel van Eetvelde)和奥尔塔公馆(Maison &amp;amp; Atelier Horta)。这四座建筑是19世纪末欧洲建筑中的先锋之作。这些建筑所代表的风格革命的特点在于开放式布局、漫射的光线和装饰曲线与建筑结构的完美结合。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (i):&lt;/em&gt; The Town Houses of Victor Horta in Brussels are works of human creative genius, representing the highest expression of the influential Art Nouveau style in art and architecture.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (ii):&lt;/em&gt; The appearance of Art Nouveau in the closing years of the 19th century marked a decisive stage in the evolution of architecture, making possible subsequent developments, and the Town Houses of Victor Horta in Brussels bear exceptional witness to its radical new approach.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (iv):&lt;/em&gt; The Town Houses of Victor Horta are outstanding examples of Art Nouveau architecture brilliantly illustrating the transition from the 19th to the 20th century in art, thought, and society.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.265Z"},{"slug":"case-20001201-933bf407","title":"明清皇家陵寝（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1004","summary":"明清皇家陵寝位于中国，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(ii)(iii)(iv)(vi)，遗产类型为文化遗产。名录坐标：北纬31.0167，东经112.6500。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：明清皇家陵寝 英文名称：Imperial Tombs of the Ming and Qing Dynasties 国家/地区：中国 列入年份：2000 世界遗产标准：(i)(ii)(iii)(iv)(vi) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：31.0166666667, 112.65 名录编号：1004 官方页面：https://whc.unesco.org/en/list/1004\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;位于辽宁省的清朝盛京三陵建于17世纪，是继2000年和2003年列入《世界遗产名录》的明朝寝陵之后的三座清朝皇家寝陵，分别为永陵、福陵和昭陵，是开创满清皇室基业的皇帝及其祖先的陵墓。寝陵遵照中国传统的占卜和风水理论而建，饰以大量以龙为主题的石雕、雕刻和瓦片，展示了清朝墓葬建筑的发展。盛京三陵及其众多建筑将以前朝代的传统和满族文化的新特征融为一体。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;&lt;em&gt;Criterion (i):&lt;/em&gt; The harmonious integration of remarkable architectural groups in a natural environment chosen to meet the criteria of geomancy (Fengshui) makes the Ming and Qing Imperial Tombs masterpieces of human creative genius.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criteria (ii), (iii) and (iv):&lt;/em&gt; The imperial mausolea are outstanding testimony to a cultural and architectural tradition that for over five hundred years dominated this part of the world; by reason of their integration into the natural environment, they make up a unique ensemble of cultural landscapes.&lt;/p&gt; &lt;p&gt;&lt;em&gt;Criterion (vi):&lt;/em&gt; The Ming and Qing Tombs are dazzling illustrations of the beliefs, world view, and geomantic theories of Fengshui prevalent in feudal China. They have served as burial edifices for illustrious personages and as the theatre for major events that have marked the history of China.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.272Z"},{"slug":"case-20001201-5f792dd7","title":"龙门石窟（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1003","summary":"龙门石窟位于中国，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(i)(ii)(iii)，遗产类型为文化遗产。名录坐标：北纬34.4667，东经112.4667。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：龙门石窟 英文名称：Longmen Grottoes 国家/地区：中国 列入年份：2000 世界遗产标准：(i)(ii)(iii) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：34.46666667, 112.4666667 名录编号：1003 官方页面：https://whc.unesco.org/en/list/1003\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;龙门地区的石窟和佛龛包含北魏晚期至唐代（公元316至907年）期间最具规模和最为优秀的中国艺术藏品。这些艺术作品全部反映佛教宗教题材，代表了中国石刻艺术的最高峰。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion (i): The sculptures of the Longmen Grottoes are an outstanding manifestation of human artistic creativity.&lt;/p&gt; &lt;p&gt;Criterion (ii): The Longmen Grottoes illustrate the perfection of a long-established art form which was to play a highly significant role in the cultural evolution of this region of Asia.&lt;/p&gt; &lt;p&gt;Criterion (iii): The high cultural level and sophisticated society of Tang Dynasty China is encapsulated in the exceptional stone carvings of the Longmen Grottoes.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.232Z"},{"slug":"case-20001201-87820454","title":"皖南古村落－西递、宏村（2000年）（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1002","summary":"皖南古村落－西递、宏村（2000年）位于中国，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(iv)(v)，遗产类型为文化遗产。名录坐标：北纬29.9044，东经117.9875。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：皖南古村落－西递、宏村（2000年） 英文名称：Ancient Villages in Southern Anhui – Xidi and Hongcun 国家/地区：中国 列入年份：2000 世界遗产标准：(iii)(iv)(v) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：29.9044444444, 117.9875 名录编号：1002 官方页面：https://whc.unesco.org/en/list/1002\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;西递、宏村这两个传统的古村落在很大程度上仍然保持着在上个世纪已经消失或改变了的乡村的面貌。其街道规划、古建筑和装饰，以及供水系统完备的民居都是非常独特的文化遗存。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion (iii): The villages of Xidi and Hongcun are graphic illustrations of a type of human settlement created during a feudal period and based on a prosperous trading economy.&lt;/p&gt; &lt;p&gt;Criterion (iv): In their buildings and their street patterns, the two villages of southern Anhui reflect the socio-economic structure of a long-lived settled period of Chinese history.&lt;/p&gt; &lt;p&gt;Criterion (v): The traditional non-urban settlements of China, which have to a very large extent disappeared during the past century, are exceptionally well preserved in the villages of Xidi and Hongcun.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.205Z"},{"slug":"case-20001201-37ab2e24","title":"青城山—都江堰（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2000-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1001","summary":"青城山—都江堰位于中国，2000年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iv)(vi)，遗产类型为文化遗产。名录坐标：北纬31.0017，东经103.6053。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：青城山—都江堰 英文名称：Mount Qingcheng and the Dujiangyan Irrigation System 国家/地区：中国 列入年份：2000 世界遗产标准：(ii)(iv)(vi) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：31.00167, 103.60528 名录编号：1001 官方页面：https://whc.unesco.org/en/list/1001\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;都江堰灌溉系统始建于公元前3世纪，至今仍控制着岷江的水流，灌溉着成都平原肥沃的农田。青城山是中国道教的发源地，因许多古庙著称。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】 &lt;p&gt;Criterion (ii): The Dujiangyan Irrigation System, begun in the 2nd century BCE, is a major landmark in the development of water management and technology, and is still discharging its functions perfectly.&lt;/p&gt; &lt;p&gt;Criterion (iv): The immense advances in science and technology achieved in ancient China are graphically illustrated by the Dujiangyan Irrigation System.&lt;/p&gt; &lt;p&gt;Criterion (vi): The temples of Mount Qingcheng are closely associated with the foundation of Taoism, one of the most influential religions of East Asia over a long period of history.&lt;/p&gt;\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.179Z"},{"slug":"case-19801201-ae2b5bb6","title":"贝尼•哈玛德的卡拉城（阿尔及利亚）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"1980-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"阿尔及利亚","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/102","summary":"贝尼•哈玛德的卡拉城位于阿尔及利亚，1980年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)，遗产类型为文化遗产。名录坐标：北纬35.8184，东经4.7868。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：贝尼•哈玛德的卡拉城 英文名称：Al Qal&amp;apos;a of Beni Hammad 国家/地区：阿尔及利亚 列入年份：1980 世界遗产标准：(iii) 遗产类型：文化遗产 所属区域：Arab States 名录坐标：35.81844, 4.78684 名录编号：102 官方页面：https://whc.unesco.org/en/list/102\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;哈玛德王朝（Hammadid emirs）第一个首都的遗址，位于风景秀美的山区，始建于公元1007年，毁于公元1152年，是要塞型穆斯林城市的真实写照。这里的清真寺祈祷室有13条走廊和8个隔间，是阿尔及利亚最大的清真寺之一。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.907Z"},{"slug":"case-19801201-e712f4fc","title":"杜米托尔国家公园（黑山）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"1980-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"黑山","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/100","summary":"杜米托尔国家公园位于黑山，1980年列入联合国教科文组织《世界遗产名录》，列入标准为(vii)(viii)(x)，遗产类型为自然遗产。名录坐标：北纬43.1330，东经19.0166。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：杜米托尔国家公园 英文名称：Durmitor National Park 国家/地区：黑山 列入年份：1980 世界遗产标准：(vii)(viii)(x) 遗产类型：自然遗产 所属区域：Europe and North America 名录坐标：43.133, 19.0166 名录编号：100 官方页面：https://whc.unesco.org/en/list/100\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;杜米托尔国家公园美丽绝伦，它由冰川形成，地上河和地下河流经该公园。沿欧洲最深峡谷——塔拉河峡谷两侧是浓密的松林，松林中点缀着清澈的湖水，并拥有大面积的特色植物群。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.173Z"},{"slug":"case-19801201-b97b6e19","title":"阿瓦什低谷（埃塞俄比亚）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"1980-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"埃塞俄比亚","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/10","summary":"阿瓦什低谷位于埃塞俄比亚，1980年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iii)(iv)，遗产类型为文化遗产。名录坐标：北纬11.1001，东经40.5794。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：阿瓦什低谷 英文名称：Lower Valley of the Awash 国家/地区：埃塞俄比亚 列入年份：1980 世界遗产标准：(ii)(iii)(iv) 遗产类型：文化遗产 所属区域：Africa 名录坐标：11.10006, 40.57939 名录编号：10 官方页面：https://whc.unesco.org/en/list/10\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;阿瓦什河谷包括非洲大陆最重要的古生物遗址群之一。在该遗址发现的远古人类化石至少可以追溯到400万年以前，为人类进化史提供了证据，改变了人们对人类历史的传统认识。最重要的考古发现是在1974年，当时出土的52块人类骨骼化石还原出了著名的露西(Lucy)。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.125Z"},{"slug":"case-19781201-2af0b2b3","title":"加拉帕戈斯群岛（厄瓜多尔）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"1978-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"厄瓜多尔","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1","summary":"加拉帕戈斯群岛位于厄瓜多尔，1978年列入联合国教科文组织《世界遗产名录》，列入标准为(vii)(viii)(ix)(x)，遗产类型为自然遗产。名录坐标：北纬-0.6899，东经-90.5013。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：加拉帕戈斯群岛 英文名称：Gal&amp;#xe1;pagos Islands 国家/地区：厄瓜多尔 列入年份：1978 世界遗产标准：(vii)(viii)(ix)(x) 遗产类型：自然遗产 所属区域：Latin America and the Caribbean 名录坐标：-0.68986, -90.501319 名录编号：1 官方页面：https://whc.unesco.org/en/list/1\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;群岛地处离南美大陆1000公里的太平洋上，由19个火山岛以及周围的海域组成，被人称作独一无二的“活的生物进化博物馆和陈列室”。加拉帕戈斯群岛处于三大洋流的交汇处，是海洋生物的“大熔炉”。持续的地震和火山活动反映了群岛的形成过程。这些过程，加上群岛与世隔绝的地理位置，促使群岛内进化出许多奇异的动物物种，例如陆生鬣蜥、巨龟和多种类型的雀类。1835年查尔斯·达尔文参观了这片岛屿后，从中得到感悟，进而提出了著名的进化论。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.073Z"},{"slug":"policy-nodate-347599f2","title":"武汉市实施“五改四好”加快推进高质量城市更新行动方案（2025—2027年）","type":"policy","type_label":"政策","issuer":"武汉市人民政府","doc_no":"","publish_date":"","effective_date":"","status":"实施中","level":"地方级","region":"武汉","source_name":"工作区研究资料收录（政策名称与年份待官方发布核验）","source_url":"","summary":"武汉市围绕存量空间改造与活化利
