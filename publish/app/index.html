系统中的推广应用，提高城市公共交通信息化、智能化水平，推动城市公共交通绿色低碳转型，提升运营效率和管理水平。 第二章 发展保障 第九条 城市综合交通体系规划应当明确公共交通优先发展原则，统筹城市交通基础设施建设，合理配置和利用各种交通资源，强化各种交通方式的衔接协调。城市人民政府根据实际情况和需要组织编制城市公共交通规划。 建设城市轨道交通系统的城市应当按照国家有关规定编制城市轨道交通线网规划和建设规划。 城市综合交通体系规划、城市公共交通规划、城市轨道交通线网规划和建设规划应当与国土空间规划相衔接，将涉及土地和空间使用的合理需求纳入国土空间规划实施监督系统统筹保障。 第十条 城市人民政府有关部门应当根据相关规划以及城市发展和公众出行需求情况，合理确定城市公共交通线路，布局公共交通场站等设施，提高公共交通覆盖率。 城市人民政府应当组织有关部门开展公众出行调查，作为优化城市公共交通线路和场站布局的依据。 第十一条 新建、改建、扩建居住区、交通枢纽、学校、医院、体育场馆、商业中心等大型建设项目，应当统筹考虑公共交通出行需求；建设项目批准、核准文件要求配套建设城市公共交通基础设施的，建设单位应当按照要求建设相关设施并同步投入使用。 第十二条 城市人民政府应当依法保障城市公共交通基础设施用地。城市公共交通基础设施用地符合规定条件的，可以以划拨、协议出让等方式供给。 在符合国土空间规划和用途管制要求且不影响城市公共交通功能和规模的前提下，对城市公共交通基础设施用地可以按照国家有关规定实施综合开发，支持城市公共交通发展。 第十三条 城市人民政府应当根据城市公共交通实际和财政承受能力安排城市公共交通发展所需经费，并纳入本级预算。 国家鼓励、引导金融机构提供与城市公共交通发展相适应的金融服务，加大对城市公共交通发展的融资支持力度。 国家鼓励和支持社会资本依法参与城市公共交通基础设施建设运营，保障其合法权益。 第十四条 城市公共交通票价依法实行政府定价或者政府指导价，并建立动态调整机制。鼓励根据城市公共交通服务质量、运输距离以及换乘方式等因素，建立多层次、差别化的城市公共交通票价体系。 制定、调整城市公共交通票价，应当统筹考虑企业运营成本、社会承受能力、交通供求状况等因素，并依法履行定价成本监审等程序。 第十五条 城市公共交通企业在保障公众基本出行的前提下，可以开展定制化出行服务业务。定制化出行服务业务可以实行市场调节价。 第十六条 城市人民政府应当组织有关部门，在对城市公共交通企业开展运营服务质量评价和成本费用年度核算报告审核的基础上，综合考虑财政承受能力、企业增收节支空间等因素，按照规定及时给予补贴补偿。 第十七条 城市人民政府可以根据实际情况和需要，按照统筹公共交通效率和整体交通效率、集约利用城市道路资源的原则，设置公共交通专用车道，并实行科学管理和动态调整。 第三章 运营服务 第十八条 城市人民政府城市公共交通主管部门应当通过与城市公共交通企业签订运营服务协议等方式，明确城市公共交通运营有关服务标准、规范、要求以及运营服务质量评价等事项。 城市公共交通企业应当遵守城市公共交通运营有关服务标准、规范、要求等，加强企业内部管理，不断提高运营服务质量和效率。 城市公共交通企业不得将其运营的城市公共交通线路转让、出租或者变相转让、出租给他人运营。 第十九条 城市公共交通企业应当按照运营服务协议或者城市人民政府城市公共交通主管部门的要求配备城市公共交通车辆，并按照规定设置车辆运营服务标识。 第二十条 城市公共交通企业应当通过便于公众知晓的方式，及时公开运营线路、停靠站点、运营时间、发车间隔、票价等信息。鼓励城市公共交通企业通过电子站牌、出行信息服务系统等信息化手段为公众提供信息查询服务。 第二十一条 城市公共交通企业应当加强运营调度管理，在保障安全的前提下提高运行准点率和运行效率。 第二十二条 城市公共交通企业不得擅自变更运营线路、停靠站点、运营时间或者中断运营服务；因特殊原因需要临时变更运营线路、停靠站点、运营时间或者暂时中断运营服务的，除发生突发事件或者为保障运营安全等采取紧急措施外，应当提前向社会公告，并向城市人民政府城市公共交通主管部门报告。 第二十三条 因大型群众性活动等情形出现公共交通客流集中、正常运营服务安排难以满足需求的，城市公共交通企业应当按照城市人民政府城市公共交通主管部门的要求，及时采取增开临时班次、缩短发车间隔、延长运营时间等措施，保障运营服务。 第二十四条 乘客应当按照票价支付票款；对拒不支付票款的，城市公共交通企业可以拒绝其进站乘车。 城市公共交通企业应当依照法律、法规和国家有关规定，对相关群体乘坐公共交通工具提供便利和优待。 第二十五条 城市公共交通企业应当建立运营服务质量投诉处理机制并向社会公布，及时妥善处理乘客提出的投诉，并向乘客反馈处理结果；乘客对处理结果不满意的，可以向城市人民政府城市公共交通主管部门申诉，城市人民政府城市公共交通主管部门应当及时作出答复。乘客也可以直接就运营服务质量问题向城市人民政府城市公共交通主管部门投诉。 第二十六条 城市人民政府城市公共交通主管部门应当定期组织开展城市公共交通企业运营服务质量评价，并将评价结果向社会公布。 第二十七条 未经城市人民政府同意，城市公共交通企业不得终止运营服务；因破产、解散终止运营服务的，应当提前30日向城市人民政府城市公共交通主管部门报告，城市人民政府城市公共交通主管部门应当及时采取指定临时运营服务企业、调配运营车辆等措施，确保运营服务不中断；需要重新确定承担城市公共交通运营服务企业的，城市人民政府或者其城市公共交通主管部门应当按照规定及时确定。 第四章 安全管理 第二十八条 城市公共交通企业应当遵守有关安全生产的法律、法规和标准，落实全员安全生产责任，建立健全安全生产管理制度和安全生产责任制，保障安全经费投入，构建安全风险分级管控和隐患排查治理双重预防机制，增强突发事件防范和应急能力。 第二十九条 城市公共交通建设工程的勘察、设计、施工、监理应当遵守有关建设工程管理的法律、法规和标准。 城市公共交通建设工程涉及公共安全的设施应当与主体工程同步规划、同步建设、同步投入使用。 第三十条 城市公共交通企业投入运营的车辆应当依法经检验合格，并按照国家有关标准配备灭火器、安全锤以及安全隔离、紧急报警、车门紧急开启等安全设备，设置明显的安全警示标志。 城市公共交通企业应当按照国家有关标准对车辆和有关系统、设施设备进行维护、保养，确保性能良好和安全运行。 利用城市公共交通车辆或者设施设备设置广告的，应当遵守有关广告管理的法律、法规，不得影响城市公共交通运营安全。 第三十一条 城市公共交通企业直接涉及运营安全的驾驶员、乘务员、调度员、值班员、信号工、通信工等重点岗位人员（以下统称重点岗位人员），应当符合下列条件： （一）具有履行岗位职责的能力； （二）无可能危及运营安全的疾病； （三）无暴力犯罪和吸毒行为记录； （四）国务院城市公共交通主管部门规定的其他条件。 除符合前款规定条件外，城市公共汽电车驾驶员还应当取得相应准驾车型机动车驾驶证，城市轨道交通列车驾驶员还应当按照国家有关规定取得相应职业准入资格。 第三十二条 城市公共交通企业应当定期对重点岗位人员进行岗位职责、操作规程、服务规范、安全防范和应急处置基本知识等方面的培训和考核，经考核合格的方可上岗作业。培训和考核情况应当建档备查。 城市公共交通企业应当关注重点岗位人员的身体、心理状况和行为习惯，对重点岗位人员定期组织体检，加强心理疏导，及时采取有效措施防范重点岗位人员身体、心理状况或者行为异常导致运营安全事故发生。 城市公共交通企业应当合理安排驾驶员工作时间，防止疲劳驾驶。 第三十三条 城市公共交通企业应当依照有关法律、法规的规定，落实对相关人员进行安全背景审查、配备安保人员和相应设施设备等安全防范责任。 第三十四条 城市公共交通企业应当加强对客流状况的日常监测；出现或者可能出现客流大量积压时，应当及时采取疏导措施，必要时可以采取临时限制客流或者临时封站等措施，确保运营安全。 因突发事件或者设施设备故障等原因危及运营安全的，城市公共交通企业可以暂停部分区段或者全线网运营服务，并做好乘客疏导和现场秩序维护等工作。乘客应当按照城市公共交通企业工作人员的指挥和引导有序疏散。 第三十五条 乘客应当遵守乘车规范，维护乘车秩序。 乘客不得携带易燃、易爆、毒害性、放射性、腐蚀性以及其他可能危及人身和财产安全的危险物品进站乘车；乘客坚持携带的，城市公共交通企业应当拒绝其进站乘车。 城市轨道交通运营单位应当按照国家有关规定，对进入城市轨道交通车站的人员及其携带物品进行安全检查；对拒不接受安全检查的，应当拒绝其进站乘车。安全检查应当遵守有关操作规范，提高质量和效率。 第三十六条 任何单位和个人不得实施下列危害城市公共交通运营安全的行为： （一）非法拦截或者强行上下城市公共交通车辆； （二）非法占用城市公共交通场站或者出入口； （三）擅自进入城市轨道交通线路、车辆基地、控制中心、列车驾驶室或者其他禁止非工作人员进入的区域； （四）向城市公共交通车辆投掷物品或者在城市轨道交通线路上放置障碍物； （五）故意损坏或者擅自移动、遮挡城市公共交通站牌、安全警示标志、监控设备、安全防护设备； （六）在非紧急状态下擅自操作有安全警示标志的安全设备； （七）干扰、阻碍城市公共交通车辆驾驶员安全驾驶； （八）其他危害城市公共交通运营安全的行为。 城市公共交通企业发现前款规定行为的，应当及时予以制止，并采取措施消除安全隐患，必要时报请有关部门依法处理。 第三十七条 城市人民政府有关部门应当按照职责分工，加强对城市公共交通运营安全的监督管理，建立城市公共交通运营安全工作协作机制。 第三十八条 城市人民政府城市公共交通主管部门应当会同有关部门制定城市公共交通应急预案，报城市人民政府批准。 城市公共交通企业应当根据城市公共交通应急预案，制定本单位应急预案，报城市人民政府城市公共交通主管部门、应急管理部门备案，并定期组织演练。 城市人民政府应当加强城市公共交通应急能力建设，组织有关部门、城市公共交通企业和其他有关单位联合开展城市公共交通应急处置演练，提高突发事件应急处置能力。 第三十九条 城市人民政府应当健全有关部门与城市公共交通企业之间的信息共享机制。城市人民政府城市公共交通主管部门、城市公共交通企业应当加强与有关部门的沟通，及时掌握气象、自然灾害、公共安全等方面可能影响城市公共交通运营安全的信息，并采取有针对性的安全防范措施。有关部门应当予以支持、配合。 第四十条 城市人民政府应当将城市轨道交通纳入城市防灾减灾规划，完善城市轨道交通防范水淹、火灾、冰雪、雷击、风暴等设计和论证，提高城市轨道交通灾害防范应对能力。 第四十一条 城市轨道交通建设单位组织编制城市轨道交通建设工程可行性研究报告和初步设计文件，应当落实国家有关公共安全和运营服务的要求。 第四十二条 城市轨道交通建设工程项目依法经验收合格后，城市人民政府城市公共交通主管部门应当组织开展运营前安全评估，通过安全评估的方可投入运营。城市轨道交通建设单位和运营单位应当按照国家有关规定办理建设和运营交接手续。 城市轨道交通建设工程项目验收以及建设和运营交接的管理办法由国务院住房城乡建设主管部门会同国务院城市公共交通主管部门制定。 第四十三条 城市人民政府应当组织有关部门划定城市轨道交通线路安全保护区，制定安全保护区管理制度。 在城市轨道交通线路安全保护区内进行作业的，应当征得城市轨道交通运营单位同意。作业单位应当制定和落实安全防护方案，并在作业过程中对作业影响区域进行动态监测，及时发现并消除安全隐患。城市轨道交通运营单位可以进入作业现场进行巡查，发现作业危及或者可能危及城市轨道交通运营安全的，应当要求作业单位采取措施消除安全隐患或者停止作业。 第四十四条 城市人民政府城市公共交通主管部门应当定期组织开展城市轨道交通运营安全第三方评估，督促运营单位及时发现并消除安全隐患。 第五章 法律责任 第四十五条 城市公共交通企业以外的单位或者个人擅自从事城市公共交通线路运营的，由城市人民政府城市公共交通主管部门责令停止运营，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足1万元的，处1万元以上5万元以下的罚款。 城市公共交通企业将其运营的城市公共交通线路转让、出租或者变相转让、出租给他人运营的，由城市人民政府城市公共交通主管部门责令改正，并依照前款规定处罚。 第四十六条 城市公共交通企业有下列行为之一的，由城市人民政府城市公共交通主管部门责令改正；拒不改正的，处1万元以上5万元以下的罚款： （一）未遵守城市公共交通运营有关服务标准、规范、要求； （二）未按照规定配备城市公共交通车辆或者设置车辆运营服务标识； （三）未公开运营线路、停靠站点、运营时间、发车间隔、票价等信息。 第四十七条 城市公共交通企业擅自变更运营线路、停靠站点、运营时间的，由城市人民政府城市公共交通主管部门责令改正；拒不改正的，处1万元以上5万元以下的罚款。 城市公共交通企业擅自中断运营服务的，由城市人民政府城市公共交通主管部门责令改正；拒不改正的，处5万元以上20万元以下的罚款。 城市公共交通企业因特殊原因变更运营线路、停靠站点、运营时间或者暂时中断运营服务，未按照规定向社会公告并向城市人民政府城市公共交通主管部门报告的，由城市人民政府城市公共交通主管部门责令改正，可以处1万元以下的罚款。 第四十八条 城市公共交通企业违反本条例规定，未经城市人民政府同意终止运营服务的，由城市人民政府城市公共交通主管部门责令改正；拒不改正的，处10万元以上50万元以下的罚款。 第四十九条 城市公共交通企业有下列行为之一的，由城市人民政府城市公共交通主管部门责令改正，可以处5万元以下的罚款，有违法所得的，没收违法所得；拒不改正的，处5万元以上20万元以下的罚款： （一）利用城市公共交通车辆或者设施设备设置广告，影响城市公共交通运营安全； （二）重点岗位人员不符合规定条件或者未按照规定对重点岗位人员进行培训和考核，或者安排考核不合格的重点岗位人员上岗作业。 第五十条 在城市轨道交通线路安全保护区内进行作业的单位有下列行为之一的，由城市人民政府城市公共交通主管部门责令改正，暂时停止作业，可以处5万元以下的罚款；拒不改正的，责令停止作业，并处5万元以上20万元以下的罚款；造成城市轨道交通设施损坏或者影响运营安全的，并处20万元以上100万元以下的罚款： （一）未征得城市轨道交通运营单位同意进行作业； （二）未制定和落实安全防护方案； （三）未在作业过程中对作业影响区域进行动态监测或者未及时消除发现的安全隐患。 第五十一条 城市人民政府及其城市公共交通主管部门、其他有关部门的工作人员在城市公共交通工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分。 第五十二条 违反本条例规定，构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第六章 附 则 第五十三条 用于公共交通服务的城市轮渡，参照本条例的有关规定执行。 第五十四条 城市人民政府根据城乡融合和区域协调发展需要，统筹推进城乡之间、区域之间公共交通一体化发展。 第五十五条 本条例自2024年12月1日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.319Z"},{"slug":"policy-20240925-d1473ff8","title":"关于以高水平保护促进中部地区加快崛起的实施意见","type":"policy","type_label":"政策","issuer":"生态环境部","doc_no":"环综合〔2024〕64号","publish_date":"2024-09-25","effective_date":"","status":"现行有效","level":"国家级","region":"中部地区","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202409/content_6976350.htm","summary":"效能。指导中部地区开展建设项目环评审批改革试点，推动优化环评分级分类管理。 （三）提升产业绿色低碳发展水平。支持中部地区大规模设备更新和消费品以旧换新，加快钢铁、水泥、焦化等行业超低排放改造，促进","themes":["生态保护"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>关于以高水平保护促进中部地区加快崛起的实施意见 环综合〔2024〕64号 山西省、安徽省、江西省、河南省、湖北省、湖南省生态环境厅： 为深入贯彻习近平总书记在新时代推动中部地区崛起座谈会上的重要讲话精神，全面落实党中央、国务院决策部署，协同推进生态环境保护和绿色低碳发展，高水平建设美丽中部，促进中部地区在更高起点上加快崛起，现提出以下实施意见。 一、总体要求 中部地区在全国高质量发展大局中地位和作用举足轻重，新形势下加强中部地区生态环境保护意义重大。党的十八大以来，中部地区经济社会加快发展，生态环境质量持续改善，区域协调发展站在了新的更高起点上。同时要看到，与新征程中部地区加快崛起的战略目标定位相比，与人民群众生态环境新期盼相比，区域污染防治攻坚呈现新的阶段特征，存量型、增量型生态环境压力叠加，亟需更好统筹经济高质量发展和生态环境高水平保护。 以高水平保护促进中部地区加快崛起，要坚持以习近平新时代中国特色社会主义思想特别是习近平生态文明思想为指导，深入贯彻党的二十大和二十届二中、三中全会精神，全面贯彻习近平总书记关于中部地区崛起重要讲话、重要指示批示精神，完整、准确、全面贯彻新发展理念，加快构建新发展格局，着力推动高质量发展，牢牢把握中部地区在维护国家粮食安全、能源资源安全、产业安全和生态安全中的战略地位，支持区域加快绿色低碳转型发展，持续深入打好污染防治攻坚战，切实维护生态环境安全，着力深化生态环境保护体制机制改革，加快推进生态环境治理体系和治理能力现代化，更大力度建设美丽中部，以高品质生态环境支撑中部地区加快崛起。 二、加快推动绿色低碳转型发展 （一）实施生态环境分区管控。支持中部地区持续完善全域覆盖、精准管控的生态环境分区管控体系并做好实施应用，加强规划环评，合理布局重大产业、基础设施等项目，因地制宜引导产业转移和转型升级，提升能源资源保障和产业支撑能力，坚决遏制高耗能、高排放、低水平项目盲目发展。支持推进区域工业化、城镇化协调发展，支持建设长江中游、中原等城市群和武汉、长株潭、郑州、合肥等都市圈，指导建成一批各具特色的美丽城市。 （二）服务保障重大项目建设。依托环评审批“三本台账”和绿色通道机制，对中部地区重大科技基础设施、重大水利基础设施、重大战略新兴产业、现代化交通基础设施等建设项目，提前介入、加强指导，对符合生态环境保护要求的，开辟绿色通道，提高审批效能。指导中部地区开展建设项目环评审批改革试点，推动优化环评分级分类管理。 （三）提升产业绿色低碳发展水平。支持中部地区大规模设备更新和消费品以旧换新，加快钢铁、水泥、焦化等行业超低排放改造，促进传统产业转型升级。高水平建设一批循环产业园、生态工业园，支持规范开展废旧电子设备拆解利用。开展城市和产业园区减污降碳协同创新试点，实施一批减污降碳协同治理工程。指导中部地区落实碳强度控制目标要求，开展低碳城市、气候适应型城市建设，支持湖北建设全国碳排放权注册登记机构。 三、持续深化大气污染治理 （四）强化大气污染联防联控。深化汾渭平原大气污染联防联控，推进苏皖鲁豫交界区域、长江中游城市群传输通道大气污染防治协作。在预测到将发生跨区域重污染天气过程时，指导中部地区落实应急联动要求，视情采取统一预警、统一调度、统一执法等措施，统筹预警启动、响应和解除，最大限度减少重污染天气。加强中部地区空气质量预测预报能力建设，提高预测预报水平。 （五）加强重点领域大气污染防治。支持开展重点行业绩效创建工作试点。严格合理控制煤炭消费总量，持续推进山西、河南清洁取暖。全面开展中小型传统制造企业集群升级改造。强化挥发性有机物综合治理，加快推进源头替代。充分发挥长江黄金水道和综合交通枢纽作用，提升大宗货物清洁化运输水平，大力发展多式联运，促进“公转铁”“公转水”。支持山西打造清洁运输先行引领区，提高煤炭跨省及省内中长距离铁路运输占比。支持河南开展大气氨排放控制试点。 四、加强水生态环境保护修复 （六）加强大江大河和重要湖泊保护治理。统筹水资源、水环境、水生态，推动长江、黄河、淮河等大江大河和鄱阳湖、洞庭湖、巢湖、洪湖等重要湖泊环境综合治理，着力改善大江大河和重要湖泊生态环境面貌。开展长江流域水生态考核试点，保障黄河流域河湖生态用水。加强长江、洞庭湖、鄱阳湖总磷污染控制，协同推进黄河流域山西段、河南段总氮污染控制。推进入河排污口查测溯治管，着力提升信息化管理水平。 （七）保障饮用水水源水质安全。以县级及以上城市集中式饮用水水源地为重点，加强水源地规范化建设。推动开展城市不达标水源地治理，防范地下水型水源地水质污染。稳步推进乡镇级集中式饮用水水源保护区划定、立标、环境问题整治。深入推进水源区生态环境系统治理，有效保障丹江口水库及南水北调中线工程水质安全。 （八）推进城市黑臭水体治理。开展城市黑臭水体整治环境保护行动，指导督促中部地区巩固提升地级及以上城市黑臭水体治理成效，全面开展县级城市黑臭水体治理，稳步推进县城黑臭水体排查整治。推动补齐城市污水收集处理设施短板，加快解决设施建设滞后、处理能力不足、管网错接混接漏接、老旧破损等突出问题。 五、加大土壤和农业农村污染治理力度 （九）加强土壤污染源头防控。持续实施农用地土壤镉等重金属污染源头防治行动，分阶段推进农用地土壤重金属污染溯源和整治全覆盖。完善建设用地用途变更和污染地块风险管控联动监管机制，支持推动安徽、江西、湖北、湖南长江沿岸化工腾退地块土壤污染治理。强化老工业基地和工业聚集区大型污染场地风险管控和修复。有序推进在产企业和化工园区土壤及地下水污染管控修复试点。 （十）深化农业农村污染治理。推广“千万工程”经验，指导建设一批美丽乡村示范县。加快治理农村黑臭水体，推动解决房前屋后环境问题。聚焦水体氮磷等污染问题突出区域，督促指导加强农业面源污染系统治理，推动畜禽养殖、水产养殖污染防治和秸秆资源化利用。推动构建农膜、农药包装回收体系。 六、加强固体废物和危险废物治理 （十一）持续深化“无废城市”建设。支持安徽、江西、河南、湖北、湖南有序推进全域“无废城市”建设，推进固体废物源头减量，提升资源化利用水平。支持加快推进尾矿、磷石膏、粉煤灰、煤矸石、冶炼废渣等大宗工业固废利用处置设施建设和综合治理技术研究，推动回填充填、生态修复、建材生产及用作路基材料等规模化利用。 （十二）强化危险废物环境管理。支持开展华中区域危险废物环境风险防控技术中心和区域特殊危险废物集中处置中心建设。支持湘西、大别山区等边远基层地区探索建立医疗废物就近就地处置新模式。推动加强危险废物联防联治，探索建立危险废物跨省转移“白名单”和“点对点”定向利用合作机制，严厉打击危险废物非法倾倒等违法犯罪活动。 （十三）加强尾矿库、重金属和历史遗留矿山综合治理。支持山西、江西、河南、湖南等省份开展尾矿库污染隐患排查治理，深化实施分类分级环境监管。督促指导安徽、江西、河南、湖南等省份加强重点区域、重点行业重金属污染防控，有效减少重金属排放总量，扎实推进湖南省花垣县锰污染治理。支持推动长江流域、黄河流域历史遗留矿山生态环境综合治理，加快整治尾矿库、丹江口库区上游历史遗留重金属污染等环境风险隐患。 七、维护区域生态环境安全 （十四）建立生态保护修复统一监管体系。定期开展自然保护地、生态保护红线人为活动遥感监测，持续开展“绿盾”重要生态空间强化监督，及时查处违法违规问题。开展中部地区山水林田湖草沙一体化保护和修复工程实施、国家级自然保护区、生态保护红线生态环境保护成效评估。指导中部地区推进太行山、大别山等生物多样性保护优先区调查、观测与评估，共建生物多样性保护网络体系。 （十五）提升生态安全保障水平。推动将中部地区纳入国家生态安全风险监测预警体系。深入分析气候变化影响，提高区域适应气候变化能力，推动城市安全韧性发展。加强三峡库区、武陵山区等重点生态功能区保护，筑牢区域生态安全屏障。开展新污染物治理。加强巢湖、汉江中下游蓝藻水华等生态灾害风险防控，防范重要湖库发生规模性退化萎缩。持续推进中部地区突发水污染事件环境应急“一河一策一图”和“一园一策一图”。深化长江赣鄂皖段、丹江口库区上下游突发水污染事件联防联控机制。 八、强化生态环境保护支撑保障 （十六）加快建立现代化生态环境监测体系。支持持续完善全要素、全地域生态环境监测网络，实现天空地全覆盖，推进地方监测网点位布设重点向区县、乡镇、农村延伸。支持中部地区建设一批生态质量综合监测站。深化重点生态功能区县域生态环境质量监测与评价。开展三峡库区水华预警和应急专项监测、丹江口水库水华专项监测、长江流域水生态监测。 （十七）加强督察执法监管。紧盯中央生态环境保护督察和长江经济带、黄河流域生态环境警示片发现问题整改。强化排污许可事中事后监管，全面推行排污许可清单式执法监管。完善跨区域跨部门联合执法机制，加强行政、司法协同，依法依规查处重大环境污染、生态破坏等行为，涉及生态环境损害的，根据相关规定及时启动生态环境损害赔偿。指导中部地区针对群众反映强烈的噪声投诉问题建立督办机制，支持河南、江西和湖北等省份开展噪声污染防治试点。 （十八）强化科技支撑。在有关生态环境领域重点研发计划部署、重大科技需求凝练中充分考虑中部地区需求，提升区域生态环境领域科技支撑能力。推动丹江口库区生态风险防治与水质安全保障、中原城市群大气复合污染深化治理、黄淮海平原区农业农村减污降碳协同增效等关键技术研究。创新完善工作机制，深化长江生态环境保护修复、黄河流域生态保护和高质量发展联合研究。 （十九）支持完善市场化机制。推动完善中部地区长江、黄河等流域和洞庭湖、鄱阳湖等重要湖泊生态保护补偿，健全生态产品价值实现机制。强化绿色金融支持，推进生态环境导向的开发（EOD）模式创新，探索推进生态环境治理与国家文化公园、美丽河湖建设等一体化投融资，加快实施生态环境领域重大工程。支持推进碳排放权、排污权等市场化交易。 生态环境部结合建设美丽中国先行区、编制“十五五”生态环境保护规划等工作，研究支持美丽中部建设举措。加强对中部地区生态环境保护工作的协调指导，制定年度生态环境保护工作安排，推动加强区域生态环境保护协作，及时研究解决区域性重大生态环境问题，以高水平保护促进中部地区加快崛起。 生态环境部 2024年9月13日 （此件删减后公开）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.352Z"},{"slug":"policy-20240824-6a5fac69","title":"北京市地方标准《老旧厂房更新改造设计标准》（DB11/T 2296-2024）","type":"policy","type_label":"政策","issuer":"北京市规划和自然资源委员会、北京市市场监督管理局","doc_no":"DB11/T 2296-2024（实施通知：京规自发〔2024〕204号）","publish_date":"2024-08-24","effective_date":"2025-01-01","status":"现行有效","level":"地方级","region":"北京","source_name":"工作区研究资料收录（标准原文 OCR）","source_url":"","summary":"北京市地方标准《老旧厂房更新改造设计标准》（DB11/T 2296-2024）由北京市规划和自然资源委员会归口管理、北京市市场监督管理局联合发布，2024年8月24日以京规自发〔2024〕204号通知实施，自2025年1月1日起施行，适用于北京行政区域内老旧厂房的民用化更新改造设计。标准第3章设“价值分级”，以定量评分划为 I/II/III/IV 四级，并就场地与总平面、建筑风貌、规模与指标、评估与策划等提出要求。","themes":["老旧厂房改造","城市更新","历史文化保护","工业遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>北京市规划和自然资源委员会关于实施北京市地方标准《老旧厂房更新改造设计标准》的通知（京规自发〔2024〕204号） 各有关单位： 为推动北京市老旧厂房转型升级、功能优化和提质增效，规范和指导老旧厂房更新改造的设计工作，助力城市更新，我委组织制定了北京市地方标准《老旧厂房更新改造设计标准》（DB11/T 2296-2024），并已与北京市市场监督管理局联合发布，现将有关事宜通知如下： 《老旧厂房更新改造设计标准》（DB11/T 2296-2024）自2025年1月1日起实施，自实施之日起，北京行政区域内老旧厂房的民用化更新改造设计应按照本标准认真执行。 本标准由北京市规划和自然资源委员会归口管理并组织实施。 特此通知。 北京市规划和自然资源委员会 2024年8月24日 标准要点（依据工作区留存的标准原文 OCR 摘录）：\u003c/p>\n\u003cul>\u003cli>主编单位：北京市建筑设计研究院股份有限公司；批准部门：北京市规划和自然资源委员会、北京市市场监督管理局。\u003c/li>\u003cli>第3.2.3条价值分级：按评估指标定量评分为 I 级（≥120分）、II 级（105—120分）、III 级（90—105分）、IV 级（&lt;90分）。\u003c/li>\u003cli>第4章评估与策划：改造前需完成结构安全、抗震、节能、消防、风貌等综合评估，改造后设后评估制度。\u003c/li>\u003cli>第5章建筑设计：5.2规模与指标、5.3场地与总平面、5.4建筑风貌（风貌分区管控，历史工业带优先保护工业美学特征）。\u003c/li>\u003c/ul>\n\u003cp>说明：本条目依据工作区留存的标准原文 OCR 与研究笔记整理，标准全文以上述主管部门发布版本为准。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:05:28.498Z"},{"slug":"regulation-20240410-193104da","title":"生态保护补偿条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第779号","publish_date":"2024-04-10","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202404/content_6944395.htm","summary":"中华人民共和国国务院令  第779号 《生态保护补偿条例》已经2024年2月23日国务院第26次常务会议通过，现予公布，自2024年6月1日起施行。 总理　　李强　　　　　　　 2024年4月6日","themes":["生态保护","补偿机制"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第779号 《生态保护补偿条例》已经2024年2月23日国务院第26次常务会议通过，现予公布，自2024年6月1日起施行。 总理 李强 2024年4月6日 生态保护补偿条例 第一章 总 则 第一条 为了保护和改善生态环境，加强和规范生态保护补偿，调动各方参与生态保护积极性，推动生态文明建设，根据有关法律，制定本条例。 第二条 在中华人民共和国领域及管辖的其他海域开展生态保护补偿及其相关活动，适用本条例。法律、行政法规另有规定的，依照其规定。 本条例所称生态保护补偿，是指通过财政纵向补偿、地区间横向补偿、市场机制补偿等机制，对按照规定或者约定开展生态保护的单位和个人予以补偿的激励性制度安排。生态保护补偿可以采取资金补偿、对口协作、产业转移、人才培训、共建园区、购买生态产品和服务等多种补偿方式。 前款所称单位和个人，包括地方各级人民政府、村民委员会、居民委员会、农村集体经济组织及其成员以及其他应当获得补偿的单位和个人。 第三条 生态保护补偿工作坚持中国共产党的领导，坚持政府主导、社会参与、市场调节相结合，坚持激励与约束并重，坚持统筹协同推进，坚持生态效益与经济效益、社会效益相统一。 第四条 县级以上人民政府应当加强对生态保护补偿工作的组织领导，将生态保护补偿工作纳入国民经济和社会发展规划，构建稳定的生态保护补偿资金投入机制。 县级以上人民政府依法可以通过多种方式拓宽生态保护补偿资金渠道。 第五条 国务院发展改革、财政、自然资源、生态环境、水行政、住房城乡建设、农业农村、林业草原等部门依据各自职责，负责生态保护补偿相关工作。 第六条 县级以上地方人民政府应当建立健全生态保护补偿工作的相关机制，督促所属部门和下级人民政府开展生态保护补偿工作。县级以上地方人民政府有关部门依据各自职责，负责生态保护补偿相关工作。 第七条 对在生态保护补偿工作中作出显著成绩的单位和个人，按照国家有关规定给予表彰和奖励。 第二章 财政纵向补偿 第八条 国家通过财政转移支付等方式，对开展重要生态环境要素保护的单位和个人，以及在依法划定的重点生态功能区、生态保护红线、自然保护地等生态功能重要区域开展生态保护的单位和个人，予以补偿。 第九条 对开展重要生态环境要素保护的单位和个人，中央财政按照下列分类实施补偿（以下称分类补偿）： （一）森林； （二）草原； （三）湿地； （四）荒漠； （五）海洋； （六）水流； （七）耕地； （八）法律、行政法规和国家规定的水生生物资源、陆生野生动植物资源等其他重要生态环境要素。 前款规定的补偿的具体范围、补偿方式应当统筹考虑地区经济社会发展水平、财政承受能力、生态保护成效等因素分类确定，并连同补偿资金的使用及其监督管理等事项依法向社会公布。中央财政分类补偿的具体办法由国务院主管部门会同其他有关部门分领域制定。 第十条 在中央财政分类补偿的基础上，按照中央与地方财政事权和支出责任划分原则，有关地方人民政府可以结合本地区实际建立分类补偿制度，对开展重要生态环境要素保护的单位和个人加大补偿力度。 法律、行政法规或者国务院规定要求由中央财政和地方财政共同出资实施分类补偿或者由地方财政出资实施分类补偿的，有关地方人民政府应当按照规定及时落实资金。 第十一条 中央财政安排重点生态功能区转移支付，结合财力状况逐步增加转移支付规模。根据生态效益外溢性、生态功能重要性、生态环境敏感性和脆弱性等特点，在重点生态功能区转移支付中实施差异化补偿，加大对生态保护红线覆盖比例较高地区支持力度。 国务院财政部门制定重点生态功能区转移支付管理办法，明确转移支付的范围和转移支付资金的分配方式。 第十二条 国家建立健全以国家公园为主体的自然保护地体系生态保护补偿机制。中央财政和地方财政对开展自然保护地保护的单位和个人分类分级予以补偿，根据自然保护地类型、级别、规模和管护成效等合理确定转移支付规模。 第十三条 地方人民政府及其有关部门获得的生态保护补偿资金应当按照规定用途使用。 地方人民政府及其有关部门应当按照规定将生态保护补偿资金及时补偿给开展生态保护的单位和个人，不得截留、占用、挪用或者拖欠。 由地方人民政府统筹使用的生态保护补偿资金，应当优先用于自然资源保护、生态环境治理和修复等。 生态保护地区所在地有关地方人民政府应当按照国家有关规定，稳步推进不同渠道生态保护补偿资金统筹使用，提高生态保护整体效益。 第三章 地区间横向补偿 第十四条 国家鼓励、指导、推动生态受益地区与生态保护地区人民政府通过协商等方式建立生态保护补偿机制，开展地区间横向生态保护补偿。 根据生态保护实际需要，上级人民政府可以组织、协调下级人民政府之间开展地区间横向生态保护补偿。 第十五条 地区间横向生态保护补偿针对下列区域开展： （一）江河流域上下游、左右岸、干支流所在区域； （二）重要生态环境要素所在区域以及其他生态功能重要区域； （三）重大引调水工程水源地以及沿线保护区； （四）其他按照协议开展生态保护补偿的区域。 第十六条 对在生态功能特别重要的跨省、自治区、直辖市和跨自治州、设区的市重点区域开展地区间横向生态保护补偿的，中央财政和省级财政可以给予引导支持。 对开展地区间横向生态保护补偿取得显著成效的，国务院发展改革、财政等部门可以在规划、资金、项目安排等方面给予适当支持。 第十七条 开展地区间横向生态保护补偿，有关地方人民政府应当签订书面协议（以下称补偿协议），明确下列事项： （一）补偿的具体范围； （二）生态保护预期目标及其监测、评判指标； （三）生态保护地区的生态保护责任； （四）补偿方式以及落实补偿的相关安排； （五）协议期限； （六）违反协议的处理； （七）其他事项。 确定补偿协议的内容，应当综合考虑生态保护现状、生态保护成本、生态保护成效以及地区经济社会发展水平、财政承受能力等因素。 生态保护地区获得的生态保护补偿资金，应当用于本地区自然资源保护、生态环境治理和修复、经济社会发展和民生改善等。需要直接补偿给单位和个人的，应当按照规定及时补偿，不得截留、占用、挪用或者拖欠。 第十八条 有关地方人民政府应当严格履行所签订的补偿协议。生态保护地区应当按照协议落实生态保护措施，生态受益地区应当按照约定积极主动履行补偿责任。 因补偿协议履行产生争议的，有关地方人民政府应当协商解决；协商不成的，报请共同的上一级人民政府协调解决，必要时共同的上一级人民政府可以作出决定，有关地方人民政府应当执行。 第十九条 有关地方人民政府在补偿协议期限届满后，根据实际需要续签补偿协议，续签补偿协议时可以对有关事项重新协商。 第四章 市场机制补偿 第二十条 国家充分发挥市场机制在生态保护补偿中的作用，推进生态保护补偿市场化发展，拓展生态产品价值实现模式。 第二十一条 国家鼓励企业、公益组织等社会力量以及地方人民政府按照市场规则，通过购买生态产品和服务等方式开展生态保护补偿。 第二十二条 国家建立健全碳排放权、排污权、用水权、碳汇权益等交易机制，推动交易市场建设，完善交易规则。 第二十三条 国家鼓励、支持生态保护与生态产业发展有机融合，在保障生态效益前提下，采取多种方式发展生态产业，推动生态优势转化为产业优势，提高生态产品价值。 发展生态产业应当完善农村集体经济组织和农村居民参与方式，建立持续性惠益分享机制，促进生态保护主体利益得到有效补偿。 地方各级人民政府应当根据实际需要，加快培育生态产品市场经营开发主体，充分发挥其在整合生态资源、统筹实施生态保护、提供专业技术支撑、推进生态产品供需对接等方面的优势和作用。 第二十四条 国家鼓励、引导社会资金建立市场化运作的生态保护补偿基金，依法有序参与生态保护补偿。 第五章 保障和监督管理 第二十五条 政府及其有关部门应当按照规定及时下达和核拨生态保护补偿资金，确保补偿资金落实到位。 政府及其有关部门应当加强对资金用途的监督管理，按照规定实施生态保护补偿资金预算绩效管理，完善生态保护责任落实的激励约束机制。 第二十六条 国家推进自然资源统一确权登记，完善生态保护补偿监测支撑体系，建立生态保护补偿统计体系，完善生态保护补偿标准体系，为生态保护补偿工作提供技术支撑。 第二十七条 国家完善与生态保护补偿相配套的财政、金融等政策措施，发挥财政税收政策调节功能，完善绿色金融体系。 第二十八条 国家建立健全统一的绿色产品标准、认证、标识体系，推进绿色产品市场建设，实施政府绿色采购政策，建立绿色采购引导机制。 第二十九条 政府和有关部门应当通过多种形式，加强对生态保护补偿政策和实施效果的宣传，为生态保护补偿工作营造良好社会氛围。 第三十条 政府和有关部门应当依法及时公开生态保护补偿工作情况，接受社会监督和舆论监督。 审计机关对生态保护补偿资金的管理使用情况依法进行审计监督。 第三十一条 截留、占用、挪用、拖欠或者未按照规定使用生态保护补偿资金的，政府和有关主管部门应当责令改正；逾期未改正的，可以缓拨、减拨、停拨或者追回生态保护补偿资金。 以虚假手段骗取生态保护补偿资金的，由政府和有关主管部门依法依规处理、处罚；构成犯罪的，依法追究刑事责任。 第三十二条 政府和有关部门及其工作人员在生态保护补偿工作中有失职、渎职行为的，依法依规追究责任。 第六章 附 则 第三十三条 本条例自2024年6月1日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.369Z"},{"slug":"regulation-20240320-a93f3dfd","title":"节约用水条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第776号","publish_date":"2024-03-20","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202403/content_6940436.htm","summary":"中华人民共和国国务院令 第776号 《节约用水条例》已经2024年2月23日国务院第26次常务会议通过，现予公布，自2024年5月1日起施行。 总理　　李强　　　　　　   2024年3月9日","themes":["节约用水","水资源"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第776号 《节约用水条例》已经2024年2月23日国务院第26次常务会议通过，现予公布，自2024年5月1日起施行。 总理 李强 2024年3月9日 节 约 用 水 条 例 第一章 总 则 第一条 为了促进全社会节约用水，保障国家水安全，推进生态文明建设，推动高质量发展，根据《中华人民共和国水法》等有关法律，制定本条例。 第二条 本条例所称节约用水（以下简称节水），是指通过加强用水管理、转变用水方式，采取技术上可行、经济上合理的措施，降低水资源消耗、减少水资源损失、防止水资源浪费，合理、有效利用水资源的活动。 第三条 节水工作应当坚持中国共产党的领导，贯彻总体国家安全观，统筹发展和安全，遵循统筹规划、综合施策、因地制宜、分类指导的原则，坚持总量控制、科学配置、高效利用，坚持约束和激励相结合，建立政府主导、各方协同、市场调节、公众参与的节水机制。 第四条 国家厉行节水，坚持和落实节水优先方针，深入实施国家节水行动，全面建设节水型社会。 任何单位和个人都应当依法履行节水义务。 第五条 国家建立水资源刚性约束制度，坚持以水定城、以水定地、以水定人、以水定产，优化国土空间开发保护格局，促进人口和城市科学合理布局，构建与水资源承载能力相适应的现代产业体系。 第六条 县级以上人民政府应当将节水工作纳入国民经济和社会发展有关规划、年度计划，加强对节水工作的组织领导，完善并推动落实节水政策和保障措施，统筹研究和协调解决节水工作中的重大问题。 第七条 国务院水行政主管部门负责全国节水工作。国务院住房城乡建设主管部门按照职责分工指导城市节水工作。国务院发展改革、工业和信息化、农业农村、自然资源、市场监督管理、科技、教育、机关事务管理等主管部门按照职责分工做好节水有关工作。 县级以上地方人民政府有关部门按照职责分工做好节水工作。 第八条 国家完善鼓励和支持节水产业发展、科技创新的政策措施，加强节水科技创新能力建设和产业化应用，强化科技创新对促进节水的支撑作用。 第九条 国家加强节水宣传教育和科学普及，提升全民节水意识和节水技能，促进形成自觉节水的社会共识和良好风尚。 国务院有关部门、县级以上地方人民政府及其有关部门、乡镇人民政府、街道办事处应当组织开展多种形式的节水宣传教育和知识普及活动。 新闻媒体应当开展节水公益宣传，对浪费水资源的行为进行舆论监督。 第二章 用水管理 第十条 国务院有关部门按照职责分工，根据国民经济和社会发展规划、全国水资源战略规划编制全国节水规划。县级以上地方人民政府根据经济社会发展需要、水资源状况和上级节水规划，组织编制本行政区域的节水规划。 节水规划应当包括水资源状况评价、节水潜力分析、节水目标、主要任务和措施等内容。 第十一条 国务院水行政、标准化主管部门组织制定全国主要农作物、重点工业产品和服务业等的用水定额（以下称国家用水定额）。组织制定国家用水定额，应当征求国务院有关部门和省、自治区、直辖市人民政府的意见。 省、自治区、直辖市人民政府根据实际需要，可以制定严于国家用水定额的地方用水定额；国家用水定额未作规定的，可以补充制定地方用水定额。地方用水定额由省、自治区、直辖市人民政府有关行业主管部门提出，经同级水行政、标准化主管部门审核同意后，由省、自治区、直辖市人民政府公布，并报国务院水行政、标准化主管部门备案。 用水定额应当根据经济社会发展水平、水资源状况、产业结构变化和技术进步等情况适时修订。 第十二条 县级以上地方人民政府水行政主管部门会同有关部门，根据用水定额、经济技术条件以及水量分配方案、地下水控制指标等确定的可供本行政区域使用的水量，制定本行政区域年度用水计划，对年度用水实行总量控制。 第十三条 国家对用水达到一定规模的单位实行计划用水管理。 用水单位的用水计划应当根据用水定额、本行政区域年度用水计划制定。对直接取用地下水、地表水的用水单位，用水计划由县级以上地方人民政府水行政主管部门或者相应流域管理机构制定；对使用城市公共供水的用水单位，用水计划由城市节水主管部门会同城市供水主管部门制定。 用水单位计划用水管理的具体办法由省、自治区、直辖市人民政府制定。 第十四条 用水应当计量。对不同水源、不同用途的水应当分别计量。 县级以上地方人民政府应当加强农业灌溉用水计量设施建设。水资源严重短缺地区、地下水超采地区应当限期建设农业灌溉用水计量设施。农业灌溉用水暂不具备计量条件的，可以采用以电折水等间接方式进行计量。 任何单位和个人不得侵占、损毁、擅自移动用水计量设施，不得干扰用水计量。 第十五条 用水实行计量收费。国家建立促进节水的水价体系，完善与经济社会发展水平、水资源状况、用水定额、供水成本、用水户承受能力和节水要求等相适应的水价形成机制。 城镇居民生活用水和具备条件的农村居民生活用水实行阶梯水价，非居民用水实行超定额（超计划）累进加价。 农业水价应当依法统筹供水成本、水资源稀缺程度和农业用水户承受能力等因素合理制定，原则上不低于工程运行维护成本。对具备条件的农业灌溉用水，推进实行超定额累进加价。 再生水、海水淡化水的水价在地方人民政府统筹协调下由供需双方协商确定。 第十六条 水资源严重短缺地区、地下水超采地区应当严格控制高耗水产业项目建设，禁止新建并限期淘汰不符合国家产业政策的高耗水产业项目。 第十七条 国家对节水潜力大、使用面广的用水产品实行水效标识管理，并逐步淘汰水效等级较低的用水产品。水效标识管理办法由国务院发展改革主管部门会同国务院有关部门制定。 第十八条 国家鼓励对节水产品实施质量认证，通过认证的节水产品可以按照规定使用认证标志。认证基本规范、认证规则由国务院认证认可监督管理部门会同国务院有关部门制定。 第十九条 新建、改建、扩建建设项目，建设单位应当根据工程建设内容制定节水措施方案，配套建设节水设施。节水设施应当与主体工程同时设计、同时施工、同时投入使用。节水设施建设投资纳入建设项目总投资。 第二十条 国家逐步淘汰落后的、耗水量高的技术、工艺、设备和产品，具体名录由国务院发展改革主管部门会同国务院工业和信息化、水行政、住房城乡建设等有关部门制定并公布。 禁止生产、销售列入前款规定名录的技术、工艺、设备和产品。从事生产经营活动的使用者应当限期停止使用列入前款规定名录的技术、工艺、设备和产品。 第二十一条 国家建立健全节水标准体系。 国务院有关部门依法组织制定并适时修订有关节水的国家标准、行业标准。 国家鼓励有关社会团体、企业依法制定严于国家标准、行业标准的节水团体标准、企业标准。 第二十二条 国务院有关部门依法建立节水统计调查制度，定期公布节水统计信息。 第三章 节水措施 第二十三条 县级以上人民政府及其有关部门应当根据经济社会发展水平和水资源状况，引导农业生产经营主体合理调整种植养殖结构和农业用水结构，积极发展节水型农业，因地制宜发展旱作农业。 国家对水资源短缺地区发展节水型农业给予重点扶持。 第二十四条 国家支持耐旱农作物新品种以及土壤保墒、水肥一体化、养殖废水资源化利用等种植业、养殖业节水技术的研究和推广。 县级以上人民政府及其有关部门应当组织开展节水农业试验示范和技术培训，指导农业生产经营主体使用节水技术。 第二十五条 国家发展节水灌溉，推广喷灌、微灌、管道输水灌溉、渠道防渗输水灌溉、集雨补灌等节水灌溉技术，提高灌溉用水效率。水资源短缺地区、地下水超采地区应当优先发展节水灌溉。 县级以上人民政府及其有关部门应当支持和推动节水灌溉工程设施建设。新建灌溉工程设施应当符合节水灌溉工程技术标准。已经建成的灌溉工程设施不符合节水灌溉工程技术标准的，应当限期进行节水改造。 第二十六条 国家加快推进农村生活节水。 县级以上地方人民政府及其有关部门应当加强农村生活供水设施以及配套管网建设和改造，推广使用生活节水器具。 第二十七条 工业企业应当加强内部用水管理，建立节水管理制度，采用分质供水、高效冷却和洗涤、循环用水、废水处理回用等先进、适用节水技术、工艺和设备，降低单位产品（产值）耗水量，提高水资源重复利用率。高耗水工业企业用水水平超过用水定额的，应当限期进行节水改造。 工业企业的生产设备冷却水、空调冷却水、锅炉冷凝水应当回收利用。高耗水工业企业应当逐步推广废水深度处理回用技术措施。 第二十八条 新建、改建、扩建工业企业集聚的各类开发区、园区等（以下统称工业集聚区）应当统筹建设供水、排水、废水处理及循环利用设施，推动企业间串联用水、分质用水，实现一水多用和循环利用。 国家鼓励已经建成的工业集聚区开展以节水为重点内容的绿色高质量转型升级和循环化改造，加快节水及水循环利用设施建设。 第二十九条 县级以上地方人民政府应当加强对城市建成区内生产、生活、生态用水的统筹，将节水要求落实到城市规划、建设、治理的各个环节，全面推进节水型城市建设。 第三十条 公共供水企业和自建用水管网设施的单位应当加强供水、用水管网设施运行和维护管理，建立供水、用水管网设施漏损控制体系，采取措施控制水的漏损。超出供水管网设施漏损控制国家标准的漏水损失，不得计入公共供水企业定价成本。 县级以上地方人民政府有关部门应当加强对公共供水管网设施运行的监督管理，支持和推动老旧供水管网设施改造。 第三十一条 国家把节水作为推广绿色建筑的重要内容，推动降低建筑运行水耗。 新建、改建、扩建公共建筑应当使用节水器具。 第三十二条 公共机构应当发挥节水表率作用，建立健全节水管理制度，率先采用先进的节水技术、工艺、设备和产品，开展节水改造，积极建设节水型单位。 第三十三条 城镇园林绿化应当提高用水效率。 水资源短缺地区城镇园林绿化应当优先选用适合本地区的节水耐旱型植被，采用喷灌、微灌等节水灌溉方式。 水资源短缺地区应当严格控制人造河湖等景观用水。 第三十四条 县级以上地方人民政府应当根据水资源状况，将再生水、集蓄雨水、海水及海水淡化水、矿坑（井）水、微咸水等非常规水纳入水资源统一配置。 水资源短缺地区县级以上地方人民政府应当制定非常规水利用计划，提高非常规水利用比例，对具备使用非常规水条件但未合理使用的建设项目，不得批准其新增取水许可。 第三十五条 县级以上地方人民政府应当统筹规划、建设污水资源化利用基础设施，促进污水资源化利用。 城市绿化、道路清扫、车辆冲洗、建筑施工以及生态景观等用水，应当优先使用符合标准要求的再生水。 第三十六条 县级以上地方人民政府应当推进海绵城市建设，提高雨水资源化利用水平。 开展城市新区建设、旧城区改造和市政基础设施建设等，应当按照海绵城市建设要求，因地制宜规划、建设雨水滞渗、净化、利用和调蓄设施。 第三十七条 沿海地区应当积极开发利用海水资源。 沿海或者海岛淡水资源短缺地区新建、改建、扩建工业企业项目应当优先使用海水淡化水。具备条件的，可以将海水淡化水作为市政新增供水以及应急备用水源。 第四章 保障和监督 第三十八条 县级以上地方人民政府应当健全与节水成效、农业水价水平、财力状况相匹配的农业用水精准补贴机制和节水奖励机制。 对符合条件的节水项目，按照国家有关规定给予补助。 第三十九条 国家鼓励金融机构提供多种形式的节水金融服务，引导金融机构加大对节水项目的融资支持力度。 国家鼓励和引导社会资本按照市场化原则依法参与节水项目建设和运营，保护其合法权益。 第四十条 国家鼓励发展社会化、专业化、规范化的节水服务产业，支持节水服务机构创新节水服务模式，开展节水咨询、设计、检测、计量、技术改造、运行管理、产品认证等服务，引导和推动节水服务机构与用水单位或者个人签订节水管理合同，提供节水服务并以节水效益分享等方式获得合理收益。 国家鼓励农村集体经济组织、农民专业合作社、农民用水合作组织以及其他专业化服务组织参与农业节水服务。 第四十一条 国家培育和规范水权市场，支持开展多种形式的水权交易，健全水权交易系统，引导开展集中交易，完善水权交易规则，并逐步将水权交易纳入公共资源交易平台体系。 第四十二条 对节水成绩显著的单位和个人，按照国家有关规定给予表彰、奖励。 第四十三条 县级以上人民政府水行政、住房城乡建设、市场监督管理等主管部门应当按照职责分工，加强对用水活动的监督检查，依法查处违法行为。 有关部门履行监督检查职责时，有权采取下列措施： （一）进入现场开展检查，调查了解有关情况； （二）要求被检查单位或者个人就节水有关问题作出说明； （三）要求被检查单位或者个人提供有关文件、资料，进行查阅或者复制； （四）法律、行政法规规定的其他措施。 监督检查人员在履行监督检查职责时，应当主动出示执法证件。被检查单位和个人应当予以配合，不得拒绝、阻碍。 第四十四条 对浪费水资源的行为，任何单位和个人有权向有关部门举报，接到举报的部门应当依法及时处理。 第四十五条 国家实行节水责任制和节水考核评价制度，将节水目标完成情况纳入对地方人民政府及其负责人考核范围。 第五章 法律责任 第四十六条 侵占、损毁、擅自移动用水计量设施，或者干扰用水计量的，由县级以上地方人民政府水行政、住房城乡建设主管部门或者流域管理机构责令停止违法行为，限期采取补救措施，处1万元以上10万元以下的罚款；造成损失的，依法承担赔偿责任。 第四十七条 建设项目的节水设施没有建成或者没有达到国家规定的要求，擅自投入使用的，以及生产、销售或者在生产经营中使用国家明令淘汰的落后的、耗水量高的技术、工艺、设备和产品的，依照《中华人民共和国水法》有关规定给予处罚。 第四十八条 高耗水工业企业用水水平超过用水定额，未在规定的期限内进行节水改造的，由县级以上地方人民政府水行政主管部门或者流域管理机构责令改正，可以处10万元以下的罚款；拒不改正的，处10万元以上50万元以下的罚款，情节严重的，采取限制用水措施或者吊销其取水许可证。 第四十九条 工业企业的生产设备冷却水、空调冷却水、锅炉冷凝水未回收利用的，由县级以上地方人民政府水行政主管部门责令改正，可以处5万元以下的罚款；拒不改正的，处5万元以上10万元以下的罚款。 第五十条 县级以上人民政府及其有关部门的工作人员在节水工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分。 第五十一条 违反本条例规定，构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第六章 附 则 第五十二条 本条例自2024年5月1日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.413Z"},{"slug":"regulation-20240125-99c444bb","title":"中华人民共和国档案法实施条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第772号","publish_date":"2024-01-25","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202401/content_6928164.htm","summary":"中华人民共和国国务院令 第772号 《中华人民共和国档案法实施条例》已经2023年12月29日国务院第22次常务会议通过，现予公布，自2024年3月1日起施行。 总理　　李强","themes":["档案","文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第772号 《中华人民共和国档案法实施条例》已经2023年12月29日国务院第22次常务会议通过，现予公布，自2024年3月1日起施行。 总理 李强 2024年1月12日 中华人民共和国档案法实施条例 第一章 总 则 第二条 《档案法》所称档案，其具体范围由国家档案主管部门或者国家档案主管部门会同国家有关部门确定。 反映地方文化习俗、民族风貌、历史人物、特色品牌等的档案，其具体范围可以由省、自治区、直辖市档案主管部门会同同级有关部门确定。 第三条 档案工作应当坚持和加强党的领导，全面贯彻党的路线方针政策和决策部署，健全党领导档案工作的体制机制，把党的领导贯彻到档案工作各方面和各环节。 第四条 县级以上人民政府应当加强档案工作，建立健全档案机构，提供档案长久安全保管场所和设施，并将档案事业发展经费列入本级预算。 机关、团体、企业事业单位和其他组织应当加强本单位档案工作，履行档案工作主体责任，保障档案工作依法开展。 第五条 国家档案馆馆藏的永久保管档案分一、二、三级管理，分级的具体标准和管理办法由国家档案主管部门制定。 第六条 中央国家机关经国家档案主管部门同意，省、自治区、直辖市有关国家机关经本级档案主管部门同意，可以制定本系统专业档案的具体管理制度和办法。 第七条 县级以上人民政府及其有关部门，应当加强档案宣传教育工作，普及档案知识，传播档案文化，增强全社会档案意识。 第八条 国家加强档案相关专业人才培养，支持高等院校、职业学校设立档案学等相关专业。 第九条 国家鼓励和支持企业事业单位、社会组织和个人等社会力量通过依法兴办实体、资助项目、从事志愿服务以及开展科学研究、技术创新和科技成果推广等形式，参与和支持档案事业的发展。 档案行业组织依照法律、法规、规章及其章程的规定，加强行业自律，推动诚信建设，提供行业服务，开展学术交流和档案相关科普教育，参与政策咨询和标准制定等活动。 档案主管部门应当在职责范围内予以指导。 第十条 有下列情形之一的，由县级以上人民政府、档案主管部门或者本单位按照国家有关规定给予表彰、奖励： （一）对档案收集、整理、保护、利用做出显著成绩的； （二）对档案科学研究、技术创新、宣传教育、交流合作做出显著成绩的； （三）在重大活动、突发事件应对活动相关档案工作中表现突出的； （四）将重要或者珍贵档案捐献给国家的； （五）同违反档案法律、法规的行为作斗争，表现突出的； （六）长期从事档案工作，表现突出的。 第二章 档案机构及其职责 第十一条 国家档案主管部门依照《档案法》第八条第一款的规定，履行下列职责： （一）根据有关法律、行政法规和国家有关方针政策，研究、制定部门规章、档案工作具体方针政策和标准； （二）组织协调全国档案事业的发展，制定国家档案事业发展综合规划和专项计划，并组织实施； （三）对有关法律、行政法规、部门规章和国家有关方针政策的实施情况进行监督检查，依法查处档案违法行为； （四）对中央国家机关各部门、中央管理的群团组织、中央企业以及中央和国务院直属事业单位的档案工作，中央级国家档案馆的工作，以及省、自治区、直辖市档案主管部门的工作，实施监督、指导； （五）组织、指导档案理论与科学技术研究、档案信息化建设、档案宣传教育、档案工作人员培训； （六）组织、开展档案领域的国际交流与合作。 第十二条 县级以上地方档案主管部门依照《档案法》第八条第二款的规定，履行下列职责： （一）贯彻执行有关法律、法规、规章和国家有关方针政策； （二）制定本行政区域档案事业发展规划和档案工作制度规范，并组织实施； （三）监督、指导本行政区域档案工作，对有关法律、法规、规章和国家有关方针政策的实施情况进行监督检查，依法查处档案违法行为； （四）组织、指导本行政区域档案理论与科学技术研究、档案信息化建设、档案宣传教育、档案工作人员培训。 第十三条 乡镇人民政府依照《档案法》第八条第三款的规定，履行下列职责： （一）贯彻执行有关法律、法规、规章和国家有关方针政策，建立健全档案工作制度规范； （二）指定人员管理本机关档案，并按照规定向有关档案馆移交档案； （三）监督、指导所属单位以及基层群众性自治组织等的档案工作。 第十四条 机关、团体、企业事业单位和其他组织应当确定档案机构或者档案工作人员，依照《档案法》第九条第一款的规定，履行下列职责： （一）贯彻执行有关法律、法规、规章和国家有关方针政策，建立健全本单位档案工作制度规范； （二）指导本单位相关材料的形成、积累、整理和归档，统一管理本单位的档案，并按照规定向有关档案馆移交档案； （三）监督、指导所属单位的档案工作。 第十五条 各级各类档案馆的设置和管理应当符合国家有关规定。 第十六条 国家档案馆应当配备与其职责和规模相适应的专业人员，依照《档案法》第十条的规定，履行下列职责： （一）收集本馆分管范围内的档案； （二）按照规定整理、保管档案； （三）依法向社会开放档案，并采取各种形式研究、开发档案资源，为各方面利用档案资源提供服务； （四）开展宣传教育，发挥爱国主义教育和历史文化教育功能。 按照国家有关规定设置的其他各类档案馆，参照前款规定依法履行相应职责。 第十七条 档案主管部门、档案馆和机关、团体、企业事业单位以及其他组织应当为档案工作人员的教育培训、职称评审、岗位聘用等创造条件，不断提高档案工作人员的专业知识水平和业务能力。 第三章 档案的管理 第十八条 按照国家规定应当形成档案的机关、团体、企业事业单位和其他组织，应当建立档案工作责任制，确定档案工作组织结构、职责分工，落实档案工作领导责任、管理责任、执行责任，健全单位主要负责人承担档案完整与安全第一责任人职责相关制度，明确档案管理、档案基础设施建设、档案信息化等工作要求。 第十九条 依照《档案法》第十三条以及国家有关规定应当归档的材料，由机关、团体、企业事业单位和其他组织的各内设机构收集齐全，规范整理，定期交本单位档案机构或者档案工作人员集中管理，任何内设机构和个人不得拒绝归档或者据为己有。 机关、群团组织、国有企业事业单位应当明确本单位的归档范围和档案保管期限，经同级档案主管部门审核同意后施行。单位内设机构或者工作职能发生重大变化时，应当及时调整归档范围和档案保管期限，经重新审核同意后施行。 机关、群团组织、国有企业事业单位负责所属单位的归档范围和档案保管期限的审核。 第二十条 机关、团体、企业事业单位和其他组织，应当按照国家档案主管部门关于档案移交的规定，定期向有关的国家档案馆移交档案。 属于中央级和省级、设区的市级国家档案馆接收范围的档案，移交单位应当自档案形成之日起满二十年即向有关的国家档案馆移交。属于县级国家档案馆接收范围的档案，移交单位应当自档案形成之日起满十年即向有关的县级国家档案馆移交。 经同级档案主管部门检查和同意，专业性较强或者需要保密的档案，可以延长向有关的国家档案馆移交的期限。已撤销单位的档案可以提前向有关的国家档案馆移交。 由于单位保管条件不符合要求或者存在其他原因可能导致不安全或者严重损毁的档案，经协商可以提前交有关档案馆保管。 第二十一条 档案馆可以按照国家有关规定，通过接受捐献、购买、代存、交换等方式收集档案。 档案馆通过前款规定方式收集档案时，应当考虑档案的珍稀程度、内容的重要性等，并以书面协议形式约定相关方的权利和义务，明确相关档案利用条件。 国家鼓励单位和个人将属于其所有的对国家和社会具有重要保存价值的档案捐献给国家档案馆。国家档案馆应当维护捐献者的合法权益。 第二十二条 档案馆应当对所保管的档案采取下列管理措施： （一）建立健全科学的管理制度和查阅利用规范，制定有针对性的安全风险管控措施和应急预案； （二）配置适宜安全保存档案、符合国家有关规定的专门库房，配备防火、防盗、防水、防光、防尘、防有害气体、防有害生物以及温湿度调控等必要的设施设备； （三）根据档案的不同等级，采取有效措施，加以保护和管理； （四）根据需要和可能，配备适应档案现代化管理需要的设施设备； （五）编制档案目录等便于档案查找和利用的检索工具。 机关、团体、企业事业单位和其他组织的档案保管，参照前款规定办理。 第二十三条 县级以上人民政府应当采取措施，保障国家档案馆依法接收档案所需的库房及设施设备。 任何单位和个人不得侵占、挪用国家档案馆的馆舍，不得擅自改变国家档案馆馆舍的功能和用途。 国家档案馆馆舍的建设，应当符合实用、安全、科学、美观、环保、节约的要求和国家有关工程建设标准，并配置无障碍设施设备。 第二十四条 机关、团体、企业事业单位和其他组织应当定期对本单位保管的保管期限届满的档案进行鉴定，形成鉴定工作报告。 经鉴定仍需继续保存的档案，应当重新划定保管期限并作出标注。经鉴定需要销毁的档案，其销毁工作应当遵守国家有关规定。 第二十五条 县级以上档案主管部门可以依托国家档案馆，对下列属于国家所有的档案中具有永久保存价值的档案分类别汇集有关目录数据： （一）机关、群团组织、国有企业事业单位形成的档案； （二）第一项所列单位之外的其他单位，经法律法规授权或者受国家机关依法委托管理公共事务形成的档案； （三）第一项所列单位之外的其他单位或者个人，由国家资金支持，从事或者参与建设工程、科学研究、技术创新等活动形成的且按照协议约定属于国家所有的档案； （四）国家档案馆保管的前三项以外的其他档案。 涉及国防、外交、国家安全、公共安全等的档案的目录数据，其汇集范围由有关档案主管部门会同档案形成单位研究确定。 第二十六条 档案馆和机关、团体、企业事业单位以及其他组织为了收集、交换散失在国外的档案、进行国际文化交流，以及适应经济建设、科学研究和科技成果推广等的需要，经国家档案主管部门或者省、自治区、直辖市档案主管部门依据职权审查批准，可以向国内外的单位或者个人赠送、交换、出售属于国家所有的档案的复制件。 第二十七条 一级档案严禁出境。二级档案需要出境的，应当经国家档案主管部门审查批准。 除前款规定之外，属于《档案法》第二十五条规定的档案或者复制件确需出境的，有关档案馆、机关、团体、企业事业单位和其他组织以及个人应当按照管理权限，报国家档案主管部门或者省、自治区、直辖市档案主管部门审查批准，海关凭批准文件查验放行。 档案或者复制件出境涉及数据出境的，还应当符合国家关于数据出境的规定。 相关单位和个人应当在档案或者复制件出境时主动向海关申报核验，并按照出境申请审查批准意见，妥善保管、处置出境的档案或者复制件。 第二十八条 档案馆和机关、团体、企业事业单位以及其他组织依照《档案法》第二十四条的规定委托档案服务时，应当确定受委托的档案服务企业符合下列条件： （一）具有企业法人资格和相应的经营范围； （二）具有与从事档案整理、寄存、开发利用、数字化等相关服务相适应的场所、设施设备、专业人员和专业能力； （三）具有保证档案安全的管理体系和保障措施。 委托方应当对受托方的服务进行全程指导和监督，确保档案安全和服务质量。 第四章 档案的利用和公布 第二十九条 国家档案馆应当依照《档案法》的有关规定，分期分批向社会开放档案，并同时公布开放档案的目录。 第三十条 国家档案馆应当建立馆藏档案开放审核协同机制，会同档案形成单位或者移交单位进行档案开放审核。档案形成单位或者移交单位撤销、合并、职权变更的，由有关的国家档案馆会同继续行使其职权的单位共同负责；无继续行使其职权的单位的，由有关的国家档案馆负责。 尚未移交进馆档案的开放审核，由档案形成单位或者保管单位负责，并在移交进馆时附具到期开放意见、政府信息公开情况、密级变更情况等。 县级以上档案主管部门应当加强对档案开放审核工作的统筹协调。 第三十一条 对于《档案法》第二十七条规定的到期不宜开放的档案，经国家档案馆报同级档案主管部门同意，可以延期向社会开放。 第三十二条 档案馆提供社会利用的档案，应当逐步实现以复制件代替原件。数字、缩微以及其他复制形式的档案复制件，载有档案保管单位签章标识的，具有与档案原件同等的效力。 第三十三条 档案馆可以通过阅览、复制和摘录等形式，依法提供利用档案。 国家档案馆应当明确档案利用的条件、范围、程序等，在档案利用接待场所和官方网站公布相关信息，创新档案利用服务形式，推进档案查询利用服务线上线下融合。 第三十四条 机关、团体、企业事业单位和其他组织以及公民利用国家档案馆保管的未开放的档案，应当经保管该档案的国家档案馆同意，必要时，国家档案馆应当征得档案形成单位或者移交单位同意。 机关、团体、企业事业单位和其他组织的档案机构保管的尚未向国家档案馆移交的档案，其他机关、团体、企业事业单位以及公民需要利用的，应当经档案形成单位或者保管单位同意。 第三十五条 《档案法》第三十二条所称档案的公布，是指通过下列形式首次向社会公开档案的全部或者部分原文： （一）通过报纸、期刊、图书、音像制品、电子出版物等公开出版； （二）通过电台、电视台、计算机信息网络等公开传播； （三）在公开场合宣读、播放； （四）公开出售、散发或者张贴档案复制件； （五）在展览、展示中公开陈列。 第三十六条 公布属于国家所有的档案，按照下列规定办理： （一）保存在档案馆的，由档案馆公布；必要时，应当征得档案形成单位或者移交单位同意后公布，或者报经档案形成单位或者移交单位的上级主管部门同意后公布； （二）保存在各单位档案机构的，由各单位公布；必要时，应当报经其上级主管部门同意后公布； （三）利用属于国家所有的档案的单位和个人，未经档案馆或者有关单位同意，均无权公布档案。 档案馆对寄存档案的公布，应当按照约定办理；没有约定的，应当征得档案所有者的同意。 第三十七条 国家档案馆应当根据工作需要和社会需求，开展馆藏档案的开发利用和公布，促进档案文献出版物、档案文化创意产品等的提供和传播。 国家鼓励和支持其他各类档案馆向社会开放和公布馆藏档案，促进档案资源的社会共享。 第五章 档案信息化建设 第三十八条 机关、团体、企业事业单位和其他组织应当加强档案信息化建设，积极推进电子档案管理信息系统建设。 机关、群团组织、国有企业事业单位应当将档案信息化建设纳入本单位信息化建设规划，加强办公自动化系统、业务系统归档功能建设，并与电子档案管理信息系统相互衔接，实现对电子档案的全过程管理。 电子档案管理信息系统应当按照国家有关规定建设，并符合国家关于网络安全、数据安全以及保密等的规定。 第三十九条 机关、团体、企业事业单位和其他组织应当采取管理措施和技术手段保证电子档案来源可靠、程序规范、要素合规，符合以下条件： （一）形成者、形成活动、形成时间可确认，形成、办理、整理、归档、保管、移交等系统安全可靠； （二）全过程管理符合有关规定，并准确记录、可追溯； （三）内容、结构、背景信息和管理过程信息等构成要素符合规范要求。 第四十条 机关、团体、企业事业单位和其他组织应当按照国家档案主管部门有关规定，定期向有关档案馆移交电子档案。电子档案移交接收网络以及系统环境应当符合国家关于网络安全、数据安全以及保密等的规定。不具备在线移交条件的，应当通过符合安全管理要求的存储介质向档案馆移交电子档案。 档案馆应当在接收电子档案时进行真实性、完整性、可用性和安全性等方面的检测，并采取管理措施和技术手段保证电子档案在长期保存过程中的真实性、完整性、可用性和安全性。 国家档案馆可以为未到本条例第二十条第二款所规定的移交进馆期限的电子档案提供保管服务，涉及政府信息公开事项的，依照《档案法》第十五条第二款的规定办理。 第四十一条 档案馆对重要电子档案进行异地备份保管，应当采用磁介质、光介质、缩微胶片等符合安全管理要求的存储介质，定期检测载体的完好程度和数据的可读性。异地备份选址应当满足安全保密等要求。 档案馆可以根据需要建设灾难备份系统，实现重要电子档案及其管理系统的备份与灾难恢复。 第四十二条 档案馆和机关、团体、企业事业单位以及其他组织开展传统载体档案数字化工作，应当符合国家档案主管部门有关规定，保证档案数字化成果的质量和安全。 国家鼓励有条件的单位开展文字、语音、图像识别工作，加强档案资源深度挖掘和开发利用。 第四十三条 档案馆应当积极创造条件，按照国家有关规定建设、运行维护数字档案馆，为不同网络环境中的档案数字资源的收集、长期安全保存和有效利用提供保障。 国家鼓励有条件的机关、团体、企业事业单位和其他组织开展数字档案室建设，提升本单位的档案信息化水平。 第四十四条 国家档案主管部门应当制定数据共享标准，提升档案信息共享服务水平，促进全国档案数字资源跨区域、跨层级、跨部门共享利用工作。 县级以上地方档案主管部门应当推进本行政区域档案数字资源共享利用工作。 第六章 监督检查 第四十五条 国家档案馆和机关、群团组织、国有企业事业单位应当定期向同级档案主管部门报送本单位档案工作情况。 第四十六条 档案主管部门对处理投诉、举报和监督检查中发现的或者有关部门移送的涉嫌档案违法的线索和案件，应当及时依法组织调查。 经调查，发现有档案违法行为的，档案主管部门应当依法予以处理。需要追究有关责任人责任的，档案主管部门可以依法向其所在单位或者任免机关、单位提出处理建议。有关机关、单位应当及时将处理结果书面告知提出处理建议的档案主管部门。 第四十七条 县级以上档案主管部门应当加强档案行政执法队伍建设和对档案行政执法人员的教育培训。从事档案行政执法工作的人员，应当通过考试，取得行政执法证件。 第七章 法律责任 第四十八条 国家档案馆违反国家规定擅自扩大或者缩小档案接收范围的，或者不按照国家规定开放、提供利用档案的，由县级以上档案主管部门责令限期改正；情节严重的，由有关机关对负有责任的领导人员和直接责任人员依法给予处分。 第四十九条 单位或者个人将应当归档的材料据为己有，拒绝交档案机构、档案工作人员归档的，或者不按照国家规定向国家档案馆移交档案的，由县级以上档案主管部门责令限期改正；拒不改正的，由有关机关对负有责任的领导人员和直接责任人员依法给予处分。 第五十条 单位或者个人侵占、挪用国家档案馆的馆舍的，由县级以上档案主管部门责令限期改正；情节严重的，由有关机关对负有责任的领导人员和直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任；造成财产损失或者其他损害的，依法承担民事责任。 第五十一条 档案服务企业在提供服务过程中明知存在档案安全隐患而不采取措施的，档案主管部门可以采取约谈、责令限期改正等措施。 档案服务企业因违反《档案法》和本条例规定受到行政处罚的，行政处罚信息依照有关法律、行政法规的规定予以公示。 第八章 附 则 第五十二条 本条例自2024年3月1日起施行。《中华人民共和国档案法实施办法》同时废止。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.443Z"},{"slug":"policy-20231206-9a63c846","title":"住房城乡建设部关于全面开展城市体检工作的指导意见","type":"policy","type_label":"政策","issuer":"住房城乡建设部","doc_no":"建科〔2023〕75号","publish_date":"2023-12-06","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202312/content_6918801.htm","summary":"和汇总分析，要坚持实事求是，充分使用全国自然灾害综合风险普查房屋建筑和市政设施调查、城市危旧房摸底调查、专业部门统计数据等已有数据资源，避免重复调查。住房、小区（社区）体检要组织街道和社区工作人员、","themes":["城市更新","城市体检"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>住房城乡建设部关于全面开展城市体检工作的指导意见 建科〔2023〕75号 各省、自治区住房城乡建设厅，直辖市住房城乡建设（管）委，北京市规划和自然资源委，新疆生产建设兵团住房城乡建设局： 近年来，各地认真学习贯彻习近平总书记关于城市体检工作的重要指示批示精神，组织各样本城市和试点城市探索创新城市体检指标体系、方式方法和体制机制，一体化推进城市体检与城市更新工作，形成了可复制推广的经验。为贯彻落实党中央、国务院关于建立城市体检评估制度的要求，在地级及以上城市全面开展城市体检工作，扎实有序推进实施城市更新行动，现提出如下意见。 一、总体要求 以习近平新时代中国特色社会主义思想为指导，深入贯彻落实党的二十大精神，完整、准确、全面贯彻新发展理念，坚持人民城市人民建、人民城市为人民，把城市体检作为统筹城市规划、建设、管理工作的重要抓手，整体推动城市结构优化、功能完善、品质提升，打造宜居、韧性、智慧城市。坚持问题导向，划细城市体检单元，从住房到小区（社区）、街区、城区（城市），找出群众反映强烈的难点、堵点、痛点问题。坚持目标导向，把城市作为“有机生命体”，以产城融合、职住平衡、生态宜居等为目标，查找影响城市竞争力、承载力和可持续发展的短板弱项。强化结果运用，把城市体检发现的问题作为城市更新的重点，聚焦解决群众急难愁盼问题和补齐城市建设发展短板弱项，有针对性地开展城市更新，整治体检发现的问题，建立健全“发现问题—解决问题—巩固提升”的城市体检工作机制。 二、重点任务 （一）明确体检工作主体和对象。开展城市体检工作要坚持城市政府主导，建立城市住房城乡建设部门牵头，各相关部门、区、街道和社区共同参与，第三方专业团队负责的工作机制。城市住房城乡建设部门要制定城市体检工作方案、工作规则和技术标准，遴选第三方专业团队。相关部门、区、街道和社区要配合第三方专业团队做好体检工作。第三方专业团队负责城市体检数据采集和分析诊断，汇总城市体检结果，编写城市体检报告。城市体检对象包括住房、小区（社区）、街区、城区（城市）。住房、小区（社区）体检要以社区为基本单元统筹开展，街区体检要结合现有街道行政边界开展，衔接城市更新单元（片区）。相关部门可组织对“平急两用”公共基础设施建设、城市基础设施生命线安全工程、历史文化保护传承等方面开展专项体检，与城市体检工作做好衔接。 （二）完善体检指标体系。围绕住房、小区（社区）、街区、城区（城市），建立城市体检基础指标体系（试行，详见附件），设定一定数量的核心指标。核心指标为能够获得精准稳定数据、可以进行纵向横向对比且具可持续性的指标。住房维度，从安全耐久、功能完备、绿色智能等方面设置房屋结构安全、管线管道、入户水质、建筑节能、数字家庭等指标。小区（社区）维度，从设施完善、环境宜居、管理健全等方面设置养老、托育、停车、充电等指标。街区维度，从功能完善、整洁有序、特色活力等方面设置中学、体育场地、老旧街区等指标。城区（城市）维度，从生态宜居、历史文化保护利用、产城融合、安全韧性、智慧高效等方面设置指标。地方各级住房城乡建设部门要结合本地实际，在城市体检基础指标体系基础上增加特色指标，细化每项指标的体检内容、获取方式、评价标准、体检周期等，做到可量化、可感知、可评价。 （三）深入查找问题短板。城市体检重在发现问题、推动解决问题。第三方专业团队开展数据采集和汇总分析，要坚持实事求是，充分使用全国自然灾害综合风险普查房屋建筑和市政设施调查、城市危旧房摸底调查、专业部门统计数据等已有数据资源，避免重复调查。住房、小区（社区）体检要组织街道和社区工作人员、物业服务企业、专业单位共同参与，畅通居民建言献策渠道，配合第三方专业团队摸清房屋使用中存在的安全隐患，找准养老、托育、停车、充电等设施缺口以及小区环境、管理方面的问题，建立各社区问题台账。涉及房屋结构安全、燃气安全等专业性较强的问题，需与专业单位出具的调查鉴定意见相一致。街区体检要充分考虑街区功能定位，衔接十五分钟生活圈，查找公共服务设施缺口以及街道环境整治、更新改造方面的问题，建立各街区问题台账。城区（城市）体检要综合评价城市生命体征状况和建设发展质量，找准短板弱项。 （四）强化体检结果应用。第三方专业团队要按照轻重缓急的原则对体检发现的问题进行系统梳理、诊断分析，将问题分为限时解决和尽力解决两类，提出问题清单和整治建议清单，并在全面汇总工作开展情况基础上，形成城市体检报告，提交城市住房城乡建设部门，经组织专家论证并征求各区政府、各有关部门意见后报城市政府。各城市要将城市体检报告提出的问题清单分解落实到各区政府、各有关部门，明确整治措施和完成时限。其中，需要限时解决的问题主要是涉及安全、健康以及群众反映强烈的突出问题，针对这类问题要做到立行立改、限时解决。对于需要尽力解决的问题，要坚持尽力而为、量力而行，一件事情接着一件事情办，一年接着一年干，尽力补齐短板弱项。城市住房城乡建设部门要依据城市体检报告，制定城市更新规划和年度实施计划，生成城市更新项目库，统筹推进既有建筑更新改造、城镇老旧小区改造、完整社区建设、活力街区打造、城市功能完善、城市基础设施更新改造、城市生态修复、历史文化保护传承等城市更新工作。要将解决上一年度体检发现问题的情况纳入到本年度的城市体检工作中，持续推进问题解决。 （五）加快信息平台建设。各级住房城乡建设部门应结合城市体检、全国自然灾害综合风险普查房屋建筑和市政设施调查、城市信息模型（CIM）基础平台建设等工作，汇聚第三方专业团队采集的体检数据、体检形成的问题清单、整治建议清单、工作进度等数据，搭建城市体检数据库，按照规定做好数据保存管理、动态更新、网络安全防护等工作。以城市体检数据库为基础，建设城市体检信息平台，发挥信息平台在数据分析、监测评估等方面的作用，实现体检指标可持续对比分析、问题整治情况动态监测、城市更新成效定期评估、城市体检工作指挥调度等功能，为城市规划、建设、管理提供基础支撑。 三、保障措施 （一）加强组织领导。各级住房城乡建设部门要充分认识开展城市体检工作的重要性，将其作为实施城市更新行动的重要基础性工作，在当地党委、政府领导下，加强部门合作，形成工作合力，扎实推进城市体检工作。城市体检工作于每年3—8月开展，各地可按照预算管理有关规定，结合实际工作需要，统筹安排资金对城市体检工作给予支持。各省（自治区）住房城乡建设部门要加大城市体检工作培训力度，加强全过程跟踪指导和工作督导，把是否达到问题查找精准、问题整治到位、更新成效显著等作为工作质量评判标准，定期通报工作进展。城市体检报告经城市政府同意后，由省（自治区）住房城乡建设部门汇总并形成综合报告后于每年9月底前报送我部。直辖市城市体检报告经直辖市政府同意后由城市体检工作主管部门于每年9月底前报送我部。 （二）强化监测评价。各省（自治区）住房城乡建设部门要把城市体检作为对城市人居环境质量改善状况和宜居、韧性、智慧城市建设成效进行考核评价的重要依据，建立监测评价机制，针对存在的问题提出改进要求并督促解决。我部将指导各省（自治区）综合考虑规模、区位、功能等因素选取具有代表性的样本城市，对城市体检工作开展情况和问题解决情况进行评估，对城市建设发展状况和水平进行评价，找出共性问题并提出政策措施建议，完善城市体检评估机制。 （三）加快专业队伍建设。各地要加大城市体检专业团队和专业人员的培养力度，遴选第三方专业团队承担城市体检工作。第三方专业团队应当配有建筑、结构、市政、规划、地理、经济等方面的专业技术人员，熟练掌握和应用城市体检工作方法，且长期服务于城市规划、建设、管理工作。住房城乡建设部将遴选并公布一批业务水平高、综合能力强、实践经验丰富的城市体检专业团队，为地方工作提供支撑。 （四）动员公众参与。各地要加大城市体检工作宣传力度，通过主流媒体、网络、新媒体平台等对城市体检工作进行政策解读和宣传，让人民群众关心了解城市体检工作，引导公众积极参与。要采取多种方式畅通公众参与城市体检工作的渠道，倾听群众声音，了解群众诉求，及时回应群众关切，落实“人民城市人民建、人民城市为人民”的理念，营造全社会支持参与城市体检工作的良好氛围。 附件：城市体检基础指标体系（试行）（略） 住房城乡建设部 2023年11月29日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.507Z"},{"slug":"case-20231201-2933079b","title":"普洱景迈山古茶林文化景观（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2023-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1665","summary":"普洱景迈山古茶林文化景观位于中国，2023年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(v)，遗产类型为文化遗产。名录坐标：北纬22.1842，东经100.0075。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：普洱景迈山古茶林文化景观 英文名称：Cultural Landscape of Old Tea Forests of the Jingmai Mountain in Pu’er 国家/地区：中国 列入年份：2023 世界遗产标准：(iii)(v) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：22.1841666667, 100.0075 名录编号：1665 官方页面：https://whc.unesco.org/en/list/1665\u003c/p>\n\u003cp>【官方描述】 该文化景观位于中国云南景迈山，由当地布朗族、傣族民众遵循始于10世纪的实践，历经千余年培育而成。这里是一片茶乡，森林和茶园环绕的多个传统村落掩映在古茶树间。古茶树的传统林下栽培方式，因应山区生态系统和亚热带季风气候的特点，并与当地社区维护的管理体系相结合。人们笃信“茶祖”，他们相信茶树有灵、自然有灵，这里的传统仪式和节庆活动与这一信仰密切相关。\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.053Z"},{"slug":"case-20231129-f0d36ee4","title":"福州烟台山历史风貌区保护更新与活化利用实践","type":"case","type_label":"案例","issuer":"福州市历史文化名城管委会","doc_no":"","publish_date":"2023-11-29","effective_date":"","status":"实践报道","level":"地方级","region":"福州","source_name":"福州市历史文化名城管委会（名城保护专题）","source_url":"https://www.fuzhou.gov.cn/zgfzzt/lswhmcgwh/zwgk/ztzl/bhqy/202311/t20231129_4726786.htm","summary":"福州市历史文化名城管委会“名城保护”专题介绍烟台山片区城市更新历程。烟台山自明代起即为福建对外经济文化交流的重要窗口，现存近现代历史建筑一百余处，片区通过历史风貌保护、功能织补、业态导入与文化活动运营实现从“留下来”向“活起来”的保护更新，2023年上半年接待游客近660万人次、旅游收入近1.7亿元。福建省文物局转载中央广播电视总台报道可作交叉印证。","themes":["历史文化街区","保护更新","城市更新","历史建筑","文化传承"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>一、基本情况\u003c/p>\n\u003cp>烟台山片区位于福州市仓山区闽江南江滨，地处福州市历史文化中轴线的最南端，又是现代福州城的地理区位中心，包含烟台山历史文化风貌区（798.3亩）、公园路历史建筑群（277.5亩）及马厂街历史建筑群（68.7亩），辐射整个3150亩的烟台山。片区含38条历史街巷，191栋文保建筑、历史建筑及传统风貌建筑，10处古井、石碑、古巷道等。由外国领事馆、教堂、洋行等各式风格建筑构成“万国建筑博物馆”的建筑风貌。集中了文物古迹、历史建筑、街巷肌理、历史水系等物质形态所携带的真实的历史信息。\u003c/p>\n\u003cp>在地质历史上烟台山的形成较晚，在汉朝初期烟台山的位置还是一片水域，到了唐朝时期才形成陆地。到唐末五代十国时期，烟台山开始有人烟居住，然后缓步发展，直到清末至民国这将近百年的时间才真正型成规模。清道光二十二年（1842）,福州被辟为五口通商口岸之一。烟台山因其特殊的地理位置和自然条件而为外国所垂青，逐步成为近代福州的领事馆区、外贸基地和航运中心。清道光二十五年（1845年），英国在烟台山首设领事馆。至20世纪初，共有英、法、美、德、俄、日、荷等17个国家在此设立领事馆或代办处。至光绪年间，烟台山已有13所教会学校、9座教堂、4家医院、5家银行和54家洋行。民国时期，华侨办实业、进行房地产投资成为烟台山的主要建设活动，一批风格多样、造型美观的近代中西建筑在烟台山拔地而起。\u003c/p>\n\u003cp>二、更新目标\u003c/p>\n\u003cp>新中国成立后，英、法、美等外国势力撤离，但烟台山的外国领事馆、教堂、洋行等各式风格建筑却保存了下来，与我国的中式园林古厝，共同奠定了烟台山“万国建筑博物馆”的建筑特色和风貌。在新中国成立后，这些建筑大多成为公房，分配给市民居住。一房多户致使住户在这些建筑边上搭建了众多的低矮建筑，加之市政配套落后，改造前的烟台山棚户密布、人居环境差。随着经济的发展，市、区政府高度重视烟台山历史风貌区文化遗产的保护、开发及利用，分期分批对烟台山片区进行保护更新。\u003c/p>\n\u003cp>三、更新措施\u003c/p>\n\u003cp>为做好烟台山片区城市更新工作，本着“尊重历史与自然”的原则，坚持“立足减法，慎做加法，着重乘法”，高水准策划、高起点打造、高标准施工，全力推进片区保护更新工作。\u003c/p>\n\u003cp>（一）加强规划指导\u003c/p>\n\u003cp>2010年起，编制了《烟台山历史文化风貌区保护规划》及《公园路及马厂街历史建筑群保护规划》，2014年福州市政府审议通过。2018年，编制完成《烟台山历史文化风貌区保护改造提升规划》。2021年，仓山区政府对由上三路、六一南路及仓前路组成的烟台山片区（约3150亩），按“征收一批、修缮一批、展示一批、整治一批、提升一批”的策略，形成《烟台山片区整治提升策划方案》。2022年编制《福州烟台山旅游总体规划（2021-2030）》，规划范围为烟台山片区，东至六一南路，北至闽江南岸、中洲岛和江心岛，南至上三路，总面积约3150亩。\u003c/p>\n\u003cp>（二）安置棚户居民\u003c/p>\n\u003cp>自2010年起，先后启动烟台山（一、二期）、塔亭路地块、烟台山特色街区及危旧房零星改造等10个涉迁项目，征收面积约253亩，搬迁居民3100余户，收储文保及历史建筑110余栋，拆除棚户建筑22.4万平方米。\u003c/p>\n\u003cp>（三）加强风貌整治\u003c/p>\n\u003cp>全面梳理传统老街巷，串联贯通主要景观节点。开展完整街区、“十位一体”及城市品质提升等整治项目，保护整治提升乐群路、爱国路、亭下路等25条老街巷。结合老旧小区整治、街头公园建设，实施缆线下地，增设休憩场所、景观节点等配套，完善照明、标识导览、雨污管网等系统。配合“闽江之心”核心区整体提升，开展闽江南岸景观及中洲岛整治提升工作。\u003c/p>\n\u003cp>（四）加强古厝修缮\u003c/p>\n\u003cp>在全省创新古厝保护制度，实行影像定格、入户宣传、身份识别、构件认定、建筑挂牌等举措，特别是给保留建筑挂上设计醒目美观的“保留”标识，在全市的征迁工作中推广，并被省文物局发文号召全省学习。推动古厝修缮工作，坚持“修旧如旧、保护为主、利用为辅”，已修缮完成89栋保留建筑（文保建筑55栋，历史建筑及传统风貌建筑34栋）及8处石碑、古巷道等文物登记点。\u003c/p>\n\u003cp>（五）推进街区改造\u003c/p>\n\u003cp>近年来累计投入27.85亿元人民币，统筹推进仓前九里、烟台山公园及烟台山特色历史文化街区等建设项目，对乐群路—爱国路—亭下路—仓前路—梅坞路的闭环动线和烟台路、槐荫里、对湖弄等支巷的市政设施、市政景观及公共卫生等方面进行全方位的整治提升，基本完成核心保护区域的保护改造工作。目前已完成江心公园、烟台山公园、烟台山特色历史文化街区、仓前九里项目、“十位一体”及城市品质提升项目等6个项目，正开展塔亭地块、中洲岛整治提升等2个项目，储备有马厂街片区、公园路片区及麦园路片区等3个项目。\u003c/p>\n\u003cp>四、运维措施\u003c/p>\n\u003cp>（一）加强组织领导，组建保护机构\u003c/p>\n\u003cp>成立了由仓山区主要领导任组长，分管领导任常务副组长，各相关部门、镇街为领导小组成员的烟台山、林浦、螺洲历史文化保护提升和活化利用领导小组，从征迁置换、保护修缮、整治提升、文化挖掘活化、开发运营、法律指导六大方面统筹推进片区提升工作。要求每周动态更新周工作进展和周工作计划，形成“事事有计划、件件有督查”的良好机制。\u003c/p>\n\u003cp>2012年，仓山区政府成立直属事业单位烟台山管理委员会，负责烟台山历史风貌区的保护改造工作。管委会积极参与《烟台山历史文化风貌区保护规划》、《公园路及马厂街历史建筑群保护规划》等规划的编制工作，积极推动仓前九里、江心公园、烟台山公园、特色历史文化街区等项目建设，积极完成文保建筑、历史建筑的修缮利用工作，积极完善烟台山历史风貌区的运管机制。\u003c/p>\n\u003cp>（二）文旅商融合发展，打造旅游新高地\u003c/p>\n\u003cp>目前烟台山实行在管委会的统筹协调下，由仓山区园林中心、仓山区文投集团、万科集团、市古厝集团分片区运管的模式。\u003c/p>\n\u003cp>由仓山区园林中心负责烟台山公园的运管，实行免费开园、公益活动。由仓山区文投集团负责烟台山特色历史文化街区的运管，街区主打泛博物馆业态。由万科集团负责烟台山漫步商业街街区的运管，主打商业业态。暂由市古厝集团负责塔亭地块的运管，主要为上办下商的经营形态，汇集了众多产业族群，咖啡、早午餐、餐酒馆、面包坊、网红香氛集合店，形成基本的小资生活氛围。目前正在建设中，修缮好的古厝先行活化利用。\u003c/p>\n\u003cp>1.创高A级景区。2021年公布批准福州烟台山为国家3A级旅游景区。\u003c/p>\n\u003cp>2.提升品牌知名度。2022年烟台山获评“第二批福建省特色步行街”（ 省商务厅）、“中国华侨国际文化交流基地”、“福建省对外文化交流基地”。2023年获省文旅厅推荐上报国家级国家级夜间文化和旅游消费集聚区。2023年入围第二届三联周刊人文城市奖“城市创新奖”，入围第十三届中国旅游艾蒂亚奖最佳城市文旅项目。\u003c/p>\n\u003cp>3.完善游客服务中心配置。不断响应游客及专家意见，持续优化游客中心内部设施及服务人员服务质量，确保游客中心“五种设施、十一种服务”配套齐全，开设游客咨询、游客投诉、导游服务等窗口。\u003c/p>\n\u003cp>4.加强交通管理。编制《烟台山片区道路交通组织优化设计方案》，并在景区内部组织实施。协调交警部门在节假日及早晚车流高峰期加派警力维护交通秩序。加强车库停车引导。制作烟台山交通攻略。\u003c/p>\n\u003cp>5.完善标识标牌导览系统。目前已在烟台山历史风貌区制作安装246个外语标识标牌，含入口形象标识、景区介绍标识、导游全景图标识、景点介绍标识、地图引导标识、人行导向标识、安全警示、温馨提醒、植物名称标识等各种标牌。\u003c/p>\n\u003cp>6.设置烟台山特色纪念品销售部。区文投集团积极研发烟台山特色纪念品，目前已开发烟台山文创雪糕、公仔、特色陶瓷、纸扇、手绘地图、抱枕、影集等特色纪念品，并在梅坞路4号烟台山游客服务中心设置销售部进行销售。\u003c/p>\n\u003cp>7.串点成线，打造经典参观线路。自景区开放以来，我委梳理烟台山景观特色，推出万国风情、休闲商务、红色教育研学、山水联动“闽江之心”等精品旅游观光路线，并在游客服务中心、微信公众号上进行推介，众多旅游社也采用并组织市民游客参观烟台山片区内相关旅游观光。\u003c/p>\n\u003cp>（三）引入产业业态，推动古厝利用\u003c/p>\n\u003cp>深入挖掘烟台山的文化内涵，讲好建筑背后的故事，活化利用古厝资源。创新运营模式，植入新业态，打造以烟台山文化内涵为核心的文化旅游产业。\u003c/p>\n\u003cp>1.优化古厝运营。探索“以商养馆”活化模式，为风貌区的保护修复工作导入更多的社会资源，更好的根据市场变化对业态进行调整，实现风貌区业态的良性发展。将安澜会馆、蝶园、罗宅等古厝委托浙江商会、万科集团等不同社会力量进行活化利用。\u003c/p>\n\u003cp>2.引入展陈业态。烟台山积极探索政府主导、社会参与的模式，引入社会力量参与主题（微型）博物馆建设运营工作。计划在乐群楼、闽海关税务司官邸等17栋古厝中引入展陈业态，在传承历史文化的同时，提升街区的文化品质。\u003c/p>\n\u003cp>3.引入商业业态。充分发挥民营企业运管灵活的优势，盘活老建筑。一是准确定位商业街区目标客户人群。二是组件年轻的招商团队，用年轻人的业态来吸引年轻人。三是发挥万科集团全国性企业的优势引入奈雪的茶、蔚来汽车等潮流店铺。四是动员本土特色店主，引入集在地传统文化、手工艺、文化体验等多种业态进行经营，从而形成烟台山商业漫步街区集聚效应。\u003c/p>\n\u003cp>4.引入民宿业态。引进戏梦蝶园、烟山方舟等民宿品牌，实现了仓山旅游民宿零的突破。\u003c/p>\n\u003cp>（四）挖掘文化内涵，推进课题研究\u003c/p>\n\u003cp>1.历史文化挖掘。深度挖掘文化内涵，广泛收集资料，先后推出《烟台山史话》、《行走烟台山》、《流翠烟台山》、《看不见的烟台山》等系列作品。\u003c/p>\n\u003cp>2.名人事迹挖掘。深入挖掘烟台山相关历史文化名人事迹，通过展架、展板的形式将黄乃裳、孙中山历史名人事迹在相关历史建筑、烟台山公园中进行宣传。\u003c/p>\n\u003cp>3.做好课题研究。对接市古厝研究会借助其优势，搭建烟台山文化研究平台，推进烟台山文化课题研究。\u003c/p>\n\u003cp>（五）组织文化艺术活动，拓宽宣传矩阵\u003c/p>\n\u003cp>一是做热主题活动。整合优质资源，每年在烟台山常态化举办“中华花朝节”、数字峰会烟台山场景打造等40余场活动，在保持烟台山热度不减的同时发挥辐射带动作用。二是“闽江之心”活动聚人气。依托“闽江之心”精心策划在烟台山组织焰火秀、元宵灯会、中华花朝节、“闽江之心”青少年歌手大赛等文旅活动，全面发展文旅经济、夜色经济、假日经济等。三是讲好烟台山故事，配合区旅发中心，推出古厝沉浸式高端访谈专栏，探寻烟台山历史文化底蕴。四是组织两岸青少年开展活动。努力促进两岸经济文化交流合作，积极配合台办、两岸青年交流促进协会等单位来烟台山组织开展两岸青少年交流活动，做好在地服务。\u003c/p>\n\u003cp>通过传统媒体、网络媒体、新媒体，高密度展示“烟台山”文旅资源、产品，扩大烟台山文旅影响力；依托新兴媒体打造网红景点（石厝银杏）、网红名人（单车咖啡大叔），多渠道全方位宣传烟台山。烟台山成为福州文旅新名片，2023年至今协同区文投集团共接待省内外各类政务调研、考察等近400场。\u003c/p>\n\u003cp>五、总结经验\u003c/p>\n\u003cp>（一）街区改造理念方面。在涉及文物保护的老城区改造中，要规划先行，涉及文物保护的老城区改造不仅涉及文脉的传承，而且还涉及民生的便利。在征询相关专家意见的同时，还要注重发挥群众的力量，征求群众的意见。\u003c/p>\n\u003cp>（二）规划先行。通过各项规划设计，从顶层设计上为风貌区文保单位和历史建筑保护修复、不协调建筑整治改造、市政基础设施配套完善、文化商业业态优化提升、非物质文化遗产保护传承等片区有机更新工作提供指导依据。\u003c/p>\n\u003cp>（三）机制创新。烟台山风貌区城市微更新在实施主体上，改变以往单一由政府或国企主导模式，基于政府、市场与社会并举的合作参与机制，充分调度三方主体参与的积极性，加强沟通协作，共同治理、共同缔造。\u003c/p>\n\u003cp>（本案例由福州市历史文化名城管理委员会“主题教育”课题调研组 仓山区建设局推荐）来源：名城委\u003c/p>\n\u003cp>——\u003c/p>\n\u003cp>补充报道：福建省文物局《福州烟台山：百年老街区 潮流与历史的碰撞》（2023-08-16，来源：中央广播电视总台） 福州烟台山，是福州最具特色的历史文化风貌区之一，自明朝起就是福建对外经济文化交流的重要窗口。有“万国建筑博物馆”之称的烟台山，用一砖一瓦定义着这片土地的多元、包容与厚重底蕴。17个国家的领事馆或办事处，30多处教堂、洋行、学校、书局，从老洋房到中式古厝，这里现存有近现代历史建筑一百多处。如今，经过活化利用，这些老建筑也正从“留下来”走向“活起来”。\u003c/p>\n\u003cp>漫步街区之中，可以轻松打卡各国美食。除了美食，还有许多新潮好店，在烟台山等你探索。街区中的音乐舞台、展览现场、快闪剧场，让这里成为开放性的艺术馆。\u003c/p>\n\u003cp>沉浸式话剧、街头艺术节、咖啡市集、露天音乐会……这些潮流文化艺术活动，成为了烟台山商圈新的经济增长点。根据统计，今年上半年，烟台山接待的游客量近660万人，实现旅游总收入近1.7亿元。百年烟台山，正焕发出新的商业活力。\u003c/p>\n\u003cp>烟台山的街道纵横将历史与新潮、古典与现代，立体地展示在我们面前。这个暑期，让我们在老仓山的烟火气里遇见世界的新潮流。\u003c/p>\n\u003cp>来源：中央广播电视总台\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-19 07:33:35"},{"slug":"policy-20230724-48ba0dd0","title":"国务院办公厅关于在超大特大城市积极稳步推进城中村改造的指导意见","type":"policy","type_label":"政策","issuer":"国务院办公厅","doc_no":"国办发〔2023〕25号","publish_date":"2023-07-24","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202307/content_7025843.htm","summary":"国务院办公厅关于在超大特大城市 积极稳步推进城中村改造的指导意见 国办发〔2023〕25号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 城中村是在工业化、城镇化快速发展进程中形成的，普遍...","themes":["城中村改造","城市更新"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>国务院办公厅关于在超大特大城市 积极稳步推进城中村改造的指导意见 国办发〔2023〕25号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 城中村是在工业化、城镇化快速发展进程中形成的，普遍存在公共卫生安全风险大、房屋安全和消防安全隐患多、配套设施落后、环境脏乱差、社会治理难等突出问题，亟需实施改造。为指导超大特大城市积极稳步推进城中村改造，有效消除各类安全风险隐患，推动城市高质量发展，经国务院同意，现提出以下意见。 一、总体要求 （一）指导思想。以习近平新时代中国特色社会主义思想为指导，全面贯彻落实党的二十大精神，坚持稳中求进工作总基调，完整、准确、全面贯彻新发展理念，加快构建新发展格局，坚持以人民为中心，采取拆除新建、整治提升、拆整结合等多种方式，按照城市标准有力有序有效推进城中村改造，切实消除安全风险隐患，改善居住条件和生态环境，高效综合利用土地资源，提高土地利用效率，促进产业转型升级，推进以人为核心的新型城镇化，推动超大特大城市加快转变发展方式，建设宜居、韧性、智慧的现代化城市。 （二）基本原则 ——坚持问题导向。从实际出发，稳中求进、积极稳妥，分三类实施改造，具备条件的城中村实施拆除新建；不具备条件的不可强行推进，要开展经常性整治提升，防控风险隐患；介于前两类之间的实施拆整结合。 ——坚持目标导向。拆除新建的应按照城市标准规划建设管理，整治提升的应按照文明城市标准整治提升和实施管理，守住安全底线。 ——坚持先谋后动。城市人民政府应做好征求村民意见、产业先行搬迁、人员妥善安置、历史文化风貌保护、落实征收补偿安置资金等前期工作，确保城中村改造先谋后动、动则必快、动则必成，真正把好事办好、实事办实。 ——坚持市场在资源配置中起决定性作用，更好发挥政府作用。城中村改造坚持规划先行、依法征收，更好发挥政府作用；坚持公平公开、净地出让，发挥市场的决定性作用。 ——坚持城市人民政府负主体责任。要尽力而为、量力而行。城市人民政府应做好城中村改造工作的组织实施，省级人民政府应加强领导和政策支持。 二、重点任务 （三）明确城中村改造范围。城中村改造包括城镇开发边界内的各类城中村，具体范围由城市人民政府结合实际确定。优先对群众需求迫切、城市安全和社会治理隐患多的城中村进行改造，成熟一个推进一个，实施一项做成一项。 （四）编制城中村改造规划计划。城市人民政府要加快摸清本区域城中村总量、分布、规模等情况，合理确定城中村改造空间单元范围，编制城中村改造控制性详细规划。区分轻重缓急，结合需要与可能，编制城中村改造计划，建立项目清单，明确改造目标、改造方式、资金筹措安排、支持政策、组织实施等内容。制定城中村改造拆除新建、整治提升、拆整结合三个工作导则，确定三类改造方式内容清单。研究制定关于城中村改造中加强历史文化风貌保护的规定。 （五）依法实施征收 1.建立健全征收制度。城市人民政府应当明确集体土地上房屋征收补偿责任部门、征收补偿标准和程序，并对依法申请强制执行情形等作出规定。对集体土地上历史遗留违法用地和违章建筑问题，由城市人民政府依法依规分类明确认定标准和处置政策，予以妥善处理。城中村改造项目涉及土地在第二次全国土地调查和第三次全国国土调查中均被调查认定为建设用地的，在符合规划用途前提下，允许按建设用地办理土地征收等手续。 2.保障村民合法权益。启动城中村改造应当征求村民意愿，在大部分村民同意的情况下方可实施改造。在改造过程中，应听取村民和农村集体经济组织对改造方案、征收补偿方案、集体资产处置等的意见，保障村民知情权和参与权。应先行安排安置房项目供地和建设，加强安置房规划设计和建设管理工作，确保安置房在合理工期内建成，安置房品质不低于商品住房水平，配套基础设施和公共服务设施与安置房同步规划、同步设计、同步报批、同步建设、同步交付使用。 3.做好产业先行搬迁。城市人民政府要摸清城中村产业情况，安排好产业转移承接园区，先行有序疏解在城中村集聚的产业。充分发挥龙头企业在产业转移中的示范带动作用，妥善做好人员安置等工作。根据城市产业发展规划，在城中村改造中合理安排产业布局，引入优质产业项目，促进产业转型升级。要提供一定规模比例的低成本创业空间，保障小微企业和个体户的创业需求。 （六）多渠道筹措改造资金 1.落实城市人民政府对资金平衡的主体责任。城市人民政府应制定市域内城中村改造资金平衡方案，统筹市域内改造资金安排，做到改造资金市域内综合平衡、动态平衡，避免新增地方政府债务风险。整治提升类城中村改造应建立政府与村民、社会力量改造资金共担机制。 2.采取实现城中村改造项目资金平衡的有效措施。鼓励实施区域统筹和成片开发，城中村改造项目土地四至范围在村集体建设用地基础上，可扩大至周边少量低效用地。允许通过在集体建设用地之间、集体与国有建设用地之间进行土地整合、置换等方式，促进区域统筹和成片开发。城中村改造可在市域内统筹平衡规划指标，对改造项目在规划用地性质、建筑规模等方面予以支持优化。城中村改造中配套的教育、医疗等公共服务设施应尽量利用原有设施，确需新建或改建的，相关建设费用由城市人民政府负责投入，不摊入城中村改造成本。 3.政府筹措资金或引入社会资金。城市人民政府立足现有渠道做好经费保障。在先行确定规划指标、合作单位选择条件和净地出让等前提下，按照公开择优原则，建立竞争性准入机制，组织采用公开招标、邀请招标、竞争性磋商等方式，选择优质合作单位，相应城中村改造项目内土地可依法实施综合评价出让或带设计方案出让。积极创新改造模式，鼓励和支持民间资本参与，努力发展各种新业态，实现可持续运营。引入社会资金的具体办法由城市人民政府制定。 （七）将城中村改造与保障性住房建设相结合。城中村改造地块除安置房外的住宅用地及其建筑规模原则上应当按一定比例建设保障性住房，具体比例及保障性住房的规划设计和建设管理办法由城市人民政府确定。鼓励将村民富余的安置房以小户型为主单独设计、集中建设，并长期租赁用作保障性租赁住房。鼓励在妥善做好原有租户安置搬迁、租金基本稳定的前提下，将城中村房屋整体长期租赁并改造提升用作保障性租赁住房。防止出现新的城中村。 三、支持政策 （八）加大对城中村改造的政策支持。对符合条件的城中村改造项目，中央通过现有渠道适当给予补助。将符合条件的城中村改造项目纳入地方政府专项债券支持范围。鼓励银行业金融机构按照市场化、法治化原则提供城中村改造贷款，专款专用、封闭管理。符合条件的城中村改造项目适用现行棚户区改造有关税费支持政策。 四、组织实施 （九）落实地方责任。城市人民政府要切实担负主体责任，加强领导，把城中村改造工作列入重要议事日程，健全跨部门、多层级的工作机制，发挥街道、社区等基层组织作用，加强城中村管理，细化政策措施，做好矛盾纠纷排查化解和防范处置，统筹处理各方面利益诉求，及时解决遇到的困难和问题，确保城中村改造顺利推进。省级人民政府要加强指导督促和监督检查。 （十）加强协调配合。住房城乡建设部要会同国家发展改革委、财政部、自然资源部、中国人民银行、金融监管总局等部门，加强对城中村改造工作的组织协调和督促指导，按照职责研究制定城中村改造相关配套政策，形成“1+N”政策体系并抓好落实。 （十一）做好舆论引导。加强政策宣传解读、示范引领，推广城中村改造优秀项目、典型案例的好经验好做法和创造性实践，营造积极稳步推进城中村改造的良好氛围。 具备条件的城区常住人口300万以上的大城市，可参照本意见执行。 国务院办公厅 2023年7月24日 （本文有删减）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.562Z"},{"slug":"policy-20230711-c6a1bbf8","title":"住房城乡建设部关于扎实有序推进城市更新工作的通知","type":"policy","type_label":"政策","issuer":"住房城乡建设部","doc_no":"建科〔2023〕30号","publish_date":"2023-07-11","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202307/content_6891045.htm","summary":"城市更新工作各领域和全过程，加大城镇危旧房屋改造和城市燃气管道等老化更新改造力度，确保城市生命线安全，坚决守住安全底线。 各级住房城乡建设部门要切实履行城市更新工作牵头部门职责，会同有关部门建立健全","themes":["城市更新"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>住房城乡建设部关于扎实有序推进城市更新工作的通知 建科〔2023〕30号 各省、自治区住房城乡建设厅，直辖市住房城乡建设（管）委，新疆生产建设兵团住房城乡建设局： 按照党中央、国务院关于实施城市更新行动的决策部署，我部组织试点城市先行先试，全国各地积极探索推进，城市更新工作取得显著进展。为深入贯彻落实党的二十大精神，复制推广各地已形成的好经验好做法，扎实有序推进实施城市更新行动，提高城市规划、建设、治理水平，推动城市高质量发展，现就有关事项通知如下： 一、坚持城市体检先行。建立城市体检机制，将城市体检作为城市更新的前提。指导城市建立由城市政府主导、住房城乡建设部门牵头组织、各相关部门共同参与的工作机制，统筹抓好城市体检工作。坚持问题导向，划细城市体检单元，从住房到小区、社区、街区、城区，查找群众反映强烈的难点、堵点、痛点问题。坚持目标导向，以产城融合、职住平衡、生态宜居等为目标，查找影响城市竞争力、承载力和可持续发展的短板弱项。坚持结果导向，把城市体检发现的问题短板作为城市更新的重点，一体化推进城市体检和城市更新工作。 二、发挥城市更新规划统筹作用。依据城市体检结果，编制城市更新专项规划和年度实施计划，结合国民经济和社会发展规划，系统谋划城市更新工作目标、重点任务和实施措施，划定城市更新单元，建立项目库，明确项目实施计划安排。坚持尽力而为、量力而行，统筹推动既有建筑更新改造、城镇老旧小区改造、完整社区建设、活力街区打造、城市生态修复、城市功能完善、基础设施更新改造、城市生命线安全工程建设、历史街区和历史建筑保护传承、城市数字化基础设施建设等城市更新工作。 三、强化精细化城市设计引导。将城市设计作为城市更新的重要手段，完善城市设计管理制度，明确对建筑、小区、社区、街区、城市不同尺度的设计要求，提出城市更新地块建设改造的设计条件，组织编制城市更新重点项目设计方案，规范和引导城市更新项目实施。统筹建设工程规划设计与质量安全管理，在确保安全的前提下，探索优化适用于存量更新改造的建设工程审批管理程序和技术措施，构建建设工程设计、施工、验收、运维全生命周期管理制度，提升城市安全韧性和精细化治理水平。 四、创新城市更新可持续实施模式。坚持政府引导、市场运作、公众参与，推动转变城市发展方式。加强存量资源统筹利用，鼓励土地用途兼容、建筑功能混合，探索“主导功能、混合用地、大类为主、负面清单”更为灵活的存量用地利用方式和支持政策，建立房屋全生命周期安全管理长效机制。健全城市更新多元投融资机制，加大财政支持力度，鼓励金融机构在风险可控、商业可持续前提下，提供合理信贷支持，创新市场化投融资模式，完善居民出资分担机制，拓宽城市更新资金渠道。建立政府、企业、产权人、群众等多主体参与机制，鼓励企业依法合规盘活闲置低效存量资产，支持社会力量参与，探索运营前置和全流程一体化推进，将公众参与贯穿于城市更新全过程，实现共建共治共享。鼓励有立法权的地方出台地方性法规，建立城市更新制度机制，完善土地、财政、投融资等政策体系，因地制宜制定或修订地方标准规范。 五、明确城市更新底线要求。坚持“留改拆”并举、以保留利用提升为主，鼓励小规模、渐进式有机更新和微改造，防止大拆大建。加强历史文化保护传承，不随意改老地名，不破坏老城区传统格局和街巷肌理，不随意迁移、拆除历史建筑和具有保护价值的老建筑，同时也要防止脱管失修、修而不用、长期闲置。坚持尊重自然、顺应自然、保护自然，不破坏地形地貌，不伐移老树和有乡土特点的现有树木，不挖山填湖，不随意改变或侵占河湖水系。坚持统筹发展和安全，把安全发展理念贯穿城市更新工作各领域和全过程，加大城镇危旧房屋改造和城市燃气管道等老化更新改造力度，确保城市生命线安全，坚决守住安全底线。 各级住房城乡建设部门要切实履行城市更新工作牵头部门职责，会同有关部门建立健全统筹协调的组织机制，有序推进城市更新工作。省级住房城乡建设部门要加强对市（县）城市更新工作的督促指导，及时总结经验做法，研究破解难点问题。我部将加强工作指导和政策协调，及时总结可复制推广的经验，指导各地扎实推进实施城市更新行动。 住房城乡建设部 2023年7月5日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.587Z"},{"slug":"regulation-20220421-9685cd3f","title":"地名管理条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第753号","publish_date":"2022-04-21","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/2022-04/21/content_5686491.htm","summary":"中华人民共和国国务院令 第753号 《地名管理条例》已经2021年9月1日国务院第147次常务会议修订通过，现予公布，自2022年5月1日起施行。 总理　　李克强 2022年3月30日 地名管理条例","themes":["地名管理","文化遗产"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第753号 《地名管理条例》已经2021年9月1日国务院第147次常务会议修订通过，现予公布，自2022年5月1日起施行。 总理 李克强 2022年3月30日 地名管理条例 第一章 总 则 第一条 为了加强和规范地名管理，适应经济社会发展、人民生活和国际交往的需要，传承发展中华优秀文化，制定本条例。 第二条 中华人民共和国境内地名的命名、更名、使用、文化保护及其相关管理活动，适用本条例。 第三条 本条例所称地名包括： （一）自然地理实体名称； （二）行政区划名称； （三）村民委员会、居民委员会所在地名称； （四）城市公园、自然保护地名称； （五）街路巷名称； （六）具有重要地理方位意义的住宅区、楼宇名称； （七）具有重要地理方位意义的交通运输、水利、电力、通信、气象等设施名称； （八）具有重要地理方位意义的其他地理实体名称。 第四条 地名管理应当坚持和加强党的领导。县级以上行政区划命名、更名，以及地名的命名、更名、使用涉及国家领土主权、安全、外交、国防等重大事项的，应当按照有关规定报党中央。 地名管理应当有利于维护国家主权和民族团结，有利于弘扬社会主义核心价值观，有利于推进国家治理体系和治理能力现代化，有利于传承发展中华优秀文化。 地名应当保持相对稳定。未经批准，任何单位和个人不得擅自决定对地名进行命名、更名。 第五条 地名的命名、更名、使用、文化保护应当遵守法律、行政法规和国家有关规定，反映当地地理、历史和文化特征，尊重当地群众意愿，方便生产生活。 第六条 县级以上人民政府应当建立健全地名管理工作协调机制，指导、督促、监督地名管理工作。 第七条 国务院民政部门（以下称国务院地名行政主管部门）负责全国地名工作的统一监督管理。 国务院外交、公安、自然资源、住房和城乡建设、交通运输、水利、文化和旅游、市场监管、林业草原、语言文字工作、新闻出版等其他有关部门，在各自职责范围内负责相关的地名管理工作。 县级以上地方人民政府地名行政主管部门负责本行政区域的地名管理工作。县级以上地方人民政府其他有关部门按照本级人民政府规定的职责分工，负责本行政区域的相关地名管理工作。 第八条 县级以上地方人民政府地名行政主管部门会同有关部门编制本行政区域的地名方案，经本级人民政府批准后组织实施。 第二章 地名的命名、更名 第九条 地名由专名和通名两部分组成。地名的命名应当遵循下列规定： （一）含义明确、健康，不违背公序良俗； （二）符合地理实体的实际地域、规模、性质等特征； （三）使用国家通用语言文字，避免使用生僻字； （四）一般不以人名作地名，不以国家领导人的名字作地名； （五）不以外国人名、地名作地名； （六）不以企业名称或者商标名称作地名； （七）国内著名的自然地理实体名称，全国范围内的县级以上行政区划名称，不应重名，并避免同音； （八）同一个省级行政区域内的乡、镇名称，同一个县级行政区域内的村民委员会、居民委员会所在地名称，同一个建成区内的街路巷名称，同一个建成区内的具有重要地理方位意义的住宅区、楼宇名称，不应重名，并避免同音； （九）不以国内著名的自然地理实体、历史文化遗产遗址、超出本行政区域范围的地理实体名称作行政区划专名； （十）具有重要地理方位意义的交通运输、水利、电力、通信、气象等设施名称，一般应当与所在地地名统一。 法律、行政法规对地名命名规则另有规定的，从其规定。 第十条 地名依法命名后，因行政区划变更、城乡建设、自然变化等原因导致地名名实不符的，应当及时更名。地名更名应当符合本条例第九条的规定。 具有重要历史文化价值、体现中华历史文脉的地名，一般不得更名。 第十一条 机关、企业事业单位、基层群众性自治组织等申请地名命名、更名应当提交申请书。申请书应当包括下列材料： （一）命名、更名的方案及理由； （二）地理实体的位置、规模、性质等基本情况； （三）国务院地名行政主管部门规定应当提交的其他材料。 行政区划的命名、更名，应当按照《行政区划管理条例》的规定，提交风险评估报告、专家论证报告、征求社会公众等意见报告。其他地名的命名、更名，应当综合考虑社会影响、专业性、技术性以及与群众生活的密切程度等因素，组织开展综合评估、专家论证、征求意见并提交相关报告。 第十二条 批准地名命名、更名应当遵循下列规定： （一）具有重要历史文化价值、体现中华历史文脉以及有重大社会影响的国内著名自然地理实体或者涉及两个省、自治区、直辖市以上的自然地理实体的命名、更名，边境地区涉及国界线走向和海上涉及岛屿、岛礁归属界线以及载入边界条约和议定书中的自然地理实体和村民委员会、居民委员会所在地等居民点的命名、更名，由相关省、自治区、直辖市人民政府提出申请，报国务院批准；无居民海岛、海域、海底地理实体的命名、更名，由国务院自然资源主管部门会同有关部门批准；其他自然地理实体的命名、更名，按照省、自治区、直辖市人民政府的规定批准； （二）行政区划的命名、更名，按照《行政区划管理条例》的规定批准； （三）本条第一项规定以外的村民委员会、居民委员会所在地的命名、更名，按照省、自治区、直辖市人民政府的规定批准； （四）城市公园、自然保护地的命名、更名，按照国家有关规定批准； （五）街路巷的命名、更名，由直辖市、市、县人民政府批准； （六）具有重要地理方位意义的住宅区、楼宇的命名、更名，由直辖市、市、县人民政府住房和城乡建设主管部门征求同级人民政府地名行政主管部门的意见后批准； （七）具有重要地理方位意义的交通运输、水利、电力、通信、气象等设施的命名、更名，应当根据情况征求所在地相关县级以上地方人民政府的意见，由有关主管部门批准。 第十三条 地名命名、更名后，由批准机关自批准之日起15日内按照下列规定报送备案： （一）国务院有关部门批准的地名报送国务院备案，备案材料径送国务院地名行政主管部门； （二）县级以上地方人民政府批准的地名报送上一级人民政府备案，备案材料径送上一级人民政府地名行政主管部门； （三）县级以上地方人民政府地名行政主管部门批准的地名报送上一级人民政府地名行政主管部门备案； （四）其他有关部门批准的地名报送同级人民政府地名行政主管部门备案。 第十四条 按照本条例规定，县级以上人民政府或者由县级以上地方人民政府地名行政主管部门批准的地名，自批准之日起15日内，由同级人民政府地名行政主管部门向社会公告；县级以上人民政府其他有关部门批准的地名，自按规定报送备案之日起15日内，由同级人民政府地名行政主管部门向社会公告。 第三章 地名使用 第十五条 地名的使用应当标准、规范。 地名的罗马字母拼写以《汉语拼音方案》作为统一规范，按照国务院地名行政主管部门会同国务院有关部门制定的规则拼写。 按照本条例规定批准的地名为标准地名。 标准地名应当符合地名的用字读音审定规范和少数民族语地名、外国语地名汉字译写等规范。 第十六条 国务院地名行政主管部门统一建立国家地名信息库，公布标准地名等信息，充分发挥国家地名信息库在服务群众生活、社会治理、科学研究、国防建设等方面的积极作用，提高服务信息化、智能化、便捷化水平，方便公众使用。 第十七条 县级以上地方人民政府地名行政主管部门和其他有关部门之间应当建立健全地名信息资源共建共享机制。 第十八条 下列范围内必须使用标准地名： （一）地名标志、交通标志、广告牌匾等标识； （二）通过报刊、广播、电视等新闻媒体和政府网站等公共平台发布的信息； （三）法律文书、身份证明、商品房预售许可证明、不动产权属证书等各类公文、证件； （四）辞书等工具类以及教材教辅等学习类公开出版物； （五）向社会公开的地图； （六）法律、行政法规规定应当使用标准地名的其他情形。 第十九条 标准地名及相关信息应当在地名标志上予以标示。任何单位和个人不得擅自设置、拆除、移动、涂改、遮挡、损毁地名标志。 第二十条 县级以上地方人民政府应当加强地名标志的设置和管理。 第二十一条 直辖市、市、县人民政府地名行政主管部门和其他有关部门应当在各自职责范围内，依据标准地名编制标准地址并设置标志。 第二十二条 标准地名出版物由地名机构负责汇集出版。其中行政区划名称，由负责行政区划具体管理工作的部门汇集出版。 第四章 地名文化保护 第二十三条 县级以上人民政府应当从我国地名的历史和实际出发，加强地名文化公益宣传，组织研究、传承地名文化。 第二十四条 县级以上人民政府应当加强地名文化遗产保护，并将符合条件的地名文化遗产依法列入非物质文化遗产保护范围。 第二十五条 县级以上地方人民政府地名行政主管部门应当对本行政区域内具有重要历史文化价值、体现中华历史文脉的地名进行普查，做好收集、记录、统计等工作，制定保护名录。列入保护名录的地名确需更名的，所在地县级以上地方人民政府应当预先制定相应的保护措施。 第二十六条 县级以上地方人民政府应当做好地名档案管理工作。地名档案管理的具体办法，由国务院地名行政主管部门会同国家档案行政管理部门制定。 第二十七条 国家鼓励公民、企业和社会组织参与地名文化保护活动。 第五章 监督检查 第二十八条 上级人民政府地名行政主管部门应当加强对下级人民政府地名行政主管部门地名管理工作的指导、监督。上级人民政府其他有关部门应当加强对下级人民政府相应部门地名管理工作的指导、监督。 第二十九条 县级以上人民政府地名行政主管部门和其他有关部门应当依法加强对地名的命名、更名、使用、文化保护的监督检查。 县级以上人民政府应当加强地名管理能力建设。 第三十条 县级以上人民政府地名行政主管部门和其他有关部门对地名管理工作进行监督检查时，有权采取下列措施： （一）询问有关当事人，调查与地名管理有关的情况； （二）查阅、复制有关资料； （三）对涉嫌存在地名违法行为的场所实施现场检查； （四）检查与涉嫌地名违法行为有关的物品； （五）法律、行政法规规定的其他措施。 县级以上人民政府地名行政主管部门和其他有关部门依法行使前款规定的职权时，当事人应当予以协助、配合，不得拒绝、阻挠。 第三十一条 县级以上人民政府地名行政主管部门和其他有关部门在监督检查中发现地名的命名、更名、使用、文化保护存在问题的，应当及时提出整改建议，下达整改通知书，依法向有关部门提出处理建议；对涉嫌违反本条例规定的有关责任人员，必要时可以采取约谈措施，并向社会通报。 第三十二条 县级以上人民政府地名行政主管部门和其他有关部门可以委托第三方机构对地名的命名、更名、使用、文化保护等情况进行评估。 第三十三条 任何单位和个人发现违反本条例规定行为的，可以向县级以上地方人民政府地名行政主管部门或者其他有关部门举报。接到举报的部门应当依法处理。有关部门应当对举报人的相关信息予以保密。 第六章 法律责任 第三十四条 县级以上地方人民政府地名批准机关违反本条例规定进行地名命名、更名的，由其上一级行政机关责令改正，对该批准机关负有责任的领导人员和其他直接责任人员依法给予处分。 第三十五条 县级以上地方人民政府地名批准机关不报送备案或者未按时报送备案的，由国务院地名行政主管部门或者上一级人民政府地名行政主管部门通知该批准机关，限期报送；逾期仍未报送的，对直接责任人员依法给予处分。 第三十六条 违反本条例第四条、第九条、第十条、第十二条规定，擅自进行地名命名、更名的，由有审批权的行政机关责令限期改正；逾期不改正的，予以取缔，并对违法单位通报批评。 第三十七条 违反本条例第十八条规定，未使用或者未规范使用标准地名的，由县级以上地方人民政府地名行政主管部门或者其他有关部门责令限期改正；逾期不改正的，对违法单位通报批评，并通知有关主管部门依法处理；对违法单位的法定代表人或者主要负责人、直接负责的主管人员和其他直接责任人员，处2000元以上1万元以下罚款。 第三十八条 擅自设置、拆除、移动、涂改、遮挡、损毁地名标志的，由地名标志设置、维护和管理部门责令改正并对责任人员处1000元以上5000元以下罚款。 第三十九条 第三方机构对地名的命名、更名、使用、文化保护等情况出具虚假评估报告的，由县级以上地方人民政府地名行政主管部门给予警告，有违法所得的，没收违法所得；情节严重的，5年内禁止从事地名相关评估工作。 第四十条 公职人员在地名管理工作中有滥用职权、玩忽职守、徇私舞弊行为的，依法给予处分。 第七章 附 则 第四十一条 各国管辖范围外区域的地理实体和天体地理实体命名、更名的规则和程序，由国务院地名行政主管部门会同有关部门制定。 第四十二条 纪念设施、遗址的命名、更名，按照国家有关规定办理。 第四十三条 国务院地名行政主管部门可以依据本条例的规定，制定具体实施办法。 第四十四条 本条例自2022年5月1日起施行。 解读 地名管理条例 地名管理条例\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.612Z"},{"slug":"regulation-20220228-62544fe0","title":"中华人民共和国水下文物保护管理条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第751号","publish_date":"2022-02-28","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/2022-02/28/content_5676054.htm","summary":"中华人民共和国国务院令 第751号 现公布修订后的《中华人民共和国水下文物保护管理条例》，自2022年4月1日起施行。 总理　　李克强 2022年1月23日 中华人民共和国水下文物保护管理条例 （","themes":["水下文物","文物保护"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第751号 现公布修订后的《中华人民共和国水下文物保护管理条例》，自2022年4月1日起施行。 总理 李克强 2022年1月23日 中华人民共和国水下文物保护管理条例 （1989年10月20日中华人民共和国国务院令第42号发布 根据2011年1月8日《国务院关于废止和修改部分行政法规的决定》第一次修订 2022年1月23日中华人民共和国国务院令第751号第二次修订） 第一条 为了加强水下文物保护工作的管理，根据《中华人民共和国文物保护法》的有关规定，制定本条例。 第二条 本条例所称水下文物，是指遗存于下列水域的具有历史、艺术和科学价值的人类文化遗产： （一）遗存于中国内水、领海内的一切起源于中国的、起源国不明的和起源于外国的文物； （二）遗存于中国领海以外依照中国法律由中国管辖的其他海域内的起源于中国的和起源国不明的文物； （三）遗存于外国领海以外的其他管辖海域以及公海区域内的起源于中国的文物。 前款规定内容不包括1911年以后的与重大历史事件、革命运动以及著名人物无关的水下遗存。 第三条 本条例第二条第一款第一项、第二项所规定的水下文物属于国家所有，国家对其行使管辖权；本条例第二条第一款第三项所规定的水下文物，遗存于外国领海以外的其他管辖海域以及公海区域内的起源国不明的文物，国家享有辨认器物物主的权利。 第四条 国务院文物主管部门负责全国水下文物保护工作。县级以上地方人民政府文物主管部门负责本行政区域内的水下文物保护工作。 县级以上人民政府其他有关部门在各自职责范围内，负责有关水下文物保护工作。 中国领海以外依照中国法律由中国管辖的其他海域内的水下文物，由国务院文物主管部门负责保护工作。 第五条 任何单位和个人都有依法保护水下文物的义务。 各级人民政府应当重视水下文物保护，正确处理经济社会发展与水下文物保护的关系，确保水下文物安全。 第六条 根据水下文物的价值，县级以上人民政府依照《中华人民共和国文物保护法》有关规定，核定公布文物保护单位，对未核定为文物保护单位的不可移动文物予以登记公布。 县级以上地方人民政府文物主管部门应当根据不同文物的保护需要，制定文物保护单位和未核定为文物保护单位的不可移动文物的具体保护措施，并公告施行。 第七条 省、自治区、直辖市人民政府可以将水下文物分布较为集中、需要整体保护的水域划定公布为水下文物保护区，并根据实际情况进行调整。水下文物保护区涉及两个以上省、自治区、直辖市或者涉及中国领海以外依照中国法律由中国管辖的其他海域的，由国务院文物主管部门划定和调整，报国务院核定公布。 划定和调整水下文物保护区，应当征求有关部门和水域使用权人的意见，听取专家和公众的意见，涉及军事管理区和军事用海的还应当征求有关军事机关的意见。 划定和调整水下文物保护区的单位应当制定保护规划。国务院文物主管部门或者省、自治区、直辖市人民政府文物主管部门应当根据保护规划明确标示水下文物保护区的范围和界线，制定具体保护措施并公告施行。 在水下文物保护区内，禁止进行危及水下文物安全的捕捞、爆破等活动。 第八条 严禁破坏、盗捞、哄抢、私分、藏匿、倒卖、走私水下文物等行为。 在中国管辖水域内开展科学考察、资源勘探开发、旅游、潜水、捕捞、养殖、采砂、排污、倾废等活动的，应当遵守有关法律、法规的规定，并不得危及水下文物的安全。 第九条 任何单位或者个人以任何方式发现疑似本条例第二条第一款第一项、第二项所规定的水下文物的，应当及时报告所在地或者就近的地方人民政府文物主管部门，并上交已经打捞出水的文物。 文物主管部门接到报告后，如无特殊情况，应当在24小时内赶赴现场，立即采取措施予以保护，并在7日内提出处理意见；发现水下文物已经移动位置或者遭受实际破坏的，应当进行抢救性保护，并作详细记录；对已经打捞出水的文物，应当及时登记造册、妥善保管。 文物主管部门应当保护水下文物发现现场，必要时可以会同公安机关或者海上执法机关开展保护工作，并将保护工作情况报本级人民政府和上一级人民政府文物主管部门；发现重要文物的，应当逐级报至国务院文物主管部门，国务院文物主管部门应当在接到报告后15日内提出处理意见。 第十条 任何单位或者个人以任何方式发现疑似本条例第二条第一款第三项所规定的水下文物的，应当及时报告就近的地方人民政府文物主管部门或者直接报告国务院文物主管部门。接到报告的地方人民政府文物主管部门应当逐级报至国务院文物主管部门。国务院文物主管部门应当及时提出处理意见并报国务院。 第十一条 在中国管辖水域内进行水下文物的考古调查、勘探、发掘活动，应当由具有考古发掘资质的单位向国务院文物主管部门提出申请。申请材料包括工作计划书和考古发掘资质证书。拟开展的考古调查、勘探、发掘活动在中国内水、领海内的，还应当提供活动所在地省、自治区、直辖市人民政府文物主管部门出具的意见。 国务院文物主管部门应当自收到申请材料之日起30日内，作出准予许可或者不予许可的决定。准予许可的，发给批准文件；不予许可的，应当书面告知申请人并说明理由。 国务院文物主管部门在作出决定前，应当征求有关科研机构和专家的意见，涉及军事管理区和军事用海的还应当征求有关军事机关的意见；涉及在中国领海以外依照中国法律由中国管辖的其他海域内进行水下文物的考古调查、勘探、发掘活动的，还应当报国务院同意。 第十二条 任何外国组织、国际组织在中国管辖水域内进行水下文物考古调查、勘探、发掘活动，都应当采取与中方单位合作的方式进行，并取得许可。中方单位应当具有考古发掘资质；外方单位应当是专业考古研究机构，有从事该课题方向或者相近方向研究的专家和一定的实际考古工作经历。 中外合作进行水下文物考古调查、勘探、发掘活动的，由中方单位向国务院文物主管部门提出申请。申请材料应当包括中外合作单位合作意向书、工作计划书，以及合作双方符合前款要求的有关材料。拟开展的考古调查、勘探、发掘活动在中国内水、领海内的，还应当提供活动所在地省、自治区、直辖市人民政府文物主管部门出具的意见。 国务院文物主管部门收到申请材料后，应当征求有关科研机构和专家的意见，涉及军事管理区和军事用海的还应当征求有关军事机关的意见，并按照国家有关规定送请有关部门审查。审查合格的，报请国务院特别许可；审查不合格的，应当书面告知申请人并说明理由。 中外合作考古调查、勘探、发掘活动所取得的水下文物、自然标本以及考古记录的原始资料，均归中国所有。 第十三条 在中国管辖水域内进行大型基本建设工程，建设单位应当事先报请国务院文物主管部门或者省、自治区、直辖市人民政府文物主管部门组织在工程范围内有可能埋藏文物的地方进行考古调查、勘探；需要进行考古发掘的，应当依照《中华人民共和国文物保护法》有关规定履行报批程序。 第十四条 在中国管辖水域内进行水下文物的考古调查、勘探、发掘活动，应当以文物保护和科学研究为目的，并遵守相关法律、法规，接受有关主管部门的管理。 考古调查、勘探、发掘活动结束后，从事考古调查、勘探、发掘活动的单位应当向国务院文物主管部门和省、自治区、直辖市人民政府文物主管部门提交结项报告、考古发掘报告和取得的实物图片、有关资料复制件等。 考古调查、勘探、发掘活动中取得的全部出水文物应当及时登记造册、妥善保管，按照国家有关规定移交给由国务院文物主管部门或者省、自治区、直辖市人民政府文物主管部门指定的国有博物馆、图书馆或者其他国有收藏文物的单位收藏。 中外合作进行考古调查、勘探、发掘活动的，由中方单位提交前两款规定的实物和资料。 第十五条 严禁未经批准进行水下文物考古调查、勘探、发掘等活动。 严禁任何个人以任何形式进行水下文物考古调查、勘探、发掘等活动。 第十六条 文物主管部门、文物收藏单位等应当通过举办展览、开放参观、科学研究等方式，充分发挥水下文物的作用，加强中华优秀传统文化、水下文物保护法律制度等的宣传教育，提高全社会水下文物保护意识和参与水下文物保护的积极性。 第十七条 文物主管部门、公安机关、海上执法机关按照职责分工开展水下文物保护执法工作，加强执法协作。 县级以上人民政府文物主管部门应当在水下文物保护工作中加强与有关部门的沟通协调，共享水下文物执法信息。 第十八条 任何单位和个人有权向文物主管部门举报违反本条例规定、危及水下文物安全的行为。文物主管部门应当建立举报渠道并向社会公开，依法及时处理有关举报。 第十九条 保护水下文物有突出贡献的，按照国家有关规定给予精神鼓励或者物质奖励。 第二十条 文物主管部门和其他有关部门的工作人员，在水下文物保护工作中滥用职权、玩忽职守、徇私舞弊的，对直接负责的主管人员和其他直接责任人员依法给予处分；构成犯罪的，依法追究刑事责任。 第二十一条 擅自在文物保护单位的保护范围内进行建设工程或者爆破、钻探、挖掘等作业的，依照《中华人民共和国文物保护法》追究法律责任。 第二十二条 违反本条例规定，有下列行为之一的，由县级以上人民政府文物主管部门或者海上执法机关按照职责分工责令改正，追缴有关文物，并给予警告；有违法所得的，没收违法所得，违法经营额10万元以上的，并处违法经营额5倍以上15倍以下的罚款，违法经营额不足10万元的，并处10万元以上100万元以下的罚款；情节严重的，由原发证机关吊销资质证书，10年内不受理其相应申请： （一）未经批准进行水下文物的考古调查、勘探、发掘活动； （二）考古调查、勘探、发掘活动结束后，不按照规定移交有关实物或者提交有关资料； （三）未事先报请有关主管部门组织进行考古调查、勘探，在中国管辖水域内进行大型基本建设工程； （四）发现水下文物后未及时报告。 第二十三条 本条例自2022年4月1日起施行。 解读 李克强签署国务院令 公布修订后的《中华人民共和国水下文物保护管理条例》 司法部、文化和旅游部、国家文物局有关同志就《中华人民共和国水下文物保护管理条例》修订答记者问 中华人民共和国水下文物保护管理条例 中华人民共和国水下文物保护管理条例\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.647Z"},{"slug":"case-20211201-9e73133b","title":"泉州：宋元中国的世界海洋商贸中心（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2021-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1561","summary":"泉州：宋元中国的世界海洋商贸中心位于中国，2021年列入联合国教科文组织《世界遗产名录》，列入标准为(iv)，遗产类型为文化遗产。名录坐标：北纬24.7103，东经118.4442。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：泉州：宋元中国的世界海洋商贸中心 英文名称：Quanzhou: Emporium of the World in Song-Yuan China 国家/地区：中国 列入年份：2021 世界遗产标准：(iv) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：24.7102777778, 118.444166667 名录编号：1561 官方页面：https://whc.unesco.org/en/list/1561\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;该遗址群体现了泉州在宋元时期（公元10-14世纪）作为世界海洋商贸中心的活力，及其与中国腹地的紧密联系。泉州在亚洲海运贸易的这个重要时期蓬勃发展。遗产地包括多座宗教建筑，如始建于公元11世纪的清净寺（中国最早的伊斯兰建筑之一）、伊斯兰教圣墓，以及大量考古遗迹，如行政建筑、具有重要商贸和防御意义的石码头、制瓷和冶铁生产遗址、城市交通网道的构成元素、古桥、宝塔和碑文。在公元10-14世纪的阿拉伯和西方文献中，泉州被称为刺桐。该遗产地还包括一座保留了部分原貌的元代寺庙，以及世界上仅存的摩尼石像。摩尼是摩尼教（又称琐罗亚斯德教）的创始人，该教约于公元6-7世纪传入中国。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.956Z"},{"slug":"regulation-20211109-8173ae08","title":"地下水管理条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第748号","publish_date":"2021-11-09","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/2021-11/09/content_5649924.htm","summary":"中华人民共和国国务院令 第748号 《地下水管理条例》已经2021年9月15日国务院第149次常务会议通过，现予公布，自2021年12月1日起施行。 总理　　李克强 2021年10月21日 地下水","themes":["地下水","水资源"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第748号 《地下水管理条例》已经2021年9月15日国务院第149次常务会议通过，现予公布，自2021年12月1日起施行。 总理 李克强 2021年10月21日 地下水管理条例 第一章 总 则 第一条 为了加强地下水管理，防治地下水超采和污染，保障地下水质量和可持续利用，推进生态文明建设，根据《中华人民共和国水法》和《中华人民共和国水污染防治法》等法律，制定本条例。 第二条 地下水调查与规划、节约与保护、超采治理、污染防治、监督管理等活动，适用本条例。 本条例所称地下水，是指赋存于地表以下的水。 第三条 地下水管理坚持统筹规划、节水优先、高效利用、系统治理的原则。 第四条 国务院水行政主管部门负责全国地下水统一监督管理工作。国务院生态环境主管部门负责全国地下水污染防治监督管理工作。国务院自然资源等主管部门按照职责分工做好地下水调查、监测等相关工作。 第五条 县级以上地方人民政府对本行政区域内的地下水管理负责，应当将地下水管理纳入本级国民经济和社会发展规划，并采取控制开采量、防治污染等措施，维持地下水合理水位，保护地下水水质。 县级以上地方人民政府水行政主管部门按照管理权限，负责本行政区域内地下水统一监督管理工作。地方人民政府生态环境主管部门负责本行政区域内地下水污染防治监督管理工作。县级以上地方人民政府自然资源等主管部门按照职责分工做好本行政区域内地下水调查、监测等相关工作。 第六条 利用地下水的单位和个人应当加强地下水取水工程管理，节约、保护地下水，防止地下水污染。 第七条 国务院对省、自治区、直辖市地下水管理和保护情况实行目标责任制和考核评价制度。国务院有关部门按照职责分工负责考核评价工作的具体组织实施。 第八条 任何单位和个人都有权对损害地下水的行为进行监督、检举。 对在节约、保护和管理地下水工作中作出突出贡献的单位和个人，按照国家有关规定给予表彰和奖励。 第九条 国家加强对地下水节约和保护的宣传教育，鼓励、支持地下水先进科学技术的研究、推广和应用。 第二章 调查与规划 第十条 国家定期组织开展地下水状况调查评价工作。地下水状况调查评价包括地下水资源调查评价、地下水污染调查评价和水文地质勘查评价等内容。 第十一条 县级以上人民政府应当组织水行政、自然资源、生态环境等主管部门开展地下水状况调查评价工作。调查评价成果是编制地下水保护利用和污染防治等规划以及管理地下水的重要依据。调查评价成果应当依法向社会公布。 第十二条 县级以上人民政府水行政、自然资源、生态环境等主管部门根据地下水状况调查评价成果，统筹考虑经济社会发展需要、地下水资源状况、污染防治等因素，编制本级地下水保护利用和污染防治等规划，依法履行征求意见、论证评估等程序后向社会公布。 地下水保护利用和污染防治等规划是节约、保护、利用、修复治理地下水的基本依据。地下水保护利用和污染防治等规划应当服从水资源综合规划和环境保护规划。 第十三条 国民经济和社会发展规划以及国土空间规划等相关规划的编制、重大建设项目的布局，应当与地下水资源条件和地下水保护要求相适应，并进行科学论证。 第十四条 编制工业、农业、市政、能源、矿产资源开发等专项规划，涉及地下水的内容，应当与地下水保护利用和污染防治等规划相衔接。 第十五条 国家建立地下水储备制度。国务院水行政主管部门应当会同国务院自然资源、发展改革等主管部门，对地下水储备工作进行指导、协调和监督检查。 县级以上地方人民政府水行政主管部门应当会同本级人民政府自然资源、发展改革等主管部门，根据本行政区域内地下水条件、气候状况和水资源储备需要，制定动用地下水储备预案并报本级人民政府批准。 除特殊干旱年份以及发生重大突发事件外，不得动用地下水储备。 第三章 节约与保护 第十六条 国家实行地下水取水总量控制制度。国务院水行政主管部门会同国务院自然资源主管部门，根据各省、自治区、直辖市地下水可开采量和地表水水资源状况，制定并下达各省、自治区、直辖市地下水取水总量控制指标。 第十七条 省、自治区、直辖市人民政府水行政主管部门应当会同本级人民政府有关部门，根据国家下达的地下水取水总量控制指标，制定本行政区域内县级以上行政区域的地下水取水总量控制指标和地下水水位控制指标，经省、自治区、直辖市人民政府批准后下达实施，并报国务院水行政主管部门或者其授权的流域管理机构备案。 第十八条 省、自治区、直辖市人民政府水行政主管部门制定本行政区域内地下水取水总量控制指标和地下水水位控制指标时，涉及省际边界区域且属于同一水文地质单元的，应当与相邻省、自治区、直辖市人民政府水行政主管部门协商确定。协商不成的，由国务院水行政主管部门会同国务院有关部门确定。 第十九条 县级以上地方人民政府应当根据地下水取水总量控制指标、地下水水位控制指标和国家相关技术标准，合理确定本行政区域内地下水取水工程布局。 第二十条 县级以上地方人民政府水行政主管部门应当根据本行政区域内地下水取水总量控制指标、地下水水位控制指标以及科学分析测算的地下水需求量和用水结构，制定地下水年度取水计划，对本行政区域内的年度取用地下水实行总量控制，并报上一级人民政府水行政主管部门备案。 第二十一条 取用地下水的单位和个人应当遵守取水总量控制和定额管理要求，使用先进节约用水技术、工艺和设备，采取循环用水、综合利用及废水处理回用等措施，实施技术改造，降低用水消耗。 对下列工艺、设备和产品，应当在规定的期限内停止生产、销售、进口或者使用： （一）列入淘汰落后的、耗水量高的工艺、设备和产品名录的； （二）列入限期禁止采用的严重污染水环境的工艺名录和限期禁止生产、销售、进口、使用的严重污染水环境的设备名录的。 第二十二条 新建、改建、扩建地下水取水工程，应当同时安装计量设施。已有地下水取水工程未安装计量设施的，应当按照县级以上地方人民政府水行政主管部门规定的期限安装。 单位和个人取用地下水量达到取水规模以上的，应当安装地下水取水在线计量设施，并将计量数据实时传输到有管理权限的水行政主管部门。取水规模由省、自治区、直辖市人民政府水行政主管部门制定、公布，并报国务院水行政主管部门备案。 第二十三条 以地下水为灌溉水源的地区，县级以上地方人民政府应当采取保障建设投入、加大对企业信贷支持力度、建立健全基层水利服务体系等措施，鼓励发展节水农业，推广应用喷灌、微灌、管道输水灌溉、渠道防渗输水灌溉等节水灌溉技术，以及先进的农机、农艺和生物技术等，提高农业用水效率，节约农业用水。 第二十四条 国务院根据国民经济和社会发展需要，对取用地下水的单位和个人试点征收水资源税。地下水水资源税根据当地地下水资源状况、取用水类型和经济发展等情况实行差别税率，合理提高征收标准。征收水资源税的，停止征收水资源费。 尚未试点征收水资源税的省、自治区、直辖市，对同一类型取用水，地下水的水资源费征收标准应当高于地表水的标准，地下水超采区的水资源费征收标准应当高于非超采区的标准，地下水严重超采区的水资源费征收标准应当大幅高于非超采区的标准。 第二十五条 有下列情形之一的，对取用地下水的取水许可申请不予批准： （一）不符合地下水取水总量控制、地下水水位控制要求； （二）不符合限制开采区取用水规定； （三）不符合行业用水定额和节水规定； （四）不符合强制性国家标准； （五）水资源紧缺或者生态脆弱地区新建、改建、扩建高耗水项目； （六）违反法律、法规的规定开垦种植而取用地下水。 第二十六条 建设单位和个人应当采取措施防止地下工程建设对地下水补给、径流、排泄等造成重大不利影响。对开挖达到一定深度或者达到一定排水规模的地下工程，建设单位和个人应当于工程开工前，将工程建设方案和防止对地下水产生不利影响的措施方案报有管理权限的水行政主管部门备案。开挖深度和排水规模由省、自治区、直辖市人民政府制定、公布。 第二十七条 除下列情形外，禁止开采难以更新的地下水： （一）应急供水取水； （二）无替代水源地区的居民生活用水； （三）为开展地下水监测、勘探、试验少量取水。 已经开采的，除前款规定的情形外，有关县级以上地方人民政府应当采取禁止开采、限制开采措施，逐步实现全面禁止开采；前款规定的情形消除后，应当立即停止取用地下水。 第二十八条 县级以上地方人民政府应当加强地下水水源补给保护，充分利用自然条件补充地下水，有效涵养地下水水源。 城乡建设应当统筹地下水水源涵养和回补需要，按照海绵城市建设的要求，推广海绵型建筑、道路、广场、公园、绿地等，逐步完善滞渗蓄排等相结合的雨洪水收集利用系统。河流、湖泊整治应当兼顾地下水水源涵养，加强水体自然形态保护和修复。 城市人民政府应当因地制宜采取有效措施，推广节水型生活用水器具，鼓励使用再生水，提高用水效率。 第二十九条 县级以上地方人民政府应当根据地下水水源条件和需要，建设应急备用饮用水水源，制定应急预案，确保需要时正常使用。 应急备用地下水水源结束应急使用后，应当立即停止取水。 第三十条 有关县级以上地方人民政府水行政主管部门会同本级人民政府有关部门编制重要泉域保护方案，明确保护范围、保护措施，报本级人民政府批准后实施。 对已经干涸但具有重要历史文化和生态价值的泉域，具备条件的，应当采取措施予以恢复。 第四章 超采治理 第三十一条 国务院水行政主管部门应当会同国务院自然资源主管部门根据地下水状况调查评价成果，组织划定全国地下水超采区，并依法向社会公布。 第三十二条 省、自治区、直辖市人民政府水行政主管部门应当会同本级人民政府自然资源等主管部门，统筹考虑地下水超采区划定、地下水利用情况以及地质环境条件等因素，组织划定本行政区域内地下水禁止开采区、限制开采区，经省、自治区、直辖市人民政府批准后公布，并报国务院水行政主管部门备案。 地下水禁止开采区、限制开采区划定后，确需调整的，应当按照原划定程序进行调整。 第三十三条 有下列情形之一的，应当划为地下水禁止开采区： （一）已发生严重的地面沉降、地裂缝、海（咸）水入侵、植被退化等地质灾害或者生态损害的区域； （二）地下水超采区内公共供水管网覆盖或者通过替代水源已经解决供水需求的区域； （三）法律、法规规定禁止开采地下水的其他区域。 第三十四条 有下列情形之一的，应当划为地下水限制开采区： （一）地下水开采量接近可开采量的区域； （二）开采地下水可能引发地质灾害或者生态损害的区域； （三）法律、法规规定限制开采地下水的其他区域。 第三十五条 除下列情形外，在地下水禁止开采区内禁止取用地下水： （一）为保障地下工程施工安全和生产安全必须进行临时应急取（排）水； （二）为消除对公共安全或者公共利益的危害临时应急取水； （三）为开展地下水监测、勘探、试验少量取水。 除前款规定的情形外，在地下水限制开采区内禁止新增取用地下水，并逐步削减地下水取水量；前款规定的情形消除后，应当立即停止取用地下水。 第三十六条 省、自治区、直辖市人民政府水行政主管部门应当会同本级人民政府有关部门，编制本行政区域地下水超采综合治理方案，经省、自治区、直辖市人民政府批准后，报国务院水行政主管部门备案。 地下水超采综合治理方案应当明确治理目标、治理措施、保障措施等内容。 第三十七条 地下水超采区的县级以上地方人民政府应当加强节水型社会建设，通过加大海绵城市建设力度、调整种植结构、推广节水农业、加强工业节水、实施河湖地下水回补等措施，逐步实现地下水采补平衡。 国家在替代水源供给、公共供水管网建设、产业结构调整等方面，加大对地下水超采区地方人民政府的支持力度。 第三十八条 有关县级以上地方人民政府水行政主管部门应当会同本级人民政府自然资源主管部门加强对海（咸）水入侵的监测和预防。已经出现海（咸）水入侵的地区，应当采取综合治理措施。 第五章 污染防治 第三十九条 国务院生态环境主管部门应当会同国务院水行政、自然资源等主管部门，指导全国地下水污染防治重点区划定工作。省、自治区、直辖市人民政府生态环境主管部门应当会同本级人民政府水行政、自然资源等主管部门，根据本行政区域内地下水污染防治需要，划定地下水污染防治重点区。 第四十条 禁止下列污染或者可能污染地下水的行为： （一）利用渗井、渗坑、裂隙、溶洞以及私设暗管等逃避监管的方式排放水污染物； （二）利用岩层孔隙、裂隙、溶洞、废弃矿坑等贮存石化原料及产品、农药、危险废物、城镇污水处理设施产生的污泥和处理后的污泥或者其他有毒有害物质； （三）利用无防渗漏措施的沟渠、坑塘等输送或者贮存含有毒污染物的废水、含病原体的污水和其他废弃物； （四）法律、法规禁止的其他污染或者可能污染地下水的行为。 第四十一条 企业事业单位和其他生产经营者应当采取下列措施，防止地下水污染： （一）兴建地下工程设施或者进行地下勘探、采矿等活动，依法编制的环境影响评价文件中，应当包括地下水污染防治的内容，并采取防护性措施； （二）化学品生产企业以及工业集聚区、矿山开采区、尾矿库、危险废物处置场、垃圾填埋场等的运营、管理单位，应当采取防渗漏等措施，并建设地下水水质监测井进行监测； （三）加油站等的地下油罐应当使用双层罐或者采取建造防渗池等其他有效措施，并进行防渗漏监测； （四）存放可溶性剧毒废渣的场所，应当采取防水、防渗漏、防流失的措施； （五）法律、法规规定应当采取的其他防止地下水污染的措施。 根据前款第二项规定的企业事业单位和其他生产经营者排放有毒有害物质情况，地方人民政府生态环境主管部门应当按照国务院生态环境主管部门的规定，商有关部门确定并公布地下水污染防治重点排污单位名录。地下水污染防治重点排污单位应当依法安装水污染物排放自动监测设备，与生态环境主管部门的监控设备联网，并保证监测设备正常运行。 第四十二条 在泉域保护范围以及岩溶强发育、存在较多落水洞和岩溶漏斗的区域内，不得新建、改建、扩建可能造成地下水污染的建设项目。 第四十三条 多层含水层开采、回灌地下水应当防止串层污染。 多层地下水的含水层水质差异大的，应当分层开采；对已受污染的潜水和承压水，不得混合开采。 已经造成地下水串层污染的，应当按照封填井技术要求限期回填串层开采井，并对造成的地下水污染进行治理和修复。 人工回灌补给地下水，应当符合相关的水质标准，不得使地下水水质恶化。 第四十四条 农业生产经营者等有关单位和个人应当科学、合理使用农药、肥料等农业投入品，农田灌溉用水应当符合相关水质标准，防止地下水污染。 县级以上地方人民政府及其有关部门应当加强农药、肥料等农业投入品使用指导和技术服务，鼓励和引导农业生产经营者等有关单位和个人合理使用农药、肥料等农业投入品，防止地下水污染。 第四十五条 依照《中华人民共和国土壤污染防治法》的有关规定，安全利用类和严格管控类农用地地块的土壤污染影响或者可能影响地下水安全的，制定防治污染的方案时，应当包括地下水污染防治的内容。 污染物含量超过土壤污染风险管控标准的建设用地地块，编制土壤污染风险评估报告时，应当包括地下水是否受到污染的内容；列入风险管控和修复名录的建设用地地块，采取的风险管控措施中应当包括地下水污染防治的内容。 对需要实施修复的农用地地块，以及列入风险管控和修复名录的建设用地地块，修复方案中应当包括地下水污染防治的内容。 第六章 监督管理 第四十六条 县级以上人民政府水行政、自然资源、生态环境等主管部门应当依照职责加强监督管理，完善协作配合机制。 国务院水行政、自然资源、生态环境等主管部门建立统一的国家地下水监测站网和地下水监测信息共享机制，对地下水进行动态监测。 县级以上地方人民政府水行政、自然资源、生态环境等主管部门根据需要完善地下水监测工作体系，加强地下水监测。 第四十七条 任何单位和个人不得侵占、毁坏或者擅自移动地下水监测设施设备及其标志。 新建、改建、扩建建设工程应当避开地下水监测设施设备；确实无法避开、需要拆除地下水监测设施设备的，应当由县级以上人民政府水行政、自然资源、生态环境等主管部门按照有关技术要求组织迁建，迁建费用由建设单位承担。 任何单位和个人不得篡改、伪造地下水监测数据。 第四十八条 建设地下水取水工程的单位和个人，应当在申请取水许可时附具地下水取水工程建设方案，并按照取水许可批准文件的要求，自行或者委托具有相应专业技术能力的单位进行施工。施工单位不得承揽应当取得但未取得取水许可的地下水取水工程。 以监测、勘探为目的的地下水取水工程，不需要申请取水许可，建设单位应当于施工前报有管辖权的水行政主管部门备案。 地下水取水工程的所有权人负责工程的安全管理。 第四十九条 县级以上地方人民政府水行政主管部门应当对本行政区域内的地下水取水工程登记造册，建立监督管理制度。 报废的矿井、钻井、地下水取水工程，或者未建成、已完成勘探任务、依法应当停止取水的地下水取水工程，应当由工程所有权人或者管理单位实施封井或者回填；所有权人或者管理单位应当将其封井或者回填情况告知县级以上地方人民政府水行政主管部门；无法确定所有权人或者管理单位的，由县级以上地方人民政府或者其授权的部门负责组织实施封井或者回填。 实施封井或者回填，应当符合国家有关技术标准。 第五十条 县级以上地方人民政府应当组织水行政、自然资源、生态环境等主管部门，划定集中式地下水饮用水水源地并公布名录，定期组织开展地下水饮用水水源地安全评估。 第五十一条 县级以上地方人民政府水行政主管部门应当会同本级人民政府自然资源等主管部门，根据水文地质条件和地下水保护要求，划定需要取水的地热能开发利用项目的禁止和限制取水范围。 禁止在集中式地下水饮用水水源地建设需要取水的地热能开发利用项目。禁止抽取难以更新的地下水用于需要取水的地热能开发利用项目。 建设需要取水的地热能开发利用项目，应当对取水和回灌进行计量，实行同一含水层等量取水和回灌，不得对地下水造成污染。达到取水规模以上的，应当安装取水和回灌在线计量设施，并将计量数据实时传输到有管理权限的水行政主管部门。取水规模由省、自治区、直辖市人民政府水行政主管部门制定、公布。 对不符合本条第一款、第二款、第三款规定的已建需要取水的地热能开发利用项目，取水单位和个人应当按照水行政主管部门的规定限期整改，整改不合格的，予以关闭。 第五十二条 矿产资源开采、地下工程建设疏干排水量达到规模的，应当依法申请取水许可，安装排水计量设施，定期向取水许可审批机关报送疏干排水量和地下水水位状况。疏干排水量规模由省、自治区、直辖市人民政府制定、公布。 为保障矿井等地下工程施工安全和生产安全必须进行临时应急取（排）水的，不需要申请取水许可。取（排）水单位和个人应当于临时应急取（排）水结束后5个工作日内，向有管理权限的县级以上地方人民政府水行政主管部门备案。 矿产资源开采、地下工程建设疏干排水应当优先利用，无法利用的应当达标排放。 第五十三条 县级以上人民政府水行政、生态环境等主管部门应当建立从事地下水节约、保护、利用活动的单位和个人的诚信档案，记录日常监督检查结果、违法行为查处等情况，并依法向社会公示。 第七章 法律责任 第五十四条 县级以上地方人民政府，县级以上人民政府水行政、生态环境、自然资源主管部门和其他负有地下水监督管理职责的部门有下列行为之一的，由上级机关责令改正，对负有责任的主管人员和其他直接责任人员依法给予处分： （一）未采取有效措施导致本行政区域内地下水超采范围扩大，或者地下水污染状况未得到改善甚至恶化； （二）未完成本行政区域内地下水取水总量控制指标和地下水水位控制指标； （三）对地下水水位低于控制水位未采取相关措施； （四）发现违法行为或者接到对违法行为的检举后未予查处； （五）有其他滥用职权、玩忽职守、徇私舞弊等违法行为。 第五十五条 违反本条例规定，未经批准擅自取用地下水，或者利用渗井、渗坑、裂隙、溶洞以及私设暗管等逃避监管的方式排放水污染物等违法行为，依照《中华人民共和国水法》、《中华人民共和国水污染防治法》、《中华人民共和国土壤污染防治法》、《取水许可和水资源费征收管理条例》等法律、行政法规的规定处罚。 第五十六条 地下水取水工程未安装计量设施的，由县级以上地方人民政府水行政主管部门责令限期安装，并按照日最大取水能力计算的取水量计征相关费用，处10万元以上50万元以下罚款；情节严重的，吊销取水许可证。 计量设施不合格或者运行不正常的，由县级以上地方人民政府水行政主管部门责令限期更换或者修复；逾期不更换或者不修复的，按照日最大取水能力计算的取水量计征相关费用，处10万元以上50万元以下罚款；情节严重的，吊销取水许可证。 第五十七条 地下工程建设对地下水补给、径流、排泄等造成重大不利影响的，由县级以上地方人民政府水行政主管部门责令限期采取措施消除不利影响，处10万元以上50万元以下罚款；逾期不采取措施消除不利影响的，由县级以上地方人民政府水行政主管部门组织采取措施消除不利影响，所需费用由违法行为人承担。 地下工程建设应当于开工前将工程建设方案和防止对地下水产生不利影响的措施方案备案而未备案的，或者矿产资源开采、地下工程建设疏干排水应当定期报送疏干排水量和地下水水位状况而未报送的，由县级以上地方人民政府水行政主管部门责令限期补报；逾期不补报的，处2万元以上10万元以下罚款。 第五十八条 报废的矿井、钻井、地下水取水工程，或者未建成、已完成勘探任务、依法应当停止取水的地下水取水工程，未按照规定封井或者回填的，由县级以上地方人民政府或者其授权的部门责令封井或者回填，处10万元以上50万元以下罚款；不具备封井或者回填能力的，由县级以上地方人民政府或者其授权的部门组织封井或者回填，所需费用由违法行为人承担。 第五十九条 利用岩层孔隙、裂隙、溶洞、废弃矿坑等贮存石化原料及产品、农药、危险废物或者其他有毒有害物质的，由地方人民政府生态环境主管部门责令限期改正，处10万元以上100万元以下罚款。 利用岩层孔隙、裂隙、溶洞、废弃矿坑等贮存城镇污水处理设施产生的污泥和处理后的污泥的，由县级以上地方人民政府城镇排水主管部门责令限期改正，处20万元以上200万元以下罚款，对直接负责的主管人员和其他直接责任人员处2万元以上10万元以下罚款；造成严重后果的，处200万元以上500万元以下罚款，对直接负责的主管人员和其他直接责任人员处5万元以上50万元以下罚款。 在泉域保护范围以及岩溶强发育、存在较多落水洞和岩溶漏斗的区域内，新建、改建、扩建造成地下水污染的建设项目的，由地方人民政府生态环境主管部门处10万元以上50万元以下罚款，并报经有批准权的人民政府批准，责令拆除或者关闭。 第六十条 侵占、毁坏或者擅自移动地下水监测设施设备及其标志的，由县级以上地方人民政府水行政、自然资源、生态环境主管部门责令停止违法行为，限期采取补救措施，处2万元以上10万元以下罚款；逾期不采取补救措施的，由县级以上地方人民政府水行政、自然资源、生态环境主管部门组织补救，所需费用由违法行为人承担。 第六十一条 以监测、勘探为目的的地下水取水工程在施工前应当备案而未备案的，由县级以上地方人民政府水行政主管部门责令限期补办备案手续；逾期不补办备案手续的，责令限期封井或者回填，处2万元以上10万元以下罚款；逾期不封井或者回填的，由县级以上地方人民政府水行政主管部门组织封井或者回填，所需费用由违法行为人承担。 第六十二条 违反本条例规定，构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第八章 附 则 第六十三条 本条例下列用语含义是： 地下水取水工程，是指地下水取水井及其配套设施，包括水井、集水廊道、集水池、渗渠、注水井以及需要取水的地热能开发利用项目的取水井和回灌井等。 地下水超采区，是指地下水实际开采量超过可开采量，引起地下水水位持续下降、引发生态损害和地质灾害的区域。 难以更新的地下水，是指与大气降水和地表水体没有密切水力联系，无法补给或者补给非常缓慢的地下水。 第六十四条 本条例自2021年12月1日起施行。 解读 李克强签署国务院令 公布《地下水管理条例》 司法部 水利部负责人就《地下水管理条例》答记者问 地下水管理条例 地下水管理条例\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.666Z"},{"slug":"policy-20211108-eba843d9","title":"国务院办公厅关于印发“十四五”文物保护和科技创新规划的通知","type":"policy","type_label":"政策","issuer":"国务院办公厅","doc_no":"国办发〔2021〕43号","publish_date":"2021-11-08","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"
