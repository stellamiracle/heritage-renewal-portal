以上地方人民政府古树名木主管部门责令停止违法行为、采取补救措施，没收违法所得，并处1万元以上10万元以下的罚款；拒不停止违法行为、不采取补救措施或者造成严重后果的，并处5万元以上20万元以下的罚款。 有本条例第十七条第五项、第六项、第七项规定行为之一的，由县级以上地方人民政府古树名木主管部门责令停止违法行为、采取补救措施，没收违法所得，可以并处1万元以下的罚款；拒不停止违法行为、不采取补救措施或者造成严重后果的，并处1万元以上10万元以下的罚款。 第二十八条 违反本条例第十八条第一款规定的，由县级以上地方人民政府古树名木主管部门责令停止违法行为、限期恢复原状或者采取其他补救措施，没收违法所得；拒不停止违法行为、逾期不恢复原状、不采取其他补救措施或者造成严重后果的，依照下列规定处以罚款： （一）涉及实行一级保护的古树和名木的，处每株20万元以上50万元以下的罚款； （二）涉及实行二级保护的古树的，处每株10万元以上20万元以下的罚款； （三）涉及实行三级保护的古树的，处每株5万元以上10万元以下的罚款。 第二十九条 违反本条例规定，给他人造成损失的，依法承担赔偿责任；构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第三十条 本条例自2025年3月15日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.116Z"},{"slug":"policy-20250122-c5859ec0","title":"国务院关于《东莞市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕15号","publish_date":"2025-01-22","effective_date":"","status":"现行有效","level":"国家级","region":"东莞","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7000442.htm","summary":"历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对东莞市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《东莞市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕15号 广东省人民政府、自然资源部： 你们关于报请批准《东莞市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《东莞市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是东莞市各类开发保护建设活动的基本依据，请认真组织实施。东莞是粤港澳大湾区重要的节点城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥全国先进制造业基地、国际科技创新中心承载地等功能，奋力谱写中国式现代化东莞篇章。 二、筑牢安全发展的空间基础。到2035年，东莞市耕地保有量不低于10.11万亩，其中永久基本农田保护面积不低于10.00万亩；生态保护红线面积不低于361.08平方千米，其中海洋生态保护红线面积不低于26.74平方千米；城镇开发边界面积控制在1433.37平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；大陆自然岸线保有率不低于上级下达任务，其中2025年不低于4%；用水总量不超过上级下达指标，其中2025年不超过21.34亿立方米；除国家重大项目外，全面禁止围填海；严格无居民海岛管理。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。增强城市综合实力，积极共建粤港澳大湾区，联动深圳、惠州共建深圳都市圈，主动融入广州都市圈，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区和片区中心服务能级，深化松山湖、滨海湾等片区与深圳融合发展，推动水乡新城与广州东部地区协同联动。筑牢南部山地生态屏障，协同推进珠江流域生态保护修复，整体提升东江、狮子洋等河口湿地生态系统的质量和稳定性，系统保护和集约利用海域、海岛、海岸线资源。保障现代都市农业空间需求，优化农业空间布局。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障电子信息等先进制造业和科技创新产业发展的空间需求，为推动存量产业用地提质增效、优化布局提供土地政策保障。加强粤港澳大湾区港口群协调联动，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强大岭山抗日根据地旧址等红色文化遗产和林则徐销烟池与虎门炮台旧址等近代历史文化遗存保护。加强对城市建筑高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对东莞市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。广东省人民政府、自然资源部要指导督促东莞市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。东莞市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月18日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.135Z"},{"slug":"policy-20250122-30a8265b","title":"国务院关于《西安市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕13号","publish_date":"2025-01-22","effective_date":"","status":"现行有效","level":"国家级","region":"西安","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7000441.htm","summary":"省会，西部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，国家重要科研和文教中心。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《西安市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕13号 陕西省人民政府、自然资源部： 你们关于报请批准《西安市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《西安市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是西安市各类开发保护建设活动的基本依据，请认真组织实施。西安是陕西省省会，西部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，国家重要科研和文教中心。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥西部经济中心、科技创新中心、先进制造业基地、对外交往中心以及国际旅游目的地等功能，奋力谱写中国式现代化西安篇章。 二、筑牢安全发展的空间基础。到2035年，西安市耕地保有量不低于202.48万亩，其中永久基本农田保护面积不低于135.28万亩；生态保护红线面积不低于3795.65平方千米；城镇开发边界面积控制在1410.77平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过23.35亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。深度融入共建“一带一路”，积极参与西部陆海新通道建设，协同推动黄河流域生态保护和高质量发展，引领关中平原城市群协同发展，带动深化晋陕豫黄河金三角区域经济协作，加快西安—咸阳一体化进程，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，促进陕西西咸新区融合发展，加强中心城区与县城功能联动。持续加强秦岭生态屏障保护修复，修复渭河流域生态系统，加强荒山绿化，推动水土流失综合治理。保障现代都市农业空间需求，优化农业空间布局。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障先进制造业、高新技术产业和科技创新产业发展的空间需求，优化国际贸易、文化旅游和科研教育等现代服务业空间布局。提升国际航空、铁路枢纽功能，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。严格控制地下水开采利用。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，加强抗震减灾，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强秦始皇陵及兵马俑坑世界文化遗产和八路军西安办事处旧址等红色文化遗产保护，提升工业遗产保护和活化利用水平，严格地下文物埋藏区空间管控。加强对城市建筑高度、体量、色彩等空间要素的管控引导，整体保护“八水绕长安”的古都山水环境，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对西安市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。陕西省人民政府、自然资源部要指导督促西安市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。西安市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月17日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.149Z"},{"slug":"policy-20250122-09fa5bd5","title":"国务院关于《佛山市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕14号","publish_date":"2025-01-22","effective_date":"","status":"现行有效","level":"国家级","region":"佛山","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7000443.htm","summary":"上级下达指标，其中2025年不超过23.44亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《佛山市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕14号 广东省人民政府、自然资源部： 你们关于报请批准《佛山市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《佛山市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是佛山市各类开发保护建设活动的基本依据，请认真组织实施。佛山是粤港澳大湾区重要的节点城市，国家历史文化名城。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥全国先进制造业基地、国际科技创新中心承载地等功能，奋力谱写中国式现代化佛山篇章。 二、筑牢安全发展的空间基础。到2035年，佛山市耕地保有量不低于27.86万亩，其中永久基本农田保护面积不低于24.66万亩；生态保护红线面积不低于323.06平方千米；城镇开发边界面积控制在1590.44平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过23.44亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。增强城市综合实力，积极共建粤港澳大湾区，纵深推进广佛同城化，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提高中心城区服务能级，加强南海区、顺德区与中心城区功能联动，推进高明区、三水区城镇集约紧凑布局。筑牢皂幕山、大南山等生态屏障，加强西江、北江流域生态保护修复，整体提升河流湖泊湿地生态系统的质量和稳定性，发挥好城镇组团间绿楔的生态功能。保障现代都市农业空间需求，拓展生态渔业、现代花卉等特色优势农产品生产空间，保护桑基鱼塘等传统农业空间。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障先进制造业和科技创新产业发展的空间需求，为推动粤港澳高端服务合作和珠江西岸先进装备制造产业带建设提供空间保障。强化与广州等周边城市在航空、铁路、公路等方面的功能协同，加强粤港澳大湾区港口群协调联动，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强自然保护地整体保护，加强佛山祖庙等文物和岭南文化保护。加强对汾江河沿岸建筑高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对佛山市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。广东省人民政府、自然资源部要指导督促佛山市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。佛山市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月18日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.178Z"},{"slug":"policy-20250117-f8824b97","title":"国务院关于《拉萨市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕10号","publish_date":"2025-01-17","effective_date":"","status":"现行有效","level":"国家级","region":"拉萨","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_6999497.htm","summary":"西藏自治区首府，国家历史文化名城，全国性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《拉萨市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕10号 西藏自治区人民政府、自然资源部： 你们关于报请批准《拉萨市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《拉萨市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是拉萨市各类开发保护建设活动的基本依据，请认真组织实施。拉萨是西藏自治区首府，国家历史文化名城，全国性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥具有雪域高原特色的国际旅游目的地等功能，奋力谱写中国式现代化拉萨篇章。 二、筑牢安全发展的空间基础。到2035年，拉萨市耕地保有量不低于76.61万亩，其中永久基本农田保护面积不低于54.92万亩；生态保护红线面积不低于9674.59平方千米；城镇开发边界面积控制在230.55平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过7.37亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。深度融入共建“一带一路”，加强对接成渝地区双城经济圈，有力服务边境地区建设，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，促进拉萨河南部地区功能集聚和紧凑布局，辐射带动县城、小城镇发展，支持就近城镇化。保护好青藏高原生态，筑牢念青唐古拉山和郭喀拉日居山高原山体生态屏障，加强全域生态保护修复，整体提升拉萨河、拉鲁湿地、纳木错等河流湖泊生态系统的质量和稳定性，管理好黑颈鹤等高原高寒生物的栖息地和迁飞通道。拓展高原特色农牧业生产空间，保障高原现代农业空间需求。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障文化旅游等服务业发展空间需求。支持航空、铁路、公路基础设施建设，完善多向联通、多式联运的对外对内通道，做好重大基础设施的空间预留，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，加快建设国家清洁能源基地，积极稳步推进“平急两用”公共基础设施建设，优化防灾减灾救灾设施区域布局，适应减缓气候变化影响，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，增强基本公共服务的均衡性和可及性，完善城乡生活圈，促进职住平衡，提高群众生活品质；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强拉萨布达拉宫历史建筑群世界文化遗产和纳木错—念青唐古拉山风景名胜区保护，保护城市内部及周边的林地草地。加强对八廓街历史文化街区及拉萨布达拉宫历史建筑群周边地区建筑高度、体量、色彩和景观视廊等空间要素的管控引导，构建文化资源、自然资源、景观资源整体保护的空间体系，塑造具有雪域高原和浓郁地域特色的城市特色风貌。 五、维护规划严肃性权威性。《规划》是对拉萨市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。西藏自治区人民政府、自然资源部要指导督促拉萨市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。拉萨市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月15日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.193Z"},{"slug":"policy-20250116-68aac374","title":"国务院关于《无锡市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕7号","publish_date":"2025-01-16","effective_date":"","status":"现行有效","level":"国家级","region":"无锡","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_6999060.htm","summary":"高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对无锡市国土空间作出的全局安排，是全市国土","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《无锡市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕7号 江苏省人民政府、自然资源部： 你们关于报请批准《无锡市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《无锡市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是无锡市各类开发保护建设活动的基本依据，请认真组织实施。无锡是长三角地区重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥全国先进制造业基地、区域性科技创新高地和文化创意基地、具有湖滨山水特色的风景旅游目的地等功能，奋力谱写中国式现代化无锡篇章。 二、筑牢安全发展的空间基础。到2035年，无锡市耕地保有量不低于116.95万亩，其中永久基本农田保护面积不低于104.88万亩；生态保护红线面积不低于840.28平方千米；城镇开发边界面积控制在1495.51平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过50.0亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。深度融入长江经济带发展、长三角一体化发展战略，主动融入上海大都市圈建设，促进环太湖地区城市、长江南北岸城市功能联动，加强苏锡常都市圈国土空间开发保护利用的区域协同，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，促进中心城区与江阴、宜兴协调联动发展。加快推进沿江岸线产业转型升级和岸线功能优化，系统推进太湖流域综合治理，改善太湖水环境质量，整体提升蠡湖、滆湖等湖荡水网生态系统的质量和稳定性，筑牢宜兴南部山区生态屏障。保障现代都市农业空间需求，优化农业空间布局。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障先进制造业、战略性新兴产业和环太湖地区科技创新产业发展的空间需求，优化文化创意等现代服务业布局，为推动传统产业转型升级提供土地政策保障。提升物流枢纽、航空枢纽功能，优化完善沪宁通道建设，深化沿江港口资源整合，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，加强洪涝灾害防治，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局与太湖、大运河交融的蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强大运河（江南运河无锡城区段）世界文化遗产和工业遗产保护利用。加强对城市建筑高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对无锡市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。江苏省人民政府、自然资源部要指导督促无锡市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。无锡市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月12日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.220Z"},{"slug":"policy-20250116-f9431d40","title":"国务院关于《常州市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕9号","publish_date":"2025-01-16","effective_date":"","status":"现行有效","level":"国家级","region":"常州","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_6999061.htm","summary":"文化遗产与自然遗产空间保护机制，加强大运河（江南运河常州城区段）世界文化遗产和红色文化遗产保护。加强对城市建筑高度、体量、色彩等空间要素的管控引导，重点保护淹城遗址，保护好历史城区和历史文化街区，构建","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《常州市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕9号 江苏省人民政府、自然资源部： 你们关于报请批准《常州市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《常州市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是常州市各类开发保护建设活动的基本依据，请认真组织实施。常州是长三角地区重要的中心城市，国家历史文化名城。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥全国先进制造业基地、区域性科技创新高地等功能，奋力谱写中国式现代化常州篇章。 二、筑牢安全发展的空间基础。到2035年，常州市耕地保有量不低于126.08万亩，其中永久基本农田保护面积不低于114.96万亩；生态保护红线面积不低于346.10平方千米；城镇开发边界面积控制在925.06平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过31.0亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。深度融入长江经济带发展、长三角一体化发展战略，主动融入上海大都市圈建设，强化与南京都市圈功能联动，促进长江南北岸城市功能联动，加强苏锡常都市圈国土空间开发保护利用的区域协同，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，加快主城区和金坛区同城化发展，推进中心城区和溧阳市一体化发展，提升小城镇空间品质。恢复长江岸线生态功能，协同推进太湖流域综合治理，整体提升长荡湖、滆湖等湖荡水网生态系统的质量和稳定性，加强南山、茅山等山体生态系统保护与修复。保障现代都市农业空间需求，优化农业空间布局。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障先进制造业和科技创新产业发展的空间需求，为推动传统产业转型升级提供土地政策保障。整体提升综合交通枢纽功能，优化完善沪宁通道建设，深化沿江港口资源整合，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，加强洪涝灾害防治，优化防灾减灾救灾设施区域布局，提升水安全保障水平，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局水乡特色鲜明的蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强大运河（江南运河常州城区段）世界文化遗产和红色文化遗产保护。加强对城市建筑高度、体量、色彩等空间要素的管控引导，重点保护淹城遗址，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对常州市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。江苏省人民政府、自然资源部要指导督促常州市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。常州市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月13日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.244Z"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","type":"case","type_label":"案例","issuer":"新华网·新华日报电子版","doc_no":"","publish_date":"2024-12-17","effective_date":"","status":"入选典型案例","level":"地方级","region":"苏州","source_name":"新华网·新华日报电子版","source_url":"https://www.xhby.net/content/s67569662e4b09f022e598ed0.html","summary":"苏州姑苏区32号街坊保护更新项目入选中共中央宣传部习近平文化思想研究中心组织编写的《习近平文化思想实践案例选编（2024年）》，是“积极推进文化遗产保护传承”方面的典型案例。实践涉及道前街、干将西路、养育巷、学士街范围内的历史建筑修缮与功能置换，由苏州名城保护集团统筹推进，并在地下综合管廊建设中采用“明挖+顶管”组合方式。","themes":["历史文化街区","保护更新","文化遗产保护传承","城市更新"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>古城三十二号街坊新传——走进文化遗产保护传承“姑苏案例”_中国江苏网 英文版 电子报 + - 中国江苏网 &gt; 江苏要闻 &gt; 正文 古城三十二号街坊新传——走进文化遗产保护传承“姑苏案例” 1 放大镜 秋冬交替，苏州道前街的银杏迎来最佳观赏期，四面八方赶来的男女老少徜徉其中，享受古城美好时光。 以这条银杏大道为南向边界，北至干将西路，东、西分别到养育巷、学士街，是苏州古城32号街坊的四至范围，这里是明清时期官署集中地，明清以来的名称、走向、格局一直延续至今。近日，“赓续古城历史文脉 焕发江南文化魅力—江苏省苏州市姑苏区实施32号街坊保护更新项目”从全国数百个案例中遴选而出，成功入选《习近平文化思想实践案例选编（2024年）》，成为“积极推进文化遗产保护传承”的三大典型案例之一。 苏州市姑苏区实施的32号街坊保护更新项目，创造性将古城保护更新提升同保护文化遗产、提升群众生活品质统一起来，以“绣花功夫”走出一条传承与创新并举、历史与现代交融、文化与经济共生的古城复兴之路，是赓续城市历史文脉、传承弘扬中华优秀传统文化的有益探索，成为贯彻落实习近平文化思想的生动实践。 记者来到32号街坊，亲身感受文化遗产保护传承的“姑苏案例”。 机制支撑，个案保护迈向成片更新 “上有天堂，下有苏杭。这里满足了我对江南水乡的所有想象！”趁着年假，深圳90后姑娘Dicey来到苏州，打卡“种草”已久的畅园有熊酒店。 “城中尚有小园，以畅园、壶园为最。”庙堂巷内的畅园，始建于清代，园子规模虽小，但造园手法细腻、布局精巧，是江南典型的小型私家园林。32号街坊启动保护更新后，对畅园2.2亩园林本体进行最少干预的零星修缮并对外开放，外围东侧建筑则改造成酒店会客空间，营造沉浸式私家园林生活体验。去年底营业后常“一房难求”。 32号街坊历史文化遗存丰富，拥有省市文保单位7处，市控保建筑7处，古井、古桥、古树遍布。老祖宗留下的宝贝，有的在保护修缮中，多数如畅园这般，有了新的打开方式。 “相比单体建筑的修缮利用，更难的是成片建筑群的保护传承。”持续的关注、参与，让苏州规划设计研究院历史文化名城中心主任、32号街坊社区规划师沈佶平愈发强烈地感受到，对32号街坊的保护传承，已逐步从过去对古典园林、古建老宅等历史遗存的保护利用，拓展至成片区域的保护、修缮、整治、管理、运营。在沈佶平看来，这种转变的背后，是顶层体制机制在强势支撑。两年前，苏州市委挂牌成立市属国企——苏州名城保护集团，担当19.2平方公里历史城区保护更新工作的主要平台和实施主体，就是一次重要的机制创新。 自那时起，32号街坊开始由一个国资平台统筹全域保护更新工作，进入三位一体、三步推进、三资统筹模式，即古城保护、老旧小区改造、城市更新，产权整理、保护修缮、招商运营，资金使用、资源利用、资产集中和运营管理统筹推进，破题传统搬迁收储、保护修缮等各个环节分别对应负责方，容易造成力量分散、二次施工、资金负担等问题。 跟随苏州名城保护集团旗下苏州名城更新发展有限公司副总工程师邵春辉来到32号街坊剪金桥巷地下综合管廊工地，在约2米高、1.6米宽的下沉空间里，一台远程操控的“迷你版”盾构机正忙着“顶管”作业。 “春节前会‘洞通’！苏州历史城区范围内还没有这样的先例，可以说是一次‘破局’。”邵春辉解释，目前古城架空线整治和入地工程基本都是明挖施工，这种方式难度小、速度快，但对路宽有要求，在狭窄街弄难以实施。32号街坊尝试以“明挖+顶管”的方式施工，更关键的是为老街坊建造一个“中央处理器”，往后供电、通信电缆以及供水管道等的检修、增容都能入廊搞定。“当然难度也大，且不论资金投入，脆弱的老宅旧屋、错综复杂的管线，都要摸清楚、协调好。这时候策划、投资、建设、运营一体化的优势就显现出来了。”邵春辉说。 试点编制防火保障方案，破解街坊消防设计和验收瓶颈，为姑苏区“保护更新防火技术导则（试行）”提供样本；改变由用地性质划分控制地块的传统做法，将街坊划分成面向项目实施操作的保护更新管控单元和实施院落，满足现行消防、建筑密度等改造要求……保护更新的过程中，32号街坊不断创新体制机制，许多悬置未决的问题有了答案，许多左右为难的矛盾有了出路。 融入市场，文化遗产焕发新魅力 午后，漫步32号街坊，除了围坐在一起晒太阳、唠家常的老居民，你还很有可能偶遇捧着热咖啡Citywalk的金融界白领精英。 32号街坊正以“金融街坊”为产业定位，发展“院落经济”——在街坊内规划32处金融小院，招引金融机构、投资类企业入驻。当下，已有苏州基金、苏州银行、苏州资管、哇牛资本等26家金融投资类企业完成注册。 庙堂巷14号，一处坐北朝南、三进院的老宅，清末叶姓进士曾居于此。近段时间，专注于半导体等领域的新锐私募股权投资机构哇牛资本迎来送往十分热闹。“我们邀请股东、LP、被投企业来‘新家’体验，还在这里办了一期‘CEO大师班’，反响特别好。”哇牛资本赋能中心副总监徐黛瑛感慨，在“自家”宅院接待客人、办活动，和在星级酒店的感觉完全不一样，很松弛，有亲近感。徐黛瑛和同事也有幸福感：晴天，阳光透过院井照上工位；雨天，雨打屋檐的回响是最动人的背景乐。 使用是最好的保护。打开苏州市公共资源交易平台官网，点击进入“古保伙伴计划”专题，苏州古城内古建老宅的推介、挂牌、成交信息一目了然。这是去年6月苏州国家历史文化名城保护区、姑苏区启动的“古城保护更新伙伴计划”线上平台，以此邀请有文化情怀、责任担当、专业实力的“伙伴对象”入驻古城。 “一共上线了4批、70座古建老宅，其中21座来自占历史城区1.27%面积的32号街坊。”32号街坊地处姑苏区沧浪街道，街道党工委书记张卫认为，一方面体现了前期成片保护更新的效率和效果，一方面也反映了这项工作面临的新压力，活化利用要跟上节奏、更快行动。32号街坊的应对之策是融入市场、寻找“伙伴”，形成“政府主导、市场运作、多方参与”保护更新路径。 《赓续古城历史文脉 焕发江南文化魅力》一文中，有这样一句话：对于32号街坊保护更新项目，姑苏区委、区政府有一个明白账，算经济账、更算文化账，算短期账、更算长远账。身处其中，记者对这句话有了切身体会。32号街坊保护更新讲究效率，也坚持原则，活化利用项目优先考虑与街坊、宅院本身历史文化属性的匹配度，“金融街坊”如此，中医主题文化馆、绛书房等皆是这般。 古城是苏州的心脏，历史上也是苏州的金融中心。上个月，32号街坊联合苏州银行在其入驻的桃园举办“资本融通赋能新质”主题沙龙，共话“金融街坊”文化金融深融发展新策略。 瓣莲巷4号曹沧洲祠，是为纪念吴门医派代表人物曹沧洲仁医精神而建，现由吴门医派“老字号”企业雷允上“接手”，打造集医理展示、非遗体验、门诊坐堂于一体的中医主题文化馆。 女性主题书店绛书房本月初在剪金桥巷58号开业。“杨绛先生曾在附近庙堂巷度过青葱求学时光。一方书房，是后辈对先生的深深纪念。”书店主理人唐国良也曾居住于此，他坦言，回归32号街坊，是情怀，也是追随时代、追随市场，“一个会讲故事的地方，商气、人气不会差。” 以人为本，共创苏式生活好福气 从绛书房走出，经过剪金桥巷54号，手冲咖啡的香气扑鼻。“进来喝杯咖啡！”查嘉麟并不是咖啡店的老板，而是一位热情好客的房东，兴致来了他还会化身导游，带着游客、顾客参观自家的宅院。 查宅有不少“镇宅之宝”。咖啡店门面正上方的“光前裕后”砖刻门额，由李鸿章亲笔书写并赠与部下查氏，也就是查嘉麟的先祖。院子里还有一棵百年石榴树，每年丰收时节，查老都会邀请街坊邻居前来品尝。“上个月摘果的时候，院子里特别热闹，查老专门送来不少，被我做成特调限定，成为爆款。”主理人王燕才来不久，她说，那几个石榴，让她仿佛一下子融入了这个地方。 原住民是古城、历史街区、街坊的灵魂，他们的生活方式、民俗风情、待客之道等都是当地传统文化的重要组成。32号街坊有22栋零星居民楼和约300个传统民居大院。保护更新项目实施之前，这里普遍存在房屋建筑质量老旧、基础设施薄弱、公共空间品质低等问题。特别是居民大院，有的小院子十几户人家共用一个厕所、厨房。 在32号街坊，保护更新的过程，也是居民生活品质跃升的过程。 “大伙都知道‘老房子一栋也不能拆’，但有的房子已经到了根本住不了人的地步。”年过六旬的荣幼竹在盛家浜10号住了30多年，最害怕下雨天，“外面大雨、里面小雨，社区请人来修了好多次都没用。”32号街坊保护更新项目启动后，政府把留下或迁居的选择权交给居民，荣幼竹与院子里的十几户人家一起住上了电梯房，盛家浜10号被列入第一批“伙伴计划”。“老宅子有了更好的归宿，我们都很开心。”荣幼竹的故事，也被写进这个“姑苏案例”。 选择留下的居民，如何提高生活品质？32号街坊对老旧小区、零星楼及背街小巷开展整治，完善基础配套、提升人居环境。真实发生的几个小故事被津津乐道：征求意见时，有居民提到小时候家门口有一排樱花树，后来真给安排上了；有居民想要公共活动空间，24小时共享书房建起来了。以人为本、惠民利民，延续了古城的人情与文脉，老百姓对街坊保护更新的满意度、参与度更高了。 “老街坊”乐陶陶，“新街坊”笑盈盈。老字号“馀昌钟表”在剪金桥巷开的分店正在装修中，“一切交给时间”是副总经理谢天豪常说的“行话”，也表达了他对32号街坊发展的信心。因为外公外婆住在32号街坊，谢天豪从小是这里的常客，从这位90后的视角看这片熟悉的地方，黑白灰的古旧宅屋还是小时候的样子，但里面的生活早已地覆天翻。“人人向往的‘小桥、流水、人家’，以前说的是‘老苏州’的苏式生活，现在讲的是新老街坊共创共享当代苏式生活的美好。”谢天豪说。 去年7月6日，习近平总书记来到苏州平江历史文化街区考察调研，强调“住在这里很有福气，古色古香，到处都是古迹、到处都是名胜、到处都是文化。‘百步之内，必有芳草’，这句话可以用在这里。”眼下，以32号街坊为代表的保护更新项目在苏州古城实施推进，“百步之内，必有芳草”随处可及，苏式生活的好福气洋溢在古城街头巷尾。 记者 陈雨薇 标签： 责编：路航 特别推荐 新华日报电子版 党的二十届五中全会 C大调·绿洲中国 网络中国节·清明 锲而不舍落实中央八项规定精神 习近平法治思想“E起学习”平台 匠心江苏 学习雷锋好榜样 文明实践我行动 下载 本站不良内容举报信箱：jubao@jschina.com.cn 举报电话：（025）84737000 广告服务 | 网站律师 | 联系方式 苏ICP备07000608号 国新网许可证3212006001号 视听节目许可证1008318号 广播电视节目制作经营许可证苏字第394号 电信增值业务经营许可证苏B1,B2-20210399\u003c/p>","related":[{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-16T09:05:28.286Z"},{"slug":"policy-20241216-2933897e","title":"国务院关于同意将江苏省兴化市列为国家历史文化名城的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2024〕189号","publish_date":"2024-12-16","effective_date":"","status":"现行有效","level":"国家级","region":"兴化","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202412/content_6992787.htm","summary":"国务院关于同意将江苏省兴化市 列为国家历史文化名城的批复 国函〔2024〕189号 江苏省人民政府： 你省关于申报兴化市为国家历史文化名城的请示收悉。现批复如下： 一、同意将兴化市列为国家历史","themes":["历史文化名城"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于同意将江苏省兴化市 列为国家历史文化名城的批复 国函〔2024〕189号 江苏省人民政府： 你省关于申报兴化市为国家历史文化名城的请示收悉。现批复如下： 一、同意将兴化市列为国家历史文化名城。兴化市历史悠久、文化厚重，传统格局和历史风貌保存较好，地域特色鲜明，文物和文化遗产资源丰富，非物质文化遗产缤纷多彩、活态传承，具有重要的历史文化价值。 二、你省、泰州市及兴化市人民政府要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，深入学习贯彻习近平文化思想，按照党中央、国务院决策部署，牢固树立保护历史文化遗产责任重大的观念，落实《中华人民共和国文物保护法》、《历史文化名城名镇名村保护条例》要求，深入研究发掘历史文化资源的内涵与价值，系统开展考古调查和史料研究，厘清兴化古城的空间格局和发展脉络，明确保护的原则和重点，强化历史文化资源的保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好兴化市历史文化名城保护规划和文物保护等专项规划，制定并严格实施保护管理规定，明确各类保护对象的清单以及保护内容、要求和责任。正确处理城市建设与历史文化资源保护的关系，摸清文物资源家底，加强文物保护，完善“先调查、后建设”、“先考古、后出让”制度，重视保护城市格局和风貌管控，加强整体性保护、系统性保护；保护修复历史文化街区，补足配套基础设施和公共服务设施短板，不断提升人居环境品质；加强不可移动文物和历史建筑修缮保护，推动文物保护单位开放利用，充分发挥不可移动文物和历史建筑的使用价值。不得改变与名城相互依存的自然景观和环境，不得进行任何与名城环境和风貌不相协调的建设活动，不得损坏或者擅自迁移、拆除不可移动文物和历史建筑，涉及文物的建设项目要依法履行报批程序。进一步强化责任落实，对不履职尽责、保护不力，造成名城历史文化价值受到严重影响的行为，依法依规加大监督问责力度。 三、你省与住房城乡建设部、国家文物局要加强对兴化市国家历史文化名城保护工作的指导、监督和检查。 国务院 2024年12月12日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.260Z"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","type":"case","type_label":"案例","issuer":"福建日报（新福建）","doc_no":"","publish_date":"2024-12-13","effective_date":"","status":"入选典型案例","level":"地方级","region":"屏南","source_name":"福建日报（新福建）·文旅宁德","source_url":"https://share.fjdaily.com/displayTemplate/news/newsDetail/1161/2976236.html?isView=true","summary":"福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践入选《习近平文化思想实践案例选编（2024年）》，为宁德唯一入选案例。屏南现有中国传统村落25个、省级传统村落9个，占全县行政村的22.4%，并拥有中国历史文化名镇名村3个、省历史文化名镇名村6个。当地以文化产业发展为切入点，通过创新人才引育机制、活化闲置老屋资源、推动产业融合发展，打造龙潭、厦地、四坪、前汾溪等一批文化特色村。","themes":["传统村落","乡村振兴","文化遗产保护传承","文创赋能"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>宁德1案例入选 近日，由中共中央宣传部习近平文化思想研究中心秘书处组织编写的《习近平文化思想实践案例选编（2024年）》正式出版，全书收录了以习近平文化思想的“十六个方面战略部署”为框架编写的45个典型案例。 宁德屏南实践案例《以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的新路径》入选。 图源|福建新华书讯 LOOK 图源|李锐/摄（已获授权，未经作者同意禁止转载） 屏南县现有中国传统村落25个、省级传统村落9个，占全县行政村的22.4%，数量居福建省前列 ；还拥有中国历史文化名镇名村3个，省历史文化名镇名村6个。但在城镇化浪潮下，与全国不少乡村一样，有近八成农村人口外流，乡村“空心化”、老屋荒废等情况突出。 为突破这一困境，屏南县切实扛起“把老祖宗留下来的文化遗产精心守护好”“把闽东之光传播开去”的政治责任、文化责任， 以文化产业发展为切入点，采用创新人才引育机制、活化闲置老屋资源、推动产业融合发展等做法，打造了龙潭、厦地、四坪、前汾溪等一批文化特色村 ，来自香港、北京、上海、深圳等地“新村民”纷至沓来，曾经偏远落后的“空心村”成为全国闻名的“网红村”，成为奔波、焦虑的城市人休憩和清醒的目的地，满足游客们对“诗和远方”的向往，让传统村落真正实现“见人、见物、见生活”。 这个冬天 到屏南传统村落 寻找那份最久远而温暖的乡愁吧~ 图源|小红书@安柒映画（摄影）（已获授权，未经博主同意禁止转载） 龙潭村 屏南传统村落之旅 龙潭村，至今已有600多年历史。四面环山，一条小溪从村中流过，溪水清澈见底，村中保留大量的古村落建筑群以及“国家级非遗”四平戏和“省级非遗”黄酒酿造技艺。村内目前有公益画室和酒博物馆、戏博物馆、美术馆、音乐厅等。定时举办“龙潭戏曲文化节”，活跃村落文化。秋冬季的龙潭村，古色古香的建筑加上柿子的点缀，随便一拍都是美图。 图源|谢舒婷/摄（已获授权，未经作者同意禁止转载） 四坪村 屏南传统村落之旅 四坪村与龙潭村相隔四公里，是中国传统村落和福建省级历史文化名村。一幢幢特色古民居依山而建，青石铺路、叠石流水，古韵悠悠。近几年，小毛驴四坪农园、爱故乡驿站、大树学堂、星空营地、爱故乡书吧、四坪公益艺术教育中心、南山音乐吧、平讲戏研习所等项目陆续建成投用，打造“四坪喜柿”特色IP，引发一波波“赏柿”热潮，四坪村成为广大游客追逐体验的“诗与远方”。 厦地村 屏南传统村落之旅 厦地村位于屏南县屏城乡东南部，距今已有800多年的历史，是“屏南四大书乡”之一。它藏在群山褶皱里，古民居依山势而建，仍然保持着明清时期的建筑风貌。村中小溪穿流而过，黄墙黛瓦，错落有致，傍山结庐，一处隐于乡野的世外桃源。南京先锋书店在此打造了福建省的第一家乡村书店——先锋厦地水田书店，成为特色地标。 基地大门|屏南县文体和旅游局供图 基地外立面|屏南县文体和旅游局供图 图源|小红书@黄33（独家授权，禁止转载） 前汾溪村 屏南传统村落之旅 前汾溪村位于屏南县屏城乡，是个有着近千年历史的传统村落，这里群山环绕、溪水潺潺、古木苍翠，土墙黑瓦的闽东北山地古建筑随处可见。前汾溪村是全省25个首批美育培育村之一。2019年10月，中国美术学院社会美育综合实践基地在前汾溪村落地运营，每年有上万人（次）到基地开展文艺创作、艺术交流、设计创新、教育培训、公益美育课堂等活动。2023年4月，“乡野艺校”联合福建大梦书屋旗下子品牌“大梦悦读”，打造一个集阅读学习、概念餐饮、美学生活、社区发展于一体的复合型空间，构建起一处融汇知识与生活的文化共享平台与多功能文化地标。 图源|屏南文旅供图 图源|屏南文旅供图 图源|屏南文旅供图 北墘村 屏南传统村落之旅 红粬黄酒第一村——北墘村位于屏南县代溪镇东南部，第三批中国传统村落。村落传统格局保持完整，传统建筑中大部分是古民居，同时种类丰富，有祠堂、庙宇、门楼、炮楼、歇亭、水碓房和廊桥等。北墘村从事红粬黄酒酿造农户占全村农户99%。近年来，北墘村立足本村实际，定期举办黄酒文化节，还先后与福建阳光学院、江夏学院、福建工程学院等院校合作，深入挖掘北墘村历史、黄酒等特色文化资源，强化特色文创产品研发，进一步打响北墘黄酒的知名度。 …… 炊烟袅袅，黛瓦爿爿 那一片柿红，那一碗酒香 那一缕乡愁，那一抹月光 在屏南乡村 走着走着 就走进了美妙的时光记忆中\u003c/p>","related":[{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"}],"updated_at":"2026-11-16T09:05:28.428Z"},{"slug":"policy-20241211-198fd8c3","title":"开封市《宋都古城国家文物保护利用示范区建设实施方案》（汴政〔2024〕14号）","type":"policy","type_label":"政策","issuer":"开封市人民政府","doc_no":"汴政〔2024〕14号","publish_date":"2024-12-11","effective_date":"2024-12-03","status":"现行有效","level":"地方级","region":"开封","source_name":"开封市人民政府（政府网站公开内容）","source_url":"https://www.kaifeng.gov.cn/kfsrmzfwz/gkwhycbhqk/pc/content/content_2000403706306490368.html","summary":"开封市人民政府以汴政〔2024〕14号印发《宋都古城国家文物保护利用示范区建设实施方案》，2024年12月3日成文、12月11日通过政府网站公开发布，是开封市推进宋都古城国家文物保护利用示范区建设、统筹历史文化保护与城市更新的综合性政策文件。","themes":["历史文化名城","文物保护利用示范区","宋都古城","城市更新"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>开封市人民政府关于印发河南开封宋都古城国家文物保护利用示范区建设实施方案的通知 - 开封市人民政府网站 网站支持IPv6 发展规划 优化营商环境 “十四五”规划 医疗保险 市政府 新闻动态 政务公开 政务服务 政民互动 走进开封 数据发布 您当前的位置： 11410200005317445G/0002858 汴政〔2024〕14号 2024-12-03 2024-12-11 通知 有效 发文机关 ： 开封市人民政府 废止日期 ： 开封市人民政府 关于印发河南开封宋都古城国家文物保护利用 示范区建设实施方案的通知 来源： 发布时间： 各县、区人民政府，市人民政府各部门及有关单位： 《河南开封宋都古城国家文物保护利用示范区建设实施方案》已经国家文物局原则同意，现印发给你们，请结合实际，认真贯彻落实。 2024年12月3日 （此件公开发布） 河南开封宋都古城国家文物保护利用示范区 建设实施方案 为全力推进河南省开封市创建宋都古城国家文物保护利用示范区工作，根据中共中央办公厅、国务院办公厅《关于加强文物保护利用改革的若干意见》以及《国家文物局关于印发〈国家文物保护利用示范区创建管理办法（试行）〉的通知》《国家文物局关于同意创建河南开封宋都古城国家文物保护利用示范区的函》等文件精神，结合开封市实际，制定本建设实施方案。 一、总体要求 （一）指导思想 以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，学习领会习近平总书记对文物、文化遗产、城市（镇）工作的重要论述和指示批示精神，贯彻落实中央、省关于文物保护利用工作的部署，践行“保护第一、加强管理、挖掘价值、有效利用、让文物活起来”的工作要求，坚持新发展理念，探索开封作为大型古今重叠型城市在大遗址考古展示、文物建筑活化利用、古城风貌更新保护等方面的新思路、新方法、新格局，构建具象化、沉浸式的多元立体保护展示体系，打造中华文化重要标志。统筹兼顾古城保护和经济社会发展，让文物和文化遗产保护成果更多惠及民生，让历史文化和现代生活融为一体。把宋都古城文物保护利用和文化遗产保护传承，作为践行习近平文化思想的生动实践典范，为铸牢中华民族共同体意识、建设文化强国和中华民族现代文明贡献力量。 （二）创建原则 1.坚持保护第一。秉持正确的古城保护理念，做好考古前置，以《北宋东京城遗址保护规划大纲》为统领，全面保护古城的各类文物和文化遗产，正确处理好古城保护和城市更新发展的关系，以对历史负责、对人民负责的态度，保护好宋都古城的真实性和完整性。 2.坚持深化改革。健全开封“文物+”协调机制，破解影响制约大遗址保护利用、古城有机更新、文物作用更好发挥的体制机制问题，研究出台拓宽示范区建设资金融资渠道、提高资源配置、利于调动社会力量积极性的创新举措，提升文物领域综合改革效能，激发文物事业发展活力。 3.坚持守正创新。分类评估、精准施策，在加强保护、深化研究的前提下拓展合理有效利用，在现代化建设中同步保护和弘扬优秀传统文化，不断提升文物和文化遗产活化利用水平，更好发挥文物和文化遗产见证历史、以史鉴今、启迪后人的作用。 4.坚持惠及民生。贯彻以人民为中心的发展理念，引导社会公众和资本积极参与，保障古城居民合法权益，激励原住民关心支持文物和文化遗产保护利用，推动从“要我保”转变为“我要保”，营造齐抓共管、自觉保护、共建共享的社会氛围。 （三）创建目标 全面加强文物保护利用和文化遗产保护传承，自觉担负起新的文化使命，将示范区打造成古今重叠型城市可持续发展的全国典范。遵循“老城不能再拆”的要求，统筹好古城地上地下文物整体全面保护、建筑有机更新、城市产业发展的关系，让市民在古城街巷也能过上舒适现代生活，创新“在保护中发展、在发展中保护”的可持续模式；深入挖掘开封4000多年建城史，做好“地下寻宋”考古工作，突出全面保护和重点展示，阐释好古城千年发展演变、文化绵延不绝、人民生生不息的内在历史根源与发展逻辑，展示好古城文物在实证中华文明突出特性中的重大历史价值，擦亮以北宋东京城为代表的开封宋都古城“金名片”。传承古城优良人文传统与民俗习惯，培育古城多元业态，创新发展与古城保护传承相适应、可赋能现代化建设和高质量发展的特色文物文化旅游，使“城河相依、生生不息”成为可知、可见、可感、可参与的活态历史场景。以示范区创建带动开封全域文物事业高质量发展，书写好中国式现代化文物新篇章的开封板块。 二、总体安排 （一）创建时间 2024年10月—2027年10月，共计3年时间。 （二）创建范围 宋都古城是以北宋东京城遗址为代表的各历史时期文化遗产的统称。其区域为开封市文物资源的重要集聚区、历史文化街区的汇集区、古都风貌的核心区、文化基因与城市记忆的贮存区；是提升开封城市形象气质、扩大城市影响力的关键区域。 核心区：开封城墙围合的13平方公里范围。 拓展区：北宋东京城外城遗址以内除去核心区的41平方公里范围（北宋东京城围合区域约54平方公里）。 （三）实施步骤 1.方案制定报批阶段（2024年1月—2024年9月） 做实开封市宋都古城国家文物保护利用示范区创建工作小组和办公室，组织编制《河南开封宋都古城国家文物保护利用示范区建设实施方案》（以下简称《方案》）及细则，明确目标任务。向国家文物局报告《方案》，并根据国家文物局反馈意见修改完善直至《方案》通过。 2.动员部署阶段（2024年10月—2024年11月） 根据国家文物局批复要求，召开全市创建工作动员部署会，下发《方案》及配套文件，明确目标任务、落实责任部门，通过各类媒体广泛开展创建宣传，增进市民、群众了解。 3.全面推进阶段（2024年12月—2027年4月） 贯彻“全面加强文物保护利用和文化遗产保护传承，自觉担负起新的文化使命，将示范区打造成古今重叠型城市可持续发展的全国典范”总体目标，落实《方案》各项工作，全面推进创建工作。推动示范项目建设、制度规范设计，并形成行之有效、可持续、可复制的保护传承活化利用新模式。 4.加速推进阶段（2027年5月—2027年7月） 依照《方案》对实际工作查漏补缺，落实整改措施，加快推进相关事项。 5.验收评估阶段（2027年8月—2027年10月） 对照《方案》，组织开展自查验收评估工作，并按期向国家文物局提交示范区创建验收报告，创成宋都古城国家文物保护利用示范区，持续推进，巩固提升创建成果。 三、主要任务和示范项目 （一）深入学习贯彻习近平总书记关于文物、文化遗产、城市（镇）工作的重要论述和指示批示 深入学习贯彻习近平总书记关于文物、文化遗产和城市（镇）工作重要论述和指示批示，深刻领会并把握核心要义与精神实质，不断增强对历史文物的敬畏之心，树牢保护历史文化遗产责任重大的观念、保护文物也是政绩的科学理念，统一思想，提高认识，把古城保护和现代化建设协调一致推进，以新时代开封文物工作高质量发展赋能人民群众美好生活；把示范区建设作为开封市增强“四个意识”、坚定“四个自信”、做到“两个维护”的重大实践检验，全面有力推动习近平新时代中国特色社会主义思想和习近平文化思想落地生根，开花结果，形成生动实践。 【重点示范项目1：将深入学习贯彻落实习近平总书记关于文物工作重要论述和重要指示批示纳入年度《县处级以上党委（党组）理论学习中心组分专题集体学习的安排意见》，在开封市委党校（市行政学院）开展专题讲座，分层分期对全市党员干部进行全覆盖式的学习培训，增强文物保护意识。】 （二）解放思想，改革创新示范区管理保护体制机制 将示范区建设纳入国民经济和社会发展规划，实现协调、可持续的发展目标。建立市、县（区）、乡（办事处）“文物+”工作调度协调机制，实现市内各部门围绕统一目标开展工作、协同联动，形成工作合力。推进文物工作治理体系和治理能力现代化，广泛动员社会力量参与，探索引进社会资本进入保护利用领域的有效途径，推进信息化和数字赋能，试点文物保护补偿政策，破解阻碍大遗址、文物建筑、文博场馆等良性发展的体制机制性问题。 【重点示范项目2：完善管理体制，挂牌成立开封市文物局。文物保护利用工作、文物安全工作相关指标纳入市、县（区）政府年度综合考核工作，利用考核目标驱动各部门共同投入文物保护利用事业。市委市政府组织研究、制订出台大遗址保护利用补偿机制、文物建筑活化利用奖补政策，完善文物保护工程管理办法，发布保护与活化利用优秀案例。研究出台非国有文物建筑、历史建筑修缮管理办法。】 （三）树立大保护理念，全面保护古城各类文化遗产 编制完善涉及宋都古城的各类保护规划并加强规划衔接，将《北宋东京城遗址保护规划大纲》纳入国土空间规划“一张图”，实施严格保护。严格落实“先调查、后建设”“先考古、后出让”制度，推动建立城市更新中文物资源调查和保护前置机制。做好第四次全国文物普查，补充、调整文物保护单位，实现保护对象应保尽保，依法加强各类各级文物及历史建筑产权梳理，全面摸排管理使用情况，完善不可移动文物资源管理制度，落实尚未核定公布为文物保护单位的不可移动文物保护管理措施。建立文物资源资产登记制度。加强非物质文化遗产保护，不断完善四级名录体系。加强古城内历史地段、工业遗产、古树名木、农业文化遗产、地名文化遗产保护，明确保护责任人和机构。推进古城数字资源保存与情景再现工程，建设文物资源大数据库，为数据互联互通和共享应用奠定基础，加强资源数据学术化研究、可视化展示、数字化利用。 做好文物安全风险评估、专人负责，将文物安全工作列入年度工作计划，纳入政府年度目标考核评价体系，分级分类签订目标责任书，深化责任公示制度，精准制定应急预案，开展文物消防安全轮训及安全宣传工作，采取“领导+专家+专班”模式，按照“双随机一公开”机制，实行明查暗访，定期组织“四查”行动，形成文物保护工程专项监管检查机制，有效遏制文物法人违法行为。 【重点示范项目3：以示范区为重点，开展第四次全国文物普查，重点完成古城各类不可移动文物资源的调查认定，建立名录。完成编制并公布《北宋东京城遗址保护规划大纲》。推进编制《开封市文化遗产保护利用总体规划》，构建历史文化保护体系。坚持多规合一、多规融合，实现宋都古城“文物保护一张图”。】 【重点示范项目4：实施宋都古城文物平安工程。分类评估古城内文物风险并提出化解对策，完善文物保护单位“三防”。汲取河南大学大礼堂火灾事故教训，建立健全文物安全责任体系，定期研究和协调解决文物安全突出问题。实行文物安全责任制公告公示和文物保护工程安全责任公示，形成完善的文物安全保护网络。按照“一址一案”要求完善安全应急预案，每季度开展一次应急演练。建立轮训机制，分级培训，提升安全工作能力。建立文物、应急、消防等部门互动协作机制，形成文物安全排查、交办、整改、核查闭环管理模式。签订文物保护工程“三级”安全承诺书，全过程开展文物保护工程监管工作。构建与公安、住建、规划等部门协同机制，严厉打击有效遏制文物法人违法行为，加大开封城墙粮食五库、万岁山未批先建违法行为查处整改工作力度，通过整改促进工作提升，推动执法制度完善。】 【重点示范项目5：实施数字化保护管理工程。开封宋塔数字化记录保存工程。宋代州桥数字化复原研究与活化展示项目。开封文物资源数字管理平台建设项目，将文物信息数据、勘察设计数据、工程维修档案、预防性保护数据、安全巡查数据、监测预警等结合为一体，建设综合性管理系统，实现全面、精确、灵活的文物资源数据分析和动态管理。】 （四）确立大考古观，示范古都大遗址考古工作模式 重新组建跨区域、跨学科、跨部门开封宋都考古队，多团队协作、多学科合作，高质高效一体化推进古城大遗址考古工作，以发掘为核心凝练重大学术课题，贯通田野发掘、科技保护、研究阐释、成果出版、展示利用、公众服务等全链条，加快考古成果转化利用。开展全链条考古研学体验，发挥区位优势，构建“考古实践教育”交流枢纽，打造国际考古旅游先行区。依托重要考古遗迹原状保护现场，建设考古遗址博物馆（展示点），发挥好考古遗迹和出土文物见证历史、启迪后人、凝聚共同体意识、促进人文交流的重大价值作用。 【重点示范项目6：新组建开封宋都考古队，充分利用“城市考古与保护国家文物局重点科研基地开封工作站”平台，由国家、省、市考古机构联合组队。建立由考古、科技、文保、公众考古等领域顶尖专家组成的咨询委员会，围绕北宋东京城布局关键节点，采取考古和文物保护团队联合攻关模式，科学考古、及时保护，现场打通考古发掘、科技考古、文物保护三大环节，最大限度保存文物，全面提取历史信息，定期发布研究成果。】 【重点示范项目7：强化“城市考古与保护国家文物局重点科研基地开封工作站”，依托迎宾路开封博物馆老馆原有场馆建筑，改善陈旧基础设施，提升考古 文化的集中展示区，体验开封“城摞城”的重要窗口。举办城市历史文脉重塑三大展览：以宋文化考古为核心，展示宋辽西夏金元文化融合与民族共同体演化形成；以明清开封城市河患与考古遗存，展示治河与理政间的重大历史关系；以城市考古出土的反映日常生活、商业贸易和文化习俗的文物，讲述“清明上河˙东京梦华”的古城故事。】 （七）传承千年历史文脉，完整保护古城风貌格局 牢记“城市是一个民族文化和情感记忆的载体，历史文化是城市魅力之关键”，秉持正确的古城保护理念，切实保护好其历史文化价值。处理好继承和发展、传统和现代的关系，把促进古城现代功能提升与文物和文化遗产保护相结合，把古城文化遗产活化利用和发展相关适宜产业相结合，更多采取微改造的“绣花”功夫，坚决避免“拆真建假”等干扰公众正确历史认知的建设行为，完成开封城墙粮食五库段风貌整改，系统保护古城的中轴线、水系、城墙、街巷肌理、历史街区、里坊、文物片区等，保存好历史文化名城的无形优良传统，传承好古城非物质文化遗产和特色民俗，让宋都古城更好地体现地域特征、民族特色和时代风貌。 【重点示范项目14：北宋东京城御街中轴线历经宋金元明清民国，沿用保留至今，作为城市历史空间的“脊柱”，是完整性的突出代表。通过对宋都御街—中山路进行功能调整，周边环境整治，修复保护“御街”景观视廊；通过考古工作，谋划打造展示节点，联动开封龙亭文物景区，形成展示“宋物”、体验“宋服”、品尝“宋食”、营造“宋韵”的历史文化全景沉浸体验空间，打造古城千年中轴线文旅融合地标。】 【重点示范项目15：加强开封城墙保护管理，配备专门养护队伍，做好巡查岁修。建设宋都古城环城墙保护展示带，实施开封明清城墙贯通和周边环境整治提升工程，开展大南门保护展示项目，强化城墙为代表的文化地标；实施开封城墙地下人防空间及城北粮食五库地下空间整体提升工程，支持开辟城墙根早市，展现市井文化，联动城墙周边景区，把环明清城墙文化带打造成闭环通畅、主客共享的文化、生态、商旅综合体验空间。建设北宋东京城外城（宋外城）环城生态文化公园，结合历年来城市拆迁改造、涉城墙空间腾退审批成果等，尊重现实、因地制宜，实施宋外城城墙遗址保护展示工程，采取布置展示馆、遗迹展示点、地表模拟展示、植被标识、统一标识体系等方式，构建比较完整的宋外城展示空间，形成遗址公园。结合周边景观环境整治、城市道路建设和绿化等，串联市民公共文化中心等其它文旅设施，建设城市步行廊道。实施好古城水系整治项目。】 【重点示范项目16：实施古城街区、厢坊保护复兴项目，马道街侧重对街区范围内文物建筑、历史建筑进行保护修复，改善基础设施，提升环境；增加非物质文化遗产展示展演活动，增设小型演艺剧场、研学体验馆等。书店街侧重对街区内全国重点文物保护单位山陕甘会馆，省级文物保护单位中共豫陕区委旧址、信昌银号金库旧址进行整体保护，加大活化利用力度，创新发展与历史风貌、文物建筑相适应的文化体验、旅游休闲和商业业态等。花井街重点对街区内地方历史名人贤达的故居、旧居进行修缮和利用，整治环境风貌，改善基础设施，增加现代舒适性，以文物保护、历史街区修缮与文旅产业发展推动街区内人民群众生活环境改善提升。复兴坊实施街区内文物修缮利用，尊重和保障原居民权益，留住街区老传统，融入“夜宿”“饮食”“夜娱”等业态，全面重现独属于开封古城的闲适与浪漫。】 【重点示范项目17：古城优秀非物质文化遗产和民俗传承项目，依托古城大量的历史空间，鼓励和支持富有开封本地特色的汴绣展示、朱仙镇木版年画体验、撂石锁、开封夜市文化习俗等非遗项目活态传承。】 （八）讲好中国故事，构建新时代文物展示交流传播体系 依托宋文化考古成果，加强阐释宋代历史，全面展示宋文化，不断增进文化认同和历史认同，铸牢中华民族共同体意识，讲好中华文明多元一体演进故事。打造宋都古城特色文物主题游径，依据历史事实，以不可移动文物为主体、串联其他相关文化遗产资源，挖掘阐释宋都古城多重价值。积极融入“东坡行旅”中国文物主题游径，实施北宋东京城（跟着苏轼游汴京）活化利用工程。充分发挥文物商店作为合法购销文物渠道的正确导向，规范和推动文物艺术品收藏交易市场发展。发挥好开封自贸区文化艺术品免税基地作用，实施“引进来”工程，依托移动端传播形成多渠道、立体化交流展示体系，推动对外开放和文明交流互鉴。 【重点示范项目18：邀请国内外宋代历史、考古、建筑、艺术等领域知名学者，高水平举办宋韵文化交流活动；组织拍摄宋都古城系列纪录片，鼓励拍摄各类反映宋都古城保护成果和历史风貌的小视频、小电影，利用互联网平台传播。】 【重点示范项目19：谋划“跟着东坡游汴京”主题游径，以北宋东京城遗址相关遗迹为核心，串联现存繁塔、祐国寺塔、州桥及汴河遗址、顺天门遗址、西水门遗址、御街、皇城城垣、内城城垣等，融入西园雅集行迹故事，展现苏轼在京师才华大显、官场风云、为官之治等典故，展现以苏轼为中心的北宋文人雅士，吟诗作赋、弹琴赏画、抚琴拨阮的文坛趣事。】 四、保障措施 1.加强组织领导。建立河南开封宋都古城国家文物保护利用示范区创建工作机制。坚持高位协调，研究细化河南开封宋都古城国家文物保护利用示范区创建任务分工，协调各成员单位合力推进创建工作。建立会议制度，由市委书记、市长召集，成员单位共同参与，每个月专题研究一次工作，听取建设进展情况汇报，统筹利用各部门资源，强化工作的整体性、系统性、协同性、可持续性。河南省文物局加强与开封市委、市政府的工作协同，开展对国家文物保护利用示范区的创建管理和业务指导。 2.加大支持力度。多措并举拓展古城综合性保护和建设资金来源渠道，积极争取国家发改委、国家文物局、省发改委、省文物局对示范区建设的项目支持和业务指导，统筹部署、整合资源、协同行动，集中攻克建设中的重点任务和难题。河南省文物局在示范区文物保护利用重大项目、文物科技保护、人才培养培训、安全防范等方面加大支持力度；在博物馆展览、国际交流合作等文物领域重要活动方面给予优先考虑；在国家文物保护专项资金和省级文物保护经费分配时，优先考虑示范区重点建设项目。开封市本级通过加大财政资金支持力度，保障示范区内相关项目的实施；探索包装发行文保文旅债券等方式确保示范区建设资金投入，与中原文保基金合作开展重大文物保护项目定向募捐，在健全审批和监督机制的基础上，尝试引入国有资本和社会资本开展国有文物建筑活化利用。加强资金的绩效管理和监督审计，提升资金使用效益。 3.加强队伍建设。加强文物保护机构队伍建设，强化、充实文物行政管理机构人员。成立开封市创建国家文物保护利用示范区专家咨询委员会，紧密联合国内考古、宋史研究、城市规划、文化遗产保护、数字化展示等方面专家，为示范区建设提供专业指导、技术支撑。加强开封市文化市场综合行政执法支队与文物、公安、消防、市场监管、自然资源规划、住建、应急管理等部门执法联动，切实维护文物保护管理秩序，深入开展打击文物违法犯罪专项行动，坚决遏制文物违法犯罪活动。 4.强化督促落实。加强谋划指导、专业指导、督促检查，强化建设实施方案落实的动态监测、节点管理、协调调度、进度评估。各相关单位建立历史文化资源网格化管理制度，切实履行主体责任，细化分解实施方案重点工作任务，明确时间表和路线图，积极推进各项工作。 5.有序宣传引导。将对文物保护法律法规、习近平总书记关于文物工作的重要论述和批示指示精神、国家文物保护利用示范区创建等学习纳入市委党校干部教育教学内容；利用城市公共文化空间举办国家文物保护利用示范区创建宣讲，形成全社会理解、支持、参与宋都古城国家文物保护利用示范区创建的社会氛围。进一步加大对各级文物保护单位保护范围和建设控制地带保护要求的宣传力度，做到相关单位自觉遵守，全社会共同维护。建立、完善社会力量参与文物保护利用的工作机制，引导更多热爱文物事业、有专业能力的社团组织、个人参与示范区建设。 【下载DOC】 【关闭窗口】 点击查看 文件下载 相关信息 政府信息公开指南 政府信息公开制度 法定主动公开内容 政府信息公开年报 依申请公开 给市长写信 我要咨询 中央人民政府门户网站 河南省人民政府网站 省内各市政府网站 市政府部门 县(区)政府 主办单位：开封市人民政府办公室 协办单位：开封日报社 豫ICP备14019204号 豫公网安备41021102000181号 政府网站标识码：4102000008 地址：开封市晋安路158号 邮编：475004\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:05:28.698Z"},{"slug":"policy-20241128-a8642983","title":"中国气象局 国家文物局关于做好文物行业气象防灾减灾和第四次全国文物普查工作的通知","type":"policy","type_label":"政策","issuer":"中国气象局 国家文物局","doc_no":"气发〔2024〕119号","publish_date":"2024-11-28","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202411/content_6989761.htm","summary":"依法保护范畴。各级气象部门要按照《关于加强央属文物保护管理工作的意见》，加大对管理使用文物的保护力度，加强文物价值研究和阐释利用，重视气象文化历史传承，推进世界气象组织百年气象站申报和保护，做好《中国","themes":["文物保护","灾害防治"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中国气象局 国家文物局关于做好文物行业气象防灾减灾和第四次全国文物普查工作的通知 气发〔2024〕119号 各省（自治区、直辖市）气象局、文物局： 我国文物数量多，空间分布广，气象灾害类型多样且复杂。文物特别是不可移动文物对气象灾害较为敏感，暴雨、台风、大风、强对流、沙尘、高温、暴雪等均可能对文物保护造成不利影响。联合国教科文组织指出“气候变化已成为世界遗产面临的最重大威胁之一”，气候变化及与其相关的灾害性天气对我国文物和文化遗产保护提出了新的挑战。为深入贯彻落实习近平总书记关于文物工作和气象工作重要指示精神，强化灾害性天气预报预警和文物防灾减灾联防联动，共同做好文物行业气象防灾减灾工作，共同推进第四次全国文物普查工作，现就有关事项通知如下： 一、提高思想认识，压实防灾减灾工作责任 各级气象、文物部门要清醒认识到目前气候变化背景下文物气象防灾减灾工作所面临的严峻形势和挑战要求，进一步增强责任感、紧迫感，坚持底线思维和极限思维，牢固树立安全意识、风险意识和责任意识，强化抓安全抓防范的政治自觉、思想自觉、行动自觉。要超前部署、提前研判，细化监测预警、指挥调度、巡查防守、抢险救援各环节具体任务，责任落实到岗到人，确保文物气象防灾减灾工作抓紧抓细抓实。 二、畅通信息共享，加强天气预警互动联动 各省级气象部门要加强与文物部门的沟通对接，了解文物行业气象灾害防范整体需求，及时向当地文物部门通报有关气象灾害监测预报预警信息。技术条件成熟省份的气象和文物部门应加强信息和数据共享，结合地方气象灾害风险普查成果、文物分布情况和历史灾情，分析研判各级各类对文物有较大影响的气象灾害类别和风险阈值，探索推进国家级和省级文物气象灾害风险图绘制和区划划定，联合开展文物气象风险预报预警业务。各级气象部门可商文物部门将文物管理使用单位纳入当地气象灾害预警信息发布对象库，联合制定发布策略，逐步提高气象灾害预警的精准性。 三、完善应急预案，建立部门沟通合作机制 各级气象、文物部门要将文物行业气象防灾减灾纳入地方气象防灾减灾体系，积极考虑在世界文化遗产地、全国重点文物保护单位设置气象监测点位，推动建立以气象灾害预警为先导的应急联动机制，文物部门应组织重点防御单位制定气象灾害应急预案，气象部门应予以技术支持和指导。省级气象部门和文物部门要建立常态化沟通合作机制，定期组织会商。省级气象部门要做好面向文物部门的重大气象灾害过程气象保障服务，及时通报监测实况，做好防范提醒。各级气象、文物部门应适时组织联合应急演练，举办专题培训，对负责文物保护相关人员开展气象防灾减灾知识培训。各级文物部门可联合气象部门共同组织开展汛期检查和安全隐患排查，通过检查制度落实、应对策略、物资准备等情况，提高气象灾害防御能力。 四、做好气象部门文物普查工作 各级气象部门要积极配合同级文物行政部门，及时提供气象部门管理的文物资源信息和新发现文物线索清单，为普查队员现场调查等工作提供便利条件。各级文物行政部门对气象部门管理的不可移动文物进行全面复查，对气象部门提供的线索开展实地调查，符合文物认定标准的依法认定、登记和公布，纳入依法保护范畴。各级气象部门要按照《关于加强央属文物保护管理工作的意见》，加大对管理使用文物的保护力度，加强文物价值研究和阐释利用，重视气象文化历史传承，推进世界气象组织百年气象站申报和保护，做好《中国气象史》编撰工作，增强气象历史文化遗产系统性保护意识和保护氛围。 特此通知。 中国气象局 国家文物局 2024年11月20日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.285Z"},{"slug":"policy-20241124-717f48ab","title":"国家文物局关于印发《石窟寺开放管理导则（试行）》的通知","type":"policy","type_label":"政策","issuer":"国家文物局","doc_no":"文物保发〔2024〕58号","publish_date":"2024-11-24","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202411/content_6989128.htm","summary":"工作要求，深入挖掘和阐释石窟寺的历史内涵、文化价值、现实意义，落实意识形态工作责任制，保护传承弘扬中华优秀传统文化，避免过度商业化、娱乐化。 第四条 责任主体。石窟寺计划开放的，其所在地县级及以上地方","themes":["文物保护","文物开放"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国家文物局关于印发《石窟寺开放管理导则（试行）》的通知 文物保发〔2024〕58号 各有关省（自治区、直辖市）文物局（文化和旅游厅/局）、新疆生产建设兵团文物局： 为贯彻落实《国务院办公厅关于加强石窟寺保护利用工作的指导意见》，指导石窟寺开放管理并规范石窟寺旅游开发活动，我局编制完成《石窟寺开放管理导则（试行）》，现印发给你们，请遵照执行。 特此通知。 国家文物局 2024年11月14日 石窟寺开放管理导则（试行） 第一条 目的依据。为贯彻落实《国务院办公厅关于加强石窟寺保护利用工作的指导意见》（国办发〔2020〕41号），深化石窟寺价值研究阐释，指导石窟寺开放管理工作，规范石窟寺旅游开发活动，根据相关法律法规和政策文件制定本导则。 第二条 适用范围。本导则所称“石窟寺”是指已依法核定公布为文物保护单位或已登记尚未核定公布为文物保护单位的不可移动文物的石窟和摩崖造像（以下简称“石窟寺”）。 本导则所称“开放”是指依照《中华人民共和国文物保护法》规定辟为参观游览场所，包括但不限于各级各类景区。 第三条 总体要求。石窟寺开放应当坚持保护第一、加强管理、挖掘价值、有效利用、让文物活起来的工作要求，深入挖掘和阐释石窟寺的历史内涵、文化价值、现实意义，落实意识形态工作责任制，保护传承弘扬中华优秀传统文化，避免过度商业化、娱乐化。 第四条 责任主体。石窟寺计划开放的，其所在地县级及以上地方人民政府应当明确保护管理机构，提供相应的必要保障，切实加强保护能力建设，使保护管理工作力量与其承担的职责和任务相适应，确保石窟寺安全。 石窟寺保护管理机构是石窟寺开放管理的直接责任单位，具体负责石窟寺开放各项准备工作，履行开放管理、应急管理、日常保养维护、安全巡查、监测反馈等各项工作职能。 地方各级文物行政部门负责监督、检查、指导石窟寺开放管理工作。 第五条 禁止行为。石窟寺不得转让、抵押，不得将石窟寺作为或者变相作为企业资产经营，不得将石窟寺保护管理机构作为企业的下属机构或者交由企业管理。 石窟寺开放应当按照有关法律法规的规定不新设宗教活动场所，不组织、举行宗教活动，不接受宗教性捐赠；对民众自发开展的封建迷信等活动，石窟寺保护管理机构应当予以及时劝阻和制止。 石窟寺开放区域内已依法设立登记的宗教活动场所，应当严格遵守《文物保护法》及其实施条例、《宗教事务条例》等法律法规的规定。 第六条 必要条件。石窟寺开放应当具备下列基本条件： （一）文物本体无重大险情，文物周边环境无重大安全隐患； （二）文物本体构成清晰、历史内涵准确、文化价值突出； （三）有具有独立法人资格的专门保护管理机构，有满足研究、解说、管理需求的专业人员； （四）有醒目、清晰的文物保护标志说明； （五）有规范、齐全的文物记录档案； （六）有齐全的日常保养维护制度，并有专人落实； （七）有与开放相适应的保护、安防、消防、展示、导览、道路、游客集散服务等开放配套服务和辅助设施； （八）有必要的人员、文物等安全防护设施及制度，经过安全风险评估，满足安全条件； （九）有必要的环境保护设施和生态保护措施。 以上基本条件，有法律法规具体规定、国家标准规范、行业标准规范或者行业规范性要求的，应当符合其规定；涉及价值评估、阐释的，应当充分听取多学科专家的意见。 第七条 准备工作。石窟寺开放应当事先按照本导则第六条所列各项基本条件开展可行性评估，确认具备开放基本条件后，尚应做好以下准备工作并对外公告： （一）明确界定开放区域，合理确定开放时间； （二）科学核定游客承载量和最大瞬时流量，并制定流量控制方案、应急预案； （三）科学设置开放路线，合理设立游览导向系统； （四）组织开展讲解员专业培训和讲解词专业论证，确定讲解方式和手段； （五）确定门票、讲解费等收费项目，依法举行听证会；明确经营收入用于文物保护的比例； （六）制定并签订石窟寺开放责任书，明晰权责； （七）加强应急能力建设，充分考虑可能发生的自然和人为损害，配备救援及应急物资，并定期进行应急演练； （八）改善石窟寺外部交通，增强可达性； （九）研究阐释石窟寺的历史内涵、文化价值和现实意义，形成科学、准确的研究成果； （十）宣传石窟寺及其承载的中华优秀传统文化，增进当地民众的文化认同。 第八条 建设活动。因石窟寺开放需要，在石窟寺保护范围或者建设控制地带内开展建设活动的，应当按照《中华人民共和国文物保护法》相关规定履行相应的审批手续。石窟寺展示应当以确保文物本体安全为前提，不得建设污染石窟寺及其环境的设施，不得进行可能影响文物保护单位安全及其环境的活动。 第九条 开放管理。鼓励采用限时限流、定制服务等方式引导参观活动，确保参观人数不突破最大瞬时流量。 列入《世界遗产名录》或者核定公布为全国重点文物保护单位的石窟寺，应当全面推广预约参观制。 鼓励有条件的石窟寺采取建设开放数字展厅、博物馆、陈列馆，提供智能导览服务、“云展览”服务，组织开展专家讲座、研学研修等，丰富石窟寺开放内容，提升石窟寺开放体验。 石窟寺开放应当尽可能创造条件提供除参观游览以外的问询、引导、安保、环卫、交通、停车、通信、寄存、医疗、文创销售和老弱病残孕服务，以及适当的餐饮、休憩服务。鼓励石窟寺扩大衍生服务，采取多种方式促进所在地民众增加收入。 第十条 应急管理。石窟寺应当在自然灾害、事故灾难、公共卫生事件和社会安全事件等突发事件发生时严格执行已制定的应急预案。 参观人数可能达到单日最大承载量时，石窟寺保护管理机构应当提前公告并同时向当地人民政府报告，石窟寺保护管理机构和当地人民政府应当及时采取疏导、分流等措施。 第十一条 日常保养。石窟寺应当加强日常养护。石窟寺保存环境监测指标超出安全阈值，或者文物本体、载体及赋存环境出现重大安全隐患的，应当局部或者全部暂停开放。 第十二条 安全巡查。石窟寺应当加强安全巡查，及时发现重大安全风险和隐患。 暂不具备开放条件的石窟寺，应当由石窟寺所在地县级以上地方人民政府及时向社会公告。 第十三条 监测反馈。石窟寺开放应当建立智慧监测平台，对人员、文物本体及其赋存环境进行监测。监测数据应当及时整理、研究，用于管理提升和保护修缮。 石窟寺开放应当建立游客监督、意见反馈、投诉受理、舆情监测机制，根据意见反馈情况，适时、适当调整开放方案，采取积极、有效措施改善服务质量，提升石窟寺开放效果和游客满意度。 附件：石窟寺开放参考流程\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.301Z"},{"slug":"regulation-20241023-061ceb25","title":"城市公共交通条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第793号","publish_date":"2024-10-23","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202410/content_6982322.htm","summary":"中华人民共和国国务院令  第793号 《城市公共交通条例》已经2024年8月19日国务院第39次常务会议通过，现予公布，自2024年12月1日起施行。 总理　　李强　　　　　　　　 2024年10月","themes":["城市交通","城市更新"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第793号 《城市公共交通条例》已经2024年8月19日国务院第39次常务会议通过，现予公布，自2024年12月1日起施行。 总理 李强 2024年10月17日 城市公共交通条例 第一章 总 则 第一条 为了推动城市公共交通高质量发展，提升城市公共交通服务水平，保障城市公共交通安全，更好满足公众基本出行需求，促进城市现代化建设，制定本条例。 第二条 本条例所称城市公共交通，是指在城市人民政府确定的区域内，利用公共汽电车、城市轨道交通车辆等公共交通工具和有关系统、设施，按照核定的线路、站点、时间、票价等运营，为公众提供基本出行服务。 第三条 国家实施城市公共交通优先发展战略，综合采取规划、土地、财政、金融等方面措施，保障城市公共交通发展，增强城市公共交通竞争力和吸引力。 国家鼓励、引导公众优先选择公共交通作为机动化出行方式。 第四条 城市公共交通工作应当坚持中国共产党的领导，坚持以人民为中心，坚持城市公共交通公益属性，落实城市公共交通优先发展战略，构建安全、便捷、高效、绿色、经济的城市公共交通体系。 第五条 城市人民政府是发展城市公共交通的责任主体。 城市人民政府应当加强对城市公共交通工作的组织领导，落实城市公共交通发展保障措施，强化对城市公共交通安全的监督管理，统筹研究和协调解决城市公共交通工作中的重大问题。 国务院城市公共交通主管部门及其他有关部门和省、自治区人民政府应当加强对城市公共交通工作的指导。 第六条 城市人民政府应当根据城市功能定位、规模、空间布局、发展目标、公众出行需求等实际情况和特点，与城市土地和空间使用相协调，统筹各种交通方式，科学确定城市公共交通发展目标和发展模式，推动提升城市公共交通在机动化出行中的分担比例。 第七条 承担城市公共交通运营服务的企业（以下简称城市公共交通企业）由城市人民政府或者其城市公共交通主管部门依法确定。 第八条 国家鼓励和支持新技术、新能源、新装备在城市公共交通系统中的推广应用，提高城市公共交通信息化、智能化水平，推动城市公共交通绿色低碳转型，提升运营效率和管理水平。 第二章 发展保障 第九条 城市综合交通体系规划应当明确公共交通优先发展原则，统筹城市交通基础设施建设，合理配置和利用各种交通资源，强化各种交通方式的衔接协调。城市人民政府根据实际情况和需要组织编制城市公共交通规划。 建设城市轨道交通系统的城市应当按照国家有关规定编制城市轨道交通线网规划和建设规划。 城市综合交通体系规划、城市公共交通规划、城市轨道交通线网规划和建设规划应当与国土空间规划相衔接，将涉及土地和空间使用的合理需求纳入国土空间规划实施监督系统统筹保障。 第十条 城市人民政府有关部门应当根据相关规划以及城市发展和公众出行需求情况，合理确定城市公共交通线路，布局公共交通场站等设施，提高公共交通覆盖率。 城市人民政府应当组织有关部门开展公众出行调查，作为优化城市公共交通线路和场站布局的依据。 第十一条 新建、改建、扩建居住区、交通枢纽、学校、医院、体育场馆、商业中心等大型建设项目，应当统筹考虑公共交通出行需求；建设项目批准、核准文件要求配套建设城市公共交通基础设施的，建设单位应当按照要求建设相关设施并同步投入使用。 第十二条 城市人民政府应当依法保障城市公共交通基础设施用地。城市公共交通基础设施用地符合规定条件的，可以以划拨、协议出让等方式供给。 在符合国土空间规划和用途管制要求且不影响城市公共交通功能和规模的前提下，对城市公共交通基础设施用地可以按照国家有关规定实施综合开发，支持城市公共交通发展。 第十三条 城市人民政府应当根据城市公共交通实际和财政承受能力安排城市公共交通发展所需经费，并纳入本级预算。 国家鼓励、引导金融机构提供与城市公共交通发展相适应的金融服务，加大对城市公共交通发展的融资支持力度。 国家鼓励和支持社会资本依法参与城市公共交通基础设施建设运营，保障其合法权益。 第十四条 城市公共交通票价依法实行政府定价或者政府指导价，并建立动态调整机制。鼓励根据城市公共交通服务质量、运输距离以及换乘方式等因素，建立多层次、差别化的城市公共交通票价体系。 制定、调整城市公共交通票价，应当统筹考虑企业运营成本、社会承受能力、交通供求状况等因素，并依法履行定价成本监审等程序。 第十五条 城市公共交通企业在保障公众基本出行的前提下，可以开展定制化出行服务业务。定制化出行服务业务可以实行市场调节价。 第十六条 城市人民政府应当组织有关部门，在对城市公共交通企业开展运营服务质量评价和成本费用年度核算报告审核的基础上，综合考虑财政承受能力、企业增收节支空间等因素，按照规定及时给予补贴补偿。 第十七条 城市人民政府可以根据实际情况和需要，按照统筹公共交通效率和整体交通效率、集约利用城市道路资源的原则，设置公共交通专用车道，并实行科学管理和动态调整。 第三章 运营服务 第十八条 城市人民政府城市公共交通主管部门应当通过与城市公共交通企业签订运营服务协议等方式，明确城市公共交通运营有关服务标准、规范、要求以及运营服务质量评价等事项。 城市公共交通企业应当遵守城市公共交通运营有关服务标准、规范、要求等，加强企业内部管理，不断提高运营服务质量和效率。 城市公共交通企业不得将其运营的城市公共交通线路转让、出租或者变相转让、出租给他人运营。 第十九条 城市公共交通企业应当按照运营服务协议或者城市人民政府城市公共交通主管部门的要求配备城市公共交通车辆，并按照规定设置车辆运营服务标识。 第二十条 城市公共交通企业应当通过便于公众知晓的方式，及时公开运营线路、停靠站点、运营时间、发车间隔、票价等信息。鼓励城市公共交通企业通过电子站牌、出行信息服务系统等信息化手段为公众提供信息查询服务。 第二十一条 城市公共交通企业应当加强运营调度管理，在保障安全的前提下提高运行准点率和运行效率。 第二十二条 城市公共交通企业不得擅自变更运营线路、停靠站点、运营时间或者中断运营服务；因特殊原因需要临时变更运营线路、停靠站点、运营时间或者暂时中断运营服务的，除发生突发事件或者为保障运营安全等采取紧急措施外，应当提前向社会公告，并向城市人民政府城市公共交通主管部门报告。 第二十三条 因大型群众性活动等情形出现公共交通客流集中、正常运营服务安排难以满足需求的，城市公共交通企业应当按照城市人民政府城市公共交通主管部门的要求，及时采取增开临时班次、缩短发车间隔、延长运营时间等措施，保障运营服务。 第二十四条 乘客应当按照票价支付票款；对拒不支付票款的，城市公共交通企业可以拒绝其进站乘车。 城市公共交通企业应当依照法律、法规和国家有关规定，对相关群体乘坐公共交通工具提供便利和优待。 第二十五条 城市公共交通企业应当建立运营服务质量投诉处理机制并向社会公布，及时妥善处理乘客提出的投诉，并向乘客反馈处理结果；乘客对处理结果不满意的，可以向城市人民政府城市公共交通主管部门申诉，城市人民政府城市公共交通主管部门应当及时作出答复。乘客也可以直接就运营服务质量问题向城市人民政府城市公共交通主管部门投诉。 第二十六条 城市人民政府城市公共交通主管部门应当定期组织开展城市公共交通企业运营服务质量评价，并将评价结果向社会公布。 第二十七条 未经城市人民政府同意，城市公共交通企业不得终止运营服务；因破产、解散终止运营服务的，应当提前30日向城市人民政府城市公共交通主管部门报告，城市人民政府城市公共交通主管部门应当及时采取指定临时运营服务企业、调配运营车辆等措施，确保运营服务不中断；需要重新确定承担城市公共交通运营服务企业的，城市人民政府或者其城市公共交通主管部门应当按照规定及时确定。 第四章 安全管理 第二十八条 城市公共交通企业应当遵守有关安全生产的法律、法规和标准，落实全员安全生产责任，建立健全安全生产管理制度和安全生产责任制，保障安全经费投入，构建安全风险分级管控和隐患排查治理双重预防机制，增强突发事件防范和应急能力。 第二十九条 城市公共交通建设工程的勘察、设计、施工、监理应当遵守有关建设工程管理的法律、法规和标准。 城市公共交通建设工程涉及公共安全的设施应当与主体工程同步规划、同步建设、同步投入使用。 第三十条 城市公共交通企业投入运营的车辆应当依法经检验合格，并按照国家有关标准配备灭火器、安全锤以及安全隔离、紧急报警、车门紧急开启等安全设备，设置明显的安全警示标志。 城市公共交通企业应当按照国家有关标准对车辆和有关系统、设施设备进行维护、保养，确保性能良好和安全运行。 利用城市公共交通车辆或者设施设备设置广告的，应当遵守有关广告管理的法律、法规，不得影响城市公共交通运营安全。 第三十一条 城市公共交通企业直接涉及运营安全的驾驶员、乘务员、调度员、值班员、信号工、通信工等重点岗位人员（以下统称重点岗位人员），应当符合下列条件： （一）具有履行岗位职责的能力； （二）无可能危及运营安全的疾病； （三）无暴力犯罪和吸毒行为记录； （四）国务院城市公共交通主管部门规定的其他条件。 除符合前款规定条件外，城市公共汽电车驾驶员还应当取得相应准驾车型机动车驾驶证，城市轨道交通列车驾驶员还应当按照国家有关规定取得相应职业准入资格。 第三十二条 城市公共交通企业应当定期对重点岗位人员进行岗位职责、操作规程、服务规范、安全防范和应急处置基本知识等方面的培训和考核，经考核合格的方可上岗作业。培训和考核情况应当建档备查。 城市公共交通企业应当关注重点岗位人员的身体、心理状况和行为习惯，对重点岗位人员定期组织体检，加强心理疏导，及时采取有效措施防范重点岗位人员身体、心理状况或者行为异常导致运营安全事故发生。 城市公共交通企业应当合理安排驾驶员工作时间，防止疲劳驾驶。 第三十三条 城市公共交通企业应当依照有关法律、法规的规定，落实对相关人员进行安全背景审查、配备安保人员和相应设施设备等安全防范责任。 第三十四条 城市公共交通企业应当加强对客流状况的日常监测；出现或者可能出现客流大量积压时，应当及时采取疏导措施，必要时可以采取临时限制客流或者临时封站等措施，确保运营安全。 因突发事件或者设施设备故障等原因危及运营安全的，城市公共交通企业可以暂停部分区段或者全线网运营服务，并做好乘客疏导和现场秩序维护等工作。乘客应当按照城市公共交通企业工作人员的指挥和引导有序疏散。 第三十五条 乘客应当遵守乘车规范，维护乘车秩序。 乘客不得携带易燃、易爆、毒害性、放射性、腐蚀性以及其他可能危及人身和财产安全的危险物品进站乘车；乘客坚持携带的，城市公共交通企业应当拒绝其进站乘车。 城市轨道交通运营单位应当按照国家有关规定，对进入城市轨道交通车站的人员及其携带物品进行安全检查；对拒不接受安全检查的，应当拒绝其进站乘车。安全检查应当遵守有关操作规范，提高质量和效率。 第三十六条 任何单位和个人不得实施下列危害城市公共交通运营安全的行为： （一）非法拦截或者强行上下城市公共交通车辆； （二）非法占用城市公共交通场站或者出入口； （三）擅自进入城市轨道交通线路、车辆基地、控制中心、列车驾驶室或者其他禁止非工作人员进入的区域； （四）向城市公共交通车辆投掷物品或者在城市轨道交通线路上放置障碍物； （五）故意损坏或者擅自移动、遮挡城市公共交通站牌、安全警示标志、监控设备、安全防护设备； （六）在非紧急状态下擅自操作有安全警示标志的安全设备； （七）干扰、阻碍城市公共交通车辆驾驶员安全驾驶； （八）其他危害城市公共交通运营安全的行为。 城市公共交通企业发现前款规定行为的，应当及时予以制止，并采取措施消除安全隐患，必要时报请有关部门依法处理。 第三十七条 城市人民政府有关部门应当按照职责分工，加强对城市公共交通运营安全的监督管理，建立城市公共交通运营安全工作协作机制。 第三十八条 城市人民政府城市公共交通主管部门应当会同有关部门制定城市公共交通应急预案，报城市人民政府批准。 城市公共交通企业应当根据城市公共交通应急预案，制定本单位应急预案，报城市人民政府城市公共交通主管部门、应急管理部门备案，并定期组织演练。 城市人民政府应当加强城市公共交通应急能力建设，组织有关部门、城市公共交通企业和其他有关单位联合开展城市公共交通应急处置演练，提高突发事件应急处置能力。 第三十九条 城市人民政府应当健全有关部门与城市公共交通企业之间的信息共享机制。城市人民政府城市公共交通主管部门、城市公共交通企业应当加强与有关部门的沟通，及时掌握气象、自然灾害、公共安全等方面可能影响城市公共交通运营安全的信息，并采取有针对性的安全防范措施。有关部门应当予以支持、配合。 第四十条 城市人民政府应当将城市轨道交通纳入城市防灾减灾规划，完善城市轨道交通防范水淹、火灾、冰雪、雷击、风暴等设计和论证，提高城市轨道交通灾害防范应对能力。 第四十一条 城市轨道交通建设单位组织编制城市轨道交通建设工程可行性研究报告和初步设计文件，应当落实国家有关公共安全和运营服务的要求。 第四十二条 城市轨道交通建设工程项目依法经验收合格后，城市人民政府城市公共交通主管部门应当组织开展运营前安全评估，通过安全评估的方可投入运营。城市轨道交通建设单位和运营单位应当按照国家有关规定办理建设和运营交接手续。 城市轨道交通建设工程项目验收以及建设和运营交接的管理办法由国务院住房城乡建设主管部门会同国务院城市公共交通主管部门制定。 第四十三条 城市人民政府应当组织有关部门划定城市轨道交通线路安全保护区，制定安全保护区管理制度。 在城市轨道交通线路安全保护区内进行作业的，应当征得城市轨道交通运营单位同意。作业单位应当制定和落实安全防护方案，并在作业过程中对作业影响区域进行动态监测，及时发现并消除安全隐患。城市轨道交通运营单位可以进入作业现场进行巡查，发现作业危及或者可能危及城市轨道交通运营安全的，应当要求作业单位采取措施消除安全隐患或者停止作业。 第四十四条 城市人民政府城市公共交通主管部门应当定期组织开展城市轨道交通运营安全第三方评估，督促运营单位及时发现并消除安全隐患。 第五章 法律责任 第四十五条 城市公共交通企业以外的单位或者个人擅自从事城市公共交通线路运营的，由城市人民政府城市公共交通主管部门责令停止运营，没收违法所得，并处违法所得1倍以上5倍以下的罚款；没有违法所得或者违法所得不足1万元的，处1万元以上5万元以下的罚款。 城市公共交通企业将其运营的城市公共交通线路转让、出租或者变相转让、出租给他人运营的，由城市人民政府城市公共交通主管部门责令改正，并依照前款规定处罚。 第四十六条 城市公共交通企业有下列行为之一的，由城市人民政府城市公共交通主管部门责令改正；拒不改正的，处1万元以上5万元以下的罚款： （一）未遵守城市公共交通运营有关服务标准、规范、要求； （二）未按照规定配备城市公共交通车辆或者设置车辆运营服务标识； （三）未公开运营线路、停靠站点、运营时间、发车间隔、票价等信息。 第四十七条 城市公共交通企业擅自变更运营线路、停靠站点、运营时间的，由城市人民政府城市公共交通主管部门责令改正；拒不改正的，处1万元以上5万元以下的罚款。 城市公共交通企业擅自中断运营服务的，由城市人民政府城市公共交通主管部门责令改正；拒不改正的，处5万元以上20万元以下的罚款。 城市公共交通企业因特殊原因变更运营线路、停靠站点、运营时间或者暂时中断运营服务，未按照规定向社会公告并向城市人民政府城市公共交通主管部门报告的，由城市人民政府城市公共交通主管部门责令改正，可以处1万元以下的罚款。 第四十八条 城市公共交通企业违反本条例规定，未经城市人民政府同意终止运营服务的，由城市人民政府城市公共交通主管部门责令改正；拒不改正的，处10万元以上50万元以下的罚款。 第四十九条 城市公共交通企业有下列行为之一的，由城市人民政府城市公共交通主管部门责令改正，可以处5万元以下的罚款，有违法所得的，没收违法所得；拒不改正的，处5万元以上20万元以下的罚款： （一）利用城市公共交通车辆或者设施设备设置广告，影响城市公共交通运营安全； （二）重点岗位人员不符合规定条件或者未按照规定对重点岗位人员进行培训和考核，或者安排考核不合格的重点岗位人员上岗作业。 第五十条 在城市轨道交通线路安全保护区内进行作业的单位有下列行为之一的，由城市人民政府城市公共交通主管部门责令改正，暂时停止作业，可以处5万元以下的罚款；拒不改正的，责令停止作业，并处5万元以上20万元以下的罚款；造成城市轨道交通设施损坏或者影响运营安全的，并处20万元以上100万元以下的罚款： （一）未征得城市轨道交通运营单位同意进行作业； （二）未制定和落实安全防护方案； （三）未在作业过程中对作业影响区域进行动态监测或者未及时消除发现的安全隐患。 第五十一条 城市人民政府及其城市公共交通主管部门、其他有关部门的工作人员在城市公共交通工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分。 第五十二条 违反本条例规定，构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第六章 附 则 第五十三条 用于公共交通服务的城市轮渡，参照本条例的有关规定执行。 第五十四条 城市人民政府根据城乡融合和区域协调发展需要，统筹推进城乡之间、区域之间公共交通一体化发展。 第五十五条 本条例自2024年12月1日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.319Z"},{"slug":"policy-20240925-d1473ff8","title":"关于以高水平保护促进中部地区加快崛起的实施意见","type":"policy","type_label":"政策","issuer":"生态环境部","doc_no":"环综合〔2024〕64号","publish_date":"2024-09-25","effective_date":"","status":"现行有效","level":"国家级","region":"中部地区","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202409/content_6976350.htm","summary":"效能。指导中部地区开展建设项目环评审批改革试点，推动优化环评分级分类管理。 （三）提升产业绿色低碳发展水平。支持中部地区大规模设备更新和消费品以旧换新，加快钢铁、水泥、焦化等行业超低排放改造，促进","themes":["生态保护"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>关于以高水平保护促进中部地区加快崛起的实施意见 环综合〔2024〕64号 山西省、安徽省、江西省、河南省、湖北省、湖南省生态环境厅： 为深入贯彻习近平总书记在新时代推动中部地区崛起座谈会上的重要讲话精神，全面落实党中央、国务院决策部署，协同推进生态环境保护和绿色低碳发展，高水平建设美丽中部，促进中部地区在更高起点上加快崛起，现提出以下实施意见。 一、总体要求 中部地区在全国高质量发展大局中地位和作用举足轻重，新形势下加强中部地区生态环境保护意义重大。党的十八大以来，中部地区经济社会加快发展，生态环境质量持续改善，区域协调发展站在了新的更高起点上。同时要看到，与新征程中部地区加快崛起的战略目标定位相比，与人民群众生态环境新期盼相比，区域污染防治攻坚呈现新的阶段特征，存量型、增量型生态环境压力叠加，亟需更好统筹经济高质量发展和生态环境高水平保护。 以高水平保护促进中部地区加快崛起，要坚持以习近平新时代中国特色社会主义思想特别是习近平生态文明思想为指导，深入贯彻党的二十大和二十届二中、三中全会精神，全面贯彻习近平总书记关于中部地区崛起重要讲话、重要指示批示精神，完整、准确、全面贯彻新发展理念，加快构建新发展格局，着力推动高质量发展，牢牢把握中部地区在维护国家粮食安全、能源资源安全、产业安全和生态安全中的战略地位，支持区域加快绿色低碳转型发展，持续深入打好污染防治攻坚战，切实维护生态环境安全，着力深化生态环境保护体制机制改革，加快推进生态环境治理体系和治理能力现代化，更大力度建设美丽中部，以高品质生态环境支撑中部地区加快崛起。 二、加快推动绿色低碳转型发展 （一）实施生态环境分区管控。支持中部地区持续完善全域覆盖、精准管控的生态环境分区管控体系并做好实施应用，加强规划环评，合理布局重大产业、基础设施等项目，因地制宜引导产业转移和转型升级，提升能源资源保障和产业支撑能力，坚决遏制高耗能、高排放、低水平项目盲目发展。支持推进区域工业化、城镇化协调发展，支持建设长江中游、中原等城市群和武汉、长株潭、郑州、合肥等都市圈，指导建成一批各具特色的美丽城市。 （二）服务保障重大项目建设。依托环评审批“三本台账”和绿色通道机制，对中部地区重大科技基础设施、重大水利基础设施、重大战略新兴产业、现代化交通基础设施等建设项目，提前介入、加强指导，对符合生态环境保护要求的，开辟绿色通道，提高审批效能。指导中部地区开展建设项目环评审批改革试点，推动优化环评分级分类管理。 （三）提升产业绿色低碳发展水平。支持中部地区大规模设备更新和消费品以旧换新，加快钢铁、水泥、焦化等行业超低排放改造，促进传统产业转型升级。高水平建设一批循环产业园、生态工业园，支持规范开展废旧电子设备拆解利用。开展城市和产业园区减污降碳协同创新试点，实施一批减污降碳协同治理工程。指导中部地区落实碳强度控制目标要求，开展低碳城市、气候适应型城市建设，支持湖北建设全国碳排放权注册登记机构。 三、持续深化大气污染治理 （四）强化大气污染联防联控。深化汾渭平原大气污染联防联控，推进苏皖鲁豫交界区域、长江中游城市群传输通道大气污染防治协作。在预测到将发生跨区域重污染天气过程时，指导中部地区落实应急联动要求，视情采取统一预警、统一调度、统一执法等措施，统筹预警启动、响应和解除，最大限度减少重污染天气。加强中部地区空气质量预测预报能力建设，提高预测预报水平。 （五）加强重点领域大气污染防治。支持开展重点行业绩效创建工作试点。严格合理控制煤炭消费总量，持续推进山西、河南清洁取暖。全面开展中小型传统制造企业集群升级改造。强化挥发性有机物综合治理，加快推进源头替代。充分发挥长江黄金水道和综合交通枢纽作用，提升大宗货物清洁化运输水平，大力发展多式联运，促进“公转铁”“公转水”。支持山西打造清洁运输先行引领区，提高煤炭跨省及省内中长距离铁路运输占比。支持河南开展大气氨排放控制试点。 四、加强水生态环境保护修复 （六）加强大江大河和重要湖泊保护治理。统筹水资源、水环境、水生态，推动长江、黄河、淮河等大江大河和鄱阳湖、洞庭湖、巢湖、洪湖等重要湖泊环境综合治理，着力改善大江大河和重要湖泊生态环境面貌。开展长江流域水生态考核试点，保障黄河流域河湖生态用水。加强长江、洞庭湖、鄱阳湖总磷污染控制，协同推进黄河流域山西段、河南段总氮污染控制。推进入河排污口查测溯治管，着力提升信息化管理水平。 （七）保障饮用水水源水质安全。以县级及以上城市集中式饮用水水源地为重点，加强水源地规范化建设。推动开展城市不达标水源地治理，防范地下水型水源地水质污染。稳步推进乡镇级集中式饮用水水源保护区划定、立标、环境问题整治。深入推进水源区生态环境系统治理，有效保障丹江口水库及南水北调中线工程水质安全。 （八）推进城市黑臭水体治理。开展城市黑臭水体整治环境保护行动，指导督促中部地区巩固提升地级及以上城市黑臭水体治理成效，全面开展县级城市黑臭水体治理，稳步推进县城黑臭水体排查整治。推动补齐城市污水收集处理设施短板，加快解决设施建设滞后、处理能力不足、管网错接混接漏接、老旧破损等突出问题。 五、加大土壤和农业农村污染治理力度 （九）加强土壤污染源头防控。持续实施农用地土壤镉等重金属污染源头防治行动，分阶段推进农用地土壤重金属污染溯源和整治全覆盖。完善建设用地用途变更和污染地块风险管控联动监管机制，支持推动安徽、江西、湖北、湖南长江沿岸化工腾退地块土壤污染治理。强化老工业基地和工业聚集区大型污染场地风险管控和修复。有序推进在产企业和化工园区土壤及地下水污染管控修复试点。 （十）深化农业农村污染治理。推广“千万工程”经验，指导建设一批美丽乡村示范县。加快治理农村黑臭水体，推动解决房前屋后环境问题。聚焦水体氮磷等污染问题突出区域，督促指导加强农业面源污染系统治理，推动畜禽养殖、水产养殖污染防治和秸秆资源化利用。推动构建农膜、农药包装回收体系。 六、加强固体废物和危险废物治理 （十一）持续深化“无废城市”建设。支持安徽、江西、河南、湖北、湖南有序推进全域“无废城市”建设，推进固体废物源头减量，提升资源化利用水平。支持加快推进尾矿、磷石膏、粉煤灰、煤矸石、冶炼废渣等大宗工业固废利用处置设施建设和综合治理技术研究，推动回填充填、生态修复、建材生产及用作路基材料等规模化利用。 （十二）强化危险废物环境管理。支持开展华中区域危险废物环境风险防控技术中心和区域特殊危险废物集中处置中心建设。支持湘西、大别山区等边远基层地区探索建立医疗废物就近就地处置新模式。推动加强危险废物联防联治，探索建立危险废物跨省转移“白名单”和“点对点”定向利用合作机制，严厉打击危险废物非法倾倒等违法犯罪活动。 （十三）加强尾矿库、重金属和历史遗留矿山综合治理。支持山西、江西、河南、湖南等省份开展尾矿库污染隐患排查治理，深化实施分类分级环境监管。督促指导安徽、江西、河南、湖南等省份加强重点区域、重点行业重金属污染防控，有效减少重金属排放总量，扎实推进湖南省花垣县锰污染治理。支持推动长江流域、黄河流域历史遗留矿山生态环境综合治理，加快整治尾矿库、丹江口库区上游历史遗留重金属污染等环境风险隐患。 七、维护区域生态环境安全 （十四）建立生态保护修复统一监管体系。定期开展自然保护地、生态保护红线人为活动遥感监测，持续开展“绿盾”重要生态空间强化监督，及时查处违法违规问题。开展中部地区山水林田湖草沙一体化保护和修复工程实施、国家级自然保护区、生态保护红线生态环境保护成效评估。指导中部地区推进太行山、大别山等生物多样性保护优先区调查、观测与评估，共建生物多样性保护网络体系。 （十五）提升生态安全保障水平。推动将中部地区纳入国家生态安全风险监测预警体系。深入分析气候变化影响，提高区域适应气候变化能力，推动城市安全韧性发展。加强三峡库区、武陵山区等重点生态功能区保护，筑牢区域生态安全屏障。开展新污染物治理。加强巢湖、汉江中下游蓝藻水华等生态灾害风险防控，防范重要湖库发生规模性退化萎缩。持续推进中部地区突发水污染事件环境应急“一河一策一图”和“一园一策一图”。深化长江赣鄂皖段、丹江口库区上下游突发水污染事件联防联控机制。 八、强化生态环境保护支撑保障 （十六）加快建立现代化生态环境监测体系。支持持续完善全要素、全地域生态环境监测网络，实现天空地全覆盖，推进地方监测网点位布设重点向区县、乡镇、农村延伸。支持中部地区建设一批生态质量综合监测站。深化重点生态功能区县域生态环境质量监测与评价。开展三峡库区水华预警和应急专项监测、丹江口水库水华专项监测、长江流域水生态监测。 （十七）加强督察执法监管。紧盯中央生态环境保护督察和长江经济带、黄河流域生态环境警示片发现问题整改。强化排污许可事中事后监管，全面推行排污许可清单式执法监管。完善跨区域跨部门联合执法机制，加强行政、司法协同，依法依规查处重大环境污染、生态破坏等行为，涉及生态环境损害的，根据相关规定及时启动生态环境损害赔偿。指导中部地区针对群众反映强烈的噪声投诉问题建立督办机制，支持河南、江西和湖北等省份开展噪声污染防治试点。 （十八）强化科技支撑。在有关生态环境领域重点研发计划部署、重大科技需求凝练中充分考虑中部地区需求，提升区域生态环境领域科技支撑能力。推动丹江口库区生态风险防治与水质安全保障、中原城市群大气复合污染深化治理、黄淮海平原区农业农村减污降碳协同增效等关键技术研究。创新完善工作机制，深化长江生态环境保护修复、黄河流域生态保护和高质量发展联合研究。 （十九）支持完善市场化机制。推动完善中部地区长江、黄河等流域和洞庭湖、鄱阳湖等重要湖泊生态保护补偿，健全生态产品价值实现机制。强化绿色金融支持，推进生态环境导向的开发（EOD）模式创新，探索推进生态环境治理与国家文化公园、美丽河湖建设等一体化投融资，加快实施生态环境领域重大工程。支持推进碳排放权、排污权等市场化交易。 生态环境部结合建设美丽中国先行区、编制“十五五”生态环境保护规划等工作，研究支持美丽中部建设举措。加强对中部地区生态环境保护工作的协调指导，制定年度生态环境保护工作安排，推动加强区域生态环境保护协作，及时研究解决区域性重大生态环境问题，以高水平保护促进中部地区加快崛起。 生态环境部 2024年9月13日 （此件删减后公开）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:20.352Z"},{"slug":"policy-20240824-6a5fac69","title":"北京市地方标准《老旧厂房更新改造设计标准》（DB11/T 2296-2024）","type":"policy","type_label":"政策","issuer":"北京市规划和自然资源委员会、北京市市场监督管理局","doc_no":"DB11/T 2296-2024（实施通知：京规自发〔2024〕204号）","publish_date":"2024-08-24","effective_date":"2025-01-01","status":"现行有效","level":"地方级","region":"北京","source_name":"工作区研究资料收录（标准原文 OCR）","source_url":"","summary":"北京市地方标准《老旧厂房更新改造设计标准》（DB11/T 2296-2024）由北京市规划和自然资源委员会归口管理、北京市市场监督管理局联合发布，2024年8月24日以京规自发〔2024〕204号通知实施，自2025年1月1日起施行，适用于北京行政区域内老旧厂房的民用化更新改造设计。标准第3章设“价值分级”，以定量评分划为 I/II/III/IV 四级，并就场地与总平面、建筑风貌、规模与指标、评估与策划等提出要求。","themes":["老旧厂房改造","城市更新","历史文化保护","工业遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>北京市规划和自然资源委员会关于实施北京市地方标准《老旧厂房更新改造设计标准》的通知（京规自发〔2024〕204号） 各有关单位： 为推动北京市老旧厂房转型升级、功能优化和提质增效，规范和指导老旧厂房更新改造的设计工作，助力城市更新，我委组织制定了北京市地方标准《老旧厂房更新改造设计标准》（DB11/T 2296-2024），并已与北京市市场监督管理局联合发布，现将有关事宜通知如下： 《老旧厂房更新改造设计标准》（DB11/T 2296-2024）自2025年1月1日起实施，自实施之日起，北京行政区域内老旧厂房的民用化更新改造设计应按照本标准认真执行。 本标准由北京市规划和自然资源委员会归口管理并组织实施。 特此通知。 北京市规划和自然资源委员会 2024年8月24日 标准要点（依据工作区留存的标准原文 OCR 摘录）：\u003c/p>\n\u003cul>\u003cli>主编单位：北京市建筑设计研究院股份有限公司；批准部门：北京市规划和自然资源委员会、北京市市场监督管理局。\u003c/li>\u003cli>第3.2.3条价值分级：按评估指标定量评分为 I 级（≥120分）、II 级（105—120分）、III 级（90—105分）、IV 级（&lt;90分）。\u003c/li>\u003cli>第4章评估与策划：改造前需完成结构安全、抗震、节能、消防、风貌等综合评估，改造后设后评估制度。\u003c/li>\u003cli>第5章建筑设计：5.2规模与指标、5.3场地与总平面、5.4建筑风貌（风貌分区管控，历史工业带优先保护工业美学特征）。\u003c/li>\u003c/ul>\n\u003cp>说明：本条目依据工作区留存的标准原文 OCR 与研究笔记整理，标准全文以上述主管部门发布版本为准。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:05:28.498Z"},{"slug":"regulation-20240410-193104da","title":"生态保护补偿条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第779号","publish_date":"2024-04-10","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202404/content_6944395.htm","summary":"中华人民共和国国务院令  第779号 《生态保护补偿条例》已经2024年2月23日国务院第26次常务会议通过，现予公布，自2024年6月1日起施行。 总理　　李强　　　　　　　 2024年4月6日","themes":["生态保护","补偿机制"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第779号 《生态保护补偿条例》已经2024年2月23日国务院第26次常务会议通过，现予公布，自2024年6月1日起施行。 总理 李强 2024年4月6日 生态保护补偿条例 第一章 总 则 第一条 为了保护和改善生态环境，加强和规范生态保护补偿，调动各方参与生态保护积极性，推动生态文明建设，根据有关法律，制定本条例。 第二条 在中华人民共和国领域及管辖的其他海域开展生态保护补偿及其相关活动，适用本条例。法律、行政法规另有规定的，依照其规定。 本条例所称生态保护补偿，是指通过财政纵向补偿、地区间横向补偿、市场机制补偿等机制，对按照规定或者约定开展生态保护的单位和个人予以补偿的激励性制度安排。生态保护补偿可以采取资金补偿、对口协作、产业转移、人才培训、共建园区、购买生态产品和服务等多种补偿方式。 前款所称单位和个人，包括地方各级人民政府、村民委员会、居民委员会、农村集体经济组织及其成员以及其他应当获得补偿的单位和个人。 第三条 生态保护补偿工作坚持中国共产党的领导，坚持政府主导、社会参与、市场调节相结合，坚持激励与约束并重，坚持统筹协同推进，坚持生态效益与经济效益、社会效益相统一。 第四条 县级以上人民政府应当加强对生态保护补偿工作的组织领导，将生态保护补偿工作纳入国民经济和社会发展规划，构建稳定的生态保护补偿资金投入机制。 县级以上人民政府依法可以通过多种方式拓宽生态保护补偿资金渠道。 第五条 国务院发展改革、财政、自然资源、生态环境、水行政、住房城乡建设、农业农村、林业草原等部门依据各自职责，负责生态保护补偿相关工作。 第六条 县级以上地方人民政府应当建立健全生态保护补偿工作的相关机制，督促所属部门和下级人民政府开展生态保护补偿工作。县级以上地方人民政府有关部门依据各自职责，负责生态保护补偿相关工作。 第七条 对在生态保护补偿工作中作出显著成绩的单位和个人，按照国家有关规定给予表彰和奖励。 第二章 财政纵向补偿 第八条 国家通过财政转移支付等方式，对开展重要生态环境要素保护的单位和个人，以及在依法划定的重点生态功能区、生态保护红线、自然保护地等生态功能重要区域开展生态保护的单位和个人，予以补偿。 第九条 对开展重要生态环境要素保护的单位和个人，中央财政按照下列分类实施补偿（以下称分类补偿）： （一）森林； （二）草原； （三）湿地； （四）荒漠； （五）海洋； （六）水流； （七）耕地； （八）法律、行政法规和国家规定的水生生物资源、陆生野生动植物资源等其他重要生态环境要素。 前款规定的补偿的具体范围、补偿方式应当统筹考虑地区经济社会发展水平、财政承受能力、生态保护成效等因素分类确定，并连同补偿资金的使用及其监督管理等事项依法向社会公布。中央财政分类补偿的具体办法由国务院主管部门会同其他有关部门分领域制定。 第十条 在中央财政分类补偿的基础上，按照中央与地方财政事权和支出责任划分原则，有关地方人民政府可以结合本地区实际建立分类补偿制度，对开展重要生态环境要素保护的单位和个人加大补偿力度。 法律、行政法规或者国务院规定要求由中央财政和地方财政共同出资实施分类补偿或者由地方财政出资实施分类补偿的，有关地方人民政府应当按照规定及时落实资金。 第十一条 中央财政安排重点生态功能区转移支付，结合财力状况逐步增加转移支付规模。根据生态效益外溢性、生态功能重要性、生态环境敏感性和脆弱性等特点，在重点生态功能区转移支付中实施差异化补偿，加大对生态保护红线覆盖比例较高地区支持力度。 国务院财政部门制定重点生态功能区转移支付管理办法，明确转移支付的范围和转移支付资金的分配方式。 第十二条 国家建立健全以国家公园为主体的自然保护地体系生态保护补偿机制。中央财政和地方财政对开展自然保护地保护的单位和个人分类分级予以补偿，根据自然保护地类型、级别、规模和管护成效等合理确定转移支付规模。 第十三条 地方人民政府及其有关部门获得的生态保护补偿资金应当按照规定用途使用。 地方人民政府及其有关部门应当按照规定将生态保护补偿资金及时补偿给开展生态保护的单位和个人，不得截留、占用、挪用或者拖欠。 由地方人民政府统筹使用的生态保护补偿资金，应当优先用于自然资源保护、生态环境治理和修复等。 生态保护地区所在地有关地方人民政府应当按照国家有关规定，稳步推进不同渠道生态保护补偿资金统筹使用，提高生态保护整体效益。 第三章 地区间横向补偿 第十四条 国家鼓励、指导、推动生态受益地区与生态保护地区人民政府通过协商等方式建立生态保护补偿机制，开展地区间横向生态保护补偿。 根据生态保护实际需要，上级人民政府可以组织、协调下级人民政府之间开展地区间横向生态保护补偿。 第十五条 地区间横向生态保护补偿针对下列区域开展： （一）江河流域上下游、左右岸、干支流所在区域； （二）重要生态环境要素所在区域以及其他生态功能重要区域； （三）重大引调水工程水源地以及沿线保护区； （四）其他按照协议开展生态保护补偿的区域。 第十六条 对在生态功能特别重要的跨省、自治区、直辖市和跨自治州、设区的市重点区域开展地区间横向生态保护补偿的，中央财政和省级财政可以给予引导支持。 对开展地区间横向生态保护补偿取得显著成效的，国务院发展改革、财政等部门可以在规划、资金、项目安排等方面给予适当支持。 第十七条 开展地区间横向生态保护补偿，有关地方人民政府应当签订书面协议（以下称补偿协议），明确下列事项： （一）补偿的具体范围； （二）生态保护预期目标及其监测、评判指标； （三）生态保护地区的生态保护责任； （四）补偿方式以及落实补偿的相关安排； （五）协议期限； （六）违反协议的处理； （七）其他事项。 确定补偿协议的内容，应当综合考虑生态保护现状、生态保护成本、生态保护成效以及地区经济社会发展水平、财政承受能力等因素。 生态保护地区获得的生态保护补偿资金，应当用于本地区自然资源保护、生态环境治理和修复、经济社会发展和民生改善等。需要直接补偿给单位和个人的，应当按照规定及时补偿，不得截留、占用、挪用或者拖欠。 第十八条 有关地方人民政府应当严格履行所签订的补偿协议。生态保护地区应当按照协议落实生态保护措施，生态受益地区应当按照约定积极主动履行补偿责任。 因补偿协议履行产生争议的，有关地方人民政府应当协商解决；协商不成的，报请共同的上一级人民政府协调解决，必要时共同的上一级人民政府可以作出决定，有关地方人民政府应当执行。 第十九条 有关地方人民政府在补偿协议期限届满后，根据实际需要续签补偿协议，续签补偿协议时可以对有关事项重新协商。 第四章 市场机制补偿 第二十条 国家充分发挥市场机制在生态保护补偿中的作用，推进生态保护补偿市场化发展，拓展生态产品价值实现模式。 第二十一条 国家鼓励企业、公益组织等社会力量以及地方人民政府按照市场规则，通过购买生态产品和服务等方式开展生态保护补偿。 第二十二条 国家建立健全碳排放权、排污权、用水权、碳汇权益等交易机制，推动交易市场建设，完善交易规则。 第二十三条 国家鼓励、支持生态保护与生态产业发展有机融合，在保障生态效益前提下，采取多种方式发展生态产业，推动生态优势转化为产业优势，提高生态产品价值。 发展生态产业应当完善农村集体经济组织和农村居民参与方式，建立持续性惠益分享机制，促进生态保护主体利益得到有效补偿。 地方各级人民政府应当根据实际需要，加快培育生态产品市场经营开发主体，充分发挥其在整合生态资源、统筹实施生态保护、提供专业技术支撑、推进生态产品供需对接等方面的优势和作用。 第二十四条 国家鼓励、引导社会资金建立市场化运作的生态保护补偿基金，依法有序参与生态保护补偿。 第五章 保障和监督管理 第二十五条 政府及其有关部门应当按照规定及时下达和核拨生态保护补偿资金，确保补偿资金落实到位。 政府及其有关部门应当加强对资金用途的监督管理，按照规定实施生态保护补偿资金预算绩效管理，完善生态保护责任落实的激励约束机制。 第二十六条 国家推进自然资源统一确权登记，完善生态保护补偿监测支撑体系，建立生态保护补偿统计体系，完善生态保护补偿标准体系，为生态保护补偿工作提供技术支撑。 第二十七条 国家完善与生态保护补偿相配套的财政、金融等政策措施，发挥财政税收政策调节功能，完善绿色金融体系。 第二十八条 国家建立健全统一的绿色产品标准、认证、标识体系，推进绿色产品市场建设，实施政府绿色采购政策，建立绿色采购引导机制。 第二十九条 政府和有关部门应当通过多种形式，加强对生态保护补偿政策和实施效果的宣传，为生态保护补偿工作营造良好社会氛围。 第三十条 政府和有关部门应当依法及时公开生态保护补偿工作情况，接受社会监督和舆论监督。 审计机关对生态保护补偿资金的管理使用情况依法进行审计监督。 第三十一条 截留、占用、挪用、拖欠或者未按照规定使用生态保护补偿资金的，政府和有关主管部门应当责令改正；逾期未改正的，可以缓拨、减拨、停拨或者追回生态保护补偿资金。 以虚假手段骗取生态保护补偿资金的，由政府和有关主管部门依法依规处理、处罚；构成犯罪的，依法追究刑事责任。 第三十二条 政府和有关部门及其工作人员在生态保护补偿工作中有失职、渎职行为的，依法依规追究责任。 第六章 附 则 第三十三条 本条例自2024年6月1日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.369Z"},{"slug":"regulation-20240320-a93f3dfd","title":"节约用水条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第776号","publish_date":"2024-03-20","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202403/content_6940436.htm","summary":"中华人民共和国国务院令 第776号 《节约用水条例》已经2024年2月23日国务院第26次常务会议通过，现予公布，自2024年5月1日起施行。 总理　　李强　　　　　　   2024年3月9日","themes":["节约用水","水资源"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第776号 《节约用水条例》已经2024年2月23日国务院第26次常务会议通过，现予公布，自2024年5月1日起施行。 总理 李强 2024年3月9日 节 约 用 水 条 例 第一章 总 则 第一条 为了促进全社会节约用水，保障国家水安全，推进生态文明建设，推动高质量发展，根据《中华人民共和国水法》等有关法律，制定本条例。 第二条 本条例所称节约用水（以下简称节水），是指通过加强用水管理、转变用水方式，采取技术上可行、经济上合理的措施，降低水资源消耗、减少水资源损失、防止水资源浪费，合理、有效利用水资源的活动。 第三条 节水工作应当坚持中国共产党的领导，贯彻总体国家安全观，统筹发展和安全，遵循统筹规划、综合施策、因地制宜、分类指导的原则，坚持总量控制、科学配置、高效利用，坚持约束和激励相结合，建立政府主导、各方协同、市场调节、公众参与的节水机制。 第四条 国家厉行节水，坚持和落实节水优先方针，深入实施国家节水行动，全面建设节水型社会。 任何单位和个人都应当依法履行节水义务。 第五条 国家建立水资源刚性约束制度，坚持以水定城、以水定地、以水定人、以水定产，优化国土空间开发保护格局，促进人口和城市科学合理布局，构建与水资源承载能力相适应的现代产业体系。 第六条 县级以上人民政府应当将节水工作纳入国民经济和社会发展有关规划、年度计划，加强对节水工作的组织领导，完善并推动落实节水政策和保障措施，统筹研究和协调解决节水工作中的重大问题。 第七条 国务院水行政主管部门负责全国节水工作。国务院住房城乡建设主管部门按照职责分工指导城市节水工作。国务院发展改革、工业和信息化、农业农村、自然资源、市场监督管理、科技、教育、机关事务管理等主管部门按照职责分工做好节水有关工作。 县级以上地方人民政府有关部门按照职责分工做好节水工作。 第八条 国家完善鼓励和支持节水产业发展、科技创新的政策措施，加强节水科技创新能力建设和产业化应用，强化科技创新对促进节水的支撑作用。 第九条 国家加强节水宣传教育和科学普及，提升全民节水意识和节水技能，促进形成自觉节水的社会共识和良好风尚。 国务院有关部门、县级以上地方人民政府及其有关部门、乡镇人民政府、街道办事处应当组织开展多种形式的节水宣传教育和知识普及活动。 新闻媒体应当开展节水公益宣传，对浪费水资源的行为进行舆论监督。 第二章 用水管理 第十条 国务院有关部门按照职责分工，根据国民经济和社会发展规划、全国水资源战略规划编制全国节水规划。县级以上地方人民政府根据经济社会发展需要、水资源状况和上级节水规划，组织编制本行政区域的节水规划。 节水规划应当包括水资源状况评价、节水潜力分析、节水目标、主要任务和措施等内容。 第十一条 国务院水行政、标准化主管部门组织制定全国主要农作物、重点工业产品和服务业等的用水定额（以下称国家用水定额）。组织制定国家用水定额，应当征求国务院有关部门和省、自治区、直辖市人民政府的意见。 省、自治区、直辖市人民政府根据实际需要，可以制定严于国家用水定额的地方用水定额；国家用水定额未作规定的，可以补充制定地方用水定额。地方用水定额由省、自治区、直辖市人民政府有关行业主管部门提出，经同级水行政、标准化主管部门审核同意后，由省、自治区、直辖市人民政府公布，并报国务院水行政、标准化主管部门备案。 用水定额应当根据经济社会发展水平、水资源状况、产业结构变化和技术进步等情况适时修订。 第十二条 县级以上地方人民政府水行政主管部门会同有关部门，根据用水定额、经济技术条件以及水量分配方案、地下水控制指标等确定的可供本行政区域使用的水量，制定本行政区域年度用水计划，对年度用水实行总量控制。 第十三条 国家对用水达到一定规模的单位实行计划用水管理。 用水单位的用水计划应当根据用水定额、本行政区域年度用水计划制定。对直接取用地下水、地表水的用水单位，用水计划由县级以上地方人民政府水行政主管部门或者相应流域管理机构制定；对使用城市公共供水的用水单位，用水计划由城市节水主管部门会同城市供水主管部门制定。 用水单位计划用水管理的具体办法由省、自治区、直辖市人民政府制定。 第十四条 用水应当计量。对不同水源、不同用途的水应当分别计量。 县级以上地方人民政府应当加强农业灌溉用水计量设施建设。水资源严重短缺地区、地下水超采地区应当限期建设农业灌溉用水计量设施。农业灌溉用水暂不具备计量条件的，可以采用以电折水等间接方式进行计量。 任何单位和个人不得侵占、损毁、擅自移动用水计量设施，不得干扰用水计量。 第十五条 用水实行计量收费。国家建立促进节水的水价体系，完善与经济社会发展水平、水资源状况、用水定额、供水成本、用水户承受能力和节水要求等相适应的水价形成机制。 城镇居民生活用水和具备条件的农村居民生活用水实行阶梯水价，非居民用水实行超定额（超计划）累进加价。 农业水价应当依法统筹供水成本、水资源稀缺程度和农业用水户承受能力等因素合理制定，原则上不低于工程运行维护成本。对具备条件的农业灌溉用水，推进实行超定额累进加价。 再生水、海水淡化水的水价在地方人民政府统筹协调下由供需双方协商确定。 第十六条 水资源严重短缺地区、地下水超采地区应当严格控制高耗水产业项目建设，禁止新建并限期淘汰不符合国家产业政策的高耗水产业项目。 第十七条 国家对节水潜力大、使用面广的用水产品实行水效标识管理，并逐步淘汰水效等级较低的用水产品。水效标识管理办法由国务院发展改革主管部门会同国务院有关部门制定。 第十八条 国家鼓励对节水产品实施质量认证，通过认证的节水产品可以按照规定使用认证标志。认证基本规范、认证规则由国务院认证认可监督管理部门会同国务院有关部门制定。 第十九条 新建、改建、扩建建设项目，建设单位应当根据工程建设内容制定节水措施方案，配套建设节水设施。节水设施应当与主体工程同时设计、同时施工、同时投入使用。节水设施建设投资纳入建设项目总投资。 第二十条 国家逐步淘汰落后的、耗水量高的技术、工艺、设备和产品，具体名录由国务院发展改革主管部门会同国务院工业和信息化、水行政、住房城乡建设等有关部门制定并公布。 禁止生产、销售列入前款规定名录的技术、工艺、设备和产品。从事生产经营活动的使用者应当限期停止使用列入前款规定名录的技术、工艺、设备和产品。 第二十一条 国家建立健全节水标准体系。 国务院有关部门依法组织制定并适时修订有关节水的国家标准、行业标准。 国家鼓励有关社会团体、企业依法制定严于国家标准、行业标准的节水团体标准、企业标准。 第二十二条 国务院有关部门依法建立节水统计调查制度，定期公布节水统计信息。 第三章 节水措施 第二十三条 县级以上人民政府及其有关部门应当根据经济社会发展水平和水资源状况，引导农业生产经营主体合理调整种植养殖结构和农业用水结构，积极发展节水型农业，因地制宜发展旱作农业。 国家对水资源短缺地区发展节水型农业给予重点扶持。 第二十四条 国家支持耐旱农作物新品种以及土壤保墒、水肥一体化、养殖废水资源化利用等种植业、养殖业节水技术的研究和推广。 县级以上人民政府及其有关部门应当组织开展节水农业试验示范和技术培训，指导农业生产经营主体使用节水技术。 第二十五条 国家发展节水灌溉，推广喷灌、微灌、管道输水灌溉、渠道防渗输水灌溉、集雨补灌等节水灌溉技术，提高灌溉用水效率。水资源短缺地区、地下水超采地区应当优先发展节水灌溉。 县级以上人民政府及其有关部门应当支持和推动节水灌溉工程设施建设。新建灌溉工程设施应当符合节水灌溉工程技术标准。已经建成的灌溉工程设施不符合节水灌溉工程技术标准的，应当限期进行节水改造。 第二十六条 国家加快推进农村生活节水。 县级以上地方人民政府及其有关部门应当加强农村生活供水设施以及配套管网建设和改造，推广使用生活节水器具。 第二十七条 工业企业应当加强内部用水管理，建立节水管理制度，采用分质供水、高效冷却和洗涤、循环用水、废水处理回用等先进、适用节水技术、工艺和设备，降低单位产品（产值）耗水量，提高水资源重复利用率。高耗水工业企业用水水平超过用水定额的，应当限期进行节水改造。 工业企业的生产设备冷却水、空调冷却水、锅炉冷凝水应当回收利用。高耗水工业企业应当逐步推广废水深度处理回用技术措施。 第二十八条 新建、改建、扩建工业企业集聚的各类开发区、园区等（以下统称工业集聚区）应当统筹建设供水、排水、废水处理及循环利用设施，推动企业间串联用水、分质用水，实现一水多用和循环利用。 国家鼓励已经建成的工业集聚区开展以节水为重点内容的绿色高质量转型升级和循环化改造，加快节水及水循环利用设施建设。 第二十九条 县级以上地方人民政府应当加强对城市建成区内生产、生活、生态用水的统筹，将节水要求落实到城市规划、建设、治理的各个环节，全面推进节水型城市建设。 第三十条 公共供水企业和自建用水管网设施的单位应当加强供水、用水管网设施运行和维护管理，建立供水、用水管网设施漏损控制体系，采取措施控制水的漏损。超出供水管网设施漏损控制国家标准的漏水损失，不得计入公共供水企业定价成本。 县级以上地方人民政府有关部门应当加强对公共供水管网设施运行的监督管理，支持和推动老旧供水管网设施改造。 第三十一条 国家把节水作为推广绿色建筑的重要内容，推动降低建筑运行水耗。 新建、改建、扩建公共建筑应当使用节水器具。 第三十二条 公共机构应当发挥节水表率作用，建立健全节水管理制度，率先采用先进的节水技术、工艺、设备和产品，开展节水改造，积极建设节水型单位。 第三十三条 城镇园林绿化应当提高用水效率。 水资源短缺地区城镇园林绿化应当优先选用适合本地区的节水耐旱型植被，采用喷灌、微灌等节水灌溉方式。 水资源短缺地区应当严格控制人造河湖等景观用水。 第三十四条 县级以上地方人民政府应当根据水资源状况，将再生水、集蓄雨水、海水及海水淡化水、矿坑（井）水、微咸水等非常规水纳入水资源统一配置。 水资源短缺地区县级以上地方人民政府应当制定非常规水利用计划，提高非常规水利用比例，对具备使用非常规水条件但未合理使用的建设项目，不得批准其新增取水许可。 第三十五条 县级以上地方人民政府应当统筹规划、建设污水资源化利用基础设施，促进污水资源化利用。 城市绿化、道路清扫、车辆冲洗、建筑施工以及生态景观等用水，应当优先使用符合标准要求的再生水。 第三十六条 县级以上地方人民政府应当推进海绵城市建设，提高雨水资源化利用水平。 开展城市新区建设、旧城区改造和市政基础设施建设等，应当按照海绵城市建设要求，因地制宜规划、建设雨水滞渗、净化、利用和调蓄设施。 第三十七条 沿海地区应当积极开发利用海水资源。 沿海或者海岛淡水资源短缺地区新建、改建、扩建工业企业项目应当优先使用海水淡化水。具备条件的，可以将海水淡化水作为市政新增供水以及应急备用水源。 第四章 保障和监督 第三十八条 县级以上地方人民政府应当健全与节水成效、农业水价水平、财力状况相匹配的农业用水精准补贴机制和节水奖励机制。 对符合条件的节水项目，按照国家有关规定给予补助。 第三十九条 国家鼓励金融机构提供多种形式的节水金融服务，引导金融机构加大对节水项目的融资支持力度。 国家鼓励和引导社会资本按照市场化原则依法参与节水项目建设和运营，保护其合法权益。 第四十条 国家鼓励发展社会化、专业化、规范化的节水服务产业，支持节水服务机构创新节水服务模式，开展节水咨询、设计、检测、计量、技术改造、运行管理、产品认证等服务，引导和推动节水服务机构与用水单位或者个人签订节水管理合同，提供节水服务并以节水效益分享等方式获得合理收益。 国家鼓励农村集体经济组织、农民专业合作社、农民用水合作组织以及其他专业化服务组织参与农业节水服务。 第四十一条 国家培育和规范水权市场，支持开展多种形式的水权交易，健全水权交易系统，引导开展集中交易，完善水权交易规则，并逐步将水权交易纳入公共资源交易平台体系。 第四十二条 对节水成绩显著的单位和个人，按照国家有关规定给予表彰、奖励。 第四十三条 县级以上人民政府水行政、住房城乡建设、市场监督管理等主管部门应当按照职责分工，加强对用水活动的监督检查，依法查处违法行为。 有关部门履行监督检查职责时，有权采取下列措施： （一）进入现场开展检查，调查了解有关情况； （二）要求被检查单位或者个人就节水有关问题作出说明； （三）要求被检查单位或者个人提供有关文件、资料，进行查阅或者复制； （四）法律、行政法规规定的其他措施。 监督检查人员在履行监督检查职责时，应当主动出示执法证件。被检查单位和个人应当予以配合，不得拒绝、阻碍。 第四十四条 对浪费水资源的行为，任何单位和个人有权向有关部门举报，接到举报的部门应当依法及时处理。 第四十五条 国家实行节水责任制和节水考核评价制度，将节水目标完成情况纳入对地方人民政府及其负责人考核范围。 第五章 法律责任 第四十六条 侵占、损毁、擅自移动用水计量设施，或者干扰用水计量的，由县级以上地方人民政府水行政、住房城乡建设主管部门或者流域管理机构责令停止违法行为，限期采取补救措施，处1万元以上10万元以下的罚款；造成损失的，依法承担赔偿责任。 第四十七条 建设项目的节水设施没有建成或者没有达到国家规定的要求，擅自投入使用的，以及生产、销售或者在生产经营中使用国家明令淘汰的落后的、耗水量高的技术、工艺、设备和产品的，依照《中华人民共和国水法》有关规定给予处罚。 第四十八条 高耗水工业企业用水水平超过用水定额，未在规定的期限内进行节水改造的，由县级以上地方人民政府水行政主管部门或者流域管理机构责令改正，可以处10万元以下的罚款；拒不改正的，处10万元以上50万元以下的罚款，情节严重的，采取限制用水措施或者吊销其取水许可证。 第四十九条 工业企业的生产设备冷却水、空调冷却水、锅炉冷凝水未回收利用的，由县级以上地方人民政府水行政主管部门责令改正，可以处5万元以下的罚款；拒不改正的，处5万元以上10万元以下的罚款。 第五十条 县级以上人民政府及其有关部门的工作人员在节水工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分。 第五十一条 违反本条例规定，构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第六章 附 则 第五十二条 本条例自2024年5月1日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.413Z"},{"slug":"regulation-20240125-99c444bb","title":"中华人民共和国档案法实施条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第772号","publish_date":"2024-01-25","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202401/content_6928164.htm","summary":"中华人民共和国国务院令 第772号 《中华人民共和国档案法实施条例》已经2023年12月29日国务院第22次常务会议通过，现予公布，自2024年3月1日起施行。 总理　　李强","themes":["档案","文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第772号 《中华人民共和国档案法实施条例》已经2023年12月29日国务院第22次常务会议通过，现予公布，自2024年3月1日起施行。 总理 李强 2024年1月12日 中华人民共和国档案法实施条例 第一章 总 则 第二条 《档案法》所称档案，其具体范围由国家档案主管部门或者国家档案主管部门会同国家有关部门确定。 反映地方文化习俗、民族风貌、历史人物、特色品牌等的档案，其具体范围可以由省、自治区、直辖市档案主管部门会同同级有关部门确定。 第三条 档案工作应当坚持和加强党的领导，全面贯彻党的路线方针政策和决策部署，健全党领导档案工作的体制机制，把党的领导贯彻到档案工作各方面和各环节。 第四条 县级以上人民政府应当加强档案工作，建立健全档案机构，提供档案长久安全保管场所和设施，并将档案事业发展经费列入本级预算。 机关、团体、企业事业单位和其他组织应当加强本单位档案工作，履行档案工作主体责任，保障档案工作依法开展。 第五条 国家档案馆馆藏的永久保管档案分一、二、三级管理，分级的具体标准和管理办法由国家档案主管部门制定。 第六条 中央国家机关经国家档案主管部门同意，省、自治区、直辖市有关国家机关经本级档案主管部门同意，可以制定本系统专业档案的具体管理制度和办法。 第七条 县级以上人民政府及其有关部门，应当加强档案宣传教育工作，普及档案知识，传播档案文化，增强全社会档案意识。 第八条 国家加强档案相关专业人才培养，支持高等院校、职业学校设立档案学等相关专业。 第九条 国家鼓励和支持企业事业单位、社会组织和个人等社会力量通过依法兴办实体、资助项目、从事志愿服务以及开展科学研究、技术创新和科技成果推广等形式，参与和支持档案事业的发展。 档案行业组织依照法律、法规、规章及其章程的规定，加强行业自律，推动诚信建设，提供行业服务，开展学术交流和档案相关科普教育，参与政策咨询和标准制定等活动。 档案主管部门应当在职责范围内予以指导。 第十条 有下列情形之一的，由县级以上人民政府、档案主管部门或者本单位按照国家有关规定给予表彰、奖励： （一）对档案收集、整理、保护、利用做出显著成绩的； （二）对档案科学研究、技术创新、宣传教育、交流合作做出显著成绩的； （三）在重大活动、突发事件应对活动相关档案工作中表现突出的； （四）将重要或者珍贵档案捐献给国家的； （五）同违反档案法律、法规的行为作斗争，表现突出的； （六）长期从事档案工作，表现突出的。 第二章 档案机构及其职责 第十一条 国家档案主管部门依照《档案法》第八条第一款的规定，履行下列职责： （一）根据有关法律、行政法规和国家有关方针政策，研究、制定部门规章、档案工作具体方针政策和标准； （二）组织协调全国档案事业的发展，制定国家档案事业发展综合规划和专项计划，并组织实施； （三）对有关法律、行政法规、部门规章和国家有关方针政策的实施情况进行监督检查，依法查处档案违法行为； （四）对中央国家机关各部门、中央管理的群团组织、中央企业以及中央和国务院直属事业单位的档案工作，中央级国家档案馆的工作，以及省、自治区、直辖市档案主管部门的工作，实施监督、指导； （五）组织、指导档案理论与科学技术研究、档案信息化建设、档案宣传教育、档案工作人员培训； （六）组织、开展档案领域的国际交流与合作。 第十二条 县级以上地方档案主管部门依照《档案法》第八条第二款的规定，履行下列职责： （一）贯彻执行有关法律、法规、规章和国家有关方针政策； （二）制定本行政区域档案事业发展规划和档案工作制度规范，并组织实施； （三）监督、指导本行政区域档案工作，对有关法律、法规、规章和国家有关方针政策的实施情况进行监督检查，依法查处档案违法行为； （四）组织、指导本行政区域档案理论与科学技术研究、档案信息化建设、档案宣传教育、档案工作人员培训。 第十三条 乡镇人民政府依照《档案法》第八条第三款的规定，履行下列职责： （一）贯彻执行有关法律、法规、规章和国家有关方针政策，建立健全档案工作制度规范； （二）指定人员管理本机关档案，并按照规定向有关档案馆移交档案； （三）监督、指导所属单位以及基层群众性自治组织等的档案工作。 第十四条 机关、团体、企业事业单位和其他组织应当确定档案机构或者档案工作人员，依照《档案法》第九条第一款的规定，履行下列职责： （一）贯彻执行有关法律、法规、规章和国家有关方针政策，建立健全本单位档案工作制度规范； （二）指导本单位相关材料的形成、积累、整理和归档，统一管理本单位的档案，并按照规定向有关档案馆移交档案； （三）监督、指导所属单位的档案工作。 第十五条 各级各类档案馆的设置和管理应当符合国家有关规定。 第十六条 国家档案馆应当配备与其职责和规模相适应的专业人员，依照《档案法》第十条的规定，履行下列职责： （一）收集本馆分管范围内的档案； （二）按照规定整理、保管档案； （三）依法向社会开放档案，并采取各种形式研究、开发档案资源，为各方面利用档案资源提供服务； （四）开展宣传教育，发挥爱国主义教育和历史文化教育功能。 按照国家有关规定设置的其他各类档案馆，参照前款规定依法履行相应职责。 第十七条 档案主管部门、档案馆和机关、团体、企业事业单位以及其他组织应当为档案工作人员的教育培训、职称评审、岗位聘用等创造条件，不断提高档案工作人员的专业知识水平和业务能力。 第三章 档案的管理 第十八条 按照国家规定应当形成档案的机关、团体、企业事业单位和其他组织，应当建立档案工作责任制，确定档案工作组织结构、职责分工，落实档案工作领导责任、管理责任、执行责任，健全单位主要负责人承担档案完整与安全第一责任人职责相关制度，明确档案管理、档案基础设施建设、档案信息化等工作要求。 第十九条 依照《档案法》第十三条以及国家有关规定应当归档的材料，由机关、团体、企业事业单位和其他组织的各内设机构收集齐全，规范整理，定期交本单位档案机构或者档案工作人员集中管理，任何内设机构和个人不得拒绝归档或者据为己有。 机关、群团组织、国有企业事业单位应当明确本单位的归档范围和档案保管期限，经同级档案主管部门审核同意后施行。单位内设机构或者工作职能发生重大变化时，应当及时调整归档范围和档案保管期限，经重新审核同意后施行。 机关、群团组织、国有企业事业单位负责所属单位的归档范围和档案保管期限的审核。 第二十条 机关、团体、企业事业单位和其他组织，应当按照国家档案主管部门关于档案移交的规定，定期向有关的国家档案馆移交档案。 属于中央级和省级、设区的市级国家档案馆接收范围的档案，移交单位应当自档案形成之日起满二十年即向有关的国家档案馆移交。属于县级国家档案馆接收范围的档案，移交单位应当自档案形成之日起满十年即向有关的县级国家档案馆移交。 经同级档案主管部门检查和同意，专业性较强或者需要保密的档案，可以延长向有关的国家档案馆移交的期限。已撤销单位的档案可以提前向有关的国家档案馆移交。 由于单位保管条件不符合要求或者存在其他原因可能导致不安全或者严重损毁的档案，经协商可以提前交有关档案馆保管。 第二十一条 档案馆可以按照国家有关规定，通过接受捐献、购买、代存、交换等方式收集档案。 档案馆通过前款规定方式收集档案时，应当考虑档案的珍稀程度、内容的重要性等，并以书面协议形式约定相关方的权利和义务，明确相关档案利用条件。 国家鼓励单位和个人将属于其所有的对国家和社会具有重要保存价值的档案捐献给国家档案馆。国家档案馆应当维护捐献者的合法权益。 第二十二条 档案馆应当对所保管的档案采取下列管理措施： （一）建立健全科学的管理制度和查阅利用规范，制定有针对性的安全风险管控措施和应急预案； （二）配置适宜安全保存档案、符合国家有关规定的专门库房，配备防火、防盗、防水、防光、防尘、防有害气体、防有害生物以及温湿度调控等必要的设施设备； （三）根据档案的不同等级，采取有效措施，加以保护和管理； （四）根据需要和可能，配备适应档案现代化管理需要的设施设备； （五）编制档案目录等便于档案查找和利用的检索工具。 机关、团体、企业事业单位和其他组织的档案保管，参照前款规定办理。 第二十三条 县级以上人民政府应当采取措施，保障国家档案馆依法接收档案所需的库房及设施设备。 任何单位和个人不得侵占、挪用国家档案馆的馆舍，不得擅自改变国家档案馆馆舍的功能和用途。 国家档案馆馆舍的建设，应当符合实用、安全、科学、美观、环保、节约的要求和国家有关工程建设标准，并配置无障碍设施设备。 第二十四条 机关、团体、企业事业单位和其他组织应当定期对本单位保管的保管期限届满的档案进行鉴定，形成鉴定工作报告。 经鉴定仍需继续保存的档案，应当重新划定保管期限并作出标注。经鉴定需要销毁的档案，其销毁工作应当遵守国家有关规定。 第二十五条 县级以上档案主管部门可以依托国家档案馆，对下列属于国家所有的档案中具有永久保存价值的档案分类别汇集有关目录数据： （一）机关、群团组织、国有企业事业单位形成的档案； （二）第一项所列单位之外的其他单位，经法律法规授权或者受国家机关依法委托管理公共事务形成的档案； （三）第一项所列单位之外的其他单位或者个人，由国家资金支持，从事或者参与建设工程、科学研究、技术创新等活动形成的且按照协议约定属于国家所有的档案； （四）国家档案馆保管的前三项以外的其他档案。 涉及国防、外交、国家安全、公共安全等的档案的目录数据，其汇集范围由有关档案主管部门会同档案形成单位研究确定。 第二十六条 档案馆和机关、团体、企业事业单位以及其他组织为了收集、交换散失在国外的档案、进行国际文化交流，以及适应经济建设、科学研究和科技成果推广等的需要，经国家档案主管部门或者省、自治区、直辖市档案主管部门依据职权审查批准，可以向国内外的单位或者个人赠送、交换、出售属于国家所有的档案的复制件。 第二十七条 一级档案严禁出境。二级档案需要出境的，应当经国家档案主管部门审查批准。 除前款规定之外，属于《档案法》第二十五条规定的档案或者复制件确需出境的，有关档案馆、机关、团体、企业事业单位和其他组织以及个人应当按照管理权限，报国家档案主管部门或者省、自治区、直辖市档案主管部门审查批准，海关凭批准文件查验放行。 档案或者复制件出境涉及数据出境的，还应当符合国家关于数据出境的规定。 相关单位和个人应当在档案或者复制件出境时主动向海关申报核验，并按照出境申请审查批准意见，妥善保管、处置出境的档案或者复制件。 第二十八条 档案馆和机关、团体、企业事业单位以及其他组织依照《档案法》第二十四条的规定委托档案服务时，应当确定受委托的档案服务企业符合下列条件： （一）具有企业法人资格和相应的经营范围； （二）具有与从事档案整理、寄存、开发利用、数字化等相关服务相适应的场所、设施设备、专业人员和专业能力； （三）具有保证档案安全的管理体系和保障措施。 委托方应当对受托方的服务进行全程指导和监督，确保档案安全和服务质量。 第四章 档案的利用和公布 第二十九条 国家档案馆应当依照《档案法》的有关规定，分期分批向社会开放档案，并同时公布开放档案的目录。 第三十条 国家档案馆应当建立馆藏档案开放审核协同机制，会同档案形成单位或者移交单位进行档案开放审核。档案形成单位或者移交单位撤销、合并、职权变更的，由有关的国家档案馆会同继续行使其职权的单位共同负责；无继续行使其职权的单位的，由有关的国家档案馆负责。 尚未移交进馆档案的开放审核，由档案形成单位或者保管单位负责，并在移交进馆时附具到期开放意见、政府信息公开情况、密级变更情况等。 县级以上档案主管部门应当加强对档案开放审核工作的统筹协调。 第三十一条 对于《档案法》第二十七条规定的到期不宜开放的档案，经国家档案馆报同级档案主管部门同意，可以延期向社会开放。 第三十二条 档案馆提供社会利用的档案，应当逐步实现以复制件代替原件。数字、缩微以及其他复制形式的档案复制件，载有档案保管单位签章标识的，具有与档案原件同等的效力。 第三十三条 档案馆可以通过阅览、复制和摘录等形式，依法提供利用档案。 国家档案馆应当明确档案利用的条件、范围、程序等，在档案利用接待场所和官方网站公布相关信息，创新档案利用服务形式，推进档案查询利用服务线上线下融合。 第三十四条 机关、团体、企业事业单位和其他组织以及公民利用国家档案馆保管的未开放的档案，应当经保管该档案的国家档案馆同意，必要时，国家档案馆应当征得档案形成单位或者移交单位同意。 机关、团体、企业事业单位和其他组织的档案机构保管的尚未向国家档案馆移交的档案，其他机关、团体、企业事业单位以及公民需要利用的，应当经档案形成单位或者保管单位同意。 第三十五条 《档案法》第三十二条所称档案的公布，是指通过下列形式首次向社会公开档案的全部或者部分原文： （一）通过报纸、期刊、图书、音像制品、电子出版物等公开出版； （二）通过电台、电视台、计算机信息网络等公开传播； （三）在公开场合宣读、播放； （四）公开出售、散发或者张贴档案复制件； （五）在展览、展示中公开陈列。 第三十六条 公布属于国家所有的档案，按照下列规定办理： （一）保存在档案馆的，由档案馆公布；必要时，应当征得档案形成单位或者移交单位同意后公布，或者报经档案形成单位或者移交单位的上级主管部门同意后公布； （二）保存在各单位档案机构的，由各单位公布；必要时，应当报经其上级主管部门同意后公布； （
