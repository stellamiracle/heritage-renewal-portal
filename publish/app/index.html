..............................................31引用标准名录........................................................................................................................................................32\u003c/p>\n\u003cp>11总则1.0.1为深入贯彻《北京市城市更新条例》，进一步加强城市更新项目管理与谋划，科学开展既有建筑改造体检评估工作，支撑城市更新实施方案联合审查，制定本指南。北京市作为首都和首个提出减量发展的超大型城市，在“城市发展正从大规模增量扩张阶段转向存量提质增效为主的阶段”“创新完善以需求为导向、以项目为牵引的城市更新体制机制”等新要求指导下，需结合北京市城市更新诉求多样、主体多元等特点，进一步健全城市更新实施机制。\u003c/p>\n\u003cp>北京市既有建筑存量巨大，建筑的建成年代跨度大，建筑类型多，情况复杂。既有建筑改造是推动城市更新高质量开展的重要内容，是其中关键的环节，是保障城市更新“最后一公里”实施效果的重要抓手。既有建筑改造体检评估更是支持项目科学决策的重要技术支撑，也是落实住建部“加强既有建筑改造利用”的重要举措，对北京市高质量开展城市更新、保障城市规划科学实施具有重要作用与价值。\u003c/p>\n\u003cp>本指南以健全既有建筑改造“发现问题、解决问题、评估效果、巩固提升的工作路径”为目标，聚焦规划实施审批中关注的重点内容，从技术与管理两个层面，提出既有建筑改造前需要体检评估的要素和内容要点，明确体检评估工作的主要环节和注意事项；以指引性要求支持既有建筑在改造前通过体检评估挖掘其改造面临的主要问题，提炼改造价值与优势；为城市更新中既有建筑改造谋划推进提供技术支撑，为既有建筑改造管理审批提供依据，为改造后评估提供参照。\u003c/p>\n\u003cp>1.0.2本指南适用于城市更新片区内既有民用建筑改造前的体检评估，包括民用建筑改造和改造为民用建筑的情况。本指南中的既有民用建筑改造中的对象包括既有建筑本体和项目红线范围内的场地与环境，可统筹研究周边城市功能、交通、公共空间等。1老旧厂房类更新改造应优先按照《老旧厂房更新改造设计标准》（DB11/T2296）要求开展改造体检评估，老旧小区类更新改造应优先按照《北京市老旧小区综合整治标准与技术导则》要求开展改造体检评估；如有需要也可参照本指南开展改造体检评估。\u003c/p>\n\u003cp>2以下情况可结合项目实际按需开展体检评估：重点区域的部分外装修工程、不改变使用用途的内部改造更新、低风险改扩建与内部装修项目、确认拆除重建的项目。重点区域的部分外装修工程，指位于重要大街、历史文化街区、市人民政府规定的特定地区的外装修工程（具体范围包括长安街及其延长线两侧重要建筑、北京中轴线两侧重要建筑、城市快速路及景观河道两侧重要建筑、历史文化街区内建筑等），且不改变原建筑物主体色调、造型和风貌或现有安保整治措施（主要包括清洗、粉饰、对外立面残损脱落进行修补的项目）的外立面维护活动。\u003c/p>\n\u003cp>不改变使用用途的内部改造更新，指仅进行内部改造（不增加现状建筑面积、不改变建筑外轮廓、不改变结构）且不改变使用用途的更新项目，建筑面积以合法建筑为计算基数。低风险改扩建与内部装修项目，指符合低风险等级，地上建筑面积不大于1万平方米，建筑高度不大于24米，功能单一、技术要求简单的社会投资改扩建项目及内部装修更新项目（地下空间开发项目和特殊建设工程除外）。\u003c/p>\n\u003cp>3本指南不适用于城镇住宅室内装修、村民和城镇居民自建住宅、临时性建筑、文物保护单位、历史建筑改造、危旧住宅楼拆除重建。1.0.3本指南面向城市更新项目联合审查的相关行政主管部门，城市更新项目统筹主体、实施主体，城市更新项目设计与咨询技术团队，为其提供既有建筑改造体检评估的工作参考。\u003c/p>\n\u003cp>1.0.4城市更新片区内既有建筑改造体检评估除应符合本指南外，尚应符合国家、行业和北京市现行相关标准的规定。\u003c/p>\n\u003cp>22术语2.0.1既有建筑改造体检评估对既有建筑现状的安全、文化、功能、环境、效益及管理的相关要求等进行系统分析诊断，即通过现状调查、检测鉴定等方式，评估建筑当前状态，识别建筑改造面临的主要问题、存在的优势，为改造方案制定、审批、决策提供参考。2.0.2现状调查通过资料收集、现场踏勘、实地测绘、影像记录、人员访谈等方式，全面获取建筑现状信息的过程。\u003c/p>\n\u003cp>2.0.3检测鉴定由具备资质的技术机构，依据国家规范，采用仪器检测、实验室分析、数值模拟等技术手段，对既有房屋结构、机电系统、消防专业技术等方面的安全性、可靠性等进行专项检查、检测、验算、分析和评定的一系列活动。2.0.4入库项目谋划推动纳入北京市城市更新项目库的既有建筑改造项目的推进与实施，包含推动项目从储备项目库进入实施项目库，以及列入年度城市更新工作计划等。\u003c/p>\n\u003cp>2.0.5项目实施方案编制按照《北京市城市更新条例》《北京市城市更新实施方案编制工作指南（试行）》等文件开展的城市更新实施方案编制的工作。实施方案主要包括用地规划条件、建筑设计与改造方案、土地利用方式、资金测算等，以及根据项目特点增加的内容及附件。项目统筹主体、实施主体按需选取相应内容。\u003c/p>\n\u003cp>2.0.6实施方案联合审查按照《北京市城市更新实施方案联合审查管理办法》等本市相关规定，对实施方案开展的联合审查工作。2.0.7改造后评估对完成改造并运行一段时间（指按照完整自然年计算，且应覆盖一个供暖季、一个制冷季及无供暖和制冷的过渡季）的既有建筑开展的综合效益评估工作。通过对比改造前体检评估报告、改造设计方案和改造后效果，分析改造产生的效益、总结经验。\u003c/p>\n\u003cp>33基本规定3.1总体原则3.1.1坚持以人民为中心与系统观念。全面践行人民城市理念，尊重城市发展规律，在既有建筑改造体检评估中坚持以人为本、重视对不同主体需求的挖掘，树立全周期管理意识，不断增强工作的系统性、整体性、协调性。3.1.2坚持问题导向与目标导向。以深入查找既有建筑改造面临的问题、解决人民群众身边急难愁盼问题为出发点，锚定社会与城市发展目标，开展既有建筑改造体检评估工作，促进城市结构优化、功能完善、品质提升；重视对运营需求与目标的挖掘，指引项目未来改造中搭建可持续发展的工作路径。\u003c/p>\n\u003cp>3.1.3坚持规划引领与民生优先。坚持首都城市战略定位，发挥发展规划战略导向作用，强化国土空间规划基础作用，增强专项规划实施支撑作用；重视并鼓励对公共利益的支持与保障，优先保障城市基础设施、公共服务设施或者其他城市公共利益项目，促进城市公共服务体系完善。3.1.4坚持“留改拆”并举，以保留利用提升为主。\u003c/p>\n\u003cp>坚持保护第一、应保尽保、以用促保，重视文脉赓续，在全过程、各环节加强城市文化遗产保护与利用，加强老城和三山五园整体保护，重视对城市肌理、特色风貌的保护与传承，改善人文环境，实现有机更新。3.1.5坚持绿色低碳与安全韧性。节约集约利用土地，提升土地承载能力，坚持节能减排，改善生态环境，促进低碳绿色更新。\u003c/p>\n\u003cp>坚持统筹发展和安全，重视风险排查，全面提高建筑安全与韧性。3.1.6坚持实事求是与因地制宜。坚持多元参与，科学制定工作方案、细化评估要素，结合区域战略、功能定位、建筑类型等信息，坚持实事求是、分类定制、精准施策、动态响应。3.2工作组织3.2.1在城市更新入库项目谋划或城市更新实施方案编制前期，由项目统筹主体、实施主体牵头组织，结合项目需求，参照本指南开展项目的体检评估工作，形成体检评估报告，支撑城市更新项目策划和实施方案编制，可纳入城市更新项目实施方案附件。\u003c/p>\n\u003cp>3.2.2既有建筑改造体检评估工作可委托专业设计咨询单位开展。承担单位宜具备相应能力、有相近的更新改造工作经验，遵守相关法律、法规和规章，执行北京市城市更新政策、规划、标准。工作中，若需开展检测鉴定，应委托具有相应资质的单位实施。3.2.3体检评估工作中，检测鉴定工作已有行业取费方法与标准的，应参照现行方法和标准取费；无相关规定的，可参照人工时法取费。\u003c/p>\n\u003cp>3.2.4既有建筑改造体检评估工作策划时，项目统筹主体、实施主体与承担单位应充分征询项目属地政府、城市更新主管部门意见，结合市民通过“12345”等渠道的投诉热点问题，明确体检评估工作目标、对象、内容等。\u003c/p>\n\u003cp>44体检评估流程4.1基本要求4.1.1既有建筑改造体检评估工作主要应用于城市更新中既有建筑改造的入库项目谋划，项目实施方案编制，实施方案联合审查和改造后评估阶段。4.1.2在入库项目谋划阶段，体检评估发挥靠前服务作用，支持项目谋划与成熟度研判。1项目处于策划阶段、改造意向不清晰的，可先开展初步体检评估。\u003c/p>\n\u003cp>2项目成熟度高、改造意向明确的，应开展全面体检评估。工作深度足够的，可直接纳入实施项目库，并列入本年度或下一年度的城市更新计划。初步体检评估以现场调查、资料调研为主，通过现场踏勘、调阅图纸、询问管理人员等，以定性的方法，摸清建筑现状基本情况、显性问题、约束条件、改造潜在风险等。其重在识别安全、文化、环境等部分重点维度的问题，明确后续重点工作方向及必要的检测、检验与鉴定内容，为项目改造梳理目标、前期策划提供基础支撑。\u003c/p>\n\u003cp>全面体检评估采用定性与定量相结合、定量优先的工作方法，依托现场检测、仪器检验、安全评定等技术手段，系统开展现状诊断与性能评估。其主要工作内容覆盖建筑全专业，结合改造意向筛选出体检评估对照的规范与标准，通过详细评估挖掘现状问题与改造后的优势，给出建议的改造策略。为下一步改造设计提供基础数据支撑与策略导向。\u003c/p>\n\u003cp>4.1.3在项目实施方案编制阶段，体检评估提供全面、系统的技术参考，呈现现状情况，挖掘项目改造面临的主要问题与改造的优势。1精准定位改造主要问题，挖掘需求，指导改造设计。本指南形成的问题与优势清单指明改造设计中需要重点解决和发挥优势的方面。2通过体检评估前置研判项目在改造内容和实施程序方面的合规性，并为实施方案中土地利用方式、资金方案、产业策划及运营管理和协商表决情况编制提供参考。\u003c/p>\n\u003cp>4.1.4在实施方案联合审查阶段，体检评估为管理部门决策提供技术参照。可参照体检评估问题与优势清单，研判实施方案是否对项目立项、规划设计、改造施工及未来运维环节中存在的问题与风险提出了全面、系统的解决方案。4.1.5在改造后评估阶段，体检评估为项目改造后综合效益评估提供参照，形成管理反馈。\u003c/p>\n\u003cp>1为项目改造后综合效益评估，提供基础信息参考，健全优化长效运维机制。改造后应在运行一段时间后对项目综合效益进行评估，结合项目特点对其盈利情况、使用者满意度等经济与社会效益进行评估，实现项目的闭环管理。例如，可以对比验证项目结构加固情况和建筑改造前后的节能效果等，还可以对比改造前后使用者诉求达成情况与满意度情况等，可以分析未达预期的痛点，为后续项目提供设计优化和社会治理经验。\u003c/p>\n\u003cp>后评估时可参照本指南框架与内容开展工作。2为申请北京市城市更新项目相关政策支持与奖励提供参考。可参照“北京市住房和城乡建设委员会北京市财政局关于印发《北京市建筑绿色发展奖励资金示范项目管理实施细则（试行）》的通知（京建发〔2023〕191号）”“北京市发展和改革委员会北京市财政局关于印发《节能技术改造项目管理办法》的通知（京发改规〔2024〕6号）”等要求，改造项目节能量达到相应标准要求，可申请专项补助资金等。\u003c/p>\n\u003cp>可参照“北京市住房和城乡建设委员会关于印发《北京市城市更新项目库管理办法（试行）》的通知（京建法〔2024〕2号）”第十九条纳入本市城市更新计划的项目，可以“依法享受行政事业性收费减免，优先纳入市级资金支持范围，相关纳税人依法享受税收优惠政策。按照本市城市更新项目土地价款管理规定、建筑功能混合管理规定，享受相关政策支持。\u003c/p>\n\u003cp>鼓励金融机构对项目给予基金、信贷等金融\u003c/p>\n\u003cp>5支持，开展住房公积金支持城市更新项目试点”等。4.1.6体检评估的核心目标是全面、系统地梳理与呈现既有建筑的现状与问题，并在此基础上通过对照改造目标适用的设计与技术的标准和规范，分析未来在改造时可能面临的风险与难点、潜力与优势，为改造设计与技术方案比选、改造工作决策提供技术参照。\u003c/p>\n\u003cp>4.1.7体检评估应结合选取的要素特点，选用定量或定性等适宜的方法开展体检评估。可量化要素宜通过检测鉴定进行定量评估，不可量化要素宜采用专业经验判断、综合对比等方式进行定性评估。定量分析主要用于可以通过仪器检测、物理实验或数学计算获得精确数据的方面，例如房屋结构安全、消防设备设施与产品、机电设备设施与产品等方面的检测、检验与鉴定，以及经济相关的测算等。\u003c/p>\n\u003cp>定性分析主要用于难以用精确数据衡量，需要依据专业经验、主观感知或价值判断的方面，例如建筑的外观损伤、文化象征、艺术特色、功能缺陷等。在体检评估中，可通过证据链支撑法、多源信息交叉验证法、多专业会商、专家评议法等方法提升科学化水平。4.1.8体检评估中，应建立多专业会商的工作机制，结合体检评估内容，选取涉及的相关专业人员共同研判，形成共识结论，必要时应引入专家评审机制。\u003c/p>\n\u003cp>4.1.9体检评估中，评估人员应重视对原始记录、影像资料、检测鉴定数据的留存，记录的信息应字迹清晰、信息完整。其中，定性类判断应注重现场照片、访谈记录、会议纪要、历史资料引证等支撑材料的留存。4.1.10体检评估中，当项目所在片区开展了片区体检的，应加强与片区体检的衔接、重视对片区体检结果的应用。\u003c/p>\n\u003cp>片区体检成果中存在与既有建筑改造体检评估工作紧密相关的，可直接引用。4.1.11体检评估流程主要包括体检评估准备、现状调查、检测鉴定、报告编制。4.2体检评估准备4.2.1技术咨询服务团队应会同项目统筹主体、实施主体策划并明确既有建筑改造体检评估的工作需求，确定体检评估对象与目标、范围与深度、周期等。\u003c/p>\n\u003cp>4.2.2技术咨询服务团队应结合项目需求成立体检评估项目组，当体检评估工作中涉及房屋建筑安全评估与鉴定等检测鉴定需求时，项目组中应包含具备相应资质的检测鉴定单位。4.2.3项目体检评估应根据实际情况与需求制定科学的工作计划与工作方案，应提出体检评估的对象与目标、体检评估资料现状与需求、计划体检评估的要素、体检评估的工作步骤与工作方法、人员分工、检测鉴定方案、进度计划及安全质量保障措施等，并提交项目统筹主体、实施主体确认。\u003c/p>\n\u003cp>4.3现状调查4.3.1现状调查需通过资料收集和现场踏勘，掌握既有建筑及建筑周边环境、公共空间、公共服务设施、交通接驳等方面的实际情况。4.3.2开展资料收集，应收集体检评估项目的基本资料，包括设计文件、上位规划、产权信息、交易记录、运维记录、获奖信息、社会评价等。4.3.3开展现场踏勘，应通过实地测绘、影像记录、人员访谈等方式，判断建筑的状况，是否有严重损坏、是否存在安全风险，建筑功能、空间、设施等是否满足上位规划要求、能否满足使用需求、是否满足现行标准与规范，了解机电系统的运行状况、设备运行年限、机电设备设施年维修维护费用等。\u003c/p>\n\u003cp>4.3.4当项目资料不全时，可通过三维激光扫描、无人机航拍、点云建模等数字化、科学化的技术手段，实现建筑现状信息完整、准确采集，为体检评估挖掘问题与优势提供保障，为改造设计提供基础。当出现下列情形之一时，应利用上述技术手段进行现状信息采集，数字化成果应生成高精度模型或图档，并纳入体检评估报告附件，作为后续设计与审查的技术依据。\u003c/p>\n\u003cp>61建筑图纸严重缺失或与现状严重不符；2建筑结构复杂、存在加建改建历史且难以人工测量；3涉及文物保护控制区、历史文化街区或风貌保护要求较高的区域；4存在高空作业风险或人员无法进入的空间（如屋顶、夹层、设备间等）。4.4检测鉴定4.4.1在现状调查基础上，结合项目实际需求，确定既有建筑改造前需要检测鉴定的技术内容。\u003c/p>\n\u003cp>4.4.2检测鉴定主要包括房屋建筑安全评估，房屋结构综合安全性鉴定，机电设备设施与系统检测、检验与评估，消防安全评估或消防专业技术评价，人防专业技术评价等。房屋建筑安全评估报告、房屋结构综合安全性鉴定报告、消防安全评估报告可为安全方面的“建筑结构（含地基基础）的安全性和抗震性能”“消防专业技术的安全性”提供量化判断的技术支持。\u003c/p>\n\u003cp>“机电设备设施与系统的工程质量评估或检测、检验报告”可为安全方面的“机电系统的安全性”和功能方面的“机电系统利旧情况”提供判断的技术支持，体检评估的具体内容、深度、格式应结合项目需求、参照现行机电检测、检验与评估规范执行。人防专业技术评价具体内容、深度、格式应结合项目需求、参照现行人防工程、产品相关质量检测规范执行。\u003c/p>\n\u003cp>4.4.3检测鉴定应由具有相应资质的单位实施，并按照管理要求出具相应报告。4.5报告编制4.5.1体检评估报告内容应真实、简洁、全面地阐述体检评估情况，并参照“附录7.1北京市既有建筑改造体检评估报告提纲”研编。其中，体检评估要素判断应依据现状调查和检测鉴定结果开展。4.5.2体检评估报告内容包括但不限于文字、照片、图纸、表格。\u003c/p>\n\u003cp>4.5.3体检评估报告编制应由项目负责人与牵头专业整体统筹，其他涉及专业与专项参与。4.5.4体检评估报告交付时应加盖承担体检评估工作单位的公章，项目负责人签字；当承担体检评估工作的单位为联合体时，应加盖牵头单位公章。4.5.5体检评估报告中涉及的项目相关原始资料等，应与体检评估报告一起归档保存。\u003c/p>\n\u003cp>75体检评估要素5.1要素选用总体要求5.1.1体检评估要素包括技术与管理两个层面。5.1.2结合既有建筑改造问题挖掘、不同主体的需求分析与规划设计要求，技术层面要素细化为安全、文化、功能、环境、效益5个维度。5.1.3结合既有建筑改造管理审批职责的要求，管理层面要素细化为改造内容的合规性、实施程序的合规性和资源保障与效能提升3个维度。\u003c/p>\n\u003cp>5.1.4体检评估要素包括应选、宜选两种类型，实际工作中应结合项目所处区位、项目类型、项目阶段与实际需求，选用适宜的体检评估要素。不同区位、典型城市更新类型的体检评估要素清单构建可参考“附录7.3北京市既有建筑改造体检评估要素选用参考”。既有建筑改造体检评估时，关于宜选要素，可结合项目具体需求自主策划。\u003c/p>\n\u003cp>可选择单一维度，如只选用安全维度的要素；也可选用多个或全部维度。5.1.5体检评估要素选用时，应关注与总体规划、详细规划、相关专项规划要求的衔接，深入挖掘与分析不同主体的需求，综合考虑项目运营目标与需求，结合需求预研改造设计可能面临的问题与优势。5.1.6体检评估要素选用应坚持安全为底线、刚性优先、刚弹结合的原则，重视保障公共利益、提升品质、坚持绿色发展、和谐宜居的总体要求。\u003c/p>\n\u003cp>安全与文化维度应优先体检评估。安全维度应开展全面的体检评估。在对文化具有特殊要求的区域和类型，如首都功能核心区，文化维度的体检评估应优先于其他维度。功能、环境与效益维度对未来实现高品质改造具有重要影响，宜结合项目特点与需求综合评估。5.1.7体检评估要素选用还应满足以下要求：1需结合项目特点与需求选用体检评估的要素，宜分类引导、按需深化。\u003c/p>\n\u003cp>体检评估内容应能全面覆盖改造目标、改造计划、改造设计方案制定工作，并满足管理审批需求。2项目涉及房屋建筑安全性能检测评估的，应包含“安全”维度的全部要素。3应结合项目管理环节的需求确认要素体检评估的深度。项目申报纳入储备项目库的，可开展初步体检评估，以定性判断为主；项目申报纳入实施项目库的以及需开展实施方案编制与联合审查的，应开展全面体检评估、涵盖检测鉴定，包括房屋结构安全、消防安全等方面。\u003c/p>\n\u003cp>4当体检评估对象为建筑群中的某一单体或建筑某一局部时，体检评估要素选用应充分考虑非改造部分和改造部分因为衔接可能产生的问题，确定的体检评估要素应能够覆盖上述问题，并需综合考虑对改造有影响的方面。5体检评估效益维度中的经济效益，应结合项目类型、聚焦核心价值，与其他体检评估要素统筹协同，实现从单一的静态分析转向多方的动态权衡。\u003c/p>\n\u003cp>为有效服务于社会与城市发展的总体目标，体检评估要素选择应服从效益评估的总体要求，在经济可行的基础上，统筹考虑环境与社会效益，提升项目长期综合效益。5.2安全安全是改造中的红线与底线，体检评估主要聚焦建筑结构（含地基基础）、机电系统、消防专业技术、防护系统4个方面。建筑结构（含地基基础）主要体检评估场地与地基基础、上部承重结构的安全性和抗震性能；机电系统主要体检评估机电系统与设备设施的基本情况及其运行维护是否满足安全要求，是否存在安全风险与隐患；消防专业技术主要体检评估消防系统设计、消防系统运行、消防管理是否满足既有或现行规范的安全要求；防护系统体检评估主要评估除结构、机电、消防外其他场地与建筑系统\u003c/p>\n\u003cp>8的安全性。5.2.1建筑结构（含地基基础）的安全性和抗震性。1场地与地基基础。核查房屋建筑岩土工程勘察报告和基础设计、地基处理设计、施工验收等资料；核查场地周边的地质情况，关注地下水位的变化趋势；核查地基基础缺陷损伤和沉降情况，包括但不限于不均匀沉降所引起的上部结构反应；核查周边建筑的支护桩锚杆对本楼地基、复合地基或桩基的扰动情况；核查设计的抗震设防烈度是否符合北京市各区县抗震设防烈度和《建筑工程抗震设防分类标准》（GB50223）的要求；参考《房屋建筑安全评估技术规程》（DB11/T882）对地基基础进行评级；在需要时（如资料不全时等），依据《房屋结构综合安全性鉴定标准》（DB11/T637）对地基基础进行检测鉴定，必要时应对场地地基进行补充近位勘察。\u003c/p>\n\u003cp>2上部承重结构。核查房屋建筑原结构和改扩建建筑竣工图、结构竣工图（包括人防结构）、幕墙竣工图及施工资料等；核查结构设计荷载标准值，核查结构布置、支撑、结构构件联系等情况，核查结构上实际的作用、建筑所处环境与使用历史情况，核查构件承载力情况，核查抗震构造措施的楼层抗侧力构件和其他构件抗震承载力情况，核查房屋结构易损伤构件（如悬挑阳台、挑檐、女儿墙等）状况；核查设计的抗震设防烈度情况是否符合北京市各区县抗震设防烈度和《建筑工程抗震设防分类标准》（GB50223）的要求；参考《房屋建筑安全评估技术规程》（DB11/T882）等对上部结构进行评级；在需要时（如资料不全时等），依据《房屋结构综合安全性鉴定标准》（DB11/T637）等对上部承重结构进行检测鉴定，或依据相关规范进行专项检测鉴定。\u003c/p>\n\u003cp>5.2.2机电系统的安全性。本部分主要体检评估机电系统现状的安全性。1给排水系统。核查设施设备、管道及其连接材料等是否安全耐久；设施设备、管道及其连接的保温、防冻、消毒等防护措施是否安全有效。核查设备设施运行是否存在明显振动、异常声响。核查设备设施是否到达使用年限。核查给水排水设备能力、管道和阀门的渗漏和损坏状况等。\u003c/p>\n\u003cp>核查给水、排水、消防等水管管道和设施设备是否存在老化破损、跑冒滴漏、供给不足、管道堵塞等问题。评估水资源利用现状，是否满足现行规范。如有非传统水源利用，核查是否采取保障使用安全的措施。核查是否存在供水水泵运行中断、设施设备故障；排水设施堵塞、爆裂；地下建筑被雨水倒灌等问题，例如地下建筑出入口、窗井、通风井等是否有有效防雨水倒灌措施。\u003c/p>\n\u003cp>核查设施设备、管线等是否有合理的检修操作空间。核查管道、设备等的保温状况是否满足改造后的使用要求。管道铺设区域按照现行规范要求进行核查。参考《房屋建筑安全评估技术规程》（DB11/T882）等对给排水系统进行安全评估。2暖通空调系统。核查供暖、空调系统的设施设备是否满足系统的供给能力；设施设备、管道及其连接的保温、防冻、消毒等防护措施是否安全有效；核查设备和管道承压能力是否满足改造后的运行要求；核查设备设施是否满足检修、维护要求，损坏情况是否能够及时维修处理；核查设备设施运行是否存在明显振动、异常声响；核查设备设施是否到达使用年限。\u003c/p>\n\u003cp>核查设施设备、管线等是否有合理的检修操作空间。核查管道、设备等的保温、保冷状况是否满足改造后的使用要求。管道铺设区域按照现行规范要求进行核查。参考《房屋建筑安全评估技术规程》（DB11/T882）等对暖通系统进行安全评估。3电气系统。核查电气设备系统的运维管理情况，是否有良好的运维管理制度、维护措施和运维检修记录；核查（变）配电装置的完整性、电气故障发生时自动切断电源功能；核查电气装置以及关键元器件的使用年限、防护等级，备品存量及供货周期；核查各机电用房、淋浴间、泳池、厨房等潮湿场所等电位联结的情况，有爆炸危险场所防静电措施的实施情况等。\u003c/p>\n\u003cp>检测接地阻值是否满足现行规范要求，并参考《房屋\u003c/p>\n\u003cp>9建筑安全评估技术规程》（DB11/T882）等对建筑防雷系统进行安全评估。参考《电气防火检测技术规范》（DB11/T065）等直观检查变配电装置、低压配电线线路、照明装置和一般低压用电设备的外观情况，如老化、腐蚀、异响等现象；检查线缆外观、型号规格、敷设线缆的金属线槽及附件的情况，支吊架固定的是否可靠，是否满足现行规范要求。\u003c/p>\n\u003cp>必要时通过采取仪器检测，验证电器元件与线路的连接情况，是否存在温升异常、电弧痕迹等现象。核查运维管理情况是指由电力主管部门按照《配网设备检修试验规程》（DL/T1753）、《电力设备预防性试验规程》（DL/T596）等现行规程进行的检查记录是否完备。配网设备除直观检查外，其余仪器检测、试验环节进行前，均应向电力主管部门提出申请，在取得其书面许可后，方可开展。\u003c/p>\n\u003cp>发电机应有完备的定期运维管理制度及维护记录。5.2.3消防专业技术的安全性。结合工程实际参考《社会单位消防安全评估规范》（DB11/T2279）或《北京市既有建筑改造工程消防设计指南》中的附录和附表“既有建筑改造消防安全评估表”等开展体检评估。1消防设计。核查场地布局的安全性，包括消防车道与消防车登高操作场地、安全疏散与避难设施、建筑防火分区、防火分隔，建筑结构耐火，内部和外部装修、灭火设施，消防给水设施，防烟和排烟设施，火灾自动报警系统、应急照明和疏散指示系统、事故通风设施等是否满足现行消防规范要求。\u003c/p>\n\u003cp>参考《社会单位消防安全评估规范》（DB11/T2279）、《消防设施通用规范》（GB55036）、《建筑设计防火规范》（GB50016）、《建筑防火通用规范》（GB55037）、《建筑内部装修设计防火规范》（GB50222）等核查。2消防系统运行。核查消防设备设施的运行情况和安全性，是否满足消防设计、消防验收等相关现行规范要求。\u003c/p>\n\u003cp>电气专业消防设备设施主要包括：火灾报警控制器、消防联动控制器、消防控制室图形显示装置、区域显示器、各类火灾探测器、手动报警按钮、火灾警报器、可燃气体报警控制器、可燃气体探测器、消防应急照明灯具及备用电源、消防疏散指示标志灯具及备用电源、消防应急广播扬声器、消防电话总机、消防专用电话分机/插孔、电气火灾监控探测器等。\u003c/p>\n\u003cp>参考《建筑消防设施检测服务规范》（DB11/T3034）等核查。给水排水专业消防给水及灭火设施主要包括：室内外消火栓系统、自动喷水灭火系统、泡沫灭火系统、水喷雾及细水雾灭火系统、固定消防炮及自动跟踪定位射流灭火系统、气体灭火系统、干粉灭火系统、灭火器、厨房自动灭火装置等。消防给水及灭火设施的设备、管道、附属配件、阀门等，需要评估其现状渗漏情况、防冻、防爆措施、明显标识等。\u003c/p>\n\u003cp>建筑自然通风、防烟、排烟、消防补风、事故通风等设备设施保存和运行情况，包括自然排烟窗、自然排烟口、各类设备性能、各类消防风口和消防风量是否符合改造后功能现行消防技术标准。核查市政消防给水接口，校核市政消防供水管径、压力、流量等是否匹配改造后消防用水需求，参考《建筑消防设施通用规范》（GB55036）、《消防给水及消火栓系统技术规范》（GB50974）。\u003c/p>\n\u003cp>核查消防系统的运行情况和安全性，是否满足建筑消防设计、消防验收等相关现行规范要求。电气专业涉及的消防系统包括：火灾自动报警及联动系统、火灾警报和消防应急广播系统、消防专用电话系统、可燃气体探测报警系统、消防电源监控系统、防火门监控系统、余压监控系统、应急排烟窗联动系统、电气火灾监控系统、应急照明和疏散指示系统、消防设备配电系统等。\u003c/p>\n\u003cp>参考《建筑消防设施检测服务规范》（DB11/T3034）、《建筑消防设施检测评定规程》（DB11/T1354）等核查。3消防安全管理。消防管理是否安全合法，是否有合理的工作组织，建立完善的消防安全制度，配备相应的消防管理人员，负责消防巡查整改、设备设施维护管理、组织安全教育和培训等。\u003c/p>\n\u003cp>核查消防控制室、消防泵房的管理是否满足《消防设施通用规范》（GB55036）、《建筑防火通用规范》（GB55037）、《消防控制室通用技术要求》（GB25506）、《建筑消防设施的维护管理》（GB25201）、《消防给水及消火栓系统技术规范》（GB50974）等标准与规范的要求。\u003c/p>\n\u003cp>105.2.4防护系统的安全性。1场地。场地设计是否满足现行规范要求，是否采取合理有效防滑、防坠等防护措施，是否存在安全隐患。核查变电所、柴油发电机房、消防控制室、智能化机房、消防水泵房等主要电气与设备设施用房的选址情况，是否满足现行规范要求，参考《20kV及以下变电所设计规范》（GB50053）、《建筑电气与智能化通用规范》（GB55024）、《民用建筑电气设计标准》（GB51348）、《民用建筑通用规范》（GB55031）、《民用建筑设计统一标准》（GB50352）等核查。场地防洪、防涝是否满足现行规范要求，包括竖向设计、场地排水是否有效组织，场地排水系统安全，其点位布置、排水管道设置合理，排水能力保障安全，排水体系构建安全，防倒灌措施、应急排水等设施安全有效。2安防系统。场地与建筑的人力防范、实体防范、电子防范等安防系统配置和运行情况，是否有科学合理的规划、设计、运行和维护，是否满足现行规范要求。参考《安全防范工程通用规范》（GB55029）、《安全防范工程技术标准》（GB50348）、《安全防范系统运行与维护要求》（DB11/T855）、《安全防范系统运行检验规范》（DB11/T779）、《房屋建筑使用安全检查评定技术规程》（DB11/T1004）等检查安全技术防范子系统的相关内容。3外围护、外部设施。建筑外围护、外部设施等情况，如防水、保温、外墙饰面、雨篷、空调机位、广告箱、屋顶及屋顶设备设施等设计是否满足现行规范要求，是否保持完好，外部设施是否与主体结构连接稳固，是否存在安全隐患。4建筑内部空间。建筑室内装饰装修部品、部件、材料与设施是否有污染、毒害、辐射等危害，是否满足防腐、防水、防潮、防虫、防坠、防滑、防尘等要求，是否满足现行规范要求。建筑内部空间设计的防水、防潮、防坠、防滑、防汛等方面情况，如护栏、围挡的高度及其安装是否牢固、是否有锈蚀情况，卫生间、厨房等空间地面的防滑设计等方面，是否满足现行规范要求，是否存在安全隐患。建筑内部交通设施的安全性是否满足现行规范要求，其中在用电梯、扶梯、自动步道等是否满足《在用电梯安全风险评估规范》（DB11/T1520）等标准与规范的要求。5人防系统。建筑如涉及人防工程，核查其人防面积配置、主体空间、出入口、通风口、水电口、辅助房间、医疗救护工程、柴油电站等人防系统配置情况，是否满足现行规范要求；人防工程本身结构，设备、电气设施等的安全性，是否满足现行规范要求。6地下空间、地下水相关的防灾、减灾内容。地下空间防水措施、出入口防汛设计等方面情况，是否满足现行规范要求，核查易发生雨水倒灌的地下室是否配备止水阀、挡水板、防汛沙袋等防倒灌设施，强排措施是否运行正常，是否存在渗漏现象，易发生雨水倒灌的地下室是否配备止水阀、挡水板、防汛沙袋等防倒灌设施，强排措施是否运行正常。7其他需关注的防灾、减灾情况。核查市政燃气等供应系统是否满足系统供给能力，且设备和管道承压能力是否满足运行要求。核查燃气系统设备设施，如调压设备、管线、阀门、报警系统等是否满足系统工作要求。参考《管道燃气用户安全巡检技术规程》（DB11/1450）等对燃气系统进行安全评估。核查建筑是否考虑极端天气气候防范，如防风设计、应急降温和防过热能力等。\u003c/p>\n\u003cp>115.3文化文化是改造中的精神内核与人文底蕴，体检评估主要聚焦文化认同与象征性、历史资源、社会影响和艺术特色4个方面。文化认同与象征性主要体检评估建筑及其所在场地与城市特色风貌管控、独特文化体验的关系；历史资源主要体检评估建筑及场地中的历史要素情况及其历史价值；社会影响主要体检评估既有建筑改造与在地居民的关系及其影响，以及既有建筑在社会中的影响力；艺术特色主要体检评估既有建筑的美学价值和原创性。5.3.1文化认同与象征性。1建筑与城市设计、城市特色风貌管控的关系。调查场地分区与周边城市区域肌理协调的情况，是否适应北京的气候与地理环境；调查场地景观与北京城市环境、自然环境协调的情况，是否便于维护；调查建筑布局与周边城市区域肌理协调的情况，是否适应北京的气候与地理环境；调查建筑体量、尺度、外观、造型、色彩、材质等与北京城市环境、自然环境协调的情况；调查建筑退线是否满足相关要求；调查建筑高度是否满足航空限高、城市设计控高、文物保护限高等要求，突出屋面的附属房间与构筑物等是否影响建筑限高。调查场地设计、环境、景观，建筑布局、肌理是否满足历史文化保护和城市特色风貌管控的要求；调查建筑外立面、造型、色彩、材质、运用的建筑元素、符号、装饰等是否满足历史文化保护和城市特色风貌管控的要求；调查建筑构造、工艺等方面是否体现北京在地的建造观念与建筑技艺。2建筑与场地是否承载在地生活记忆，提供独特的文化体验。调查场地与建筑作为物质空间是否承载北京特色的生活记忆，引发情感共鸣；场地与建筑是否为北京相关非物质文化遗产活动或其他民俗活动等提供重要建筑空间与场所，提供独特的文化体验。5.3.2历史资源。1场地中的构筑物、植被（古树名木）的历史资源情况。调查场地内现存构筑物（如围墙、水井）及植被（尤其是挂牌古树名木）的形成年代、原始功能及与历史风貌的关联性，评估其作为历史环境要素的保护价值。2建筑主体竣工时间与阶段情况。调查建筑本体及各部分的建造年代、历次改扩建时间。重点关注是否有建筑主体竣工时间超过50年的情况，或者建筑建设于特色历史时期或具有重要时代特点的阶段的情况。3建筑与历史人物、历史事件、历史上的重要社团或机构的关系与资源情况。调查建筑是否承载重要历史事件、名人活动（如名人故居）或机构运营（如老字号商铺），提取可溯源的文献、影像或口述史证据。4建筑设计师的历史价值。识别建筑设计师的身份，结合其作品流派、技术贡献及行业影响力，分析并判定设计者赋予建筑的文化价值。5建筑历史信息的完整性情况。调查建筑具有历史价值的原始信息留存是否完整。包括建筑结构材料、工艺工法、空间形式等方面是否得以完整保留，是否有效传达。6建筑历史信息脆弱性情况。调查建筑承载和记录的历史信息是否容易被破坏，是否存在环境威胁、需要及时抢救。7建筑的代表性和稀缺性情况。建筑的代表性主要指其作为特定历史时期、文化类型或技术成就的典型物证，稀缺性则体现为其作为不可再生、存世稀少的珍贵遗存所独有的历史价值。5.3.3社会影响。1建筑改造和城市功能、周边居民的关系。调查建筑改造后是否可以补充完善街区城市功能，是否可以为周边居民丰富生活体验、提升幸福感\u003c/p>\n\u003cp>12提供支撑，例如提供多种多样丰富的活动场所和空间从而丰富业余生活提升幸福感；在建设项目实施和运营管理等方面是否建立了健康良好的公众参与机制，是否推动建立了良好的邻里关系，凝聚社区情感等。2建筑获得过的奖励及其在社会上的影响。调查建筑获得的奖励（社会、行业内）在全国、区域、本市范围内具有的影响情况。\u003c/p>\n\u003cp>5.3.4艺术特色。1建成环境在形式美学、设计水平等方面的艺术性。调查场地设计（景观、构筑物、室外家具等）、建筑形式与空间是否具有设计感、艺术性与美学价值，并与项目定位、周边环境协调，体现技术性、功能性与艺术性的完美融合。2建筑的原创性，体现时代特点与创意创新的情况。调查建筑设计的手法是否具有原创性，体现时代特点，或是某一流派的代表作；或者在局部构造、材料等方面运用上具有新意。\u003c/p>\n\u003cp>5.4功能功能是改造中实现高品质的核心载体，体检评估主要聚焦空间设计与更新改造利用、室内外交通、室内外环境、机电系统利旧、服务设施配置、创新专项应用6个方面。空间设计与更新改造利用主要体检评估既有建筑空间是否满足改造要求；室内外交通主要体检评估室内外交通设计和设施设置等方面是否合理便捷；室内外环境主要体检评估室外环境、室内声光湿热等物理环境和品质是否满足健康、舒适、宜人的使用需求；机电系统利旧主要体检评估机电系统持续使用的潜力；服务设施配置主要体检评估建筑中服务设施的类型、功能、使用满意度、作用范围，以及改造是否对周边服务设施提升与完善具有促进作用；创新专项应用主要体检评估建筑对无障碍、适老化、智慧建筑等先进理念的应用情况和改造潜力。\u003c/p>\n\u003cp>5.4.1空间设计与更新改造利用情况。1场地分区与布局、尺度，是否满足改造后使用需求。2空间布局、尺度，是否满足改造后功能、工艺需求。3空间使用情况，是否有活力，是否可以灵活使用、复合功能利用。体检评估建筑空间和使用者活动需求的匹配度，空间是否具备可改造性，如补充架空层、功能转换等。\u003c/p>\n\u003cp>4空间营造品质。建筑空间的营造是否契合功能，是否为使用者提供良好的空间体验；是否获得使用者较高评价。5改造更新运营策划情况。改造前是否开展了运营策划、是否明确了运营目标与需求，是否系统研究了既有建筑结合运营目标与需求的可用性和适用性；项目是否对改造后的运营模式进行专业研究与分析。\u003c/p>\n\u003cp>5.4.2室内外交通情况。1建筑室内交通流线组织情况。建筑内部空间平面人行系统设置情况，出入口、门厅、走廊及交通空间连接关系和尺度、各类流线设置；建筑内部楼梯、台阶、坡道、电梯、扶梯、自动步道等人行垂直交通设置情况；车行交通与停车场库规划布置、容量情况；货运、垃圾分类及清运等物流组织情况；建筑内部的交通流线组织是否契合建筑功能需求，尤其是如客运枢纽、医院、剧场等特殊功能的交通流线组织需求；上述交通设置是否合理、便于使用、提供连贯的无障碍通行流线。\u003c/p>\n\u003cp>2场地内人、车、物流线规划等交通组织情况，及其与周边城市交通衔接情况。场地的人、车、物流道路是否规划合理，道路宽度、铺装等是否满足相关规范要求，各类流线是否指示明确；停车容量，是否满足使用需求；场地出入口设置是否合理，是否人、车分行，是否影响附近\u003c/p>\n\u003cp>13公交场站，是否满足现行规范要求，参考《民用建筑设计统一标准》（GB50352）等相关要求；场地道路是否与城市道路合理衔接；场地的交通流线组织是否契合建筑功能需求，尤其是如客运枢纽、医院、剧场等特殊功能的交通流线组织需求；上述交通设置是否合理、便于使用、提供连贯的无障碍通行流线。\u003c/p>\n\u003cp>5.4.3室内外环境情况。1室外环境。场地微气候环境营造情况，包括通风、遮阳、铺装与植被的渗透与蒸发、隔绝噪声等方面，是否采取有效措施，场地的声、光、湿、热方面指标是否满足现行标准规范；使用者的健康感受与舒适度。场地空间与景观情况，包括公共活动空间、休憩场所等空间，绿化植被、铺装、照明等场地景观要素是否合理设置，是否提供优质的观赏和体验感受。\u003c/p>\n\u003cp>2室内声环境。室内空间混响时间、噪声等级、隔声性能等方面情况，是否满足功能、工艺和相关标准与规范要求；舒适度是否获得使用者较高评价。3室内光环境。室内日照时数，自然光照度和均匀度，人工照明照度、均匀度、显色性等光环境参数等光环境质量情况，是否满足功能、工艺和应执行的规范要求；备用照明设置是否满足相关标准与规范要求；舒适度是否获得使用者较高评价。\u003c/p>\n\u003cp>4室内湿、热环境。室内湿、热环境参数情况，是否满足《民用建筑供暖通风与空气调节设计规范》（GB50736）等标准与规范的要求，是否满足功能、工艺要求；舒适度是否获得使用者较高评价。5室内空气品质。室内空气品质情况，是否满足《室内空气质量标准》（GB/T18883）、《民用建筑工程室内环境污染控制标准》（GB50325）、《公共场所卫生指标及限值要求》（GB37488）等相关要求；是否实现更加健康的使用感受。\u003c/p>\n\u003cp>6建筑用水。建筑用水情况，是否满足《生活饮用水卫生标准》（GB5749）等相关要求；是否满足健康需求。5.4.4机电系统利旧情况。本部分主要体检评估机电系统在满足现状安全的基础上、面向改造后的新需求，是否可以再利用。1给排水系统利旧。采用水质检测、管道压力测试、阀门启闭测试、计量表读数和现场勘察等方式，评定设施设备、管道、阀门附件的渗漏和损坏状况。\u003c/p>\n\u003cp>检测评定水泵、换热器等设施设备的系统供给能力。调查是否采用节水产品，根据相关节水标准评定用水器具。核查市政给水、市政雨污水系统。结合上述内容，判断其是否满足现行规范要求和改造后的使用需求。2暖通空调系统利旧。采用冷热量检测、风量检测、能效检测、管道压力测试、阀门启闭测试等方式，评定设施设备、管道、阀门附件的渗漏和损坏状况。\u003c/p>\n\u003cp>检测评定供暖、通风、制冷、空调等设施设备的系统供给能力。宜采用现行节能标准；能效等级宜达到良好及以上，应不低于及格或达标。评估各类用能设备及产品的能效等级和性能参数。核查市政或区域热力、区域供冷等暖通空调能源供应系统。结合上述内容，判断其是否满足现行规范要求和改造后的使用需求。3电气系统利旧。\u003c/p>\n\u003cp>电气系统核查以下内容：市政电源条件、自备电源情况；主要设备参数；高低压电缆选型及敷设方式；电气设备和供配电线路外观情况；防雷接地装置及其连接情况；照明光源、灯具选型、照明系统的控制方式；电气系统运行噪声、电磁兼容性等情况；电气相关机房设置位置、占用空间、土建预留预埋条件等情况。上述内容是否满足现行规范要求和改造后的使用需求。\u003c/p>\n\u003cp>电气系统占用的既有空间，能否适用于改造目标功能，是否可以利用。对建筑智能化系统进行信息设施系统、信息化应用系统、安全防范\u003c/p>\n\u003cp>14系统、智能化集成系统等进行核查，结合改造后的建筑功能和使用需求以及《智能建筑设计标准》（GB50314）、《建筑电气与智能化通用规范》（GB55024）等相关标准及规范要求提出利旧建议。4建筑设备设施等材料回收。按照国家的产品材料回收体系，考虑再利用、再制造、再生利用、废物处置的不同层级，体检评估既有建筑改造中的相关设施设备及其内部部件、零件、材料的回收利用情况。\u003c/p>\n\u003cp>其中换热器、压缩机、壳体、电机、叶轮、铜管等有色金属属于高价值可回收材料，不锈钢管、镀锌钢材、无缝钢管、其他管材属于可降级再利用或再生利用的原料，陶瓷洁具、塑料管材管件等可破碎后作为骨料再生利用。优先考虑设备设施整体或部件在原功能或降级功能下的直接再利用；无法直接利用的，应优先拆解其有价值部件进行再制造或作为备件使用；无法再制造的，应将其作为再生资源回收原材料，最大限度减少最终处置量。\u003c/p>\n\u003cp>工作中可参考相关标准及规范执行，如《含有色金属固体废物回收利用技术规范》（GB/T41012）、《废弃电器电子产品回收规范》（GB/T45070）、《再生铜合金原料》（GB/T38470）、《再生铜原料》（GB/T38471）等。5.4.5服务设施类型与配置情况。当建筑中包含服务设施类功能时，或建筑是公共服务设施或基础服务设施时，宜评估本项要素。\u003c/p>\n\u003cp>1服务设施的类型与规模。调查服务设施类型、规模、容量等的基本情况，配置是否便捷、灵活、高效，是否与改造后功能匹配、且满足现行规范要求、或具备改造至符合要求的潜力。2服务设施的设计水平。服务设施设计水平，是否做到精细化设计与控制；满意度是否获得使用者较高评价。3服务设施的作用范围。\u003c/p>\n\u003cp>服务设施的作用范围与影响力，是否与街区内现状各类公共服务设施存在互补、互益的作用。5.4.6创新专项应用情况。1全龄友好环境建设。场地与建筑是否在空间设计、器具与产品配置方面体现无障碍、适老化、儿童友好理念，如是否在材质和颜色方面考虑老年人可能存在的认知障碍，尖锐部分是否采取防撞处理等，是否满足现行规范要求、或具备改造为全龄友好建筑的潜力。\u003c/p>\n\u003cp>体检评估方面可参考《建筑与市政工程无障碍通用规范》（GB55019）等相关要求。2花园城市建设。场地与建筑是否对首都花园城市建设进行创新探索与落实。例如，场地是否采用绿化、低碳种植模式，是否实践雨水花园设计理念，建筑是否采用立体绿化、屋顶绿化形式等。3智慧科技应用。场地与建筑是否采用智慧管理、智慧消防等智慧化技术，智慧系统应具备开放性、前瞻性与协同性，应用情况重点体检评估其技术先进性、可升级性及与智慧城市体系的衔接能力。\u003c/p>\n\u003cp>技术上是否采用主流物联网架构；系统是否具备模块化设计和标准接口，支持功能扩展与升级；是否预留与城市级平台（如CIM、能耗监测、应急指挥系统）的数据对接通道，数据格式是否符合城市标准，能否响应城市侧指令。4健康科技应用。场地与建筑空间，设备设施，室内外环境，室内污染源控制，声、光、热、电磁环境等是否应用了健康科技，是否满足《健康建筑设计标准》（DB11/2101）、《健康建筑评价标准》（T/ASC37）等相关标准和规范要求，是否有提升健康属性的改造潜力。\u003c/p>\n\u003cp>以及应用的健康科技系统是否完整、技术是否先进，是否为改造后的更高层次健康要求升级预留空间。5其他创新专项应用。场地与建筑设计是否融入分时共享空间等设计与空间等方面的创新性理念，是否应用安全韧性等建\u003c/p>\n\u003cp>15筑工程领域创新性专项技术，是否应用人工智能等社会新兴领域创新性技术等。5.5环境环境是改造中可持续发展的重要支撑，体检评估主要聚焦上位规划和发展定位落实情况、公共活力建设与促进情况、生态环境与绿色低碳3个方面。上位规划和发展定位落实情况主要体检评估既有建筑的类型、用地、功能、业态、规模是否符合上位规划和发展要求；公共活力建设与促进情况主要体检评估既有建筑改造对城市公共活力和公共利益的促进情况；生态环境与绿色低碳主要体检评估既有建筑改造在资源节约、降碳方面的作用和影响。\u003c/p>\n\u003cp>5.5.1上位规划和发展定位落实情况。1项目类型与改造方式。改造项目的类型、定位、改造方式是否符合《北京市城市更新条例》，是否符合上位规划，如总体规划、详细规划、相关专项规划、相关城市设计导则等要求。2项目用地、业态、功能复合利用方面。改造项目用地性质和改造功能是否匹配，改造后功能是否符合《建设项目规划使用性质正面和负面清单》要求，对城市功能体系、片区、街区功能完善与提升是否具有促进。\u003c/p>\n\u003cp>项目改造中是否考虑了功能复合利用，改造后业态是否对街区经济发展、社会服务等方面提升、优化具有正向的促进作用。3项目现状和改造后的规模、高度、建筑色彩、城市天际线等对上位规划的响应与落实情况。项目现状和改造后规模、高度、建筑色彩、城市天际线等是否影响区域限高、城市的景观视廊、城市风貌等。\u003c/p>\n\u003cp>5.5.2公共活力建设与促进情况。1项目改造定位与目标的公共性。项目在改造策划中是否综合考虑城市发展公共利益要求、追求公平正义的空间使用感受，设置激发城市公共活力的策略与功能等。2项目改造中空间设置与举措的公共性。场地与建筑是否结合城市与街区的需求和自身功能特点设置积极正向、开放共享的空间与举措，是否在使用与管理中积极向城市与周边社区开放，维护了公共利益、对公共活力具有正向的促进作用与良好导向。\u003c/p>\n\u003cp>场地环境、既有建筑的功能、形式、沿街立面等是否体现公共开放性质，是否能为使用者提供均好的感受。5.5.3生态环境与绿色低碳情况。1场地环境的生态性与绿色低碳。场地环境中是否设置了生态廊道等绿色生态技术措施，是否有利于保护地方物种多样性、生态修复、节能环保。场地中土地资源利用是否集约，分区、景观布局等是否紧凑，是否合理利用开发地下空间。\u003c/p>\n\u003cp>场地是否考虑立体绿化、场地自然渗水等措施，从而促进缓解城市热岛效应、适应气候变化。2既有建筑节能。建筑围护结构的热工性能是否满足现行国家及地方标准规范。结合给排水、暖通空调、电气设备设施铭牌参数评价能效等级情况，是否满足国家建筑现行节能标准，是否采用了节能措施，节能效果是否良好、高效。\u003c/p>\n\u003cp>参考《既有公共建筑节能绿色化改造技术规程》（DB11/T1998）等进行核查。根据节能综合评估情况，判断围护结构热工性能及建筑气密性是否满足既有建筑当时执行的技术标准，判断设备设施能效是否满足既有建筑当时执行的技术标准。综合评估既有建筑的能耗水平、建筑综合节能率、建筑本体节能率、建筑气密性、可再生能源利用率。\u003c/p>\n\u003cp>暖通空调系统改造前需进行节能诊断；是否不采用电直接加热设备作为供暖热源和空气加湿热源；是否根据当地气候和自然资源条件，考虑系统费效比，合理选择给水、生活热水、排水、暖通空调系统形式，合理利用可再生能源，并优化以下参数：供暖空调系统和集中生活热水的冷热源机组能效，集中\u003c/p>\n\u003cp>16供暖系统热水循环泵的耗电输热比，通风空调系统风机的单位风量耗功率，空调冷热水系统循环水泵的耗电输冷（热）比；是否采取措施降低部分负荷及部分空间使用下的暖通空调系统能耗；是否合理设置建筑内空调系统末端装置独立调节设施、用能计量装置和能耗管理系统；是否合理利用自然冷源进行降温；是否合理设置建筑余热回收装置。\u003c/p>\n\u003cp>体检评估设施设备的能效等级，建议优先推广使用节能产品。是否合理设置能源管理系统，有效检测能耗和碳排放数据；实现“按需供给”的智能调控能力。当需要针对能效给出定量参考时，可参考《民用建筑能效测评标识标准》（DB11/T1006）等测评。3既有建筑节水。既有建筑的节水器具、设备和系统情况。\u003c/p>\n\u003cp>是否合理利用非传统水源，根据投资、管理情况合理分质用水；给水系统是否合理确定服务范围和竖向分区，避免超压出流；是否采取有效措施避免管网漏损；是否按供水用途、管理单元或付费单元设置用水计量装置；是否使用较高用水效率等级的卫生器具；绿化植被采用节水灌溉方式；空调冷却设备或系统采用节水技术或措施。\u003c/p>\n\u003cp>参考《绿色建筑设计标准》（DB11/T938）第7.2.13条得分最低要求。场地与建筑整体分质用水设计情况。调查场地与既有建筑是否采用再生水，以及再生水的处理方式和运行效率，如回收自行处理回用，优先利用市政中水水源，自建中水系统或沿用之前的中水系统等。未设置独立中水系统的项目，调查其改造后新增中水供水系统的可能性，利用已有的市政中水水源或为接入市政中水预留条件等。\u003c/p>\n\u003cp>空调冷却水系统等用水量大的设备设施，调查其节水潜力，以及是否满足绿色低碳要求和相关现行规范。4既有建筑节材。建筑材料是否合理地选用了建筑结构材料与构件，是否合理选用可再循环材料、可再利用材料及利废建材，装修选用工业化内装部品，并且可以继续利用。5既有建筑固废。既有建筑生活垃圾、废水等排放情况，是否支持废弃物再利用与处理，是否有利于环境保护。\u003c/p>\n\u003cp>6既有建筑可再生能源应用情况。根据项目负荷特点和资源条件，进行不同可再生能源的适宜性分析；根据适用条件和投资规模，确定可再生能源用能比例或保证率。5.6效益效益是改造中价值目标的多维平衡与综合呈现，其中经济性是关键标尺，体检评估主要聚焦改造前原有经济情况、改造投资及资金平衡情况、改造运营情况3个方面。\u003c/p>\n\u003cp>改造前原有经济情况主要体检评估项目改造前现状具有的经济价值；改造投资及资金平衡情况主要体检评估既有建筑改造意向方案的成本估算、资金平衡情况；改造运营情况主要体检评估既有建筑改造带来的经济、环境及社会效益及项目运营的可持续性。5.6.1改造前原有经济情况。1既有建筑改造前经济价值。\u003c/p>\n\u003cp>建筑现状承重结构、围护结构、部品部件、装饰装修、构筑物等实体构件和设备设施以及相关系统的更新潜力和经济价值；可以继续使用和循环利用的程度。2建筑区位、土地等附加的经济价值。建筑处于首都功能核心区、历史文化街区等特殊区域的附加经济价值；现状建筑红线范围内的土地价格与北京市同功能类型土地价格的对比情况及土地资源利用效率等。\u003c/p>\n\u003cp>5.6.2改造投资及资金平衡情况。\u003c/p>\n\u003cp>171改造方案投资。改造更新方案投资估算，反映更新改造投资规模及费用组成情况。2改造方案经济指标。测算更新改造方案的单位面积或单位功能造价指标，反映项目更新改造投资标准。分析其与北京同类改造项目或本项目其他更新方案对比情况，反映改造方案的经济合理性。3改造投资资金平衡情况。根据项目改造投资估算及资金筹措计划，分析项目改造资金来源与使用动态平衡情况。\u003c/p>\n\u003cp>涉及专项资金或政府财政资金支持的，需评估项目支持资金平衡情况。5.6.3改造运营情况。1改造项目直接经济效益。对改造项目运营的直接经济效益进行预评估。对非经营性改造项目，评估改造项目财务生存能力及可持续运营能力；对经营性项目，评估改造项目盈利能力、偿债能力等，涉及财务指标如财务净现值、回收期及财务内部收益率等。\u003c/p>\n\u003cp>2改造项目间接经济效益。对改造项目运营的间接经济效益进行预评估。通过定性和定量分析，评估项目改造可能带来的间接经济效益，包括：使用者工作效率、使用者满意度及获得感，空间集约利用、资源整合能力，以及对企业文化与品牌形象的影响等。3改造项目环境效益与社会效益。对改造项目运营的环境及社会效益进行预评估。\u003c/p>\n\u003cp>通过环境效益与社会效益的综合分析，评估项目改造是否带来降低碳排放、资源有效利用及生态环境优化等环境效益，是否带来增加就业机会、促进社会稳定、带动就业、提升居民生活质量等社会效益。5.7管理管理是改造中保障效率的核心要素，体检评估主要聚焦改造内容的合规性、实施程序的合规性、资源保障与效能提升3个方面。\u003c/p>\n\u003cp>改造内容的合规性主要体检评估用地、环境影响评价、交通影响评价等是否满足政策要求；实施程序的合规性主要体检评估改造前更新需求征询等程序是否满足程序要求；资源保障与效能提升主要体检评估资金筹措等情况。5.7.1项目改造内容的合规性。1项目土地用途调整、用地保障是否符合国家和北京市相关政策要求。\u003c/p>\n\u003cp>2项目执行国有建设用地过渡期政策情况。3项目生态环境影响评价、交通影响评价及能源开发利用等是否符合相关要求。5.7.2项目实施程序的合规性。1项目执行北京城市更新管理程序的情况。项目实施程序应严格遵循北京市关于工程建设管理与城市更新管理的相关法律法规及基本建设程序要求。在体检评估时，应关注项目适用的实施与审批管理的流程，审批过程中涉及的行政主管部门等，应预评估未来改造时在实施程序合规性方面可能面临的问题。\u003c/p>\n\u003cp>项目实施程序管理相关要求参考《北京市工程建设项目审批事项清单》《北京市城市更新实施方案联合审查管理办法（试行）》《关于优化本市城市更新项目审批服务推动并联办理的工作方案（试行）》等。2项目更新需求征询以及物业权利人对实施方案的协商表决情况。重点关注既有建筑改造工作中是否存在舆情风险，改造工程的实施条件是否充分，既有建筑改造是否会影响周边居民生活及周边建成环境等。\u003c/p>\n\u003cp>5.7.3项目资源保障与效能提升的落实情况。\u003c/p>\n\u003cp>181项目改造的资金筹措与落实情况。改造资金的来源、主体、数额、计划、周期，涉及的相关部门的决策意见或审批情况等。2项目改造产权与产权办理路径情况。项目现状产权情况，改造过程中是否涉及产权变更，如果涉及产权变更路径是否清晰、明确。3项目改造产业策划和利用效率评价。\u003c/p>\n\u003cp>196体检评估报告6.1体检评估结论6.1.1体检评估结论的形成，应经过单维度要素体检评估结论分析与全维度要素综合体检评估结论分析两个主要步骤。6.1.2单维度要素体检评估结论分析时，应说明体检评估项目选定要素的现状基本情况、改造设计难点与问题、改造优势和改造建议。1现状基本情况，应总结既有建筑在体检评估时基本性能水平与现状使用情况。\u003c/p>\n\u003cp>2改造设计难点与问题，应结合既有建筑的改造意向提炼改造设计需执行的规范与标准、分析执行难点，以及其他可能影响改造工作、需提示的问题。3改造优势，应结合现状基本情况，提炼对改造有利的条件以及改造时宜充分挖掘、利用的资源与价值等积极因素。4改造建议，应结合改造设计难点与问题、改造优势，综合分析两者对改造工作的影响程度，并提出四种方向性建议：应改、宜关注问题、宜关注优势、无特殊影响。\u003c/p>\n\u003cp>应改：指在改造前必须明确解决方案、否则影响改造的底线问题，主要出现在应选要素中发现不满足强制性标准规范要求的情况下。宜关注问题：指在改造中可能出现风险与难点，宜在改造过程中需重点关注的问题，主要出现在宜选要素中发现不满足强制性标准规范要求的情况下。宜关注优势：指既有建筑现状存在值得在改造中保留或挖掘的条件、资源与价值，宜着重提醒关注的情况。\u003c/p>\n\u003cp>无特殊影响：指在改造中没有问题，也没有特别优势，对改造影响不大的情况。其中应改的重要性最强、宜关注问题与宜关注优势的重要性次之，无特殊影响的重要性最弱。6.1.3单维度要素体检评估结论分析时，应重点分析对改造可行性具有重大影响的问题和优势，以便于支撑提炼体检评估结论中重点关注问题。\u003c/p>\n\u003cp>“重大影响”通常指，存在重大安全隐患，对周边环境、社会稳定、经济发展带来不利影响以及潜在风险的情况。“优势”通常指，对改造可行性具有重大正面影响的积极条件或潜在价值。尤其当体检评估对象涉及文化要素时，应充分识别其通过保护与传承对地区文化带来的深远积极影响，包括但不限于：延续城市历史文脉、保存不可再生的建筑文化遗产、增强社区文化认同感与归属感、激发文化旅游活力并带动周边经济、彰显地域特色风貌等。\u003c/p>\n\u003cp>1问题应聚焦对改造具有决定性影响的底线问题。底线问题包括但不限于以下内容：安全：是否存在不符合现行规范强制性内容的情况，例如重大结构安全和消防安全隐患，或现状与改造需求在设计和实施上是否存在根本性冲突。环境：改造项目的功能、定位、规模、高度等是否符合上级规划要求和现行政策要求等。\u003c/p>\n\u003cp>效益：项目的成本、投入产出与改造后效益是否平衡，资金筹措方案是否可行等。管理：项目改造审批流程中是否会因与现行管理要求不符而无法推进的情况。2优势应是对项目定位、目标、改造意向、运营模式等项目特色挖掘具有重要积极影响的方面。优势包括但不限于以下内容：文化：既有建筑是否可体现北京“古都文化”“红色文化”“京味文化”和“创新文化”四大主题之一，或在某方面价值具有代表性等。\u003c/p>\n\u003cp>功能：机电设备运行状态良好，满足功能要求和现行标准规范，具有持续利用的价值。\u003c/p>\n\u003cp>20环境：已使用或具备条件在改造中引入绿色低碳技术、低碳足迹建筑材料等。6.1.4全维度要素综合体检评估结论分析时，应结合项目特点与要素体检评估的情况，统筹权衡、综合分析各维度之间的关系与重要性，综合分析各维度问题与优势之间是否存在制约、联动等关系，研判其对改造工作的影响程度与优先级，进而得出方向性改造建议。\u003c/p>\n\u003cp>6.2报告成果组成6.2.1体检评估报告应全面、精练地反映体检评估结论和体检评估工作过程；应文字精简，数据准确，资料详细可靠。6.2.2体检评估报告应包括以下内容：1封面；2目录；3正文；a）项目基本信息；b）工作综述；c）各要素体检评估情况；d）问题与优势清单；e）结论；4附件。\u003c/p>\n\u003cp>6.2.3体检评估报告应参照“附录7.1北京市既有建筑改造体检评估报告提纲”编制。6.3报告编制要点6.3.1项目基本信息。1应包括项目名称、项目地点、项目规模、项目功能、建设时间、原设计单位、体检评估时间、委托单位、承担单位和项目负责人。2其中，项目功能应写明改造前和改造后功能。\u003c/p>\n\u003cp>若既有建筑在体检评估时处于空置状态，改造前功能应填写建筑的设计功能或空置前的使用功能。改造后功能宜填写体检评估时意向的改造后功能。3若项目建设时间、原设计单位信息无法考证，可填不详。6.3.2工作综述。1应包括体检评估背景、体检评估目标、体检评估对象、体检评估工作计划和体检评估依据。\u003c/p>\n\u003cp>2体检评估背景应说明启动本次体检评估的动因与前提条件，主要包括项目现状与改造契机、权属关系等。项目现状包括既有建筑目前的保存和使用情况，如是否仍在使用，是否经历过重大改造，是否与原建筑设计功能一致，改造和运维记录是否完整等；权属关系包括项目建筑主要使用主体和所有权人情况，使用主体和体检评估委托方之间的关系；委托动因和改造契机主要说明委托方需要体检评估的原因，项目改造的定位，是否有明确的改造意向等；以及目前项目处在既有建筑改造项目管理审批流程中的何种阶段等。\u003c/p>\n\u003cp>3体检评估目标应说明希望通过体检评估实现的效果。说明本次体检的深度，即进行初步体检评估或全面体检评估；并应清晰说明本次体检评估工作期望达成的目标，宜围绕本指南提出的要素体系进行策划，说明需要研判的方面、关注的重点、希望解决的具体问题等。4体检评估对象应界定项目类型、范围和时空边界。\u003c/p>\n\u003cp>体检评估对象应明确体检评估的项目类别，如商业办公建筑、低效楼宇、产业园、展览馆等，并阐\u003c/p>\n\u003cp>21述其所在区域的城市空间定位，包括用地性质、城市规划中的高度控制、风貌保护等限制性要求。清晰界定本次体检评估工作的时间和空间范围，例如竣工时间距今20年以上的建筑；建筑红线内的全部区域，或建筑物的特定部分，如仅局部几层或改变用途的内部空间等，并说明边界划分的依据。5体检评估工作计划应系统说明为完成体检评估工作所采取的组织与方法策略，主要包括时间计划、团队构成与分工，体检评估方法与技术路线。\u003c/p>\n\u003cp>时间计划中需列明体检评估各阶段工作的起止时间与关键节点，保障工作有序推进。团队构成与分工中介绍体检评估团队的人员专业构成（如建筑、结构、设备等专业），并明确各专业人员及职责分工，保障体检评估的专业性与全面性。体检评估方法与技术路线中应阐述本次体检评估所采用的主要方法（如现场勘查、仪器检测、资料调阅、软件模拟等）以及整体技术路线，保障体检评估工作的科学性与可靠性。\u003c/p>\n\u003cp>6体检评估依据应写明本次既有建筑改造体检评估执行的法律法规与标准。6.3.3各要素体检评估情况。1应涵盖体检评估要素的选用思路，及各维度要素体检评估情况。2要素选用应参照本指南“5.1要素选用总体要求”，建立适用于项目的体检评估要素清单，并详细阐述其选用的思路。要素选用过程需说明本次体检评估要素的选用思路，分析项目条件与要素构成之间的内在联系，如建筑是否位于首都功能核心区、历史文化街区，以及建筑功能类型（如居住、办公、商业、文化设施等）对要素选取的影响，明确不同条件与相应要素的对应关系。\u003c/p>\n\u003cp>3各维度要素体检评估情况，应分维度说明要素体检评估情况。宜详细说明各维度要素体检评估所采用的调查方法、数据来源，并结合文字描述、现场照片、设计图纸、原始记录等形式，全面展现要素判断的支撑材料，保障体检评估过程透明和可追溯。6.3.4问题与优势清单。1应结合体检评估要素选用，细化体检评估要素子项，形成项目问题与优势清单。\u003c/p>\n\u003cp>形式应参照“附录7.2北京市既有建筑改造体检评估问题与优势清单”。2应采用简洁、明确、定性的结论性语言填写清单，避免冗长的过程性描述。3改造设计难点与问题中的执行难点应简练写明不符合的标准与规范要点；若该项可满足现行标准与规范要求，填无。不符合标准与规范的要点填写示例：节能率按照现行新建规范不达标、消防疏散口不够、疏散宽度不够等，不宜大段引用标准原文。\u003c/p>\n\u003cp>4改造优势应简练写明体现优势的性能特点，无明显积极因素时，填无。优势填写示例：结构完好、承载力足够，空间可利用情况好、文化特色鲜明等。5改造建议中应写明建议类型。问题与优势清单填写示例：体检评估层面体检评估维度体检评估要素现状基本情况改造设计难点与问题改造优势改造建议要素子项具体情况改造设计应执行的现行规范与标准执行难点其他问题技术安全建筑结构（含地基基础）的安全性和抗震性场地、地基和基础，上部结构现场调查发现建筑结构有严重损坏，结构检测鉴定结果为Deu级。\u003c/p>\n\u003cp>《既有建筑鉴定与加固通用规范》（GB55021）《房屋结构综合安全性鉴定标准》（DB11/T637）极不符合国家现行标准规范的安全性和抗震性的要求，必须立即采取措施无无应改技术环境生态环境与绿色低碳情况既有建筑节能围护结构已超过使用年限，且出现裂缝、表皮脱落等明显损坏。《既有公共建筑节能绿色化改造技术规程》（DB11/T1998）围护结构热工性能及建筑气密性不满足标准要求无无宜关注问题技术文化历史资源建筑的代表性、稀缺性情况是我国第一栋使用该结构体系的建筑。\u003c/p>\n\u003cp>无无无其结构体系具有代表性宜关注优势\u003c/p>\n\u003cp>22体检评估层面体检评估维度体检评估要素现状基本情况改造设计难点与问题改造优势改造建议要素子项具体情况改造设计应执行的现行规范与标准执行难点其他问题技术安全消防专业技术的安全性消防设计沿高层建筑的一个长边连续布置宽度为10m消防车登高操作场地《建筑设计防火规范》（GB50016）无无无无特殊影响6.3.5结论。\u003c/p>\n\u003cp>1综述应对项目整体状况进行概括，简述体检评估基本情况。综述中应简要说明项目运用什么方法、开展了哪些方面的体检评估，在选定的层面、维度和要素中，总结出几个问题和几个优势，以及各维度的整体情况。当开展的是初步体检评估时，还应说明是否建议开展全面体检评估。2重点关注问题应按优先级顺序逐项列出。\u003c/p>\n\u003cp>重点关注问题应结合问题与优势清单筛选相关重要性问题，并结合项目特点，对安全、文化、功能、环境、效益、管理等维度进行综合分析排序。3改造策略与建议应紧密回应重点关注问题，提出针对性的策略与建议。改造策略与建议应综合分析体检评估得出的问题与优势，提出方向性的改造建议。宜结合具体问题和优势提供优先级建议，不同问题之间、问题与优势之间需要权衡与博弈的方面等。\u003c/p>\n\u003cp>例如体检评估的建筑结构极不符合现行规范安全性要求，必须采取措施，同时建筑又具有很高的文化价值，则应在结论中提示在结构改造过程中可能对文化价值保留产生的影响。6.3.6附件应包括但不限于以下内容。附件应汇总并呈现体检评估工作中通过文献调查、现状调查、检测鉴定工作中采集整理的一手资料，为判断要素、提炼问题、提出结论与建议提供数据支撑。\u003c/p>\n\u003cp>1上位规划条件。应包括但不限于：项目所在街区的控制性详细规划，需要执行的规划实施方案，需要参考执行的设计导则与技术导则等指导文件。2权属证明文件。应包括但不限于：项目不动产权证（或房产证、土地证），以明确产权人、用地性质、土地使用年限及建筑面积等核心信息；委托方身份证明（如营业执照）；若委托方非产权人，需提供产权人出具的专项评估授权委托书。\u003c/p>\n\u003cp>3设计文件与图纸。应尽可能收集，包括但不限于：全套竣工图纸；地质勘察报告；设计变更及竣工验收备案文件，如涉及改造的，需要收集历次改造的图纸、设计说明等。对于图纸缺失或与现状严重不符的项目，可开展三维激光扫描，生成实景点云模型、正射影像图及逆向建模，以精准记录建筑现状空间信息。4项目运维记录。\u003c/p>\n\u003cp>应包括但不限于：主要设备系统，如电梯、暖通空调、给排水系统、变配电的定期维护、保养及故障、损坏的大修记录；建筑装修改造历史记录；曾发生的结构性损伤、给排水和供暖空调水管道渗漏、火灾等重大事件及处理情况的专项记录；近三年的能源资源消耗账单与能耗审计报告（如有）等。5检测与鉴定报告（按需）。\u003c/p>\n\u003cp>由具备相应资质的第三方检测鉴定机构出具的各类专项报告，例如：房屋结构综合安全性鉴定报告、北京市建筑工程室内环境质量检测报告、消防安全评估报告、生活饮用水水质分析检测报告、人防工程防护设备产品质量检测报告、管道漏损检测报告、排水能力检测报告、水质安全监测报告等。所有报告均应为原件或加盖检测机构公章的有效复印件。\u003c/p>\n\u003cp>当有需要时，参考《房屋建筑安全评估技术规程》（DB11/T882）、《房屋结构综合安全性鉴定标准》（DB11/T637）《建筑消防设施检测服务规范》（DB11/T3034）、《民用建筑能效测评标识标准》\u003c/p>\n\u003cp>23（DB11/T1006）、《公共建筑节能运行管理与监测技术规程》（DB11/T1130）、《人民防空工程防护设备产品与安装质量检测标准（暂行）》（RFJ003-2021）等对相关建筑系统进行体检评估。\u003c/p>\n\u003cp>247附录7.1北京市既有建筑改造体检评估报告提纲\u003c/p>\n\u003cp>25一、项目基本信息项目名称项目地点项目功能改造前改造后项目规模建设时间原设计单位地址邮编联系人电话传真体检评估时间委托单位地址邮编联系人电话传真承担单位地址邮编联系人电话传真项目负责人二、工作综述1.体检评估背景2.体检评估目标3.体检评估对象4.体检评估工作计划5.体检评估依据三、各要素体检评估情况1.体检评估要素选用思路2.安全3.文化4.功能\u003c/p>\n\u003cp>265.环境6.效益7.管理四、问题与优势清单详见附录7.2北京市既有建筑改造体检评估问题与优势清单五、结论1.综述2.重点关注问题3.改造策略与建议六、附件1.上位规划条件2.权属证明文件3.设计文件与图纸4.项目运维记录5.检测与鉴定报告（按需）\u003c/p>\n\u003cp>277.2北京市既有建筑改造体检评估问题与优势清单（示例）体检评估层面体检评估维度体检评估要素现状基本情况改造设计难点与问题改造优势改造建议要素子项（建议包含但不限于以下要点）具体情况改造设计应执行的现行规范与标准（改造后功能改变的，选取新功能对应的规范与标准）执行难点其他问题技术安全建筑结构（含地基基础）的安全性和抗震性场地、地基和基础，上部结构机电系统的安全性给排水、暖通空调、电气系统与设备设施……消防专业技术的安全性消防设计、消防运行、消防管理……防护系统的安全性场地安全、安防、外围护、外部设施、室内空间、内装修、人防、地下空间、地下水……文化文化认同与象征性城市设计、城市风貌历史资源古树名木、建筑竣工时间……社会影响建筑与周边居民关系，社会活动与奖项……艺术特色形式美学、原创性……功能空间设计与更新改造利用情况空间布局、尺度、空间营造、改造潜力……室内外交通情况室内外交通流线组织，对上位规划响应……室内外环境情况室内外声光湿热环境、空间营造与景观……机电系统利旧情况设备、电气系统……服务设施类型与配置情况类型与规模、设计水平、作用范围……创新专项应用情况无障碍、适老化与全龄友好、智慧、健康、花园城市……环境上位规划和发展定位落实情况类型与改造方式、用地、功能与业态、规模、高度……公共活力建设与促进情况定位目标、空间、举措……生态环境与绿色低碳情况节能、节水、节材、固废与可再生能源利用……效益改造前原有经济情况实体的经济价值，土地区位经济附加值……改造投资及资金平衡情况改造投资、造价指标、投入产出比……改造运营情况直接效益、间接效益、环境及社会影响……\u003c/p>\n\u003cp>28体检评估层面体检评估维度体检评估要素现状基本情况改造设计难点与问题改造优势改造建议要素子项（建议包含但不限于以下要点）具体情况改造设计应执行的现行规范与标准（改造后功能改变的，选取新功能对应的规范与标准）执行难点其他问题管理改造内容的合规性土地用途调整、用地保障是否符合国家和北京市政策要求执行过渡期政策情况生态环境影响评价、交通影响评价、能源开发利用是否符合立项要求实施程序的合规性项目执行北京城市更新管理程序的情况项目更新需求征询以及物业权利人对实施方案的协商表决情况资源保障与效益提升项目资金筹措与落实情况项目产权与产权办理路径情况项目产业策划和利用效率评价情况\u003c/p>\n\u003cp>297.3北京市既有建筑改造体检评估要素选用参考体检评估层面体检评估维度体检评估要素项目区位城市更新项目联合审查类型首都功能核心区北京城市副中心中心城区平原地区新城生态涵养区区域综合性涉及重大变化①涉及公共利益与公共安全的技术安全建筑结构（含地基基础）的安全性和抗震性●●●●●●●●机电系统的安全性●●●●●●●●消防专业技术的安全性●●●●●●●●防护系统的安全性●●●●●●●●文化文化认同与象征性●●●○○●○○历史资源●●●●●●●●社会影响●●●●●●●●艺术特色●●●○○●○○功能空间设计与更新改造利用情况○○○○○●●●室内外交通情况○○○○○○○○室内外环境情况○○○○○○○○机电系统利旧情况○○○○○○○○服务设施类型与配置情况○○○○○○○○创新专项应用情况○○○○○○○○环境上位规划和发展定位落实情况●●●●●●●●公共活力建设与促进情况○○○○○●○●生态环境与绿色低碳情况○○○○●○○○效益改造前原有经济情况●●●●●●●●改造投资及资金平衡情况●●●●●●●●改造运营情况○○○○○○○○\u003c/p>\n\u003cp>30体检评估层面体检评估维度体检评估要素项目区位城市更新项目联合审查类型首都功能核心区北京城市副中心中心城区平原地区新城生态涵养区区域综合性涉及重大变化①涉及公共利益与公共安全的管理改造内容的合规性土地用途调整、用地保障是否符合国家和北京市政策要求○○○○○○●○执行过渡期政策情况○○○○○○●○生态环境影响评价、交通影响评价、能源开发利用是否符合立项要求●●●●●●●●实施程序的合规性项目执行北京城市更新管理程序的情况●●●●●●●●项目更新需求征询以及物业权利人对实施方案的协商表决情况●●●●●●●●资源保障与效益提升项目资金筹措与落实情况●●●●●●●●项目产权与产权办理路径情况○○○○○○●○项目产业策划和利用效率评价情况○○○○○○○○说明：●——应选。\u003c/p>\n\u003cp>○——宜选。①涉及重大变化指用地功能、建筑规模、建筑高度调整，土地用途转换、土地利用方式改变、使用五年过渡期政策、业态和经营方式发生重大变化的。\u003c/p>\n\u003cp>31指南用词说明1为便于在执行本指南条文时区别对待，对要求严格程度不同的用词说明如下：1）表示很严格，非这样做不可的：正面词采用“必须”，反面词采用“严禁”；2）表示严格，在正常情况下均应这样做的：正面词采用“应”，反面词采用“不应”或“不得”；3）表示允许稍有选择，在条件许可时首先应这样做的：正面词采用“宜”，反面词采用“不宜”；4）表示有选择，在一定条件下可以这样做的：采用“可”“建议”。\u003c/p>\n\u003cp>2条文中指明应按其他有关标准执行的写法为：“应符合……的规定”或“应按……执行”。\u003c/p>\n\u003cp>32引用标准名录1《建筑给水排水与节水通用规范》（GB55020）2《既有建筑鉴定与加固通用规范》（GB55021）3《既有建筑维护与改造通用规范》（GB55022）4《建筑电气与智能化通用规范》（GB55024）5《安全防范工程通用规范》（GB55029）6《民用建筑通用规范》（GB55031）7《消防设施通用规范》（GB55036）8《建筑防火通用规范》（GB55037）9《生活饮用水卫生标准》（GB5749）10《建筑消防设施的维护管理》（GB25201）11《消防控制室通用技术要求》（GB25506）12《公共场所卫生指标及限值要求》（GB37488）13《建筑给水排水设计标准》（GB50015）14《建筑设计防火规范》（GB50016）15《20kV及以下变电所设计规范》（GB50053）16《建筑内部装修设计防火规范》（GB50222）17《建筑工程抗震设防分类标准》（GB50223）18《智能建筑设计标准》（GB50314）19《民用建筑工程室内环境污染控制标准》（GB50325）20《安全防范工程技术标准》（GB50348）21《民用建筑设计统一标准》（GB50352）22《民用建筑供暖通风与空气调节设计规范》（GB50736）23《消防给水及消火栓系统技术规范》（GB50974）24《民用建筑电气设计标准》（GB51348）25《室内空气质量标准》（GB/T18883）26《再生铜合金原料》（GB/T38470）27《再生铜原料》（GB/T38471）28《含有色金属固体废物回收利用技术规范》（GB/T41012）29《废弃电器电子产品回收规范》（GB/T45070）30《管道燃气用户安全巡检技术规程》（DB11/1450）31《健康建筑设计标准》（DB11/2101）32《电气防火检测技术规范》（DB11/T065）33《房屋结构综合安全性鉴定标准》（DB11/T637）34《安全防范系统运行检验规范》（DB11/T779）35《安全防范系统运行与维护要求》（DB11/T855）36《房屋建筑安全评估技术规程》（DB11/T882）37《绿色建筑设计标准》（DB11/T938）38《房屋建筑使用安全检查评定技术规程》（DB11/T1004）39《民用建筑能效测评标识标准》（DB11/T1006）40《建筑消防设施检测评定规程》（DB11/T1354）41《在用电梯安全 色社会主义文化，不断满足人民文化需求、增强人民精神力量，筑牢强国建设、民族复兴的文化根基。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>《规划》坚持以习近平新时代中国特色社会主义思想为指导，将习近平文化思想贯穿始终，强调锚定文化强国、旅游强国建设目标，以社会主义核心价值观为引领，以推动高质量发展为主题，以推进文旅深度融合为主线，统筹推动文化事业、文化产业和旅游业发展，繁荣发展新时代中国特色社会主义文化，不断满足人民文化需求、增强人民精神力量，筑牢强国建设、民族复兴的文化根基。\u003c/p>","related":[{"slug":"news-20261118-7a61b473","title":"江西宜春：脱胎漆器非遗技艺薪火相传","publish_date":"2026-11-18"},{"slug":"news-20261118-48891b30","title":"山西定向培养“文物全科人才”缓解基层人才匮乏","publish_date":"2026-11-18"},{"slug":"news-20261117-c31664aa","title":"上海博物馆与美国、德国顶尖博物馆签约促文化交流","publish_date":"2026-11-17"},{"slug":"news-20261116-cefe783c","title":"专家解读｜董卫：坚持群众路线，深入推进资源调查认定","publish_date":"2026-11-16"},{"slug":"news-20261113-520927a9","title":"宜兴蜀山古南街：窑火千年，生生不熄（“照巷”·人文经济学一线调研）","publish_date":"2026-11-13"}],"updated_at":"2026-11-18T07:35:46.584Z"},{"slug":"news-20260827-1b018748","title":"【文字解读】《博物馆藏品管理办法》政策解读","type":"news","type_label":"动态","issuer":"文化和旅游部","doc_no":"","publish_date":"2026-08-27","effective_date":"","status":"动态","level":"国家级","region":"全国","source_name":"文化和旅游部","source_url":"https://zwgk.mct.gov.cn/zfxxgkml/zcfg/zcjd/202608/t20260827_966973.html","summary":"《办法》分为总则、藏品基础管理、藏品库房管理、藏品保护利用、法律责任、附则等共六章六十三条。第一章总则，包括立法目的、适用范围、藏品定义、管理责任等内容；第二章藏品基础管理，包括藏品取得、征集、入藏、定级、建账、建档及调拨、交换、退出等工作要求；第三章藏品库房管理，包括库房设施设备、藏品出入库、提用、借用、清点、安全检查等内容；第四章藏品保护利用，包括藏品日常养护、保护修复、复制、拓印、预防性保护、数字化保护、研究利用等内容；第五章法律责任，明确藏品管理中…","themes":["博物馆"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>《办法》分为总则、藏品基础管理、藏品库房管理、藏品保护利用、法律责任、附则等共六章六十三条。第一章总则，包括立法目的、适用范围、藏品定义、管理责任等内容；第二章藏品基础管理，包括藏品取得、征集、入藏、定级、建账、建档及调拨、交换、退出等工作要求；第三章藏品库房管理，包括库房设施设备、藏品出入库、提用、借用、清点、安全检查等内容；第四章藏品保护利用，包括藏品日常养护、保护修复、复制、拓印、预防性保护、数字化保护、研究利用等内容；第五章法律责任，明确藏品管理中的违法违规情形及相应罚则；第六章附则，包括参照办理情形、生效时间等内容，同时明确\u003c/p>","related":[{"slug":"news-20261118-7a61b473","title":"江西宜春：脱胎漆器非遗技艺薪火相传","publish_date":"2026-11-18"},{"slug":"news-20261118-48891b30","title":"山西定向培养“文物全科人才”缓解基层人才匮乏","publish_date":"2026-11-18"},{"slug":"news-20261117-c31664aa","title":"上海博物馆与美国、德国顶尖博物馆签约促文化交流","publish_date":"2026-11-17"},{"slug":"news-20261116-cefe783c","title":"专家解读｜董卫：坚持群众路线，深入推进资源调查认定","publish_date":"2026-11-16"},{"slug":"news-20261113-520927a9","title":"宜兴蜀山古南街：窑火千年，生生不熄（“照巷”·人文经济学一线调研）","publish_date":"2026-11-13"}],"updated_at":"2026-11-18T07:35:46.617Z"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2026〕80号","publish_date":"2026-07-24","effective_date":"","status":"现行有效","level":"国家级","region":"潍坊","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202607/content_7076509.htm","summary":"发掘文化遗产内涵与价值，系统开展文物资源调查和史料研究，厘清潍县古城的空间格局和发展脉络，明确保护的原则和重点，强化文化遗产保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好潍坊市历史文化","themes":["历史文化名城"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于同意将山东省潍坊市 列为国家历史文化名城的批复 国函〔2026〕80号 山东省人民政府： 你省关于申报潍坊市为国家历史文化名城的请示收悉。现批复如下： 一、同意将潍坊市列为国家历史文化名城。潍坊市历史悠久、文化厚重，文化遗产资源丰富，传统格局和历史风貌保存较好，地域特色鲜明，具有重要的历史文化价值。 二、你省及潍坊市人民政府要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，按照党中央、国务院决策部署，牢固树立保护历史文化遗产责任重大的观念，落实《中华人民共和国文物保护法》、《历史文化名城名镇名村保护条例》要求，深入研究发掘文化遗产内涵与价值，系统开展文物资源调查和史料研究，厘清潍县古城的空间格局和发展脉络，明确保护的原则和重点，强化文化遗产保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好潍坊市历史文化名城保护规划和各级文物保护单位保护规划，制定并严格实施保护管理规定，明确各类保护对象的清单以及保护内容、要求和责任。正确处理城市建设与文化遗产保护的关系，摸清文物资源家底，加强文物保护，完善“先调查、后建设”、“先考古、后出让”制度，重视城市格局保护和风貌管控，加强整体性保护、系统性保护；保护修复历史文化街区，补足配套基础设施和公共服务设施短板，不断提升人居环境品质；加强不可移动文物和历史建筑修缮保护，推动文物活化利用，充分发挥不可移动文物和历史建筑的使用价值。不得改变与名城相互依存的自然景观和环境，不得进行任何与名城环境和风貌不相协调的建设活动，不得损坏或者擅自迁移、拆除不可移动文物和历史建筑，相关建设项目要依法履行报批程序。进一步强化责任落实，对不履职尽责、保护不力，造成名城历史文化价值受到严重影响的行为，依法依规开展监督问责。 三、你省与住房城乡建设部、国家文物局要加强对潍坊市国家历史文化名城保护工作的指导、监督和检查。 国务院 2026年7月21日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260723-bb8576c2","title":"中共上海市委办公厅、上海市人民政府办公厅印发《上海市城市更新三年行动计划（2026—2028年）》的通知","publish_date":"2026-07-23"}],"updated_at":"2026-11-16T09:21:19.568Z"},{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","type":"case","type_label":"案例","issuer":"第一财经","doc_no":"","publish_date":"2026-07-23","effective_date":"","status":"实践报道","level":"地方级","region":"宜兴","source_name":"第一财经（百家号官方账号）","source_url":"https://baijiahao.baidu.com/s?id=1871475611884790295&wfr=spider&for=pc","summary":"第一财经报道宜兴丁蜀陶二厂文化街区更新：由隈研吾设计的UCCA陶美术馆落在昔日紫砂二厂旧址，上万块特制手工陶板形成起伏屋面；街区约40间工作室入驻，2025年获评“全国最美乡村公共文化空间”与LOOP设计大奖，并与蜀山古南街、前墅龙窑等共同构成“陶式生活”游线，属媒体报道而非政策原文。","themes":["工业遗产","保护更新","城市更新","文化传承","老旧厂房改造"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>梅雨季刚过，因紫砂而蜚声中外的陶都宜兴已入伏，热浪裹挟着街巷。\u003c/p>\n\u003cp>在隐匿于宜兴丁蜀的网红街区陶二厂，由隈研吾设计的UCCA陶美术馆静卧在昔日的紫砂二厂旧址上。这座由上万块特制手工陶板覆盖的起伏屋面，如海浪翻涌。深棕、赭红与暖橙交织的“窑变”色泽，阳光斜切下来，仿佛这座建筑本身仍处在烧制的火候之中，吸引往来游客拍照打卡。\u003c/p>\n\u003cp>7月18日，“粗犷现代主义：当代阿科莱陶”在UCCA陶美术馆开幕。展厅里，来自20世纪40年代末至80年代末法国阿科莱（Accolay）工坊的124件陶瓷作品，正与8位当代艺术家的创作无声对话。\u003c/p>\n\u003cp>那些来自战后法国勃艮第乡村的瓶、灯具、面具与动物造型，带着未受学院派规训的生猛气息。由国际设计师马塔利·克拉塞以“火”为线索设计的展墙内，中国艺术家耿雪的《巫人器7号》、欧鸣的《爱城-粉色夫人》、孙玥的《风之轴心》，以及来自法、日、意的当代作品，则在试探陶瓷作为媒介的当代边界。\u003c/p>\n\u003cp>这场展览试图在宜兴这个被紫砂千年文脉严密包裹的陶都，将“自学式现代主义”的粗犷制陶逻辑放进来，将时间跨度长达40年的法国阿科莱工坊陶瓷创作，与当下前沿的当代陶艺并置呈现。\u003c/p>\n\u003cp>阿科莱陶诞生于战后重建的历史语境中。二战结束后，一小群生活在巴黎的年轻人离开城市，前往勃艮第北部韦尔芒通附近的阿科莱村，在库尔河畔建立陶艺工作室，将加油站与陶瓷生产空间并置运营，变成一种兼具生活、生产与销售功能的集体创作模式，作品既有商业属性，又有实验精神。\u003c/p>\n\u003cp>当今天的观众站在UCCA陶美术馆内，看着当年阿科莱的那些匿名陶艺家非凡的想象力，那种非学院、非精英，并且将陶瓷嵌入日常流通的生产机制，足以让人们重新理解陶瓷的工艺过程、材料属性及陶土表现力。\u003c/p>\n\u003cp>对2024年10月正式开街的宜兴陶二厂来说，雄心不止于此。除了UCCA陶美术馆极具视觉冲击力的建筑成功出圈引流，后续的陶书局、M画廊、陶二厂国际驻留中心、bilibili纪录片创新空间、陶文旅文创馆的相继开幕，将陶艺体验、文创市集、公共休闲融合成城市更新的新案例。\u003c/p>\n\u003cp>宜兴借陶二厂抛出的，并非一个简单的改造答案。它想试试，在这座以陶为魂的江南小城里，改造后的旧厂房和新潮生活能碰撞出多大活力。在产业迭代和城市更新的路上，这片从老陶窑里长出来的文化街区，能走出多少没人走过的新路。\u003c/p>\n\u003cp>野生回响\u003c/p>\n\u003cp>走进展厅第一区，阿科莱陶的“高卢”蓝色花瓶系列率先撞入视线。那种蓝源自法国一款流行香烟的包装，白色水平环纹是工坊里随手刻画的痕迹，是对流行图像的直接挪用。\u003c/p>\n\u003cp>旁边的“面具”系列是那些非科班出身的陶艺创作者对部落艺术的泛化想象，它用釉面陶瓷球与镍铬合金线拼凑出家庭宠物与异兽，像一本战后法国乡村的动物寓言集。这些作品的底色是集体生产、商业自觉与材料实验的混合，所有作者隐身在“阿科莱”这个名字背后，没人追问谁是大师。\u003c/p>\n\u003cp>这种“非学院、非精英、嵌入日常流通”的生产机制，与宜兴绵延数百年的紫砂传统和生态，形成完全不同的有趣对照。在丁蜀镇，一把壶的价值往往看重师承，家族工坊里“从泥料到成壶全凭一双手”的封闭传承，构筑了极高的工艺壁垒，也形成门槛。\u003c/p>\n\u003cp>此次参展的中国艺术家耿雪、欧鸣、孙玥，都是往外探索的年轻艺术家，作品在国际上颇受关注。耿雪的“巫人器”系列以良渚玉琮为原型，将自己在疫情期间的生命思考揉进了神话叙事与个体痛感，高温陶瓷被她处理成带有祭祀感的当代躯壳。欧鸣把陶瓷与石膏、水分蒸发及时间过程绑在一起，让材料在自然变化中自行构建生成机制。孙玥则用最原始的泥条盘筑法，在重复堆叠中保留细微差异，构建出兼具雕塑性与空间张力的《风之轴心》。\u003c/p>\n\u003cp>这些年轻艺术家把陶瓷视为持续生成与实验的媒介，使其在功能、雕塑、叙事与观念之间不断转换，并与阿科莱陶所体现的开放性创作精神形成跨越时空对话。\u003c/p>\n\u003cp>二战后的法国年轻人离开巴黎，在乡村自建工坊，用流行杂志里的抽象艺术与部落图像改造陶器。今天的耿雪、欧鸣、孙玥们，则在丁蜀镇的老厂房与新建的美术馆之间，用泥条盘筑、石膏耦合、玉琮重构。不同时代的艺术家们，都在尝试一个可能性，陶能否在艺术、工艺与日常的多元地带自由生长。\u003c/p>\n\u003cp>法国艺术家茜尔维·奥夫雷近真人尺度的面具融合部落文化与守护神话，与阿科莱的“面具”系列隔空对望。日本艺术家桑田卓朗把传统茶碗放大，用鲜亮的流行色将器物变成巨型陶瓷雕塑。意大利艺术家罗伯托·科吉借甲壳类生物外壳把陶瓷变成生物体与人工造物的融合体。\u003c/p>\n\u003cp>这些跨越国界的当代陶实践，与阿科莱那群无名陶匠留下的作品，形成跨越半个世纪的陶艺探索。所有创作者都在追寻一个开放式命题，陶瓷不会被固定的风格所限制，始终在泥、火、创作者与时间的变化中，保持生机勃勃的创作姿态。\u003c/p>\n\u003cp>流量与现实\u003c/p>\n\u003cp>7月18日，来自杭州的陶瓷手工创作者小尧，带着她制作的陶瓷饰品、陶瓷器皿，坐着高铁去往宜兴。\u003c/p>\n\u003cp>陶二厂第47届“蜀山陶集”在文化街区最醒目处搭建了上百间露天摊位，来自南京、杭州、上海、景德镇的青年摊主，带着自己原创的作品集结在市集。\u003c/p>\n\u003cp>“我们也都是没学过陶瓷的。”在看过UCCA陶美术馆的展览后，小尧似乎寻找到了跟阿科莱陶艺家的共鸣。她感叹，自己学国际贸易，做过白领，终究觉得不是自己想要的生活，于是开始自学陶瓷制作，赚钱不多，但“内心是真的快乐”。跟她一样的很多野生年轻创作者将“蜀山陶集”视为一个舞台，可以在这里售卖作品，也可以连接同好。\u003c/p>\n\u003cp>对小尧来说，陶二厂文化街区自带着历史文化属性。这里是原宜兴紫砂工艺二厂的旧址，1981年投产，曾是苏南乡镇企业辉煌的注脚。如今，老厂部的飞檐琉璃顶、雕塑分厂的红砖楼被保留下来，与UCCA陶美术馆、世纪朵云的陶书局、IAC国际陶艺学会驻留空间、每月轮换主题的手工市集一起，形成一个超6万平方米的文创街区。\u003c/p>\n\u003cp>陶二厂文化街区有清晰的脉络，走的是“微更新、低冲击”的活化路径。东区保留上世纪80年代成型车间、雕塑分厂的红砖与水磨石，修旧如旧；中区以老厂房为核心，植入会展与公共教育；西区则与隈研吾的建筑等当代地标对话，形成历史风貌、精神传承和艺术新生的结构。游客来到这里的动线，通常从西门进，先到美术馆建筑前打卡，再去街区里的老楼和街道探访。\u003c/p>\n\u003cp>2024年10月正式启幕至今，陶二厂以市集、驻留、展览构建起一个多重的网状生态。\u003c/p>\n\u003cp>据丁蜀镇2026年披露的数据，街区店铺入驻率约90%，陶二厂每月举办主题手工市集，单场吸引摊主超百位，周末客流人次过万。\u003c/p>\n\u003cp>社交媒体上，宜兴陶二厂总免不了被拿来和景德镇陶溪川放在一起比较。“江浙沪有自己的景德镇”，是网友对陶二厂业态布局的评价。这两处空间的确有相似基因，它们都曾是炉火日夜不熄的陶瓷生产热土，是整整一代手艺人赖以谋生的生计依托，如今又顺着时代与市场完成转身，变成文艺打卡地标。\u003c/p>\n\u003cp>去年5月刚在陶二厂文化街区开幕的M画廊，也在7月18日迎来“器与物”的陶艺家居联展，14位景德镇青年陶艺作者的作品以不同的创作态度，表达陶艺的艺术性和日常器皿的实用性。\u003c/p>\n\u003cp>“陶二厂的流量确实很大。游客多的时候，我们必须要限流。”画廊主理人慧敏告诉第一财经，去年受邀来这里开设画廊时，她毫不犹豫就答应了。但入驻之后，她发现，人流虽大，客群却并不匹配。画廊的艺术商店售卖陶艺作家作品，生意冷清，不售票的画廊却常挤得接踵摩肩。\u003c/p>\n\u003cp>运营的现实在流量高峰后也逐渐显形。陶二厂文化街区的店铺入驻率虽达到90%，但业态里的精品与低端互为混杂，沿河区域的商家因游客少，生意清淡，人群全集中在东西主干道。全国首家bilibili纪录片创新空间落地、IAC&amp;UCCA艺术家驻留空间每年邀24位国际陶艺家创作，都是试图破局的动作，但底层生态仍显得单薄。\u003c/p>\n\u003cp>慧敏在景德镇深耕多年，她认为，景德镇的年轻创作者浓度是宜兴难以企及的。\u003c/p>\n\u003cp>截至2025年，景德镇陶瓷产业总产值突破千亿元，全市拥有超5.8万家手工制瓷作坊，约15万陶瓷从业人员，高峰时聚集超6万名“景漂”创作者，其中青年群体占比超70%。在本地定居创作的“洋景漂”约5000名，覆盖全球数十个国家和地区，形成了本土青年创作者与国际创作者共生的生态格局。\u003c/p>\n\u003cp>丁蜀镇镇长曾提及，从“让人来”到“让人留”是核心转向。为此，镇里配套了人才公寓，设置公益性“陶都星光课堂”，通过高校直通车联动央美、清华美院建实训基地，试图把“陶漂”留下来。这种软性运营与硬性的街区扩建同步。陶二厂仍在持续微调空间，西区周边预留地块考虑引入更多实验性工坊与小型画廊，东区老建筑逐步释放给青年主理人做长期工作室。2025年，陶二厂获评“全国最美乡村公共文化空间”与LOOP设计大奖，验证了这种“粗粝精致并存”的路径被肯定。\u003c/p>\n\u003cp>在陶二厂，约40间工作室的主理人租下年费仅2万元的工作室。他们多是中青年匠人，既不像老一辈大师靠职称吃饭，也还没完全探索出适合当代艺术市场的路径。在街区的市集摊主中，40%来自景德镇、上海、南京、杭州等地。\u003c/p>\n\u003cp>丁蜀镇提出“陶式生活”已有多年，以陶二厂、蜀山古南街、前墅龙窑、黄龙山公园等为核心节点，形成一条沉浸式的陶文化游线。陶二厂文化街区则是一场温和而迟缓的更新。当数万“陶漂”来此扎根创作，当游客在老厂房、古街巷里感受陶文化和现代潮流生活的交融，剩下的就需要时间去沉淀，才能将流量转成“陶式生活”的真实养料。\u003c/p>","related":[{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"},{"slug":"case-20241201-51c8a196","title":"尼亚国家公园洞穴考古遗产（马来西亚）","publish_date":"2024-12-01"}],"updated_at":"2026-11-19T07:28:16.000Z"},{"slug":"policy-20260723-bb8576c2","title":"中共上海市委办公厅、上海市人民政府办公厅印发《上海市城市更新三年行动计划（2026—2028年）》的通知","type":"policy","type_label":"政策","issuer":"中共上海市委办公厅、上海市人民政府办公厅","doc_no":"","publish_date":"2026-07-23","effective_date":"","status":"现行有效","level":"地方级","region":"上海","source_name":"上海市人民政府（政府信息公开·党政混合信息）","source_url":"https://www.shanghai.gov.cn/nw44142/20261021/4f07ab8fed2e4eb4b457b3eb519c3af1.html","summary":"中共上海市委办公厅、上海市人民政府办公厅印发《上海市城市更新三年行动计划（2026—2028年）》（印发日期2026年7月23日，经市委、市人民政府同意印发），为高质量建设现代化人民城市、持续深入实施城市更新行动提供三年期行动安排；文件由上海市住房和城乡建设管理委员会于2026年10月21日以“一图读懂”形式转发解读。","themes":["城市更新","十五五规划","保护更新","完整社区"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>印发日期：2026-07-23发布日期：2026-10-21各区党委和人民政府，市委、市人民政府各部、委、办、局，各市级机关，各人民团体：《上海市城市更新三年行动计划（2026—2028年）》已经市委、市人民政府同意，现印发给你们，请认真贯彻执行。\u003c/p>\n\u003cp>中共上海市委办公厅上海市人民政府办公厅2026年7月23日上海市城市更新三年行动计划（2026—2028年）为高质量建设现代化人民城市，持续深入实施城市更新行动，制定本行动计划。\u003c/p>\n\u003cp>一、提升人居环境品质\u003c/p>\n\u003cp>推动城中村改造提速扩容，按期完成整体改造项目（主要是拆除新建项目）动迁，全面完成人居环境整治提升，同步推进实施有关点位规划拔点。实施70万平方米旧住房成套改造，其中，力争于2026年底完成不成套小梁薄板房屋改造。实施约2400万平方米老旧小区改造。结合房屋体检，推动实施危旧住房排查、改造，精准消除安全隐患。支持老旧住宅电梯更新和既有住宅电梯加装，完善小区停车、充电等配套设施，推进小区无障碍适老化改造，积极探索不成套里弄房屋、公寓、花园住宅更新，探索老旧住房自主更新模式。完成1200万平方米既有居住建筑节能改造。建设提升100个以上“美丽街区”。\u003c/p>\n\u003cp>二、激活城市存量资源潜力\u003c/p>\n\u003cp>鼓励多元功能转换，促进商务区能级提升和产业功能集聚，实施不少于90幢（约120万平方米）商办楼宇更新。完成300万平方米以上商业设施更新，推动南京东路、淮海中路、徐家汇等重点商圈能级提升。持续推进产业用地“两评估、一清单、一盘活”专项行动，以“小散”园区整治为重点，进一步盘活国有企业存量资源，推动50平方公里左右低效产业用地盘活处置，前瞻性储备优质产业空间。促进产业园区规模化、集约化发展，加快推进一批市级重点产业园区提质增效。完成1800万平方米既有公共建筑节能改造。\u003c/p>\n\u003cp>三、强化基础设施能级\u003c/p>\n\u003cp>完成1200公里老化燃气管道改造，更换300万台切断型智能燃气表，完成300公里道路架空线入地和杆箱整治，因地制宜建设综合管廊，完成300公里以上老旧供水管网改造，推进6000万平方米居民住宅二次供水设施移交接管，修复改造约300公里老旧排水管网。实施一批污水泵站改扩建工程，推进合流污水一期复线工程等污水管道工程建设，全面建成白龙港污水处理厂三期扩建工程，完成本轮雨污混接整治相关工作。推进厂站网一体化排水体制改革。\u003c/p>\n\u003cp>持续推进吴淞江工程建设，完成黄浦江中上游堤防防洪能力提升工程（二期）。推动骨干河道综合整治和重要泵闸口门建设，实施25个低洼圩区提标改造工程，推进崇明本岛及横沙岛主海塘达标建设。推进128处道路积水点改造。\u003c/p>\n\u003cp>紧扣韧性安全城市建设要求，加强高层建筑消防安全防范工作，开展消防救援设施和救援力量配置评估，推进消防救援站点提质升级、救援设施设备迭代更新。集中攻坚整治部分老旧高层建筑消防设备突出风险隐患。\u003c/p>\n\u003cp>进一步完善城市快速干线、生活性集散交通系统。完成内环高架“年轻化”四期、五期改造工程，全面实现内环高架浦西段“年轻化”。持续推进外环隧道大修、漕宝路快速路建设。推进6号线等轨道交通线的信号系统更新改造及漕溪路站等轨道交通站点综合改造。按规划优化城市空间布局，推动慢行系统空间从基础通行功能向品质体验升级。盘活优化停车资源。启动黄浦江杨家渡等一批轮渡站房整治维护工作。\u003c/p>\n\u003cp>持续推动各区实施应急避难场所、老旧小区结建防空地下室提升改造。合理布局建设一批集散分拨、集散共配等功能型城市配送中心。完成老港再生能源利用中心飞灰资源化工程项目等10个飞灰资源化利用改造项目。\u003c/p>\n\u003cp>四、拓展优化生态系统\u003c/p>\n\u003cp>多措并举推动黄浦江滨江中北段贯通开放并持续向腹地辐射延伸，重点推动世博水环、南浦水环、南北水环、真如水环等4处水网连通活化，建设提升“一江一河一带”交汇处3处大型节点绿地。打造多元融合的高能级水岸段，提升世博地区浦西片区等功能品质，完成苏州河木渎港景观改造。推进环城生态公园带先行段建设，协同打造环内楔形绿地生态体系。新增300公里绿道，新建改建120座口袋公园，推进60处单位附属绿地开放共享。开展60个水生态试点建设，推动50％以上的市、区管河湖建成美丽幸福河湖。每年新增约90平方公里城市建成区，达到海绵城市建设要求。依法加强对建设用地用途变更和污染地块风险管控的联动监管。\u003c/p>\n\u003cp>五、赓续传承历史文脉\u003c/p>\n\u003cp>研究编制历史文化名城保护规划。全面完成我市第四次全国文物普查工作，开展老城区、老街区专项调查，摸清保护对象资源底数。公布一批历史文化街区、优秀历史建筑、红色资源、工业遗产。推进新场镇、朱家角镇等11个历史文化名镇保护修缮和更新利用，做好新一批历史文化名镇申报工作。持续推进衡复（衡山路-复兴路）、老城厢等历史文化风貌区保护更新。推动海关大楼、中央造币厂旧址、圣约翰大学近代建筑等文物建筑和高阳大楼、耶松船厂、花园坊等优秀历史建筑保护修缮。\u003c/p>\n\u003cp>六、完善公共服务功能\u003c/p>\n\u003cp>统筹推进完整社区、“15分钟社区生活圈”、社区嵌入式服务设施建设，新建15个以上特色类完整社区，实现主城区和五个新城完整社区覆盖率达到60%。\u003c/p>\n\u003cp>持续推进全民健身场地设施建设改造，科学统筹文体设施选址规划，拓展户外大型文体活动公共空间，深化体绿融合建设模式，加强公园体育场景配建。推进市体育宫、江湾体育场场馆更新改造前期研究工作。持续推进杨浦、徐汇等滨水空间公共服务设施复合利用和市政设施转型升级。建设小陆家嘴公共空间、复兴岛岛北等标志性开放空间。\u003c/p>\n\u003cp>完成黄浦江、苏州河已贯通区域无障碍环境提升工作，推进苏州河桥梁加梯研究。持续推进外环绿道无障碍设施贯通。完成100个公交站台适老化改造。推进银行、邮政网点无障碍环境优化升级。结合道路设施品质提升，同步修复缺失破损盲道。\u003c/p>\n\u003cp>扩大“一老一小”服务场地设施供给，新增500家中心城区家门口养老服务站。加快推进公共空间和服务设施适儿化改造，推进黄浦江、苏州河沿岸儿童友好体验点和滨水驿站提质升级。助力建设青年发展型城市，打造更多青年友好公共空间。\u003c/p>\n\u003cp>七、焕新重点片区风貌\u003c/p>\n\u003cp>打造一批重点片区，引领区域整体更新、复合提升，彰显城市特色，打造城市功能核心承载区和城市综合竞争力的重要增长极。制定城市更新专项规划，在重点片区内实施不少于300个更新项目。注重民生改善、产业提升、风貌保留、环境优化，通过模式创新、资源集聚和政策支持激发城市更新市场内生动力。\u003c/p>\n\u003cp>八、保障措施\u003c/p>\n\u003cp>一体化推进城市体检和城市更新，建立完善“专项规划—片区策划—项目实施方案”的实施体系，用好责任规划师、责任建筑师、责任评估师联创工作机制，加强片区策划。强化法规政策支撑，完善规划用地、地价管理、工商业用地使用权续期、低效产业用地盘活等政策工具，编制城市更新标准指引。健全城市建设运营投融资体系，完善财政支持政策，优化金融支持措施，积极吸引社会资本参与。坚持党建引领，支持多元参与，发挥街道社区、经营主体、行业专家及专业机构作用，落实全过程人民民主。强化组织实施，完善工作推进机制，构建市级统筹、部门联动、分级落实的工作格局，细化落实年度重点任务，压实各区主体责任，加强项目全生命周期管理，稳妥有序实施城市更新行动。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-19 07:28:51"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","type":"policy","type_label":"政策","issuer":"国家林草局 国家发展改革委 财政部 自然资源部","doc_no":"林规发〔2026〕23号","publish_date":"2026-07-22","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202607/content_7076248.htm","summary":"国家林业和草原局 国家发展和改革委员会 财政部 自然资源部关于印发《林业草原保护利用“十五五”规划》的通知 林规发〔2026〕23号 各省、自治区、直辖市林草主管部门、发展改革委、财政厅（局）、自然资...","themes":["生态保护","文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国家林业和草原局 国家发展和改革委员会 财政部 自然资源部关于印发《林业草原保护利用“十五五”规划》的通知 林规发〔2026〕23号 各省、自治区、直辖市林草主管部门、发展改革委、财政厅（局）、自然资源主管部门，新疆生产建设兵团林草局、发展改革委、财政局、自然资源局： 现将《林业草原保护利用“十五五”规划》印发给你们，请结合实际认真贯彻落实。 特此通知。 国家林业和草原局 国家发展和改革委员会 财政部 自然资源部 2026年6月29日 （本文有删减） 林业草原保护利用“十五五”规划 林草兴则生态兴，生态兴则文明兴。森林和草原对国家生态安全具有基础性、战略性作用。为推进林草高水平保护和高质量发展，依据《中华人民共和国国民经济和社会发展第十五个五年规划纲要》，制定本规划。 一、总体要求 以习近平新时代中国特色社会主义思想为指导，深入践行习近平生态文明思想，全面贯彻党的二十大和二十届历次全会精神，牢固树立和践行绿水青山就是金山银山理念，坚持山水林田湖草沙一体化保护和系统治理，坚持“三绿”并举、“四库”联动、提质兴业利民，坚持种与管共抓、生态与产业共促、人与自然共生，统筹林草资源、国土空间、生态系统，统筹科学保护、系统治理、合理利用，融合林草资源管理与国土空间治理，着力推进生态系统优化、筑牢生态安全屏障，着力壮大林草产业、拓展“两山”转化路径，建设生态林业、富民林业、人文林业，为建设美丽中国、实现人与自然和谐共生的中国式现代化作出新贡献。 到2030年，“三北”工程三大标志性战役取得决定性胜利，完成自然保护地整合优化，森林、草原、湿地、荒漠生态系统质量和服务功能不断增强，林草多元供给和消费场景更加丰富，林草产业总产值迈上新台阶。 ——通过林草资源和国土空间科学保护，筑牢国家生态安全屏障。强化科学理念，落实生态保护红线制度，优化国土空间格局，实行差别化、精细化管理，促进森林草原湿地休养生息，严守林草资源安全底线，以林草高水平保护支撑高质量发展。 ——通过林草资源和国土空间系统治理，提升生态系统多样性稳定性持续性。坚持系统观念，统筹山水林田湖草沙各生态系统，协同国土空间治理，自然恢复为主，综合施策，强化跨区域协同，提升生态系统适应气候变化能力，增强生态系统韧性。 ——通过林草资源和国土空间合理利用，推动绿水青山转化金山银山。遵循自然规律、经济规律、社会规律，以生态价值溢出为导向，节约集约，推进林草资源空间立体开发、分层经营、复合利用，拓展生态产品价值实现渠道，实现青山常在，永续利用。 ——通过改革创新，提升治理效能。以满足人民日益增长的优美生态环境和优质生态产品需要为根本目的，深化林草重点领域改革，突破瓶颈堵点，激发发展活力，强化科技赋能，提高数字化智能化应用，提升治理能力水平。 展望2035年，国土绿化质量效益全面提升，基本建成以国家公园为主体的自然保护地体系，生态系统多样性稳定性持续性显著提升，林草优质产品供给能力大幅提高，现代化林草产业体系更加完备，林草对经济社会高质量发展的贡献明显增强。 落实主体功能区战略，立足生态本底、林草资源禀赋和自然演替规律，坚持北方扩绿、南方提质为主的国土绿化总体格局，因地制宜、分区施策。三北工程区，聚焦荒漠化综合防治，打好“三北”工程攻坚战，促进黄河重点生态区、北方防沙带、东北森林带生态保护修复，因地制宜发展林草产业。青藏高原生态屏障区，聚焦自然保护地建设，全面加强自然生态系统保护修复。长江重点生态区和南方丘陵山地带，聚焦森林空间复合利用，加强生物多样性保护，精准提升森林质量，开展石漠化综合治理，壮大林草产业。海岸带，聚焦沿海防灾减灾带建设，保护滨海湿地，建设沿海防护林带。 二、科学开展大规模国土绿化行动 （一）推进重要生态系统保护修复。加快实施重要生态系统保护和修复重大工程，在青藏高原等“三区四带”生态屏障区，实施山水林田湖草沙一体化保护和系统治理，因地制宜，综合采取保护和修复、自然和人工、生物和工程等措施，统筹利用绿化空间，以地定绿、以水定绿、适地适种，宜林则林、宜草则草、宜荒则荒，开展营造林、退化草原修复、湿地保护恢复、荒漠化石漠化和水土流失综合治理。 （二）打好“三北”工程攻坚战。以黄河“几字弯”攻坚战、科尔沁和浑善达克沙地歼灭战、河西走廊—塔克拉玛干沙漠边缘阻击战为重点，持续开展沙化土地综合治理，合理配置林草植被类型和密度，强化区域联防联治。扎实有序推进荒漠化防治与风电光伏一体化建设。推广改草治沙、以路治沙、科技治沙、以工代赈。强化建设项目水资源论证，推动项目实施与水资源承载能力相协调。创新工程建设管理机制，建立生态建设成果长效管护机制。建立健全荒漠化防治动态监测与评估体系。 （三）提升森林草原质量。强化主导功能，分类经营，分区施策，注重提升森林多功能综合效益。科学优化天然林公益林范围，严格保护，自然恢复，促进森林正向演替；加强生态脆弱区系统治理，人工促进森林更新提质；强化规模化集约化经营，合理利用资源，提高林地生产力。持续巩固退耕还林还草建设成果。实施森林生态系统固碳增汇能力提升行动，推动森林碳汇项目参与全国温室气体自愿减排交易市场。开展草原改良和退化草原治理，加强禁牧轮牧，协同推进解决超载过牧问题。挖掘林草文化价值，传承林草优秀传统文化，建设人文林业。 （四）提高城乡绿化和义务植树水平。协同推进部门绿化、乡村绿化，持续开展城乡绿化美化彩化，推动身边增绿。推进绿色通道网络、生态廊道、防护林网等建设。创新义务植树尽责形式，推广“义务植树+”新路径。保护古树名木，开展古树名木资源普查，实施古树名木抢救复壮和重点古树群整体保护。 三、全面推进自然保护地体系建设 （五）高质量建设国家公园。落实《国家公园法》，健全国家公园运行机制，持续深化管理体制改革。强化国土空间规划管控，规范空间秩序，加强自然资源资产管理，提升科研、监测、宣教能力。加强生物多样性保护，系统修复生态廊道和整体生境。建立央地、园地协同协调机制，推进社区协调发展，依法保障原有居民权益，促进改善民生。加强国家公园文化建设，培育国家公园全民意识。按照“成熟一个、设立一个”原则，按程序研究设立新的国家公园。 （六）完善自然保护地体系。实施自然保护地整合优化，落实分级管理和分区管控，全面提升自然保护地保护管理水平。完善自然保护区和自然公园管护巡护、防灾减灾、应急救援、自然教育等设施，科学修复受损自然生态系统和珍稀濒危物种栖息地。加强自然保护地与世界自然遗产、世界地质公园等协同保护。 （七）加强珍稀濒危野生动植物保护。加强生物多样性保护，强化珍稀濒危野生动植物种及其栖息地保护，提高大熊猫等旗舰动物保护研究能力，开展重点物种调查监测、人工繁育、野化放归及原生境回归。打击非法捕猎、贩卖、食用野生动物行为，开展全国保护鸟类活动和打击非法捕猎贩卖鸟类专项行动，深入实施候鸟迁飞通道保护修复中国行动计划。加快建设野生动物致害、人兽冲突及疫源疫病监测预警防控体系。统筹迁地与就地保护，按程序有序设立新的国家植物园。 （八）全面保护湿地。健全《湿地保护法》配套制度，研究制定国家重要湿地管理办法，发布国家重要湿地名录及范围。开展国际重要湿地指定和国际湿地城市认证及管理。加强湿地生态系统保护、治理，持续加强红树林保护修复，巩固互花米草防治成效。 四、培育壮大林草产业 （九）提升林草资源供给能力。推动国家储备林高质量发展，推进工业原料林、珍贵树种和大径级用材林基地建设，提高木材自给率。推进草畜共治，探索现代生态草牧场建设，在水土条件适宜的天然草原，以及沙地、裸地等其他土地，适当采取耕种方式建设多年生人工草地。合理利用林下空间种草。因地制宜发展菌草产业。推动丰产竹林基地建设和“以竹代塑”科技创新，助力木竹结构建筑和木竹建材规模应用。完善产业标准体系，引导木竹加工业绿色低碳数智化转型升级，增加高品质木竹制品市场供应。 （十）振兴林草种业。持续开展林草种质资源普查和收集，建设国家林草种质资源库（圃），培育具有自主知识产权、高产优质、抗逆性强的林草品种。加快建设林木良种基地和草种生产基地，推进保障性苗圃建设，提升林草种苗供给能力。 （十一）做大做强森林粮库。释放林草资源空间潜力，推动油茶、核桃等木本粮油提质增效，优化林果、饮品、调料、香料等特色经济林布局，大力发展林下经济，推广林药、林菌、林菜、林蜂等资源复合经营，增加优质森林食物总产量，助力膳食结构调整，满足人民群众既“吃得饱”又“吃得好”需求。 （十二）培育消费应用新场景。推广生态旅游、自然教育、森林康养、花卉苗木、生态观鸟等林草文旅融合新业态。因地制宜发展新质生产力，推动科技创新与林草产业深度融合，推进产品创新和品牌塑造，培育和开发无人机等新技术新产品林草领域应用场景，拓展低空经济新空间。发挥林草资源优势，助力生物材料、生物医药等未来产业发展。 （十三）推动构建现代经营服务体系。引导培育林草头部企业、产业园区和产业集群，推动链群发展。发挥林事服务中心等专业化社会化服务平台作用，培育林草工匠，培训返乡务工人员，提供林机具租赁维保、生产劳动等林事服务，推动林草要素资源市场化高效配置。强化种苗、林草产品等质量监管，加强质量追溯。 五、协同强化生态安全能力建设 （十四）提高森林草原火灾防控能力。推进网格化管理，深化源头治理，构筑人民防线，完善长效机制，推进标本兼治。建强队伍体系，推进装备能力现代化。聚焦环重要目标、环重要设施、城市面山等重点区域，强化科技赋能，提升技防智防水平。建设大兴安岭林区森林火灾防治示范样板。指导行业加强安全生产监管和宣传教育，提升安全生产和防灾减灾救灾能力。 （十五）防治林草有害生物。开展松材线虫病疫情综合防控，实施美国白蛾、鼠害、迁飞性蝗虫、重要经济林果病虫等重大林草有害生物预防和治理，强化新发突发重大林草植物疫情应急处置，提升重大林草生物灾害监测预警、检疫御灾和应急救灾能力。加强生物安全管理，预防外来物种侵害。 （十六）加快补齐基础设施短板。以多重功能为导向，加强林区牧区道路、供水、供电、通信等基础设施建设，提高对生态保护修复、产业发展、乡村全面振兴的支撑作用，实现便民利民富民。引导推动林区产业技术创新基础设施发展。鼓励有条件的地区建设基础配套的“林业标准地”，强化技术服务，吸引社会资本“进山入林”。 六、持续深化重点领域改革 （十七）深入推进集体林权制度改革。坚持机制活、产业优、百姓富、生态美，推动森林经营更加科学高效、支持保护制度更加完善、林权价值增值途径更加多样。依法依规开展集体林地延包试点，加快放活经营权。创新利益联结机制，推广“农户+村集体（国有林场）+国有企业+金融机构+社会资本”等合作共富模式，进一步发展林业适度规模经营。推进先行先试，建设深化集体林改先行区。 （十八）加快建设现代化国有林场。分类完善国有林场管理体制，探索收入分配激励机制，加快建设资源质量优良、生态功能稳定、产业发展充分、基础设施良好的现代化国有林场。推广“国有林场+”模式，支持国有林场发挥自身技术、人才、管理优势，在生态建设、资源管护、产业发展等方面发挥引领作用。 （十九）深化国有林区和草原保护制度改革。推动完善国有林区管理体制，推进国有林区绿色转型发展。鼓励地方先行先试，依法开展国有林地和林地上森林、林木使用权出租、作价出资等合理利用试点。实施第四轮草原生态保护补奖政策，推进基本草原划定和保护管理。 （二十）完善森林可持续经营制度。融合推进森林可持续经营与国土空间治理，开展森林全周期经营管理。强化区域国土空间规划引领和森林经营方案约束，实施以主导功能为基础，保护、治理、利用相融合的森林可持续经营，推动森林多效益协同。指导国有林场（林区）全面实施森林可持续经营，鼓励“场村”联营。 七、全力推动创新驱动与开放合作 （二十一）增强科技创新能力。加强原始创新和关键核心技术攻关，强化科技成果转化应用，大力推广应用林草机械装备，加强一线技术推广、指导，提高林草科技进步贡献率。推进重点实验室、生态定位站等科技平台建设。支持植物新品种创制，加强知识产权保护。推进林草生态服务价值核算和生态产品认证。优化林草标准与质量监测体系，开展林草特色科普活动。 （二十二）建设数智林草。以新一代信息技术赋能林草行业数字化智能化应用，因地制宜开展“人工智能+林草”行动，统筹布局“天空地网”一体化监测体系，整合纳入林草生态网络感知系统。优化林草调查监测体系，强化森林草原湿地荒漠调查监测与国土变更调查协同，合力建好用好自然资源管理和国土空间规划“一张图”。 （二十三）实行高水平对外开放。积极推动习近平生态文明思想国际传播，助力绿色丝绸之路建设，提升与全球南方及重点国家合作水平。推进新一轮大熊猫保护国际合作。深化国际履约，加强与国际组织合作，支持中国—世行集团全球生态系统与转型中心充分发挥作用，支持国际竹藤组织、亚太森林组织发展，建好中阿、中蒙、中国—中亚、中非林草领域合作中心，推动产业、技术、人才合作。 （二十四）加强人才队伍建设。持续实施林草科技创新人才计划，加大科技人才、实用技术人才和创新团队培养支持力度，健全乡土专家认定、使用和激励机制。加强林草领域产教融合创新平台建设，统筹推进教育科技人才一体发展，着力培养拔尖创新人才。引导支持林草学科专业建设，推进林草教育培训专业化师资队伍、高质量课程教材及线上培训平台建设。推进乡镇林长办与林业工作站协同，稳定优化生态护林员政策。 八、加强组织实施 （二十五）统筹编制林草规划。将按领域编制的造林绿化、草原保护利用、林地保护利用、森林经营等规划，统筹纳入林草保护利用规划，精简专项规划数量，切实为基层减负。林草保护利用规划确定发展方向、目标任务、重大工程等，加强跨行政区域协同，强化林草资源管理与国土空间治理融合，落实用途管制和项目布局。 （二十六）强化政策保障。有效配置规划实施的用地、金融、产业等政策。严格规划管控，落实林地草地湿地用途管制，推动用地用林用草用湿联动审批，统筹重大工程建设与生态保护，强化重大项目资源要素保障。引导各方依法依规参与林草生态保护和产业发展，完善多元化林草投入机制，加强林草资金项目全过程监督管理。健全林草统计指标体系，完善林草统计调查制度。加强规划实施监测和生态保护修复成效评估，强化评估结果应用。 （二十七）加强党的领导。坚持党对林草工作的全面领导，确保党中央国务院决策部署贯彻落实。健全林草法治体系，推进相关法律法规制修订，加大执法力度，严厉打击破坏林草资源违法行为。强化林长制督导考核，建立“林长制+”制度机制，发挥林长制对规划实施的督导作用。讲好林草领域生态文明故事，传承弘扬三北、塞罕坝、右玉精神，选树先进典型，营造良好社会氛围，汇聚起建设美丽中国的磅礴力量。 附件1：“十五五”林业草原保护利用主要指标 附件2：“十五五”林草重大工程\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:19.581Z"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","type":"policy","type_label":"政策","issuer":"国务院办公厅","doc_no":"国办函〔2026〕65号","publish_date":"2026-07-14","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202607/content_7075365.htm","summary":"国务院办公厅关于转发生态环境部等部门 《群众身边水体保护治理行动方案》的通知 国办函〔2026〕65号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 生态环境部、国家发展改革委、工业和信息...","themes":["生态保护","水环境"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院办公厅关于转发生态环境部等部门 《群众身边水体保护治理行动方案》的通知 国办函〔2026〕65号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 生态环境部、国家发展改革委、工业和信息化部、住房城乡建设部、水利部、农业农村部《群众身边水体保护治理行动方案》已经国务院同意，现转发给你们，请认真贯彻落实。 国务院办公厅 2026年7月9日 （本文有删减） 群众身边水体保护治理行动方案 生态环境部 国家发展改革委 工业和信息化部 住房城乡建设部 水利部 农业农村部 群众身边水体是指与群众居住区域紧密相邻、生产生活密切相关的江河二级及以下支流和坑塘沟渠等。为加强群众身边水体保护治理，加力解决水污染防治深层次问题，更好推动水生态环境根本好转，制定本行动方案。 一、总体要求 坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，认真落实四中全会部署，全面贯彻习近平生态文明思想，坚持环保为民、问题导向、突出重点、标本兼治，强化综合治理、系统治理、源头治理，将治理重点进一步向县城、乡村延伸，兼顾地表水和地下水，深入打好碧水保卫战，扎实推进美丽水细胞建设。到2030年，基本完成省级及以上工业园区水污染排查整治任务，基本消除县乡黑臭水体，基本控制重点区域畜禽养殖污染对水体的直接影响，群众身边水体基本实现无异色、无异味、无异物，推动水生态环境全面改善。 二、开展水污染突出问题攻坚行动 （一）实施工业园区水污染整治攻坚行动。围绕工业园区环境基础设施建设运维、工业废水收集与排放管控、水环境风险防范等方面问题，全面开展排查整治，加快推进设施建设改造，规范废水收集处理。加强对饮用水水源地、农田等区域周边工业企业和园区废水排放的监管，防范工业废水超标排放、偷排漏排等污染群众身边水体。 （二）实施县乡黑臭水体治理攻坚行动。组织开展县乡黑臭水体调查，建立健全长效机制，制定公布县乡黑臭水体清单，明确治理主体，科学制定治理方案，因地制宜开展控源截污、内源治理、生态修复、活水保质。加快补齐县乡水污染防治设施短板，防止水体返黑返臭。 （三）实施畜禽粪污综合治理攻坚行动。以养殖大县及喀斯特地貌区为重点，聚焦生猪等主要畜种畜禽粪污处理与粪肥还田等方面问题开展排查，加快推进整治，督促畜禽养殖场（户）按规定建设畜禽粪污资源化利用设施设备，确保设施设备处理能力与农作物用肥需求相匹配，满足防雨、防渗、防溢流要求，保障设施设备正常运行、粪污科学利用或达标排放。 （四）实施乡村河湖库管护攻坚行动。以村庄周边河湖库为重点，全面梳理淤塞萎缩、水域岸线侵占、岸坡坍塌、水体污染等问题，将问题较为突出、群众反映强烈的乡村河湖库纳入攻坚行动，逐一建立问题清单、目标清单、措施清单和责任清单，鼓励有条件的地区集中连片推进整治，恢复河湖库基本功能，修复改善水生态环境。 （五）实施小微水体排查整治攻坚行动。全面开展群众房前屋后坑塘沟渠等小微水体排查，实施分级监管、分类治理。对异色、异味、异物等问题突出的，实施源头净化、水体整治、生态修复等措施，畅通水系循环“毛细血管”，建设美丽水细胞，打造一批“小而美”治理样板，为群众提供更多优质普惠的水生态环境产品。 三、加强水污染源头治理 （六）强化工业企业污染防控。持续推动重点涉水行业企业实施清洁生产，从源头减少新污染物排放。开展重点行业企业污水治理与排放水平绩效分级，实施差异化管控，对绩效等级高的企业予以金融、投资、价格等政策支持。加强工业企业和园区雨水排放口监管，严禁通过雨水管网排放工业废水。开展涉重金属矿山、尾矿库、堆（渣）场等环境安全隐患排查整治，逐步削减污染存量。分类有序推进绿色矿山建设，加强动态监管。 （七）加强城镇生活污水收集处理。加快城镇生活污水收集处理设施建设改造，明确污水管网运维单位，加强其专业能力建设，提升污水收集处理综合效能。 （八）推动养殖业清洁生产。充分考虑资源环境承载能力，严格落实环境影响评价制度，鼓励实行分散分布、适度规模养殖。按规定组织确定畜禽散养密集区，结合实际对畜禽粪污进行分户收集、集中处理利用。制定实施畜禽粪肥还田有害物质限量等标准，促进种养结合发展。优化水产养殖空间布局，科学确定养殖规模和密度，鼓励发展不投饵生态养殖。探索加强水产养殖池塘底泥和水产养殖尾水科学利用。 （九）强化入河污染物管控。加强水功能区划定和调整工作，科学划定入河排污口禁设区域，防范结构性、布局性环境风险。将入河排污口排查整治范围向群众身边水体延伸，基本覆盖全流域。完善入河排污口排查整治分级管理台账，实施规范化整治和建设，巩固提升整治质效。加快建设入河排污口分级分类监测监管体系，推动形成突出问题早发现、污染源头早识别、环境风险早预警、违法排污早处置的监管闭环。加强入河排污口智慧感知能力建设。实施总磷、总氮减排工程，探索建立污染物协同治理、小流域区域整体推进的治理模式。 四、提高水污染监督管理效能 （十）优化拓展监测网络。推进水生态环境监测网络向重点入河排污口下游、群众身边水体延伸。结合实际加强农业灌溉水体、以再生水为主要水源的水体、喀斯特地貌区水体监测，保障群众用水安全。鼓励非排污许可重点管理单位开展自动监测。按照规定明确多个单位和个人共用入河排污口的监测责任主体，开展监控、自动监测。加强水质监测与污染源、入河排污口监督监测联动，科学开展污染溯源与监测评估。 （十一）提升督察执法水平。紧盯县城、城乡接合部、乡村等群众身边水体密集区域和喀斯特地貌区，加大现场监督执法力度，规范涉企行政检查管理。加快执法数智化转型，推动相关场所配备监控设备，充分利用环境监测、卫星遥感等数据资源，精准高效识别问题线索，加强非现场监督执法，督促落实污染防治责任。依法依规严厉打击损害群众权益、牟取非法利益造成水体严重污染的违法犯罪行为。推动将群众身边久拖未决的突出水污染问题作为生态环境保护督察重点。 （十二）提高基础支撑能力。制修订一批水环境质量标准、污染物排放标准，加强高盐、高氟工业废水和重金属、新污染物排放管控。加强水华机理研究，密切关注水华高发区域，实施“一河（湖）一策”精准防控。探索创新投融资模式，支持社会资本参与环境基础设施项目，鼓励各类金融机构按照市场化、法治化原则给予融资支持。 各地区各有关部门要高度重视群众身边水体保护治理，树立和践行正确政绩观，强化协同配合，形成工作合力。生态环境部会同有关部门加强统筹协调、指导帮扶和调度会商。中央和各级财政积极支持群众身边水体保护治理。美丽中国先行区率先完成保护治理任务。地方各级人民政府切实履行主体责任，强化重大项目统筹和资金保障，加强水污染防治设施运维管护，确保各项举措落地见效。加强宣传引导，推广优秀案例，正确引导公众参与和社会监督，畅通信访投诉渠道，营造全社会共同参与的良好氛围。重大事项及时按程序请示报告。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:19.610Z"},{"slug":"news-20260613-2d11a028","title":"习近平文化思想指引我国文化遗产保护传承工作高质量发展","type":"news","type_label":"动态","issuer":"屏南县人民政府网（时政要闻）","doc_no":"","publish_date":"2026-06-13","effective_date":"","status":"动态","level":"地方级","region":"屏南","source_name":"屏南县人民政府网","source_url":"http://www.pingnan.gov.cn/sylm/szyw/202606/t20260615_2464137.htm","summary":"屏南县人民政府网“时政要闻”栏目刊发《习近平文化思想指引我国文化遗产保护传承工作高质量发展》，以屏南等地方实践为线索介绍文化遗产保护传承的推进路径，可作为传统村落与城市更新类工作的动态跟踪线索。","themes":["文化遗产保护传承","传统村落","工作动态"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>习近平文化思想指引我国文化遗产保护传承工作高质量发展 _ 时政要闻 _ 屏南县人民政府 国务院 省政府 市政府 你好，{{loginInfo.showname|truncate(12)}} | | 网站支持IPv6 政务公开 政府信息公开 领导信息 机构设置 工作动态 政策文件 政策文件库 人事信息 数据发布 重点领域信息公开 解读回应 政策解读 回应关切 办事服务 政务地图 互动交流 在线访谈 网上调查 意见征集 智能问答 走进屏南   0&quot; style=&quot;display: none;&quot;&gt; 长者模式 守护好中华民族的文化瑰宝——习近平文化思想指引我国文化遗产保护传承工作高质量发展 来源:人民日报 发布时间: 2026-06-13 10:27 中华文明源远流长，中华文化博大精深。我国锦绣山河上遍布的文化遗产，承载着中华民族的基因和血脉，蕴藏着中国人民的伟大创造、卓越智慧和共同记忆。 “要把这些中华文化瑰宝保护好、传承好、传播好”“要把传统和现代有机融合在一起”……习近平总书记的重要讲话，为新时代保护传承文化遗产指明了前进方向，提供了根本遵循。 6月13日是2026年“文化和自然遗产日”。新时代新征程，在习近平文化思想指引下，我国文化遗产保护传承工作取得显著成就，全社会共同守护好中华民族的文化瑰宝，文化遗产绽放时代光彩。 传承文脉，始终把保护放在第一位 台上，唱腔柔美细腻，流派纷呈；台下，观众喝彩连连，年轻人跨城追剧……刚刚落幕的第六届中国越剧艺术节热闹非凡。今年是越剧诞生120周年，一代代传承人以坚守与匠心，赓续中华戏曲的风华。 习近平总书记强调，“秉持敬畏历史、热爱文化之心，坚持保护第一、合理利用和最小干预原则，推动文化遗产系统性保护和统一监管。”“推动文化遗产系统性保护和统一监管”写入“十五五”规划纲要。 一针一线、一丝不苟，姚建萍是苏绣国家级非遗代表性传承人，“七八岁时就跟随母亲拿起绣花针，至今已有近50个年头。如今两个女儿也投身苏绣。”在江苏苏州苏绣小镇，8000余名绣娘手持针线，孜孜不倦，创作精美的“双面绣”。 抢救性保护、生产性保护、整体性保护、数字化保护、生活化保护……我国着力提升非物质文化遗产传承实践能力，保护实践场所，不断增强非遗保护传承活力。 今年4月，2025年度全国十大考古新发现终评会举行。吉林东部长白山旧石器时代遗址群、河南新郑裴李岗遗址……这些考古新发现是对中华文明更悠远更深邃更宽广的探寻，实证着中华文明的突出特性。“何以中国”的故事变得越来越生动立体。 随着文化遗产保护工作取得历史性成就，考古热、博物馆热、非遗热、文创热等热度持续攀升。截至2025年底，全国备案博物馆达7188家，2025年全国博物馆接待观众15.6亿人次。 “仿佛沉浸于历史‘现场’。”游览故宫博物院养心殿后，来自四川的游客魏冰洁说，“点赞文物保护工作者的细致用心。”经过近10年的研究性保护和系统性修缮，养心殿于去年12月重新开放。项目团队还利用三维扫描技术为所有文物建立数字档案，清晰记录下建筑残损风化的痕迹。 数字化让文化遗产焕发新活力。国家级非遗代表性传承人记录工作已为2290名传承人留下数字印记，累计采集原始素材超9.2万小时，收集文献57万余件。 “博物馆内，历史氛围感拉满，未来科技范儿十足。”来自江西的大学生于迪特意用一天时间参观江苏扬州中国大运河博物馆，“我对这条世界上最长人工运河的认识更加深入了。” 走出博物馆，于迪漫步大运河国家文化公园扬州段，“优美的生态环境，深厚的历史文化积淀，带给我非常棒的体验。” 如今，长城、大运河、长征、黄河、长江国家文化公园建设高质量推进，打造传承中华文明的历史文化标识。 今年是红军长征胜利90周年。年初，中国人民大学学生先锋实践团来到黔贵大地，走进遵义会议会址和贵州长征文化数字艺术馆，见证眼前的“红飘带”建筑连接过去、当下与未来。红色旅游持续升温，越来越多人走进各地革命博物馆、纪念馆、党史馆、烈士陵园等，在重温历史、缅怀先烈中增强精神力量。 与古为新，以文化赋能经济社会发展 北京市东城区的隆福寺街区，一座承载了600年历史的文化地标。 一拉，福寿延绵；二对，花开富贵；三抖，三阳开泰……街区摊位前，北京翻里花制作技艺传承人李梅展示着“一翻就变”的技艺魅力。“不放弃老祖宗的技艺，也要有所创新。”李梅说，从“翻花龙”“长城翻里花”到今年的“翻花马手工工具包”，她已研发出上百款新品。 习近平总书记指出：“我一直关注北京的老字号，现在一些老字号传承发展也面临挑战，怎么激发活力？这并不是简单地改头换面，要保留住真正的内涵，同时提升各方面的服务。” 丙午马年春节，不少网友晒出自己的三彩黑釉陶马毛绒挂件，“‘一匹黑马’自带黑马逆袭的好彩头，寓意真的很赞”。 文创的原型正是中国国家博物馆“古代中国”展厅的一匹三彩黑釉陶马。“围绕这匹‘黑马’，我们陆续推出背包、手套、冰箱贴等约50款文创。”中国国家博物馆相关工作人员介绍。 300万件，这是国家博物馆推出的凤冠冰箱贴在一年半时间里的销量；8065亿次，这是去年非遗相关短视频在抖音上的全年播放量。 “十五五”规划纲要提出，“以文化赋能经济社会发展”。 放眼全国，各地博物馆、非遗馆内，文创产品琳琅满目、销售额持续攀升；直播间里，“云”考古热度不减，精彩技艺吸引无数人的目光……传统文化与现代生活紧密连接，中华传统之美绽放新彩。 “逛古镇、品美食、赏非遗，已是出行‘标配’。”在浙江绍兴丰惠古镇，大学生石梦依踏着青石板，喝茶、听戏、下单老字号产品，“体验很有趣，产品很丰富，慢时光的古镇游永远值得期待。” 2025年，各地举办非遗促消费活动3万多场，其中四季非遗购物月主场活动直播销售额达3.65亿元，非遗品牌推广周带动销售额超11亿元……非遗在拉动消费、激活文旅市场方面作用显著。 贵州榕江县，“村超”热度一浪高过一浪。游客点赞：“侗族大歌、苗族木鼓舞等非遗表演，和比赛一样精彩。” 在广大乡村，中华优秀传统文化成为推动文旅发展、建设文明乡风的优质资源。非遗工坊、乡村博物馆，老手艺、老曲目、老习俗成为群众就业增收新亮点。截至2025年，全国建成1.49万余家非遗工坊，带动130万余人就业，生动实现“手艺养活一家人、非遗振兴一个村”。 沟通心灵，促进不同文明交流互鉴 在北京，故宫与天坛，被许多外国朋友列入打卡清单。 今年5月14日，习近平主席同美国总统特朗普参观天坛。祈年殿气势恢宏，重檐琉光。两国元首拾阶而上，步入祈年殿，共同欣赏榫卯斗拱精准契合、天文历法与殿宇结构完美融合的建筑特点，感受其中和谐万物、顺天应时的理念。 “世界文化和自然遗产是人类文明发展和自然演进的重要成果，也是促进不同文明交流互鉴的重要载体。”习近平总书记强调。 英国人大卫是文化遗产爱好者，在他的游玩中国计划中，除了长城、敦煌之外，还有西夏陵。2025年7月，“西夏陵”被列入《世界遗产名录》，中国世界遗产至此达到60项，居世界前列。 申遗捷报频传，文化遗产成为扩大中华文化国际影响力的重要名片。2025年12月，“赫哲族伊玛堪”从急需保护的非物质文化遗产名录成功转入人类非物质文化遗产代表作名录，同时，“‘赫哲族伊玛堪’保护计划”入选优秀保护实践名册。至此，中国列入联合国教科文组织非遗名录、名册的项目总数增至45项，居世界首位。 文物回归，展现守护国宝的坚定决心和实力。去年10月，中方在美国华盛顿接收美方民间机构代表返还的虎形牌饰文物，这是继去年5月接收子弹库帛书二、三卷后，又一次成功接收美方返还重要文物。“十四五”时期，35批次537件/套流失文物艺术品陆续回归祖国，流失文物追索返还工作取得积极成效。 以文化人，更能凝聚人心；以艺通心，更易沟通世界。 品茶，听古琴，赏中华戏曲，尝传统美食……外国朋友对中国非遗产生浓厚兴趣，并争先恐后体验穿汉服、吃火锅、舞鱼灯、打八段锦等中式生活。数据显示，仅今年一季度，中国茶叶出口额便达27亿元。 无论是风靡世界的中国非遗、文创、生活方式，还是日益活跃的文化出海，都彰显了中华文化的魅力。 《黑神话：悟空》中的陕北说书、中国古建筑被全球玩家点赞。2025年，我国自主研发游戏海外市场收入达204.55亿美元；我国网络文学海外市场营收达56.4亿元，覆盖200多个国家和地区……以网文、网剧、网游为代表的文化“新三样”，蕴含着中华优秀传统文化，在海外刮起阵阵“中国风”。 习近平总书记强调：“我们一定要重视历史文化保护传承，保护好中华民族精神生生不息的根脉。” 如今，传承不绝的宝贵遗产激发中华民族的壮志豪情，多姿多彩的古老技艺进入更为广阔的全球市场……全社会的历史自信、文化自信更加坚定，做中国人的志气、骨气、底气极大增强，为以中国式现代化全面推进强国建设、民族复兴伟业注入强大文化力量。（记者 郑海鸥） 相关链接 附件下载 关闭 设区市政府网站 福州市 厦门市 漳州市 泉州市 三明市 莆田市 南平市 龙岩市 宁德市 市政府部门网站 宁德市科学技术局 宁德市发展和改 chments":[],"bodyHtml":"\u003cp>国务院关于印发《城市更新 “十五五”规划》的通知 国发〔2026〕12号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 现将《城市更新“十五五”规划》印发给你们，请认真贯彻执行。 国务院 2026年5月22日 （此件公开发布） 城市更新“十五五”规划 城市是现代化建设的重要载体、人民幸福生活的重要空间。为贯彻落实党中央、国务院关于高质量推进城市更新的决策部署，根据《中华人民共和国国民经济和社会发展第十五个五年规划纲要》，制定本规划。 一、总体要求 坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，认真落实四中全会部署，全面贯彻习近平总书记关于城市工作的重要论述，完整准确全面贯彻新发展理念，坚持稳中求进工作总基调，坚持以人民为中心，坚持系统观念，坚持规划引领，坚持统筹发展和安全，坚持保护第一、应保尽保、以用促保，因地制宜、分类指导，尽力而为、量力而行，建立可持续的城市更新体制机制和政策法规，高质量推进城市更新，为建设现代化人民城市提供坚实基础。 到2030年，城市更新行动取得重要进展，城市开发建设方式转型初见成效，安全发展基础更加牢固，服务效能不断提高，人居环境明显改善，新旧动能加快转换，文化遗产有效保护，风貌特色更加彰显，治理水平大幅提高，城市成为人民群众高品质生活的空间。到2035年，城市更新体制机制更加完善，城市结构优化、动能转换、品质提升、绿色转型、文脉赓续、治理增效取得显著成效，创新、宜居、美丽、韧性、文明、智慧的现代化人民城市基本建成。 二、培育壮大城市发展新动能 （一）增强城市发展动力 推动城市特色化发展。落实区域重大战略，因地制宜实施城市更新，优化现代化城市体系。推进超大特大城市治理现代化，以城市群、都市圈为依托构建大中小城市协调发展格局。坚持城乡融合发展，推进宜居县城建设，开展县城体检，因地制宜发展小城镇，加强边境小城镇建设，推动城镇基础设施和公共服务向乡村延伸覆盖。 精心培育创新生态。推动老旧街区厂区、低效产业园区、低效楼宇等转型升级，优化提升传统产业，培育壮大新兴产业和未来产业，因地制宜发展新质生产力，提升城市产业创新活力。发展智能建造，培育现代化建筑产业链。推动消费基础设施改造升级，发展首发经济、银发经济、冰雪经济、低空经济、赛事经济、体验经济等。培育国际消费中心城市。 （二）激活城市存量资源潜力 全面摸清城市存量资产资源底数，推动已供未开发土地和在建项目分类处置，盘活闲置低效的老旧厂房、商业办公用房、商品住房、公房等。加快构建房地产发展新模式，完善商品房开发、融资、销售等基础制度。优化保障性住房供给，强化城镇低收入住房困难家庭住房保障，更好满足住房困难且收入不高的工薪群体基本住房需求，逐步解决新市民、青年等群体的阶段性住房困难。因城施策增加改善性住房供给，规范发展住房租赁市场。促进房地产开发企业转型发展、参与城市更新。深化住房公积金制度改革，扩大使用范围，着力满足缴存人不同阶段的多样化住房需求，支持灵活就业人员参加住房公积金制度。加强和规范存量城市基础设施资产管理。 （三）提升城市对外开放合作水平 支持有条件的城市承担重大外事外交活动，吸引有影响力的国际组织落户。建设一批国际门户枢纽城市和区域性开放节点城市。发挥世界城市日、全球可持续发展城市奖（上海奖）等作用，加强在联合国人居署等多边合作框架下的城市更新国际交流合作。推进高质量共建“一带一路”，支持建筑企业按市场化原则参与国际合作，提升中国建造品牌国际影响力。 三、营造高品质城市生活空间 （一）推进“好房子”建设 实施房屋品质提升工程，兼顾增量建设与存量更新，全链条提升住房标准、设计、材料、建造、运维水平，建设改造安全舒适绿色智慧的“好房子”。鼓励居民开展既有住房装修和局部升级改造，推广装配式装修和适老化、无障碍改造，应用性能优异的新型建材。在新建、改造住宅项目中开展数字家庭建设，丰富数字家庭应用场景。 （二）持续推动城镇老旧小区改造 重点对建成20年及以上的城镇住宅小区开展专项体检，聚焦补齐基础设施短板、提升服务功能和环境品质实施针对性改造。支持具备条件的楼栋加装电梯。结合改造同步完善长效管理机制，提高管理维护水平。 （三）加快建设完整社区 完善社区基本公共服务设施，逐步补齐便民商业服务设施短板。完善城市社区嵌入式服务设施，推动一刻钟便民生活圈建设扩围升级。加强社区配套基础设施建设改造，优化提升公共活动场地、公共绿地和慢行系统，因地制宜增设健身休闲运动场所，推进社区服务智能化。 （四）推进老旧街区厂区改造提升 改造提升老旧商业街区、生活街区，完善功能布局，补齐基础设施和公共服务短板，优化交通组织，提升公共空间品质，丰富文商旅体展等融合业态，创新沉浸式体验等多元消费场景。实施老旧交通枢纽与周边街区一体化更新改造。推动老旧厂区功能转换，完善厂区及周边配套设施，优化景观环境，加强工业遗产保护利用，盘活利用闲置低效厂区、厂房和设施，植入新业态新功能。鼓励以市场化方式推动老旧厂区改造提升。 （五）提升城市公共服务品质 充分利用存量闲置房屋和低效用地，优先补齐民生领域公共服务设施短板。推动养老机构提质增效，支持有条件的医疗卫生机构开展医养结合服务。建设改造托育服务设施，发展普惠托育和托幼一体化服务。完善全民阅读设施等公共文化服务设施，建设新型公共文化空间。建设改造“小而美”的全民健身场地设施，推动乒乓球等群众喜爱的运动项目进社区、进公园，举办群众身边的赛事活动。整治提升背街小巷环境，开展小微公共空间改造，加快公共场所适老化、无障碍环境建设改造，建设儿童友好空间。 （六）完善城市综合交通体系 优化城市快速路立交和出入口设置，改造瓶颈路段和节点，完善次支路网，实施道路微循环改造工程。严格规范城市轨道交通规划建设，推动轨道交通场站及周边一体化改造。优化城市货运网络规划设计，健全分级配送设施体系。实施老城区停车补短板行动，鼓励建设集约化停车设施，推进停车设施建设改造，按规定配建充电设施。持续开展人员密集区域停车综合治理行动。 四、推动城市发展绿色低碳转型 （一）修复城市生态系统 建设连续完整的城市生态基础设施体系。加快修复受损山体、采煤沉陷区和特大矿坑。加强建设用地土壤污染风险管控和修复，有序推进污染地块环境修复与开发建设衔接。持续深化工业园区水污染整治，强化入河排污口排查整治，建设排污口分级分类监管体系。巩固城市黑臭水体治理成效。保护修复城市湿地，因地制宜推进渠化河道改造，建设幸福河湖、美丽河湖。统筹推进城市噪声等污染治理。结合地方实际，因地制宜、量力而行，完善城市绿地系统，推动公园绿地开放共享，加强古树名木保护。 （二）加快城市建设绿色转型 推动高耗能公共建筑改造升级，鼓励采用合同能源管理等市场化节约能源服务。大力发展绿色建筑，推动超低能耗建筑、低碳建筑规模化发展。建立建筑能效等级制度，优化建筑用能结构。推广绿色设计，持续推进绿色建材评价认证和推广应用，稳步发展装配式建筑。推广绿色施工，鼓励使用新能源车辆和机械，加强建筑材料循环利用，促进建筑垃圾减量化，严格管控施工扬尘和噪声。 （三）践行绿色低碳生活方式 推进城市节水，建设海绵城市。深化气候适应型城市建设。加快城市污水收集处理设施补短板，推动建立厂网统筹的建设运维长效机制。持续完善垃圾分类收集和处理设施体系，健全城市生活垃圾资源回收利用体系。推进城市生活垃圾收运网络与再生资源回收网络融合。推动建筑垃圾利用处置设施建设，开展存量建筑垃圾专项整治。倡导绿色低碳出行，优化公交线网和站点布局，建设公交停车场等设施，建设改造人行道、非机动车道，构建城市绿色慢行交通系统。 五、增强城市安全韧性 （一）有序推进危旧房改造 对城市C、D级危险住房和非成套住房建档立卡并动态更新。用好中央补助资金、地方政府专项债券等，加快拆除改造D级危险住房，精准消除安全隐患。支持老旧住房自主更新、原拆原建，探索可持续运营模式。优先支持资源枯竭城市实施危旧房改造等项目。稳步推进预制板房屋治理改造和地震易发区房屋抗震加固。加强建筑保温材料管理。 （二）稳步推进城中村更新改造 采取拆除新建、整治提升、拆整结合等多种方式，对群众需求迫切、城市安全和社会治理隐患多的城中村优先实施改造。严格落实“一项目两方案”，做到征收补偿到位、项目资金平衡。加强安置房规划设计和建设管理，确保合理工期和建设质量。 （三）加强城市基础设施建设改造 实施城市地下管网和综合管廊建设改造。开展城市地下管网体检，加快实施燃气、供水、排水、污水、热力等老旧管网更新改造，因地制宜推动地下综合管廊建设。推进城市燃气管道老化更新改造，优化燃气设施布局，加强上游供给。推进供水设施更新改造，提高城市供水安全保障能力。完善城市排水防涝体系，健全洪涝联排联调机制。深入实施城镇供热“温暖工程”，推动老旧供热管网和设施设备更新改造，有序推进供热计量改造。统筹国防动员和城市地下管网建设改造。 加快城市基础设施生命线安全工程建设。强化对城市燃气、供水、排水、桥梁、隧道、热力、管廊等城市基础设施运行风险的实时监测、动态预警，及早发现和管控风险隐患。提高城市基础设施生命线安全工程建设运行质效，健全监测体系，完善风险隐患高效协同处置机制。 （四）提升风险防控和应急保障能力 支持盘活闲置低效资源，推进城市平急两用公共基础设施建设，完善医疗应急服务体系和应急物流体系。建设改造应急避难场所，推动平急两用公共基础设施及多种应急资源共建共用，完善应急避难功能，构建多层次应急避难场所体系。加强公共消防设施建设。提升街道、社区应急救援基础设施保障水平。强化城市道路桥梁安全管理，对超过设计使用年限或经专业检测发现存在安全隐患的D、E级桥梁隧道进行更新改造。提升工程防火保障能力，加强工程防火和消防审验技术力量，建设国家工程防火实验室和防火能力仿真模拟自主平台。提升高层建筑火灾防范和救援能力。 （一）推进资源调查 建立健全“先调查后建设”的保护前置机制。加强与全国文物普查衔接，开展老城区、老街区专项调查，形成历史文化名城、街区和历史地段、历史建筑潜在对象名单，开展预保护。按规定认定公布国家历史文化名城，推进省级和市县级保护对象认定公布，规范设立标志牌，开展数字化信息采集和测绘建档。 （二）加强整体保护 整体保护历史文化名城、街区和文物及周边风貌。开展历史文化名城、街区保护提升工程。开展不可移动文物、历史建筑和传统民居修缮。建立以居民为主体的保护实施机制，提升人居环境品质。坚决防止大拆大建、拆真建假。 （三）推动活化利用 活化利用不可移动文物、历史建筑、工业遗产、历史文化街区、历史地段等，在严格保护其核心价值与风貌的前提下，引入新业态新功能，以文化赋能产业发展，丰富城市文化体验、旅游休闲功能，同时避免过度商业化、同质化。 （四）塑造城市特色风貌 完善城市风貌管理制度。加强城市更新重点地区、重要地段风貌管控，保护城市独特的历史文脉、人文地理、自然景观，植根中华优秀传统文化，塑造特色风貌。开展城市设计并作为城市风貌管理的重要依据，提出建筑高度、体量、风格、色彩等控制要求，从整体平面和立体空间上统筹建筑布局、协调景观风貌、提升空间品质。 加强建筑设计管理。落实“适用、经济、绿色、美观”建筑方针，推动建筑设计传承创新，更好体现中华美学和时代风尚。强化优秀建筑设计作品正向引导作用，提升建筑设计质量。严格限制超高层建筑。提高既有建筑改造设计水平。提升住宅建筑设计品质。 七、提升城市治理能力水平 （一）完善城市治理工作体系 建立健全城市管理统筹协调机制，发挥好“一委一办一平台”作用，加强对城市治理工作的指挥调度、组织协调、监督评价，依托数智化手段提升城市运行和治理效能。探索社区党组织领导下的居委会、业委会、物业服务企业协调运行新模式。完善居民、企业、群团组织、社会组织参与城市治理制度机制，发挥志愿服务作用，拓宽新就业群体参与渠道。 （二）推动城市治理重心和配套资源下沉 发挥党建引领基层治理协调机制作用，加强跨部门工作统筹和协同联动。坚持和发展新时代“枫桥经验”，深入开展城市管理进社区工作，运用“吹哨报到”、“接诉即办”等工作机制，及时解决群众急难愁盼问题。加强物业服务市场监管，推动“物业服务进家庭”，鼓励有条件的物业服务企业向养老、托育、家政、文化、健康、助残等领域延伸。推动住宅小区建设骑手友好社区。加强互嵌式社区建设。 （三）推动城市治理智慧化精细化 推进城市全域数字化转型，建设城市信息模型（CIM）基础平台，打造集约统一、数据融合、高效协同的城市数字底座。完善CIM基础数据库和标准体系，丰富拓展“CIM+”在城市更新中的应用场景。推进房屋建筑和市政设施赋码，建设国家房屋建筑和市政设施基础信息库。推动区块链赋能住房交易、产权登记等。健全国家、省、城市三级城市运行管理服务平台体系，推动城市运行“一网统管”。 八、建立城市更新政策体系 （一）健全城市更新实施机制 全面开展城市体检，建立完善“专项规划—片区策划—项目实施方案”的实施体系，健全城市体检与城市更新一体化推进机制。建立城市更新项目库，推动项目常态化储备和动态调整。建立与建筑功能转换和混合利用需求相适应的规划调整机制，完善城市更新工程建设项目审批管理制度。规范开展城市更新示范项目创建。实施城市更新统计调查制度。按照简明精准、务实管用原则，研究建立科学的城市发展评价体系。 （二）构建可持续的城市建设运营投融资体系 完善财政支持政策。通过中央预算内投资等对符合条件的项目给予支持。中央财政支持实施城市更新行动。允许通过地方政府专项债券支持符合条件的城市更新项目建设，支持用作项目资本金。地方政府加大财政投入，在确保完成国家任务的前提下，推进相关资金整合和统筹使用。落实城市更新相关税费减免政策。 优化金融支持措施。发挥各类金融机构作用，引导金融机构按照市场化、法治化原则，在业务范围内为城市更新项目提供金融服务，不得新增地方政府隐性债务。对风险可控、商业可持续、符合条件的项目，允许采用综合开发、银团贷款、项目投资等市场化模式给予支持。探索金融支持城镇老旧住房自主更新、原拆原建的有效举措。 积极吸引社会资本参与。推动符合条件的城市更新项目发行基础设施领域不动产投资信托基金（REITs）、资产证券化产品等。支持符合条件的城市更新企业发行公司债券、中期票据等。按照谁受益、谁出资原则，充分发挥市场机制作用，构建政府、市场、居民资金合理共担机制。规范实施政府和社会资本合作新机制，鼓励民营企业积极参与城市基础设施建设运营。稳慎推进公用事业价格改革。 （三）更大力度支持盘活存量土地 规范空间复合利用。增强国土空间详细规划适应性，制定土地混合开发和空间复合利用的正面清单并明确规划管控要求，建立健全国土空间用途管制和规划许可制度，推行多部门并联审批和联合监管，推动土地用途和建筑功能依法合理转换。利用存量土地、房产资源发展国家支持产业、行业的，可享受一定年期内不改变用地主体和规划条件的过渡期政策，过渡期原则上不超过5年；过渡期满办理土地有偿使用手续的，可采取租赁或协议出让方式。 鼓励多主体合作改造。合理降低土地整合、置换、联合开发中的税费负担。规范长期租赁、先租后让、弹性年期供应等土地供应方式，支持带方案出让。依法稳妥推进工商业用地使用权续期。完善地价计收规则。 优化不动产登记服务。健全与混合利用、功能兼容、立体开发相适应的不动产登记规则。按照土地使用权地上地下空间分层供应情况，依法依规办理登记。灵活采用预告登记、按户首次登记等登记类型提供服务。因历史文化、特色风貌保护等原因需要保留建筑物、构筑物的，支持在确保安全的前提下，简化不动产登记申请材料。 （四）建立房屋全生命周期安全管理制度 建立房屋安全体检制度，对超过一定年限的房屋建筑定期开展体检，及时发现和处置安全隐患。建立房屋安全管理资金制度，统筹现有房屋安全管理相关资金，支持拓展资金来源，为房屋全生命周期安全管理提供资金保障。建立房屋质量安全保险制度，以市场化方式提高房屋安全保障能力。 （五）构建多主体协同参与机制 政府统筹协调各类存量资源，支持国有企业、民营企业参与城市更新。发挥街道、社区作用，建立居民、产权人、企业等多方主体参与机制。建立城市更新专家库和智库，引导专业技术力量提供全过程咨询服务。培育城市更新专业化运营机构。完善城市更新社会风险评估、矛盾化解处置机制。 （六）健全法律法规标准体系 研究修订城市房地产管理法、建筑法等法律。研究制定城市更新、城镇住房保障、城镇房屋安全管理、城乡历史文化保护传承、城镇地下管线管理、建设工程消防设计审查验收等相关法规，修订住房公积金管理条例、物业管理条例、历史文化名城名镇名村保护条例等法规。支持有立法权的地方出台城市更新相关地方性法规。研究健全城市更新标准体系，完善城市设计、城市体检、城市更新专项规划、历史文化保护、城市基础设施、市容环境卫生等标准。鼓励制修订符合地方需要的技术标准。 （七）强化科技人才支撑作用 开展可持续城市更新关键技术和装备攻关。加强城市更新科研力量。建设城市更新重点领域科技创新平台基地。支持有条件的高校、职业学校开设城市更新相关学科专业。支持高校、科研院所、骨干企业联合培养城市更新工程硕博士、卓越工程师。开展城市更新领域特色学院建设，实施城市更新领域职业教育高技能人才集群培养计划。实施建设英才培养计划。将城市更新作为干部教育培训重要内容，加强城市更新工作培训，定期组织领导干部培训，加强专业技术人员培训。 九、组织实施 坚持和加强党中央集中统一领导，构建中央统筹、省负总责、城市抓落实的工作格局。各省（自治区、直辖市）人民政府要明确本地区城市更新的目标、任务和措施。各城市人民政府要切实履行责任，细化落实本规划确定的重点任务，确保顺利实施。要加大宣传力度，广泛宣传新时代党领导城市更新的创新政策和工作成效，积极营造良好氛围。住房城乡建设部要会同有关部门加强统筹指导和协调支持，开展规划实施情况动态监测、中期评估和总结评估。重大事项及时按程序向党中央、国务院请示报告。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:19.630Z"},{"slug":"policy-20260417-2dbdaa40","title":"关于开展2026年度中央财政支持实施城市更新行动的通知","type":"policy","type_label":"政策","issuer":"财政部办公厅 住房城乡建设部办公厅","doc_no":"财办建〔2026〕14号","publish_date":"2026-04-17","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202604/content_7066082.htm","summary":"关于开展2026年度中央财政支持实施城市更新行动的通知 财办建〔2026〕14号 各省（自治区）财政厅、住房城乡建设厅，新疆生产建设兵团财政局、住房城乡建设局： 为贯彻党的二十大、中央城市工作会议","themes":["城市更新","财政支持"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>关于开展2026年度中央财政支持实施城市更新行动的通知 财办建〔2026〕14号 各省（自治区）财政厅、住房城乡建设厅，新疆生产建设兵团财政局、住房城乡建设局： 为贯彻党的二十大、中央城市工作会议关于实施城市更新行动的决策部署，落实中央经济工作会议和政府工作报告有关要求，2026年中央财政继续支持部分城市实施城市更新行动，开展相对集中联片的重点样板片区建设和可持续的城市更新机制建设，进一步突出投资和消费相结合、投资于物和投资于人相结合，促进城市基础设施建设由“有没有”向“好不好”转变，解决人民群众的急难愁盼问题，实现城市高质量发展。现就有关要求通知如下： 一、工作目标 财政部、住房城乡建设部通过竞争性选拔，确定部分基础条件好、积极性高、特色突出的城市，在城市层面整合各类资源，探索建立资金、用地、金融等各类要素保障机制，形成工作合力。中央财政对入围城市给予定额补助。入围城市制定城市更新工作方案，统筹使用中央和地方资金，明显提升城市基础设施水平，改善老旧片区人居环境，完善法规制度、规划标准、投融资机制及相关配套政策，探索城市更新可复制、可推广的机制和模式。 二、申报条件 2026年，中央财政支持实施城市更新工作的范围为地级及以上城市，共评选不超过15个城市。 每省（自治区）及新疆生产建设兵团可推荐1个城市参评，申报城市需同时满足以下基础条件： 1.建立推动城市更新工作的组织领导和协调工作机制，制定中央财政支持实施城市更新行动工作方案，具体实施范围相对集中，主要位于城市老城区； 2.城市财力满足城市更新投入需要，地方政府债务风险可控，不得因开展城市更新形成新的政府隐性债务； 3.2024年1月1日以来，在住房和城乡建设领域未出现重大生产安全事故或重大负面舆情事件。 三、遴选组织方式 中央财政支持的城市采取竞争性评审方式选拔确定，重点向基础工作扎实、条件俱备、积极性高的城市倾斜。 （一）省级推荐。省级财政、住房城乡建设部门对照申报要求，择优推荐本地区符合条件的城市参与评审，组织编制工作方案，并提供必要的支撑材料。 （二）书面评审。财政部、住房城乡建设部组织专家对城市申报方案进行审查。按照120%差额比例确定进入现场答辩的城市名单。 （三）现场答辩。进入现场答辩的各城市派员参加公开答辩，具体要求另行通知。 （四）集中公示。综合书面评审和现场答辩得分情况，确定入围城市。入围城市经过公示，无异议的确定为中央财政支持实施城市更新行动城市。存在违规行为并经查实的，取消资格。 四、补助标准和支持范围 （一）中央财政资金补助标准。中央财政按区域对实施城市更新行动城市给予定额补助。其中：东部地区每个城市补助总额不超过8亿元，中部地区每个城市补助总额不超过10亿元，西部地区每个城市补助总额不超过12亿元。资金根据工作推进情况分年拨付到位。 （二）资金支持方向。中央财政资金支持入围城市的重点样板片区建设和机制建设2个方向： 1.城市更新重点样板片区建设。一是城市基础设施品质提升，包括城市供水、供热、污水垃圾收集处理、综合杆箱、停车设施等改造建设。二是完整社区建设与小区配套设施改造，包括社区公共服务设施与便民商业服务设施建设改造、公共活动场地提升、居住区配套市政设施优化改造等。三是历史文化街区、既有公共建筑、公共空间等老旧片区（街区）更新改造及活化利用。四是利用存量土地和闲置房屋市政设施，补齐民生领域公共服务设施短板，建设消费型基础设施等。 2.城市更新机制建设。一是项目储备和生成机制。近远结合、系统谋划建设项目，可形成的机制包括但不限于城市更新项目谋划、储备、实施时序的方式，城市体检评估、城市更新专项规划—片区策划—项目实施方案的规划实施体系，房屋全生命周期安全管理、地下管线统筹、城市更新项目储备库建设、建设成效后评估机制等。二是资金安排筹措和行业发展长效机制。建立有利于统筹用好财政、金融资源的机制。财政资金方面，充分运用好国债资金、中央预算内投资、地方政府一般公共预算、地方政府专项债券、其他政府性基金预算、国资预算等，最大程度发挥财政资金效能。金融支持方面，探索优化金融机构信贷支持模式，鼓励社会资本进入。同时，建立合理的成本分担机制以及有利于行业发展的长效机制，如居民小区二次供水设施专业化运维机制、污水收集处理设施建设运维统筹长效机制、以污水收集效能提升为导向的按效付费机制、完整社区建设运营机制等。三是用地保障和审批机制。包括盘活利用存量低效用地、存量土地和闲置房屋及市政设施的相关机制，适用于改造类项目的城市更新项目审批制度，城市更新有关法规制度和技术标准等。中央资金可用于上述三类机制建立过程中的相关支出。 各城市要按照因地制宜、因城施策的原则，突出本次城市更新的重点内容，聚焦城市老城区，集中打造城市更新的样板片区、样板项目。同时，应与现有支持政策做好统筹衔接，具体项目上不得重复申请中央预算内投资、车购税资金、超长期特别国债等其他渠道中央资金，防止交叉重复。各城市要树立和践行正确政绩观，坚决杜绝急功近利、弄虚作假、盲目蛮干、违背群众意愿不切实际决策，坚决杜绝搞“形象工程”和“政绩工程”、政策规划“翻烧饼”，坚决杜绝项目烂尾闲置和“半拉子”工程。 五、日常跟踪、监督检查及绩效管理 省级住房城乡建设、财政部门应加强对入围城市的日常指导、跟踪和监督，及时将工作进展、存在问题及经验做法等报住房城乡建设部、财政部，原则上每个城市每年不少于1期。 财政部、住房城乡建设部将按照《中央财政支持城市更新行动绩效评价办法》及中央资金预算管理有关要求开展绩效评价。 六、其他事项 （一）各省级财政、住房城乡建设部门应于2026年5月8日前联合行文将申报材料报送财政部、住房城乡建设部，并组织申报城市通过财政部、住房城乡建设部邮箱报送电子版（含佐证材料），或通过光盘等移动存储方式邮寄，申报材料不得包含任何涉密文件、涉密内容，电子版材料大小不超过8GB。为厉行节约，除省级财政、住房城乡建设部门的正式申报函外，申报城市的实施方案及相关支撑材料一律报送电子版。 （二）各申报城市应按要求编制工作方案（实施期三年），减少申报工作支出。各地不得委托财政部、住房城乡建设部及其所属行政、企事业单位和工作人员以任何方式（署名或者不署名）参与工作方案的编制工作；不得简单交给中介机构或技术团队“编本子、讲故事”，印制豪华材料。 （三）请各省（自治区）及新疆生产建设兵团严格按照通知明确的数量和要求推荐城市、报送材料等，并对报送内容真实性负责。对不按要求报送或申报内容明显不实的城市，将取消当年申报资格。 （四）经竞争性评审确定入围的城市，请将三年行动总体绩效目标表、2026年度绩效目标表加盖城市（师市）人民政府公章后，于公示期结束前报财政部、住房城乡建设部备案。在后续3年的建设期内，各城市应在每年5月底前，报送下一年度的绩效目标表并加盖城市（师市）人民政府公章。 联系方式： 财政部经济建设司： 电话：010—68554521，邮箱：shikelu@mof.gov.cn 住房城乡建设部城市建设司： 电话：010—58933160，邮箱：chengshui@mohurd.gov.cn 附件： 1.城市更新行动（2026—2028年）工作方案编制大纲.docx 2.实施城市更新行动绩效指标体系.docx 3.XX市实施城市更新重点样板片区实施内容汇总表.xlsx 财政部办公厅 住房城乡建设部办公厅 2026年4月13日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7 场，开封市文物考古研究院院长王三营指着清晰的地层剖面介绍，“在现代开封城下3至12米处，还上下叠摞着6座古城址的文化层。” 州桥，是北宋东京城御街与大运河（汴河段）交叉点上的标志性建筑。 “北宋中晚期，每到放榜之日，赴京赶考的举子们便云集于此，翘首以盼金榜。那时的州桥是承载士人理想、映照时代风云的文化高地和精神标识。”望着州桥，王三营脑海中总会浮现浪漫的联想，“或许我们和苏轼、王安石，脚踩过同一块青砖呢。” 2018年至2022年，河南省文物考古研究院联合开封市文物考古研究所（现“开封市文物考古研究院”）对州桥遗址开展持续性考古发掘，并出土北宋时期巨幅石雕祥瑞壁画。《东京梦华录》中所记载的“近桥两岸皆石壁，雕镌海马水兽飞云之状”的胜景，重现在世人眼前。 图为州桥遗址考古发掘现场（2026年3月23日摄）。新华社记者 李嘉南 摄 2025年5月，习近平总书记在河南考察时指出：“中华文明博大精深，值得我们多到实地去寻溯。” 随着州桥及汴河遗址公众考古研学示范基地建成开放，越来越多的孩子们来到考古探方边，感悟千年风雅。 从文物保护到文旅融合，从城市规划到民生改善，在开封，文化渗透于经济社会发展的方方面面。 近20年来，开封市围绕古城风貌保护，先后编制了一系列规划文件，始终坚持“小式建筑、限高15米、灰色基调、宋风宋韵”的总体风格。古城保护与城市更新，于开封而言，不是取舍，而是共兴。 图为开封铁塔（2026年3月23日摄，无人机照片）。新华社记者 李嘉南 摄 铁塔、繁塔等“宋文化”地标依然挺立，双龙巷、珠玑巷等历史上知名的街巷韵味十足，行走在开封，仿佛漫步于图籍中、徜徉在古今间。 纵然历史上的汴河已化为故道，它流淌出的悠悠文韵却从未“断流”，润泽着一代代开封人的心田。 以文兴业：重绘清明上河 “各位大人好，欢迎来到开封府参加大宋同签会……”开封府景区全息剧场内，依托宋画创排的《闸口盘车案》正在上演，虚实交错间，赢得观众阵阵掌声。 “太震撼了！无论是数字化复原的街道景观，还是全息立体成像的‘大宋官员’，都让人仿佛穿越千年。”广西游客伍玥说。 开封府外的码头边，游船已满载游客，沿着波光粼粼的大宋御河悠然驶去。河道两岸，包公祠、清明上河园、天波杨府等景区串珠成链。 2026年3月23日，游客在开封清明上河园景区游玩（无人机照片）。新华社记者 李嘉南 摄 “一城宋韵半城水”，在开封，水脉蕴文脉，水运即城运。 “我小时候，开封城内的水系并不像现在这样整体连通。”作为土生土长的本地人，开封市文化旅游投资集团有限公司工作人员王振豫见证了开封“一渠六河”综合治理工程全线通水，“如今的老城区内，包公湖、龙亭湖、铁塔湖等五湖贯通，一川清流、两岸锦绣。” 2025年5月，习近平总书记在河南考察时指出：“文旅融合前景广阔，要推动文旅产业高质量发展，真正打造成为支柱产业、民生产业、幸福产业。” 殷殷嘱托，言犹在耳。近年来，开封依托丰厚的“宋文化”资源，主动求新求变，沿城内水系打造景观带、文化带、旅游带，不断擦亮“宋文化看开封”的金字招牌。一幅水光潋滟的“新时代清明上河图”已然在开封铺展开来—— 清明上河园中，沉浸式“餐饮+演艺”项目《清明上河·宋宴》叫好叫座，游客们在雅乐之中品味千年食趣；万岁山武侠城里，超3000场实景演出轮番上演，让人直呼“过瘾”；华灯初上时，鼓楼夜市的叫卖声此起彼伏，尽显人间烟火气…… 2025年3月6日，游客在开封清明上河园景区游玩（无人机照片）。新华社记者 李嘉南 摄 据开封市文化广电和旅游局测算，2026年春节假期，开封全市累计接待游客1073.56万人次，实现旅游综合收入75.8亿元，按可比口径同比分别增长6.03%和7.12%。开封已成为中原地区最具吸引力的旅游目的地之一。 “在龙头景区的带动下，开封已逐步构建起涵盖古都游、民俗游、红色游、乡村游的全域旅游产品体系，让游客从‘打卡一个点’转向‘逛遍一座城’，推动城市从‘现象级爆红’稳步走向‘可持续长红’。”开封市文化广电和旅游局主要负责人说。 向新而行：澎湃发展动能 马年春节前夕，一场别出心裁的民族乐器复刻展演在中国（河南）自贸区国际艺术品保税仓上演——古装打扮的乐师们手指翻飞，悠扬的旋律声声入耳，让人真切感受到“八音克谐”的美妙意境。 “我们依据古画《合乐图》，复刻出琵琶、箜篌等19件乐器，并由专业演奏人员进行情景式演绎。”这一展演的主创方之一、深圳市佳音王科技股份有限公司相关负责人介绍，这一“乐器复刻+非遗展演+音乐创作”的模式，正推动民族乐器从产品出口转向文化IP（知识产权）输出。 2025年7月26日，上海合作组织媒体智库峰会与会嘉宾在中国（河南）自贸区国际艺术品保税仓观看民族乐器复刻展演。新华社记者 袁月明 摄 2025年全国两会期间，习近平总书记在参加江苏代表团审议时强调“以文化赋能经济社会发展”。 古都开封，高扬推动高质量发展的文化之帆，不断加快走向世界的步伐。 “2021年8月，第二批国家文化出口基地名单公布，中国（河南）自由贸易试验区开封片区成功入选。”中国（河南）自由贸易试验区开封片区管委会常务副主任郑红英介绍，近年来，开封已逐步构建起全方位、多层次的文化产业国际化发展格局。 据悉，2025年中国（河南）自由贸易试验区开封片区文化产品进出口额达4.2亿元，同比增长641.3%。自开仓以来，这一片区累计文化贸易进出口总额已突破14亿元。 将目光投向更宏阔的未来，开封在守牢文化根基、激活文旅引擎的同时，也在积极谋篇布局，为城市发展积蓄新动能。 图为奇瑞汽车股份有限公司河南分公司生产车间（2026年3月23日摄）。新华社记者 李嘉南 摄 走进奇瑞汽车股份有限公司河南分公司生产车间，只见一派热火朝天的繁忙景象。伴随不停挥舞的机械臂，一辆辆汽车接连下线。不久后，它们便会通过距离生产基地不远的开封综合保税区直接出口。据介绍，平均每4分钟，就有一辆奇瑞汽车从开封“驶”向海外。 “开封正加快打造汽车制造、现代食品、文化旅游三个千亿级产业链。我们将坚定把制造业高质量发展作为主攻方向，构建具有开封特色的现代化产业体系。”开封市委主要领导同志充满信心地说。 春风吹过开封兰考东坝头，黄河在此处拐过最后一道弯，滔滔东去。正如焦裕禄当年在兰考战风沙、治盐碱时的那股劲，今日开封，正凭着这迎难而上、扎根群众的奋斗精神，在高质量发展的道路上勇毅前行。 伴着文化带来的蓬勃力量，这座不满足于“一眼千年”的城市，正一步一个脚印，在古与新、守与进的平衡中，不断跃迁。 记者：李俊、袁月明 海报制作：袁月明、李嘉南 (责编：黄莎、杨晓娜) 推荐阅读 以制度刚性约束权力任性（有所思） 干部乱作为，本质是有权任性、履职失范、用权失序。有的拍脑袋决策，无视程序，脱离实际；有的滥用权力，搞“选择性执法”“同案不同罚”；有的即便出了错，也缺乏自我纠正的勇气和机制。… 郑州四年吸引青年人才近百万人 河南郑州高新技术产业开发区一家企业的研发实验室里，30岁的杜振洋讲起最新的AI无人机研发方案，滔滔不绝，眼里有光。眼下，他的团队正攻坚AI自动化技术，团队研发的大载重无人机，直接服务500多家客户。… 推荐视频 绘说现代化丨“豫”见精彩 新春走基层 |“00后”的甜蜜“守艺” 新春走基层丨“泥咕咕”高飞 人民日报 人民网+ 手机人民网 领导留言板 人民视频 人民智云 --&gt; 人民智作 热门排行 1 《数智赋能正能量生产传播态势报告》发布 2 阔别50载的双向奔赴！“孪生”妇好鸮尊… 4 留言板·观豫⑪｜电动车治理难题咋破？多… 5 传承文明拥抱春天 2026开封清明文化… 6 全省树立和践行正确政绩观学习教育座谈会… 7 河南淅川：以花为媒激活春日经济 8 郑州四年吸引青年人才近百万人 9 我国首款七吨级运投无人机首飞成功 10 三门峡陕州区：黑树莓“种”出乡村振兴新… 人民日报社概况 | 关于人民网 | 报社招聘 | 招聘英才 | 广告服务 | 合作加盟 | 供稿服务 | 数据服务 | 网站声明 | 网站律师 | 信息保护 | 人民日报违法和不良信息举报电话：010-65363263 举报邮箱： jubao@people.cn 人民网服务邮箱： kf@people.cn 违法和不良信息举报电话：010-65363636 举报邮箱： rmwjubao@people.cn 互联网新闻信息服务许可证10120170001 | 增值电信业务经营许可证B1-20060139 | 广播电视节目制作经营许可证（广媒）字第172号 信息网络传播视听节目许可证0104065 | 网络文化经营许可证 京网文[2020]5494-1075号 | 网络出版服务许可证（京）字121号 | 京ICP证000006号 | 京公网安备11000002000008号 人 民 网 股 份 有 限 公 司 版 权 所 有 ，未 经 书 面 授 权 禁 止 使 用 Copyright © 1997-2026 by www.people.com.cn. all rights reserved 关注 第一时间为您推送权威资讯 报道全球 传播中国 关注人民网，传播正能量\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01
