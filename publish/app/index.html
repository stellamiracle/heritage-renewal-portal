中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/2021-11/08/content_5649764.htm","summary":"国务院办公厅关于印发 “十四五”文物保护和科技创新规划的通知 国办发〔2021〕43号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 《“十四五”文物保护和科技创新规划》已经国务院同意，现...","themes":["文物保护","文化遗产"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>国务院办公厅关于印发 “十四五”文物保护和科技创新规划的通知 国办发〔2021〕43号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 《“十四五”文物保护和科技创新规划》已经国务院同意，现印发给你们，请认真贯彻执行。 国务院办公厅 2021年10月28日 （此件公开发布） “十四五”文物保护和科技创新规划 为贯彻习近平总书记关于文物工作的重要指示批示精神，加强“十四五”时期文物保护和科技创新工作，根据《中华人民共和国文物保护法》、《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》和党中央、国务院决策部署，制定本规划。 一、发展环境 “十三五”时期，各地区各部门扎实推进文物工作，文物事业取得显著进步。完成第一次全国可移动文物普查，登录国有可移动文物1.08亿件/套。国务院核定并公布第八批全国重点文物保护单位。文物保存状况持续改善，安全形势总体平稳。文物领域科学研究和技术创新取得重要进展。考古和历史研究成果丰硕。革命文物保护利用全面加强。博物馆事业高速发展，社会文物管理改革稳步推进。文物活化利用不断深入，文物保护的社会共识逐渐加深。文物国际交流合作向纵深拓展，我国在国际文化遗产领域影响力与日俱增。文物保护法律制度日臻完善，保护管理力量不断加强，治理能力和治理水平有所提升，党委领导、政府负责、部门协同、社会参与的工作格局不断完善，文物事业为弘扬中华优秀传统文化、凝聚共筑中国梦磅礴力量作出重要贡献。 “十四五”时期是我国开启全面建设社会主义现代化国家新征程的第一个五年，也是推进社会主义文化强国建设、推动实现从文物资源大国向文物保护利用强国跨越的关键时期。国际环境日趋复杂，不确定性显著增加，需要发挥好文物工作独特优势，展示真实立体全面的中国，增强中华文化影响力，为构建人类命运共同体贡献力量。文物事业发展处于重要战略机遇期，文物工作使命光荣、责任重大。我国进入高质量发展阶段，文物安全形势依然严峻，保护管理机构队伍和专业力量依然薄弱，文物科技创新能力和应用水平亟待提升，考古在实证中华文明史和文化研究方面的作用亟待强化，文物保护利用不平衡不充分问题依然存在，文物资源管理、价值阐释、执法督察、民间收藏等重点领域改革任务依然艰巨。 二、总体要求 （一）指导思想。 高举中国特色社会主义伟大旗帜，坚持以习近平新时代中国特色社会主义思想为指导，深入学习贯彻党的十九大和十九届二中、三中、四中、五中全会精神，认真贯彻落实习近平总书记关于文物工作的重要指示批示精神，增强“四个意识”、坚定“四个自信”、做到“两个维护”，立足新发展阶段、贯彻新发展理念、构建新发展格局，围绕举旗帜、聚民心、育新人、兴文化、展形象的使命任务，贯彻“保护为主、抢救第一、合理利用、加强管理”的文物工作方针，以推动文物事业高质量发展为主题，以深化文物保护利用改革为主线，以强化文物科技创新和人才队伍建设为动力，全面加强文物保护研究利用，全面深化对中华文明的认知，全面提升中华文化影响力，全面推进文物治理体系和治理能力现代化，稳中求进、守正创新，走出一条符合国情的文物保护利用之路，为实现中华民族伟大复兴的中国梦作出更大贡献。 （二）基本原则。 ——坚持党的全面领导。坚持马克思主义在意识形态领域指导地位的根本制度，坚持和完善党领导文物事业发展的体制机制，牢固树立保护文物也是政绩的科学理念，发挥党在文物工作中总揽全局、协调各方的领导作用，为实现文物事业高质量发展提供根本保证。 ——坚持以人民为中心。广泛动员社会力量参与文物保护利用，积极推动文物保护利用融入人民群众生产生活，做到文物保护利用为了人民、依靠人民，不断满足人民日益增长的美好生活需要，增强人民精神力量。 ——坚持依法保护利用。始终把保护放在第一位，健全文物保护利用法律制度、执法机制，落实各级政府主体责任，严守文物安全红线，确保文物本体安全，维护文物周边环境安全，提升全社会文物保护法治意识。 ——坚持科技创新引领。树牢文物保护要依靠科技的发展理念，改善文物科技创新生态，持之以恒加强基础研究，加快推进急需技术攻关和应用，加强人才培养和跨学科合作，推动文物保护利用提质增效。 ——坚持深化改革。全面深化文物领域各项改革，加强文物保护和考古力量建设，合理保障人员待遇，破解制约文物作用更好发挥的瓶颈问题，强化有利于提高资源配置效率、有利于调动全社会积极性的改革举措，让文物活起来，激发文化创新创造活力。 ——坚持系统观念。统筹发展和安全，统筹中央、地方和各方力量，统筹保护和利用，着力补短板强弱项，统筹加强考古、文物保护、安全防范、研究、展示、传播力量，加快构建文物学科体系、学术体系、话语体系，促进系统集成。 （三）主要目标。 到2025年，文物安全形势明显好转，文物保护水平全面提升，文物科技创新能力实现跃升，文物机构队伍力量增强、结构优化，文物领域社会参与活力不断焕发，文物治理体系和治理能力现代化初步实现。中国特色、中国风格、中国气派的考古学建设持续推进，文物蕴含的中华文化基因得到更好挖掘阐释。革命文物保护管理运用体系基本健全，重要作用得到更好发挥。布局合理、结构优化、特色鲜明、体制完善、功能完备的博物馆体系初步形成，博物馆发展质量显著提升。社会文物管理服务更加优化，文物市场健康有序发展。文物工作在坚定文化自信、扩大中华文化影响力、铸牢中华民族共同体意识方面的重要作用愈加彰显，文物保护成果更好惠及人民群众。形成资源管理全覆盖、法律法规更完备的文物保护利用体系，走出一条符合国情的文物保护利用之路。 注：① “四有”工作是指划定必要的保护范围、作出标志说明、建立记录档案、设置专门机构或专人管理。 ② “两线”是指保护范围和建设控制地带。 ③ 12.27亿人次为2019年数据，2020年受新冠肺炎疫情影响，年观众人数为5.4亿人次。 展望2035年，我国将建成与文化强国建设目标相适应的文物保护管理工作体系，科技创新、人才队伍建设有力支撑文物保护研究利用，考古成果实证我国一万年的文化史、五千多年的文明史，博物馆强国建设成效显著，红色基因得到有效传承，根植于深厚历史文化遗产的中华文化影响力大幅提升，民族文化自信显著增强。 三、强化文物资源管理和文物安全工作 坚持以确保文物资源安全为核心，统筹做好各级各类文物资源管理工作，增强防护能力，加强执法督察，严厉打击和防范文物犯罪，守牢文物安全底线。 （一）健全文物资源管理体制。 完善文物登录制度，健全文物调查、申报、认定、登记、定级、公布、降级和撤销程序，梳理明确文物法定命名体系，建立国家文物资源总目录并与中华文化资源普查工程做好衔接。完善不可移动文物资源管理机制，核定并公布第九批全国重点文物保护单位，推进根据文物普查、专项调查成果认定不可移动文物。在国土空间规划中落实保护不可移动文物的空间管制措施，统筹划定文物保护单位保护范围和建设控制地带、地下文物埋藏区、水下文物保护区等，纳入国土空间规划“一张图”。完善可移动文物资源管理机制，健全博物馆藏品征集、登记、定级机制，做好民间收藏文物调查，开展流失海外文物资源专项调查，优化考古出土文物、涉案文物移交制度。开展革命文物资源调查。加强对军队文物、工业遗产、农业文化遗产、水利遗产、科技遗产的保护。由住房城乡建设部牵头，会同国家文物局进一步完善历史文化名城名镇名村、历史文化街区、历史建筑保护机制。 （二）建设国家文物资源大数据库。 系统整合全国不可移动文物资源数据库、国有可移动文物普查数据库、革命文物数据库等，加强文物资源大数据应用。将文物资源空间信息纳入国土空间基础信息平台。加强文物数字化保护，以世界文化遗产、全国重点文物保护单位、馆藏一级文物等为重点，推进相关文物信息高清数据采集和展示利用。完善全国考古发掘信息管理系统。建立文物数字化标准规范体系，健全数据管理和开放共享机制，加大文物数据保护力度。支持国家和省级文物数据中心、重点文博单位信息基础设施建设，加强文物领域新型基础设施建设。 （三）健全文物安全长效机制。 将文物安全工作全面纳入地方各级政府考核评价体系，探索推行“文物长制”，建立健全文物安全责任体系，完善部门协作共商机制，加强信息共享，实施文物安全直接责任人公告公示制度。健全文物安全制度标准体系，提高安全防护设施建设和管理维护水平。建立重点文博单位安全风险评估和预警机制，实施风险等级管理，有效防范火灾、人员拥挤踩踏等事故发生。加强文博单位治安防范，持续开展打击文物犯罪专项行动，完善打击和防范文物犯罪联合长效机制。开展文物火灾隐患排查整治行动和地震、地质灾害、洪涝等方面的自然灾害综合风险排查，实施抗震加固、地质灾害防控等工程，建立健全文物灾害综合风险监测和评估制度，明确文物消防、防洪安全责任，加强消防设施、消防水源、消防车通道、防洪除涝设施和应急处置力量建设，强化火灾、洪涝风险辨识与管控，推广科学适用的技防物防措施，提升应急管理水平，增强防控能力。 （四）强化文物行政执法督察。 加强文物督察力量，开展国家文物督察试点，加大文物督察科技支撑力度，持续实施专项督察和联合督察。强化省级文物行政部门督察职责，落实市、县文化市场综合执法队伍文物行政执法责任，强化文物行政部门、文化市场综合执法队伍执法协作。完善文物行政执法案例指导、案卷评查、行政执法与刑事司法衔接、社会监督机制。规范文物违法举报流程，加大重大违法案件责任追究力度。 （五）提高文物安全与执法督察科技水平。 实施文物平安工程，加大古遗址、古墓葬、石窟寺石刻等防盗窃盗掘预警技术研发应用和相关装备配置力度。加强博物馆和文物建筑等火灾防控、洪涝监测预警、地震和地质灾害防控信息技术应用和应急管理体系建设。加强卫星遥感、无人机、大数据等科技手段在文物安全监测和执法督察中的应用。 四、全面加强文物科技创新 坚持科技创新引领，遵循文物保护和考古特点规律，加大要素投入力度，优化资源配置，加强多学科协同，构建产学研用深度融合的文物科技创新体系，推进行业标准体系建设，提升文物科技创新能力和文物领域科技应用水平，带动解决重点难点和瓶颈问题，支撑引领文物事业高质量发展。 （一）深化基础研究。 面向文物保护利用基础理论需求、关键科学问题，部署基础研究重点任务，促进数学、物理学、化学、生物学、大气科学、地质学、材料科学与工程等学科同文物保护深度融合，加大国家自然科学基金和国家社会科学基金对跨学科研究的支持力度。着力构建符合我国文物资源特点的文物修复、预防性保护和防灾减灾理论体系，聚焦岩土质文物风化和水盐侵蚀、壁画彩绘褪色、木结构建筑失稳、微生物污染等主要病害，深化文物材质特性、病害形成机理及发展预测方法研究，为文物保护实践提供理论指导和科学依据。 （二）推动关键共性技术攻关。 面向文物防、保、研、管、用等五大需求领域，在国家重点研发计划中部署“文物保护利用科技创新”等研发任务，突破一批关键材料、工艺、装备和集成技术。大力发展文物灾害风险防控、火灾防范与应急处置专用技术体系；重点突破石窟寺、土遗址和木结构建筑等文物病害探测、原位诊断、防治和保护工程质量评价关键技术，优化系统解决方案；加快攻克饱水象牙、贝叶经、粉化甲骨、简牍等抢救性保护技术难题；持续推动考古探测、残留物检测、工艺鉴别、产地溯源等技术升级，增强考古发现提取与综合分析能力；研究文物资源保护规划关键技术，推进文物资源管理智能化；研究构建文物知识图谱，开展文物展示传播技术创新应用示范。 （三）加快专有装备研制升级。 坚持供给提升与需求牵引相结合，大幅提升文物安全防护、监测预警、巡查监管、预防性保护、修缮修复、展示利用等装备性能质量，力争在文物勘查探测、分析检测等高端专有装备方面取得突破。扶持量小急需关键装备研发，规范需求量大、充分竞争性装备的市场环境，完善质量认证机制。深化“制造商+用户”、“产品+服务”创新发展模式，培育一批创新企业和文物专有装备产学研用联合体。 （四）整合优化科技资源配置。 培育国家级科技创新基地，在国家重点实验室体系中布局科技考古和保护等方向，推动建设文物保护材料、专有装备等领域国家技术创新中心。扩大国家文物局重点科研基地规模，完善研究方向布局。依托国家文化遗产科技创新中心、国家文物局考古研究中心南海基地等，建设综合性科学研究实验平台。加快文物保护科学数据库系统建设。 （五）推进科技成果应用示范。 遴选一批文物保护修复、安全防护、灾害风险防控和考古等领域的科技创新成果应用示范及后评价项目，促进技术应用专业化集成化标准化。在石窟寺保护、土遗址保护、文物建筑保护、壁画保护、考古发掘等重点领域，推动建设科技成果转化试验（示范）平台，为研发成果后续试验、开发和应用提供真实环境、场地和对象。试点产学研用联合的文物保护研究型工程示范项目，探索定向研发、定向转化、定向服务的订单式研发和成果转化机制。加强文物领域高质量知识产权创造，强化知识产权保护与运用，依法保护文物领域科技创新成果。 （六）加强标准化建设。 建立健全文物领域多层次标准体系，加快推进考古、文物保护工程、文物数字化、预防性保护、火灾防控、洪涝灾害防御等重点领域标准制修订和应用。实施10—15个标准化试点示范项目，推动有代表性的博物馆、对外开放的文物保护单位加入社会管理和公共服务综合标准化试点。完善标准实施、评估和复审机制，建设文物保护标准全周期管理网上平台。加强全国文物保护标准化技术委员会建设，成立壁画、书画、陶瓷、纺织品、金属、文物数字化、火灾防控等分领域标准化工作组。推动国际标准化组织成立文物保护领域技术委员会。 五、提升考古工作能力和科技考古水平 坚持考古在文物保护利用中的基础性、指导性作用，加强对考古工作的统筹规划和政策供给，健全“先考古、后出让”制度，提升古遗址、古墓葬考古和保护水平，做好考古成果挖掘、整理和阐释。 （一）加强考古和历史研究。 编制并实施“十四五”考古工作专项规划。系统确定考古发掘重点，深化中华文明探源工程，推进“考古中国”重大项目，科学阐释中国境内人类起源、文明起源、中华文明形成、统一多民族国家建立和发展、中华文明在世界文明史中的重要地位等关键问题，揭示中华文明的历史文化价值和核心特质。 （二）加强大遗址保护。 实施大遗址保护利用“十四五”专项规划，强化国家文物局主导作用，发挥地方积极性，坚持考古先行、保护第一、融合发展、创新驱动，系统做好大遗址考古研究、空间管控、保护管理、开放展示工作，鼓励各地区因地制宜创新大遗址保护管理利用体制机制。 （三）完善建设工程考古制度。 在新型城镇化建设中统筹推进相关考古工作，划定一批地下文物埋藏区，试点实施建设工程考古区域评估机制。加强土地收储入库、出让前的考古项目监管。完善建设工程考古工作经费渠道。经文物主管部门核定可能存在历史文化遗存的土地，实行“先考古、后出让”制度，在依法完成考古调查、勘探、发掘前，原则上不予收储入库或出让。具体空间范围由文物主管部门商自然资源主管部门确定。加强考古发掘资质管理，积极吸纳社会力量依法依规参与建设工程考古调查勘探工作。完善考古监理制度。 （四）加强边疆考古和水下考古。 优先发展边疆考古，重点加强新疆、西藏、东北和南岛语族考古研究。将水下文物资源管理纳入海洋国土空间规划、国土空间规划水利专项，探索建立涉海、湖、江建设工程考古工作制度。开展浙江、福建、山东等沿海重点海域水下考古区域调查，公布一批文物保护单位和水下文物保护区。有序开展南海、东海、黄渤海海域水下考古发掘和出水文物保护工作。 （五）大力发展科技考古。 加强现代科学技术在考古中的应用，鼓励多学科多领域协同合作，推动科技测年、环境考古、动物考古、植物考古、冶金考古、同位素分析、微量元素分析、DNA研究、有机残留物分析等科技考古分支发展。开展考古现场文物保护、信息提取和实验室考古技术攻关，提高对出土文物的第一时间保护能力。大力发展数字考古，提升考古信息采集管理、综合分析和研究应用水平。建设国家重点区域考古标本库房。 六、强化文物古迹保护 坚持系统整体保护，健全文物保护机制，完善文物保护工程管理制度体系，发挥重点项目示范效应，提升文物保护水平。 （一）强化重要文物系统性保护。 实施重要木结构文物建筑保护修缮工程。加强长城、大运河、丝绸之路以及中东铁路等线性文化遗产重要点段保护修缮。实施全国重点文物保护单位、省级文物保护单位密集区域保护提升工程，整体保护文物本体和改善周边环境。实施黄河文物系统保护，加强长江文物和文化遗产保护，推进首都功能核心区、三峡库区文物保护利用。加强石窟寺保护管理，健全国家和区域两级石窟寺保护研究协调机制。 （二）统筹城乡文物保护。 保护和延续以文物资源为载体的城市文脉，将文物保护与老城保护、城市更新相结合，强化本体保护和风貌管控。加强历史文化名城名镇名村、历史文化街区、风景名胜区中的文物保护利用，完善相关审批、保护管理、检查通报、考核整改、濒危撤销机制。加大对全国重点文物保护单位、省级文物保护单位集中成片的传统村落保护力度，推动文物保护利用与公共文化设施建设、人居环境改善协调发展。持续改善低级别文物保存状况。 （三）加强文物保护工程监督管理。 完善对存在重大险情、重大隐患的文物保护单位开展抢救性保护的机制。实施研究性文物保护项目，发布技术规程，支持文物建筑修缮传统材料生产、营造技艺传承。完善文物保护工程勘察设计、施工、监理等管理制度。重点在石窟寺、彩塑壁画等领域探索实施文物保护工程设计施工一体化。建设国家级文物保护工程中心和文物保护工程全流程管理网上平台，培育文物保护工程质量监督机构。 （四）加强世界遗产保护管理。 重点推进云南普洱景迈山古茶林文化景观、北京中轴线、西夏陵、江南水乡古镇、海上丝绸之路、二里头遗址、景德镇御窑遗址申遗工作，培育三星堆遗址、万里茶道、钓鱼城遗址等预备项目。强化丝绸之路文化遗产保护与国际合作机制。完善世界遗产监测与巡查监管衔接制度，建设5—10处世界文化遗产地监测预警平台。加大世界遗产研究展示宣传力度。 （五）提高预防性保护能力。 编制不可移动文物预防性保护导则，按文物保护单位、保存文物特别丰富的市县、省域三个层级开展常态化、标准化预防性保护，基本实现全国重点文物保护单位从抢救性保护到预防性保护的转变。培育预防性保护工作机构，支持有能力的科研机构参与预防性保护。 七、加强革命文物保护管理运用 坚持保护第一，充分发挥革命文物在党史学习教育、革命传统教育、爱国主义教育等方面的重要作用，用好红色资源、赓续红色血脉、弘扬革命文化、汲取奋进力量。 （一）加大革命文物保护力度。 系统开展革命文物和相关史料调查征集。加强科学保护、系统保护，进一步完善革命文物定期排查、日常养护管理和安全防范制度，实施一批革命旧址维修保护项目、馆藏革命文物保护修复项目和革命文物研究性保护项目。加强整体保护，推进革命文物保护利用片区整体规划、连片保护、统筹展示，发挥示范引领作用。持续改善各级各类不可移动革命文物保存状况。 （二）提升革命文物展示水平。 优化革命博物馆、纪念馆区域布局，指导支持一批革命博物馆、纪念馆展陈提升项目，加强中国共产党历史文物保护展示。认真总结庆祝中国共产党成立100周年革命文物陈列展览成功经验，结合纪念辛亥革命110周年、红军长征胜利85周年、中华人民共和国成立75周年、中国人民抗日战争胜利80周年、中国人民志愿军抗美援朝出国作战75周年等重要时间节点，坚持政治性思想性艺术性相统一，策划推出革命文物陈列展览精品。合理运用现代科技手段，增强革命文物陈列展览表现力、传播力、影响力。推进革命文物联展巡展。 （三）强化革命文物研究阐释。 整合文物、党史、军史、档案、地方志等方面研究力量，加强革命文物保护利用研究，开展实物、文献、档案、史料和口述史征集，挖掘革命文物深刻内涵，推出重要研究成果，旗帜鲜明反对和抵制历史虚无主义，继续发扬伟大建党精神，传承弘扬井冈山精神、长征精神、遵义会议精神、延安精神、西柏坡精神、红岩精神、抗美援朝精神、“两弹一星”精神、特区精神、抗洪精神、抗震救灾精神、抗疫精神、脱贫攻坚精神等伟大精神。 （四）拓展革命文物运用方式。 提升革命旧址开放水平，完善重要革命纪念地设施。用好革命文物资源，举办国家和群众性纪念活动，积极开展青少年教育活动。创新革命文物宣传传播方式，加强革命文物资源网络空间建设。依托革命文物资源开辟公共文化空间，发展红色旅游及红色研学旅行，打造红色经典景区和精品线路，助力乡村振兴和革命老区振兴发展。 （五）深化革命文物工作内容。 服务好“四史”学习教育，特别是围绕中国共产党各个历史时期的重大事件、重要节点，研究确定一批重要标识地，推动有条件的重要建设工程、科学工程、国防工程面向公众开放，生动展示革命文物蕴含的强大精神力量。 八、激发博物馆创新活力 坚持公益属性，突出社会效益，统筹不同地域、层级、属性、类型博物馆发展，提高博物馆公共服务均等化、便捷化、多样化水平，做好常态化疫情防控工作，不断推进博物馆改革发展。 （一）优化博物馆布局。 实施中国特色世界一流博物馆创建计划。支持省级、重要地市级博物馆特色化发展。盘活基层博物馆资源。探索建立行业博物馆联合认证、共建共管机制。规范和扶持非国有博物馆发展，落实支持政策，依法依规推进非国有博物馆法人财产权确权。认真履行相关审批程序，有序推动建设一批反映党和国家建设成就的当代主题博物馆和行业博物馆，重点支持建设反映中华文明发展历程的国家级重点专题博物馆，倡导建设特色专题博物馆。探索在文化资源丰厚地区建设“博物馆之城”。 （二）夯实博物馆藏品保护管理基础。 提升博物馆藏品管理能力，健全藏品登录机制，推进藏品档案标准化、信息化建设，逐步推广藏品电子标识。实施馆藏珍贵濒危文物、材质脆弱文物保护修复计划，寓科学研究于保护修复全过程，提高馆藏文物保护修复水平。强化预防性保护，充分运用科学研究成果和环境监测数据，改善博物馆藏品保存环境，推动多元化、低成本、高效能的藏品保存设施设备体系建设。加快推进博物馆藏品数字化，完善藏品数据库，加大基础信息开放力度。 （三）提升博物馆服务能力。 提升博物馆展陈质量，加强对藏品价值的挖掘阐发。支持博物馆联合办展、巡回展览、流动展览、网上展览。探索独立策展人制度，推出更多原创性主题展览。推介“弘扬中华优秀传统文化、培育社会主义核心价值观”主题展览。广泛深入开展在博物馆里过传统节日、纪念日活动。制定博物馆教育服务标准，丰富博物馆教育课程体系，支持大中小学利用博物馆开展研学实践和科普活动等。实施一批智慧博物馆建设示范项目，研究制定相关标准规范。推动博物馆发展线上数字化体验产品，提供沉浸式体验、虚拟展厅、高清直播等新型文旅服务。 （四）创新博物馆管理体制机制。 进一步健全博物馆免费开放机制。分类推进国有博物馆、非国有博物馆理事会制度建设，建立健全决策执行和监督咨询机制。对于部分符合条件的新建博物馆，在不改变藏品权属、确保安全的前提下，经批准可探索开展国有博物馆资产所有权、藏品归属权、开放运营权分置改革试点，赋予博物馆更大办馆自主权。健全激励机制，强化绩效考核和动态管理。推动博物馆公共服务市场化改革，实施“博物馆+”战略。 九、优化社会文物管理服务 坚持社会效益优先，加强对民间收藏的指导、管理和服务，健全文物合法流通交易体制机制，优化文物鉴定服务和文物进出境监管，完善流失文物追索返还制度。 （一）促进文物市场健康有序发展。 营造健康的文物市场环境，培育现代文物市场体系，优化文物市场区域布局。强化文物商店作用，探索降低文物商店准营门槛，推动国有文物商店改革。培育一批具有市场美誉度和国际影响力的文物拍卖龙头企业，扶持中小文物经营主体。支持发展现代经营方式，推动文物市场线上线下融合，支持在线展示、交易和定制服务等新业态发展。完善民间收藏文物登记交易制度，建设全国文物市场信息与信用管理系统，完善文物流通信用体系、文物市场全流程协同监管机制。 （二）建立多层次文物鉴定服务体系。 加强涉案文物鉴定评估机构建设，做好刑事、民事、行政等领域相关鉴定工作。支持文博单位、社会力量探索成立文物鉴定机构，提供公益性咨询和经营性活动相结合的鉴定服务。实施文物鉴定职业技能等级认定。加强文物鉴定基础研究、科技支撑和人才培养，加快科技辅助鉴定联合研究与应用推广。健全罚没文物接收和指定收藏机制。 （三）提升文物进出境管理服务水平。 健全文物进出境审核管理体制，加强队伍和管理能力建设。制修订文物出境鉴定国家标准，防止珍贵文物流失。探索建立文物进境登记制度。积极研究调整国有公益性收藏单位进口藏品税收政策。优化文物临时进出境管理服务，支持发展文物仓储、展示等衍生业态。完善文物进出境风险联合防控机制，加强风险布控与执法合作。 （四）构建文物追索返还常态化工作格局。 完善法律法规，做好与相关国际公约衔接，健全部际协调机制，加强专门力量建设。建立中国非法流失文物信息发布机制，加强流失海外文物调查监测，加强中国被盗文物数据库、外国被盗文物数据库建设，推动敦煌遗书等流失文物数字化复原与共享。建立“打击非法贩运文化财产国际日”中国主场活动机制，引导社会力量参与。深度参与国际治理，加强双边、多边合作，促进完善国际规则。 十、大力推进让文物活起来 坚持创造性转化、创新性发展，深入挖掘、广泛传播文物蕴含的文化精髓和时代价值，创新文物合理利用方式，塑造全民族历史认知，推动文物保护利用工作全面融入经济社会发展。 （一）依托文物资源推进中华文明标识体系建设。 建设长城、大运河、长征、黄河等国家文化公园，推进长江文物和文化遗产保护利用，强化区域文物系统保护，加强文物合理利用的协同创新，以主题明确、内涵清晰、影响突出的系列文物资源为主线，集中打造中华文明重要标识。依托全国重点文物保护单位、世界遗产等，推介国家文化地标和精神标识，试点推广国家文化遗产线路，促进文物保护研究与文化阐释传播。 （二）强化公共文化服务功能。 引导文物保护单位、博物馆充分发挥公共教育、文化服务等作用，让陈列在广阔大地上的文化遗产活起来。完善国家考古遗址公园管理机制，提升运营服务水平，鼓励社会力量参与，实施“一园一策”和评估监测。加大文物建筑开放利用力度，鼓励因地制宜辟为公共文化设施或场所，对产生良好社会效益的优秀案例予以重点推介。妥善处理保护与开发的关系，推动文物保护单位、博物馆成为特色旅游目的地和文明旅游的典范。发布中国文物游径名录，推介文物研学旅行、体验旅游项目和精品线路。 （三）加强文物价值阐释传播。 融通多媒体资源，强化内容建设，创新表现手法，拓展传播渠道，推进重要文物全媒体传播，宣介文物保护利用理念与实践。加强考古和历史研究成果传播，创新举办文化和自然遗产日、国际博物馆日、国际古迹遗址日等活动。加快构建国家级文物传媒平台。 （四）积极引导社会力量参与。 拓展社会力量参与路径，鼓励社会资本投入，推广实施文明守望工程，推介拯救老屋行动、文物认养领养、文物保护志愿者、文物义务巡查员等社会力量参与实践。完善文化文物单位文化创意产品开发机制，推广文物资源相关知识产权和品牌授权操作指引，支持形成一批具有影响力的文化创意品牌。 （五）深化文物保护利用改革。 创新文物保护利用机制，加强文物和文化遗产保护利用，建设国家文物保护利用示范区。健全国有文物资源资产管理制度，推进文物资源资产管理信息共享，部署开展相关试点工作。完善各方主体参与文物保护利用的支持政策，保障利益相关方合法权益。探索创新对文物资源密集区的支持方式。建设文物领域国家智库。 （六）促进区域协调发展。 推动东部地区加快实现文物治理体系和治理能力现代化，推进中西部地区、东北地区文物保护利用提质增效，加大对革命老区、民族地区、边疆地区、脱贫地区文物保护利用的支持力度。围绕京津冀协同发展、长江经济带发展、粤港澳大湾区建设、长三角一体化发展、黄河流域生态保护和高质量发展等区域重大战略，创新区域文物保护利用协作机制，创新城市群协同机制。深化内地与香港、澳门文化遗产合作，推进海峡两岸文化遗产交流合作，促进两岸三地同胞共同传承和创新发展中华优秀传统文化。 十一、加强文物国际交流合作 坚持以我为主、兼收并蓄，完善文物国际交流合作机制，创新成果转化路径和传播推介方式，推动文物国际交流合作成为共建“一带一路”的重要抓手和载体，向全世界讲好中国故事，促进中外文明交流互鉴。 （一）服务国家外交战略大局。 推动文物国际交流合作有机融入国家外交、国际传播、对外援助顶层设计，加强统筹协调，优化资源力量配置。深化与共建“一带一路”国家在文物保护修复、考古、博物馆、学术研究、人员培训等领域交流合作，推进柬埔寨吴哥古迹、尼泊尔九层神庙、缅甸他冰瑜佛塔等文物保护修复合作项目，持续开展中外联合考古。实施亚洲文化遗产保护行动，构建常态化合作机制和交流平台，联合实施一批土遗址、木结构建筑、纸质文物、丝织品保护等亚洲主题合作项目。鼓励国内相关机构与海外研究机构联合开展早期文明比较研究。 （二）加强国际传播能力建设。 打造文物对外宣传品牌，向国际社会展示博大精深的中华文明，讲清楚中华文明的灿烂成就和对人类文明的重大贡献。加强中外文物展览交流合作，组织策划精品出境展览，积极引进优秀外展。运用数字化技术，融合线上线下传播方式，充分利用香港、澳门在中外文化交流中的优势，发挥国家海外文化阵地积极作用，推动与国外文物机构共建合作传播基地，提升国际文化传播效能。 （三）深度参与文化遗产国际治理。 深化在濒危文化遗产抢救保护、打击文化财产非法贩运、武装冲突地区文化遗产保护、水下文物保护、世界文化遗产管理、流失文物追索返还、博物馆等领域的国际合作，积极履行国际责任，提升中国话语权。打造文化遗产国际智库，加强专业人才培养。 十二、壮大文物人才队伍 坚持文物保护只能加强、不能削弱的原则，综合施策推动构建与文物资源规模、文物保护利用任务相匹配的学科结构、管理机构和专业队伍，不断健全文博人才培养体系，创新人才机制，弘扬践行“莫高精神”，让文物事业后继有人、人才辈出。 （一）推进文物和考古学科专业建设。 梳理文物领域学科框架，完善文物学科体系、学术体系、话语体系。加强文物科学与技术相关学科建设，开展文物科技创新研究。推动考古相关学科专业建设和课程建设，通过“国家关键领域急需高层次人才培养专项招生计划”对考古等相关专业给予积极支持，推动有条件的高等院校适当扩大考古相关专业设置和招生规模，建设一批一流考古学专业。在国家社会科学基金中加大对文物考古研究的支持力度，设立系列研究课题。在国家自然科学基金融合科学领域增设“文物保护科学”方向。大力发展文物修复与保护、文物考古技术、文物展示利用技术、石窟寺保护技术等职业教育专业，引导文博单位深度参与职业教育，鼓励校企共建实习实训基地，支持文物领域大师、名师、工匠进校园参与教育教学活动。 （二）构建多层次文物人才培养体系。 培育一批以领军人才和中青年骨干创新人才为重点的高层次文物人才，加强考古、科技创新、文物鉴定、文物修复、文物展览等急需领域人才培养，加快建设一支门类齐全、技艺精湛的文物技能人才队伍，稳步造就一支科技研发能力和技术应用能力过硬的文物科技人才队伍，锤炼一支熟悉专业、素质优良的文物管理人才队伍。加强相关行业文物保护人才培养。 （三）激发文物人才创新活力。 关心爱护文物工作者，完善人才激励机制，支持鼓励更多优秀专业人才和青年人才从事文物保护研究。建立健全管理规范、评价科学、激励有效的文物人才体系。实行更加积极开放的人才政策，多渠道招聘引进高层次人才，创新文物技能型人才聘用方式。推动文博单位建立体现创新要素价值的收益分配机制。按照国家有关规定，对有杰出贡献的文物工作者予以表彰奖励。 （四）建强文物机构队伍。 进一步加强各级文物保护和考古队伍建设，扩大考古发掘资质单位数量，根据文物资源密集度，核定并落实文物保护和考古专业人员配置量化标准。持续加强基层文物保护研究队伍建设，保持队伍稳定。支持社会力量参与，构建多渠道基层文物保护看护机制。统筹现有资源，加强科研类文博单位建设，打造一批文物保护研究和传承利用高地。 十三、加强规划实施保障 坚持党的全面领导，全面依法行政，更好履行政府职责，健全规划实施保障机制，激发社会各界参与规划实施的积极性，形成文物保护利用的强大合力。 （一）加强组织领导。 各地区各有关部门要结合实际情况制定具体实施方案，落实文物保护主体责任。各省、自治区、直辖市人民政府要把本规划提出的目标任务纳入经济社会发展规划，细化任务、合力推进。各有关部门要根据职责分工，做好重大任务、重大工程项目的实施保障，强化政策供给和资源要素支持，加强工作协同。文化和旅游部、国家文物局要加强对本规划实施的组织协调。 （二）加强法治建设。 完善文物领域法律法规体系，推动修订文物保护法及配套行政法规，修订水下文物保护管理条例、长城保护条例，开展故宫保护、古籍保护、大运河保护、长征文物保护等方面的法律制度研究，加强文物领域法律与其他法律衔接，鼓励各省、自治区、直辖市及设区的市制定文物保护地方性法规。深化文物督察、文物行政执法改革。建立健全文物保护公益诉讼制度。加强文物法治宣传，维护法律权威。 （三）完善财政支持政策。 各地区各有关部门要调整优化支出结构，优先支持本规划确定的重大任务和重大工程项目。落实公共文化领域中央与地方财政事权和支出责任划分改革方案，拓宽文物科技创新投入渠道，加大对考古和历史研究的支持力度。发挥文化保护传承利用工程等中央预算内投资的引导作用。公布文物领域政府购买公共服务指导性目录，积极鼓励社会力量参与文物保护和科技创新。 （四）强化规划落实。 建立“十四五”文物保护和科技创新规划实施部际协调机制，由文化和旅游部、国家文物局牵头，中央宣传部、国家发展改革委、科技部、财政部、自然资源部、住房城乡建设部等有关部门参加。加强规划衔接，确保文物领域各类规划与本规划在主要目标、发展方向、重大政策、重大工程等方面协调一致。开展规划实施情况动态监测、中期评估和总结评估，把监测评估结果作为改进工作和绩效考核的重要依据。文化和旅游部、国家文物局要加强对本规划实施情况的督导检查，重大情况要及时向党中央、国务院请示报告。 解读 国务院办公厅印发《“十四五”文物保护和科技创新规划》 科技创新驱动 守护中华文脉——专访文化和旅游部副部长、国家文物局局长李群 国务院办公厅关于印发“十四五”文物保护和科技创新规划的通知 国务院办公厅关于印发“十四五”文物保护和科技创新规划的通知\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.685Z"},{"slug":"regulation-20210804-7b398ba3","title":"建设工程抗震管理条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第744号","publish_date":"2021-08-04","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/2021-08/04/content_5629341.htm","summary":"中华人民共和国国务院令 第744号 《建设工程抗震管理条例》已经2021年5月12日国务院第135次常务会议通过，现予公布，自2021年9月1日起施行。 总理　　李克强 2021年7月19日","themes":["建设工程","安全"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第744号 《建设工程抗震管理条例》已经2021年5月12日国务院第135次常务会议通过，现予公布，自2021年9月1日起施行。 总理 李克强 2021年7月19日 建设工程抗震管理条例 第一章 总 则 第一条 为了提高建设工程抗震防灾能力，降低地震灾害风险，保障人民生命财产安全，根据《中华人民共和国建筑法》、《中华人民共和国防震减灾法》等法律，制定本条例。 第二条 在中华人民共和国境内从事建设工程抗震的勘察、设计、施工、鉴定、加固、维护等活动及其监督管理，适用本条例。 第三条 建设工程抗震应当坚持以人为本、全面设防、突出重点的原则。 第四条 国务院住房和城乡建设主管部门对全国的建设工程抗震实施统一监督管理。国务院交通运输、水利、工业和信息化、能源等有关部门按照职责分工，负责对全国有关专业建设工程抗震的监督管理。 县级以上地方人民政府住房和城乡建设主管部门对本行政区域内的建设工程抗震实施监督管理。县级以上地方人民政府交通运输、水利、工业和信息化、能源等有关部门在各自职责范围内，负责对本行政区域内有关专业建设工程抗震的监督管理。 县级以上人民政府其他有关部门应当依照本条例和其他有关法律、法规的规定，在各自职责范围内负责建设工程抗震相关工作。 第五条 从事建设工程抗震相关活动的单位和人员，应当依法对建设工程抗震负责。 第六条 国家鼓励和支持建设工程抗震技术的研究、开发和应用。 各级人民政府应当组织开展建设工程抗震知识宣传普及，提高社会公众抗震防灾意识。 第七条 国家建立建设工程抗震调查制度。 县级以上人民政府应当组织有关部门对建设工程抗震性能、抗震技术应用、产业发展等进行调查，全面掌握建设工程抗震基本情况，促进建设工程抗震管理水平提高和科学决策。 第八条 建设工程应当避开抗震防灾专项规划确定的危险地段。确实无法避开的，应当采取符合建设工程使用功能要求和适应地震效应的抗震设防措施。 第二章 勘察、设计和施工 第九条 新建、扩建、改建建设工程，应当符合抗震设防强制性标准。 国务院有关部门和国务院标准化行政主管部门依据职责依法制定和发布抗震设防强制性标准。 第十条 建设单位应当对建设工程勘察、设计和施工全过程负责，在勘察、设计和施工合同中明确拟采用的抗震设防强制性标准，按照合同要求对勘察设计成果文件进行核验，组织工程验收，确保建设工程符合抗震设防强制性标准。 建设单位不得明示或者暗示勘察、设计、施工等单位和从业人员违反抗震设防强制性标准，降低工程抗震性能。 第十一条 建设工程勘察文件中应当说明抗震场地类别，对场地地震效应进行分析，并提出工程选址、不良地质处置等建议。 建设工程设计文件中应当说明抗震设防烈度、抗震设防类别以及拟采用的抗震设防措施。采用隔震减震技术的建设工程，设计文件中应当对隔震减震装置技术性能、检验检测、施工安装和使用维护等提出明确要求。 第十二条 对位于高烈度设防地区、地震重点监视防御区的下列建设工程，设计单位应当在初步设计阶段按照国家有关规定编制建设工程抗震设防专篇，并作为设计文件组成部分： （一）重大建设工程； （二）地震时可能发生严重次生灾害的建设工程； （三）地震时使用功能不能中断或者需要尽快恢复的建设工程。 第十三条 对超限高层建筑工程，设计单位应当在设计文件中予以说明，建设单位应当在初步设计阶段将设计文件等材料报送省、自治区、直辖市人民政府住房和城乡建设主管部门进行抗震设防审批。住房和城乡建设主管部门应当组织专家审查，对采取的抗震设防措施合理可行的，予以批准。超限高层建筑工程抗震设防审批意见应当作为施工图设计和审查的依据。 前款所称超限高层建筑工程，是指超出国家现行标准所规定的适用高度和适用结构类型的高层建筑工程以及体型特别不规则的高层建筑工程。 第十四条 工程总承包单位、施工单位及工程监理单位应当建立建设工程质量责任制度，加强对建设工程抗震设防措施施工质量的管理。 国家鼓励工程总承包单位、施工单位采用信息化手段采集、留存隐蔽工程施工质量信息。 施工单位应当按照抗震设防强制性标准进行施工。 第十五条 建设单位应当将建筑的设计使用年限、结构体系、抗震设防烈度、抗震设防类别等具体情况和使用维护要求记入使用说明书，并将使用说明书交付使用人或者买受人。 第十六条 建筑工程根据使用功能以及在抗震救灾中的作用等因素，分为特殊设防类、重点设防类、标准设防类和适度设防类。学校、幼儿园、医院、养老机构、儿童福利机构、应急指挥中心、应急避难场所、广播电视等建筑，应当按照不低于重点设防类的要求采取抗震设防措施。 位于高烈度设防地区、地震重点监视防御区的新建学校、幼儿园、医院、养老机构、儿童福利机构、应急指挥中心、应急避难场所、广播电视等建筑应当按照国家有关规定采用隔震减震等技术，保证发生本区域设防地震时能够满足正常使用要求。 国家鼓励在除前款规定以外的建设工程中采用隔震减震等技术，提高抗震性能。 第十七条 国务院有关部门和国务院标准化行政主管部门应当依据各自职责推动隔震减震装置相关技术标准的制定，明确通用技术要求。鼓励隔震减震装置生产企业制定严于国家标准、行业标准的企业标准。 隔震减震装置生产经营企业应当建立唯一编码制度和产品检验合格印鉴制度，采集、存储隔震减震装置生产、经营、检测等信息，确保隔震减震装置质量信息可追溯。隔震减震装置质量应当符合有关产品质量法律、法规和国家相关技术标准的规定。 建设单位应当组织勘察、设计、施工、工程监理单位建立隔震减震工程质量可追溯制度，利用信息化手段对隔震减震装置采购、勘察、设计、进场检测、安装施工、竣工验收等全过程的信息资料进行采集和存储，并纳入建设项目档案。 第十八条 隔震减震装置用于建设工程前，施工单位应当在建设单位或者工程监理单位监督下进行取样，送建设单位委托的具有相应建设工程质量检测资质的机构进行检测。禁止使用不合格的隔震减震装置。 实行施工总承包的，隔震减震装置属于建设工程主体结构的施工，应当由总承包单位自行完成。 工程质量检测机构应当建立建设工程过程数据和结果数据、检测影像资料及检测报告记录与留存制度，对检测数据和检测报告的真实性、准确性负责，不得出具虚假的检测数据和检测报告。 第三章 鉴定、加固和维护 第十九条 国家实行建设工程抗震性能鉴定制度。 按照《中华人民共和国防震减灾法》第三十九条规定应当进行抗震性能鉴定的建设工程，由所有权人委托具有相应技术条件和技术能力的机构进行鉴定。 国家鼓励对除前款规定以外的未采取抗震设防措施或者未达到抗震设防强制性标准的已经建成的建设工程进行抗震性能鉴定。 第二十条 抗震性能鉴定结果应当对建设工程是否存在严重抗震安全隐患以及是否需要进行抗震加固作出判定。 抗震性能鉴定结果应当真实、客观、准确。 第二十一条 建设工程所有权人应当对存在严重抗震安全隐患的建设工程进行安全监测，并在加固前采取停止或者限制使用等措施。 对抗震性能鉴定结果判定需要进行抗震加固且具备加固价值的已经建成的建设工程，所有权人应当进行抗震加固。 位于高烈度设防地区、地震重点监视防御区的学校、幼儿园、医院、养老机构、儿童福利机构、应急指挥中心、应急避难场所、广播电视等已经建成的建筑进行抗震加固时，应当经充分论证后采用隔震减震等技术，保证其抗震性能符合抗震设防强制性标准。 第二十二条 抗震加固应当依照《建设工程质量管理条例》等规定执行，并符合抗震设防强制性标准。 竣工验收合格后，应当通过信息化手段或者在建设工程显著部位设置永久性标牌等方式，公示抗震加固时间、后续使用年限等信息。 第二十三条 建设工程所有权人应当按照规定对建设工程抗震构件、隔震沟、隔震缝、隔震减震装置及隔震标识进行检查、修缮和维护，及时排除安全隐患。 任何单位和个人不得擅自变动、损坏或者拆除建设工程抗震构件、隔震沟、隔震缝、隔震减震装置及隔震标识。 任何单位和个人发现擅自变动、损坏或者拆除建设工程抗震构件、隔震沟、隔震缝、隔震减震装置及隔震标识的行为，有权予以制止，并向住房和城乡建设主管部门或者其他有关监督管理部门报告。 第四章 农村建设工程抗震设防 第二十四条 各级人民政府和有关部门应当加强对农村建设工程抗震设防的管理，提高农村建设工程抗震性能。 第二十五条 县级以上人民政府对经抗震性能鉴定未达到抗震设防强制性标准的农村村民住宅和乡村公共设施建设工程抗震加固给予必要的政策支持。 实施农村危房改造、移民搬迁、灾后恢复重建等，应当保证建设工程达到抗震设防强制性标准。 第二十六条 县级以上地方人民政府应当编制、发放适合农村的实用抗震技术图集。 农村村民住宅建设可以选用抗震技术图集，也可以委托设计单位进行设计，并根据图集或者设计的要求进行施工。 第二十七条 县级以上地方人民政府应当加强对农村村民住宅和乡村公共设施建设工程抗震的指导和服务，加强技术培训，组织建设抗震示范住房，推广应用抗震性能好的结构形式及建造方法。 第五章 保障措施 第二十八条 县级以上人民政府应当加强对建设工程抗震管理工作的组织领导，建立建设工程抗震管理工作机制，将相关工作纳入本级国民经济和社会发展规划。 县级以上人民政府应当将建设工程抗震工作所需经费列入本级预算。 县级以上地方人民政府应当组织有关部门，结合本地区实际开展地震风险分析，并按照风险程度实行分类管理。 第二十九条 县级以上地方人民政府对未采取抗震设防措施或者未达到抗震设防强制性标准的老旧房屋抗震加固给予必要的政策支持。 国家鼓励建设工程所有权人结合电梯加装、节能改造等开展抗震加固，提升老旧房屋抗震性能。 第三十条 国家鼓励金融机构开发、提供金融产品和服务，促进建设工程抗震防灾能力提高，支持建设工程抗震相关产业发展和新技术应用。 县级以上地方人民政府鼓励和引导社会力量参与抗震性能鉴定、抗震加固。 第三十一条 国家鼓励科研教育机构设立建设工程抗震技术实验室和人才实训基地。 县级以上人民政府应当依法对建设工程抗震新技术产业化项目用地、融资等给予政策支持。 第三十二条 县级以上人民政府住房和城乡建设主管部门或者其他有关监督管理部门应当制定建设工程抗震新技术推广目录，加强对建设工程抗震管理和技术人员的培训。 第三十三条 地震灾害发生后，县级以上人民政府住房和城乡建设主管部门或者其他有关监督管理部门应当开展建设工程安全应急评估和建设工程震害调查，收集、保存相关资料。 第六章 监督管理 第三十四条 县级以上人民政府住房和城乡建设主管部门和其他有关监督管理部门应当按照职责分工，加强对建设工程抗震设防强制性标准执行情况的监督检查。 县级以上人民政府住房和城乡建设主管部门应当会同有关部门建立完善建设工程抗震设防数据信息库，并与应急管理、地震等部门实时共享数据。 第三十五条 县级以上人民政府住房和城乡建设主管部门或者其他有关监督管理部门履行建设工程抗震监督管理职责时，有权采取以下措施： （一）对建设工程或者施工现场进行监督检查； （二）向有关单位和人员调查了解相关情况； （三）查阅、复制被检查单位有关建设工程抗震的文件和资料； （四）对抗震结构材料、构件和隔震减震装置实施抽样检测； （五）查封涉嫌违反抗震设防强制性标准的施工现场； （六）发现可能影响抗震质量的问题时，责令相关单位进行必要的检测、鉴定。 第三十六条 县级以上人民政府住房和城乡建设主管部门或者其他有关监督管理部门开展监督检查时，可以委托专业机构进行抽样检测、抗震性能鉴定等技术支持工作。 第三十七条 县级以上人民政府住房和城乡建设主管部门或者其他有关监督管理部门应当建立建设工程抗震责任企业及从业人员信用记录制度，将相关信用记录纳入全国信用信息共享平台。 第七章 法律责任 第三十九条 违反本条例规定，住房和城乡建设主管部门或者其他有关监督管理部门工作人员在监督管理工作中玩忽职守、滥用职权、徇私舞弊的，依法给予处分。 第四十条 违反本条例规定，建设单位明示或者暗示勘察、设计、施工等单位和从业人员违反抗震设防强制性标准，降低工程抗震性能的，责令改正，处20万元以上50万元以下的罚款；情节严重的，处50万元以上500万元以下的罚款；造成损失的，依法承担赔偿责任。 违反本条例规定，建设单位未经超限高层建筑工程抗震设防审批进行施工的，责令停止施工，限期改正，处20万元以上100万元以下的罚款；造成损失的，依法承担赔偿责任。 违反本条例规定，建设单位未组织勘察、设计、施工、工程监理单位建立隔震减震工程质量可追溯制度的，或者未对隔震减震装置采购、勘察、设计、进场检测、安装施工、竣工验收等全过程的信息资料进行采集和存储，并纳入建设项目档案的，责令改正，处10万元以上30万元以下的罚款；造成损失的，依法承担赔偿责任。 第四十一条 违反本条例规定，设计单位有下列行为之一的，责令改正，处10万元以上30万元以下的罚款；情节严重的，责令停业整顿，降低资质等级或者吊销资质证书；造成损失的，依法承担赔偿责任： （一）未按照超限高层建筑工程抗震设防审批意见进行施工图设计； （二）未在初步设计阶段将建设工程抗震设防专篇作为设计文件组成部分； （三）未按照抗震设防强制性标准进行设计。 第四十二条 违反本条例规定，施工单位在施工中未按照抗震设防强制性标准进行施工的，责令改正，处工程合同价款2%以上4%以下的罚款；造成建设工程不符合抗震设防强制性标准的，负责返工、加固，并赔偿因此造成的损失；情节严重的，责令停业整顿，降低资质等级或者吊销资质证书。 第四十三条 违反本条例规定，施工单位未对隔震减震装置取样送检或者使用不合格隔震减震装置的，责令改正，处10万元以上20万元以下的罚款；情节严重的，责令停业整顿，并处20万元以上50万元以下的罚款，降低资质等级或者吊销资质证书；造成损失的，依法承担赔偿责任。 第四十四条 违反本条例规定，工程质量检测机构未建立建设工程过程数据和结果数据、检测影像资料及检测报告记录与留存制度的，责令改正，处10万元以上30万元以下的罚款；情节严重的，吊销资质证书；造成损失的，依法承担赔偿责任。 违反本条例规定，工程质量检测机构出具虚假的检测数据或者检测报告的，责令改正，处10万元以上30万元以下的罚款；情节严重的，吊销资质证书和负有直接责任的注册执业人员的执业资格证书，其直接负责的主管人员和其他直接责任人员终身禁止从事工程质量检测业务；造成损失的，依法承担赔偿责任。 第四十五条 违反本条例规定，抗震性能鉴定机构未按照抗震设防强制性标准进行抗震性能鉴定的，责令改正，处10万元以上30万元以下的罚款；情节严重的，责令停业整顿，并处30万元以上50万元以下的罚款；造成损失的，依法承担赔偿责任。 违反本条例规定，抗震性能鉴定机构出具虚假鉴定结果的，责令改正，处10万元以上30万元以下的罚款；情节严重的，责令停业整顿，并处30万元以上50万元以下的罚款，吊销负有直接责任的注册执业人员的执业资格证书，其直接负责的主管人员和其他直接责任人员终身禁止从事抗震性能鉴定业务；造成损失的，依法承担赔偿责任。 第四十六条 违反本条例规定，擅自变动、损坏或者拆除建设工程抗震构件、隔震沟、隔震缝、隔震减震装置及隔震标识的，责令停止违法行为，恢复原状或者采取其他补救措施，对个人处5万元以上10万元以下的罚款，对单位处10万元以上30万元以下的罚款；造成损失的，依法承担赔偿责任。 第四十七条 依照本条例规定，给予单位罚款处罚的，对其直接负责的主管人员和其他直接责任人员处单位罚款数额5%以上10%以下的罚款。 本条例规定的降低资质等级或者吊销资质证书的行政处罚，由颁发资质证书的机关决定；其他行政处罚，由住房和城乡建设主管部门或者其他有关监督管理部门依照法定职权决定。 第四十八条 违反本条例规定，构成犯罪的，依法追究刑事责任。 第八章 附 则 第四十九条 本条例下列用语的含义： （一）建设工程：主要包括土木工程、建筑工程、线路管道和设备安装工程等。 （二）抗震设防强制性标准：是指包括抗震设防类别、抗震性能要求和抗震设防措施等内容的工程建设强制性标准。 （三）地震时使用功能不能中断或者需要尽快恢复的建设工程：是指发生地震后提供应急医疗、供水、供电、交通、通信等保障或者应急指挥、避难疏散功能的建设工程。 （四）高烈度设防地区：是指抗震设防烈度为8度及以上的地区。 （五）地震重点监视防御区：是指未来5至10年内存在发生破坏性地震危险或者受破坏性地震影响，可能造成严重的地震灾害损失的地区和城市。 第五十条 抢险救灾及其他临时性建设工程不适用本条例。 军事建设工程的抗震管理，中央军事委员会另有规定的，适用有关规定。 第五十一条 本条例自2021年9月1日起施行。 解读 国务院办公厅印发《关于改革完善中央财政科研经费管理的若干意见》 为创新再“松绑”！ 20余条举措赋予科研人员更大经费管理自主权 缓解“等米下锅”焦虑 国家为科研经费拨付设时限 建设工程抗震管理条例 建设工程抗震管理条例\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.716Z"},{"slug":"regulation-20210730-ec781260","title":"中华人民共和国土地管理法实施条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第743号","publish_date":"2021-07-30","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/2021-07/30/content_5628461.htm","summary":"中华人民共和国国务院令 第743号 《中华人民共和国土地管理法实施条例》已经2021年4月21日国务院第132次常务会议修订通过，现予公布，自2021年9月1日起施行。 总理　　李克强 2021年","themes":["土地管理","国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第743号 《中华人民共和国土地管理法实施条例》已经2021年4月21日国务院第132次常务会议修订通过，现予公布，自2021年9月1日起施行。 总理 李克强 2021年7月2日 中华人民共和国土地管理法实施条例 （1998年12月27日中华人民共和国国务院令第256号发布 根据2011年1月8日《国务院关于废止和修改部分行政法规的决定》第一次修订 根据2014年7月29日《国务院关于修改部分行政法规的决定》第二次修订 2021年7月2日中华人民共和国国务院令第743号第三次修订） 第一章 总 则 第二章 国土空间规划 第二条 国家建立国土空间规划体系。 土地开发、保护、建设活动应当坚持规划先行。经依法批准的国土空间规划是各类开发、保护、建设活动的基本依据。 已经编制国土空间规划的，不再编制土地利用总体规划和城乡规划。在编制国土空间规划前，经依法批准的土地利用总体规划和城乡规划继续执行。 第三条 国土空间规划应当细化落实国家发展规划提出的国土空间开发保护要求，统筹布局农业、生态、城镇等功能空间，划定落实永久基本农田、生态保护红线和城镇开发边界。 国土空间规划应当包括国土空间开发保护格局和规划用地布局、结构、用途管制要求等内容，明确耕地保有量、建设用地规模、禁止开垦的范围等要求，统筹基础设施和公共设施用地布局，综合利用地上地下空间，合理确定并严格控制新增建设用地规模，提高土地节约集约利用水平，保障土地的可持续利用。 第四条 土地调查应当包括下列内容： （一）土地权属以及变化情况； （二）土地利用现状以及变化情况； （三）土地条件。 全国土地调查成果，报国务院批准后向社会公布。地方土地调查成果，经本级人民政府审核，报上一级人民政府批准后向社会公布。全国土地调查成果公布后，县级以上地方人民政府方可自上而下逐级依次公布本行政区域的土地调查成果。 土地调查成果是编制国土空间规划以及自然资源管理、保护和利用的重要依据。 土地调查技术规程由国务院自然资源主管部门会同有关部门制定。 第五条 国务院自然资源主管部门会同有关部门制定土地等级评定标准。 县级以上人民政府自然资源主管部门应当会同有关部门根据土地等级评定标准，对土地等级进行评定。地方土地等级评定结果经本级人民政府审核，报上一级人民政府自然资源主管部门批准后向社会公布。 根据国民经济和社会发展状况，土地等级每五年重新评定一次。 第六条 县级以上人民政府自然资源主管部门应当加强信息化建设，建立统一的国土空间基础信息平台，实行土地管理全流程信息化管理，对土地利用状况进行动态监测，与发展改革、住房和城乡建设等有关部门建立土地管理信息共享机制，依法公开土地管理信息。 第七条 县级以上人民政府自然资源主管部门应当加强地籍管理，建立健全地籍数据库。 第三章 耕地保护 第八条 国家实行占用耕地补偿制度。在国土空间规划确定的城市和村庄、集镇建设用地范围内经依法批准占用耕地，以及在国土空间规划确定的城市和村庄、集镇建设用地范围外的能源、交通、水利、矿山、军事设施等建设项目经依法批准占用耕地的，分别由县级人民政府、农村集体经济组织和建设单位负责开垦与所占用耕地的数量和质量相当的耕地；没有条件开垦或者开垦的耕地不符合要求的，应当按照省、自治区、直辖市的规定缴纳耕地开垦费，专款用于开垦新的耕地。 省、自治区、直辖市人民政府应当组织自然资源主管部门、农业农村主管部门对开垦的耕地进行验收，确保开垦的耕地落实到地块。划入永久基本农田的还应当纳入国家永久基本农田数据库严格管理。占用耕地补充情况应当按照国家有关规定向社会公布。 个别省、直辖市需要易地开垦耕地的，依照《土地管理法》第三十二条的规定执行。 第九条 禁止任何单位和个人在国土空间规划确定的禁止开垦的范围内从事土地开发活动。 按照国土空间规划，开发未确定土地使用权的国有荒山、荒地、荒滩从事种植业、林业、畜牧业、渔业生产的，应当向土地所在地的县级以上地方人民政府自然资源主管部门提出申请，按照省、自治区、直辖市规定的权限，由县级以上地方人民政府批准。 第十条 县级人民政府应当按照国土空间规划关于统筹布局农业、生态、城镇等功能空间的要求，制定土地整理方案，促进耕地保护和土地节约集约利用。 县、乡（镇）人民政府应当组织农村集体经济组织，实施土地整理方案，对闲散地和废弃地有计划地整治、改造。土地整理新增耕地，可以用作建设所占用耕地的补充。 鼓励社会主体依法参与土地整理。 第十一条 县级以上地方人民政府应当采取措施，预防和治理耕地土壤流失、污染，有计划地改造中低产田，建设高标准农田，提高耕地质量，保护黑土地等优质耕地，并依法对建设所占用耕地耕作层的土壤利用作出合理安排。 非农业建设依法占用永久基本农田的，建设单位应当按照省、自治区、直辖市的规定，将所占用耕地耕作层的土壤用于新开垦耕地、劣质地或者其他耕地的土壤改良。 县级以上地方人民政府应当加强对农业结构调整的引导和管理，防止破坏耕地耕作层；设施农业用地不再使用的，应当及时组织恢复种植条件。 第十二条 国家对耕地实行特殊保护，严守耕地保护红线，严格控制耕地转为林地、草地、园地等其他农用地，并建立耕地保护补偿制度，具体办法和耕地保护补偿实施步骤由国务院自然资源主管部门会同有关部门规定。 非农业建设必须节约使用土地，可以利用荒地的，不得占用耕地；可以利用劣地的，不得占用好地。禁止占用耕地建窑、建坟或者擅自在耕地上建房、挖砂、采石、采矿、取土等。禁止占用永久基本农田发展林果业和挖塘养鱼。 耕地应当优先用于粮食和棉、油、糖、蔬菜等农产品生产。按照国家有关规定需要将耕地转为林地、草地、园地等其他农用地的，应当优先使用难以长期稳定利用的耕地。 第十三条 省、自治区、直辖市人民政府对本行政区域耕地保护负总责，其主要负责人是本行政区域耕地保护的第一责任人。 省、自治区、直辖市人民政府应当将国务院确定的耕地保有量和永久基本农田保护任务分解下达，落实到具体地块。 国务院对省、自治区、直辖市人民政府耕地保护责任目标落实情况进行考核。 第四章 建设用地 第一节 一般规定 第十四条 建设项目需要使用土地的，应当符合国土空间规划、土地利用年度计划和用途管制以及节约资源、保护生态环境的要求，并严格执行建设用地标准，优先使用存量建设用地，提高建设用地使用效率。 从事土地开发利用活动，应当采取有效措施，防止、减少土壤污染，并确保建设用地符合土壤环境质量要求。 第十五条 各级人民政府应当依据国民经济和社会发展规划及年度计划、国土空间规划、国家产业政策以及城乡建设、土地利用的实际状况等，加强土地利用计划管理，实行建设用地总量控制，推动城乡存量建设用地开发利用，引导城镇低效用地再开发，落实建设用地标准控制制度，开展节约集约用地评价，推广应用节地技术和节地模式。 第十六条 县级以上地方人民政府自然资源主管部门应当将本级人民政府确定的年度建设用地供应总量、结构、时序、地块、用途等在政府网站上向社会公布，供社会公众查阅。 第十七条 建设单位使用国有土地，应当以有偿使用方式取得；但是，法律、行政法规规定可以以划拨方式取得的除外。 国有土地有偿使用的方式包括： （一）国有土地使用权出让； （二）国有土地租赁； （三）国有土地使用权作价出资或者入股。 第十八条 国有土地使用权出让、国有土地租赁等应当依照国家有关规定通过公开的交易平台进行交易，并纳入统一的公共资源交易平台体系。除依法可以采取协议方式外，应当采取招标、拍卖、挂牌等竞争性方式确定土地使用者。 第十九条 《土地管理法》第五十五条规定的新增建设用地的土地有偿使用费，是指国家在新增建设用地中应取得的平均土地纯收益。 第二十条 建设项目施工、地质勘查需要临时使用土地的，应当尽量不占或者少占耕地。 临时用地由县级以上人民政府自然资源主管部门批准，期限一般不超过二年；建设周期较长的能源、交通、水利等基础设施建设使用的临时用地，期限不超过四年；法律、行政法规另有规定的除外。 土地使用者应当自临时用地期满之日起一年内完成土地复垦，使其达到可供利用状态，其中占用耕地的应当恢复种植条件。 第二十一条 抢险救灾、疫情防控等急需使用土地的，可以先行使用土地。其中，属于临时用地的，用后应当恢复原状并交还原土地使用者使用，不再办理用地审批手续；属于永久性建设用地的，建设单位应当在不晚于应急处置工作结束六个月内申请补办建设用地审批手续。 第二十二条 具有重要生态功能的未利用地应当依法划入生态保护红线，实施严格保护。 建设项目占用国土空间规划确定的未利用地的，按照省、自治区、直辖市的规定办理。 第二节 农用地转用 第二十三条 在国土空间规划确定的城市和村庄、集镇建设用地范围内，为实施该规划而将农用地转为建设用地的，由市、县人民政府组织自然资源等部门拟订农用地转用方案，分批次报有批准权的人民政府批准。 农用地转用方案应当重点对建设项目安排、是否符合国土空间规划和土地利用年度计划以及补充耕地情况作出说明。 农用地转用方案经批准后，由市、县人民政府组织实施。 第二十四条 建设项目确需占用国土空间规划确定的城市和村庄、集镇建设用地范围外的农用地，涉及占用永久基本农田的，由国务院批准；不涉及占用永久基本农田的，由国务院或者国务院授权的省、自治区、直辖市人民政府批准。具体按照下列规定办理： （一）建设项目批准、核准前或者备案前后，由自然资源主管部门对建设项目用地事项进行审查，提出建设项目用地预审意见。建设项目需要申请核发选址意见书的，应当合并办理建设项目用地预审与选址意见书，核发建设项目用地预审与选址意见书。 （二）建设单位持建设项目的批准、核准或者备案文件，向市、县人民政府提出建设用地申请。市、县人民政府组织自然资源等部门拟订农用地转用方案，报有批准权的人民政府批准；依法应当由国务院批准的，由省、自治区、直辖市人民政府审核后上报。农用地转用方案应当重点对是否符合国土空间规划和土地利用年度计划以及补充耕地情况作出说明，涉及占用永久基本农田的，还应当对占用永久基本农田的必要性、合理性和补划可行性作出说明。 （三）农用地转用方案经批准后，由市、县人民政府组织实施。 第二十五条 建设项目需要使用土地的，建设单位原则上应当一次申请，办理建设用地审批手续，确需分期建设的项目，可以根据可行性研究报告确定的方案，分期申请建设用地，分期办理建设用地审批手续。建设过程中用地范围确需调整的，应当依法办理建设用地审批手续。 农用地转用涉及征收土地的，还应当依法办理征收土地手续。 第三节 土地征收 第二十六条 需要征收土地，县级以上地方人民政府认为符合《土地管理法》第四十五条规定的，应当发布征收土地预公告，并开展拟征收土地现状调查和社会稳定风险评估。 征收土地预公告应当包括征收范围、征收目的、开展土地现状调查的安排等内容。征收土地预公告应当采用有利于社会公众知晓的方式，在拟征收土地所在的乡（镇）和村、村民小组范围内发布，预公告时间不少于十个工作日。自征收土地预公告发布之日起，任何单位和个人不得在拟征收范围内抢栽抢建；违反规定抢栽抢建的，对抢栽抢建部分不予补偿。 土地现状调查应当查明土地的位置、权属、地类、面积，以及农村村民住宅、其他地上附着物和青苗等的权属、种类、数量等情况。 社会稳定风险评估应当对征收土地的社会稳定风险状况进行综合研判，确定风险点，提出风险防范措施和处置预案。社会稳定风险评估应当有被征地的农村集体经济组织及其成员、村民委员会和其他利害关系人参加，评估结果是申请征收土地的重要依据。 第二十七条 县级以上地方人民政府应当依据社会稳定风险评估结果，结合土地现状调查情况，组织自然资源、财政、农业农村、人力资源和社会保障等有关部门拟定征地补偿安置方案。 征地补偿安置方案应当包括征收范围、土地现状、征收目的、补偿方式和标准、安置对象、安置方式、社会保障等内容。 第二十八条 征地补偿安置方案拟定后，县级以上地方人民政府应当在拟征收土地所在的乡（镇）和村、村民小组范围内公告，公告时间不少于三十日。 征地补偿安置公告应当同时载明办理补偿登记的方式和期限、异议反馈渠道等内容。 多数被征地的农村集体经济组织成员认为拟定的征地补偿安置方案不符合法律、法规规定的，县级以上地方人民政府应当组织听证。 第二十九条 县级以上地方人民政府根据法律、法规规定和听证会等情况确定征地补偿安置方案后，应当组织有关部门与拟征收土地的所有权人、使用权人签订征地补偿安置协议。征地补偿安置协议示范文本由省、自治区、直辖市人民政府制定。 对个别确实难以达成征地补偿安置协议的，县级以上地方人民政府应当在申请征收土地时如实说明。 第三十条 县级以上地方人民政府完成本条例规定的征地前期工作后，方可提出征收土地申请，依照《土地管理法》第四十六条的规定报有批准权的人民政府批准。 有批准权的人民政府应当对征收土地的必要性、合理性、是否符合《土地管理法》第四十五条规定的为了公共利益确需征收土地的情形以及是否符合法定程序进行审查。 第三十一条 征收土地申请经依法批准后，县级以上地方人民政府应当自收到批准文件之日起十五个工作日内在拟征收土地所在的乡（镇）和村、村民小组范围内发布征收土地公告，公布征收范围、征收时间等具体工作安排，对个别未达成征地补偿安置协议的应当作出征地补偿安置决定，并依法组织实施。 第三十二条 省、自治区、直辖市应当制定公布区片综合地价，确定征收农用地的土地补偿费、安置补助费标准，并制定土地补偿费、安置补助费分配办法。 地上附着物和青苗等的补偿费用，归其所有权人所有。 社会保障费用主要用于符合条件的被征地农民的养老保险等社会保险缴费补贴，按照省、自治区、直辖市的规定单独列支。 申请征收土地的县级以上地方人民政府应当及时落实土地补偿费、安置补助费、农村村民住宅以及其他地上附着物和青苗等的补偿费用、社会保障费用等，并保证足额到位，专款专用。有关费用未足额到位的，不得批准征收土地。 第四节 宅基地管理 第三十三条 农村居民点布局和建设用地规模应当遵循节约集约、因地制宜的原则合理规划。县级以上地方人民政府应当按照国家规定安排建设用地指标，合理保障本行政区域农村村民宅基地需求。 乡（镇）、县、市国土空间规划和村庄规划应当统筹考虑农村村民生产、生活需求，突出节约集约用地导向，科学划定宅基地范围。 第三十四条 农村村民申请宅基地的，应当以户为单位向农村集体经济组织提出申请；没有设立农村集体经济组织的，应当向所在的村民小组或者村民委员会提出申请。宅基地申请依法经农村村民集体讨论通过并在本集体范围内公示后，报乡（镇）人民政府审核批准。 涉及占用农用地的，应当依法办理农用地转用审批手续。 第三十五条 国家允许进城落户的农村村民依法自愿有偿退出宅基地。乡（镇）人民政府和农村集体经济组织、村民委员会等应当将退出的宅基地优先用于保障该农村集体经济组织成员的宅基地需求。 第三十六条 依法取得的宅基地和宅基地上的农村村民住宅及其附属设施受法律保护。 禁止违背农村村民意愿强制流转宅基地，禁止违法收回农村村民依法取得的宅基地，禁止以退出宅基地作为农村村民进城落户的条件，禁止强迫农村村民搬迁退出宅基地。 第五节 集体经营性建设用地管理 第三十七条 国土空间规划应当统筹并合理安排集体经营性建设用地布局和用途，依法控制集体经营性建设用地规模，促进集体经营性建设用地的节约集约利用。 鼓励乡村重点产业和项目使用集体经营性建设用地。 第三十八条 国土空间规划确定为工业、商业等经营性用途，且已依法办理土地所有权登记的集体经营性建设用地，土地所有权人可以通过出让、出租等方式交由单位或者个人在一定年限内有偿使用。 第三十九条 土地所有权人拟出让、出租集体经营性建设用地的，市、县人民政府自然资源主管部门应当依据国土空间规划提出拟出让、出租的集体经营性建设用地的规划条件，明确土地界址、面积、用途和开发建设强度等。 市、县人民政府自然资源主管部门应当会同有关部门提出产业准入和生态环境保护要求。 第四十条 土地所有权人应当依据规划条件、产业准入和生态环境保护要求等，编制集体经营性建设用地出让、出租等方案，并依照《土地管理法》第六十三条的规定，由本集体经济组织形成书面意见，在出让、出租前不少于十个工作日报市、县人民政府。市、县人民政府认为该方案不符合规划条件或者产业准入和生态环境保护要求等的，应当在收到方案后五个工作日内提出修改意见。土地所有权人应当按照市、县人民政府的意见进行修改。 集体经营性建设用地出让、出租等方案应当载明宗地的土地界址、面积、用途、规划条件、产业准入和生态环境保护要求、使用期限、交易方式、入市价格、集体收益分配安排等内容。 第四十一条 土地所有权人应当依据集体经营性建设用地出让、出租等方案，以招标、拍卖、挂牌或者协议等方式确定土地使用者，双方应当签订书面合同，载明土地界址、面积、用途、规划条件、使用期限、交易价款支付、交地时间和开工竣工期限、产业准入和生态环境保护要求，约定提前收回的条件、补偿方式、土地使用权届满续期和地上建筑物、构筑物等附着物处理方式，以及违约责任和解决争议的方法等，并报市、县人民政府自然资源主管部门备案。未依法将规划条件、产业准入和生态环境保护要求纳入合同的，合同无效；造成损失的，依法承担民事责任。合同示范文本由国务院自然资源主管部门制定。 第四十二条 集体经营性建设用地使用者应当按照约定及时支付集体经营性建设用地价款，并依法缴纳相关税费，对集体经营性建设用地使用权以及依法利用集体经营性建设用地建造的建筑物、构筑物及其附属设施的所有权，依法申请办理不动产登记。 第四十三条 通过出让等方式取得的集体经营性建设用地使用权依法转让、互换、出资、赠与或者抵押的，双方应当签订书面合同，并书面通知土地所有权人。 集体经营性建设用地的出租，集体建设用地使用权的出让及其最高年限、转让、互换、出资、赠与、抵押等，参照同类用途的国有建设用地执行，法律、行政法规另有规定的除外。 第五章 监督检查 第四十四条 国家自然资源督察机构根据授权对省、自治区、直辖市人民政府以及国务院确定的城市人民政府下列土地利用和土地管理情况进行督察： （一）耕地保护情况； （二）土地节约集约利用情况； （三）国土空间规划编制和实施情况； （四）国家有关土地管理重大决策落实情况； （五）土地管理法律、行政法规执行情况； （六）其他土地利用和土地管理情况。 第四十五条 国家自然资源督察机构进行督察时，有权向有关单位和个人了解督察事项有关情况，有关单位和个人应当支持、协助督察机构工作，如实反映情况，并提供有关材料。 第四十六条 被督察的地方人民政府违反土地管理法律、行政法规，或者落实国家有关土地管理重大决策不力的，国家自然资源督察机构可以向被督察的地方人民政府下达督察意见书，地方人民政府应当认真组织整改，并及时报告整改情况；国家自然资源督察机构可以约谈被督察的地方人民政府有关负责人，并可以依法向监察机关、任免机关等有关机关提出追究相关责任人责任的建议。 第四十七条 土地管理监督检查人员应当经过培训，经考核合格，取得行政执法证件后，方可从事土地管理监督检查工作。 第四十八条 自然资源主管部门、农业农村主管部门按照职责分工进行监督检查时，可以采取下列措施： （一）询问违法案件涉及的单位或者个人； （二）进入被检查单位或者个人涉嫌土地违法的现场进行拍照、摄像； （三）责令当事人停止正在进行的土地违法行为； （四）对涉嫌土地违法的单位或者个人，在调查期间暂停办理与该违法案件相关的土地审批、登记等手续； （五）对可能被转移、销毁、隐匿或者篡改的文件、资料予以封存，责令涉嫌土地违法的单位或者个人在调查期间不得变卖、转移与案件有关的财物； （六）《土地管理法》第六十八条规定的其他监督检查措施。 第四十九条 依照《土地管理法》第七十三条的规定给予处分的，应当按照管理权限由责令作出行政处罚决定或者直接给予行政处罚的上级人民政府自然资源主管部门或者其他任免机关、单位作出。 第五十条 县级以上人民政府自然资源主管部门应当会同有关部门建立信用监管、动态巡查等机制，加强对建设用地供应交易和供后开发利用的监管，对建设用地市场重大失信行为依法实施惩戒，并依法公开相关信息。 第六章 法律责任 第五十一条 违反《土地管理法》第三十七条的规定，非法占用永久基本农田发展林果业或者挖塘养鱼的，由县级以上人民政府自然资源主管部门责令限期改正；逾期不改正的，按占用面积处耕地开垦费2倍以上5倍以下的罚款；破坏种植条件的，依照《土地管理法》第七十五条的规定处罚。 第五十二条 违反《土地管理法》第五十七条的规定，在临时使用的土地上修建永久性建筑物的，由县级以上人民政府自然资源主管部门责令限期拆除，按占用面积处土地复垦费5倍以上10倍以下的罚款；逾期不拆除的，由作出行政决定的机关依法申请人民法院强制执行。 第五十三条 违反《土地管理法》第六十五条的规定，对建筑物、构筑物进行重建、扩建的，由县级以上人民政府自然资源主管部门责令限期拆除；逾期不拆除的，由作出行政决定的机关依法申请人民法院强制执行。 第五十四条 依照《土地管理法》第七十四条的规定处以罚款的，罚款额为违法所得的10%以上50%以下。 第五十五条 依照《土地管理法》第七十五条的规定处以罚款的，罚款额为耕地开垦费的5倍以上10倍以下；破坏黑土地等优质耕地的，从重处罚。 第五十六条 依照《土地管理法》第七十六条的规定处以罚款的，罚款额为土地复垦费的2倍以上5倍以下。 违反本条例规定，临时用地期满之日起一年内未完成复垦或者未恢复种植条件的，由县级以上人民政府自然资源主管部门责令限期改正，依照《土地管理法》第七十六条的规定处罚，并由县级以上人民政府自然资源主管部门会同农业农村主管部门代为完成复垦或者恢复种植条件。 第五十七条 依照《土地管理法》第七十七条的规定处以罚款的，罚款额为非法占用土地每平方米100元以上1000元以下。 违反本条例规定，在国土空间规划确定的禁止开垦的范围内从事土地开发活动的，由县级以上人民政府自然资源主管部门责令限期改正，并依照《土地管理法》第七十七条的规定处罚。 第五十八条 依照《土地管理法》第七十四条、第七十七条的规定，县级以上人民政府自然资源主管部门没收在非法转让或者非法占用的土地上新建的建筑物和其他设施的，应当于九十日内交由本级人民政府或者其指定的部门依法管理和处置。 第五十九条 依照《土地管理法》第八十一条的规定处以罚款的，罚款额为非法占用土地每平方米100元以上500元以下。 第六十条 依照《土地管理法》第八十二条的规定处以罚款的，罚款额为违法所得的10%以上30%以下。 第六十一条 阻碍自然资源主管部门、农业农村主管部门的工作人员依法执行职务，构成违反治安管理行为的，依法给予治安管理处罚。 第六十二条 违反土地管理法律、法规规定，阻挠国家建设征收土地的，由县级以上地方人民政府责令交出土地；拒不交出土地的，依法申请人民法院强制执行。 第六十三条 违反本条例规定，侵犯农村村民依法取得的宅基地权益的，责令限期改正，对有关责任单位通报批评、给予警告；造成损失的，依法承担赔偿责任；对直接负责的主管人员和其他直接责任人员，依法给予处分。 第六十四条 贪污、侵占、挪用、私分、截留、拖欠征地补偿安置费用和其他有关费用的，责令改正，追回有关款项，限期退还违法所得，对有关责任单位通报批评、给予警告；造成损失的，依法承担赔偿责任；对直接负责的主管人员和其他直接责任人员，依法给予处分。 第六十五条 各级人民政府及自然资源主管部门、农业农村主管部门工作人员玩忽职守、滥用职权、徇私舞弊的，依法给予处分。 第六十六条 违反本条例规定，构成犯罪的，依法追究刑事责任。 第七章 附 则 第六十七条 本条例自2021年9月1日起施行。 解读 李克强签署国务院令 公布修订后的《中华人民共和国土地管理法实施条例》 司法部 自然资源部负责人就修订后的《中华人民共和国土地管理法实施条例》答记者问 新《土地管理法实施条例》来了——禁止地方强制流转宅基地 中华人民共和国土地管理法实施条例 中华人民共和国土地管理法实施条例\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"202 国教科文组织世界遗产中心","doc_no":"","publish_date":"2019-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1592","summary":"良渚古城遗址位于中国，2019年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(iv)，遗产类型为文化遗产。名录坐标：北纬30.3956，东经119.9908。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：良渚古城遗址 英文名称：Archaeological Ruins of Liangzhu City 国家/地区：中国 列入年份：2019 世界遗产标准：(iii)(iv) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：30.39555, 119.990827778 名录编号：1592 官方页面：https://whc.unesco.org/en/list/1592\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;位于中国东南沿海长江三角洲的良渚古城遗址（约公元前3300-2300年）向人们展示了新石器时代晚期一个以稻作农业为支撑、具有统一信仰的早期区域性国家。该遗址由4个部分组成：瑶山遗址区、谷口高坝区、平原低坝区和城址区。通过大型土质建筑、城市规划、水利系统以及不同墓葬形式所体现的社会等级制度，这些遗址成为早期城市文明的杰出范例。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.982Z"},{"slug":"case-20181201-8aa9b7d5","title":"梵净山（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2018-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1559","summary":"梵净山位于中国，2018年列入联合国教科文组织《世界遗产名录》，列入标准为(x)，遗产类型为自然遗产。名录坐标：北纬27.8956，东经108.6800。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：梵净山 英文名称：Fanjingshan 国家/地区：中国 列入年份：2018 世界遗产标准：(x) 遗产类型：自然遗产 所属区域：Asia and the Pacific 名录坐标：27.8955555556, 108.68 名录编号：1559 官方页面：https://whc.unesco.org/en/list/1559\u003c/p>\n\u003cp>【官方描述】 梵净山位于武陵山脉的贵州省境内部分，海拔高度介于500-2570米之间，有着极度丰富的植被和地貌。这处遗产地就像是喀斯特海洋中的一个变质岩岛屿，从第三纪（6500-200万年前）开始起源于这里的诸多动植物以这里为家园。其隔离特性带来了高度的生物多样性，包括特有物种梵净山冷杉和贵州仰鼻猴，以及濒危物种如中国大鲵、林麝和白冠长尾雉。梵净山拥有亚热带地区最大、最接近原始状态的山毛榉林。\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.924Z"},{"slug":"case-20171201-23f0ef42","title":"Kulangsu, a Historic International Settlement（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2017-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1541","summary":"Kulangsu, a Historic International Settlement位于中国，2017年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iv)，遗产类型为文化遗产。名录坐标：北纬24.4475，东经118.0619。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：Kulangsu, a Historic International Settlement 英文名称：Kulangsu, a Historic International Settlement 国家/地区：中国 列入年份：2017 世界遗产标准：(ii)(iv) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：24.4475, 118.0619444444 名录编号：1541 官方页面：https://whc.unesco.org/en/list/1541\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;Kulangsu is a tiny island located on the estuary of the Chiu-lung River, facing the city of Xiamen. With the opening of a commercial port at Xiamen in 1843, and the establishment of the island as an internation :"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2016-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1508","summary":"左江花山岩画文化景观位于中国，2016年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(vi)，遗产类型为文化遗产。名录坐标：北纬22.2556，东经107.0314。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：左江花山岩画文化景观 英文名称：Zuojiang Huashan Rock Art Cultural Landscape 国家/地区：中国 列入年份：2016 世界遗产标准：(iii)(vi) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：22.2555555556, 107.031388889 名录编号：1508 官方页面：https://whc.unesco.org/en/list/1508\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;花山岩画位于中国西南边陲地区的陡峭岩壁上。这38处岩画展现的是骆越族人生活和宗教仪式的场景，这些绘制年代可追溯至公元前5世纪至公元2世纪的岩画与其依存的喀斯特地貌、河流和台地一起，使人得以一窥过去在中国南方盛行一时的青铜鼓文化仪式的原貌。这一文化景观如今是这种文化曾经存在的唯一见证。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.807Z"},{"slug":"case-20151201-e60fb1db","title":"以弗所（土耳其）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2015-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"土耳其","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1018","summary":"以弗所位于土耳其，2015年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(iv)(vi)，遗产类型为文化遗产。名录坐标：北纬37.9117，东经27.3336。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：以弗所 英文名称：Ephesus 国家/地区：土耳其 列入年份：2015 世界遗产标准：(iii)(iv)(vi) 遗产类型：文化遗产 所属区域：Europe and North America 名录坐标：37.9116666667, 27.3336111111 名录编号：1018 官方页面：https://whc.unesco.org/en/list/1018\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;以弗所位于曾经的凯斯特古河口，包括随着海岸线不断西移，而不断在新地址上建起的一系列古希腊、罗马定居点。这里发掘出了罗马帝国时期宏伟的建筑，如赛尔苏斯图书馆和大剧院，以及吸引整个地中海地区朝圣者的著名阿提米斯神庙残存少部分遗迹，这座神庙被称为“世界七大奇迹”之一。公元五世纪以来，距以弗所七公里的圣母玛丽亚终老之地，一座穹顶十字形教堂成为基督教朝圣者的重要膜拜地。内港和海道使以弗所古城成为古罗马海港城市突出代表。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.856Z"},{"slug":"case-20151201-944a5cb1","title":"土司遗址（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2015-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1474","summary":"土司遗址位于中国，2015年列入联合国教科文组织《世界遗产名录》，列入标准为(ii)(iii)，遗产类型为文化遗产。名录坐标：北纬27.8117，东经106.8169。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：土司遗址 英文名称：Tusi Sites 国家/地区：中国 列入年份：2015 世界遗产标准：(ii)(iii) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：27.8116666667, 106.8169444444 名录编号：1474 官方页面：https://whc.unesco.org/en/list/1474\u003c/p>\n\u003cp>【官方描述】 &lt;span&gt;这片遗址位于中国西南山区，包括一系列部落领地。这些领地的首领被中央政府任命为“土司”，是这里十三至二十世纪世袭的统治者。土司制度起源于公元前三世纪少数民族地区的王朝统治体系。其目的是为了既保证国家统一的集权管理，又保留少数民族的生活和风俗习惯。湖南老司城，湖北唐崖和贵州海龙屯均属于这片遗址，它是中华文明在元、明两代发展出的这种统治制度的特殊见证。&lt;/span&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀 h_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.615Z"},{"slug":"case-20101201-2d7d9893","title":"中国丹霞（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2010-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1335","summary":"中国丹霞位于中国，2010年列入联合国教科文组织《世界遗产名录》，列入标准为(vii)(viii)，遗产类型为自然遗产。名录坐标：北纬24.9653，东经113.7033。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：中国丹霞 英文名称：China Danxia 国家/地区：中国 列入年份：2010 世界遗产标准：(vii)(viii) 遗产类型：自然遗产 所属区域：Asia and the Pacific 名录坐标：24.9652777778, 113.7033333333 名录编号：1335 官方页面：https://whc.unesco.org/en/list/1335\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;中国丹霞是中国境内由陆相红色砂砾岩在内生力量（包括隆起）和外来力量（包括风化和侵蚀）共同作用下形成的各种地貌景观的总称。这一遗产包括中国西南部亚热带地区的6处遗址。它们的共同特点是壮观的红色悬崖以及一系列侵蚀地貌，包括雄伟的天然岩柱、岩塔、沟壑、峡谷和瀑布等。这里跌宕起伏的地貌，对保护包括约400种稀有或受威胁物种在内的亚热带常绿阔叶林和许多动植物物起到了重要作用。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.634Z"},{"slug":"case-20101201-5788c0c1","title":"登封 “天地之中”历史古迹（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2010-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1305","summary":"登封 “天地之中”历史古迹位于中国，2010年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(vi)，遗产类型为文化遗产。名录坐标：北纬34.3997，东经113.1412。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：登封 “天地之中”历史古迹 英文名称：Historic Monuments of Dengfeng in “The Centre of Heaven and Earth” 国家/地区：中国 列入年份：2010 世界遗产标准：(iii)(vi) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：34.3997138889, 113.1412444444 名录编号：1305 官方页面：https://whc.unesco.org/en/list/1305\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;位于中国河南省的嵩山，被认为是具有神圣意义的中岳。在海拔1500米的嵩山脚下，距河南省登封市不远，有8 座占地共40平方公里的建筑群，其中包括三座汉代古阙，以及中国最古老的道教建筑遗址——中岳庙、周公测景台与登封观星台等等。这些建筑物历经九个朝代修建而成，它们不仅以不同的方式展示了天地之中的概念，还体现了嵩山作为虔诚的宗教中心的力量。登封历史建筑群是古代建筑中用于祭祀、科学、技术及教育活动的最佳典范之一。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:11.592Z"},{"slug":"case-20091201-a08b9a0f","title":"五台山（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2009-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1279","summ
