<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遗产保护与城市更新 · 专题资料库（单文件离线版）</title>
<style>/* 遗产保护与城市更新观察平台 — 编辑部式专业排版
   基调：暖白纸面 + 墨黑 + 砖红强调；衬线大标题 + 英文小标签；发丝线分隔，克制阴影。 */
:root {
  --bg: #f7f5f0;
  --paper: #fffefb;
  --paper-2: #fbf9f4;
  --ink: #171614;
  --ink-2: #33302a;
  --muted: #757066;
  --muted-2: #9a948a;
  --line: #e3ded3;
  --line-2: #cfc8b9;
  --accent: #9c3b28;
  --accent-soft: #f4e7e2;
  --accent2: #2d5c4e;
  --accent2-soft: #e2ece7;
  --gold: #8a6a1f;
  --gold-soft: #f3ecd8;
  --indigo: #4a4a72;
  --indigo-soft: #e8e8f0;
  --radius: 3px;
  --serif: 'Songti SC', 'Source Han Serif SC', 'Noto Serif CJK SC', Georgia, 'Times New Roman', serif;
  --sans: 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.78;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { line-height: 1.35; margin: 0; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 22px; }
.muted { color: var(--muted); }

/* 顶部细条 */
.topbar {
  background: var(--ink);
  color: #e9e4da;
  font-size: 11px;
  letter-spacing: .12em;
}
.topbar .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-top: 6px;
  padding-bottom: 6px;
}
.topbar .en { text-transform: uppercase; font-weight: 600; }
.topbar .meta { color: #a9a396; letter-spacing: .04em; }

/* 头部 */
.site-header {
  background: var(--paper);
  border-bottom: 1px solid var(--line-2);
  position: sticky;
  top: 0;
  z-index: 20;
}
.site-header .wrap {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-top: 14px;
  padding-bottom: 14px;
}
.brand { display: flex; align-items: center; gap: 11px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  background: var(--ink);
  color: #fff;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 20px;
  font-family: var(--serif);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.3; }
.brand-text b { font-size: 17px; letter-spacing: .5px; font-family: var(--serif); }
.brand-text i {
  font-style: normal;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .05em;
}
.nav { margin-left: auto; display: flex; gap: 2px; }
.nav a {
  padding: 7px 15px;
  color: var(--ink-2);
  font-size: 14px;
  border-bottom: 2px solid transparent;
}
.nav a:hover { background: var(--bg); text-decoration: none; }
.nav a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.admin-link {
  font-size: 12px;
  padding: 5px 11px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  color: var(--muted);
}
.admin-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

/* 通用排版件 */
.kicker {
  font-size: 11px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin: 0 0 10px;
}
.section-title {
  font-size: 21px;
  font-family: var(--serif);
  letter-spacing: .5px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line-2);
  margin: 42px 0 14px;
  display: flex;
  align-items: baseline;
  gap: 12px;
}
.sec-no {
  font-size: 12px;
  letter-spacing: .16em;
  color: var(--accent);
  font-family: var(--sans);
  font-weight: 700;
}
.section-lede { color: var(--muted); font-size: 14px; max-width: 820px; margin: 0 0 18px; }
.page-head { margin: 40px 0 10px; }
.page-head h1 { font-size: 34px; font-family: var(--serif); margin: 0 0 10px; }
.page-head .lede { max-width: 780px; color: var(--muted); }

/* 首页 hero */
.hero {
  padding: 52px 0 38px;
  border-bottom: 1px solid var(--line-2);
  margin-bottom: 8px;
}
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(250px, .85fr);
  gap: 44px;
  align-items: start;
}
.hero-main { min-width: 0; }
.display {
  font-size: 46px;
  font-family: var(--serif);
  letter-spacing: 3px;
  margin: 0 0 16px;
  line-height: 1.22;
}
.display span { color: var(--accent); }
.lede { color: var(--muted); margin: 0 0 22px; max-width: 720px; }
.searchbar { display: flex; gap: 8px; max-width: 660px; }
.searchbar input {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--paper);
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
}
.searchbar input:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }
.hero-hint { font-size: 12.5px; color: var(--muted-2); margin: 12px 0 0; max-width: 660px; }
.hero-side {
  border-left: 1px solid var(--line-2);
  padding-left: 26px;
}
.side-title {
  font-size: 12px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  margin: 4px 0 14px;
}
.stat-list { list-style: none; margin: 0 0 16px; padding: 0; }
.stat-list li {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px dashed var(--line);
}
.stat-list b { font-size: 22px; font-family: var(--serif); color: var(--accent); min-width: 44px; }
.stat-list span { font-size: 13px; color: var(--muted); }
.side-note { font-size: 12.5px; color: var(--muted-2); margin: 0; }

/* 按钮 */
.btn {
  padding: 10px 18px;
  border: 1px solid var(--ink);
  border-radius: var(--radius);
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  white-space: nowrap;
}
.btn:hover { opacity: .88; text-decoration: none; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn-ghost:hover { border-color: var(--ink); opacity: 1; }
.btn-danger { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn-sm { padding: 5px 10px; font-size: 13px; }

/* 模块矩阵 */
.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(268px, 1fr));
  gap: 1px;
  background: var(--line-2);
  border: 1px solid var(--line-2);
}
.module {
  background: var(--paper);
  padding: 20px 22px 18px;
  display: flex;
  flex-direction: column;
  min-height: 178px;
}
.module-no {
  font-size: 11px;
  letter-spacing: .18em;
  color: var(--accent);
  font-weight: 700;
  font-family: var(--sans);
}
.module h3 { font-size: 17px; font-family: var(--serif); margin: 6px 0 8px; }
.module-desc { font-size: 13px; color: var(--muted); margin: 0 0 14px; flex: 1; }
.module-foot { display: flex; align-items: center; gap: 10px; margin: 0; }
.mstate {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 2px;
  letter-spacing: .04em;
}
.mstate-live { background: var(--accent2-soft); color: var(--accent2); }
.mstate-partial { background: var(--gold-soft); color: var(--gold); }
.mstate-plan { background: var(--paper-2); color: var(--muted-2); border: 1px dashed var(--line-2); }
.mcount { font-size: 12px; color: var(--muted); }
a.module {
  color: inherit;
  text-decoration: none;
  transition: background .16s ease, box-shadow .16s ease;
}
a.module:hover,
a.module:focus-visible {
  background: #fff;
  box-shadow: inset 0 3px 0 var(--accent);
}
a.module:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.module-static { cursor: default; }
.module-go {
  margin-left: auto;
  font-size: 12px;
  color: var(--accent);
  font-family: var(--sans);
  white-space: nowrap;
}

/* 板块卡片 */
.cats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 8px;
}
.cat-card {
  display: block;
  background: var(--paper);
  border: 1px solid var(--line-2);
  border-top: 3px solid var(--ink);
  border-radius: var(--radius);
  padding: 18px;
  color: var(--ink);
}
.cat-card:hover { text-decoration: none; border-top-color: var(--accent); }
.cat-num { display: block; font-size: 28px; color: var(--accent); font-family: var(--serif); }
.cat-name { display: block; font-size: 17px; margin-top: 2px; font-family: var(--serif); }
.cat-desc { display: block; font-size: 12.5px; color: var(--muted); margin-top: 5px; }
.cat-regulation { border-top-color: var(--accent); }
.cat-policy { border-top-color: var(--accent2); }
.cat-case { border-top-color: var(--gold); }
.cat-news { border-top-color: var(--indigo); }

/* 研究导览 */
.guide-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.guide-q {
  display: block;
  background: var(--paper);
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: 14px 16px;
  color: var(--ink);
}
.guide-q:hover { text-decoration: none; border-left-color: var(--ink); background: var(--paper-2); }
.guide-q-k {
  display: inline-block;
  font-size: 12px;
  letter-spacing: .04em;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 2px;
  padding: 0 7px;
  margin-bottom: 8px;
}
.guide-q-t { display: block; font-size: 15.5px; font-family: var(--serif); margin-bottom: 4px; }
.guide-q-d { display: block; font-size: 12.5px; color: var(--muted); }
.guide-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 26px; }
.guide-group h3 { font-size: 17px; font-family: var(--serif); margin: 0 0 10px; }

/* 主题云 */
.tcloud { display: flex; flex-wrap: wrap; gap: 7px; }
.tcloud-i {
  font-size: 13px;
  background: var(--paper);
  border: 1px solid var(--line-2);
  border-radius: 2px;
  padding: 4px 9px;
  color: var(--ink-2);
}
.tcloud-i:hover { text-decoration: none; border-color: var(--accent); color: var(--accent); }
.tcloud-i span { color: var(--muted-2); font-size: 11px; margin-left: 5px; }
.cloud-sec { margin-bottom: 10px; }
.note-sec { margin-bottom: 44px; }
.plain-bullets { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: 14px; }
.plain-bullets li { margin: 7px 0; }
.plain-bullets b { color: var(--ink); }

/* 卡片 */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 17px 19px 15px;
  display: flex;
  flex-direction: column;
}
.card:hover { border-color: var(--line-2); box-shadow: 0 2px 10px rgba(23, 22, 20, .05); }
.card h3 { margin: 9px 0 6px; font-size: 16px; line-height: 1.5; font-family: var(--serif); }
.card h3 a { color: var(--ink); }
.card h3 a:hover { color: var(--accent); text-decoration: none; }
.card-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.card-top time { margin-left: auto; }
.meta { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
.summary { font-size: 13.5px; color: var(--ink-2); margin: 0; flex: 1; }
.src { font-size: 12px; color: var(--muted-2); margin: 9px 0 0; }
.snippet {
  margin: 9px 0 0;
  padding: 7px 10px;
  background: var(--paper-2);
  border-left: 2px solid var(--accent);
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--ink-2);
}
.snippet-label {
  display: inline-block;
  font-size: 10.5px;
  letter-spacing: .06em;
  color: var(--accent);
  border: 1px solid var(--line);
  padding: 0 5px;
  border-radius: 2px;
  margin-right: 6px;
  vertical-align: 1px;
}
.chips { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 11.5px;
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 1px 8px;
  color: var(--muted);
}
a.chip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.tag {
  display: inline-block;
  font-size: 11.5px;
  padding: 1px 8px;
  border-radius: 2px;
  background: var(--paper-2);
  color: var(--ink-2);
  border: 1px solid var(--line);
}
.tag-regulation { background: var(--accent-soft); color: var(--accent); border-color: #e6cec7; }
.tag-policy { background: var(--accent2-soft); color: var(--accent2); border-color: #cfe0d8; }
.tag-case { background: var(--gold-soft); color: var(--gold); border-color: #e4d8b8; }
.tag-news { background: var(--indigo-soft); color: var(--indigo); border-color: #d6d6e4; }
.tag-featured { background: var(--accent); color: #fff; border-color: var(--accent); }
.badge {
  display: inline-block;
  font-size: 11.5px;
  padding: 1px 8px;
  border-radius: 2px;
  border: 1px solid transparent;
}
.st-valid { background: var(--accent2-soft); color: var(--accent2); border-color: #cfe0d8; }
.st-void { background: #f6e3df; color: var(--accent); border-color: #e6cec7; }
.st-running { background: var(--gold-soft); color: var(--gold); border-color: #e4d8b8; }
.st-dyn { background: var(--indigo-soft); color: var(--indigo); border-color: #d6d6e4; }
.st-report { background: var(--paper-2); color: var(--muted); border-color: var(--line-2); }
.st-case { background: var(--gold-soft); color: var(--gold); border-color: #e4d8b8; }
.st-other { background: var(--paper-2); color: var(--muted); border-color: var(--line-2); }
mark { background: #fbe9a6; color: inherit; padding: 0 2px; }
.more-wrap { margin: 22px 0 44px; }

/* 检索页 */
.result-head { margin: 38px 0 12px; }
.result-head h1 { font-size: 30px; font-family: var(--serif); margin: 0 0 4px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tab {
  padding: 6px 16px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
}
.tab:hover { text-decoration: none; border-color: var(--ink); }
.tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--paper);
  border: 1px solid var(--line-2);
  border-top: 2px solid var(--ink);
  border-radius: var(--radius);
  padding: 13px;
  margin-bottom: 18px;
}
.filters input, .filters select {
  padding: 7px 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: #fff;
  font-size: 13px;
  font-family: inherit;
  color: var(--ink);
}
.filters .f-q { min-width: 210px; flex: 1; }
.grid-list { grid-template-columns: 1fr; }
.empty { color: var(--muted); padding: 30px 0; }
.pager { display: flex; gap: 6px; justify-content: center; margin: 26px 0 40px; flex-wrap: wrap; }
.page {
  padding: 6px 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
}
.page:hover { text-decoration: none; border-color: var(--ink); }
.page.current { background: var(--ink); color: #fff; border-color: var(--ink); }
.page.disabled { color: var(--muted-2); pointer-events: none; }

/* 详情页 */
.detail {
  background: var(--paper);
  border: 1px solid var(--line-2);
  border-top: 3px solid var(--ink);
  border-radius: var(--radius);
  padding: 30px 34px;
  margin: 34px 0 20px;
}
.detail-top { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
.detail h1 { font-size: 29px; font-family: var(--serif); margin: 0 0 18px; line-height: 1.4; }
.kvs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 6px 22px;
  margin: 0 0 18px;
  padding: 15px 17px;
  background: var(--paper-2);
  border-left: 2px solid var(--accent2);
  border-radius: var(--radius);
  font-size: 13.5px;
}
.kv { display: flex; gap: 10px; }
.kv dt { color: var(--muted); min-width: 70px; }
.kv dd { margin: 0; word-break: break-all; }
.lead { font-size: 15.5px; border-left: 3px solid var(--accent); padding-left: 13px; color: var(--ink-2); }
.prose { margin-top: 24px; font-size: 15px; }
.prose h2 { font-size: 19px; margin: 30px 0 12px; font-family: var(--serif); padding-bottom: 7px; border-bottom: 1px solid var(--line); }
.prose h3 { font-size: 16px; margin: 22px 0 8px; }
.prose ul, .prose ol { padding-left: 24px; }
.prose li { margin: 6px 0; }
.prose blockquote {
  margin: 16px 0;
  padding: 11px 17px;
  border-left: 3px solid var(--line-2);
  background: var(--paper-2);
  color: var(--muted);
}
.prose code { background: var(--paper-2); padding: 1px 6px; border-radius: 2px; font-size: 13px; }
.prose pre {
  background: #221f1b;
  color: #f2ece2;
  padding: 14px 16px;
  border-radius: var(--radius);
  overflow-x: auto;
}
.prose pre code { background: none; color: inherit; padding: 0; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14px; }
.prose th, .prose td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
.prose th { background: var(--paper-2); }
.source { margin-top: 26px; font-size: 12.5px; color: var(--muted); word-break: break-all; }
.files { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; }
.files ul { padding-left: 20px; }
.verify, .archive-fields {
  background: var(--paper);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 18px;
}
.verify h2, .archive-fields h2 { font-size: 16px; font-family: var(--serif); margin: 0 0 12px; }
.verify-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px 20px;
  margin-bottom: 12px;
}
.verify-grid div { display: flex; flex-direction: column; gap: 2px; }
.verify-grid span { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-2); }
.verify-grid b { font-size: 14px; font-weight: 600; }
.cite {
  font-size: 13px;
  background: var(--paper-2);
  border-left: 2px solid var(--accent);
  padding: 10px 13px;
  margin: 12px 0 8px;
  word-break: break-all;
}
.related {
  background: var(--paper);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 44px;
}
.related h2 { font-size: 16px; font-family: var(--serif); margin: 0 0 10px; }
.related ul { list-style: none; margin: 0; padding: 0; }
.related li { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.related li span { color: var(--muted); font-size: 12px; margin-left: 8px; }

main h1 { font-size: 30px; margin: 30px 0 18px; font-family: var(--serif); }

/* 后台 */
.admin { display: flex; gap: 22px; align-items: flex-start; margin: 24px 0 40px; }
.admin-nav {
  width: 172px;
  flex: none;
  background: var(--paper);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 10px;
}
.admin-nav a {
  display: block;
  padding: 8px 12px;
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 14px;
}

s","type_label":"动态","issuer":"中国建设报","doc_no":"","publish_date":"2026-11-16","effective_date":"","status":"动态","level":"国家级","region":"全国","source_name":"中国建设报（微信公众号，署名董卫）","source_url":"https://mp.weixin.qq.com/s/um3-4ooWGPDTTJBtmeJENA","summary":"《中国建设报》刊发住房城乡建设部科学技术委员会历史文化保护与传承专业委员会委员、东南大学建筑学院教授董卫对《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的解读，主张资源调查认定坚持“从群众中来、到群众中去”，并从区域、城市、乡村三个层面建构城乡历史文化保护体系。微信公众号推送时间戳对应2026年11月16日17时30分，页面显示日期为11月17日。","themes":["文化遗产保护传承","历史文化保护","工作动态"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>近日印发的《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》（以下简称《规划》）指出，经过多年的努力，我国已经建立了多层级多要素的城乡历史文化保护传承体系。将具有重要保护价值的历史文化名城、名镇、名村、传统村落、历史文化街区、历史建筑、历史地段等纳入保护名录，形成了传承中华优秀传统文化最综合、最完整、最系统的载体。 《规划》提出到2030年，文化遗产大保护格局基本形成，文化遗产在建设社会主义文化强国中的重要作用充分彰显。显而易见，这种“文化遗产大保护格局”只有在全民广泛参与、统筹保护与发展、坚持有效保护和活态传承的基础上才能形成。 资源调查与认定应坚持“从群众中来、到群众中去”的工作路线 从历史的角度看，千千万万宝贵的文化遗产资源本来就是产生、演化、发展于民间，它们是千百年来中华文明在不同历史时期连续性变革、不断进步的产物。每个时代都会产生属于自己的文化资源，经过后世的反复选择和过滤后，它们中的一部分逐渐汇入历史之大潮，成为我们现在所看到的文化遗产。 正因为文化遗产资源生存的主客观条件都在发生变化，对于这样一种蕴含无限历史文化价值、规模庞大、类型多样且不断变化着的社会性空间载体，需要经常有针对性地开展调查认定，以确保名城、名镇、名村及历史文化街区和各类文物资源时刻处于良好状态。要做到这一点，还应激活广大城乡居民关心、投入遗产保护的积极性，结合政府部门、社会各方面与专业工作者的力量，形成广泛、活态、多层级而持续性的历史文化资源综合调查、监督与认定机制，并将其融入包括名城、名镇、名村及其他城市的保护与可持续发展进程中。 1943年6月，毛主席在《关于领导方法的若干问题》一文中第一次提出“一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动”的主张。此后，这就成为党的群众路线的基本表述。由于这些资源分布的广泛性及其与广大人民群众日常生活的紧密融合性，决定了要开展资源调查认定，都须坚持具有中国特色的基本工作方法和便捷的工作路径——这就是“从群众中来，到群众中去”。在城乡遗产保护和发展中坚持以居民为主体的治理路线，使文化遗产资源监测、保护、管理和利用更正确、更生动、更丰富。 通过调查认定在强化和优化保护措施的基础上进一步为新的历史文化资源生成与发展开辟通道 《规划》要求要坚持以人为本、广泛参与，统筹好保护与发展、保护与民生、保护与利用，在城乡建设中加强历史文化保护，推动历史文化名城、街区、村镇有效保护和活态传承。要建立以人为本、以居民为主体的保护利用机制，一条可行的路径就是尽可能将那些存在于广大城乡中的文化遗产资源“还物于民”，这样才能真正形成文化遗产大保护的格局。这绝非仅仅“藏宝于民”，而是夯实积极的、全民性文化遗产保护机制的社会基础，同时能够进一步激发人民群众在新的社会经济条件下创造新的、因地制宜的生活环境和居住建筑，为未来的文化遗产夯实社会经济和文化基础。这种扎根于地方的、生生不息的活态生活空间正是培育全民性遗产保护意识的理想环境。 回顾文化遗产保护的历程，我们可以理解，在改革开放初期，文化遗产只是很少一部分人眼中的宝藏，这个时候的保护主要是保留不变。现在，遗产认知和保护理念已经成为全民共识，活态保护利用也成为一种普遍性的“热门”做法。我们在工作中深刻体会到，随着城市更新与乡村振兴上升为国家战略，文化遗产保护与发展从一段时间以来的“胶着态”向更为积极的“升级态”转型迎来了一个十分关键的机遇期。在这个时期，通过保护与发展的深化统筹推进和融合协同，将会形成一种普遍性的城乡遗产保护发展新格局。在这个过程中要进一步提升各类历史文化资源的时代价值及其在深度城市化进程中的带头示范作用。既应充分注重城乡发展中从宏观到微观的品质提升，也须及时寻找各种问题、补齐短板，这样才能借城市更新与乡村振兴之东风，促进文化遗产保护与发展的系统性整合，更好地服务于中国式现代化的大目标。 走向更为整体性的文化遗产保护与发展 在调查中我们发现，一些地方或囿于对“保护第一”原则的片面理解，或由于资金所限，大片历史文化街区长期空置，既缺少必要的保护措施，也没有开展相关利用活动，导致街区处于自然衰败的状态。‌‌这种问题的存在具有一定的普遍性，而可行的解决方案就在于避免片段式和碎片化的保护与管理，在更大尺度上建构整体性的区域历史文化空间体系。这样便于推动整体协同保护，促进物质和非物质文化遗产协同保护，以及自然与文化资源的协同整合与利用。这种在一定区域尺度上推进资源‌统筹的基本逻辑，就是回归城乡一体的历史本源。千百年来，古代郡县制的一个重要特征，就是将城乡发展紧密联动起来，形成互促互进、共生共存的整体性社会经济结构。 现在，在新的历史条件下，城乡历史文化资源的整合与协同保护为加速改变城乡二元结构提供了新的动力机制。在这个意义上，有些在地块、街区层面上难以处理的问题，在更加宏观的尺度上反而更容易通过多种资源整合和社会经济多元协同的手段加以解决。因此，从区域、城市、乡村三个层面建构完整的国家空间发展战略体系很有必要，许多在实践和理论层面遇到的文化遗产保护问题将能在这种新的战略体系中逐步得到解决，同时在更高水平上促进历史文化资源在城乡现代化进程中韧性存续和中华文明在当代社会的动态传承。 作者系住房城乡建设部科学技术委员会历史文化保护与传承专业委员会委员，东南大学建筑学院教授 编辑：王晓晖\u003c/p>","related":[{"slug":"news-20261118-7a61b473","title":"江西宜春：脱胎漆器非遗技艺薪火相传","publish_date":"2026-11-18"},{"slug":"news-20261118-48891b30","title":"山西定向培养“文物全科人才”缓解基层人才匮乏","publish_date":"2026-11-18"},{"slug":"news-20261117-c31664aa","title":"上海博物馆与美国、德国顶尖博物馆签约促文化交流","publish_date":"2026-11-17"},{"slug":"news-20261113-520927a9","title":"宜兴蜀山古南街：窑火千年，生生不熄（“照巷”·人文经济学一线调研）","publish_date":"2026-11-13"},{"slug":"news-20261102-f3bc24f3","title":"全球首发｜中国建筑史料集成数据库正式上线","publish_date":"2026-11-02"}],"updated_at":"2026-11-19 07:28:51"},{"slug":"news-20261113-520927a9","title":"宜兴蜀山古南街：窑火千年，生生不熄（“照巷”·人文经济学一线调研）","type":"news","type_label":"动态","issuer":"荔枝新闻·我苏工作室","doc_no":"","publish_date":"2026-11-13","effective_date":"","status":"动态","level":"地方级","region":"宜兴","source_name":"荔枝新闻（江苏广电我苏工作室）","source_url":"https://m.jstv.com/news/2026/11/13/1570805509140377600.html","summary":"荔枝新闻“我苏工作室”走进宜兴蜀山古南街开展紫砂老街活化调研：以“紫砂七老”之一吴云根故居为代表的历史院落，在紫砂器物、竹编装饰与驻留艺术家创作中形成传统工艺与当代生活并置的活态传承场景，报道发布时间为2026年11月13日。","themes":["历史文化街区","保护更新","文化传承","城市更新"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>宜兴蜀山古南街：窑火千年，生生不熄丨照“巷”•人文经济学一线调研_荔枝新闻 宜兴蜀山古南街：窑火千年，生生不熄丨照“巷”•人文经济学一线调研 我苏工作室 2026-11-13 14:33 编者按：习近平总书记提出“人文经济学”的重大命题，揭示了文化与经济相互促进、协同发展的内在逻辑。深入城市角落，一条条后街小巷串联起烟火消费与特色业态，沉淀在地文化与城市记忆，承载邻里间的人情温暖，蕴藏着城市发展的“人文经济密码”。“十五五”开局之年，在江苏省互联网信息办公室指导下，江苏省广播电视总台联动全国多家市县媒体，策划推出人文经济学一线调研《照“巷”》，邀你一同走进中国各地特色街巷，见证文化与经济相互滋养、人与城市共同发展的生动现场。 video 蜀山脚下，蠡河之畔，古南街的青石板路串起一座座老宅。明清以来，这里便是宜兴紫砂生产、贸易的重要集聚地。家家捶泥、户户制陶，一代代匠人在此谋生，也留下绵长的文脉。 千年窑火不熄，这条紫砂老街，何以历久弥新？宜兴市融媒体中心记者张雅晴与本土紫砂手艺人、原创音乐人孙羽飞一起走进古南街，探寻一抔陶土背后的青春密码。 老宅苏醒 老街复兴 漫步古南街，斑驳木格窗、黛瓦白墙的老宅院错落排布，不少老宅成为紫砂工作室、茶空间。雨茗轩，便是古南街复兴进程中最早一批扎根的紫砂工作室。 走进雨茗轩，紫砂器物与茶席相伴，小院里的青竹、旧石桌，留着老宅的岁月痕迹。“这里是‘紫砂七老’之一吴云根的故居。”主理人周瑜敏领着记者边走边看，讲起自己和这座院落的故事。 雨茗轩的茶室 1993年，原本从事美术工作的周瑜敏来到古南街，开办工作室。那时候的古南街，是“被遗忘的角落”。吸引他的，是画画时遇见的石板路与夕阳，也是紫砂前辈在这里留下的创作故事。“我到这边来，也是为了寻找一个创作空间。”近30年来，他根据老宅的实际情况多次修缮，保留原有构件，另加10根柱子加固房屋，再逐步辟出7个茶空间和紫砂体验区域。“能让他们参与进来，就有了停留下来的欲望。”如今，雨茗轩接待着各地来客，也迎来越来越多年轻面孔。 从一间工作室的扎根，到整条街的复苏，真正的转折发生在2015年。丁蜀镇选择小规模、渐进式更新，2016年起用收回的公房“打样”，东南大学王建国院士团队领衔设计“样板间”，把老建筑改造成茶馆、展厅，让居民先看见“修了能怎样”。“菜单式改造”让住户按需选择，管线入地、老石条路面恢复、无卫生间民居改造同步推进，最终带动70余户原住民自发修缮房屋。 紫砂大师顾景舟南街旧居门头 一扇扇木门重新打开。13座大师古宅重焕生机，约110家紫砂工作室在此扎根，老宅重现一街风华。2024年，古南街历史街区保护项目获联合国教科文组织亚太遗产保护“杰出项目奖”与“可持续发展特别表彰奖”，其中“杰出项目奖”为当年度国内唯一。 上图：改造前的古南街 下图：改造后的古南街一角 以匠人为主角、以老宅为载体，不做静态标本，也不任商业冲淡文脉，古南街的传承在复兴中长出新的枝叶。 守住根脉 焕新表达 本土老宅与匠人，夯实了古南街的文化根基；一批新生代传承人的归来，则为紫砂技艺注入全新表达。 走进弘唐茶舍，高级工艺美术师、唐门壶艺传承人管文晶正端坐泥凳之前，双手游走之间，紫砂泥坯渐渐成型。作为唐门壶艺第五代传人，她自小在古南街长大，家族之中多数亲友都深耕紫砂行业，耳濡目染之下，制壶早已成为生活的一部分。从清华大学美术学院陶瓷系硕士学成之后，她选择回到古南街，接续家族的制壶薪火。 唐门壶艺传承人管文晶在制壶 她向记者展示她的新作品。壶上添了竹编装饰，背后是她对当下生活的观察：“我们在守住根的同时，也要根据现在的生活习惯、审美特点来做一些新的造型。” 管文晶的“变”不只在壶上。老宅中辟出了一方咖啡角，传统茶空间与年轻人喜爱的咖啡并置一院。传统作坊的“前店后坊”没有变，变的是“店”里多了客人愿意停留的理由。 在丁蜀，像管文晶这样返乡深耕紫砂的青年手艺人不在少数，数据显示，当地35岁以下青年工艺师占比达到62.3%，45岁以下中青年群体占比86.7%。 孙羽飞在创作短视频 说起身边回来做紫砂的年轻人，管文晶笑着提起同行的孙羽飞。同为家族传承的紫砂手艺人，孙羽飞一边深耕紫砂创作，一边写宜兴方言说唱、拍摄短视频，打破非遗和普通年轻人之间的壁垒。从家族师徒口传心授的封闭传承，走向开放多元的大众传播，紫砂不再只是收藏圈的雅玩，越来越多年轻人愿意走近、理解、爱上这门老手艺。 “紫砂也是我们这里的饭碗嘛，也是我们的根，我们年轻人必须要守好它。”管文晶说，对这一代年轻匠人来说，守好老手艺不是守旧，只有根扎稳了，走向现代、拥抱新表达，才不会变味。 年轻人接过做壶的技艺，也在让这条紫砂老街长出更多的新意， 他们用自己这代人的方式，重新讲这门老手艺。 青春入巷 陶土新生 “陶闲半日”的体验桌前，客人们拿起泥搭子，跟着主理人孙学孜学打泥条。一抔原矿紫砂泥，让普通人与老手艺之间的距离近了起来。店名取“偷得浮生半日闲”之意，来客花上半天，沉下心慢慢做，带走一件属于自己的作品。孙学孜的团队自研建模平台，也配备了陶瓷3D打印设备，传统打泥条与数字成型在这里各安其位。开业短短一年，这家400平方米的小店便登顶无锡DIY手工坊销量榜单。 客人在“陶闲半日”体验做紫砂作品 店里员工平均年龄约23岁。店里免费提供材料和设计平台，鼓励员工放手创作；作品经审核投入市场后，创作者获得提成。孙学孜希望让“年轻人服务年轻人。”他还在推进“筑梦小屋”平台，试图把AI辅助设计、出样与生产接起来，让创作能有更大的空间。 “陶闲半日”店内作品 在古南街，像孙学孜这样用新玩法带活老街的年轻人，正一批批地回来。紫砂工艺师韩梦笛在古南街依蠡河开出“半山小馆”咖啡店；“00后”杨镓境从景德镇陶瓷大学毕业后，到古南街开起紫砂文创店，把手串、冰箱贴等小物做成年轻人愿意带走的“陶都记忆”。从茶席上的壶到可以佩戴的陶土小物和网红咖啡，这些年轻人把紫砂从单一的器物形态里松绑，让它以更轻、更日常的方式重新进入消费和生活。 旧厂焕新 陶通世界 古南街的活力，并不局限于千米青石板路。步行5分钟可达的陶二厂，由昔日紫砂二厂的老厂房改造而来，6万多平方米的厂区摇身一变，成为艺术展览、国际陶艺交流、青年创意创业的新空间，古南街上的手艺与生活，在老厂房里有了新的延伸。 上图：改造前的陶二厂 下图：改造后的陶二厂 走进陶二厂国际驻留中心，外国陶艺家的一批作品正在展出。陶二厂国际驻留中心负责人刘畅介绍，自2025年成立以来，这里已经接待了二十多个国家和地区的艺术家、设计师。国外艺术家带着世界各地的陶瓷理念来到宜兴，和当地的紫砂艺人切磋技艺。宜兴紫砂的审美与工艺，也借由这些外来创作者，走向全球艺术舞台。 位于陶二厂文化街区的UCCA陶美术馆 一位驻留的意大利艺术家向记者展示他在宜兴驻留期间的作品：地表裂纹、晶体、网络般的自然纹理，被转化成器物的肌理。他告诉记者，他把紫砂泥与当地其他陶土结合使用，从宜兴传统陶艺中获得启发，再用自己的方式重新诠释。 陶二厂国际驻留中心驻留艺术家作品 旧厂房的活化，不止面向专业艺术家。一批曾经闲置破败的院落、厂房经过创意改造，变身工作室、咖啡馆、文创小店，改造之后，物业出租率接近100%，每年带来近千万元租金收益，创造了3000多个就业岗位。半山小馆主理人韩梦迪在陶二厂与景德镇朋友合作，开起“凡华造物”陶瓷首饰店。越来越多的“斜杠手艺人”来到这里，让本地手艺与外地设计、传统材料与当代生活，在这里找到了更广阔的土壤。 陶二厂文化街区 古南街的紫砂根脉，与陶二厂的潮流创意无缝衔接，串联起一条完整的陶都文化体验线路。游客漫步其间，既能触摸明清老街厚重的历史沉淀，也能感受当代艺术开放多元的活力，立体读懂宜兴千年陶文化。 从前，蠡河载着紫砂器物去往远方；今天，不同地方的人和创意，又循着陶土在这里相遇。老宅里，年轻人接着长辈的手艺做壶；体验桌前，来客把半日闲暇揉进陶土；艺术街区中，一件件作品正酝酿着新的旅程。古南街的烟火，就在这样的相传与相遇中，续写着今天的传奇。 调研手记 从古南街到陶二厂，老房子长出新产业，老地方引来新面孔。青石依旧，老宅如故，而街巷间多了年轻人的脚步和世界的回响。 一把壶，既是文化名片，也是实实在在的富民生意。从制壶、体验到设计、文创，围绕陶土展开的工作与生意，串联起超7万的从业人员，让发展红利惠及每一户陶乡人家。人们因这里的文化而来，又通过自己的创作和经营，为这份文化添上新的内容。 古南街还是古意盎然，但又朝气蓬勃。前辈留下的手艺，成为年轻人出发的地方；远方带来的创意，又为陶土打开新的天地。窑火千年，生生不熄；老街守韵，新人创富。这条紫砂古巷生动印证，当历史遗存融入当下生活，文化便能转化为持久的发展动能，让千年窑火在时代里持续燃烧。\u003c/p>","related":[{"slug":"news-20261118-7a61b473","title":"江西宜春：脱胎漆器非遗技艺薪火相传","publish_date":"2026-11-18"},{"slug":"news-20261118-48891b30","title":"山西定向培养“文物全科人才”缓解基层人才匮乏","publish_date":"2026-11-18"},{"slug":"news-20261117-c31664aa","title":"上海博物馆与美国、德国顶尖博物馆签约促文化交流","publish_date":"2026-11-17"},{"slug":"news-20261116-cefe783c","title":"专家解读｜董卫：坚持群众路线，深入推进资源调查认定","publish_date":"2026-11-16"},{"slug":"news-20261102-f3bc24f3","title":"全球首发｜中国建筑史料集成数据库正式上线","publish_date":"2026-11-02"}],"updated_at":"2026-11-19 07:29:29"},{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第850号","publish_date":"2026-11-09","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202611/content_7085592.htm","summary":"知识应当遵循中医药发展规律，坚持传承精华、守正创新，坚持保护优先、保护和利用相结合。 开展中医药传统知识保护活动，应当遵守法律、行政法规，不得损害国家利益、社会公共利益和他人合法权益。 第四条　国务院中","themes":["传统知识","文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第850号 《中医药传统知识保护条例》已经2026年9月18日国务院第97次常务会议通过，现予公布，自2027年1月1日起施行。 总理  李强 2026年10月23日 中医药传统知识保护条例 第一条 为了保护中医药传统知识，促进中医药传统知识的传承和发展，弘扬中医药文化，根据《中华人民共和国中医药法》，制定本条例。 第二条 本条例所称中医药传统知识，是指基于中华民族长期实践积累、世代传承发展形成的中医药理论、技术方法及其相关表现形式，包括： （一）中医药预防、保健、诊断、治疗、康复的传统理论、技术方法； （二）中医药经典名方、验方； （三）中药材品种选育、种植养殖、采集、鉴别的传统技术，中药饮片炮制、中药制剂配制的传统技术和工艺； （四）中医药古籍文献，中医药特有的传统标记、符号； （五）其他中医药传统知识。 第三条 保护中医药传统知识应当遵循中医药发展规律，坚持传承精华、守正创新，坚持保护优先、保护和利用相结合。 开展中医药传统知识保护活动，应当遵守法律、行政法规，不得损害国家利益、社会公共利益和他人合法权益。 第四条 国务院中医药主管部门负责全国的中医药传统知识保护工作。 县级以上地方人民政府中医药主管部门负责本行政区域内的中医药传统知识保护工作。 县级以上人民政府其他有关部门在各自职责范围内负责与中医药传统知识保护有关的工作。 第五条 国务院中医药主管部门与国务院其他有关部门建立中医药传统知识相关信息共享机制，加强工作协调。 第六条 省级以上人民政府中医药主管部门将中医药传统知识保护纳入相关规划，加强中医药传统知识传承传播、推广应用和科学技术研究，并提供必要的支持。 县级以上人民政府中医药主管部门鼓励和引导社会力量通过捐赠、志愿服务等方式参与中医药传统知识保护工作。 第七条 国家鼓励和支持新闻媒体、公共文化机构等根据各自业务范围开展中医药传统知识宣传、展示、体验等活动。 开展中医药传统知识宣传、展示、体验等活动，应当遵守国家有关规定，不得作虚假、夸大宣传，不得牟取不正当利益。 第八条 国家支持中医药传统知识对外交流与合作，促进中医药传统知识的国际传播和应用。 涉及中医药传统知识的外商投资、对外投资、技术出口的管理，依照《中华人民共和国外商投资法》、《中华人民共和国对外贸易法》、《国务院关于对外投资的规定》、《中华人民共和国技术进出口管理条例》等法律、行政法规和国家有关规定执行。 第九条 国务院中医药主管部门会同国务院其他有关部门加强中医药传统知识人才培养。 对在中医药传统知识保护工作中做出突出贡献的组织、个人，按照国家有关规定给予奖励。 第十条 中医药传统知识保护工作涉及国家秘密、工作秘密、商业秘密、个人隐私和个人信息的，应当遵守有关法律、行政法规的规定。 第十一条 国务院中医药主管部门加强对中医药古籍文献整理、遴选和中医药传统知识调查的统筹协调。 第十二条 国务院中医药主管部门建立中医药传统知识保护数据库，对纳入保护数据库的中医药传统知识实行分类管理。保护数据库管理的具体办法由国务院中医药主管部门制定。 第十三条 国务院中医药主管部门组织专业机构对中医药古籍文献进行整理、遴选，遴选出的中医药古籍文献和古籍文献记载的中医药传统知识经国务院中医药主管部门认定后纳入保护数据库。 第十四条 省级人民政府中医药主管部门负责组织开展本行政区域内的中医药传统知识调查，调查发现的中医药传统知识经国务院中医药主管部门认定后纳入保护数据库。 开展中医药传统知识调查可以吸纳医疗机构、高等学校、科研机构、企业、学会、行业协会商会等参与。 境外组织、个人不得在我国境内开展中医药传统知识调查。 中医药传统知识调查的具体办法由国务院中医药主管部门制定。 第十五条 开展中医药传统知识调查，应当征得调查对象的同意，尊重其风俗习惯，不得损害其合法权益；调查中取得的实物、资料应当妥善保存，防止损毁、流失。 对通过调查或者其他途径发现的濒临消失的中医药传统知识，省级人民政府中医药主管部门应当立即予以记录，并收集有关实物、资料或者采取其他抢救性保护措施。 第十六条 国家鼓励组织、个人向所在地省级人民政府中医药主管部门申报其持有的中医药传统知识，申报的中医药传统知识经省级人民政府中医药主管部门初核、国务院中医药主管部门认定后纳入保护数据库。 第十七条 国务院中医药主管部门公布纳入保护数据库的中医药传统知识相关信息。 国务院中医药主管部门会同国务院文化和旅游等部门采用数字化技术收录中医药传统知识，以利于保存使用，方便公众查阅。 第十八条 中医药传统知识持有人对其持有的中医药传统知识享有传承使用的权利，对他人获取、利用其持有的中医药传统知识享有知情同意和利益分享等权利。 国家支持合理利用中医药古籍记载的传统理论、技术方法和经典名方等处于公共领域且可以公开获取的中医药传统知识，并由国务院中医药主管部门履行持有人职责。具体办法由国务院中医药主管部门制定。 第十九条 国务院中医药主管部门建立中医药传统知识保护名录，将保护数据库中具有代表性、独特性和重要保护价值的中医药传统知识列入保护名录。保护名录管理的具体办法由国务院中医药主管部门制定。 第二十条 国务院中医药主管部门成立保护名录评审专家组，从保护数据库中遴选拟列入保护名录的中医药传统知识。国务院中医药主管部门对遴选出的中医药传统知识予以公示，并根据公示结果发布保护名录。 省级人民政府中医药主管部门可以向国务院中医药主管部门推荐拟列入保护名录的中医药传统知识。 列入保护名录的中医药传统知识不再符合条件的，由国务院中医药主管部门组织评审专家组认定后予以移除，并及时向社会公布。 第二十一条 县级以上地方人民政府可以根据实际情况为列入保护名录的中医药传统知识传承传播提供必要的支持。 第二十二条 国务院文化和旅游部门会同国务院文物、中医药等主管部门加强对列入保护名录的中医药古籍的保护、修复、合理利用、传承工作。 第二十三条 县级以上人民政府中医药主管部门根据中医药传统知识保护需要，依托高水平医疗机构，通过下列方式促进列入保护名录的中医药传统知识推广应用： （一）收集、整理有关实物、资料； （二）开展临床应用； （三）开展应用研究，提升临床应用的标准化、规范化水平； （四）开展师承教育、培训，培养后继人才； （五）举办技术方法演示、学术研讨交流等活动。 第二十四条 国务院中医药主管部门会同国务院工业和信息化、药品监督管理等部门依托中药饮片生产企业、医疗机构等，对列入保护名录的中药饮片炮制传统技术和工艺进行研究和推广应用，支持应用中药饮片炮制传统技术和工艺提升中药饮片质量水平。 第二十五条 国务院中医药主管部门会同国务院农业农村、药品监督管理等部门对列入保护名录的中药材品种选育、种植养殖、采集、鉴别传统技术进行推广应用。 第二十六条 国家鼓励和支持运用传统中医药研究方法和现代科学技术对中医药传统知识开展研究，鼓励医疗机构、高等学校、科研机构、企业、学会、行业协会商会等合作开展研究，加强基础理论、作用机理、临床应用等研究，促进中医药理论、技术方法的传承和创新。 第二十七条 省级以上人民政府中医药主管部门根据中医药传统知识保护需要，组织高等学校、科研机构等采取下列方式对列入保护名录的中医药传统知识开展科学技术研究： （一）收集、整理有关实物、资料； （二）开展理论、技术方法溯源和关键信息考证； （三）进行开发利用、成果转化。 第二十八条 县级以上人民政府中医药主管部门和其他有关部门未依照本条例规定履行中医药传统知识保护职责的，由本级人民政府或者上一级人民政府有关部门责令限期改正；情节严重的，对负有责任的领导人员和直接责任人员依法给予处分。 第二十九条 违反本条例第十四条第三款规定开展中医药传统知识调查的，由县级以上人民政府中医药主管部门责令停止违法行为，给予警告，没收违法所得和调查中取得的实物、资料，可以并处5万元以上50万元以下的罚款。 第三十条 违反本条例规定，给中医药传统知识持有人等造成损害的，依法承担民事责任；构成犯罪的，依法追究刑事责任。 第三十一条 中医药传统知识属于文物、非物质文化遗产项目的，还应当依照《中华人民共和国文物保护法》、《中华人民共和国非物质文化遗产法》的有关规定进行保护。 第三十二条 本条例自2027年1月1日起施行。\u003c/p>","related":[{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"},{"slug":"regulation-20251011-430d7532","title":"密云水库水源保护条例","publish_date":"2025-10-11"}],"updated_at":"2026-11-16T09:21:19.511Z"},{"slug":"news-20261102-f3bc24f3","title":"全球首发｜中国建筑史料集成数据库正式上线","type":"news","type_label":"动态","issuer":"天津人民出版社","doc_no":"","publish_date":"2026-11-02","effective_date":"","status":"动态","level":"国家级","region":"全国","source_name":"天津人民出版社（微信公众号，署名第五编辑室）","source_url":"https://mp.weixin.qq.com/s/VYUnIUTL1GYqEaVON6c6hw","summary":"由清华大学建筑学院编研、全国图书馆文献缩微复制中心提供资料来源的《中国建筑史料集成数据库》正式上线，收录1911年至1949年中国建筑学文献，提供600dpi以上扫描、OCR全文检索与人名机构索引，支持多端沉浸式阅读。微信公众号推送时间戳对应2026年11月2日10时32分，页面显示日期为11月3日。","themes":["文化遗产","工作动态","档案"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中国第一个建筑文献数据库 震撼上线 填补历史的空白 1911年至1949年的中国建筑学，在中国建筑史上承上启下、举足轻重，既有中国传统建筑风格的延续，也体现了西方建筑理念的传播。然而，海量文献阅览受限、检索困难，成为学界亟待解决的现实问题。 为系统回应这一学术需求，《中国建筑史料集成数据库》正式上线。 2020年，清华大学建筑学院、全国图书馆文献缩微复制中心和天津出版传媒集团天津人民出版社联合打造推出《中国建筑史料编研（1911—1949）》（全200册），学术总顾问为两院院士吴良镛先生，编委会主任为中国工程院院士庄惟敏先生。2025年，又推出《中国建筑史料编研（1911—1949）》（增订版·全220册）。2026年，通过内容与技术的深度融合，《中国建筑史料数据库》正始上线，做到了全库可检、一库纵览，实现了中国近代建筑史料最完整、最系统的优质数据集成，有效填补了该领域史料数字化整理的空白。 从纸质书到数据库 宏大集成，海量文献数字化呈现 数据库以《中国建筑史料编研（1911—1949）》（增订版·全220册）为基础，实现了海量文献的数字化呈现。 390种史料：涵盖专著、文档、报告、期刊等多种类型。 史料类型·建筑图书 85000页文献影像：全部保留原书原貌，完整呈现历史细节。 史料类型·行政规划文书 134篇研究成果：专业解读代表性史料，提供深度学术参考。 史料类型·研究成果 六大核心模块：1.近代建筑及其历史研究，2.近代建筑结构及工程研究，3.近代建筑技术研究，4.近代城市研究，5.近代建筑规章与机构，6.建筑期刊及其他。 史料类型·调查报告说明书 数据库的建成，使中国近现代建筑史研究者有可能采用不同研究方法，从不同视角开展研究。产品服务于建筑史、城市规划、土木、园林、历史、社会学等多学科研究使用，为学界提供了丰富、便捷的一手史料支撑。 史料类型·建筑期刊 权威编研，筑牢学术基石 数据库以《中国建筑史料编研（1911—1949）》（增订版·全220册）为底本，该书汇聚了国内建筑学界的顶尖学术力量，确保了图书与数据库的学术专业性与权威性。 学术总顾问：吴良镛 编委会主任：庄惟敏 学术顾问委员会：王丽方 王贵祥 毛其智 朱颖心 庄惟敏 张复合 林洙 贾珺 钱稼茹 主 编: 刘亦师 副主编: 李海清 钱毅 执行编委会：王岩（哈尔滨工业大学）、刘亦师（清华大学）、刘思铎（沈阳建筑大学）、纪晓东（清华大学）、冷天（南京大学）、张天洁（天津大学）、李海清（东南大学）、李颖春（同济大学）、李路珂（清华大学）、青锋（清华大学）、郭红仙（清华大学）、钱毅（北方工业大学）、彭长歆（华南理工大学）、谢晓云（清华大学） 技术赋能，实现精准高效检索 针对传统纸质书查阅效率低、实体史料获取难等问题，数据库将内容与AI相结合，在精细扫描、图像处理、文字识别、全文检索和分类导航等技术层面进行了深度探索。 高保真图像还原：文本扫描分辨率不低于 600dpi，图纸分辨率不低于1200dpi。 史料内容原貌呈现 毫秒级精准检索：数据库建设采用最新图像处理及 OCR 识别技术，并构建数据分类导航框架，检索响应速度平均在 0.5秒以内。支持按标题、作者、正文、关键词等多维度检索，并支持人名（含中外人名）与机构名索引。 数据库关键词检索 精细化图像处理：在数字化过程中，通过严谨的审图（顺序调整、去白页、换图、去重、补图）与修图（矫正、去污、去章、拼接）工序，保障文献影像的质量、完整性与准确性。 原始史料精细化修图前后对比 多端沉浸式阅读：支持手机扫码随时在线阅读，提供放大、缩小、全屏、旋转、自动翻页及背景色调整等丰富功能，极大提升了移动场景下的研究体验。 数据库史料详情页 中国建筑史料集成数据库 CHINESE ARCHITECTURAL | 平台信息 编研单位 清华大学建筑学院 资料来源 全国图书馆文献缩微复制中心 出版单位 天津出版传媒集团天津人民出版社 发行单位 陕西弘瑞晟文化传播有限公司 联系电话 029-85214697 022-23332446 初审：燕文青、王蒙 复审：金晓芸 终审：沈海涛\u003c/p>","related":[{"slug":"news-20261118-7a61b473","title":"江西宜春：脱胎漆器非遗技艺薪火相传","publish_date":"2026-11-18"},{"slug":"news-20261118-48891b30","title":"山西定向培养“文物全科人才”缓解基层人才匮乏","publish_date":"2026-11-18"},{"slug":"news-20261117-c31664aa","title":"上海博物馆与美国、德国顶尖博物馆签约促文化交流","publish_date":"2026-11-17"},{"slug":"news-20261116-cefe783c","title":"专家解读｜董卫：坚持群众路线，深入推进资源调查认定","publish_date":"2026-11-16"},{"slug":"news-20261113-520927a9","title":"宜兴蜀山古南街：窑火千年，生生不熄（“照巷”·人文经济学一线调研）","publish_date":"2026-11-13"}],"updated_at":"2026-11-19 07:29:29"},{"slug":"news-20261023-8f6f2648","title":"文化和旅游“十五五”规划实施工作推进会在河南郑州召开","type":"news","type_label":"动态","issuer":"文化和旅游部","doc_no":"","publish_date":"2026-10-23","effective_date":"","status":"动态","level":"国家级","region":"全国","source_name":"文化和旅游部","source_url":"https://www.mct.gov.cn/whzx/whyw/202610/t20261023_967449.htm","summary":"会议指出，全国文化和旅游系统认真贯彻落实党中央、国务院决策部署，扎实推动并高质量完成文化和旅游“十五五”规划编制任务。要准确把握“十五五”文化和旅游发展特点，推进落实繁荣艺术创作生产、加强文化遗产保护传承、完善文化和旅游公共服务、加快发展文化和旅游产业、统筹文化和旅游市场培育监管、深化文化和旅游交流合作等“十五五”重点任务。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>会议指出，全国文化和旅游系统认真贯彻落实党中央、国务院决策部署，扎实推动并高质量完成文化和旅游“十五五”规划编制任务。要准确把握“十五五”文化和旅游发展特点，推进落实繁荣艺术创作生产、加强文化遗产保护传承、完善文化和旅游公共服务、加快发展文化和旅游产业、统筹文化和旅游市场培育监管、深化文化和旅游交流合作等“十五五”重点任务。\u003c/p>","related":[{"slug":"news-20261118-7a61b473","title":"江西宜春：脱胎漆器非遗技艺薪火相传","publish_date":"2026-11-18"},{"slug":"news-20261118-48891b30","title":"山西定向培养“文物全科人才”缓解基层人才匮乏","publish_date":"2026-11-18"},{"slug":"news-20261117-c31664aa","title":"上海博物馆与美国、德国顶尖博物馆签约促文化交流","publish_date":"2026-11-17"},{"slug":"news-20261116-cefe783c","title":"专家解读｜董卫：坚持群众路线，深入推进资源调查认定","publish_date":"2026-11-16"},{"slug":"news-20261113-520927a9","title":"宜兴蜀山古南街：窑火千年，生生不熄（“照巷”·人文经济学一线调研）","publish_date":"2026-11-13"}],"updated_at":"2026-11-18T07:35:46.308Z"},{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","type":"policy","type_label":"政策","issuer":"住房城乡建设部","doc_no":"建科〔2026〕60号","publish_date":"2026-10-20","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202610/content_7083855.htm","summary":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知 建科〔2026〕60号 各省、自治区住房城乡建设厅，直辖市规划和自然资源委（局）、住房城乡建设（管）委，","themes":["文化遗产","历史文化名城","历史建筑"],"featured":1,"attachments":[{"name":"《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》全文（附件PDF）","url":"http://www.chinajsb.cn/special/doc/2026/20261020/1638479137.pdf","source":"中国建设报"}],"bodyHtml":"\u003cp>标 题： 住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知 发文机关： 住房城乡建设部 建科〔2026〕60号 来 源： 住房城乡建设部网站 主题分类： 城乡建设、环境保护\\城乡建设（含住房） 公文种类： 通知 2026年10月15日 标 题： 住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知 发文机关：住房城乡建设部 来 源：住房城乡建设部网站 主题分类：城乡建设、环境保护\\城乡建设（含住房） 公文种类：通知\u003c/p>\n\u003cp>——\u003c/p>\n\u003cp>《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》全文（附件PDF）（来源：http://www.chinajsb.cn/special/doc/2026/20261020/1638479137.pdf）\u003c/p>\n\u003cp>历史文化名城（镇、村）与历史建筑保护传承“十五五”规划为贯彻落实党中央、国务院关于加强城乡历史文化保护传承的决策部署，根据《中华人民共和国国民经济和社会发展第十五个五年规划纲要》、《文化遗产保护传承“十五五”规划》、《住房城乡建设事业高质量发展“十五五”规划》，制定本规划。\u003c/p>\n\u003cp>一、规划背景\u003c/p>\n\u003cp>（一）现状基础\u003c/p>\n\u003cp>党的十八大以来，在以习近平同志为核心的党中央坚强领导下，我国城乡历史文化保护传承水平大幅提升，基本形成以承载不同历史时期文化价值的城市、村镇等复合型活态遗产为主体和依托的立体保护格局，城乡历史文化保护传承工作展现新面貌、跨上新台阶。构建了系统推进城乡历史文化保护传承的工作格局。中共中央办公厅、国务院办公厅印发《关于在城乡建设中加强历史文化保护传承的意见》，各省编制实施省级城乡历史文化保护传承体系规划，管理体制持续完善。\u003c/p>\n\u003cp>建立国家历史文化名城第三方评估和重点评估、中国传统村落保护情况调查评估机制，建立地方各级住房城乡建设部门向本级党委专题年度报告城乡历史文化保护传承工作情况制度，工作机制逐步优化。加快推进国家层面历史文化保护传承法律法规制修\u003c/p>\n\u003cp>订工作，发布城乡历史文化保护利用项目规范等标准，法治基础不断夯实。建立了多层级多要素的城乡历史文化保护传承体系。将具有重要保护价值的历史文化名城、名镇、名村、传统村落、历史文化街区、历史建筑、历史地段等纳入保护名录，形成了传承中华优秀传统文化最综合、最完整、最系统的载体。保护对象年代不断延展，保护对象类型持续丰富，保护对象数量大幅增长。\u003c/p>\n\u003cp>截至“十四五”期末，全国共有国家历史文化名城143座、中国历史文化名镇名村799个、中国传统村落8155个，划定历史文化街区1300多片，认定历史建筑\u003c/p>\n\u003cp>6.89万处。\u003c/p>\n\u003cp>营造了全社会共同保护传承城乡历史文化的良好氛围。制作播出《文脉春秋》、《中国传统建筑的智慧》、《村庄里的中国》等大型纪录片，累计观看人次超百亿。各地建立120余个保护志愿者团体，10余个城市设立历史文化名城、古城保护日。10余所高校开设古建筑修缮、历史建筑保护工程等学科，建立了涵盖4大类21项工种共2.2万名工匠的全国传统建筑工匠库。\u003c/p>\n\u003cp>保护传承城乡历史文化遗产人人有责日益成为全社会各方面的共识。开创了城乡历史文化和现代生活融为一体的生动局面。“十四五”期间，中央预算内投资安排资金支持61个历史文化名城、街区、村镇保护提升工程，中央财政安排资金支持110个县（市、区、旗）传统村落集中连片保护利用示范工\u003c/p>\n\u003cp>作。全国开展约200片历史文化街区、1万处历史建筑保护更新和修复修缮，惠及居民1200余万人。在70余个城市开展历史建筑保护利用试点，活化利用历史建筑、工业遗产。58片历史文化街区、10条老街成为国家级旅游休闲街区，中国传统村落年接待游客数量达到5.3亿人次。河南省开封市古城保护利用、江苏省苏州市古城保护更新、福建省屏南县传统村落保护利用经验做法入选《习近平文化思想实践案例选编》。\u003c/p>\n\u003cp>（二）面临形势\u003c/p>\n\u003cp>党中央、国务院对加强城乡历史文化保护传承工作作出新部署，强调要完善历史文化保护传承体系，要加强历史文化名城、街区、村镇整体保护和活态传承，要推动文化遗产系统性保护和统一监管，要建立以居民为主体的保护实施机制。城市发展正从大规模增量扩张阶段转向存量提质增效为主的阶段，宜居宜业和美乡村建设加快推进，城乡历史文化需要更严格保护、更充分传承、更有效利用。\u003c/p>\n\u003cp>人民对美好生活的向往日益增长，期盼在老街区、传统村落中过上现代生活，期盼深度参与保护传承工作，期盼深切感受到历史文化魅力，要充分发挥城乡历史文化遗产以文化人、以文惠民、以文润城、以文兴业的作用。“十五五”时期，城乡历史文化保护传承的工作重心由聚焦抢救保护、遏制破坏为主，转向整体保护、活态传承和活化利用并重。\u003c/p>\n\u003cp>保护发展不平衡、传承利用不充分的问题亟\u003c/p>\n\u003cp>待解决，资源全面普查、科学保护修缮和人居环境改善等方面仍有提升空间，在推动经济社会发展中的作用有待全面激发，治理能力和治理水平还要持续提高。要深刻认识城乡历史文化保护传承工作面临的新形势、新任务、新要求，切实担负起新的文化使命，全面提升城乡历史文化保护传承工作水平。\u003c/p>\n\u003cp>二、总体要求\u003c/p>\n\u003cp>坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻落实党的二十大和二十届历次全会精神，践行习近平文化思想，落实中央城市工作会议部署，坚持党的全面领导，坚持保护第一、传承优先、合理利用，坚持以人为本、广泛参与，统筹好保护与发展、保护与民生、保护与利用、单体保护与整体保护，在城乡建设中加强历史文化保护，推动历史文化名城、街区、村镇有效保护和活态传承。\u003c/p>\n\u003cp>到2030年，城乡历史文化保护对象数量持续增长，历史文化名城、街区、村镇整体保护和活态传承力度不断加大，有效利用水平大幅提升，保护传承工作机制持续完善，人民群众的文化自觉和文化自信不断增强，历史文化保护传承工作有力推动城乡高质量发展。到2035年，保护名录实现空间全覆盖、要素全囊括，历史文化遗产得到系统整体保护，创造性转化、创新性发展取得重大突破，多方参与、协同高效的保护传承工作机制基本建立，历史文化保护传承工作深度融入城乡建设和经济社会发展大局。\u003c/p>\n\u003cp>主要指标序号指标2025年2030年属性达到国家历史文化名城保护标准的市县数量（个）143155预期性达到中国历史文化名镇保护标准的镇数量（个）312360预期性达到中国历史文化名村保护标准的村数量（个）487630预期性4历史建筑测绘建档率（%）80≥90预期性中国传统村落数字化建档率（%）30≥90预期性6城市古树名木建档率（%）-100约束性修缮提升历史文化街区数量（片）〔200〕〔300〕预期性8修缮历史建筑数量（处）〔10000〕〔15000〕预期性9修缮提升传统村落数量（个）-〔1000〕预期性10传统建筑工匠数量（人）2200025000预期性注：〔〕内为5年累计数。\u003c/p>\n\u003cp>三、深入推进历史文化资源调查认定\u003c/p>\n\u003cp>始终将保护放在第一位，深入推进城乡历史文化遗产资源调查，统筹做好各级各类保护对象资源管理工作，为完善历史文化保护传承体系提供支撑，让各时期、各类型、各区域、各民族的历史文化遗产得到全面保护。\u003c/p>\n\u003cp>（一）开展历史文化资源调查\u003c/p>\n\u003cp>推进老城区和老街区专项调查工作。坚持价值导向、应保尽保、实事求是，以市辖区、县域为基本单元开展专项调\u003c/p>\n\u003cp>查，全面调查老城及其历史文化街区，形成各类历史文化资源的潜在对象名单，开展预保护，对符合条件的及时认定公布。推进历史文化名镇名村、传统村落资源调查。摸清具有保护价值的格局风貌、传统建筑、文物古迹，古井、街巷、古桥、古树等历史环境要素，以及村镇特有的农事节气、农业景观、节庆活动、民间艺术、祖传家训、乡风民俗等情况。\u003c/p>\n\u003cp>开展城市古树名木资源普查。落实《古树名木保护条例》相关要求，做好第三次全国古树名木资源普查工作，建立城市古树名木档案。加强城市更新前的资源调查。建立健全“先调查后建设”的保护前置机制，对拟实施城市更新的区域，及时开展历史文化资源调查评估，做好认定公布前的预保护工作。\u003c/p>\n\u003cp>（二）加快认定保护对象名录\u003c/p>\n\u003cp>完善国家级保护对象名录。持续推动国家历史文化名城、中国历史文化名镇名村、中国传统村落认定公布工作。动态更新国家级保护名录和空间分布图。研究建立国家历史文化名城预备名录。完善省级保护对象名录。建立健全省级历史文化名城保护制度。持续推进省级历史文化名城、街区、村镇认定公布工作，形成省级保护名录和空间分布图。\u003c/p>\n\u003cp>推动有条件的地方建立传统村落保护名录。完善市（县）级保护对象名录。加快历史地段认定公布\u003c/p>\n\u003cp>工作，及时将具有一定保护价值，但未达到历史文化街区标准的老街巷、老厂区、老校园、老公园、老广场等公布为历史地段。持续推进历史建筑认定公布工作，动态开展名录复核。建立历史名园名录。支持建立特色保护要素清单。\u003c/p>\n\u003cp>（三）完善资源档案和数据库管理\u003c/p>\n\u003cp>推进挂牌保护。推进历史文化名镇、名村、传统村落、历史文化街区、历史地段、历史建筑、古树名木标志牌设立工作，实现挂牌保护全覆盖。鼓励采用二维码等新技术展示保护对象信息和保护要求。推进数字化测绘建档。推进历史文化街区和历史建筑的数字化测绘建档，鼓励运用新技术加强信息采集。做好历史建筑保护修缮档案的规范管理和动态更新，夯实精细化保护修缮和数字化展示利用的工作基础。\u003c/p>\n\u003cp>逐步推进中国历史文化名镇名村、中国传统村落数字化测绘建档。建立城乡历史文化遗产数据库。依托“数字住建”平台整合城乡历史文化遗产数据，形成涵盖各级各类保护对象主要信息的数据库。支持国家历史文化名城开展高质量的遗产数据采集和记录，实现对历史文化资源的高精度展示和精细化管理。专栏1城乡历史文化资源调查认定\u003c/p>\n\u003cp>1.推进老城区和老街区专项调查。在所有县（市、区、旗）开展老城区和老\u003c/p>\n\u003cp>街区专项调查工作，以历史上都城、府城、州城、县城所在的老城区、老镇区为重点，全面摸清历史文化名城、名镇、历史文化街区、历史地段、历史建筑的潜\u003c/p>\n\u003cp>在资源底数，对于符合条件的按程序及时公布认定。新认定历史文化街区100片以上，新确定历史建筑1万处以上。\u003c/p>\n\u003cp>2.推进传统村落调查认定。全面调查村落历史文化积淀、格局肌理、传统建\u003c/p>\n\u003cp>筑、非物质文化遗产、活态保护基础等基础情况，持续完善各级传统村落保护名录。\u003c/p>\n\u003cp>3.完善省、市、县三级保护对象名录。实现省级历史文化名城保护制度全覆\u003c/p>\n\u003cp>盖，公布一批省级历史文化名城。积极开展历史地段的认定公布工作，实现全国市级行政区全覆盖。持续推进历史建筑的认定公布工作，实现全国市、县全覆盖。\u003c/p>\n\u003cp>4.开展城市古树名木资源普查。完成第三次全国古树名木资源普查，摸清城\u003c/p>\n\u003cp>市中古树名木、古树群资源底数与保护现状。\u003c/p>\n\u003cp>5.开展传统村落数字化测绘建档。选取代表性中国传统村落开展数字化测绘\u003c/p>\n\u003cp>建档工程，通过倾斜摄影、地空全景漫游、高精度三维扫描等数字技术手段，全面采集村落选址格局、整体风貌、院落建筑、建筑构件、营建技艺等信息，开展高精度数字存档，搭建三维空间数字模型。\u003c/p>\n\u003cp>四、加强整体保护和活态传承\u003c/p>\n\u003cp>落实“老城不能再拆”要求，加大历史文化名城、街区、村镇、历史地段整体保护力度，保护真实、完整的历史信息和历史环境，延续历史文脉，改善人居环境，增强安全韧性，促进活态传承。\u003c/p>\n\u003cp>（一）加大整体保护力度\u003c/p>\n\u003cp>做好历史文化名城整体保护。加强历史文化名城保护规划编制审批和实施，强化城址环境、传统格局、历史风貌、空间尺度等管控要求。推动历史文化名城有序开展历史城区保护提升，保护好城市独特的历史文脉、人文地理、自然景观。\u003c/p>\n\u003cp>做好历史文化名镇、名村、传统村落整体保护。加强历史文化名镇名村保护规划的编制审批和实施。各地可编制传统村落保护规划或工作方案，或在村庄规划等相关规划中体现传统村落保护要求。强化自然与人文景观的整体保护。鼓励资源丰富的省份开展传统村落集中连片发展研究。实施历史文化名镇、名村、传统村落保护提升工程。\u003c/p>\n\u003cp>加强历史文化街区和历史地段保护。加强历史文化街区保护规划编制审批和实施，支持各地出台历史地段相关管理规定，整体保护街巷肌理、传统风貌、空间尺度、自然景观和人文环境等。组织城市开展历史文化街区专项体检，依据体检结果精准实施保护修缮。加强历史建筑保护修缮。加快编制历史建筑专项保护方案（图则），明确核心价值要素、本体和周边环境的保护要求。\u003c/p>\n\u003cp>做好历史建筑安全鉴定，支持有条件的地方开展历史建筑体检评估，及时进行抢救性修缮和安全加固，消除安全隐患。统筹传统修缮技艺和新技术的应用，提升保护修缮水平。推进跨区域历史文化遗产系统保护。结合京津冀、长三角、粤港澳大湾区等国家区域重大战略，推进城乡历史文化遗产整体保护与协同发展。推进长城、大运河、长征、黄河、长江国家文化公园沿线历史文化名城、名镇、名村及传统村落系统保护。\u003c/p>\n\u003cp>鼓励文化同源的历史资源集中地区开展跨区域协同保护。考虑国家文化重大主题、传统文化特色和地域特\u003c/p>\n\u003cp>征等因素，选择60个县（市、区、旗）开展传统村落特色保护区建设工作。\u003c/p>\n\u003cp>（二）提升安全韧性水平\u003c/p>\n\u003cp>优化历史城区、街区、镇区市政基础设施。全面排查评估历史城区、历史文化街区和历史文化名镇镇区基础设施的短板弱项与风险隐患，制定年度实施计划。持续做好历史文化街区老旧市政基础设施更新改造，在有条件的街区统筹推进城市基础设施生命线安全工程，提升设施安全运维水平。因地制宜地解决停车难、充电难问题。\u003c/p>\n\u003cp>提升历史文化名村和传统村落基础设施水平。推动历史文化名村和传统村落道路便捷连通，修复破损路面，保护修缮老街巷。健全生活垃圾收运处置常态化运行保障机制，因地制宜地选择农村污水治理模式，注重风貌协调。开展防灾减灾专项行动。针对特定高发自然灾害，因地制宜编制专项防灾应急预案，开展培训、宣传和演练。\u003c/p>\n\u003cp>重点提升历史文化名镇名村和传统村落防火、防洪，历史城区排涝及历史建筑白蚁防治能力。\u003c/p>\n\u003cp>（三）改善人居环境品质\u003c/p>\n\u003cp>提升历史建筑和传统民居的宜居性能。开展居住类历史建筑和传统民居宜居性能提升省级试点，形成一批典型案例。推广应用新技术、新方法、新材料，提升居住类历史建筑、传统民居的保温、隔热、采光、通风、防水、隔音等性能。推进成套化改造，因地制宜补充必要的现代化生活配套设施。\u003c/p>\n\u003cp>完善公共服务设施配套。立足居民实际需求，因地制宜配置公共服务设施，实现“一镇一村一街一策”，不搞“一刀切”，避免形象工程。加强公共服务设施适老化、适儿化改造，推进无障碍设施建设。鼓励利用历史建筑等既有建筑，通过市场化运作等方式，提供公共服务。优化提升公共开放空间。挖潜边角地、拆违腾退地和宅前屋后闲置地，见缝插针建设口袋公园、微型广场和健身场地。\u003c/p>\n\u003cp>依托古树名木、古桥古井等历史景观，建设小微文化游园。优化公共空间设计，加强活动休憩设施配置，强化历史文化特色和风貌协调，提高实用性和文化性。专栏2整体保护和活态传承\u003c/p>\n\u003cp>1.历史文化名城、街区、村镇保护提升工程。实施一批国家历史文化名城历\u003c/p>\n\u003cp>史城区、中国历史文化名镇名村和300片历史文化街区的保护提升项目。保护修复重要历史轴线、历史街巷、空间节点，加固修缮历史建筑和传统风貌建筑，整治改造沿街立面路面，增补完善基础和公共服务设施、防灾减灾设施，建设数字化展示利用和动态监测设施等。\u003c/p>\n\u003cp>2.中国传统村落保护提升工程。实施中国传统村落保护利用全面提升，开展\u003c/p>\n\u003cp>村落基础和公共服务设施改造提升，完善消防等必要的防灾减灾设施，抢救濒危公共传统建筑，推动传统民居宜居性改造和风貌整治。\u003c/p>\n\u003cp>3.历史建筑保护修缮工程。推动各地实施1.5万处历史建筑修缮提升，消除\u003c/p>\n\u003cp>安全隐患，维护好外观风貌和体现价值的典型构件，传承木作、瓦作、石作等传统营造技艺，用数字化手段做好修缮过程记录，推动新技术应用。\u003c/p>\n\u003cp>4.白蚁防治工程。开展历史建筑、传统村落白蚁预警监测，编制白蚁防治方\u003c/p>\n\u003cp>案，实施一批白蚁预防、综合治理和修缮工程。\u003c/p>\n\u003cp>5.开展居住类历史建筑和传统民居宜居性能提升省级试点。推动各省立足\u003c/p>\n\u003cp>实际情况，选择若干市、县开展先行先试，研究居住类历史建筑、传统民居宜居性能提升和成套化改造的适应性技术，形成可复制、可推广的经验。\u003c/p>\n\u003cp>五、推动文化赋能城乡高质量发展\u003c/p>\n\u003cp>以用促保，让遗产在有效利用中焕发新活力，为城乡建设高质量发展提供新动力。多层次、全方位挖掘各类历史文化遗产的营建智慧、文化价值、精神内涵，传承好、弘扬好中华优秀传统文化。\u003c/p>\n\u003cp>（一）加强有效利用，推动动能转换\u003c/p>\n\u003cp>加强历史建筑活化利用。总结推广历史建筑保护利用试点工作经验做法。推动历史建筑活化利用融入周边地区功能提升，鼓励优先用于公共服务、老字号传承经营、非物质文化遗产展示传播等。支持在严格保护价值与风貌的前提下，创新引入新功能新业态。推动传统产业传承发展。统筹推动传统产业复兴与历史文化名城、名镇、名村、传统村落、历史文化街区和历史地段的保护发展，鼓励引入与传统产业相关的技能传习、文化展陈、研学体验、休闲消费等业态，激发经济发展新动能。\u003c/p>\n\u003cp>支持传统营建技艺的传承与发展，鼓励运用传统设计、建筑材料、施工工艺。深化文商旅融合。推动建立历史文化街区活化利用正负面清单，鼓励业态策划先行，避免过度商业化和业态同质化。支持依托历史文化街区、历史地段建设精品街道、城市客厅、\u003c/p>\n\u003cp>活力街区，培育消费新场景。鼓励历史文化名镇、名村及传统村落挖掘自然山水与历史文化资源，因地制宜发展文创、民宿、康养、研学等产业。数智赋能文化传承。推动历史文化和科技融合，依托有条件的历史文化街区和历史地段发展文化科技、数字创意等特色文化产业。加强历史文化遗产的数字复原与沉浸式演绎，打造一批数字文化体验空间，加强遗产价值阐释与内涵展示。\u003c/p>\n\u003cp>鼓励将历史文化遗产转化为数字资产与原创IP，发展数字文化产业。\u003c/p>\n\u003cp>（二）强化风貌引导，彰显文化特色\u003c/p>\n\u003cp>系统推进风貌塑造。深入研究城市历史文脉和风貌特色，构建传统风貌基因库。加强城市更新重点地区、重要地段风貌管控，推动老旧城区新旧风貌有机融合，在新城新区建设中做好风貌传承创新，让城市风貌更好地体现中华美学和时代风尚。加强历史文化名镇名村、传统村落风貌引导和整治。打造特色历史风貌游径。\u003c/p>\n\u003cp>鼓励依托历史轴线、街巷、城垣、水系等线性空间，结合城市绿道建设，串联各类历史文化遗产，构建融入生产生活的历史文化展示线路。开展游径沿线环境整治提升，完善标识设施，丰富展陈手段，让广大人民群众感受文化魅力。强化塑造特色风貌节点。保护古塔、古阁、古楼、古碑、古亭、古桥等重要地标建筑的历史环境，整治不协调建筑和景观。\u003c/p>\n\u003cp>延续老广场、历史名园及老公园、老码头等重要空间\u003c/p>\n\u003cp>场所的历史文脉，加强设计引导和建设管控。鼓励运用数字技术、公共艺术等手段，做好历史文化信息展示。\u003c/p>\n\u003cp>（三）凝聚精神力量，传承文明智慧\u003c/p>\n\u003cp>发挥遗产教育功能。依托历史文化名镇、名村、传统村落、历史文化街区和历史建筑，建设新时代文明实践中心、中华优秀传统文化传习所等教育场所。组织开展课外实践、研学体验等青少年遗产教育活动。传承传统文化和营建智慧。挖掘梳理传统营建智慧和营建技艺，编辑出版系列图书，弘扬传承传统建筑文化。组织编写村史村志，挖掘抢救濒危传统文化，以图文影像等方式拍摄和记录口述历史，留存传承传统技艺和集体记忆。\u003c/p>\n\u003cp>推进线上传统村落数字博物馆建设。加大宣传推广力度。持续总结推广历史文化保护利用可复制经验做法清单。统筹用好新闻报道、影视剧、纪录片、短视频等全媒体宣传载体，讲好保护传承故事。鼓励历史文化名城设立保护日，组织开展文化主题活动。开展城乡历史文化保护传承优秀纪录片、出版物外译工作与案例经验国际推介工作。\u003c/p>\n\u003cp>加强城乡历史文化保护传承领域国际合作。专栏3文化赋能城乡高质量发展\u003c/p>\n\u003cp>1.推动历史建筑保护利用试点经验应用。总结历史建筑保护利用试点经验，\u003c/p>\n\u003cp>推广历史建筑体检评估、保护修缮、消防安全提升、活化利用、数字化智能化等方面可复制可推广的经验。\u003c/p>\n\u003cp>2.加强历史文化遗产宣传与传播交流。推动一批国家历史文化名城开展“历\u003c/p>\n\u003cp>史文化名城保护日”宣传。持续开展《文脉春秋》等纪录片摄制和播放。组织开展城乡历史文化保护传承代表性出版物外译工作。\u003c/p>\n\u003cp>3.推动传统村落文化传播传承。制作并在中央广播电视总台1套播放《村庄\u003c/p>\n\u003cp>里的中国》第二季纪录片，出版《村庄里的中国》系列丛书并外译出版。加强线上传统村落数字博物馆单馆建设，新增一批线上中国传统村落数字单馆。完成2600个左右中国传统村落村史村志编纂，结合传统节庆、非遗民俗、民间艺术等开展常态化活动。\u003c/p>\n\u003cp>4.加强传统建筑工匠培育。开展本地区传统建筑工匠培训，实现全国江南水\u003c/p>\n\u003cp>乡建筑区、北方平原建筑区、西北传统建筑区、闽粤客家侨乡建筑区、西南山地建筑区、青藏高原建筑区等6个片区传统建筑工匠培训全覆盖。\u003c/p>\n\u003cp>六、建立健全保护传承工作机制\u003c/p>\n\u003cp>推动城市更新与历史文化保护深度融合，探索以居民为主体的保护实施路径，畅通社会参与渠道，强化全过程监督管理，构建共建共治共享的保护传承工作格局。\u003c/p>\n\u003cp>（一）完善城市更新与历史文化保护传承有机融合机制\u003c/p>\n\u003cp>强化规划统筹协同。加强保护规划与城市更新规划的衔接，将整体保护要求和底线管控措施纳入城市更新规划。在城市更新片区策划、项目实施方案中，发挥遗产综合价值，提升城市更新的文化品位与内涵。加强城市更新项目评估论证。对涉及各类历史文化资源的城市更新改造项目组织开展评估论证，切实保护好地形地貌、历史遗存和文化生态。\u003c/p>\n\u003cp>严格拆建和迁移管理。研究制定历史文化街区和历史建筑相关行政许可的实施细则，严格历史文化街区内的拆除管\u003c/p>\n\u003cp>理，加强历史建筑修缮管理和原址保护。加强行政许可审批后的实施监管。\u003c/p>\n\u003cp>（二）建立以居民为主体的保护实施机制\u003c/p>\n\u003cp>拓展居民参与渠道。加强信息公开，依法依规公示保护规划等事项，保障居民知情权。优化居民议事会、村民代表大会等参与渠道，畅通民意表达。将居民意见作为方案优化、项目实施的重要依据。引导居民自主更新。支持各地制定居民房屋修缮实施细则，理顺优化保护修缮工程报批流程，引导居民开展自主更新。鼓励居民通过“投工投劳”等方式，参与环境整治、公共设施修缮等小微项目建设。\u003c/p>\n\u003cp>探索个人自筹、村集体投入与政府补助相结合的共建模式。强化居民自治管理。结合基层治理，组织居民常态化参与日常监督管理。鼓励将遗产保护、风貌延续、环境维护等公共要求纳入居民公约、村规民约，充分发挥居民积极性。\u003c/p>\n\u003cp>（三）健全引导社会力量参与的保护实施机制\u003c/p>\n\u003cp>激发市场主体参与活力。支持各地探索制定历史建筑产权登记、功能转换和混合利用、租赁年限延长等政策，引导社会资本参与保护利用。搭建项目对接推广平台。加强专业力量技术支撑。鼓励高校、科研机构参与理论创新和技术研发。支持专业技术机构、规划师、设计师、工程师在规划设计、工程实施、业态运营、公众参与等方面提供在地化、常态化技术服务。\u003c/p>\n\u003cp>持续开展设计下乡，推行驻村\u003c/p>\n\u003cp>镇设计师制度，支持行业协会、高校、科研院所组织设计人才下乡。\u003c/p>\n\u003cp>（四）完善监督检查闭环管理工作机制\u003c/p>\n\u003cp>推动专项评估提质增效。加强历史文化名城年度自评估和省级评估工作，切实提高评估质量。加强评估成果运用和问题整改，将整改落实情况纳入年度向本级党委报送的城乡历史文化保护传承工作情况专题报告，并作为下一年度专项评估重点。提升动态监测能力。统筹建设城乡历史文化遗产保护动态监测平台，做好城乡历史文化遗产监测工作。\u003c/p>\n\u003cp>建立完善线索核实、整改落实的闭环管理工作流程。支持有条件的历史文化名城探索依法运用新技术提升实时监管能力。加强社会监督和日常巡查。鼓励社会公众提供破坏历史文化遗产行为的线索，支持新闻媒体发挥舆论监督作用。加强城乡历史文化保护传承日常巡查队伍能力建设，鼓励利用数字化手段提高巡查质量，将巡查工作纳入社区网格化管理、城市管理综合执法等范畴。\u003c/p>\n\u003cp>健全问题处置机制。加大对破坏历史文化遗产有关重大案件查处力度，保护不力的，按规定予以警示并限期整改，研究将不符合标准的保护对象列入濒危名录或退出保护名录。配合做好城乡历史文化保护传承检察公益诉讼。\u003c/p>\n\u003cp>专栏4建立健全保护传承工作机制\u003c/p>\n\u003cp>1.开展以居民为主体的保护实施机制省级试点。各地立足实际情况，选择\u003c/p>\n\u003cp>若干市、县开展先行先试，研究健全居民全程参与、自主修缮、多方协同、利益共享的实施机制，系统推进试点实践，形成可复制、可推广的经验。\u003c/p>\n\u003cp>2.建设城乡历史文化遗产保护动态监测平台。依托部历史文化遗产监测重\u003c/p>\n\u003cp>点实验室，建设城乡历史文化遗产保护动态监测平台。鼓励各地探索依法利用新技术强化常态化巡查与动态监管能力。\u003c/p>\n\u003cp>七、加强规划实施保障\u003c/p>\n\u003cp>（一）加强组织领导和工作协同\u003c/p>\n\u003cp>持续做好住房城乡建设部门向本级党委专题年度报告城乡历史文化保护传承工作。推动将城乡历史文化保护传承工作列入地方各级政府工作报告。鼓励各地将城乡历史文化保护管理工作纳入“一委一办一平台”体系，强化多部门协同联动，形成工作合力。健全规划评估机制，开展规划实施情况动态监测、中期评估和总结评估。\u003c/p>\n\u003cp>（二）完善法规标准\u003c/p>\n\u003cp>完善法律法规体系。协同推动起草历史文化遗产保护法。加快推动制修订历史文化名城名镇名村保护条例、历史街区和古老建筑保护条例。推动制定传统村落保护条例、中国传统村落名录管理办法。支持各地做好城乡历史文化保护传承法规规章的制修订工作。健全技术标准体系。研究完善历史文化街区和历史建筑认定标准。\u003c/p>\n\u003cp>加快推进历史文化名城保护规划、历史文化街区\u003c/p>\n\u003cp>与历史建筑防火、历史建筑修缮等标准的制修订与应用，研究推动历史建筑安全排查、历史文化街区体检评估等标准的编制工作。推动传统村落认定、保护、修复、修缮、更新及活化利用等方面的技术标准制定。研究制定历史建筑和传统村落白蚁防治标准。鼓励出台地方、团体标准和技术导则。\u003c/p>\n\u003cp>（三）加强人才培养\u003c/p>\n\u003cp>加强领导干部培训。在各级住房城乡建设系统领导干部培训课程中，强化城乡历史文化保护传承有关内容。支持省级主管部门与组织部门联合举办领导干部历史文化保护工作专题培训班。鼓励各地将历史文化保护培训纳入党校课程，加大培训力度。强化学科专业建设。支持有条件的高等院校与地方主管部门、企业联合建设城乡历史文化遗产教育基地。\u003c/p>\n\u003cp>推动成立城乡历史文化保护传承学协会，建设高水平学术期刊。支持高等院校、职业学校加强城乡历史文化遗产保护学科建设。推进城乡历史文化保护类教材编写工作。提升专业人才素质。培育城乡历史文化保护传承领域带头人与高水平科研团队，加强专业技术人员职业培训。加强传统建筑工匠培育、使用和管理，推动建立传统建筑工匠职业技能评价和认定体系。\u003c/p>\n\u003cp>鼓励各地依托行业协会、职业学校和龙头企业建立实训基地，开展省级工匠名录库建设。\u003c/p>\n\u003cp>（四）拓展投融资渠道\u003c/p>\n\u003cp>落实城市更新相关投融资政策，推动中央财政加大支持历史文化保护传承工作力度。支持金融机构开发适配历史文化保护传承的金融产品。支持政策性金融机构加大对历史文化保护传承项目信贷支持力度。鼓励公益基金按规定资助保护类项目。\u003c/p>","related":[{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260723-bb8576c2","title":"中共上海市委办公厅、上海市人民政府办公厅印发《上海市城市更新三年行动计划（2026—2028年）》的通知","publish_date":"2026-07-23"}],"updated_at":"2026-11-19T07:28:16.000Z"},{"slug":"news-20260930-724d017b","title":"文化和旅游部印发《艺术发展“十五五”规划》","type":"news","type_label":"动态","issuer":"文化和旅游部","doc_no":"","publish_date":"2026-09-30","effective_date":"","status":"动态","level":"国家级","region":"全国","source_name":"文化和旅游部","source_url":"https://www.mct.gov.cn/whzx/whyw/202609/t20260930_967299.htm","summary":"《规划》提出，到2030年，艺术事业呈现高质量发展新局面。艺术质量显著提升，精品力作持续涌现，艺术供给更加丰富，重大文艺活动示范引领作用进一步凸显；艺术创新路径更加明晰，艺术表达形态与传播方式更加多元；艺术普及活动蓬勃开展，全民审美素养稳步提升；中国艺术学自主知识体系构建取得新进展，艺术评价标准更加科学，评奖机制更加完善，文艺评论的权威性、专业性、影响力持续提升；多层次艺术人才培育体系更为成熟，队伍结构不断优化；政策体系不断完善，艺术创作生产服务、引导、组…","themes":["生态保护"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>《规划》提出，到2030年，艺术事业呈现高质量发展新局面。艺术质量显著提升，精品力作持续涌现，艺术供给更加丰富，重大文艺活动示范引领作用进一步凸显；艺术创新路径更加明晰，艺术表达形态与传播方式更加多元；艺术普及活动蓬勃开展，全民审美素养稳步提升；中国艺术学自主知识体系构建取得新进展，艺术评价标准更加科学，评奖机制更加完善，文艺评论的权威性、专业性、影响力持续提升；多层次艺术人才培育体系更为成熟，队伍结构不断优化；政策体系不断完善，艺术创作生产服务、引导、组织工作机制更加健全，艺术生态持续向好。\u003c/p>","related":[{"slug":"news-20261118-7a61b473","title":"江西宜春：脱胎漆器非遗技艺薪火相传","publish_date":"2026-11-18"},{"slug":"news-20261118-48891b30","title":"山西定向培养“文物全科人才”缓解基层人才匮乏","publish_date":"2026-11-18"},{"slug":"news-20261117-c31664aa","title":"上海博物馆与美国、德国顶尖博物馆签约促文化交流","publish_date":"2026-11-17"},{"slug":"news-20261116-cefe783c","title":"专家解读｜董卫：坚持群众路线，深入推进资源调查认定","publish_date":"2026-11-16"},{"slug":"news-20261113-520927a9","title":"宜兴蜀山古南街：窑火千年，生生不熄（“照巷”·人文经济学一线调研）","publish_date":"2026-11-13"}],"updated_at":"2026-11-18T07:35:46.440Z"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","type":"policy","type_label":"政策","issuer":"中共中央办公厅、国务院办公厅","doc_no":"","publish_date":"2026-09-29","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院公报（2026年第29号）","source_url":"https://www.gov.cn/gongbao/2026/issue_13046/202610/content_7083674.html","summary":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》（新华社北京2026年9月29日电，见国务院公报2026年第29号，中国政府网）。主要目标：到2030年，文化遗产资源全面摸清，监管体制基本理顺，法规制度更加健全，人才队伍持续壮大，保护督察有力有效，文化遗产大保护格局基本形成。规划提出构建文化遗产大保护格局，并明确在2028年年底、2030年年底分别开展中期评估和总结评估。","themes":["文化遗产","文化遗产保护传承","十五五规划","历史文化名城","历史建筑"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>近日，中共中央办公厅、国务院办公厅印发了《文化遗产保护传承“十五五”规划》，并发出通知，要求各地区各部门结合实际认真贯彻落实。 《文化遗产保护传承“十五五”规划》全文如下。 文化遗产承载灿烂文明、传承历史文化、维系民族精神，是不可再生、不可替代的宝贵资源。为加强文化遗产保护传承，推动文化遗产事业高质量发展，依据《中华人民共和国国民经济和社会发展第十五个五年规划纲要》，编制本规划。 一、总体要求 坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，认真落实四中全会部署，全面贯彻习近平文化思想特别是习近平总书记关于文化遗产保护传承的重要论述，坚持党的全面领导，坚持以人民为中心，坚持创造性转化、创新性发展，坚持保护第一、合理利用和最小干预原则，加强统筹协调，深化改革创新，推动文化遗产系统性保护和统一监管。 主要目标是：到2030年，文化遗产资源全面摸清，监管体制基本理顺，法规制度更加健全，人才队伍持续壮大，保护督察有力有效，文化遗产大保护格局基本形成，文化遗产在建设社会主义文化强国中的重要作用充分彰显。 二、构建文化遗产大保护格局 1．深入开展普查调查。 巩固第四次全国文物普查成果，开展第二次全国可移动文物普查、第二次全国非物质文化遗产普查。及时公布全国重点文物保护单位、国家历史文化名城、国家级非物质文化遗产代表性项目、国家级文化生态保护区。建立全国文化遗产资源总目录，在中国文物云、非遗数据库等基础上，统合形成国家文化遗产资源大数据库。 2．推动整体协同保护。 深入实施中华优秀传统文化传承发展工程。构建中华文明标识体系。推动物质文化遗产和非物质文化遗产协同保护，加强文化生态保护区建设管理，健全国家级、省级文化生态保护区名录。促进文化遗产和自然遗产协同保护，加大文化景观、古树名木保护力度。 3．完善法律法规制度。 推动制定文化遗产保护法。贯彻落实文物保护法，推动修订文物保护法实施条例、博物馆条例、历史文化名城名镇名村保护条例，强化历史文化街区保护法制保障。完善红色资源、传统村落、古籍保护相关制度。推动修订非物质文化遗产法。 三、提升不可移动文物保护水平 4．加强保护管理。 完善不可移动文物和历史建筑名录，加大各级文物保护单位公布力度。健全设区的市级、县级文物保护单位和未定级不可移动文物保护监管体系。保护文物本体和历史原貌，提升文物保护工程质量，严禁借保护之名行造假之实。加强文物保护修缮管理，统筹推进抢救性、预防性、研究性保护。推动文物修缮与非遗技艺相结合。 5．落实保护前置。 在城乡建设中落实“先调查、后建设”、“先考古、后出让”的文物保护前置要求，细化政策举措，开展文化遗产资源调查。及时将有保护价值的对象纳入不可移动文物或历史建筑名录，动态增补历史文化街区、地下文物埋藏区。整体保护文物本体和历史环境，加强对文物保护单位保护范围和建设控制地带的保护管理。 6．强化分类保护。 实施“中国营造”重点计划。整体保护长城、大运河、丝绸之路、蜀道、秦直道、茶马古道、河西走廊等线性遗产和文化线路。加强历史上的都城、府城、州城、县城等古城整体性、系统性保护。加强红色文化遗产保护，深入实施革命文物保护利用工程。推动工业遗产、农业文化遗产、水利遗产等文化遗产分类保护，做好与文物保护体系的衔接。结合实际建设文物主题游径。 四、推进考古工作和文明历史研究 7．深化考古和文明历史研究。 推进中华文明探源工程、“考古中国”重大项目、夏商文明研究工程。推动主动性考古发掘项目控量提质。开展重大区域性、专题性考古项目。加强考古资料档案管理和重点考古报告出版，推进研究阐释。推进重点地区、重要领域考古标本库房建设和设施设备更新，提升考古技术装备标准化水平。 8．优化基本建设考古。 加强基本建设考古管理和保障，有序开展国家重大工程和城乡建设考古工作，形成考古资源“一张图”。加强地下文物埋藏区、水下文物保护区划定和管理。加强城市考古工作，在古今叠压型历史城市的老城范围内，实施地上文物古迹和地下考古遗址的整体协同保护。 9．提升遗址保护水平。 实施国家考古遗址公园保护提升工程，加强考古遗址公园保护管理。加大早期都邑遗址、历代都城遗址等保护力度。推进边疆地区考古研究，强化陆疆、海疆遗产和文物古迹整体保护展示。加强对重要考古新发现原址保护利用，培育遗址类新型公共文化空间。 五、加强可移动文物保护和博物馆管理 10．推进可移动文物保护。 加强国有博物馆藏品盘库建档和文物定级，强化馆藏文物本体保护。加强古籍保护、整理和出版，开展古籍文物定级。推进简牍文献、敦煌文献、《永乐大典》等保护整理出版，开展中华典籍文献研究。深入实施档案文献遗产影响力提升工程，加强满文、藏文、蒙文等少数民族古文字档案保护、翻译和研究。优化文物流通领域管理，完善文物进出境部门协同监管机制，构建规范统一的国家文物鉴定服务体系。 11．全面加强博物馆管理。 完善博物馆管理制度，强化从业人员职业道德教育，鼓励公众参与监督。健全博物馆建设标准、登记备案程序、退出管理机制。实施中小博物馆提升计划。鼓励利用具备条件的文物建筑、工业遗产开办博物馆。强化新建博物馆项目论证审批，切实防止扎堆重复建设。 12．提升博物馆服务质效。 提升博物馆公共文化服务水平，用好用足现有政策，加大有效供给，按规定给予经费支持，研究完善免费开放政策。优化资源配置，盘活馆藏文物，促进优质文化资源直达基层。鼓励博物馆结合实际开设城市历史与民俗专题展览，与非遗联动展陈。加强藏品资源共享和馆际交流，按规定开展文物出境展览和联合展览。 六、加强历史文化名城、街区、村镇有效保护和活态传承 13．完善保护体系。 以全国文物普查、老城区及其历史街区专项调查成果为基础，加强历史文化名城、街区、村镇核定公布。加强对尚未列入保护名录的老街区、老村镇的调查和保护。健全分级保护管理制度，建立国家历史文化名城预备名录。加强保护评估，落实保护名录退出机制。 14．加强整体保护。 实施历史文化名城、街区、村镇保护提升工程。加大对历史文化名城、街区、村镇内古建筑、古遗址、近现代代表性建筑等文物古迹的保护力度。整体保护传统格局、空间肌理、历史风貌、街巷体系、建筑遗存、文化生态、景观环境，真实保存城乡历史文脉。 15．推动活态传承。 采用微改造方式，开展小规模、渐进式修缮，建立以居民为主体的保护实施机制。加强保护利用机制创新和经验探索，促进历史文化街区内文物建筑和历史建筑的合理利用。推进传统村落特色保护区建设，发挥村规民约作用，因地制宜推动活化利用。 七、扎实做好非物质文化遗产保护传承 16．完善保护传承体系。 持续实施非遗记录工程，完善档案制度。健全非遗代表性项目名录动态调整机制。加强对急需保护非遗项目的扶持传承。健全非遗代表性传承人名录体系，加强代表性传承人梯队建设，提升代表性项目传承活力。 17．提高保护传承水平。 深入实施非物质文化遗产传承发展工程，加强分类保护。推进传统节日、传统工艺传承振兴，研究民间文学、民俗等门类保护措施。开展传统戏剧复排，加强曲艺资源挖掘整理，丰富传统音乐、传统舞蹈、传统体育类非遗实践形式。推动传统医药传承，支持中医药发展。提升民间文艺版权保护和制度保障水平。推动非遗工坊提质增效，深化非遗赋能历史经典产业升级。 18．强化文化生态整体保护。 保护非遗所依托的村落、街巷、戏台、祠堂、园林等文化空间。传承行政区划历史文化，保护地名文化遗产。探索非遗当代表达新方式、合理利用新形式，培育传承体验新场景。完善传承体验设施，支持合理利用文物建筑布局非遗传承展示空间。 八、推进国家文化公园建设保护 19．优化国家文化公园管理体制。 强化国家文化公园内重要文化遗产地、文化生态系统的有效保护和合理利用。完善建设管理体制，加强跨区域协调，统筹推进长城、大运河、长征、黄河、长江国家文化公园建设保护工作。 20．实施国家文化公园挂牌保护。 依托彰显中华文明突出特性的文化遗产资源，分批分类建立挂牌保护名录。依托挂牌保护机制，支持符合条件的重大任务和重点项目，提升保护水平。在加强保护的前提下，配置必要的辅助设施，为教育、研究、旅游等提供支撑。 九、提升文化遗产治理能力和水平 21．强化空间规划管控。 统筹文物保护单位、未定级不可移动文物、历史建筑保护要求，完善不可移动文物、历史文化名城等保护规划编制标准。在主体功能区战略实施中强化文化遗产资源保护。统筹划定历史文化保护线，纳入国土空间规划“一张图”，建立数据安全共享与动态维护机制，严格落实国土空间用途管制和规划许可制度。 22．维护文化遗产安全。 建立国家文化遗产安全监测预警指挥处置体系，提升文化遗产应急管理能力。健全文物防灾减灾救灾工作制度，有效应对气候变化及地震灾害风险。严厉打击文物犯罪，整治安全隐患。规范引导文化遗产合理适度利用，防止重用轻保、重旅轻文、过度商业开发。开展文化遗产保护全民行动，发挥社会组织、志愿者队伍作用，在文明城市创建中持续推动文化遗产保护。 23．落实保护监管责任。 建立文化遗产保护督察制度，压紧压实文化遗产保护责任。推动文化遗产保护纳入干部教育培训体系。强化对领导干部履行文化遗产保护工作中经济责任情况的审计监督。依法开展文化遗产保护检察公益诉讼。对单位和个人违法造成文物严重破坏或灭失的，严肃追究责任。对在文化遗产保护传承工作中取得突出成绩的单位和个人，按照国家有关规定给予表彰奖励。 十、加强文化遗产保护教育科技人才支撑 24．推进文化遗产自主知识体系建设。 推进文化遗产学学科建设，优化专业设置，培养交叉复合型人才，鼓励具备条件的高校建设文化遗产学院。用好国家社会科学基金、国家自然科学基金、国家艺术基金、国家出版基金等各类基金，提升基础研究和应用研究水平。加强和改进地方志工作。推动文化遗产保护融入国民教育，推动文化遗产和乡土文化进校园、进教材。结合实际推出文化遗产研学线路，发挥文化遗产美育作用。 25．加强文化遗产领域科技创新。 建设文化遗产保护领域国家级科技创新平台基地。推动文物保护装备研发与升级，加快信息化标准化建设。加强文物建筑、石窟寺、古壁画、岩画、土遗址、古籍、档案等领域保护技术支撑。推动人工智能、卫星遥感、无人机、实景三维、虚拟现实等技术应用，提升数智化保护水平，加强文化遗产数字档案和数字资产管理。 26．优化文化遗产人才发展机制。 加强文化遗产保护人才培育。完善文化遗产保护专业技术人才评价制度，建立稳定的人才培养机制，做好经费保障。实施全国考古人才振兴计划、文物优秀青年人才支持行动、青年非遗传承人培育行动。开展文物修复师、考古探掘工、乡土建筑工匠、档案遗产人才培养培训。壮大基层文化遗产保护人才队伍。 十一、深化文化遗产国际交流合作 27．加强文化遗产交流合作。 加强文化遗产保护双边合作，推进中外联合考古。深化博物馆交流，举办中华文明主题高水平国际巡展。加强文化遗产国际发展合作。强化流失境外中国文物调查，开展溯源及流转历史研究，推进流失文物追索返还国际合作。 28．参与文化遗产全球治理。 发挥文化遗产在践行全球文明倡议中的重要作用，深化与联合国教科文组织等国际组织和多边机制的务实合作。实施文化遗产全球伙伴计划，支持亚洲文化遗产保护联盟充分发挥作用，促进全球南方文化遗产保护。 29．履行文化遗产领域国际公约。 积极参与世界文化和自然遗产、人类非物质文化遗产、世界记忆项目、全球重要农业文化遗产等申报和保护，加强申报统筹指导。实施中国世界文化遗产保护提升专项行动。遵守国际公约保护管理要求，积极参与国际规则和标准制定。 十二、组织保障 30．加强组织实施。 在文化遗产保护传承工作中树立和践行正确政绩观。健全文化遗产保护传承工作体制机制，中央文化遗产保护委员会发挥统筹协调、整体推进、督促落实作用，中央文化遗产保护委员会办公室具体推动、组织实施。强化党委统一领导、宣传部门统筹协调、有关部门履职尽责的文化遗产保护工作格局。地方党委和政府因地制宜确定文化遗产保护年度目标和重点任务。各地区各部门编制相关规划时，要与本规划做好衔接。 31．强化投入保障。 聚焦本体保护，抢救濒危遗产，发挥资金效益，优化重点项目联合申报机制，统筹用好现有资金，拓展投入渠道，保障重点项目落地实施。通过中央专项彩票公益金支持文物古迹保护。探索引入保险机制。有条件的地方在依法依规、风险可控前提下，可探索文物保护贷款贴息等支持举措。 32．注重宣传引导。 深化文化遗产研究和弘扬传播，有效发挥其在推进精神文明建设、开展爱国主义教育、铸牢中华民族共同体意识中的作用。树立正确保护理念，强化法规政策解读，总结推广先进经验和创新成果。加强宣传引导，提升全社会保护意识，支持媒体开展舆论监督。 33．加强实施评估。 中央文化遗产保护委员会办公室围绕本规划的目标任务、重大工程进展组织实施评估，推动各项工作落实。在2028年年底、2030年年底分别对本规划执行情况进行中期评估和总结评估，评估报告报中央文化遗产保护委员会。重大事项及时按程序向党中央、国务院请示报告。 （新华社北京2026年9月29日电）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260723-bb8576c2","title":"中共上海市委办公厅、上海市人民政府办公厅印发《上海市城市更新三年行动计划（2026—2028年）》的通知","publish_date":"2026-07-23"}],"updated_at":"2026-11-19T07:28:16.000Z"},{"slug":"news-20260921-8835d607","title":"推进系统性保护，让非遗更好融入现代生活","type":"news","type_label":"动态","issuer":"文化和旅游部","doc_no":"","publish_date":"2026-09-21","effective_date":"","status":"动态","level":"国家级","region":"全国","source_name":"文化和旅游部","source_url":"https://www.mct.gov.cn/whzx/whyw/202609/t20260921_967209.htm","summary":"《规划》明确了六个方面重点任务。一是巩固保护基础，完善非遗项目保护体系；二是增强传承能力，优化非遗传承人才培育体系；三是服务国家重大战略，融入文化遗产大保护格局；四是激活发展潜力，搭建非遗融入现代生活新场景；五是深化科技赋能，提升数智化保护水平；六是增强传播效能，提高非遗传播力影响力。同时，对非遗普查与数据库建设、非遗传承梯队建设、非遗服务国家重大战略、非遗生活化保护、非遗资源数智管理与应用、非遗传播能力提升等专项工作进行了安排。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>《规划》明确了六个方面重点任务。一是巩固保护基础，完善非遗项目保护体系；二是增强传承能力，优化非遗传承人才培育体系；三是服务国家重大战略，融入文化遗产大保护格局；四是激活发展潜力，搭建非遗融入现代生活新场景；五是深化科技赋能，提升数智化保护水平；六是增强传播效能，提高非遗传播力 6-11-16T09:21:19.556Z"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","type":"policy","type_label":"政策","issuer":"北京市规划和自然资源委员会","doc_no":"京规自发〔2026〕335号","publish_date":"2026-09-20","effective_date":"2026-09-20","status":"现行有效","level":"地方级","region":"北京","source_name":"北京市规划和自然资源委员会（标准管理·建筑设计）","source_url":"https://ghzrzyw.beijing.gov.cn/biaozhunguanli/bz/jzsj/202610/t20261027_4920594.html","summary":"北京市规划和自然资源委员会印发《北京市既有建筑改造体检评估指南（试行）》（京规自发〔2026〕335号，2026年9月20日），自发布之日起实施，试行期3年，用于支撑《北京市城市更新条例》框架下既有建筑改造项目的体检评估与实施方案联合审查。2026年10月27日由北京市规划和自然资源委员会官网“标准管理—建筑设计”栏目公开发布指南全文PDF。","themes":["城市更新","城市体检","历史建筑","保护更新"],"featured":1,"attachments":[{"name":"北京市规划和自然资源委员会《北京市既有建筑改造体检评估指南（试行）》.pdf","url":"https://ghzrzyw.beijing.gov.cn/biaozhunguanli/bz/jzsj/202610/P020261029595012078458.pdf"}],"bodyHtml":"\u003cp>（试行）GuidelineforInspectionandAssessmentofExistingBuildingRenovationinBeijing2026年9月\u003c/p>\n\u003cp>北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知京规自发〔2026〕335号各有关单位：为深入贯彻《北京市城市更新条例》，进一步支撑城市更新项目前期谋划和实施方案联合审查，科学开展既有建筑改造体检评估工作，北京市规划和自然资源委员会研究制定了《北京市既有建筑改造体检评估指南（试行）》（以下简称《指南》）。\u003c/p>\n\u003cp>本《指南》自发布之日起实施，试用期3年，请设计单位、建设单位及管理部门参照执行。特此通知。北京市规划和自然资源委员会2026年9月20日北京市规划和自然资源委员会办公室2026年9月21日印发\u003c/p>\n\u003cp>1前言为深入实施北京城市总体规划、贯彻《北京市城市更新条例》，进一步加强城市更新项目管理与谋划，科学开展既有建筑改造体检评估工作，支撑城市更新实施方案联合审查，编制组经深入调查研究，认真总结实践经验，吸取科研成果，并在广泛征求意见的基础上，完成了指南的编制工作。本指南的主要技术内容是：1.总则；2.术语；3.基本规定；4.体检评估流程；5.体检评估要素；6.体检评估报告；7.附录。\u003c/p>\n\u003cp>本指南由北京市规划和自然资源委员会归口管理，北京市规划和自然资源标准化中心负责日常管理，北京市建筑设计研究院股份有限公司（地址：北京市西城区南礼士路62号，邮编：100045，电话：88045892，邮箱：liaihua@biad.com.cn）负责具体技术内容解释工作。本指南执行过程中如有意见和建议，请寄送至北京市规划和自然资源标准化中心（电话：55524517，邮箱：bjbb@ghzrzyw.beijing.gov.cn），以供今后修订时参考。\u003c/p>\n\u003cp>本指南主编单位：北京市建筑设计研究院股份有限公司北京市建设工程质量第二检测所有限公司本指南主要起草人：韩慧卿、徐全胜、李艾桦、陈莹、周孙基、陈盛、白永莉、顾靖琨、吴威、王娜、张冰雪、信子怡本指南主要审查人员：汪恒、薛明、祁斌、齐放、张鹏、徐辉、王玉玺\u003c/p>\n\u003cp>3目次1总则...................................................................................................................................
