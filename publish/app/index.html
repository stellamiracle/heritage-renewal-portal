<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遗产保护与城市更新 · 专题资料库（单文件离线版）</title>
<style>/* 遗产保护与城市更新专题资料库 - 档案馆式配色 */
:root {
  --bg: #f6f3ec;
  --paper: #fffdf8;
  --ink: #23201c;
  --muted: #6f6a61;
  --line: #ddd6c8;
  --accent: #8a3324;
  --accent2: #2f5d50;
  --radius: 4px;
  --shadow: 0 1px 2px rgba(35, 32, 28, .06);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif;
  font-size: 15px;
  line-height: 1.75;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { line-height: 1.35; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--muted); }

/* 头部 */
.site-header {
  background: var(--paper);
  border-bottom: 2px solid var(--ink);
  position: sticky;
  top: 0;
  z-index: 20;
}
.site-header .wrap {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-top: 12px;
  padding-bottom: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  background: var(--accent);
  color: #fff;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 20px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text b { font-size: 17px; letter-spacing: .5px; }
.brand-text i {
  font-style: normal;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .6px;
}
.nav { margin-left: auto; display: flex; gap: 4px; }
.nav a {
  padding: 7px 14px;
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 14px;
}
.nav a:hover { background: var(--bg); text-decoration: none; }
.nav a.active { background: var(--ink); color: #fff; }
.admin-link {
  font-size: 13px;
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--muted);
}
.admin-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

/* 首页 */
.hero {
  padding: 54px 0 34px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 30px;
}
.hero h1 {
  font-size: 40px;
  margin: 0 0 14px;
  letter-spacing: 2px;
  font-family: 'Songti SC', 'SimSun', serif;
}
.hero h1 span { color: var(--accent); }
.lede { max-width: 760px; color: var(--muted); margin: 0 0 22px; }
.searchbar { display: flex; gap: 8px; max-width: 640px; }
.searchbar input {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  font-size: 15px;
}
.searchbar input:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }
.btn {
  padding: 10px 18px;
  border: 1px solid var(--ink);
  border-radius: var(--radius);
  background: var(--ink);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
}
.btn:hover { opacity: .88; text-decoration: none; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ink); opacity: 1; }
.btn-danger { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.hero-stats { color: var(--muted); font-size: 14px; margin-top: 16px; }
.hero-stats b { color: var(--accent); font-size: 17px; }
.cats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 36px;
}
.cat-card {
  display: block;
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink);
  border-radius: var(--radius);
  padding: 18px;
  color: var(--ink);
  box-shadow: var(--shadow);
}
.cat-card:hover { border-left-color: var(--accent); text-decoration: none; }
.cat-num { display: block; font-size: 26px; color: var(--accent); font-weight: 700; }
.cat-name { display: block; font-size: 17px; margin-top: 2px; }
.cat-desc { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
.cat-regulation { border-left-color: var(--accent); }
.cat-policy { border-left-color: var(--accent2); }
.cat-case { border-left-color: #8a6d1f; }
.cat-news { border-left-color: #5a5a8a; }

/* 通用块 */
.section-title {
  font-size: 20px;
  border-left: 4px solid var(--accent);
  padding-left: 10px;
  margin: 30px 0 16px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.card h3 { margin: 10px 0 6px; font-size: 16px; line-height: 1.5; }
.card h3 a { color: var(--ink); }
.card h3 a:hover { color: var(--accent); }
.card-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.summary { font-size: 14px; color: #4a453e; margin: 0; }
.chips { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-size: 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 2px 10px;
  color: var(--muted);
}
.tag {
  display: inline-block;
  font-size: 12px;
  padding: 1px 8px;
  border-radius: 2px;
  background: #ece7dc;
  color: var(--ink);
}
.tag-regulation { background: #f3e2de; color: var(--accent); }
.tag-policy { background: #dfeae6; color: var(--accent2); }
.tag-case { background: #f2ecd7; color: #8a6d1f; }
.tag-news { background: #e4e4ef; color: #5a5a8a; }
.tag-featured { background: var(--accent); color: #fff; }
.more-wrap { margin: 22px 0 40px; }

/* 检索页 */
.result-head { margin: 30px 0 14px; }
.result-head h1 { font-size: 26px; margin: 0 0 4px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tab {
  padding: 6px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
}
.tab:hover { text-decoration: none; border-color: var(--ink); }
.tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 18px;
}
.filters input, .filters select {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  font-size: 13px;
  font-family: inherit;
  color: var(--ink);
}
.filters .f-q { min-width: 200px; flex: 1; }
.grid-list { grid-template-columns: 1fr; }
.empty { color: var(--muted); padding: 30px 0; }
.pager { display: flex; gap: 6px; justify-content: center; margin: 26px 0 40px; flex-wrap: wrap; }
.page {
  padding: 6px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
}
.page:hover { text-decoration: none; border-color: var(--ink); }
.page.current { background: var(--ink); color: #fff; border-color: var(--ink); }
.page.disabled { color: #b8b2a6; pointer-events: none; }

/* 详情页 */
.detail {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px 32px;
  margin: 26px 0 20px;
  box-shadow: var(--shadow);
}
.detail-top { display: flex; gap: 8px; margin-bottom: 10px; }
.detail h1 { font-size: 28px; margin: 0 0 18px; }
.kvs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 6px 20px;
  margin: 0 0 18px;
  padding: 14px 16px;
  background: var(--bg);
  border-radius: var(--radius);
  font-size: 14px;
}
.kv { display: flex; gap: 10px; }
.kv dt { color: var(--muted); min-width: 72px; }
.kv dd { margin: 0; word-break: break-all; }
.lead { font-size: 16px; border-left: 3px solid var(--accent2); padding-left: 12px; color: #3c3830; }
.prose { margin-top: 22px; font-size: 15px; }
.prose h2 { font-size: 19px; margin: 26px 0 10px; border-left: 4px solid var(--accent); padding-left: 9px; }
.prose h3 { font-size: 16px; margin: 20px 0 8px; }
.prose ul, .prose ol { padding-left: 24px; }
.prose li { margin: 5px 0; }
.prose blockquote {
  margin: 16px 0;
  padding: 10px 16px;
  border-left: 3px solid var(--line);
  background: var(--bg);
  color: var(--muted);
}
.prose code { background: var(--bg); padding: 1px 6px; border-radius: 3px; font-size: 13px; }
.prose pre {
  background: #26221e;
  color: #f2ece2;
  padding: 14px 16px;
  border-radius: var(--radius);
  overflow-x: auto;
}
.prose pre code { background: none; color: inherit; padding: 0; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14px; }
.prose th, .prose td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
.prose th { background: var(--bg); }
.source { margin-top: 26px; font-size: 13px; color: var(--muted); word-break: break-all; }
.files { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; }
.files ul { padding-left: 20px; }
.related {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 40px;
}
.related h2 { font-size: 17px; margin: 0 0 10px; }
.related ul { list-style: none; margin: 0; padding: 0; }
.related li { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.related li span { color: var(--muted); font-size: 12px; margin-left: 8px; }

/* 关于页 */
main h1 { font-size: 28px; margin: 30px 0 18px; }

/* 后台 */
.admin { display: flex; gap: 22px; align-items: flex-start; margin: 24px 0 40px; }
.admin-nav {
  width: 168px;
  flex: none;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px;
}
.admin-nav a {
  display: block;
  padding: 8px 12px;
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 14px;
}
.admin-nav a:hover { background: var(--bg); text-decoration: none; }
.admin-nav a.active { background: var(--ink); color: #fff; }
.logout { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.admin-main { flex: 1; min-width: 0; }
.admin-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.admin-head h1 { font-size: 22px; margin: 0; }
.admin-actions { margin-left: auto; display: flex; gap: 8px; }
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.tile {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  color: var(--ink);
}
.tile:hover { text-decoration: none; border-color: var(--accent); }
.tile b { display: block; font-size: 26px; color: var(--accent); }
.tile span { font-size: 13px; color: var(--muted); }
.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 18px;
}
.panel h2 { font-size: 16px; margin: 0 0 10px; }
.plain-list { list-style: none; margin: 0; padding: 0; }
.plain-list li { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.plain-list li span { color: var(--muted); font-size: 12px; margin-left: 8px; }
.table { width: 100%; border-collapse: collapse; background: var(--paper); font-size: 13px; }
.table th, .table td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.table th { background: var(--bg); font-weight: 600; }
.table tr:nth-child(even) td { background: #fbf9f4; }
.ops { white-space: nowrap; }
.ops a { margin-right: 8px; }
.inline { display: inline-block; margin: 0 4px 0 0; }
.form { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.fld { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
.fld input, .fld select, .fld textarea {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
}
.fld textarea { resize: vertical; line-height: 1.7; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid var(--accent2); outline-offset: 1px; }
.check { display: flex; align-items: center; gap: 8px; margin: 16px 0 6px; font-size: 14px; }
.form-ops { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
.panel-form { margin-top: 18px; }
.panel-form input[type=file] { margin: 8px 0; }
.err { background: #f6e3df; color: var(--accent); padding: 10px 14px; border-radius: var(--radius); }

/* 登录 */
.login {
  max-width: 380px;
  margin: 70px auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 30px 32px;
}
.login h1 { font-size: 20px; margin: 0 0 18px; }
.login label { display: block; font-size: 13px; color: var(--muted); }
.login input {
  width: 100%;
  padding: 10px;
  margin: 6px 0 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-size: 15px;
}

/* 页脚 */
.site-footer {
  border-top: 1px solid var(--line);
  background: var(--paper);
  margin-top: 40px;
  padding: 22px 0 30px;
}
.site-footer p { margin: 3px 0; font-size: 13px; color: var(--muted); }

@media (max-width: 760px) {
  .site-header .wrap { flex-wrap: wrap; gap: 10px; }
  .nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; }
  .admin-link { margin-left: auto; }
  .hero { padding: 34px 0 24px; }
  .hero h1 { font-size: 28px; }
  .searchbar { flex-direction: column; }
  .admin { flex-direction: column; }
  .admin-nav { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
  .admin-nav a { padding: 6px 10px; }
  .logout { border: 0; margin: 0; padding: 0; width: 100%; }
  .detail { padding: 20px 18px; }
  .detail h1 { font-size: 22px; }
  .table { font-size: 12px; }
  .table th, .table td { padding: 6px; }
}</style>
</head>
<body>
<div id="site-head"></div>

<script>window.__PORTAL_DATA__ = {"entries":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第850号","publish_date":"2026-11-09","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202611/content_7085592.htm","summary":"知识应当遵循中医药发展规律，坚持传承精华、守正创新，坚持保护优先、保护和利用相结合。 开展中医药传统知识保护活动，应当遵守法律、行政法规，不得损害国家利益、社会公共利益和他人合法权益。 第四条　国务院中","themes":["传统知识","文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第850号 《中医药传统知识保护条例》已经2026年9月18日国务院第97次常务会议通过，现予公布，自2027年1月1日起施行。 总理  李强 2026年10月23日 中医药传统知识保护条例 第一条 为了保护中医药传统知识，促进中医药传统知识的传承和发展，弘扬中医药文化，根据《中华人民共和国中医药法》，制定本条例。 第二条 本条例所称中医药传统知识，是指基于中华民族长期实践积累、世代传承发展形成的中医药理论、技术方法及其相关表现形式，包括： （一）中医药预防、保健、诊断、治疗、康复的传统理论、技术方法； （二）中医药经典名方、验方； （三）中药材品种选育、种植养殖、采集、鉴别的传统技术，中药饮片炮制、中药制剂配制的传统技术和工艺； （四）中医药古籍文献，中医药特有的传统标记、符号； （五）其他中医药传统知识。 第三条 保护中医药传统知识应当遵循中医药发展规律，坚持传承精华、守正创新，坚持保护优先、保护和利用相结合。 开展中医药传统知识保护活动，应当遵守法律、行政法规，不得损害国家利益、社会公共利益和他人合法权益。 第四条 国务院中医药主管部门负责全国的中医药传统知识保护工作。 县级以上地方人民政府中医药主管部门负责本行政区域内的中医药传统知识保护工作。 县级以上人民政府其他有关部门在各自职责范围内负责与中医药传统知识保护有关的工作。 第五条 国务院中医药主管部门与国务院其他有关部门建立中医药传统知识相关信息共享机制，加强工作协调。 第六条 省级以上人民政府中医药主管部门将中医药传统知识保护纳入相关规划，加强中医药传统知识传承传播、推广应用和科学技术研究，并提供必要的支持。 县级以上人民政府中医药主管部门鼓励和引导社会力量通过捐赠、志愿服务等方式参与中医药传统知识保护工作。 第七条 国家鼓励和支持新闻媒体、公共文化机构等根据各自业务范围开展中医药传统知识宣传、展示、体验等活动。 开展中医药传统知识宣传、展示、体验等活动，应当遵守国家有关规定，不得作虚假、夸大宣传，不得牟取不正当利益。 第八条 国家支持中医药传统知识对外交流与合作，促进中医药传统知识的国际传播和应用。 涉及中医药传统知识的外商投资、对外投资、技术出口的管理，依照《中华人民共和国外商投资法》、《中华人民共和国对外贸易法》、《国务院关于对外投资的规定》、《中华人民共和国技术进出口管理条例》等法律、行政法规和国家有关规定执行。 第九条 国务院中医药主管部门会同国务院其他有关部门加强中医药传统知识人才培养。 对在中医药传统知识保护工作中做出突出贡献的组织、个人，按照国家有关规定给予奖励。 第十条 中医药传统知识保护工作涉及国家秘密、工作秘密、商业秘密、个人隐私和个人信息的，应当遵守有关法律、行政法规的规定。 第十一条 国务院中医药主管部门加强对中医药古籍文献整理、遴选和中医药传统知识调查的统筹协调。 第十二条 国务院中医药主管部门建立中医药传统知识保护数据库，对纳入保护数据库的中医药传统知识实行分类管理。保护数据库管理的具体办法由国务院中医药主管部门制定。 第十三条 国务院中医药主管部门组织专业机构对中医药古籍文献进行整理、遴选，遴选出的中医药古籍文献和古籍文献记载的中医药传统知识经国务院中医药主管部门认定后纳入保护数据库。 第十四条 省级人民政府中医药主管部门负责组织开展本行政区域内的中医药传统知识调查，调查发现的中医药传统知识经国务院中医药主管部门认定后纳入保护数据库。 开展中医药传统知识调查可以吸纳医疗机构、高等学校、科研机构、企业、学会、行业协会商会等参与。 境外组织、个人不得在我国境内开展中医药传统知识调查。 中医药传统知识调查的具体办法由国务院中医药主管部门制定。 第十五条 开展中医药传统知识调查，应当征得调查对象的同意，尊重其风俗习惯，不得损害其合法权益；调查中取得的实物、资料应当妥善保存，防止损毁、流失。 对通过调查或者其他途径发现的濒临消失的中医药传统知识，省级人民政府中医药主管部门应当立即予以记录，并收集有关实物、资料或者采取其他抢救性保护措施。 第十六条 国家鼓励组织、个人向所在地省级人民政府中医药主管部门申报其持有的中医药传统知识，申报的中医药传统知识经省级人民政府中医药主管部门初核、国务院中医药主管部门认定后纳入保护数据库。 第十七条 国务院中医药主管部门公布纳入保护数据库的中医药传统知识相关信息。 国务院中医药主管部门会同国务院文化和旅游等部门采用数字化技术收录中医药传统知识，以利于保存使用，方便公众查阅。 第十八条 中医药传统知识持有人对其持有的中医药传统知识享有传承使用的权利，对他人获取、利用其持有的中医药传统知识享有知情同意和利益分享等权利。 国家支持合理利用中医药古籍记载的传统理论、技术方法和经典名方等处于公共领域且可以公开获取的中医药传统知识，并由国务院中医药主管部门履行持有人职责。具体办法由国务院中医药主管部门制定。 第十九条 国务院中医药主管部门建立中医药传统知识保护名录，将保护数据库中具有代表性、独特性和重要保护价值的中医药传统知识列入保护名录。保护名录管理的具体办法由国务院中医药主管部门制定。 第二十条 国务院中医药主管部门成立保护名录评审专家组，从保护数据库中遴选拟列入保护名录的中医药传统知识。国务院中医药主管部门对遴选出的中医药传统知识予以公示，并根据公示结果发布保护名录。 省级人民政府中医药主管部门可以向国务院中医药主管部门推荐拟列入保护名录的中医药传统知识。 列入保护名录的中医药传统知识不再符合条件的，由国务院中医药主管部门组织评审专家组认定后予以移除，并及时向社会公布。 第二十一条 县级以上地方人民政府可以根据实际情况为列入保护名录的中医药传统知识传承传播提供必要的支持。 第二十二条 国务院文化和旅游部门会同国务院文物、中医药等主管部门加强对列入保护名录的中医药古籍的保护、修复、合理利用、传承工作。 第二十三条 县级以上人民政府中医药主管部门根据中医药传统知识保护需要，依托高水平医疗机构，通过下列方式促进列入保护名录的中医药传统知识推广应用： （一）收集、整理有关实物、资料； （二）开展临床应用； （三）开展应用研究，提升临床应用的标准化、规范化水平； （四）开展师承教育、培训，培养后继人才； （五）举办技术方法演示、学术研讨交流等活动。 第二十四条 国务院中医药主管部门会同国务院工业和信息化、药品监督管理等部门依托中药饮片生产企业、医疗机构等，对列入保护名录的中药饮片炮制传统技术和工艺进行研究和推广应用，支持应用中药饮片炮制传统技术和工艺提升中药饮片质量水平。 第二十五条 国务院中医药主管部门会同国务院农业农村、药品监督管理等部门对列入保护名录的中药材品种选育、种植养殖、采集、鉴别传统技术进行推广应用。 第二十六条 国家鼓励和支持运用传统中医药研究方法和现代科学技术对中医药传统知识开展研究，鼓励医疗机构、高等学校、科研机构、企业、学会、行业协会商会等合作开展研究，加强基础理论、作用机理、临床应用等研究，促进中医药理论、技术方法的传承和创新。 第二十七条 省级以上人民政府中医药主管部门根据中医药传统知识保护需要，组织高等学校、科研机构等采取下列方式对列入保护名录的中医药传统知识开展科学技术研究： （一）收集、整理有关实物、资料； （二）开展理论、技术方法溯源和关键信息考证； （三）进行开发利用、成果转化。 第二十八条 县级以上人民政府中医药主管部门和其他有关部门未依照本条例规定履行中医药传统知识保护职责的，由本级人民政府或者上一级人民政府有关部门责令限期改正；情节严重的，对负有责任的领导人员和直接责任人员依法给予处分。 第二十九条 违反本条例第十四条第三款规定开展中医药传统知识调查的，由县级以上人民政府中医药主管部门责令停止违法行为，给予警告，没收违法所得和调查中取得的实物、资料，可以并处5万元以上50万元以下的罚款。 第三十条 违反本条例规定，给中医药传统知识持有人等造成损害的，依法承担民事责任；构成犯罪的，依法追究刑事责任。 第三十一条 中医药传统知识属于文物、非物质文化遗产项目的，还应当依照《中华人民共和国文物保护法》、《中华人民共和国非物质文化遗产法》的有关规定进行保护。 第三十二条 本条例自2027年1月1日起施行。\u003c/p>","related":[{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"},{"slug":"regulation-20251011-430d7532","title":"密云水库水源保护条例","publish_date":"2025-10-11"}],"updated_at":"2026-11-16T09:21:19.511Z"},{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","type":"policy","type_label":"政策","issuer":"住房城乡建设部","doc_no":"建科〔2026〕60号","publish_date":"2026-10-20","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202610/content_7083855.htm","summary":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知 建科〔2026〕60号 各省、自治区住房城乡建设厅，直辖市规划和自然资源委（局）、住房城乡建设（管）委，","themes":["文化遗产","历史文化名城","历史建筑"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>标 题： 住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知 发文机关： 住房城乡建设部 建科〔2026〕60号 来 源： 住房城乡建设部网站 主题分类： 城乡建设、环境保护\\城乡建设（含住房） 公文种类： 通知 2026年10月15日 标 题： 住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知 发文机关：住房城乡建设部 来 源：住房城乡建设部网站 主题分类：城乡建设、环境保护\\城乡建设（含住房） 公文种类：通知\u003c/p>","related":[{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"},{"slug":"policy-20260528-cbdca719","title":"国务院关于印发《城市更新“十五五”规划》的通知","publish_date":"2026-05-28"}],"updated_at":"2026-11-16T09:21:19.535Z"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","type":"policy","type_label":"政策","issuer":"文化和旅游部","doc_no":"文旅非遗发〔2026〕64号","publish_date":"2026-09-21","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202609/content_7081712.htm","summary":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知 文旅非遗发〔2026〕64号 各省、自治区、直辖市文化和旅游厅（局），新疆生产建设兵团文化体育广电和旅游局，本部各司局、各直属单位，...","themes":["非物质文化遗产","文化遗产"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>标 题： 文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知 发文机关： 文化和旅游部 文旅非遗发〔2026〕64号 来 源： 文化和旅游部网站 主题分类： 文化、广电、新闻出版\\文化 公文种类： 通知 2026年09月20日 标 题： 文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知 发文机关：文化和旅游部 来 源：文化和旅游部网站 主题分类：文化、广电、新闻出版\\文化 公文种类：通知\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"},{"slug":"policy-20260528-cbdca719","title":"国务院关于印发《城市更新“十五五”规划》的通知","publish_date":"2026-05-28"}],"updated_at":"2026-11-16T09:21:19.556Z"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2026〕80号","publish_date":"2026-07-24","effective_date":"","status":"现行有效","level":"国家级","region":"潍坊","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202607/content_7076509.htm","summary":"发掘文化遗产内涵与价值，系统开展文物资源调查和史料研究，厘清潍县古城的空间格局和发展脉络，明确保护的原则和重点，强化文化遗产保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好潍坊市历史文化","themes":["历史文化名城"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于同意将山东省潍坊市 列为国家历史文化名城的批复 国函〔2026〕80号 山东省人民政府： 你省关于申报潍坊市为国家历史文化名城的请示收悉。现批复如下： 一、同意将潍坊市列为国家历史文化名城。潍坊市历史悠久、文化厚重，文化遗产资源丰富，传统格局和历史风貌保存较好，地域特色鲜明，具有重要的历史文化价值。 二、你省及潍坊市人民政府要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，按照党中央、国务院决策部署，牢固树立保护历史文化遗产责任重大的观念，落实《中华人民共和国文物保护法》、《历史文化名城名镇名村保护条例》要求，深入研究发掘文化遗产内涵与价值，系统开展文物资源调查和史料研究，厘清潍县古城的空间格局和发展脉络，明确保护的原则和重点，强化文化遗产保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好潍坊市历史文化名城保护规划和各级文物保护单位保护规划，制定并严格实施保护管理规定，明确各类保护对象的清单以及保护内容、要求和责任。正确处理城市建设与文化遗产保护的关系，摸清文物资源家底，加强文物保护，完善“先调查、后建设”、“先考古、后出让”制度，重视城市格局保护和风貌管控，加强整体性保护、系统性保护；保护修复历史文化街区，补足配套基础设施和公共服务设施短板，不断提升人居环境品质；加强不可移动文物和历史建筑修缮保护，推动文物活化利用，充分发挥不可移动文物和历史建筑的使用价值。不得改变与名城相互依存的自然景观和环境，不得进行任何与名城环境和风貌不相协调的建设活动，不得损坏或者擅自迁移、拆除不可移动文物和历史建筑，相关建设项目要依法履行报批程序。进一步强化责任落实，对不履职尽责、保护不力，造成名城历史文化价值受到严重影响的行为，依法依规开展监督问责。 三、你省与住房城乡建设部、国家文物局要加强对潍坊市国家历史文化名城保护工作的指导、监督和检查。 国务院 2026年7月21日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"},{"slug":"policy-20260528-cbdca719","title":"国务院关于印发《城市更新“十五五”规划》的通知","publish_date":"2026-05-28"}],"updated_at":"2026-11-16T09:21:19.568Z"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","type":"policy","type_label":"政策","issuer":"国家林草局 国家发展改革委 财政部 自然资源部","doc_no":"林规发〔2026〕23号","publish_date":"2026-07-22","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202607/content_7076248.htm","summary":"国家林业和草原局 国家发展和改革委员会 财政部 自然资源部关于印发《林业草原保护利用“十五五”规划》的通知 林规发〔2026〕23号 各省、自治区、直辖市林草主管部门、发展改革委、财政厅（局）、自然资...","themes":["生态保护","文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国家林业和草原局 国家发展和改革委员会 财政部 自然资源部关于印发《林业草原保护利用“十五五”规划》的通知 林规发〔2026〕23号 各省、自治区、直辖市林草主管部门、发展改革委、财政厅（局）、自然资源主管部门，新疆生产建设兵团林草局、发展改革委、财政局、自然资源局： 现将《林业草原保护利用“十五五”规划》印发给你们，请结合实际认真贯彻落实。 特此通知。 国家林业和草原局 国家发展和改革委员会 财政部 自然资源部 2026年6月29日 （本文有删减） 林业草原保护利用“十五五”规划 林草兴则生态兴，生态兴则文明兴。森林和草原对国家生态安全具有基础性、战略性作用。为推进林草高水平保护和高质量发展，依据《中华人民共和国国民经济和社会发展第十五个五年规划纲要》，制定本规划。 一、总体要求 以习近平新时代中国特色社会主义思想为指导，深入践行习近平生态文明思想，全面贯彻党的二十大和二十届历次全会精神，牢固树立和践行绿水青山就是金山银山理念，坚持山水林田湖草沙一体化保护和系统治理，坚持“三绿”并举、“四库”联动、提质兴业利民，坚持种与管共抓、生态与产业共促、人与自然共生，统筹林草资源、国土空间、生态系统，统筹科学保护、系统治理、合理利用，融合林草资源管理与国土空间治理，着力推进生态系统优化、筑牢生态安全屏障，着力壮大林草产业、拓展“两山”转化路径，建设生态林业、富民林业、人文林业，为建设美丽中国、实现人与自然和谐共生的中国式现代化作出新贡献。 到2030年，“三北”工程三大标志性战役取得决定性胜利，完成自然保护地整合优化，森林、草原、湿地、荒漠生态系统质量和服务功能不断增强，林草多元供给和消费场景更加丰富，林草产业总产值迈上新台阶。 ——通过林草资源和国土空间科学保护，筑牢国家生态安全屏障。强化科学理念，落实生态保护红线制度，优化国土空间格局，实行差别化、精细化管理，促进森林草原湿地休养生息，严守林草资源安全底线，以林草高水平保护支撑高质量发展。 ——通过林草资源和国土空间系统治理，提升生态系统多样性稳定性持续性。坚持系统观念，统筹山水林田湖草沙各生态系统，协同国土空间治理，自然恢复为主，综合施策，强化跨区域协同，提升生态系统适应气候变化能力，增强生态系统韧性。 ——通过林草资源和国土空间合理利用，推动绿水青山转化金山银山。遵循自然规律、经济规律、社会规律，以生态价值溢出为导向，节约集约，推进林草资源空间立体开发、分层经营、复合利用，拓展生态产品价值实现渠道，实现青山常在，永续利用。 ——通过改革创新，提升治理效能。以满足人民日益增长的优美生态环境和优质生态产品需要为根本目的，深化林草重点领域改革，突破瓶颈堵点，激发发展活力，强化科技赋能，提高数字化智能化应用，提升治理能力水平。 展望2035年，国土绿化质量效益全面提升，基本建成以国家公园为主体的自然保护地体系，生态系统多样性稳定性持续性显著提升，林草优质产品供给能力大幅提高，现代化林草产业体系更加完备，林草对经济社会高质量发展的贡献明显增强。 落实主体功能区战略，立足生态本底、林草资源禀赋和自然演替规律，坚持北方扩绿、南方提质为主的国土绿化总体格局，因地制宜、分区施策。三北工程区，聚焦荒漠化综合防治，打好“三北”工程攻坚战，促进黄河重点生态区、北方防沙带、东北森林带生态保护修复，因地制宜发展林草产业。青藏高原生态屏障区，聚焦自然保护地建设，全面加强自然生态系统保护修复。长江重点生态区和南方丘陵山地带，聚焦森林空间复合利用，加强生物多样性保护，精准提升森林质量，开展石漠化综合治理，壮大林草产业。海岸带，聚焦沿海防灾减灾带建设，保护滨海湿地，建设沿海防护林带。 二、科学开展大规模国土绿化行动 （一）推进重要生态系统保护修复。加快实施重要生态系统保护和修复重大工程，在青藏高原等“三区四带”生态屏障区，实施山水林田湖草沙一体化保护和系统治理，因地制宜，综合采取保护和修复、自然和人工、生物和工程等措施，统筹利用绿化空间，以地定绿、以水定绿、适地适种，宜林则林、宜草则草、宜荒则荒，开展营造林、退化草原修复、湿地保护恢复、荒漠化石漠化和水土流失综合治理。 （二）打好“三北”工程攻坚战。以黄河“几字弯”攻坚战、科尔沁和浑善达克沙地歼灭战、河西走廊—塔克拉玛干沙漠边缘阻击战为重点，持续开展沙化土地综合治理，合理配置林草植被类型和密度，强化区域联防联治。扎实有序推进荒漠化防治与风电光伏一体化建设。推广改草治沙、以路治沙、科技治沙、以工代赈。强化建设项目水资源论证，推动项目实施与水资源承载能力相协调。创新工程建设管理机制，建立生态建设成果长效管护机制。建立健全荒漠化防治动态监测与评估体系。 （三）提升森林草原质量。强化主导功能，分类经营，分区施策，注重提升森林多功能综合效益。科学优化天然林公益林范围，严格保护，自然恢复，促进森林正向演替；加强生态脆弱区系统治理，人工促进森林更新提质；强化规模化集约化经营，合理利用资源，提高林地生产力。持续巩固退耕还林还草建设成果。实施森林生态系统固碳增汇能力提升行动，推动森林碳汇项目参与全国温室气体自愿减排交易市场。开展草原改良和退化草原治理，加强禁牧轮牧，协同推进解决超载过牧问题。挖掘林草文化价值，传承林草优秀传统文化，建设人文林业。 （四）提高城乡绿化和义务植树水平。协同推进部门绿化、乡村绿化，持续开展城乡绿化美化彩化，推动身边增绿。推进绿色通道网络、生态廊道、防护林网等建设。创新义务植树尽责形式，推广“义务植树+”新路径。保护古树名木，开展古树名木资源普查，实施古树名木抢救复壮和重点古树群整体保护。 三、全面推进自然保护地体系建设 （五）高质量建设国家公园。落实《国家公园法》，健全国家公园运行机制，持续深化管理体制改革。强化国土空间规划管控，规范空间秩序，加强自然资源资产管理，提升科研、监测、宣教能力。加强生物多样性保护，系统修复生态廊道和整体生境。建立央地、园地协同协调机制，推进社区协调发展，依法保障原有居民权益，促进改善民生。加强国家公园文化建设，培育国家公园全民意识。按照“成熟一个、设立一个”原则，按程序研究设立新的国家公园。 （六）完善自然保护地体系。实施自然保护地整合优化，落实分级管理和分区管控，全面提升自然保护地保护管理水平。完善自然保护区和自然公园管护巡护、防灾减灾、应急救援、自然教育等设施，科学修复受损自然生态系统和珍稀濒危物种栖息地。加强自然保护地与世界自然遗产、世界地质公园等协同保护。 （七）加强珍稀濒危野生动植物保护。加强生物多样性保护，强化珍稀濒危野生动植物种及其栖息地保护，提高大熊猫等旗舰动物保护研究能力，开展重点物种调查监测、人工繁育、野化放归及原生境回归。打击非法捕猎、贩卖、食用野生动物行为，开展全国保护鸟类活动和打击非法捕猎贩卖鸟类专项行动，深入实施候鸟迁飞通道保护修复中国行动计划。加快建设野生动物致害、人兽冲突及疫源疫病监测预警防控体系。统筹迁地与就地保护，按程序有序设立新的国家植物园。 （八）全面保护湿地。健全《湿地保护法》配套制度，研究制定国家重要湿地管理办法，发布国家重要湿地名录及范围。开展国际重要湿地指定和国际湿地城市认证及管理。加强湿地生态系统保护、治理，持续加强红树林保护修复，巩固互花米草防治成效。 四、培育壮大林草产业 （九）提升林草资源供给能力。推动国家储备林高质量发展，推进工业原料林、珍贵树种和大径级用材林基地建设，提高木材自给率。推进草畜共治，探索现代生态草牧场建设，在水土条件适宜的天然草原，以及沙地、裸地等其他土地，适当采取耕种方式建设多年生人工草地。合理利用林下空间种草。因地制宜发展菌草产业。推动丰产竹林基地建设和“以竹代塑”科技创新，助力木竹结构建筑和木竹建材规模应用。完善产业标准体系，引导木竹加工业绿色低碳数智化转型升级，增加高品质木竹制品市场供应。 （十）振兴林草种业。持续开展林草种质资源普查和收集，建设国家林草种质资源库（圃），培育具有自主知识产权、高产优质、抗逆性强的林草品种。加快建设林木良种基地和草种生产基地，推进保障性苗圃建设，提升林草种苗供给能力。 （十一）做大做强森林粮库。释放林草资源空间潜力，推动油茶、核桃等木本粮油提质增效，优化林果、饮品、调料、香料等特色经济林布局，大力发展林下经济，推广林药、林菌、林菜、林蜂等资源复合经营，增加优质森林食物总产量，助力膳食结构调整，满足人民群众既“吃得饱”又“吃得好”需求。 （十二）培育消费应用新场景。推广生态旅游、自然教育、森林康养、花卉苗木、生态观鸟等林草文旅融合新业态。因地制宜发展新质生产力，推动科技创新与林草产业深度融合，推进产品创新和品牌塑造，培育和开发无人机等新技术新产品林草领域应用场景，拓展低空经济新空间。发挥林草资源优势，助力生物材料、生物医药等未来产业发展。 （十三）推动构建现代经营服务体系。引导培育林草头部企业、产业园区和产业集群，推动链群发展。发挥林事服务中心等专业化社会化服务平台作用，培育林草工匠，培训返乡务工人员，提供林机具租赁维保、生产劳动等林事服务，推动林草要素资源市场化高效配置。强化种苗、林草产品等质量监管，加强质量追溯。 五、协同强化生态安全能力建设 （十四）提高森林草原火灾防控能力。推进网格化管理，深化源头治理，构筑人民防线，完善长效机制，推进标本兼治。建强队伍体系，推进装备能力现代化。聚焦环重要目标、环重要设施、城市面山等重点区域，强化科技赋能，提升技防智防水平。建设大兴安岭林区森林火灾防治示范样板。指导行业加强安全生产监管和宣传教育，提升安全生产和防灾减灾救灾能力。 （十五）防治林草有害生物。开展松材线虫病疫情综合防控，实施美国白蛾、鼠害、迁飞性蝗虫、重要经济林果病虫等重大林草有害生物预防和治理，强化新发突发重大林草植物疫情应急处置，提升重大林草生物灾害监测预警、检疫御灾和应急救灾能力。加强生物安全管理，预防外来物种侵害。 （十六）加快补齐基础设施短板。以多重功能为导向，加强林区牧区道路、供水、供电、通信等基础设施建设，提高对生态保护修复、产业发展、乡村全面振兴的支撑作用，实现便民利民富民。引导推动林区产业技术创新基础设施发展。鼓励有条件的地区建设基础配套的“林业标准地”，强化技术服务，吸引社会资本“进山入林”。 六、持续深化重点领域改革 （十七）深入推进集体林权制度改革。坚持机制活、产业优、百姓富、生态美，推动森林经营更加科学高效、支持保护制度更加完善、林权价值增值途径更加多样。依法依规开展集体林地延包试点，加快放活经营权。创新利益联结机制，推广“农户+村集体（国有林场）+国有企业+金融机构+社会资本”等合作共富模式，进一步发展林业适度规模经营。推进先行先试，建设深化集体林改先行区。 （十八）加快建设现代化国有林场。分类完善国有林场管理体制，探索收入分配激励机制，加快建设资源质量优良、生态功能稳定、产业发展充分、基础设施良好的现代化国有林场。推广“国有林场+”模式，支持国有林场发挥自身技术、人才、管理优势，在生态建设、资源管护、产业发展等方面发挥引领作用。 （十九）深化国有林区和草原保护制度改革。推动完善国有林区管理体制，推进国有林区绿色转型发展。鼓励地方先行先试，依法开展国有林地和林地上森林、林木使用权出租、作价出资等合理利用试点。实施第四轮草原生态保护补奖政策，推进基本草原划定和保护管理。 （二十）完善森林可持续经营制度。融合推进森林可持续经营与国土空间治理，开展森林全周期经营管理。强化区域国土空间规划引领和森林经营方案约束，实施以主导功能为基础，保护、治理、利用相融合的森林可持续经营，推动森林多效益协同。指导国有林场（林区）全面实施森林可持续经营，鼓励“场村”联营。 七、全力推动创新驱动与开放合作 （二十一）增强科技创新能力。加强原始创新和关键核心技术攻关，强化科技成果转化应用，大力推广应用林草机械装备，加强一线技术推广、指导，提高林草科技进步贡献率。推进重点实验室、生态定位站等科技平台建设。支持植物新品种创制，加强知识产权保护。推进林草生态服务价值核算和生态产品认证。优化林草标准与质量监测体系，开展林草特色科普活动。 （二十二）建设数智林草。以新一代信息技术赋能林草行业数字化智能化应用，因地制宜开展“人工智能+林草”行动，统筹布局“天空地网”一体化监测体系，整合纳入林草生态网络感知系统。优化林草调查监测体系，强化森林草原湿地荒漠调查监测与国土变更调查协同，合力建好用好自然资源管理和国土空间规划“一张图”。 （二十三）实行高水平对外开放。积极推动习近平生态文明思想国际传播，助力绿色丝绸之路建设，提升与全球南方及重点国家合作水平。推进新一轮大熊猫保护国际合作。深化国际履约，加强与国际组织合作，支持中国—世行集团全球生态系统与转型中心充分发挥作用，支持国际竹藤组织、亚太森林组织发展，建好中阿、中蒙、中国—中亚、中非林草领域合作中心，推动产业、技术、人才合作。 （二十四）加强人才队伍建设。持续实施林草科技创新人才计划，加大科技人才、实用技术人才和创新团队培养支持力度，健全乡土专家认定、使用和激励机制。加强林草领域产教融合创新平台建设，统筹推进教育科技人才一体发展，着力培养拔尖创新人才。引导支持林草学科专业建设，推进林草教育培训专业化师资队伍、高质量课程教材及线上培训平台建设。推进乡镇林长办与林业工作站协同，稳定优化生态护林员政策。 八、加强组织实施 （二十五）统筹编制林草规划。将按领域编制的造林绿化、草原保护利用、林地保护利用、森林经营等规划，统筹纳入林草保护利用规划，精简专项规划数量，切实为基层减负。林草保护利用规划确定发展方向、目标任务、重大工程等，加强跨行政区域协同，强化林草资源管理与国土空间治理融合，落实用途管制和项目布局。 （二十六）强化政策保障。有效配置规划实施的用地、金融、产业等政策。严格规划管控，落实林地草地湿地用途管制，推动用地用林用草用湿联动审批，统筹重大工程建设与生态保护，强化重大项目资源要素保障。引导各方依法依规参与林草生态保护和产业发展，完善多元化林草投入机制，加强林草资金项目全过程监督管理。健全林草统计指标体系，完善林草统计调查制度。加强规划实施监测和生态保护修复成效评估，强化评估结果应用。 （二十七）加强党的领导。坚持党对林草工作的全面领导，确保党中央国务院决策部署贯彻落实。健全林草法治体系，推进相关法律法规制修订，加大执法力度，严厉打击破坏林草资源违法行为。强化林长制督导考核，建立“林长制+”制度机制，发挥林长制对规划实施的督导作用。讲好林草领域生态文明故事，传承弘扬三北、塞罕坝、右玉精神，选树先进典型，营造良好社会氛围，汇聚起建设美丽中国的磅礴力量。 附件1：“十五五”林业草原保护利用主要指标 附件2：“十五五”林草重大工程\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"},{"slug":"policy-20260528-cbdca719","title":"国务院关于印发《城市更新“十五五”规划》的通知","publish_date":"2026-05-28"}],"updated_at":"2026-11-16T09:21:19.581Z"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","type":"policy","type_label":"政策","issuer":"国务院办公厅","doc_no":"国办函〔2026〕65号","publish_date":"2026-07-14","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202607/content_7075365.htm","summary":"国务院办公厅关于转发生态环境部等部门 《群众身边水体保护治理行动方案》的通知 国办函〔2026〕65号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 生态环境部、国家发展改革委、工业和信息...","themes":["生态保护","水环境"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院办公厅关于转发生态环境部等部门 《群众身边水体保护治理行动方案》的通知 国办函〔2026〕65号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 生态环境部、国家发展改革委、工业和信息化部、住房城乡建设部、水利部、农业农村部《群众身边水体保护治理行动方案》已经国务院同意，现转发给你们，请认真贯彻落实。 国务院办公厅 2026年7月9日 （本文有删减） 群众身边水体保护治理行动方案 生态环境部 国家发展改革委 工业和信息化部 住房城乡建设部 水利部 农业农村部 群众身边水体是指与群众居住区域紧密相邻、生产生活密切相关的江河二级及以下支流和坑塘沟渠等。为加强群众身边水体保护治理，加力解决水污染防治深层次问题，更好推动水生态环境根本好转，制定本行动方案。 一、总体要求 坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，认真落实四中全会部署，全面贯彻习近平生态文明思想，坚持环保为民、问题导向、突出重点、标本兼治，强化综合治理、系统治理、源头治理，将治理重点进一步向县城、乡村延伸，兼顾地表水和地下水，深入打好碧水保卫战，扎实推进美丽水细胞建设。到2030年，基本完成省级及以上工业园区水污染排查整治任务，基本消除县乡黑臭水体，基本控制重点区域畜禽养殖污染对水体的直接影响，群众身边水体基本实现无异色、无异味、无异物，推动水生态环境全面改善。 二、开展水污染突出问题攻坚行动 （一）实施工业园区水污染整治攻坚行动。围绕工业园区环境基础设施建设运维、工业废水收集与排放管控、水环境风险防范等方面问题，全面开展排查整治，加快推进设施建设改造，规范废水收集处理。加强对饮用水水源地、农田等区域周边工业企业和园区废水排放的监管，防范工业废水超标排放、偷排漏排等污染群众身边水体。 （二）实施县乡黑臭水体治理攻坚行动。组织开展县乡黑臭水体调查，建立健全长效机制，制定公布县乡黑臭水体清单，明确治理主体，科学制定治理方案，因地制宜开展控源截污、内源治理、生态修复、活水保质。加快补齐县乡水污染防治设施短板，防止水体返黑返臭。 （三）实施畜禽粪污综合治理攻坚行动。以养殖大县及喀斯特地貌区为重点，聚焦生猪等主要畜种畜禽粪污处理与粪肥还田等方面问题开展排查，加快推进整治，督促畜禽养殖场（户）按规定建设畜禽粪污资源化利用设施设备，确保设施设备处理能力与农作物用肥需求相匹配，满足防雨、防渗、防溢流要求，保障设施设备正常运行、粪污科学利用或达标排放。 （四）实施乡村河湖库管护攻坚行动。以村庄周边河湖库为重点，全面梳理淤塞萎缩、水域岸线侵占、岸坡坍塌、水体污染等问题，将问题较为突出、群众反映强烈的乡村河湖库纳入攻坚行动，逐一建立问题清单、目标清单、措施清单和责任清单，鼓励有条件的地区集中连片推进整治，恢复河湖库基本功能，修复改善水生态环境。 （五）实施小微水体排查整治攻坚行动。全面开展群众房前屋后坑塘沟渠等小微水体排查，实施分级监管、分类治理。对异色、异味、异物等问题突出的，实施源头净化、水体整治、生态修复等措施，畅通水系循环“毛细血管”，建设美丽水细胞，打造一批“小而美”治理样板，为群众提供更多优质普惠的水生态环境产品。 三、加强水污染源头治理 （六）强化工业企业污染防控。持续推动重点涉水行业企业实施清洁生产，从源头减少新污染物排放。开展重点行业企业污水治理与排放水平绩效分级，实施差异化管控，对绩效等级高的企业予以金融、投资、价格等政策支持。加强工业企业和园区雨水排放口监管，严禁通过雨水管网排放工业废水。开展涉重金属矿山、尾矿库、堆（渣）场等环境安全隐患排查整治，逐步削减污染存量。分类有序推进绿色矿山建设，加强动态监管。 （七）加强城镇生活污水收集处理。加快城镇生活污水收集处理设施建设改造，明确污水管网运维单位，加强其专业能力建设，提升污水收集处理综合效能。 （八）推动养殖业清洁生产。充分考虑资源环境承载能力，严格落实环境影响评价制度，鼓励实行分散分布、适度规模养殖。按规定组织确定畜禽散养密集区，结合实际对畜禽粪污进行分户收集、集中处理利用。制定实施畜禽粪肥还田有害物质限量等标准，促进种养结合发展。优化水产养殖空间布局，科学确定养殖规模和密度，鼓励发展不投饵生态养殖。探索加强水产养殖池塘底泥和水产养殖尾水科学利用。 （九）强化入河污染物管控。加强水功能区划定和调整工作，科学划定入河排污口禁设区域，防范结构性、布局性环境风险。将入河排污口排查整治范围向群众身边水体延伸，基本覆盖全流域。完善入河排污口排查整治分级管理台账，实施规范化整治和建设，巩固提升整治质效。加快建设入河排污口分级分类监测监管体系，推动形成突出问题早发现、污染源头早识别、环境风险早预警、违法排污早处置的监管闭环。加强入河排污口智慧感知能力建设。实施总磷、总氮减排工程，探索建立污染物协同治理、小流域区域整体推进的治理模式。 四、提高水污染监督管理效能 （十）优化拓展监测网络。推进水生态环境监测网络向重点入河排污口下游、群众身边水体延伸。结合实际加强农业灌溉水体、以再生水为主要水源的水体、喀斯特地貌区水体监测，保障群众用水安全。鼓励非排污许可重点管理单位开展自动监测。按照规定明确多个单位和个人共用入河排污口的监测责任主体，开展监控、自动监测。加强水质监测与污染源、入河排污口监督监测联动，科学开展污染溯源与监测评估。 （十一）提升督察执法水平。紧盯县城、城乡接合部、乡村等群众身边水体密集区域和喀斯特地貌区，加大现场监督执法力度，规范涉企行政检查管理。加快执法数智化转型，推动相关场所配备监控设备，充分利用环境监测、卫星遥感等数据资源，精准高效识别问题线索，加强非现场监督执法，督促落实污染防治责任。依法依规严厉打击损害群众权益、牟取非法利益造成水体严重污染的违法犯罪行为。推动将群众身边久拖未决的突出水污染问题作为生态环境保护督察重点。 （十二）提高基础支撑能力。制修订一批水环境质量标准、污染物排放标准，加强高盐、高氟工业废水和重金属、新污染物排放管控。加强水华机理研究，密切关注水华高发区域，实施“一河（湖）一策”精准防控。探索创新投融资模式，支持社会资本参与环境基础设施项目，鼓励各类金融机构按照市场化、法治化原则给予融资支持。 各地区各有关部门要高度重视群众身边水体保护治理，树立和践行正确政绩观，强化协同配合，形成工作合力。生态环境部会同有关部门加强统筹协调、指导帮扶和调度会商。中央和各级财政积极支持群众身边水体保护治理。美丽中国先行区率先完成保护治理任务。地方各级人民政府切实履行主体责任，强化重大项目统筹和资金保障，加强水污染防治设施运维管护，确保各项举措落地见效。加强宣传引导，推广优秀案例，正确引导公众参与和社会监督，畅通信访投诉渠道，营造全社会共同参与的良好氛围。重大事项及时按程序请示报告。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260528-cbdca719","title":"国务院关于印发《城市更新“十五五”规划》的通知","publish_date":"2026-05-28"}],"updated_at":"2026-11-16T09:21:19.610Z"},{"slug":"news-20260613-2d11a028","title":"习近平文化思想指引我国文化遗产保护传承工作高质量发展","type":"news","type_label":"动态","issuer":"屏南县人民政府网（时政要闻）","doc_no":"","publish_date":"2026-06-13","effective_date":"","status":"动态","level":"地方级","region":"屏南","source_name":"屏南县人民政府网","source_url":"http://www.pingnan.gov.cn/sylm/szyw/202606/t20260615_2464137.htm","summary":"屏南县人民政府网“时政要闻”栏目刊发《习近平文化思想指引我国文化遗产保护传承工作高质量发展》，以屏南等地方实践为线索介绍文化遗产保护传承的推进路径，可作为传统村落与城市更新类工作的动态跟踪线索。","themes":["文化遗产保护传承","传统村落","工作动态"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>习近平文化思想指引我国文化遗产保护传承工作高质量发展 _ 时政要闻 _ 屏南县人民政府 国务院 省政府 市政府 你好，{{loginInfo.showname|truncate(12)}} | | 网站支持IPv6 政务公开 政府信息公开 领导信息 机构设置 工作动态 政策文件 政策文件库 人事信息 数据发布 重点领域信息公开 解读回应 政策解读 回应关切 办事服务 政务地图 互动交流 在线访谈 网上调查 意见征集 智能问答 走进屏南   0&quot; style=&quot;display: none;&quot;&gt; 长者模式 守护好中华民族的文化瑰宝——习近平文化思想指引我国文化遗产保护传承工作高质量发展 来源:人民日报 发布时间: 2026-06-13 10:27 中华文明源远流长，中华文化博大精深。我国锦绣山河上遍布的文化遗产，承载着中华民族的基因和血脉，蕴藏着中国人民的伟大创造、卓越智慧和共同记忆。 “要把这些中华文化瑰宝保护好、传承好、传播好”“要把传统和现代有机融合在一起”……习近平总书记的重要讲话，为新时代保护传承文化遗产指明了前进方向，提供了根本遵循。 6月13日是2026年“文化和自然遗产日”。新时代新征程，在习近平文化思想指引下，我国文化遗产保护传承工作取得显著成就，全社会共同守护好中华民族的文化瑰宝，文化遗产绽放时代光彩。 传承文脉，始终把保护放在第一位 台上，唱腔柔美细腻，流派纷呈；台下，观众喝彩连连，年轻人跨城追剧……刚刚落幕的第六届中国越剧艺术节热闹非凡。今年是越剧诞生120周年，一代代传承人以坚守与匠心，赓续中华戏曲的风华。 习近平总书记强调，“秉持敬畏历史、热爱文化之心，坚持保护第一、合理利用和最小干预原则，推动文化遗产系统性保护和统一监管。”“推动文化遗产系统性保护和统一监管”写入“十五五”规划纲要。 一针一线、一丝不苟，姚建萍是苏绣国家级非遗代表性传承人，“七八岁时就跟随母亲拿起绣花针，至今已有近50个年头。如今两个女儿也投身苏绣。”在江苏苏州苏绣小镇，8000余名绣娘手持针线，孜孜不倦，创作精美的“双面绣”。 抢救性保护、生产性保护、整体性保护、数字化保护、生活化保护……我国着力提升非物质文化遗产传承实践能力，保护实践场所，不断增强非遗保护传承活力。 今年4月，2025年度全国十大考古新发现终评会举行。吉林东部长白山旧石器时代遗址群、河南新郑裴李岗遗址……这些考古新发现是对中华文明更悠远更深邃更宽广的探寻，实证着中华文明的突出特性。“何以中国”的故事变得越来越生动立体。 随着文化遗产保护工作取得历史性成就，考古热、博物馆热、非遗热、文创热等热度持续攀升。截至2025年底，全国备案博物馆达7188家，2025年全国博物馆接待观众15.6亿人次。 “仿佛沉浸于历史‘现场’。”游览故宫博物院养心殿后，来自四川的游客魏冰洁说，“点赞文物保护工作者的细致用心。”经过近10年的研究性保护和系统性修缮，养心殿于去年12月重新开放。项目团队还利用三维扫描技术为所有文物建立数字档案，清晰记录下建筑残损风化的痕迹。 数字化让文化遗产焕发新活力。国家级非遗代表性传承人记录工作已为2290名传承人留下数字印记，累计采集原始素材超9.2万小时，收集文献57万余件。 “博物馆内，历史氛围感拉满，未来科技范儿十足。”来自江西的大学生于迪特意用一天时间参观江苏扬州中国大运河博物馆，“我对这条世界上最长人工运河的认识更加深入了。” 走出博物馆，于迪漫步大运河国家文化公园扬州段，“优美的生态环境，深厚的历史文化积淀，带给我非常棒的体验。” 如今，长城、大运河、长征、黄河、长江国家文化公园建设高质量推进，打造传承中华文明的历史文化标识。 今年是红军长征胜利90周年。年初，中国人民大学学生先锋实践团来到黔贵大地，走进遵义会议会址和贵州长征文化数字艺术馆，见证眼前的“红飘带”建筑连接过去、当下与未来。红色旅游持续升温，越来越多人走进各地革命博物馆、纪念馆、党史馆、烈士陵园等，在重温历史、缅怀先烈中增强精神力量。 与古为新，以文化赋能经济社会发展 北京市东城区的隆福寺街区，一座承载了600年历史的文化地标。 一拉，福寿延绵；二对，花开富贵；三抖，三阳开泰……街区摊位前，北京翻里花制作技艺传承人李梅展示着“一翻就变”的技艺魅力。“不放弃老祖宗的技艺，也要有所创新。”李梅说，从“翻花龙”“长城翻里花”到今年的“翻花马手工工具包”，她已研发出上百款新品。 习近平总书记指出：“我一直关注北京的老字号，现在一些老字号传承发展也面临挑战，怎么激发活力？这并不是简单地改头换面，要保留住真正的内涵，同时提升各方面的服务。” 丙午马年春节，不少网友晒出自己的三彩黑釉陶马毛绒挂件，“‘一匹黑马’自带黑马逆袭的好彩头，寓意真的很赞”。 文创的原型正是中国国家博物馆“古代中国”展厅的一匹三彩黑釉陶马。“围绕这匹‘黑马’，我们陆续推出背包、手套、冰箱贴等约50款文创。”中国国家博物馆相关工作人员介绍。 300万件，这是国家博物馆推出的凤冠冰箱贴在一年半时间里的销量；8065亿次，这是去年非遗相关短视频在抖音上的全年播放量。 “十五五”规划纲要提出，“以文化赋能经济社会发展”。 放眼全国，各地博物馆、非遗馆内，文创产品琳琅满目、销售额持续攀升；直播间里，“云”考古热度不减，精彩技艺吸引无数人的目光……传统文化与现代生活紧密连接，中华传统之美绽放新彩。 “逛古镇、品美食、赏非遗，已是出行‘标配’。”在浙江绍兴丰惠古镇，大学生石梦依踏着青石板，喝茶、听戏、下单老字号产品，“体验很有趣，产品很丰富，慢时光的古镇游永远值得期待。” 2025年，各地举办非遗促消费活动3万多场，其中四季非遗购物月主场活动直播销售额达3.65亿元，非遗品牌推广周带动销售额超11亿元……非遗在拉动消费、激活文旅市场方面作用显著。 贵州榕江县，“村超”热度一浪高过一浪。游客点赞：“侗族大歌、苗族木鼓舞等非遗表演，和比赛一样精彩。” 在广大乡村，中华优秀传统文化成为推动文旅发展、建设文明乡风的优质资源。非遗工坊、乡村博物馆，老手艺、老曲目、老习俗成为群众就业增收新亮点。截至2025年，全国建成1.49万余家非遗工坊，带动130万余人就业，生动实现“手艺养活一家人、非遗振兴一个村”。 沟通心灵，促进不同文明交流互鉴 在北京，故宫与天坛，被许多外国朋友列入打卡清单。 今年5月14日，习近平主席同美国总统特朗普参观天坛。祈年殿气势恢宏，重檐琉光。两国元首拾阶而上，步入祈年殿，共同欣赏榫卯斗拱精准契合、天文历法与殿宇结构完美融合的建筑特点，感受其中和谐万物、顺天应时的理念。 “世界文化和自然遗产是人类文明发展和自然演进的重要成果，也是促进不同文明交流互鉴的重要载体。”习近平总书记强调。 英国人大卫是文化遗产爱好者，在他的游玩中国计划中，除了长城、敦煌之外，还有西夏陵。2025年7月，“西夏陵”被列入《世界遗产名录》，中国世界遗产至此达到60项，居世界前列。 申遗捷报频传，文化遗产成为扩大中华文化国际影响力的重要名片。2025年12月，“赫哲族伊玛堪”从急需保护的非物质文化遗产名录成功转入人类非物质文化遗产代表作名录，同时，“‘赫哲族伊玛堪’保护计划”入选优秀保护实践名册。至此，中国列入联合国教科文组织非遗名录、名册的项目总数增至45项，居世界首位。 文物回归，展现守护国宝的坚定决心和实力。去年10月，中方在美国华盛顿接收美方民间机构代表返还的虎形牌饰文物，这是继去年5月接收子弹库帛书二、三卷后，又一次成功接收美方返还重要文物。“十四五”时期，35批次537件/套流失文物艺术品陆续回归祖国，流失文物追索返还工作取得积极成效。 以文化人，更能凝聚人心；以艺通心，更易沟通世界。 品茶，听古琴，赏中华戏曲，尝传统美食……外国朋友对中国非遗产生浓厚兴趣，并争先恐后体验穿汉服、吃火锅、舞鱼灯、打八段锦等中式生活。数据显示，仅今年一季度，中国茶叶出口额便达27亿元。 无论是风靡世界的中国非遗、文创、生活方式，还是日益活跃的文化出海，都彰显了中华文化的魅力。 《黑神话：悟空》中的陕北说书、中国古建筑被全球玩家点赞。2025年，我国自主研发游戏海外市场收入达204.55亿美元；我国网络文学海外市场营收达56.4亿元，覆盖200多个国家和地区……以网文、网剧、网游为代表的文化“新三样”，蕴含着中华优秀传统文化，在海外刮起阵阵“中国风”。 习近平总书记强调：“我们一定要重视历史文化保护传承，保护好中华民族精神生生不息的根脉。” 如今，传承不绝的宝贵遗产激发中华民族的壮志豪情，多姿多彩的古老技艺进入更为广阔的全球市场……全社会的历史自信、文化自信更加坚定，做中国人的志气、骨气、底气极大增强，为以中国式现代化全面推进强国建设、民族复兴伟业注入强大文化力量。（记者 郑海鸥） 相关链接 附件下载 关闭 设区市政府网站 福州市 厦门市 漳州市 泉州市 三明市 莆田市 南平市 龙岩市 宁德市 市政府部门网站 宁德市科学技术局 宁德市发展和改革委员会 宁德公安公众服务网 宁德市民政局 宁德市教育局 宁德市民族与宗教事务局 宁德市司法局 宁德市人力资源和社会保障局 宁德市住房和城乡建设局 宁德市交通运输局 宁德市生态环境局 宁德市农业局 宁德市财政局 宁德市自然资源局 宁德市卫生健康委员会 宁德市水利局 宁德市海洋与渔业局 宁德市林业局 宁德市审计局 宁德市应急管理局 宁德市人民政府国有资产监... 宁德市体育局 宁德市统计局 宁德市监察局 宁德市文化和旅游局 宁德市地方税务局 宁德市质量技术监督局 宁德市住房公积金管理中心 宁德市发展和改革委员会 县（市、区）政府网站 古田县人民政府 蕉城区人民政府 寿宁县人民政府 周宁县人民政府 福安市人民政府 霞浦县人民政府 柘荣县人民政府 福鼎市人民政府 东侨经济开发区 其他 宁德市屏南县网上信访服务窗口 东南网 中国共产党新闻网 设区市政府网站 福州市 厦门市 漳州市 泉州市 三明市 莆田市 南平市 龙岩市 宁德市 市政府部门网站 宁德市科学技术局 宁德市发展和改革委员会 宁德公安公众服务网 宁德市民政局 宁德市教育局 宁德市民族与宗教事务局 宁德市司法局 宁德市人力资源和社会保障局 宁德市住房和城乡建设局 宁德市交通运输局 宁德市生态环境局 宁德市农业局 宁德市财政局 宁德市自然资源局 宁德市卫生健康委员会 宁德市水利局 宁德市海洋与渔业局 宁德市林业局 宁德市审计局 宁德市应急管理局 宁德市人民政府国有资产监... 宁德市体育局 宁德市统计局 宁德市监察局 宁德市文化和旅游局 宁德市地方税务局 宁德市质量技术监督局 宁德市住房公积金管理中心 宁德市发展和改革委员会 县（市、区）政府网站 古田县人民政府 蕉城区人民政府 寿宁县人民政府 周宁县人民政府 福安市人民政府 霞浦县人民政府 柘荣县人民政府 福鼎市人民政府 东侨经济开发区 其他 宁德市屏南县网上信访服务窗口 东南网 中国共产党新闻网 隐私保护 | 使用帮助 网站标识码：3509230001 闽公网安备 35092302000104号 闽ICP备08100045号 屏南县人民政府 新媒体矩阵  闽政通APP 主办：宁德市屏南县人民政府办公室 地址：屏南县县府路2号 邮编：352300 联系电话：0593－3322146\u003c/p>","related":[],"updated_at":"2026-11-16T09:05:28.774Z"},{"slug":"policy-20260528-cbdca719","title":"国务院关于印发《城市更新“十五五”规划》的通知","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国发〔2026〕12号","publish_date":"2026-05-28","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202605/content_7070540.htm","summary":"国务院关于印发《城市更新 “十五五”规划》的通知 国发〔2026〕12号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 现将《城市更新“十五五”规划》印发给你们，请认真贯彻执行。 国务院","themes":["城市更新","十五五规划"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>国务院关于印发《城市更新 “十五五”规划》的通知 国发〔2026〕12号 各省、自治区、直辖市人民政府，国务院各部委、各直属机构： 现将《城市更新“十五五”规划》印发给你们，请认真贯彻执行。 国务院 2026年5月22日 （此件公开发布） 城市更新“十五五”规划 城市是现代化建设的重要载体、人民幸福生活的重要空间。为贯彻落实党中央、国务院关于高质量推进城市更新的决策部署，根据《中华人民共和国国民经济和社会发展第十五个五年规划纲要》，制定本规划。 一、总体要求 坚持以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，认真落实四中全会部署，全面贯彻习近平总书记关于城市工作的重要论述，完整准确全面贯彻新发展理念，坚持稳中求进工作总基调，坚持以人民为中心，坚持系统观念，坚持规划引领，坚持统筹发展和安全，坚持保护第一、应保尽保、以用促保，因地制宜、分类指导，尽力而为、量力而行，建立可持续的城市更新体制机制和政策法规，高质量推进城市更新，为建设现代化人民城市提供坚实基础。 到2030年，城市更新行动取得重要进展，城市开发建设方式转型初见成效，安全发展基础更加牢固，服务效能不断提高，人居环境明显改善，新旧动能加快转换，文化遗产有效保护，风貌特色更加彰显，治理水平大幅提高，城市成为人民群众高品质生活的空间。到2035年，城市更新体制机制更加完善，城市结构优化、动能转换、品质提升、绿色转型、文脉赓续、治理增效取得显著成效，创新、宜居、美丽、韧性、文明、智慧的现代化人民城市基本建成。 二、培育壮大城市发展新动能 （一）增强城市发展动力 推动城市特色化发展。落实区域重大战略，因地制宜实施城市更新，优化现代化城市体系。推进超大特大城市治理现代化，以城市群、都市圈为依托构建大中小城市协调发展格局。坚持城乡融合发展，推进宜居县城建设，开展县城体检，因地制宜发展小城镇，加强边境小城镇建设，推动城镇基础设施和公共服务向乡村延伸覆盖。 精心培育创新生态。推动老旧街区厂区、低效产业园区、低效楼宇等转型升级，优化提升传统产业，培育壮大新兴产业和未来产业，因地制宜发展新质生产力，提升城市产业创新活力。发展智能建造，培育现代化建筑产业链。推动消费基础设施改造升级，发展首发经济、银发经济、冰雪经济、低空经济、赛事经济、体验经济等。培育国际消费中心城市。 （二）激活城市存量资源潜力 全面摸清城市存量资产资源底数，推动已供未开发土地和在建项目分类处置，盘活闲置低效的老旧厂房、商业办公用房、商品住房、公房等。加快构建房地产发展新模式，完善商品房开发、融资、销售等基础制度。优化保障性住房供给，强化城镇低收入住房困难家庭住房保障，更好满足住房困难且收入不高的工薪群体基本住房需求，逐步解决新市民、青年等群体的阶段性住房困难。因城施策增加改善性住房供给，规范发展住房租赁市场。促进房地产开发企业转型发展、参与城市更新。深化住房公积金制度改革，扩大使用范围，着力满足缴存人不同阶段的多样化住房需求，支持灵活就业人员参加住房公积金制度。加强和规范存量城市基础设施资产管理。 （三）提升城市对外开放合作水平 支持有条件的城市承担重大外事外交活动，吸引有影响力的国际组织落户。建设一批国际门户枢纽城市和区域性开放节点城市。发挥世界城市日、全球可持续发展城市奖（上海奖）等作用，加强在联合国人居署等多边合作框架下的城市更新国际交流合作。推进高质量共建“一带一路”，支持建筑企业按市场化原则参与国际合作，提升中国建造品牌国际影响力。 三、营造高品质城市生活空间 （一）推进“好房子”建设 实施房屋品质提升工程，兼顾增量建设与存量更新，全链条提升住房标准、设计、材料、建造、运维水平，建设改造安全舒适绿色智慧的“好房子”。鼓励居民开展既有住房装修和局部升级改造，推广装配式装修和适老化、无障碍改造，应用性能优异的新型建材。在新建、改造住宅项目中开展数字家庭建设，丰富数字家庭应用场景。 （二）持续推动城镇老旧小区改造 重点对建成20年及以上的城镇住宅小区开展专项体检，聚焦补齐基础设施短板、提升服务功能和环境品质实施针对性改造。支持具备条件的楼栋加装电梯。结合改造同步完善长效管理机制，提高管理维护水平。 （三）加快建设完整社区 完善社区基本公共服务设施，逐步补齐便民商业服务设施短板。完善城市社区嵌入式服务设施，推动一刻钟便民生活圈建设扩围升级。加强社区配套基础设施建设改造，优化提升公共活动场地、公共绿地和慢行系统，因地制宜增设健身休闲运动场所，推进社区服务智能化。 （四）推进老旧街区厂区改造提升 改造提升老旧商业街区、生活街区，完善功能布局，补齐基础设施和公共服务短板，优化交通组织，提升公共空间品质，丰富文商旅体展等融合业态，创新沉浸式体验等多元消费场景。实施老旧交通枢纽与周边街区一体化更新改造。推动老旧厂区功能转换，完善厂区及周边配套设施，优化景观环境，加强工业遗产保护利用，盘活利用闲置低效厂区、厂房和设施，植入新业态新功能。鼓励以市场化方式推动老旧厂区改造提升。 （五）提升城市公共服务品质 充分利用存量闲置房屋和低效用地，优先补齐民生领域公共服务设施短板。推动养老机构提质增效，支持有条件的医疗卫生机构开展医养结合服务。建设改造托育服务设施，发展普惠托育和托幼一体化服务。完善全民阅读设施等公共文化服务设施，建设新型公共文化空间。建设改造“小而美”的全民健身场地设施，推动乒乓球等群众喜爱的运动项目进社区、进公园，举办群众身边的赛事活动。整治提升背街小巷环境，开展小微公共空间改造，加快公共场所适老化、无障碍环境建设改造，建设儿童友好空间。 （六）完善城市综合交通体系 优化城市快速路立交和出入口设置，改造瓶颈路段和节点，完善次支路网，实施道路微循环改造工程。严格规范城市轨道交通规划建设，推动轨道交通场站及周边一体化改造。优化城市货运网络规划设计，健全分级配送设施体系。实施老城区停车补短板行动，鼓励建设集约化停车设施，推进停车设施建设改造，按规定配建充电设施。持续开展人员密集区域停车综合治理行动。 四、推动城市发展绿色低碳转型 （一）修复城市生态系统 建设连续完整的城市生态基础设施体系。加快修复受损山体、采煤沉陷区和特大矿坑。加强建设用地土壤污染风险管控和修复，有序推进污染地块环境修复与开发建设衔接。持续深化工业园区水污染整治，强化入河排污口排查整治，建设排污口分级分类监管体系。巩固城市黑臭水体治理成效。保护修复城市湿地，因地制宜推进渠化河道改造，建设幸福河湖、美丽河湖。统筹推进城市噪声等污染治理。结合地方实际，因地制宜、量力而行，完善城市绿地系统，推动公园绿地开放共享，加强古树名木保护。 （二）加快城市建设绿色转型 推动高耗能公共建筑改造升级，鼓励采用合同能源管理等市场化节约能源服务。大力发展绿色建筑，推动超低能耗建筑、低碳建筑规模化发展。建立建筑能效等级制度，优化建筑用能结构。推广绿色设计，持续推进绿色建材评价认证和推广应用，稳步发展装配式建筑。推广绿色施工，鼓励使用新能源车辆和机械，加强建筑材料循环利用，促进建筑垃圾减量化，严格管控施工扬尘和噪声。 （三）践行绿色低碳生活方式 推进城市节水，建设海绵城市。深化气候适应型城市建设。加快城市污水收集处理设施补短板，推动建立厂网统筹的建设运维长效机制。持续完善垃圾分类收集和处理设施体系，健全城市生活垃圾资源回收利用体系。推进城市生活垃圾收运网络与再生资源回收网络融合。推动建筑垃圾利用处置设施建设，开展存量建筑垃圾专项整治。倡导绿色低碳出行，优化公交线网和站点布局，建设公交停车场等设施，建设改造人行道、非机动车道，构建城市绿色慢行交通系统。 五、增强城市安全韧性 （一）有序推进危旧房改造 对城市C、D级危险住房和非成套住房建档立卡并动态更新。用好中央补助资金、地方政府专项债券等，加快拆除改造D级危险住房，精准消除安全隐患。支持老旧住房自主更新、原拆原建，探索可持续运营模式。优先支持资源枯竭城市实施危旧房改造等项目。稳步推进预制板房屋治理改造和地震易发区房屋抗震加固。加强建筑保温材料管理。 （二）稳步推进城中村更新改造 采取拆除新建、整治提升、拆整结合等多种方式，对群众需求迫切、城市安全和社会治理隐患多的城中村优先实施改造。严格落实“一项目两方案”，做到征收补偿到位、项目资金平衡。加强安置房规划设计和建设管理，确保合理工期和建设质量。 （三）加强城市基础设施建设改造 实施城市地下管网和综合管廊建设改造。开展城市地下管网体检，加快实施燃气、供水、排水、污水、热力等老旧管网更新改造，因地制宜推动地下综合管廊建设。推进城市燃气管道老化更新改造，优化燃气设施布局，加强上游供给。推进供水设施更新改造，提高城市供水安全保障能力。完善城市排水防涝体系，健全洪涝联排联调机制。深入实施城镇供热“温暖工程”，推动老旧供热管网和设施设备更新改造，有序推进供热计量改造。统筹国防动员和城市地下管网建设改造。 加快城市基础设施生命线安全工程建设。强化对城市燃气、供水、排水、桥梁、隧道、热力、管廊等城市基础设施运行风险的实时监测、动态预警，及早发现和管控风险隐患。提高城市基础设施生命线安全工程建设运行质效，健全监测体系，完善风险隐患高效协同处置机制。 （四）提升风险防控和应急保障能力 支持盘活闲置低效资源，推进城市平急两用公共基础设施建设，完善医疗应急服务体系和应急物流体系。建设改造应急避难场所，推动平急两用公共基础设施及多种应急资源共建共用，完善应急避难功能，构建多层次应急避难场所体系。加强公共消防设施建设。提升街道、社区应急救援基础设施保障水平。强化城市道路桥梁安全管理，对超过设计使用年限或经专业检测发现存在安全隐患的D、E级桥梁隧道进行更新改造。提升工程防火保障能力，加强工程防火和消防审验技术力量，建设国家工程防火实验室和防火能力仿真模拟自主平台。提升高层建筑火灾防范和救援能力。 （一）推进资源调查 建立健全“先调查后建设”的保护前置机制。加强与全国文物普查衔接，开展老城区、老街区专项调查，形成历史文化名城、街区和历史地段、历史建筑潜在对象名单，开展预保护。按规定认定公布国家历史文化名城，推进省级和市县级保护对象认定公布，规范设立标志牌，开展数字化信息采集和测绘建档。 （二）加强整体保护 整体保护历史文化名城、街区和文物及周边风貌。开展历史文化名城、街区保护提升工程。开展不可移动文物、历史建筑和传统民居修缮。建立以居民为主体的保护实施机制，提升人居环境品质。坚决防止大拆大建、拆真建假。 （三）推动活化利用 活化利用不可移动文物、历史建筑、工业遗产、历史文化街区、历史地段等，在严格保护其核心价值与风貌的前提下，引入新业态新功能，以文化赋能产业发展，丰富城市文化体验、旅游休闲功能，同时避免过度商业化、同质化。 （四）塑造城市特色风貌 完善城市风貌管理制度。加强城市更新重点地区、重要地段风貌管控，保护城市独特的历史文脉、人文地理、自然景观，植根中华优秀传统文化，塑造特色风貌。开展城市设计并作为城市风貌管理的重要依据，提出建筑高度、体量、风格、色彩等控制要求，从整体平面和立体空间上统筹建筑布局、协调景观风貌、提升空间品质。 加强建筑设计管理。落实“适用、经济、绿色、美观”建筑方针，推动建筑设计传承创新，更好体现中华美学和时代风尚。强化优秀建筑设计作品正向引导作用，提升建筑设计质量。严格限制超高层建筑。提高既有建筑改造设计水平。提升住宅建筑设计品质。 七、提升城市治理能力水平 （一）完善城市治理工作体系 建立健全城市管理统筹协调机制，发挥好“一委一办一平台”作用，加强对城市治理工作的指挥调度、组织协调、监督评价，依托数智化手段提升城市运行和治理效能。探索社区党组织领导下的居委会、业委会、物业服务企业协调运行新模式。完善居民、企业、群团组织、社会组织参与城市治理制度机制，发挥志愿服务作用，拓宽新就业群体参与渠道。 （二）推动城市治理重心和配套资源下沉 发挥党建引领基层治理协调机制作用，加强跨部门工作统筹和协同联动。坚持和发展新时代“枫桥经验”，深入开展城市管理进社区工作，运用“吹哨报到”、“接诉即办”等工作机制，及时解决群众急难愁盼问题。加强物业服务市场监管，推动“物业服务进家庭”，鼓励有条件的物业服务企业向养老、托育、家政、文化、健康、助残等领域延伸。推动住宅小区建设骑手友好社区。加强互嵌式社区建设。 （三）推动城市治理智慧化精细化 推进城市全域数字化转型，建设城市信息模型（CIM）基础平台，打造集约统一、数据融合、高效协同的城市数字底座。完善CIM基础数据库和标准体系，丰富拓展“CIM+”在城市更新中的应用场景。推进房屋建筑和市政设施赋码，建设国家房屋建筑和市政设施基础信息库。推动区块链赋能住房交易、产权登记等。健全国家、省、城市三级城市运行管理服务平台体系，推动城市运行“一网统管”。 八、建立城市更新政策体系 （一）健全城市更新实施机制 全面开展城市体检，建立完善“专项规划—片区策划—项目实施方案”的实施体系，健全城市体检与城市更新一体化推进机制。建立城市更新项目库，推动项目常态化储备和动态调整。建立与建筑功能转换和混合利用需求相适应的规划调整机制，完善城市更新工程建设项目审批管理制度。规范开展城市更新示范项目创建。实施城市更新统计调查制度。按照简明精准、务实管用原则，研究建立科学的城市发展评价体系。 （二）构建可持续的城市建设运营投融资体系 完善财政支持政策。通过中央预算内投资等对符合条件的项目给予支持。中央财政支持实施城市更新行动。允许通过地方政府专项债券支持符合条件的城市更新项目建设，支持用作项目资本金。地方政府加大财政投入，在确保完成国家任务的前提下，推进相关资金整合和统筹使用。落实城市更新相关税费减免政策。 优化金融支持措施。发挥各类金融机构作用，引导金融机构按照市场化、法治化原则，在业务范围内为城市更新项目提供金融服务，不得新增地方政府隐性债务。对风险可控、商业可持续、符合条件的项目，允许采用综合开发、银团贷款、项目投资等市场化模式给予支持。探索金融支持城镇老旧住房自主更新、原拆原建的有效举措。 积极吸引社会资本参与。推动符合条件的城市更新项目发行基础设施领域不动产投资信托基金（REITs）、资产证券化产品等。支持符合条件的城市更新企业发行公司债券、中期票据等。按照谁受益、谁出资原则，充分发挥市场机制作用，构建政府、市场、居民资金合理共担机制。规范实施政府和社会资本合作新机制，鼓励民营企业积极参与城市基础设施建设运营。稳慎推进公用事业价格改革。 （三）更大力度支持盘活存量土地 规范空间复合利用。增强国土空间详细规划适应性，制定土地混合开发和空间复合利用的正面清单并明确规划管控要求，建立健全国土空间用途管制和规划许可制度，推行多部门并联审批和联合监管，推动土地用途和建筑功能依法合理转换。利用存量土地、房产资源发展国家支持产业、行业的，可享受一定年期内不改变用地主体和规划条件的过渡期政策，过渡期原则上不超过5年；过渡期满办理土地有偿使用手续的，可采取租赁或协议出让方式。 鼓励多主体合作改造。合理降低土地整合、置换、联合开发中的税费负担。规范长期租赁、先租后让、弹性年期供应等土地供应方式，支持带方案出让。依法稳妥推进工商业用地使用权续期。完善地价计收规则。 优化不动产登记服务。健全与混合利用、功能兼容、立体开发相适应的不动产登记规则。按照土地使用权地上地下空间分层供应情况，依法依规办理登记。灵活采用预告登记、按户首次登记等登记类型提供服务。因历史文化、特色风貌保护等原因需要保留建筑物、构筑物的，支持在确保安全的前提下，简化不动产登记申请材料。 （四）建立房屋全生命周期安全管理制度 建立房屋安全体检制度，对超过一定年限的房屋建筑定期开展体检，及时发现和处置安全隐患。建立房屋安全管理资金制度，统筹现有房屋安全管理相关资金，支持拓展资金来源，为房屋全生命周期安全管理提供资金保障。建立房屋质量安全保险制度，以市场化方式提高房屋安全保障能力。 （五）构建多主体协同参与机制 政府统筹协调各类存量资源，支持国有企业、民营企业参与城市更新。发挥街道、社区作用，建立居民、产权人、企业等多方主体参与机制。建立城市更新专家库和智库，引导专业技术力量提供全过程咨询服务。培育城市更新专业化运营机构。完善城市更新社会风险评估、矛盾化解处置机制。 （六）健全法律法规标准体系 研究修订城市房地产管理法、建筑法等法律。研究制定城市更新、城镇住房保障、城镇房屋安全管理、城乡历史文化保护传承、城镇地下管线管理、建设工程消防设计审查验收等相关法规，修订住房公积金管理条例、物业管理条例、历史文化名城名镇名村保护条例等法规。支持有立法权的地方出台城市更新相关地方性法规。研究健全城市更新标准体系，完善城市设计、城市体检、城市更新专项规划、历史文化保护、城市基础设施、市容环境卫生等标准。鼓励制修订符合地方需要的技术标准。 （七）强化科技人才支撑作用 开展可持续城市更新关键技术和装备攻关。加强城市更新科研力量。建设城市更新重点领域科技创新平台基地。支持有条件的高校、职业学校开设城市更新相关学科专业。支持高校、科研院所、骨干企业联合培养城市更新工程硕博士、卓越工程师。开展城市更新领域特色学院建设，实施城市更新领域职业教育高技能人才集群培养计划。实施建设英才培养计划。将城市更新作为干部教育培训重要内容，加强城市更新工作培训，定期组织领导干部培训，加强专业技术人员培训。 九、组织实施 坚持和加强党中央集中统一领导，构建中央统筹、省负总责、城市抓落实的工作格局。各省（自治区、直辖市）人民政府要明确本地区城市更新的目标、任务和措施。各城市人民政府要切实履行责任，细化落实本规划确定的重点任务，确保顺利实施。要加大宣传力度，广泛宣传新时代党领导城市更新的创新政策和工作成效，积极营造良好氛围。住房城乡建设部要会同有关部门加强统筹指导和协调支持，开展规划实施情况动态监测、中期评估和总结评估。重大事项及时按程序向党中央、国务院请示报告。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.630Z"},{"slug":"policy-20260417-2dbdaa40","title":"关于开展2026年度中央财政支持实施城市更新行动的通知","type":"policy","type_label":"政策","issuer":"财政部办公厅 住房城乡建设部办公厅","doc_no":"财办建〔2026〕14号","publish_date":"2026-04-17","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202604/content_7066082.htm","summary":"关于开展2026年度中央财政支持实施城市更新行动的通知 财办建〔2026〕14号 各省（自治区）财政厅、住房城乡建设厅，新疆生产建设兵团财政局、住房城乡建设局： 为贯彻党的二十大、中央城市工作会议","themes":["城市更新","财政支持"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>关于开展2026年度中央财政支持实施城市更新行动的通知 财办建〔2026〕14号 各省（自治区）财政厅、住房城乡建设厅，新疆生产建设兵团财政局、住房城乡建设局： 为贯彻党的二十大、中央城市工作会议关于实施城市更新行动的决策部署，落实中央经济工作会议和政府工作报告有关要求，2026年中央财政继续支持部分城市实施城市更新行动，开展相对集中联片的重点样板片区建设和可持续的城市更新机制建设，进一步突出投资和消费相结合、投资于物和投资于人相结合，促进城市基础设施建设由“有没有”向“好不好”转变，解决人民群众的急难愁盼问题，实现城市高质量发展。现就有关要求通知如下： 一、工作目标 财政部、住房城乡建设部通过竞争性选拔，确定部分基础条件好、积极性高、特色突出的城市，在城市层面整合各类资源，探索建立资金、用地、金融等各类要素保障机制，形成工作合力。中央财政对入围城市给予定额补助。入围城市制定城市更新工作方案，统筹使用中央和地方资金，明显提升城市基础设施水平，改善老旧片区人居环境，完善法规制度、规划标准、投融资机制及相关配套政策，探索城市更新可复制、可推广的机制和模式。 二、申报条件 2026年，中央财政支持实施城市更新工作的范围为地级及以上城市，共评选不超过15个城市。 每省（自治区）及新疆生产建设兵团可推荐1个城市参评，申报城市需同时满足以下基础条件： 1.建立推动城市更新工作的组织领导和协调工作机制，制定中央财政支持实施城市更新行动工作方案，具体实施范围相对集中，主要位于城市老城区； 2.城市财力满足城市更新投入需要，地方政府债务风险可控，不得因开展城市更新形成新的政府隐性债务； 3.2024年1月1日以来，在住房和城乡建设领域未出现重大生产安全事故或重大负面舆情事件。 三、遴选组织方式 中央财政支持的城市采取竞争性评审方式选拔确定，重点向基础工作扎实、条件俱备、积极性高的城市倾斜。 （一）省级推荐。省级财政、住房城乡建设部门对照申报要求，择优推荐本地区符合条件的城市参与评审，组织编制工作方案，并提供必要的支撑材料。 （二）书面评审。财政部、住房城乡建设部组织专家对城市申报方案进行审查。按照120%差额比例确定进入现场答辩的城市名单。 （三）现场答辩。进入现场答辩的各城市派员参加公开答辩，具体要求另行通知。 （四）集中公示。综合书面评审和现场答辩得分情况，确定入围城市。入围城市经过公示，无异议的确定为中央财政支持实施城市更新行动城市。存在违规行为并经查实的，取消资格。 四、补助标准和支持范围 （一）中央财政资金补助标准。中央财政按区域对实施城市更新行动城市给予定额补助。其中：东部地区每个城市补助总额不超过8亿元，中部地区每个城市补助总额不超过10亿元，西部地区每个城市补助总额不超过12亿元。资金根据工作推进情况分年拨付到位。 （二）资金支持方向。中央财政资金支持入围城市的重点样板片区建设和机制建设2个方向： 1.城市更新重点样板片区建设。一是城市基础设施品质提升，包括城市供水、供热、污水垃圾收集处理、综合杆箱、停车设施等改造建设。二是完整社区建设与小区配套设施改造，包括社区公共服务设施与便民商业服务设施建设改造、公共活动场地提升、居住区配套市政设施优化改造等。三是历史文化街区、既有公共建筑、公共空间等老旧片区（街区）更新改造及活化利用。四是利用存量土地和闲置房屋市政设施，补齐民生领域公共服务设施短板，建设消费型基础设施等。 2.城市更新机制建设。一是项目储备和生成机制。近远结合、系统谋划建设项目，可形成的机制包括但不限于城市更新项目谋划、储备、实施时序的方式，城市体检评估、城市更新专项规划—片区策划—项目实施方案的规划实施体系，房屋全生命周期安全管理、地下管线统筹、城市更新项目储备库建设、建设成效后评估机制等。二是资金安排筹措和行业发展长效机制。建立有利于统筹用好财政、金融资源的机制。财政资金方面，充分运用好国债资金、中央预算内投资、地方政府一般公共预算、地方政府专项债券、其他政府性基金预算、国资预算等，最大程度发挥财政资金效能。金融支持方面，探索优化金融机构信贷支持模式，鼓励社会资本进入。同时，建立合理的成本分担机制以及有利于行业发展的长效机制，如居民小区二次供水设施专业化运维机制、污水收集处理设施建设运维统筹长效机制、以污水收集效能提升为导向的按效付费机制、完整社区建设运营机制等。三是用地保障和审批机制。包括盘活利用存量低效用地、存量土地和闲置房屋及市政设施的相关机制，适用于改造类项目的城市更新项目审批制度，城市更新有关法规制度和技术标准等。中央资金可用于上述三类机制建立过程中的相关支出。 各城市要按照因地制宜、因城施策的原则，突出本次城市更新的重点内容，聚焦城市老城区，集中打造城市更新的样板片区、样板项目。同时，应与现有支持政策做好统筹衔接，具体项目上不得重复申请中央预算内投资、车购税资金、超长期特别国债等其他渠道中央资金，防止交叉重复。各城市要树立和践行正确政绩观，坚决杜绝急功近利、弄虚作假、盲目蛮干、违背群众意愿不切实际决策，坚决杜绝搞“形象工程”和“政绩工程”、政策规划“翻烧饼”，坚决杜绝项目烂尾闲置和“半拉子”工程。 五、日常跟踪、监督检查及绩效管理 省级住房城乡建设、财政部门应加强对入围城市的日常指导、跟踪和监督，及时将工作进展、存在问题及经验做法等报住房城乡建设部、财政部，原则上每个城市每年不少于1期。 财政部、住房城乡建设部将按照《中央财政支持城市更新行动绩效评价办法》及中央资金预算管理有关要求开展绩效评价。 六、其他事项 （一）各省级财政、住房城乡建设部门应于2026年5月8日前联合行文将申报材料报送财政部、住房城乡建设部，并组织申报城市通过财政部、住房城乡建设部邮箱报送电子版（含佐证材料），或通过光盘等移动存储方式邮寄，申报材料不得包含任何涉密文件、涉密内容，电子版材料大小不超过8GB。为厉行节约，除省级财政、住房城乡建设部门的正式申报函外，申报城市的实施方案及相关支撑材料一律报送电子版。 （二）各申报城市应按要求编制工作方案（实施期三年），减少申报工作支出。各地不得委托财政部、住房城乡建设部及其所属行政、企事业单位和工作人员以任何方式（署名或者不署名）参与工作方案的编制工作；不得简单交给中介机构或技术团队“编本子、讲故事”，印制豪华材料。 （三）请各省（自治区）及新疆生产建设兵团严格按照通知明确的数量和要求推荐城市、报送材料等，并对报送内容真实性负责。对不按要求报送或申报内容明显不实的城市，将取消当年申报资格。 （四）经竞争性评审确定入围的城市，请将三年行动总体绩效目标表、2026年度绩效目标表加盖城市（师市）人民政府公章后，于公示期结束前报财政部、住房城乡建设部备案。在后续3年的建设期内，各城市应在每年5月底前，报送下一年度的绩效目标表并加盖城市（师市）人民政府公章。 联系方式： 财政部经济建设司： 电话：010—68554521，邮箱：shikelu@mof.gov.cn 住房城乡建设部城市建设司： 电话：010—58933160，邮箱：chengshui@mohurd.gov.cn 附件： 1.城市更新行动（2026—2028年）工作方案编制大纲.docx 2.实施城市更新行动绩效指标体系.docx 3.XX市实施城市更新重点样板片区实施内容汇总表.xlsx 财政部办公厅 住房城乡建设部办公厅 2026年4月13日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title": 黄河几度被掩埋，屡毁屡建，历尽沧海桑田。 现如今，上承汉唐、下启明清而影响深远的“宋文化”，依然氤氲在开封的街头巷尾。这份穿越千年的厚重底蕴，不仅塑造了城市从容雅致的文化气质，更持续激活高质量发展的“一池春水”。 溯水寻城：赓续千载文脉 沿着中轴线行走在开封，脚下踩的不只是泥土，更是时间。 “历史上，受黄河泛滥和战乱等因素影响，开封曾多次被泥沙掩埋，形成世所罕有的‘城摞城’奇观。”在州桥遗址考古发掘现场，开封市文物考古研究院院长王三营指着清晰的地层剖面介绍，“在现代开封城下3至12米处，还上下叠摞着6座古城址的文化层。” 州桥，是北宋东京城御街与大运河（汴河段）交叉点上的标志性建筑。 “北宋中晚期，每到放榜之日，赴京赶考的举子们便云集于此，翘首以盼金榜。那时的州桥是承载士人理想、映照时代风云的文化高地和精神标识。”望着州桥，王三营脑海中总会浮现浪漫的联想，“或许我们和苏轼、王安石，脚踩过同一块青砖呢。” 2018年至2022年，河南省文物考古研究院联合开封市文物考古研究所（现“开封市文物考古研究院”）对州桥遗址开展持续性考古发掘，并出土北宋时期巨幅石雕祥瑞壁画。《东京梦华录》中所记载的“近桥两岸皆石壁，雕镌海马水兽飞云之状”的胜景，重现在世人眼前。 图为州桥遗址考古发掘现场（2026年3月23日摄）。新华社记者 李嘉南 摄 2025年5月，习近平总书记在河南考察时指出：“中华文明博大精深，值得我们多到实地去寻溯。” 随着州桥及汴河遗址公众考古研学示范基地建成开放，越来越多的孩子们来到考古探方边，感悟千年风雅。 从文物保护到文旅融合，从城市规划到民生改善，在开封，文化渗透于经济社会发展的方方面面。 近20年来，开封市围绕古城风貌保护，先后编制了一系列规划文件，始终坚持“小式建筑、限高15米、灰色基调、宋风宋韵”的总体风格。古城保护与城市更新，于开封而言，不是取舍，而是共兴。 图为开封铁塔（2026年3月23日摄，无人机照片）。新华社记者 李嘉南 摄 铁塔、繁塔等“宋文化”地标依然挺立，双龙巷、珠玑巷等历史上知名的街巷韵味十足，行走在开封，仿佛漫步于图籍中、徜徉在古今间。 纵然历史上的汴河已化为故道，它流淌出的悠悠文韵却从未“断流”，润泽着一代代开封人的心田。 以文兴业：重绘清明上河 “各位大人好，欢迎来到开封府参加大宋同签会……”开封府景区全息剧场内，依托宋画创排的《闸口盘车案》正在上演，虚实交错间，赢得观众阵阵掌声。 “太震撼了！无论是数字化复原的街道景观，还是全息立体成像的‘大宋官员’，都让人仿佛穿越千年。”广西游客伍玥说。 开封府外的码头边，游船已满载游客，沿着波光粼粼的大宋御河悠然驶去。河道两岸，包公祠、清明上河园、天波杨府等景区串珠成链。 2026年3月23日，游客在开封清明上河园景区游玩（无人机照片）。新华社记者 李嘉南 摄 “一城宋韵半城水”，在开封，水脉蕴文脉，水运即城运。 “我小时候，开封城内的水系并不像现在这样整体连通。”作为土生土长的本地人，开封市文化旅游投资集团有限公司工作人员王振豫见证了开封“一渠六河”综合治理工程全线通水，“如今的老城区内，包公湖、龙亭湖、铁塔湖等五湖贯通，一川清流、两岸锦绣。” 2025年5月，习近平总书记在河南考察时指出：“文旅融合前景广阔，要推动文旅产业高质量发展，真正打造成为支柱产业、民生产业、幸福产业。” 殷殷嘱托，言犹在耳。近年来，开封依托丰厚的“宋文化”资源，主动求新求变，沿城内水系打造景观带、文化带、旅游带，不断擦亮“宋文化看开封”的金字招牌。一幅水光潋滟的“新时代清明上河图”已然在开封铺展开来—— 清明上河园中，沉浸式“餐饮+演艺”项目《清明上河·宋宴》叫好叫座，游客们在雅乐之中品味千年食趣；万岁山武侠城里，超3000场实景演出轮番上演，让人直呼“过瘾”；华灯初上时，鼓楼夜市的叫卖声此起彼伏，尽显人间烟火气…… 2025年3月6日，游客在开封清明上河园景区游玩（无人机照片）。新华社记者 李嘉南 摄 据开封市文化广电和旅游局测算，2026年春节假期，开封全市累计接待游客1073.56万人次，实现旅游综合收入75.8亿元，按可比口径同比分别增长6.03%和7.12%。开封已成为中原地区最具吸引力的旅游目的地之一。 “在龙头景区的带动下，开封已逐步构建起涵盖古都游、民俗游、红色游、乡村游的全域旅游产品体系，让游客从‘打卡一个点’转向‘逛遍一座城’，推动城市从‘现象级爆红’稳步走向‘可持续长红’。”开封市文化广电和旅游局主要负责人说。 向新而行：澎湃发展动能 马年春节前夕，一场别出心裁的民族乐器复刻展演在中国（河南）自贸区国际艺术品保税仓上演——古装打扮的乐师们手指翻飞，悠扬的旋律声声入耳，让人真切感受到“八音克谐”的美妙意境。 “我们依据古画《合乐图》，复刻出琵琶、箜篌等19件乐器，并由专业演奏人员进行情景式演绎。”这一展演的主创方之一、深圳市佳音王科技股份有限公司相关负责人介绍，这一“乐器复刻+非遗展演+音乐创作”的模式，正推动民族乐器从产品出口转向文化IP（知识产权）输出。 2025年7月26日，上海合作组织媒体智库峰会与会嘉宾在中国（河南）自贸区国际艺术品保税仓观看民族乐器复刻展演。新华社记者 袁月明 摄 2025年全国两会期间，习近平总书记在参加江苏代表团审议时强调“以文化赋能经济社会发展”。 古都开封，高扬推动高质量发展的文化之帆，不断加快走向世界的步伐。 “2021年8月，第二批国家文化出口基地名单公布，中国（河南）自由贸易试验区开封片区成功入选。”中国（河南）自由贸易试验区开封片区管委会常务副主任郑红英介绍，近年来，开封已逐步构建起全方位、多层次的文化产业国际化发展格局。 据悉，2025年中国（河南）自由贸易试验区开封片区文化产品进出口额达4.2亿元，同比增长641.3%。自开仓以来，这一片区累计文化贸易进出口总额已突破14亿元。 将目光投向更宏阔的未来，开封在守牢文化根基、激活文旅引擎的同时，也在积极谋篇布局，为城市发展积蓄新动能。 图为奇瑞汽车股份有限公司河南分公司生产车间（2026年3月23日摄）。新华社记者 李嘉南 摄 走进奇瑞汽车股份有限公司河南分公司生产车间，只见一派热火朝天的繁忙景象。伴随不停挥舞的机械臂，一辆辆汽车接连下线。不久后，它们便会通过距离生产基地不远的开封综合保税区直接出口。据介绍，平均每4分钟，就有一辆奇瑞汽车从开封“驶”向海外。 “开封正加快打造汽车制造、现代食品、文化旅游三个千亿级产业链。我们将坚定把制造业高质量发展作为主攻方向，构建具有开封特色的现代化产业体系。”开封市委主要领导同志充满信心地说。 春风吹过开封兰考东坝头，黄河在此处拐过最后一道弯，滔滔东去。正如焦裕禄当年在兰考战风沙、治盐碱时的那股劲，今日开封，正凭着这迎难而上、扎根群众的奋斗精神，在高质量发展的道路上勇毅前行。 伴着文化带来的蓬勃力量，这座不满足于“一眼千年”的城市，正一步一个脚印，在古与新、守与进的平衡中，不断跃迁。 记者：李俊、袁月明 海报制作：袁月明、李嘉南 (责编：黄莎、杨晓娜) 推荐阅读 以制度刚性约束权力任性（有所思） 干部乱作为，本质是有权任性、履职失范、用权失序。有的拍脑袋决策，无视程序，脱离实际；有的滥用权力，搞“选择性执法”“同案不同罚”；有的即便出了错，也缺乏自我纠正的勇气和机制。… 郑州四年吸引青年人才近百万人 河南郑州高新技术产业开发区一家企业的研发实验室里，30岁的杜振洋讲起最新的AI无人机研发方案，滔滔不绝，眼里有光。眼下，他的团队正攻坚AI自动化技术，团队研发的大载重无人机，直接服务500多家客户。… 推荐视频 绘说现代化丨“豫”见精彩 新春走基层 |“00后”的甜蜜“守艺” 新春走基层丨“泥咕咕”高飞 人民日报 人民网+ 手机人民网 领导留言板 人民视频 人民智云 --&gt; 人民智作 热门排行 1 《数智赋能正能量生产传播态势报告》发布 2 阔别50载的双向奔赴！“孪生”妇好鸮尊… 4 留言板·观豫⑪｜电动车治理难题咋破？多… 5 传承文明拥抱春天 2026开封清明文化… 6 全省树立和践行正确政绩观学习教育座谈会… 7 河南淅川：以花为媒激活春日经济 8 郑州四年吸引青年人才近百万人 9 我国首款七吨级运投无人机首飞成功 10 三门峡陕州区：黑树莓“种”出乡村振兴新… 人民日报社概况 | 关于人民网 | 报社招聘 | 招聘英才 | 广告服务 | 合作加盟 | 供稿服务 | 数据服务 | 网站声明 | 网站律师 | 信息保护 | 人民日报违法和不良信息举报电话：010-65363263 举报邮箱： jubao@people.cn 人民网服务邮箱： kf@people.cn 违法和不良信息举报电话：010-65363636 举报邮箱： rmwjubao@people.cn 互联网新闻信息服务许可证10120170001 | 增值电信业务经营许可证B1-20060139 | 广播电视节目制作经营许可证（广媒）字第172号 信息网络传播视听节目许可证0104065 | 网络文化经营许可证 京网文[2020]5494-1075号 | 网络出版服务许可证（京）字121号 | 京ICP证000006号 | 京公网安备11000002000008号 人 民 网 股 份 有 限 公 司 版 权 所 有 ，未 经 书 面 授 权 禁 止 使 用 Copyright © 1997-2026 by www.people.com.cn. all rights reserved 关注 第一时间为您推送权威资讯 报道全球 传播中国 关注人民网，传播正能量\u003c/p>","related":[{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-16T09:05:28.353Z"},{"slug":"policy-20260319-22f1ef97","title":"国务院关于同意将四川省眉山市列为国家历史文化名城的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2026〕18号","publish_date":"2026-03-19","effective_date":"","status":"现行有效","level":"国家级","region":"眉山","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202603/content_7063205.htm","summary":"发掘文化遗产内涵与价值，系统开展考古调查和史料研究，厘清眉州古城的空间格局和发展脉络，明确保护的原则和重点，强化文化遗产保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好眉山市历史文化名城保护","themes":["历史文化名城"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于同意将四川省眉山市 列为国家历史文化名城的批复 国函〔2026〕18号 四川省人民政府： 你省关于申报眉山市为国家历史文化名城的请示收悉。现批复如下： 一、同意将眉山市列为国家历史文化名城。眉山市历史悠久、文化厚重，文化遗产资源丰富，传统格局和历史风貌保存较好，地域特色鲜明，具有重要的历史文化价值。 二、你省及眉山市人民政府要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，深入学习贯彻习近平文化思想，按照党中央、国务院决策部署，牢固树立保护历史文化遗产责任重大的观念，落实《中华人民共和国文物保护法》、《历史文化名城名镇名村保护条例》要求，深入研究发掘文化遗产内涵与价值，系统开展考古调查和史料研究，厘清眉州古城的空间格局和发展脉络，明确保护的原则和重点，强化文化遗产保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好眉山市历史文化名城保护规划和文物保护等专项规划，制定并严格实施保护管理规定，明确各类保护对象的清单以及保护内容、要求和责任。正确处理城市建设与文化遗产保护的关系，摸清文物资源家底，加强文物保护，完善“先调查、后建设”、“先考古、后出让”制度，重视城市格局保护和风貌管控，加强整体性保护、系统性保护；保护修复历史文化街区，补足配套基础设施和公共服务设施短板，不断提升人居环境品质；加强不可移动文物和历史建筑修缮保护，推动文物活化利用，充分发挥不可移动文物和历史建筑的使用价值。不得改变与名城相互依存的自然景观和环境，不得进行任何与名城环境和风貌不相协调的建设活动，不得损坏或者擅自迁移、拆除不可移动文物和历史建筑，相关建设项目要依法履行报批程序。进一步强化责任落实，对不履职尽责、保护不力，造成名城历史文化价值受到严重影响的行为，依法依规加大监督问责力度。 三、你省与住房城乡建设部、国家文物局要加强对眉山市国家历史文化名城保护工作的指导、监督和检查。 国务院 2026年3月16日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.668Z"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第831号","publish_date":"2026-02-14","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202602/content_7058029.htm","summary":"社会发展相关规划。 第五条　县级以上地方人民政府对本行政区域内供水安全保障承担主体责任，加强对供水工作的组织领导，统筹研究和协调解决供水工作中的重大问题，将供水工作所需经费列入本级预算。 第六条","themes":["供水","城市运行"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第831号 《供水条例》已经2025年12月31日国务院第76次常务会议通过，现予公布，自2026年6月1日起施行。 总理 李强 2026年2月11日 供 水 条 例 第一章 总 则 第一条 为了促进供水事业高质量发展，保障供水安全，提升供水服务水平，更好适应经济社会发展和人民生活需要，制定本条例。 第二条 从事供水工作、使用供水及其相关管理活动，适用本条例。 本条例所称供水，是指依托取水、输水、净水、配水等设施向生活、生产及公共服务等提供用水，包括城市供水和农村规模化供水。 本条例所称农村规模化供水，是指通过设计供水量、供水人口达到规定规模的集中供水工程或者通过城市供水管网延伸工程向农村（包括乡镇和村庄）提供用水，不包括农业灌溉供水。 第三条 供水事业发展应当贯彻党和国家路线方针政策、决策部署，坚持以人为本、城乡统筹，坚持公益属性，实行开发水源和节约用水相结合，持续增强供水安全保障能力，促进供水服务均等化。 第四条 国家完善政策措施，支持供水事业发展。 县级以上人民政府应当将供水事业发展纳入国民经济和社会发展相关规划。 第五条 县级以上地方人民政府对本行政区域内供水安全保障承担主体责任，加强对供水工作的组织领导，统筹研究和协调解决供水工作中的重大问题，将供水工作所需经费列入本级预算。 第六条 国务院住房城乡建设主管部门、水行政主管部门分别负责指导全国城市供水、农村供水工作。省、自治区人民政府住房城乡建设主管部门、水行政主管部门分别负责指导本行政区域内城市供水、农村供水工作。 直辖市人民政府、设区的市级人民政府、县级人民政府住房城乡建设主管部门、水行政主管部门分别负责本行政区域内城市供水、农村供水管理工作。 县级以上地方人民政府可以确定由一个部门统一负责指导供水工作或者负责供水管理工作。 县级以上人民政府疾病预防控制部门负责饮用水卫生监督管理工作。 县级以上人民政府生态环境、市场监督管理、自然资源等有关部门在各自职责范围内负责供水相关工作。 本条第一款、第二款、第三款规定的部门，统称供水主管部门。 第七条 国家鼓励和支持供水科学技术研究开发、成果转化、推广应用，加强供水人才培养，促进供水科学技术进步，提升供水工作的自动化、数字化、智能化水平。 第八条 对在供水工作中作出显著成绩的单位和个人，按照国家有关规定给予奖励。 第二章 供水水源 第九条 县级以上地方人民政府应当根据本地区经济社会发展和水资源禀赋情况，合理安排、布局供水水源，加强供水水源建设。 县级以上地方人民政府根据实际需要组织编制供水水源建设相关规划。供水水源建设相关规划应当与国土空间规划相衔接，将涉及土地和空间使用的合理需求纳入国土空间规划实施监督信息系统统筹保障。 第十条 供水水源建设应当统筹地表水与地下水、当地水与外调水，实现多水源互补；单一水源供水的，应当按照国家有关规定建设应急水源或者备用水源；有条件的地区可以开展区域联网供水。 鼓励沿海缺水地区、海岛因地制宜推广海水淡化水作为补充水源。 第十一条 使用外调水作为饮用水水源的，县级以上地方人民政府应当保障当地水源和外调水源可以及时切换。 调水工程管理单位应当加强对调水工程设施设备的监测、检查、巡查、维修和养护，保障设施设备安全运行；因设施设备检修或者发生突发事件等可能影响正常调水的，调水工程管理单位应当根据影响范围及时通报受水区有关县级以上地方人民政府。 第十二条 县级以上人民政府生态环境、水行政等有关部门依法开展饮用水水源地规范化建设，落实饮用水水源保护区保护措施，建立饮用水水源水质监测预警和信息共享机制，保障饮用水水源水质符合国家有关标准。 县级以上人民政府水行政主管部门应当统筹饮用水水源地水量调配，加强饮用水水源地水文水资源监测。 县级以上人民政府生态环境主管部门应当会同有关部门做好饮用水水源地水环境监测工作，加强对饮用水水源地生态环境保护工作的监督管理，对饮用水水源地的环境状况和污染风险进行调查评估，筛查可能存在的污染风险因素，并采取相应的风险防范措施。 调水工程管理单位应当采取措施，保障调水水质符合国家有关标准。 第三章 供水工程建设 第十三条 县级以上地方人民政府应当加强对供水工程建设的统筹规划，保障供水工程建设与城乡建设协调发展。 县级以上地方人民政府应当对影响供水水质、妨害供水安全、老化失修的供水设施进行更新改造。 建有地下综合管廊的地区，具备条件的应当将城市供水管线纳入地下综合管廊。 第十四条 供水工程建设应当符合有关法律、法规、规章的规定和国家有关标准的要求。 供水工程的勘察、设计、施工、监理，应当委托具有相应资质的单位承担。禁止未取得相应资质或者超越其资质等级许可的范围承担供水工程的勘察、设计、施工、监理任务。 第十五条 对供水工程中的隐蔽工程，承担工程施工的单位（以下称施工单位）应当做好质量检查，并如实记录相关情况。隐蔽工程隐蔽前，施工单位应当依法通知工程的业主单位（以下称建设单位）等进行检查。建设单位根据需要可以邀请有关单位参加检查。 供水工程竣工后，应当按照国家有关规定组织验收；未经验收或者验收不合格的，不得投入使用。供水工程竣工验收后，建设单位应当按照规定及时向有关档案机构移交供水工程档案。 第十六条 供水主管部门应当按照国家有关标准要求，统筹区域集中调压调蓄设施建设工作。 新建、改建、扩建建设工程对供水水压要求超过供水管网服务压力的，由建设单位配套建设调压调蓄设施。 居民住宅建筑区划内业主共有的调压调蓄设施及其他共有供水设施（以下统称共有供水设施），不符合有关规定和国家有关标准要求的，县级以上地方人民政府应当依法有计划地组织实施改造。 本条例所称调压调蓄设施，是指用于将供水管网中的水调整水压、水量后再输送至用水单位和个人（以下统称用户）的供水设施。 第四章 供水经营和服务 第十七条 供水单位应当依法登记，取得法人资格，并具备下列条件： （一）有与所从事供水活动相适应的设施设备； （二）有经专业培训合格的从业人员，相关岗位操作人员按照规定经体检合格； （三）有与供水规模相适应的管理能力和水质检测能力； （四）有完善的水质检测、供水设施运行维护等管理制度。 供水单位应当依法取得卫生许可。供水单位使用的涉及饮用水卫生安全的产品应当符合国家卫生标准和卫生规范，并依法取得卫生许可。 第十八条 供水主管部门应当通过与供水单位签订运营服务协议等方式，明确供水有关服务范围、标准、规范、要求以及服务质量评价、退出机制等事项。 供水单位应当遵守供水有关服务标准、规范、要求等，加强内部管理，不断提高供水服务质量和效率，为用户提供安全便利、连续稳定、计量准确、公开透明的供水服务。 第十九条 供水单位应当通过便于公众知晓的方式，向社会公开供水报装接入流程、服务标准、资费标准、水质检测等信息，并提供信息查询服务。 第二十条 供水单位应当通过营业网点办理、在线办理等多种服务渠道，为用户申请供水报装接入提供便利。 供水管网覆盖范围内的建设项目需要报装接入供水的，建设单位应当在开工前申请报装接入，供水单位应当及时办理。 第二十一条 供水单位应当按照国家规定和有关标准要求的检测指标、检测频率和检测方法，定期检测原水、出厂水和管网水的水质，保证供水水质符合国家生活饮用水卫生标准。 供水单位发现原水水质不符合国家有关标准的，应当及时采取相应措施，并向供水主管部门报告。供水主管部门应当及时通报生态环境、疾病预防控制等有关部门，有关部门应当及时核查处理。 省级以上人民政府供水主管部门会同有关部门健全供水水质监测体系。 第二十二条 供水单位应当按照国家有关规定设置供水管网测压点，做好水压监测工作，确保供水管网的压力符合国家规定的标准。 第二十三条 供水单位应当保持不间断供水。因工程施工、设备维修等原因确需临时停止供水的，供水单位应当提前24小时向社会公告或者书面通知用户，并严格控制停水时长和范围；停止供水影响较大的，应当报经供水主管部门批准，并采取提供临时供水等措施，保障居民基本生活用水。 因自然灾害或者事故灾难等紧急情况，不能依照前款规定提前通知用户的，供水单位应当在抢修的同时通知用户，并向供水主管部门报告。 临时停止供水可能影响消防灭火救援的，供水单位应当提前通知当地消防救援机构。 第二十四条 用户应当安全用水、节约用水。用水单位自行配备的管道、水龙头等用水设备，应当符合国家有关标准。 禁止盗用或者未经供水单位同意转供水。 第二十五条 用户应当按照结算计量器具出具的数据和水价标准按时缴纳水费；不具备用水计量条件的农村用户，按照有关规定或者约定缴纳水费。 第二十六条 制定、调整城市供水价格，应当遵循覆盖成本、合理收益、公平负担的原则，统筹考虑促进节约用水、用户承受能力等因素。城市居民生活用水实行阶梯水价，非居民用水实行超定额（超计划）累进加价。因供水价格调整不到位导致供水单位难以达到准许收入的，城市人民政府应当予以适当补偿。供水单位应当采取措施有效控制生产经营成本。城市供水价格管理办法由国务院价格主管部门会同国务院住房城乡建设主管部门制定。 国务院价格主管部门会同国务院水行政主管部门，根据农村供水的实际情况，健全完善农村供水价格形成机制。 第二十七条 供水单位应当建立供水服务质量投诉处理机制，及时妥善处理用户反映的供水服务质量等问题，并向用户反馈处理结果；用户对处理结果不满意的，可以向供水主管部门投诉，供水主管部门应当及时作出答复。用户也可以就供水服务质量等问题直接向供水主管部门投诉。 第五章 供水设施管理和保护 第二十八条 供水单位对其管理的供水专用水库、引水渠道、取水口、泵站、调压调蓄设施、井群、输（配）水管网、计量器具、净（配）水厂、公用水站等供水设施，应当按照国家有关规定和技术规范运行维护，落实各项安全防范措施，定期巡查检修，开展安全风险监测和隐患排查治理，确保安全运行。 供水单位应当采取供水管网更新改造、供水压力调控、智能化管理等措施，严格控制供水管网漏损。 供水单位维护、抢修供水设施时，任何单位和个人不得阻碍，有关单位应当提供支持和协助。 第二十九条 新建居民住宅的共有供水设施以及地方人民政府组织实施改造后的居民住宅的共有供水设施，依法交由供水单位负责运行维护。对前述规定以外的居民住宅的共有供水设施，县级以上地方人民政府应当组织逐步将其依法交由供水单位负责运行维护。居民住宅共有供水设施交由供水单位负责运行维护的，运行维护费用按照国家有关规定执行。 居民住宅以外的其他建筑物配套建设的调压调蓄设施等供水设施委托供水单位负责运行维护的，运行维护费用由委托方承担，不得计入供水成本。 调压调蓄设施的运行维护应当符合国家有关规定和技术规范。有关运行维护单位应当建立完善管理制度，定期进行清洗消毒、水质检测并公开水质信息，确保水质、水压符合国家有关标准。 第三十条 县级以上地方人民政府根据实际需要，划定供水设施的地面和地下安全保护范围。在安全保护范围内，禁止实施下列危害供水设施安全的活动： （一）挖坑取土； （二）修建建筑物、构筑物； （三）堆放或者倾倒易燃、易爆、有毒有害物品或者腐蚀性、放射性、传染性物质； （四）其他危害供水设施安全的活动。 第三十一条 任何单位和个人不得擅自改装、拆除或者迁移供水设施。 因工程建设确需改装、拆除或者迁移供水设施的，建设单位应当与供水单位协商，确定工程方案，并采取措施保障供水设施的安全稳定运行，改装、拆除、迁移和采取措施的费用由建设单位承担。建设单位应当在开工的15日前向供水主管部门报告。 改装、拆除或者迁移供水设施涉及消防给水用水设施的，应当符合消防技术标准且不影响火灾扑救和消防应急救援；供水单位应当事先通知当地消防救援机构。 第三十二条 建设工程开工前，建设单位或者施工单位应当查明工程建设范围内地下供水设施的相关情况。供水单位和有关档案机构等单位应当及时提供相关资料。 建设工程施工可能影响供水设施安全的，建设单位或者施工单位应当事先与供水单位商定相应的保护措施，由施工单位负责实施。 第三十三条 产生或者使用有毒有害物品或者腐蚀性、放射性、传染性物质的单位，不得将其生产用水设施与供水单位的供水设施直接连接。 禁止擅自将自行建设的供水设施与供水单位的供水设施连接；因特殊情况确需连接的，应当经供水单位同意，并在连接处采取必要的防护措施。 未经供水单位同意，不得在供水设施上直接装泵抽水。 第三十四条 供水设施信息系统的运行维护单位应当建立健全网络安全管理制度，落实网络安全防护措施等安全要求；对其中的重要网络设施、信息系统等，依法纳入关键信息基础设施范围实行重点保护。 第三十五条 供水主管部门、其他有关部门应当按照职责分工，加强对供水经营和服务、供水设施运行维护等情况的监督检查，规范监督检查行为。供水主管部门、其他有关部门应当加强协调配合，能够实行联合检查的实行联合检查，能够通过使用非接触式技术手段等进行非现场检查的，不进行现场检查。 供水主管部门、其他有关部门根据需要对供水单位进行现场检查的，可以要求有关单位、个人就相关事项作出说明，查阅、复制相关资料，查询、检查相关信息系统，并可以开展现场检测。有关单位、个人应当予以配合，不得拒绝、阻碍。 第六章 供水应急管理与处置 第三十六条 县级以上地方人民政府应当依法制定本地区供水应急预案，统筹供水应急物资储备与调度，定期组织开展供水应急演练。 第三十七条 供水单位应当根据本地区供水应急预案制定本单位具体供水应急预案，配备相应的供水应急物资，定期开展供水应急演练。 供水单位应当加强供水安全风险管控，落实各项安全防范措施，及时排查和消除供水安全隐患。 第三十八条 影响供水安全的突发事件发生后，县级以上地方人民政府应当立即启动应急响应，根据突发事件的具体情况组织开展应急供水、污染处置、水源切换等工作，优先保证生活用水，兼顾其他各项用水，最大限度减轻突发事件的影响。 县级以上地方人民政府有关部门应当按照本级人民政府统一部署，做好供水应急处置各项工作。 第三十九条 影响供水安全的突发事件发生后，供水单位应当根据突发事件的具体情况，采取抢修供水设施、增加水源预处理设施、升级改造净水设施处理工艺等应急处置措施，保障正常供水。因特殊情况确实无法正常供水的，供水单位可以采取减量供水、降压供水等措施，及时向用户告知用水注意事项，并向供水主管部门报告。 第四十条 有关单位和个人应当配合地方人民政府、供水单位采取的供水应急处置措施，积极参加应急处置工作，协助维护社会秩序。 第七章 法律责任 第四十一条 调水工程管理单位未对调水工程设施设备进行监测、检查、巡查、维修、养护或者未采取措施保障调水水质的，由水行政主管部门责令改正，可以处5万元以下的罚款；拒不改正或者造成严重后果的，处5万元以上50万元以下的罚款。 调水工程管理单位未按照规定将可能影响正常调水的情形通报受水区有关县级以上地方人民政府的，由水行政主管部门给予警告，可以处5万元以下的罚款；造成严重后果的，处5万元以上50万元以下的罚款。 第四十二条 供水单位未向社会公开供水报装接入流程、服务标准、水质检测等信息的，由供水主管部门责令改正；拒不改正的，处2万元以上10万元以下的罚款。 第四十三条 供水单位有下列情形之一的，由供水主管部门责令改正，可以处5万元以下的罚款；拒不改正或者造成严重后果的，处5万元以上50万元以下的罚款： （一）不具备本条例规定的条件从事供水经营和服务； （二）未遵守供水有关服务标准、规范、要求； （三）未按照规定检测原水、出厂水、管网水的水质； （四）发现原水水质不符合国家有关标准的，未采取措施或者未向供水主管部门报告； （五）供水管网的压力不符合国家规定的标准； （六）擅自停止供水，或者确需临时停止供水时未向社会公告或者书面通知用户； （七）未按照规定对其管理的供水设施进行运行维护； （八）在供水设施发生故障后未及时抢修。 调压调蓄设施的运行维护不符合国家有关规定和技术规范的，由供水主管部门、疾病预防控制部门按照职责分工，依照前款规定予以处罚。 供水单位使用不符合国家卫生标准和卫生规范或者未依法取得卫生许可的涉及饮用水卫生安全的产品的，由县级以上人民政府疾病预防控制部门责令改正，可以处5万元以下的罚款；拒不改正或者造成严重后果的，处5万元以上20万元以下的罚款。 第四十四条 建设单位或者施工单位未在开工前查明工程建设范围内地下供水设施的相关情况，或者未事先与供水单位商定相应的保护措施的，由供水主管部门责令停止施工、限期改正或者采取其他补救措施，给予警告，对单位可以处5万元以下的罚款，对个人可以处1万元以下的罚款；拒不改正或者情节严重的，对单位处5万元以上30万元以下的罚款，对个人处1万元以上5万元以下的罚款。 第四十五条 有下列影响供水安全行为之一的，由供水主管部门责令停止违法行为，恢复原状或者采取其他补救措施，对单位可以处5万元以下的罚款，对个人可以处1万元以下的罚款；拒不改正或者情节严重的，对单位处5万元以上50万元以下的罚款，对个人处1万元以上5万元以下的罚款；有违法所得的，没收违法所得；严重影响供水安全的，可在一定时间内停止供水： （一）在供水设施的地面和地下安全保护范围内实施本条例规定的危害供水设施安全的活动； （二）擅自改装、拆除或者迁移供水设施； （三）产生或者使用有毒有害物品或者腐蚀性、放射性、传染性物质的单位将其生产用水设施与供水单位的供水设施直接连接； （四）擅自将自行建设的供水设施与供水单位的供水设施连接； （五）未经供水单位同意在供水设施上直接装泵抽水。 第四十六条 地方各级人民政府、县级以上人民政府有关部门工作人员在供水工作中玩忽职守、滥用职权、徇私舞弊的，依法给予处分。 第四十七条 违反本条例规定，给他人造成损害的，依法承担民事责任；构成违反治安管理行为的，由公安机关依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第八章 附 则 第四十八条 城市企事业单位以其自行建设的供水管道及其附属设施向本单位以外的城市用水单位和个人提供生活和公共服务用水的，纳入城市供水管理。 第四十九条 县级以上地方人民政府应当采取措施，推动农村规模化供水以外的农村供水规范化建设和专业化管护，建立健全水质保障体系，保障供水符合国家有关标准。农村规模化供水以外的农村供水管理办法由国务院水行政主管部门会同国务院有关部门制定。 第五十条 本条例自2026年6月1日起施行。《城市供水条例》同时废止。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"},{"slug":"regulation-20251011-430d7532","title":"密云水库水源保护条例","publish_date":"2025-10-11"}],"updated_at":"2026-11-16T09:21:19.695Z"},{"slug":"policy-20260210-3dce4cb2","title":"关于开展传统村落特色保护区建设工作的通知","type":"policy","type_label":"政策","issuer":"财政部办公厅 住房城乡建设部办公厅","doc_no":"财办建〔2026〕5号","publish_date":"2026-02-10","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202602/content_7057573.htm","summary":"技艺，培育传统建筑工匠；挖掘和传承当地特色文化、乡风民俗、祖传家训、民间艺术等历史文化资源，编写村史村志；开展数字化保护；实施风貌整治，优化传统村落公共环境；完善与传统村落特色保护区建设密切相关的","themes":["传统村落","文化遗产"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>关于开展传统村落特色保护区建设工作的通知 财办建〔2026〕5号 各省、自治区、直辖市财政厅（局）、住房和城乡建设厅（委、管委），北京市农业农村局： 为深入贯彻习近平总书记关于传统村落保护的重要指示精神，落实党中央、国务院决策部署，财政部、住房城乡建设部支持开展传统村落特色保护区建设工作。现将有关事项通知如下： 一、总体要求 （一）总体思路。以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大和二十届历次全会精神，落实《中共中央 国务院关于进一步深化农村改革 扎实推进乡村全面振兴的意见》要求，扎实推进传统村落特色保护区建设。 （二）工作原则。坚持“守护中华农耕文明，传承优秀传统文化”的初心使命，以“保护为先、利用为基、传承为本”为工作原则，按照“村民主体、政府引导、社会助力”的方法路径，有针对性、系统地挖掘、保护、利用、传承有形文化遗产和无形文化遗产，实现留住乡亲、护住乡土、记住乡愁。 （三）工作目标。全面总结前期传统村落集中连片保护利用工作成效，进一步强化中央指导，加强跨省域统筹。2026—2028年，中央财政安排补助资金，支持部分基础条件好、积极性高、特色突出的县（市、区、旗，以下统称县），开展相应主题的传统村落特色保护区建设工作，打造一系列优秀的国家级文化名片，推动优秀传统文化创造性转化、创新性发展，让根植于农耕文明的中华文明生生不息。 二、支持方式 财政部、住房城乡建设部创新支持方式，优化中央顶层设计、加强省级统筹规划、压实县级主体责任，整体推进传统村落特色保护区建设工作。 （一）优化顶层设计。2026—2028年，住房城乡建设部、财政部综合考虑国家重大文化主题、传统文化特色和地域特征等因素，分年度确定传统村落特色保护区建设主题，对风貌接近、文化同源、习俗相似的传统村落片区进行统一规划，跨省域打造传统村落特色保护区。住房城乡建设部、财政部推动加强省际联动，统筹整合乡村振兴、文化旅游、文物保护等资源，引导不同省份聚焦相同优秀传统文化主题，有序推进传统村落特色保护区建设。 （二）加强省级统筹。省级财政部门、住房城乡建设部门围绕国家层面确定的建设主题，分年度选择适合本省份实际的1—2个主题，推荐符合条件的县申报承担相应主题建设任务，每个县申报1个主题。相关省份一般可以推荐不超过2个县参评，个别省份2026年申报数量根据重点绩效评价结果调整（见附件1）。“十四五”期间获得过中央财政传统村落集中连片保护利用补助资金支持的县不再予以支持。省级住房城乡建设部门应分类确定不同县的政策定位、建设主题、发展路径等，指导相关县科学编制工作方案，做到主题鲜明、特色突出、错位发展，避免相关县各自为政、同质化建设。 （三）压实县级责任。2026—2028年，分三批支持若干县，每批县的建设期为两年。县级人民政府须按照专家评审通过的工作方案开展具体工作，结合地方经济社会发展情况、文化要素特征、村民生产生活需求等优化项目选择，加快项目建设和资金使用进度；加强机制建设和经验探索，完善法规制度、规划标准、投融资机制及相关配套政策，建立以村民为主体的保护机制，增强传统村落内生发展动力。 三、支持内容 （一）支持标准。中央财政对入选县给予定额补助，每个县的补助标准为5000万元，资金分两年下达。 （二）支持内容。中央财政资金可用于支持保护修缮公共传统建筑，传承传统建筑营造技艺，培育传统建筑工匠；挖掘和传承当地特色文化、乡风民俗、祖传家训、民间艺术等历史文化资源，编写村史村志；开展数字化保护；实施风貌整治，优化传统村落公共环境；完善与传统村落特色保护区建设密切相关的基础设施和公共服务设施（如水、电、路、气、垃圾、污水、消防、防灾减灾等设施）；因地制宜发展特色产业等。中央财政资金不得用于“栽盆景、搭风景”等形象工程，坚持不搞大拆大建，注重乡土味道，保留乡村风貌。相关县要统筹使用好中央和地方相关资金，避免面面俱到、“撒胡椒面”。 四、组织实施 （一）组织申报。2026—2028年，每年由省级财政部门、住房城乡建设部门指导相关县编制工作方案，联合行文报送财政部、住房城乡建设部。申报材料不得包含任何涉密文件、涉密内容，除报送两部门的正式文件外，申报县实施方案及相关支撑材料一律报送电子版。2026年传统村落特色保护区申报要求见附件1，传统村落特色保护区建设（2026年）工作方案编制参考大纲见附件2，相关材料请于2026年3月15日前报财政部、住房城乡建设部。 （二）竞争性评审。住房城乡建设部、财政部组织专家对地方申报材料及相关佐证材料进行书面评审，根据得分确定入围名单，按程序进行公示后，确定纳入支持范围的相关县。 （三）日常监督和绩效管理。住房城乡建设部、财政部将定期调度纳入支持范围的相关县工作完成情况，及时总结推广传统村落保护利用可复制可推广经验。省级住房城乡建设部门、财政部门要指导相关县制定绩效目标（参照附件3传统村落特色保护区绩效指标体系），督促相关县开展绩效自评，于每年3月底前以省为单位将前一年的绩效自评情况报送住房城乡建设部、财政部。对工作过程中出现的问题，请及时与住房城乡建设部、财政部联系。 （四）工作要求。各申报县应按要求编制工作方案，坚持勤俭节约、务实高效。各地不得委托财政部、住房城乡建设部及其所属行政、企事业单位和工作人员以任何方式（署名或者不署名）参与工作方案的编制工作；不得简单交给中介机构或技术团队“编本子、讲故事”，印制豪华材料。请各地严格按照本通知明确的数量和要求，做好拟支持县的推荐、材料报送等工作，并对报送内容真实性负责。对不按要求报送或申报内容明显不实的县，将取消当年申报资格。 联系方式： 财政部经济建设司 电话：010—68552522，邮箱：jjstzc@sina.com 住房城乡建设部村镇建设司 电话：010—58934567，邮箱：18910827596@163.com 财政部办公厅 住房城乡建设部办公厅 2026年2月4日 附件下载： 附件1.2026年传统村落特色保护区申报要求 附件2.传统村落特色保护区建设（2026年）工作方案编制参考大纲 附件3.传统村落特色保护区绩效指标体系\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"},{"slug":"policy-20260722-0a559bf3","title":"关于印发《林业草原保护利用“十五五”规划》的通知","publish_date":"2026-07-22"},{"slug":"policy-20260714-89672b7a","title":"国务院办公厅关于转发生态环境部等部门《群众身边水体保护治理行动方案》的通知","publish_date":"2026-07-14"}],"updated_at":"2026-11-16T09:21:19.728Z"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第830号","publish_date":"2026-02-09","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202602/content_7057533.htm","summary":"2026年2月3日　　　　   中华人民共和国自然保护区条例 （1994年10月9日中华人民共和国国务院令第167号发布　根据2011年1月8日《国务院关于废止和修改部分行政法规的决定》第一次修订　根据","themes":["自然保护区","生态保护"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第830号 《中华人民共和国自然保护区条例》已经2026年1月9日国务院第77次常务会议修订通过，现予公布，自2026年3月15日起施行。 总理 李强 2026年2月3日 中华人民共和国自然保护区条例 （1994年10月9日中华人民共和国国务院令第167号发布 根据2011年1月8日《国务院关于废止和修改部分行政法规的决定》第一次修订 根据2017年10月7日《国务院关于修改部分行政法规的决定》第二次修订 2026年2月3日中华人民共和国国务院令第830号第三次修订） 第一章 总 则 第一条 为了高质量推进自然保护区建设，加强对自然保护区的保护和管理，全面推进生态文明和美丽中国建设，加快推进人与自然和谐共生的现代化，制定本条例。 第二条 在中华人民共和国领域及管辖的其他海域设立自然保护区、开展自然保护区保护和管理及相关活动，适用本条例。 本条例所称自然保护区，是指由国务院或者省、自治区、直辖市人民政府批准设立，以保护典型的自然生态系统、珍稀濒危野生动植物物种的天然集中分布区、有特殊意义的自然遗迹等为主要目的，实现自然资源科学保护和合理利用的特定陆地和海洋区域。 第三条 自然保护区建设应当贯彻党和国家路线方针政策、决策部署，践行绿水青山就是金山银山理念，坚持以人民为中心的发展思想，坚持生态保护第一、统筹保护和发展，坚持因地制宜、突出特色，构建政府主导、多方参与、社会共享的机制，实现生态保护、绿色发展、民生改善相统一。 第四条 国务院和自然保护区所在地县级以上地方人民政府应当加强对自然保护区建设的统筹协调，完善支持自然保护区建设的政策措施，将自然保护区建设纳入国民经济和社会发展相关规划。 第五条 国家建立多元化自然保护区资金保障制度。县级以上人民政府应当按照财政事权与支出责任划分原则将自然保护区管理工作所需经费列入本级预算。 国家鼓励通过设立基金、捐赠、资助等方式，为自然保护区建设提供支持。 第六条 国务院林业草原主管部门负责全国自然保护区的监督管理工作。国务院自然资源、生态环境、水行政、农业农村、交通运输等有关部门在各自职责范围内负责自然保护区的有关监督管理工作。 县级以上地方人民政府林业草原主管部门负责本行政区域内自然保护区的监督管理工作。县级以上地方人民政府其他有关部门在各自职责范围内负责自然保护区的有关监督管理工作。 按照规定设立的各自然保护区管理机构依照本条例和规定的职责，负责各该自然保护区的保护和管理工作。 第七条 国务院林业草原主管部门和有关部门按照职责建立健全自然保护区相关技术规范和标准体系，依法组织制定并适时修订自然保护区相关技术规范和标准。 第八条 国家鼓励和支持自然保护区相关科学技术研究开发和应用推广，加强自然保护区相关专业人才培养，强化科技创新对自然保护区建设的支撑作用。 第九条 国务院林业草原主管部门和有关部门、自然保护区所在地县级以上地方人民政府及其有关部门、自然保护区管理机构应当组织开展多种形式的自然保护区保护宣传教育活动。 新闻媒体应当开展自然保护区保护公益宣传，依法进行舆论监督。 第十条 国家通过多种方式，支持和促进自然保护区领域的国际交流合作。 第二章 自然保护区的设立 第十一条 设立自然保护区应当具有下列条件之一： （一）典型的自然地理区域、自然生态系统区域以及已经遭受破坏但经保护和修复能够恢复的同类自然生态系统区域； （二）珍稀濒危野生动植物物种的天然集中分布区； （三）具有特殊保护价值的海域、海岸、岛屿、湿地、内陆水域、森林、草原和荒漠； （四）具有重大科学文化价值的地质剖面、地质构造、古生物化石集中分布区、地貌景观、地质灾变遗迹等自然遗迹； （五）需要予以特殊保护的其他自然区域。 设立自然保护区，应当充分听取有关方面意见，妥善处理与当地经济社会发展和居民生产生活的关系。 第十二条 自然保护区分为国家级自然保护区和省级自然保护区。 在国内外有典型意义、在科学上有重大国际影响或者有特殊科学研究价值的自然保护区，以及涉及国家海洋权益的自然保护区，列为国家级自然保护区。其他自然保护区列为省级自然保护区。 第十三条 拟设立国家级自然保护区的，由拟设立的自然保护区所在地省、自治区、直辖市人民政府或者国务院有关部门提出申请，由国务院林业草原主管部门会同有关部门组织评审后，提出审批建议，报国务院批准。 拟设立省级自然保护区的，由拟设立的自然保护区所在地设区的市、县级人民政府提出申请，由省、自治区、直辖市人民政府林业草原主管部门会同有关部门组织评审后，提出审批建议，报省、自治区、直辖市人民政府批准，并抄送国务院林业草原主管部门和有关部门。 拟设立的自然保护区跨两个以上行政区域的，除由国务院有关部门提出申请的外，由有关行政区域人民政府协商一致后提出申请，按照本条第一款或者第二款规定的程序审批。 第十四条 国家级自然保护区以所在地地名加“国家级自然保护区”命名；省级自然保护区以所在地地名加“省级自然保护区”命名。有特殊保护对象的自然保护区，可以在所在地地名后加特殊保护对象的名称。 第十五条 自然保护区区域范围的划定应当统筹考虑自然生态系统等保护对象分布区域的完整性、管理可行性和周边经济社会发展的需要，坚持实事求是、科学合理，经过充分调查和科学论证。 自然保护区区域范围内不再保留自然公园类自然保护地。自然保护区全部划入国家公园区域范围的，不再保留；部分划入的，未划入部分经科学评估并按照规定程序批准，予以整合或者撤销。 第十六条 自然保护区划分为核心保护区和一般控制区，实行分区管控。 自然保护区的下列区域应当划为核心保护区： （一）自然生态系统保存完整或者生态脆弱需要休养生息的区域； （二）珍稀濒危野生动植物物种的关键分布区域以及生态廊道重要节点； （三）重要自然遗迹的集中分布区域； （四）其他需要重点保护的区域。 核心保护区以外的区域划为一般控制区。 第十七条 设立自然保护区后，自然保护区所在地省、自治区、直辖市人民政府应当按照有关规定及时组织完成自然保护区勘界；涉及国家海洋权益的自然保护区，由国务院有关部门组织完成勘界。自然保护区管理机构应当根据保护和管理需要及时设置自然保护区界碑界桩、电子标识或者电子围栏等界线标志。 禁止损毁、涂改、遮挡或者擅自拆除、移动自然保护区界线标志。 第十八条 国家级自然保护区、省级自然保护区的名称、区域范围、管控分区分别由国务院和所在地省、自治区、直辖市人民政府在批准设立时一并批复，并分别由国务院林业草原主管部门和所在地省、自治区、直辖市人民政府林业草原主管部门依法公布。 国务院林业草原主管部门和省、自治区、直辖市人民政府林业草原主管部门应当与有关部门共享自然保护区区域范围、管控分区坐标等信息。 第十九条 因自然保护区主要保护对象生存环境发生重大改变，确需调整自然保护区区域范围的，应当按照自然保护区设立的程序，经原批准设立该自然保护区的人民政府批准。自然保护区变更名称，按照前述程序办理。 国家级自然保护区、省级自然保护区调整管控分区，应当分别经国务院林业草原主管部门和所在地省、自治区、直辖市人民政府林业草原主管部门会同同级有关部门组织评审后批准。 自然保护区设立后，原则上不得撤销；因特殊情形失去保护价值的，经原批准设立该自然保护区的人民政府批准，可以撤销。 第三章 自然保护区的保护和管理 第二十条 国家坚持山水林田湖草沙一体化保护，按照自然生态系统特性和内在规律，对自然保护区实行整体保护、系统修复、综合治理。 第二十一条 自然保护区管理机构在综合科学考察和专项调查的基础上，根据需要组织编制所管理自然保护区的相关规划（以下称自然保护区规划），明确保护和管理的目标任务、保护对象、管理要求、保护措施等事项，并对原有居民生产生活活动等作出安排。组织编制自然保护区规划，应当广泛听取有关方面意见、深入论证。 国家级自然保护区规划经所在地省、自治区、直辖市人民政府林业草原主管部门审查同意后，报国务院林业草原主管部门批准实施；涉及国家海洋权益的自然保护区规划，经国务院有关部门审查同意后，报国务院林业草原主管部门批准实施。省级自然保护区规划报所在地省、自治区、直辖市人民政府林业草原主管部门批准实施。规划审批前，应当征求同级有关部门意见。 自然保护区规划应当与国民经济和社会发展规划、国土空间总体规划等相衔接，并纳入国土空间规划实施监督信息系统，接受统一监管。自然保护区规划应当依法公开。 第二十二条 自然保护区管理机构应当依据法律、法规、国家有关规定和自然保护区规划，健全完善自然保护区保护和管理的规章制度，加强自然保护区日常保护和管理工作。 自然保护区区域内的单位、个人以及进入自然保护区的人员，应当遵守法律、法规、自然保护区保护和管理的规章制度，接受自然保护区管理机构的管理。 第二十三条 对自然保护区区域内的自然资源，按照国家自然资源确权登记有关规定进行确权登记，确权登记时应当将自然保护区作为独立登记单元。 第二十四条 国家加强自然保护区监测网络体系建设，充分发挥各类监测站点的作用，运用信息化手段加强监测数据集成分析、共享和综合应用，全面掌握自然生态系统构成、分布、动态变化和生物多样性状况以及生态环境质量、人为活动干扰情况，及时评估和预警生态风险。 第二十五条 自然保护区区域内受损自然生态系统修复、生态廊道连通、重要栖息地恢复等应当坚持自然恢复为主；确有必要开展种群调控、树种更新等人工修复活动的，应当充分听取有关方面意见，按照有关规定制定科学合理的修复方案并依法实施。 自然保护区管理机构应当采取措施，加强对外来物种入侵的防范和应对，维护生态系统安全，提高生态系统质量。 第二十六条 除下列活动外，自然保护区核心保护区内禁止人为活动： （一）为保护自然保护区开展的调查监测、生态修复、管护巡护等活动，科研观测、基础测绘、文物和其他文化遗产保护、防灾减灾、应急救援活动，以及国家机关依法履行执法职责确需开展的活动； （二）原有居民必要的生产生活活动，以及确需保留、无法避让的已有重要基础设施的运行、维护、改造； （三）必须且无法避让、以生态环境无害化方式穿越地下、水下或者空中的线性基础设施建设； （四）为维护国家安全、实施国家重大战略确需开展的活动，以及无法避让的国家重大项目建设； （五）法律、行政法规规定或者国务院批准的其他活动。 第二十七条 自然保护区一般控制区内仅允许开展下列人为活动： （一）核心保护区允许开展的活动； （二）符合国土空间规划且无法避让的重要基础设施的建设、运行和维护； （三）古生物化石调查发掘，基础地质调查，战略性矿产资源远景调查和规定范围内的战略性矿产资源勘查； （五）与自然保护区保护目标一致的人工商品林抚育、树种更新等森林经营活动； （六）科普宣传、生态旅游、教育文化体育等公共服务活动； （七）法律、行政法规规定或者国务院批准的其他活动。 第二十八条 对下列情形的自然保护区，经科学论证，在确保主要保护对象安全和不损害生态功能的前提下，可以实行差别化管控措施： （一）主要保护对象为自然遗迹的自然保护区，可以在核心保护区建设必要的防护、陈列、展示等设施，开展古生物化石调查发掘以及适度的科普宣传、生态旅游、教育文化体育等公共服务活动； （二）主要保护对象位于地下的自然保护区，其核心保护区地上部分可以按照一般控制区保护和管理； （三）自然生态过程、主要保护对象生息繁衍具有明显季节性变化规律的自然保护区，可以实行季节性差别管控措施。 第二十九条 自然保护区区域内原有居民的生产生活活动，应当以不超出现有规模和利用强度、合理改善生产生活条件为前提。 根据保护和管理需要，自然保护区区域内原有居民确有必要迁出的，由有关地方人民政府妥善安置。 第三十条 未经批准，外国人不得在自然保护区区域内从事标本采集等活动。 第三十一条 在自然保护区开展本条例第二十六条、第二十七条、第二十八条规定的活动，依法需要办理相关手续的，有关单位和个人应当依法办理；涉及修筑设施的，还应当经国务院林业草原主管部门或者所在地省、自治区、直辖市人民政府林业草原主管部门同意，但原有居民必要的生产生活活动、原有线性基础设施的运行维护活动以及自然保护区管理机构依据自然保护区规划修筑管护巡护、科研观测、科普宣传、防灾减灾等设施的除外。 在自然保护区开展调查监测、科研观测、标本采集的单位和个人，应当按照自然保护区管理机构的要求，提交相关活动成果。在自然保护区开展本条例第二十六条、第二十七条、第二十八条规定的活动，应当采取必要措施，避免或者减少对自然生态系统、生态廊道、重要栖息地以及自然和人文景观的不利影响。自然保护区管理机构应当根据实际情况和需要，明确开展相关活动的边界、强度以及应当采取的保护性措施等。 第三十二条 自然保护区管理机构应当建立日常巡护制度，合理配备巡护人员和巡护装备，加强巡护站点建设。巡护人员应当观察和记录主要保护对象生境状况及其变化情况，对违反自然保护区保护和管理规定的行为予以劝阻、制止并及时报告。 第三十三条 自然保护区管理机构应当制定自然保护区突发事件应急预案，加强与所在地人民政府有关部门的协作配合，做好防灾减灾、安全管理和应急保障相关工作，提升应急保障能力。 第三十四条 自然保护区管理机构应当在确保生态得到保护的前提下，完善自然保护区公共服务体系，提升公共服务功能。自然保护区一般控制区可以划定适当区域，设置必要的辅助设施设备，为开展相关科学研究、科普宣传、生态旅游、教育文化体育等公共服务活动提供支持。 自然保护区管理机构应当加强自然保护区访客管理和服务，合理确定访客容量，明确访客行为规范，按照国家有关规定提供必要的无障碍服务，完善访客安全保障和紧急救助等相关机制。 自然保护区区域内不得开设与保护目标不一致的参观、旅游等项目。 第三十五条 县级以上人民政府林业草原主管部门，自然资源、生态环境、水行政、农业农村等有关部门，以及自然保护区管理机构，应当依据职责加强对自然保护区保护情况的监督检查，依法查处违法行为。 海警机构依照《中华人民共和国海警法》的规定，在职责范围内对自然保护区区域内海岸线向海一侧的保护情况进行监督检查，依法查处违法行为。 监督检查人员开展监督检查，应当主动出示执法证件。被检查单位和个人应当予以配合，不得拒绝、阻碍。 公安机关可以根据需要在自然保护区设置工作站点，开展生态警务工作。 有关国家机关依法在自然保护区履行法定职责的，自然保护区管理机构应当提供必要便利。 第三十六条 对违反自然保护区保护和管理规定的行为，任何单位和个人有权向自然保护区管理机构或者有关部门举报，接到举报的自然保护区管理机构和有关部门应当依法及时处理。 第三十七条 自然保护区管理机构应当依法及时公开自然保护区保护和管理等工作情况，自觉接受社会监督和舆论监督。 第四章 法律责任 第三十八条 自然保护区管理机构、县级以上地方人民政府及其有关部门、国务院有关部门工作人员在自然保护区保护和管理等工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分。 第三十九条 损毁、涂改、遮挡或者擅自拆除、移动自然保护区界线标志的，由自然保护区管理机构责令停止违法行为、采取补救措施，可以处2万元以下的罚款；造成损失的，依法承担赔偿责任。 在自然保护区开展调查监测、科研观测、标本采集的单位和个人，未向自然保护区管理机构提交相关活动成果的，由自然保护区管理机构责令改正，可以处5000元以下的罚款。 第四十条 在自然保护区核心保护区内开展本条例第二十六条规定以外的活动的，由县级以上人民政府林业草原、自然资源、生态环境、水行政、农业农村等有关部门按照职责分工责令停止违法行为，没收违法所得，可以处10万元以下的罚款；属于违法修筑设施或者进行工程建设的，责令限期拆除、恢复原状，处10万元以上100万元以下的罚款；造成生态破坏的，责令限期修复或者采取其他补救措施，处100万元以上500万元以下的罚款。 第四十一条 在自然保护区一般控制区内开展本条例第二十七条规定以外的活动的，由县级以上人民政府林业草原、自然资源、生态环境、水行政、农业农村等有关部门按照职责分工责令停止违法行为，没收违法所得，可以处5万元以下的罚款；属于违法修筑设施或者进行工程建设的，责令限期拆除、恢复原状，处5万元以上50万元以下的罚款；造成生态破坏的，责令限期修复或者采取其他补救措施，处50万元以上200万元以下的罚款。 第四十二条 自然保护区区域内原有居民违反本条例第二十九条第一款规定开展生产生活活动的，由自然保护区管理机构责令改正，根据情节轻重可以处2000元以下的罚款。 第四十三条 在自然保护区区域内开展本条例第二十六条、第二十七条、第二十八条规定的活动，未采取必要措施避免或者减少对自
