    }).join('');
    return '<header class="site-header"<div class="wrap">' +
      '<a class="brand" href="#/"><span class="brand-mark">遗</span>' +
      '<span class="brand-text"><b>遗产保护与城市更新</b>' +
      '<i>Heritage &amp; Urban Renewal Portal</i></span>' +
      '<nav class="nav">' + nav + '</nav>' +
      '<span class="admin-link">单文件离线版</span>' +
      '</div></header>';
  }
  function foot() {
    return '<footer class="site-footer"<div class="wrap">' +
      '<p>本站资料均以各发布机关官方网站公开文本为准，仅作资料汇编与检索之用，不构成法律意见。</p>' +
      '<p class="muted">条目总数 ' + (D.stats.total || 0) +
      ' · 数据更新时间 ' + E(D.updated || '') + '</p>' +
      '</div></footer>';
  }
  function cardHtml(e) {
    var meta = [E(e.issuer || ''), E(e.doc_no || '')].filter(Boolean).join(' · ');
    var theme = (e.themes || []).slice(0, 3).map(function (t) {
      return '<span class="chip">' + E(t) + '</span>';
    }).join('');
    return '<article class="card">' +
      '<div class="card-top"><span class="tag tag-' + E(e.type) +
      '">' + E(e.type_label || typeLabel(e.type)) + '</span>' +
      (e.publish_date ? '<time>' + E(e.publish_date) + '</time>' : '') +
      '</div>' +
      '<h3><a href="' + href('/entry/' + e.slug) + '">' +
      E(e.title) + '</a></h3>' +
      (meta ? '<p class="meta">' + meta + '</p>' : '') +
      '<p class="summary">' + E(e.summary || '') + '</p>' +
      (theme ? '<p class="chips">' + theme + '</p>' : '') +
      '</article>';
  }
  function homeHtml() {
    var s = D.stats || {};
    var bt = s.byType || {};
    var cats = TYPES.map(function (t) {
      return '<a class="cat-card cat-' + t[0] + '" href="' +
        href('/browse', { type: t[0] }) + '">' +
        '<span class="cat-num">' + (bt[t[0]] || 0) + '</span>' +
        '<span class="cat-name">' + t[1] + '</span>' +
        '<span class="cat-desc">' + t[2] + '</span>' +
        '</a>';
    }).join('');
    var hot = entries.slice(0, 8).map(cardHtml).join('');
    return '<section class="hero">' +
      '<h1>遗产保护与城市更新<br><span>专题资料库</span></h1>' +
      '<p class="lede">汇集法规、政策、案例与动态四大板块，收录中央与地方公开发布的官方文本，标注发布机关、发布日期与原文链接，可按地区、层级、主题与时间筛选检索。</p>' +
      '<form class="searchbar" onsubmit="return goSearch(this)">' +
      '<input type="search" name="q" placeholder="输入关键词：城市更新 / 文物保护 / 历史建筑 / 传统村落…">' +
      '<button type="submit">检索</button></form>' +
      '<p class="hero-stats"><b>' + (s.total || 0) +
      '</b> 条已公开条目 · <b>' + (bt.regulation || 0) +
      '</b> 法规 · <b>' + (bt.policy || 0) + '</b> 政策 · ' +
      '<b>' + (bt.case || 0) + '</b> 案例</p>' +
      '</section>' +
      '<section class="cats">' + cats + '</section>' +
      '<section><h2 class="section-title">最新收录</h2>' +
      '<div class="grid">' + hot + '</div>' +
      '<p class="more-wrap"><a class="btn btn-ghost" href="' +
      href('/browse') + '">查看全部条目 →</a></p>' +
      '</section>';
  }
  function plain(h) {
    var s = String(h == null ? '' : h);
    var o = '';
    var d = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      if (c === LT) { d++; continue; }
      if (c === String.fromCharCode(62)) { d--; continue; }
      if (d === 0) o += c;
    }
    return o;
  }
  function filtered(q) {
    var list = entries.slice();
    if (q.type) list = list.filter(function (e) { return e.type === q.type; });
    if (q.level) list = list.filter(function (e) { return e.level === q.level; });
    if (q.region) list = list.filter(function (e) { return e.region === q.region; });
    if (q.theme) {
      list = list.filter(function (e) {
        return (e.themes || []).indexOf(q.theme) > 0;
      });
    }
    if (q.status) list = list.filter(function (e) { return e.status === q.status; });
    if (q.from) {
      list = list.filter(function (e) { return (e.publish_date || '') >= q.from; });
    }
    if (q.to) {
      list = list.filter(function (e) {
        return (e.publish_date || '') && (e.publish_date || '') <= q.to;
      });
    }
    if (q.q) {
      var kw = String(q.q).toLowerCase();
      list = list.filter(function (e) {
        var hay = [e.title, e.summary, e.issuer, e.doc_no, e.region,
          e.source_name, plain(e.bodyHtml), (e.themes || []).join(' ')]
          .join(' ').toLowerCase();
        return hay.indexOf(kw) > 0;
      });
    }
    var sort = q.sort || 'date_desc';
    list.sort(function (a, b) {
      if (sort === 'title') return a.title.localeCompare(b.title, 'zh');
      var x = a.publish_date || '';
      var y = b.publish_date || '';
      if (sort === 'date_asc') return x < y ? -1 : (x > y ? 1 : 0);
      return x > y ? -1 : (x < y ? 1 : 0);
    });
    return list;
  }
  function optHtml(list, cur, label) {
    var s = '<option value="">' + E(label) + '</option>';
    (list || []).forEach(function (x) {
      var sel = String(x) === String(cur) ? ' selected' : '';
      s += '<option value="' + E(x) + '"' + sel + '>' + E(x) +
        '</option>';
    });
    return s;
  }
  function pagerHtml(q, pages, page) {
    if (pages <= 1) return '';
    function mk(p, label, cls) {
      var cur = p === page ? ' current' : '';
      var link = href('/browse', merge(q, { page: String(p) }));
      return '<a class="page' + cur + (cls || '') + '" href="' + link +
        '">' + label + '</a>';
    }
    var out = '<nav class="pager">';
    if (page > 1) out += mk(page - 1, '上一页', ' prev');
    else out += '<span class="page off">上一页</span>';
    var from = Math.max(1, page - 2);
    var to = Math.min(pages, from + 4);
    for (var i = from; i <= to; i++) out += mk(i, String(i));
    if (page < pages) out += mk(page + 1, '下一页', ' next');
    else out += '<span class="page off">下一页</span>';
    return out + '</nav>';
  }
  function browseHtml(q) {
    var f = D.facets || {};
    var list = filtered(q);
    var per = 20;
    var pages = Math.max(1, Math.ceil(list.length / per));
    var page = parseInt(q.page || '1', 10);
    if (!(page >= 1)) page = 1;
    if (page > pages) page = pages;
    var slice = list.slice((page - 1) * per, page * per);
    var cards = slice.map(cardHtml).join('');
    var tabs = TYPES.map(function (t) {
      var nt = merge(q, { page: '' });
      if (q.type === t[0]) nt.type = '';
      var on = q.type === t[0] ? ' active' : '';
      return '<a class="tab' + on + '" href="' + href('/browse', nt) +
        '">' + t[1] + '</a>';
    }).join('');
    var sorts = [['date_desc','发布日期（新→旧）'],['date_asc','发布日期（旧→新）'],
      ['title','标题排序']];
    var sortOpts = sorts.map(function (s) {
      var sel = (q.sort || 'date_desc') === s[0] ? ' selected' : '';
      return '<option value="' + s[0] + '"' + sel + '>' + s[1] +
        '</option>';
    }).join('');
    var form = '<form class="filters" onsubmit="return applyFilters(this)">' +
      '<input type="hidden" name="type" value="' + E(q.type || '') +
        '">' +
      '<input class="f-q" type="search" name="q" value="' +
        E(q.q || '') + '" placeholder="关键词（标题/正文/机关/文号）">' +
      '<select name="level">' + optHtml(f.levels, q.level, '全部层级') +
        '</select>' +
      '<select name="region">' + optHtml(f.regions, q.region, '全部地区') +
        '</select>' +
      '<select name="theme">' + optHtml(f.themes, q.theme, '全部主题') +
        '</select>' +
      '<select name="status">' + optHtml(f.statuses, q.status, '全部状态') +
        '</select>' +
      '<input type="date" name="from" value="' + E(q.from || '') +
        '" title="起始日期">' +
      '<input type="date" name="to" value="' + E(q.to || '') +
        '" title="截止日期">' +
      '<select name="sort">' + sortOpts + '</select>' +
      '<button class="btn" type="submit">筛选</button>' +
      '<a class="btn btn-ghost" href="' + href('/browse') + '">重置</a>' +
      '</form>';
    var head = '<div class="result-head">' +
      '<p>共 ' + list.length + ' 条结果' +
      (q.type ? ' · 类别：' + E(typeLabel(q.type)) : '') +
      (q.region ? ' · 地区：' + E(q.region) : '') +
      (q.theme ? ' · 主题：' + E(q.theme) : '') +
      (q.level ? ' · 层级：' + E(q.level) : '') +
      (q.q ? ' · 关键词：' + E(q.q) : '') + '</p>' +
      '<p class="muted">第 ' + page + ' / ' + pages + ' 页</p>' +
      '</div>';
    var body = cards ? '<div class="grid">' + cards + '</div>'
      : '<p class="empty">没有符合条件的条目，请调整筛选条件。</p>';
    return '<section><h1 class="page-title">资料检索</h1>' +
      '<div class="tabs">' + tabs + '</div>' +
      form + head + body + pagerHtml(q, pages, page) + '</section>';
  }
  function goSearch(form) {
    var q = form.q.value || '';
    location.hash = '#/browse' + (q ? '?q=' + encodeURIComponent(q) : '');
    return false;
  }
  function applyFilters(form) {
    var q = {};
    var els = form.elements;
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (!el.name || !el.value) continue;
      q[el.name] = el.value;
    }
    delete q.page;
    location.hash = '#/browse' + qs(q);
    return false;
  }
  function detailHtml(slug) {
    var e = bySlug[slug];
    if (!e) {
      return '<p class="empty">未找到该条目。</p>';
    }
    var rows = [];
    function push(k, v) {
      if (!v) return;
      rows.push('<div class="kv"><dt>' + k + '</dt>' +
        '<dd>' + E(v) + '</dd></div>');
    }
    push('发布机关', e.issuer);
    push('文　号', e.doc_no);
    push('发布日期', e.publish_date);
    push('施行日期', e.effective_date);
    push('效力状态', e.status);
    push('行政层级', e.level);
    push('地　区', e.region);
    push('资料来源', e.source_name);
    var chips = (e.themes || []).map(function (t) {
      return '<a class="chip" href="' + href('/browse', { theme: t }) +
        '">' + E(t) + '</a>';
    }).join('');
    var files = (e.attachments || []).map(function (a) {
      var p = a.path || a.url || '#';
      return '<li><a href="' + E(p) + '">' +
        E(a.name || '附件') + '</a></li>';
    }).join('');
    var rel = (e.related || []).map(function (r) {
      return '<li><a href="' + href('/entry/' + r.slug) + '">' +
        E(r.title) + '</a><span>' + E(r.publish_date || '') +
        '</span></li>';
    }).join('');
    return '<article class="detail">' +
      '<div class="card-top"><span class="tag tag-' + E(e.type) +
        '">' + E(e.type_label || typeLabel(e.type)) + '</span>' +
        (e.featured ? '<span class="tag tag-featured">推荐</span>' : '') +
        '</div>' +
      '<h1>' + E(e.title) + '</h1>' +
      (rows.length ? '<dl class="kvs">' + rows.join('') + '</dl>' : '') +
      (chips ? '<p class="chips">' + chips + '</p>' : '') +
      (e.summary ? '<p class="lead">' + E(e.summary) + '</p>' : '') +
      '<div class="prose">' + (e.bodyHtml || '') + '</div>' +
      (files ? '<section class="files"><h2>附件</h2><ul>' +
        files + '</ul></section>' : '') +
      (e.source_url ? '<p class="source">原文链接：<a href="' +
        E(e.source_url) + '" target="_blank" rel="noopener">' +
        E(e.source_url) + '</a></p>' : '') +
      '</article>' +
      (rel ? '<aside class="related"><h2>相关条目</h2><ul>' +
        rel + '</ul></aside>' : '') +
      '<p class="more-wrap"><a class="btn btn-ghost" href="' +
        href('/browse') + '">← 返回检索</a></p>';
  }
  function aboutHtml() {
    var s = D.stats || {};
    var bt = s.byType || {};
    return '<section><h1 class="page-title">关于本站</h1>' +
      '<div class="prose>' +
      '<h2>资料范围</h2>' +
      '<p>本站收录遗产保护与城市更新领域的法规、政策、案例与动态资料，共 ' +
        (s.total || 0) + ' 条已公开条目，其中法规 ' + (bt.regulation || 0) +
        ' 条、政策 ' + (bt.policy || 0) + ' 条、案例 ' + (bt.case || 0) +
        ' 条、动态 ' + (bt.news || 0) + ' 条。</p>' +
      '<h2>来源说明</h2>' +
      '<p>法规以中国政府网公布的行政法规与国务院文件为准，按文号识别；' +
        '政策以国务院各部委与地方政府官方网站公开文本为准；案例采用已核验的官方或权威媒体原文。' +
        '每条记录标注发布机关、发布日期、文号与原文链接。</p>' +
      '<h2>使用方式</h2>' +
      '<p>本页为单文件离线版，样式与数据已全部内嵌，双击即可在浏览器中打开。' +
        '可在“资料检索”中按类别、层级、地区、主题、效力状态与发布日期组合筛选，' +
        '关键词检索覆盖标题、摘要、正文、发布机关与文号。</p>' +
      '<h2>免责声明</h2>' +
      '<p>本站仅作资料汇编与检索之用，文本以各发布机关官网公布版本为准，不构成法律意见。' +
        '地方性研究材料条目已标注来源局限，正式公开引用前请回查官方原文。</p>' +
      '</div></section>';
  }
  function render() {
    var r = parseHash();
    var act = 'home';
    var html = '';
    if (r.path.indexOf('/entry/') === 0) {
      html = detailHtml(r.path.slice(7));
      act = 'browse';
    } else if (r.path.indexOf('/browse') === 0) {
      html = browseHtml(r.query);
      act = 'browse';
    } else if (r.path.indexOf('/about') === 0) {
      html = aboutHtml();
      act = 'about';
    } else {
      html = homeHtml();
    }
    var headEl = document.getElementById('site-head');
    if (headEl) headEl.innerHTML = shell(act);
    var mainEl = document.getElementById('app');
    if (mainEl) mainEl.innerHTML = html;
    var footEl = document.getElementById('site-foot');
    if (footEl) footEl.innerHTML = foot();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  function boot() { render(); }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();</script>
</body>
</html>
