地省级财政共同承担，中央财政承担补偿资金总额的70%。 蓄滞洪区运用后，补偿资金应当及时、足额拨付到位。资金管理办法由国务院财政主管部门会同水行政主管部门制定。 第二十条 蓄滞洪区所在地县级人民政府在补偿资金预算下达后，应当及时制定具体补偿方案，由乡镇人民政府、街道办事处逐户确定具体补偿金额，并由村民委员会、居民委员会张榜公布。 具体补偿金额经公布无异议后，按照国库集中支付制度有关规定将补偿资金支付至区内居民银行账户。 第二十一条 蓄滞洪区运用后损失严重的，在补偿方案由国务院有关部门审查、核定前，蓄滞洪区所在地省级人民政府或者其授权的主管部门可以向国务院水行政主管部门、财政主管部门申请预先下达部分补偿资金预算，并及时组织将补偿资金支付至区内居民银行账户。预先下达的补偿资金在后期据实结算。 第二十二条 补偿资金发放完毕后，蓄滞洪区所在地省级人民政府或者其授权的主管部门应当及时将补偿工作情况报国务院财政主管部门、水行政主管部门和应急管理部门。 第四章 法律责任 第二十三条 地方各级人民政府和县级以上人民政府有关部门及其工作人员，以及其他依法履行公职的人员，在蓄滞洪区运用补偿工作中滥用职权、玩忽职守、徇私舞弊，或者骗取、侵吞、挪用补偿资金的，对负有责任的领导人员和直接责任人员依法给予处分。 第二十四条 区内居民在财产补偿登记时弄虚作假，或者在蓄滞洪区运用补偿过程中谎报、虚报损失的，由县级人民政府责令改正，予以警告；多领、冒领补偿资金的，追回多领、冒领的资金。 第二十五条 违反本办法规定，构成犯罪的，依法追究刑事责任。 第五章 附 则 第二十六条 财产补偿登记、变更登记不得向区内居民收取任何费用，所需费用由蓄滞洪区所在地县级人民政府统筹解决。 第二十七条 省级人民政府批准的防洪规划中确定的蓄滞洪区的运用补偿办法，由有关省级人民政府制定。 第二十八条 本办法自公布之日起施行。2000年5月27日国务院发布的《蓄滞洪区运用补偿暂行办法》同时废止。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.023Z"},{"slug":"policy-20250526-93b5ee40","title":"重庆市地方标准《工业建筑民用化改造技术标准》（DBJ50/T-518-2025）","type":"policy","type_label":"政策","issuer":"重庆市住房和城乡建设委员会","doc_no":"DBJ50/T-518-2025（发布通知：渝建标〔2025〕18号）","publish_date":"2025-05-26","effective_date":"2025-08-01","status":"现行有效","level":"地方级","region":"重庆","source_name":"工作区研究资料收录（标准发布通知原文 OCR）","source_url":"","summary":"重庆市住房和城乡建设委员会2025年5月26日以渝建标〔2025〕18号发布《工业建筑民用化改造技术标准》，标准编号 DBJ50/T-518-2025，自2025年8月1日起施行，为重庆市工程建设地方标准，由市住房城乡建设委负责管理、重庆建工住宅建设有限公司负责具体技术内容解释，标准文本可在标准备案后登录重庆市住房和城乡建设技术发展中心官网免费下载。","themes":["老旧厂房改造","城市更新","工业遗产","绿色低碳"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>重庆市住房和城乡建设委员会文件 渝建标〔2025〕18号 重庆市住房和城乡建设委员会 关于发布《工业建筑民用化改造技术标准》的通知 各区县(自治县)住房城乡建委,两江新区、重庆高新区建设局,万盛经开区住房城乡建设局、双桥经开区住房城乡建设局、经开区生态环境建管局,有关单位: 现批准《工业建筑民用化改造技术标准》为我市工程建设地方标准,编号为DBJ50/T-518-2025,自2025年8月1日起施行。标准文本可在标准备案后登录重庆市住房和城乡建设技术发展中心官网免费下载。 本标准由重庆市住房和城乡建设委员会负责管理,重庆建工住宅建设有限公司负责具体技术内容解释。 重庆市住房和城乡建设委员会 2025年5月26日 说明：本条目依据工作区留存的标准发布通知原文 OCR 整理；工作区留存材料未包含标准正文条款，标准全文以主管部门发布版本为准。\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:05:28.561Z"},{"slug":"policy-20250409-4dfdda38","title":"关于开展2025年度中央财政支持实施城市更新行动的通知","type":"policy","type_label":"政策","issuer":"财政部办公厅 住房城乡建设部办公厅","doc_no":"财办建〔2025〕11号","publish_date":"2025-04-09","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202504/content_7017720.htm","summary":"全覆盖样板区建设等；三是生活垃圾分类处理、建筑垃圾治理、综合杆箱、危旧桥梁、机械停车设施等市政基础设施提升改造；四是历史文化街区、老旧小区、口袋公园、绿地开放共享等既有片区更新改造，注重文化、旅游、","themes":["城市更新","财政支持"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>关于开展2025年度中央财政支持实施城市更新行动的通知 财办建〔2025〕11号 各省、自治区、直辖市财政厅（局）、住房城乡建设厅（局、委）： 为贯彻党的二十大、二十届三中全会关于实施城市更新行动的决策部署，落实中央经济工作会议和政府工作报告有关要求，中央财政继续支持部分城市实施城市更新行动，探索建立可持续的城市更新机制，推动补齐城市基础设施的短板弱项，加强消费型基础设施建设，注重向提振消费方面发力，促进城市基础设施建设由“有没有”向“好不好”转变，解决人民群众的急难愁盼问题，实现城市高质量发展。现就有关要求通知如下： 一、工作目标 财政部会同住房城乡建设部通过竞争性选拔，确定部分基础条件好、积极性高、特色突出的城市，在城市层面探索整合各类资源，探索建立资金、用地、金融等各类要素保障机制，形成工作合力。中央财政对入围城市给予定额补助。入围城市制定城市更新工作方案，统筹使用中央和地方资金，完善法规制度、规划标准、投融资机制及相关配套政策，探索城市更新可复制、可推广的机制和模式。力争通过三年探索，城市地下管网等基础设施水平明显提升，生活污水收集处理效能进一步提高，老旧片区宜居环境建设取得明显成效，形成可复制、可推广的模式和经验。 二、支持范围和申报条件 2025年，中央财政支持实施城市更新工作的范围为大城市及以上城市，共评选不超过20个城市，主要向超大特大城市以及黄河、珠江等重点流域沿线大城市倾斜。 每省（区、市）可推荐1个城市参评，申报城市需同时满足以下基础条件： 1.建立推动城市更新工作的组织领导和协调工作机制，并制定中央财政支持实施城市更新行动工作方案，具体实施范围集中在城市老城区； 2.城市财力应满足城市更新投入需要，地方政府债务风险低，不得因开展城市更新形成新的政府隐性债务； 3.2023年（含）以来，在住房和城乡建设领域未出现重大生产安全事故或重大负面舆情事件。 三、遴选组织方式 城市选拔采取竞争性评审的方式选拔确定，重点向基础工作扎实、条件俱备、积极性高的城市倾斜。 （一）省级推荐。省级财政、住房城乡建设部门对照申报工作要求，择优推荐本地区符合条件的城市参与评审，组织编制工作方案，并提供必要的支撑材料。直辖市可由城市政府有关部门直接申报。 （二）书面评审。财政部、住房城乡建设部组织专家对城市申报方案进行审查。按照120%差额比例确定进入现场答辩的城市名单。 （三）现场答辩。进入现场答辩的各城市派员参加公开答辩，具体要求另行通知。 （四）集中公示。综合书面评审和现场答辩得分情况，确定入围城市。入围城市经过公示，无异议的确定为中央财政支持实施城市更新行动城市。存在违规行为并经查实的，取消资格。 四、补助标准和支持范围 （一）中央财政资金补助标准。中央财政按区域对实施城市更新行动城市给予定额补助。其中：东部地区每个城市补助总额不超过8亿元，中部地区每个城市补助总额不超过10亿元，西部地区每个城市补助总额不超过12亿元，直辖市每个城市补助总额不超过12亿元。资金根据工作推进情况分年拨付到位。 （二）资金支持方向。中央财政资金支持城市更新的样板项目建设和机制建设2个方向： 1.城市更新重点样板项目。一是城市供排水、燃气、供热等城市地下管网更新改造和经济集约型综合管廊建设；二是城市生活污水处理“厂网一体”、城市生活污水管网全覆盖样板区建设等；三是生活垃圾分类处理、建筑垃圾治理、综合杆箱、危旧桥梁、机械停车设施等市政基础设施提升改造；四是历史文化街区、老旧小区、口袋公园、绿地开放共享等既有片区更新改造，注重文化、旅游、餐饮、休闲娱乐等一体打造，加强消费型基础设施建设。 2.城市更新机制建设。一是项目储备和生成机制。近远结合、系统谋划建设项目，城市更新项目谋划、储备、实施时序的方式，可形成的机制包括但不限于城市体检、城市更新专项规划、房屋全生命周期安全管理、城市更新项目储备库建设、建设成效后评估机制等。二是资金安排和筹措机制。建立有利于统筹用好财政、金融资源的机制。财政资金方面，充分运用好国债资金、中央预算内投资、地方政府一般公共预算、地方政府专项债券、其他政府性基金预算、国资预算等，最大程度发挥财政资金效能。金融支持方面，探索优化金融机构信贷支持模式，鼓励社会资本进入。同时，建立合理的成本分担机制，如污水全覆盖样板区和“厂网一体”运行维护机制，以污水收集效能提升为导向的按效付费机制，居民小区二次供水设施专业化服务机制，建立地下管网“一张图”设施动态更新机制和长效运行机制等。三是用地保障和审批机制，包括盘活利用存量低效用地、规划制度，适用于改造类项目的城市更新项目审批制度，城市更新有关法规制度和技术标准等。中央资金可用于上述三类机制建立过程中的相关支出。 各城市要按照因地制宜、因城施策的原则，突出本次城市更新的重点内容，聚焦城市老城区，集中打造城市更新的样板项目，形成样板片区。同时，应与现有支持政策做好统筹衔接，具体项目上不得重复申请中央预算内投资、车购税资金、超长期特别国债等其他渠道中央资金，防止交叉重复。 五、日常跟踪、监督检查及绩效管理 省级住房城乡建设、财政部门应建立对入围城市的日常跟踪及监督机制，及时将工作进展、存在问题及经验做法等报住房城乡建设部、财政部，原则上每个城市每年不少于1期。 财政部、住房城乡建设部按照《中央财政支持城市更新行动绩效评价办法》（财办建〔2024〕46号）及中央资金预算管理有关要求开展绩效评价。 六、其他事项 （一）参与申报的各省级财政、住房城乡建设部门（直辖市可由城市政府直接报送）应于4月30日前联合行文报送财政部、住房城乡建设部，并组织申报城市通过财政部、住房城乡建设部邮箱报送电子版（含佐证材料），或通过光盘等移动存储方式邮寄，申报材料不得包含任何涉密文件、涉密内容，电子版材料大小不超过8GB。 （二）各申报城市应按要求编制工作方案，减少申报工作支出。各地不得委托财政部、住房城乡建设部及其所属行政、企事业单位和工作人员以任何方式（署名或者不署名）参与工作方案的编制工作；不得简单交给中介机构或技术团队“编本子、讲故事”，印制豪华材料。除报送两部门的正式文件外，申报城市实施方案及相关支撑材料一律报送电子版。 （三）请各地严格按照通知明确的数量和要求推荐城市、报送材料等，并对报送内容真实性负责。对不按要求报送或申报内容明显不实的城市，将取消当年申报资格。 （四）经竞争性评审确定入围的城市，请将三年行动总体绩效目标表、2025年度绩效目标表加盖城市人民政府公章后，于公示期结束前报财政部、住房城乡建设部备案。 联系方式： 财政部经济建设司： 电话：010—68554521，邮箱：shikelu@mof.gov.cn 住房城乡建设部城市建设司： 电话：010—58933160，邮箱：chengshui@mohurd.gov.cn 财政部办公厅 住房城乡建设部办公厅 2025年4月3日 附件下载： 附件1-方案编制大纲 附件2-绩效指标体系 附件3-城市更新典型片区实施内容汇总表 附件4-实施城市更新机制建设示范项目汇总表\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.043Z"},{"slug":"policy-20250408-6d61cde6","title":"国务院关于《黄河流域国土空间规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕37号","publish_date":"2025-04-08","effective_date":"","status":"现行有效","level":"国家级","region":"黄河流域","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202504/content_7017568.htm","summary":"用地使用面积下降不少于40%；用水总量不超过国家下达指标。明确自然灾害风险重点防控区域，划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《黄河流域国土空间规划 （2021—2035年）》的批复 国函〔2025〕37号 自然资源部： 你部关于报请批准《黄河流域国土空间规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部组织起草的《黄河流域国土空间规划（2021—2035年）》（以下简称《规划》）。《规划》是国家级国土空间专项规划，是黄河流域空间发展的指南、可持续发展的空间蓝图，是各类开发保护建设活动的基本依据，请认真组织实施。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻落实党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，坚持共同抓好大保护，协同推进大治理，落实黄河流域生态保护和高质量发展战略部署，强化水资源刚性约束，统筹推进山水林田湖草沙冰一体化保护和系统治理，保障国家能源与粮食安全，不断优化国土空间开发保护格局，推动城乡人居环境明显改善、美丽中国建设取得显著成效，开创黄河流域生态保护和高质量发展新局面，让黄河成为造福人民的幸福河。 二、筑牢安全发展的空间基础。到2035年，黄河流域耕地保有量不低于25921.71万亩，其中永久基本农田保护面积不低于21544.88万亩；生态保护红线面积不低于39.60万平方千米；城镇开发边界扩展倍数控制在基于2020年城镇建设用地规模的1.3倍以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过国家下达指标。明确自然灾害风险重点防控区域，划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。深入实施区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略和乡村振兴战略，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。按照主体功能定位，推动黄河源区、黄河“几”字弯地区、黄河下游地区协同发展，增强区域整体竞争力和综合承载力，深度融入共建“一带一路”，加强与京津冀、长江经济带、粤港澳大湾区、长三角地区等区域重大战略地区的协同联动。 四、系统优化国土空间开发保护格局。在黄河源区，一体化保护高寒地区生态系统整体性，支撑打造生态文明建设高地；以自然恢复为主全面推进黄河源区生态修复，筑牢三江源“中华水塔”生态安全屏障。在黄河“几”字弯地区，重点治理晋陕宁蒙黄土区水土流失，推进黄河左右岸线流沙及沿线“沙头、沙口、沙源”治理；打造规模连片高质量的粮食生产基地，合理拓展粮食生产潜力空间；推进沿黄城市集聚集约发展，培育新兴增长极；充分利用沙漠、戈壁、荒漠等建设重要清洁能源走廊；实施地表水地下水联合调蓄和战略储备，坚决遏制挖湖造景。在黄河下游地区，增强山东半岛、中原城市群与京津冀、长三角等城市群之间的区域联系和融合发展；实施滩区差别化空间管控，增强下游洪涝灾害防御能力；加强生态系统综合治理，强化黄河入海口地区绿色低碳高质量发展空间保障。完善主体功能区配套政策，推动黄河源区、黄河“几”字弯地区、黄河下游地区优化人口、资源、产业合理配置，推动区域整体统筹产业链、供应链布局，依托城市群、都市圈和中心城市打造产业科技创新高地，为构建新发展格局提供支撑。统筹传统和新型基础设施空间布局，构建现代化基础设施网络，强化应对气候变化和极端天气的防灾减灾救灾基础设施，全面提升国土空间韧性。弘扬黄河文化，强化文化遗产与自然遗产整体保护和系统活化利用，健全跨行政区协同机制，将各类遗产保护管理纳入国土空间规划，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对黄河流域国土空间作出的全局安排，是区域国土空间保护、开发、利用、修复的政策和总纲，是有关地方各级编制实施国土空间规划的重要依据，必须严格执行。要自觉接受国土空间规划的指导约束，不得随意修改、违规变更，对不符合国土空间规划的用地用海、未批先建等违法违规行为要严肃查处。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。黄河流域各省（自治区）人民政府要加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，将《规划》确定的目标指标、重点任务等纳入有关地方各级国土空间规划，加快形成统一的国土空间规划体系，统筹国土空间开发保护。强化对水利、交通、能源、农业、信息、市政等基础设施以及公共服务设施、军事设施、生态环境保护、文物保护、林业草原等专项规划的指导约束，在国土空间规划“一张图”上协调解决矛盾问题，合理优化空间布局。黄河流域各省（自治区）要充分发挥国土空间规划委员会作用，加强对跨省域规划编制实施管理的统筹协调，强化对交界地区市县级国土空间规划的传导要求。按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建立国土空间规划实施监测网络，提高空间治理数字化水平。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年4月1日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.060Z"},{"slug":"policy-20250213-0a568f5f","title":"国务院关于《武汉市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕23号","publish_date":"2025-02-13","effective_date":"","status":"现行有效","level":"国家级","region":"武汉","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202502/content_7003572.htm","summary":"省会，中部地区的中心城市，国家历史文化名城，国际性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，","themes":["国土空间规划"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>国务院关于《武汉市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕23号 湖北省人民政府、自然资源部： 你们关于报请批准《武汉市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《武汉市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是武汉市各类开发保护建设活动的基本依据，请认真组织实施。武汉是湖北省省会，中部地区的中心城市，国家历史文化名城，国际性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥中部经济中心、科技创新中心、商贸物流中心、对外交往中心以及长江中游航运中心等功能，奋力谱写中国式现代化武汉篇章。 二、筑牢安全发展的空间基础。到2035年，武汉市耕地保有量不低于341.79万亩，其中永久基本农田保护面积不低于310.94万亩；生态保护红线面积不低于794.54平方千米；城镇开发边界面积控制在1813.35平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过39.0亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。主动融入共建“一带一路”，深度参与长江经济带高质量发展，共抓长江大保护，带动中部地区加快崛起，推进长江中游城市群联动发展，加强武汉都市圈国土空间开发保护利用的区域协同，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，完善汉口、武昌、汉阳地区相对独立的功能布局。强化对长江、汉江及其洲岛岸线的系统保护和开发利用，严格河湖水域空间管控，整体提升河湖水网生态系统的质量和稳定性，统筹推进生态空间保护和蓄滞洪区建设，加强北部山区生态保护修复。优化现代都市农业空间布局，拓展特色优势农产品生产空间。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障科技创新和产业创新深度融合发展的空间需求，为优化先进制造业布局、推动传统产业转型升级、培育产业创新中心和制造业创新中心提供土地政策保障。系统提升航空、铁路枢纽功能，加强武汉长江中游航运中心建设，充分发挥内河航运作用，支持打造长江黄金水道，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，加强洪涝灾害防治，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，保护好“江、湖、山、城”的空间格局，加强八七会议会址、中国共产党第五次全国代表大会旧址等红色文化遗产和武昌起义军政府旧址等近代历史文化遗存保护。加强对城市建筑高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对武汉市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。湖北省人民政府、自然资源部要指导督促武汉市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。武汉市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年2月10日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.076Z"},{"slug":"policy-20250127-6883e864","title":"国务院关于《京津冀国土空间规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕19号","publish_date":"2025-01-27","effective_date":"","status":"现行有效","level":"国家级","region":"京津冀","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7001456.htm","summary":"划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。深入实施区域协调发展战略、区域重大战略、","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《京津冀国土空间规划 （2021—2035年）》的批复 国函〔2025〕19号 自然资源部： 你部关于报请批准《京津冀国土空间规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部组织起草的《京津冀国土空间规划（2021—2035年）》（以下简称《规划》）。《规划》是国家级国土空间专项规划，是京津冀地区空间发展的指南、可持续发展的空间蓝图，是各类开发保护建设活动的基本依据，请认真组织实施。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻落实党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，落实京津冀协同发展战略部署，支撑京津冀建成世界一流城市群，更好发挥高质量发展动力源作用，成为中国式现代化建设的先行区、示范区。 二、筑牢安全发展的空间基础。到2035年，京津冀地区耕地保有量不低于9433.99万亩，其中永久基本农田保护面积不低于8224.44万亩；生态保护红线面积不低于4.23万平方千米，其中海洋生态保护红线面积不低于0.14万平方千米；城镇开发边界扩展倍数控制在基于2020年城镇建设用地规模的1.3倍以内；单位国内生产总值建设用地使用面积下降不少于40%；大陆自然岸线保有率不低于国家下达任务；用水总量不超过国家下达指标。明确自然灾害风险重点防控区域，划定地质灾害、洪涝、森林防火等风险控制线，落实战略性矿产资源、历史文化保护等安全保障空间，全面锚固高质量发展的空间底线。 三、构建支撑新发展格局的国土空间体系。深入实施区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略和乡村振兴战略，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。按照主体功能定位，构建有利于有序疏解北京非首都功能的空间格局，深化京津冀地区协同发展，增强区域整体竞争力和综合承载力，深度融入共建“一带一路”，加强与黄河流域、长江经济带、粤港澳大湾区、长三角地区等区域重大战略地区的协同联动。 四、系统优化国土空间开发保护格局。牢牢牵住疏解北京非首都功能这个“牛鼻子”，支撑首都功能区域优化布局。北京市立足“四个中心”建设，加强控增量和疏存量相结合，推进城市功能重组优化，提升北京城市副中心对首都功能的服务保障能力。天津市加强滨海新区与北京城市副中心、河北雄安新区的协同联动，加强北方国际航运核心区建设，提升对外开放门户功能。河北雄安新区着力提升北京非首都功能疏解集中承载地功能。河北省发挥环京地区优势，以及生态、矿产、港口、海洋等特色资源优势，强化支撑区域产业链创新链构建、农产品供应保障、能源保供、生态环境优化、文旅康养服务等功能，以石家庄市辐射带动冀南地区加强与北京、天津、河北雄安新区的协同联动。京津冀三省市加强对重点交界地区的空间统筹和联合管控。巩固黄淮海平原农产品主产区，夯实华北粮仓空间基础。在北京市、天津市、河北环京地区重点推动现代都市农业发展，发挥农产品就近保障功能，支持发展高效节水农业、生猪和奶牛养殖、海洋牧场等，提升区域粮食生产和重要农产品供给能力。县域统筹推动城乡融合，促进城乡要素双向流动，加强城乡基础设施和公共服务设施一体化布局，支持乡村振兴。筑牢华北生态屏障，保障京津冀地区生态安全。推进北方防沙带建设，提升燕山—太行山等地区水源涵养功能，改善重要河湖湿地水生态，加大渤海湾综合整治力度，协同推进山水林田湖草沙一体化保护和系统治理。强化现代化基础设施对京津冀高质量发展的支撑保障。建设都市圈多层次轨道交通网络，打造世界级机场群、港口群，完善区域一体化公路交通网络和物流网络布局，完善水利基础设施配置，构建多水源供水网络。增强区域应对气候变化的安全韧性，统筹协调区域和城市防洪排涝功能，提高海河流域河道行洪能力，强化蓄滞洪区规划管控，加强城市内外河湖水系衔接，构建海岸带综合防护体系，平急结合优化防灾减灾救灾资源的区域布局。整体保护区域文化遗产和自然遗产，打造高品质休闲游憩空间，创造优良人居环境，展现京畿特色文化底蕴。 五、维护规划严肃性权威性。《规划》是对京津冀地区国土空间作出的全局安排，是区域国土空间保护、开发、利用、修复的政策和总纲，是有关地方各级编制实施国土空间规划的重要依据，必须严格执行。要自觉接受国土空间规划的指导约束，不得随意修改、违规变更，对不符合国土空间规划的用地用海、未批先建等违法违规行为要严肃查处。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。京津冀三省市人民政府要加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，将《规划》确定的目标指标、重点任务等纳入有关地方各级国土空间规划，加快形成统一的国土空间规划体系，统筹国土空间开发保护。强化对水利、交通、能源、农业、信息、市政等基础设施以及公共服务设施、军事设施、生态环境保护、文物保护、林业草原等专项规划的指导约束，在国土空间规划“一张图”上协调解决矛盾问题，合理优化空间布局。京津冀三省市要充分发挥国土空间规划委员会作用，加强对跨省域规划编制实施管理的统筹协调，强化对交界地区市县级国土空间规划的传导要求。按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建立国土空间规划实施监测网络，提高空间治理数字化水平。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月26日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.102Z"},{"slug":"regulation-20250127-4ea95f9d","title":"古树名木保护条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第800号","publish_date":"2025-01-27","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7001414.htm","summary":"组织领导。县级以上地方人民政府林业主管部门、城市绿化主管部门（以下统称县级以上地方人民政府古树名木主管部门）按照职责分工负责本行政区域内古树名木保护管理工作。县级以上地方人民政府其他有关部门在各自职责","themes":["古树名木","生态保护"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第800号 《古树名木保护条例》已经2025年1月3日国务院第50次常务会议通过，现予公布，自2025年3月15日起施行。 总理 李强 2025年1月25日 古树名木保护条例 第一条 为了加强对古树名木的保护，推进生态文明建设，传承中华优秀传统文化，制定本条例。 第二条 本条例所称古树，是指树龄100年以上的树木，不包括人工培育、以生产木材为主要目的的商品林中的树木。 本条例所称名木，是指具有重要历史、文化、科学、景观价值或者具有重要纪念意义的树木。 第三条 国家保护古树名木，禁止损害古树名木及其生长环境。 第四条 古树名木保护管理工作坚持中国共产党的领导，坚持保护第一、合理利用、分级管理的原则，构建政府主导、属地负责、社会参与的工作机制。 第五条 全国绿化委员会负责组织领导全国古树名木保护管理工作。国务院林业主管部门、住房城乡建设主管部门（以下统称国务院古树名木主管部门）按照职责分工负责全国古树名木保护管理工作。国务院其他有关部门在各自职责范围内负责古树名木保护管理相关工作。 县级以上地方人民政府应当加强对古树名木保护管理工作的组织领导。县级以上地方人民政府林业主管部门、城市绿化主管部门（以下统称县级以上地方人民政府古树名木主管部门）按照职责分工负责本行政区域内古树名木保护管理工作。县级以上地方人民政府其他有关部门在各自职责范围内负责古树名木保护管理相关工作。 乡镇人民政府、街道办事处以及村民委员会、居民委员会应当协助做好古树名木保护管理相关工作。 第六条 县级以上人民政府开展古树名木保护管理工作所需经费，应当按照财政事权和支出责任划分原则列入本级预算。 国家鼓励通过认捐、认养等多种形式资助古树名木保护事业。 第七条 国家鼓励、支持古树名木保护科学研究和先进技术推广应用，提高古树名木保护管理水平。 国务院有关部门、县级以上地方人民政府及其有关部门应当采取多种形式，组织开展古树名木保护宣传教育，传承古树名木文化，增强全社会的古树名木保护意识，营造保护古树名木的良好社会氛围。 第八条 对古树按照下列标准实行分级保护： （一）树龄500年以上的，实行一级保护； （二）树龄300年以上不满500年的，实行二级保护； （三）树龄100年以上不满300年的，实行三级保护。 省、自治区、直辖市人民政府根据实际情况，可以决定对城市内树龄300年以上不满500年的古树实行一级保护、树龄100年以上不满300年的古树实行二级保护。 对名木均实行一级保护，不受树龄限制。 第九条 全国绿化委员会每10年组织开展一次全国古树名木资源普查。普查间隔期内，县级以上地方人民政府古树名木主管部门适时开展古树名木资源补充调查。在普查、补充调查以及古树名木认定等工作中，县级以上地方人民政府古树名木主管部门可以组织开展古树名木鉴定。 国家鼓励单位、个人提供古树名木资源信息。 第十条 县级以上地方人民政府古树名木主管部门根据古树名木资源普查、补充调查结果认定古树名木，报本级人民政府批准后依法公布。 实行一级保护的古树和名木由省、自治区、直辖市人民政府古树名木主管部门认定，实行二级保护、三级保护的古树分别由设区的市级、县级人民政府古树名木主管部门认定。 对在一定区域内集中生长形成的古树群体，可以实行整体保护，并按照涉及古树名木的最高保护等级，由相应的地方人民政府古树名木主管部门认定为古树群，报本级人民政府批准后依法公布。 古树名木的认定和公布实行动态管理。 古树名木认定和分级保护管理的具体办法由国务院古树名木主管部门规定。 第十一条 县级以上地方人民政府古树名木主管部门应当建立古树名木档案，并按照有关规范和要求，对古树名木设立保护标志，建设相应的保护设施，采取相应的保护措施。 县级人民政府应当按照国务院古树名木主管部门的规定，划定古树名木保护范围，并依法公布。 古树名木保护范围划定后，应当及时纳入国土空间规划实施监督信息系统。 因生态保护等公共利益需要，造成古树名木相关权利人合法权益受到损害的，县级以上地方人民政府应当依法给予补偿；涉及属于集体所有、私人所有的古树名木的，县级以上地方人民政府可以采取措施合理照顾有关单位、个人的利益。 第十二条 县级人民政府古树名木主管部门应当按照有利于加强古树名木日常养护的原则，明确有关单位、个人作为古树名木的日常养护责任人，与日常养护责任人签订日常养护协议，根据古树名木权属情况、保护等级、养护状况、养护费用等，明确双方权利义务。 对在古树名木保护管理工作中作出突出贡献的单位、个人，按照国家有关规定给予表彰和奖励。 第十三条 县级人民政府古树名木主管部门应当加强对日常养护责任人的技术指导和培训，提高日常养护责任人的科学养护能力。日常养护责任人应当严格履行养护义务，对损害古树名木及其生长环境的行为应当予以制止。 日常养护责任人发现古树名木遭受损害或者出现生长异常等情形的，应当及时报告县级人民政府古树名木主管部门，县级人民政府古树名木主管部门应当及时组织现场调查，并对所涉古树名木采取救治、复壮等措施。 第十四条 禁止采伐古树名木。 因重大植物疫情防控、抢险救灾等特殊紧急情形，依法采取应急处置措施采伐古树名木的，县级人民政府有关部门应当及时通知县级人民政府古树名木主管部门。县级人民政府古树名木主管部门应当在应急处置工作结束后30日内将有关情况逐级报告至省、自治区、直辖市人民政府古树名木主管部门。涉及实行一级保护的古树和名木的，省、自治区、直辖市人民政府古树名木主管部门应当报告国务院古树名木主管部门。 第十五条 古树名木原则上实行原地保护，不得移植。有下列情形之一，确需移植古树名木的，建设单位应当提出移植申请并提交相应的移植和养护方案，按照涉及古树名木的最高保护等级，经认定该古树名木的县级以上地方人民政府古树名木主管部门审核并报本级人民政府批准： （一）国家能源、交通、水利、军事设施等重点建设项目选址确实无法避让古树名木； （二）省、自治区、直辖市能源、交通、水利等重点建设项目选址确实无法避让实行二级保护、三级保护的古树； （三）其他基础设施建设项目选址确实无法避让实行三级保护的古树。 古树名木的生长状况可能危害公众生命安全，采取修剪、支撑等防护措施仍无法消除安全隐患的，由县级人民政府古树名木主管部门提出相应的移植和养护方案，按照管理权限报有关人民政府批准。 第十六条 移植古树名木应当就近实施。 古树名木移植，属于本条例第十五条第一款规定情形的，移植费用和移植后5年内的养护费用由建设单位承担；属于本条例第十五条第二款规定情形的，移植费用和移植后5年内的养护费用由有关县级人民政府承担。 第十七条 任何单位、个人不得实施下列损害古树名木及其生长环境的行为： （一）买卖、运输、加工非法采伐、移植的古树名木； （二）挖根、剥损树皮、过度修剪枝干； （三）向古树名木灌注有毒有害物质； （四）在古树名木保护范围内铺设非通透性硬化地面、使用明火、堆放重物、倾倒易燃易爆物品或者有毒有害物质； （五）在古树名木上刻划、架设线缆、缠绕或者悬挂物体等，攀爬古树名木； （六）破坏古树名木保护设施、保护标志； （七）其他损害古树名木及其生长环境的行为。 第十八条 建设项目选址、建设，应当避开古树名木保护范围；因特殊情况不能避开，确需在古树名木保护范围内新建、扩建建筑物、构筑物或者铺设管线的，应当在施工前报告县级以上地方人民政府古树名木主管部门，并按照要求采取必要的工程措施，尽可能减轻对古树名木及其生长环境的损害。 古树名木保护范围内已有的建筑物、构筑物、管线等，不符合古树名木保护要求的，县级人民政府应当有计划地组织治理。 古树名木保护与文物保护相关时，由县级以上地方人民政府古树名木主管部门和文物主管部门共同制定保护措施。 第十九条 在不损害古树名木及其生长环境的前提下，可以开展下列活动： （一）合理利用古树名木资源开展保护技术、遗传育种、生物学等科学研究，推广应用科研成果； （二）结合历史文化名镇名村、历史文化街区、传统村落以及传统节庆、民俗，挖掘古树名木的历史和文化价值； （三）开展科普宣教，促进古树名木资源与生态旅游融合发展； （四）古树名木属于传统经济树种的，相关权利人依法开展必要的生产经营活动。 第二十条 古树名木死亡的，由认定该古树名木的县级以上地方人民政府古树名木主管部门组织确认、查明原因并提出处置意见报本级人民政府；具有原地保留价值的，予以保留，并根据实际情况采取必要的保护措施。 第二十一条 县级以上地方人民政府古树名木主管部门应当建立古树名木分级保护巡查制度，根据古树名木的保护等级、分布地域、长势情况等确定巡查周期，定期开展巡查。 对位于偏远地区和交通不便地区的古树名木，县级以上人民政府古树名木主管部门可以利用大数据、卫星遥感、无人机等技术手段开展动态监控。 第二十二条 国务院古树名木主管部门应当建立古树名木保护管理信息平台。 县级以上地方人民政府古树名木主管部门应当及时将本行政区域内的古树名木数据信息归集至古树名木保护管理信息平台。 第二十三条 县级以上人民政府古树名木主管部门依照本条例规定，按照职责分工对古树名木保护管理等活动进行监督检查，有权采取下列措施： （一）询问被检查单位、个人，要求其对与监督检查事项有关的情况作出说明； （二）进行现场检查； （三）查阅、复制有关文件、资料，对可能被转移、销毁、隐匿或者篡改的文件、资料予以封存； （四）查封、扣押涉嫌违法活动的场所、设施或者财物。 县级以上人民政府古树名木主管部门依法进行监督检查，有关单位、个人应当予以配合，不得拒绝、阻碍。 第二十四条 对古树名木保护管理工作不力、问题突出的地区，国务院古树名木主管部门可以约谈有关地方人民政府及其有关部门主要负责人，要求其采取措施及时整改。 古树名木保护管理情况，应当纳入领导干部自然资源资产离任审计。 第二十五条 国务院古树名木主管部门、县级以上地方人民政府及其古树名木主管部门、其他有关部门的工作人员在古树名木保护管理工作中滥用职权、玩忽职守、徇私舞弊的，依法给予处分。 第二十六条 违反本条例规定，采伐、移植古树名木的，由县级以上地方人民政府古树名木主管部门责令停止违法行为、采取补救措施，没收违法所得，并依照下列规定处以罚款： （一）涉及实行一级保护的古树和名木的，处每株50万元以上100万元以下的罚款； （二）涉及实行二级保护的古树的，处每株20万元以上50万元以下的罚款； （三）涉及实行三级保护的古树的，处每株10万元以上20万元以下的罚款。 违反本条例规定，损害古树名木及其生长环境，造成古树名木死亡的，依照前款规定处罚。 第二十七条 有本条例第十七条第一项、第二项、第三项、第四项规定行为之一的，由县级以上地方人民政府古树名木主管部门责令停止违法行为、采取补救措施，没收违法所得，并处1万元以上10万元以下的罚款；拒不停止违法行为、不采取补救措施或者造成严重后果的，并处5万元以上20万元以下的罚款。 有本条例第十七条第五项、第六项、第七项规定行为之一的，由县级以上地方人民政府古树名木主管部门责令停止违法行为、采取补救措施，没收违法所得，可以并处1万元以下的罚款；拒不停止违法行为、不采取补救措施或者造成严重后果的，并处1万元以上10万元以下的罚款。 第二十八条 违反本条例第十八条第一款规定的，由县级以上地方人民政府古树名木主管部门责令停止违法行为、限期恢复原状或者采取其他补救措施，没收违法所得；拒不停止违法行为、逾期不恢复原状、不采取其他补救措施或者造成严重后果的，依照下列规定处以罚款： （一）涉及实行一级保护的古树和名木的，处每株20万元以上50万元以下的罚款； （二）涉及实行二级保护的古树的，处每株10万元以上20万元以下的罚款； （三）涉及实行三级保护的古树的，处每株5万元以上10万元以下的罚款。 第二十九条 违反本条例规定，给他人造成损失的，依法承担赔偿责任；构成违反治安管理行为的，依法给予治安管理处罚；构成犯罪的，依法追究刑事责任。 第三十条 本条例自2025年3月15日起施行。\u003c/p>","related":[{"slug":"regulation-20261109-7268d0fa","title":"中医药传统知识保护条例","publish_date":"2026-11-09"},{"slug":"regulation-20260214-4ccf2618","title":"供水条例","publish_date":"2026-02-14"},{"slug":"regulation-20260209-c610e496","title":"中华人民共和国自然保护区条例","publish_date":"2026-02-09"},{"slug":"regulation-20251121-ee3fc7ae","title":"森林草原防灭火条例","publish_date":"2025-11-21"},{"slug":"regulation-20251106-57663197","title":"生态环境监测条例","publish_date":"2025-11-06"}],"updated_at":"2026-11-16T09:21:20.116Z"},{"slug":"policy-20250122-c5859ec0","title":"国务院关于《东莞市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕15号","publish_date":"2025-01-22","effective_date":"","status":"现行有效","level":"国家级","region":"东莞","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7000442.htm","summary":"历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对东莞市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《东莞市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕15号 广东省人民政府、自然资源部： 你们关于报请批准《东莞市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《东莞市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是东莞市各类开发保护建设活动的基本依据，请认真组织实施。东莞是粤港澳大湾区重要的节点城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥全国先进制造业基地、国际科技创新中心承载地等功能，奋力谱写中国式现代化东莞篇章。 二、筑牢安全发展的空间基础。到2035年，东莞市耕地保有量不低于10.11万亩，其中永久基本农田保护面积不低于10.00万亩；生态保护红线面积不低于361.08平方千米，其中海洋生态保护红线面积不低于26.74平方千米；城镇开发边界面积控制在1433.37平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；大陆自然岸线保有率不低于上级下达任务，其中2025年不低于4%；用水总量不超过上级下达指标，其中2025年不超过21.34亿立方米；除国家重大项目外，全面禁止围填海；严格无居民海岛管理。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。增强城市综合实力，积极共建粤港澳大湾区，联动深圳、惠州共建深圳都市圈，主动融入广州都市圈，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区和片区中心服务能级，深化松山湖、滨海湾等片区与深圳融合发展，推动水乡新城与广州东部地区协同联动。筑牢南部山地生态屏障，协同推进珠江流域生态保护修复，整体提升东江、狮子洋等河口湿地生态系统的质量和稳定性，系统保护和集约利用海域、海岛、海岸线资源。保障现代都市农业空间需求，优化农业空间布局。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障电子信息等先进制造业和科技创新产业发展的空间需求，为推动存量产业用地提质增效、优化布局提供土地政策保障。加强粤港澳大湾区港口群协调联动，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强大岭山抗日根据地旧址等红色文化遗产和林则徐销烟池与虎门炮台旧址等近代历史文化遗存保护。加强对城市建筑高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对东莞市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。广东省人民政府、自然资源部要指导督促东莞市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。东莞市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月18日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.135Z"},{"slug":"policy-20250122-30a8265b","title":"国务院关于《西安市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕13号","publish_date":"2025-01-22","effective_date":"","status":"现行有效","level":"国家级","region":"西安","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7000441.htm","summary":"省会，西部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，国家重要科研和文教中心。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《西安市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕13号 陕西省人民政府、自然资源部： 你们关于报请批准《西安市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《西安市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是西安市各类开发保护建设活动的基本依据，请认真组织实施。西安是陕西省省会，西部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，国家重要科研和文教中心。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥西部经济中心、科技创新中心、先进制造业基地、对外交往中心以及国际旅游目的地等功能，奋力谱写中国式现代化西安篇章。 二、筑牢安全发展的空间基础。到2035年，西安市耕地保有量不低于202.48万亩，其中永久基本农田保护面积不低于135.28万亩；生态保护红线面积不低于3795.65平方千米；城镇开发边界面积控制在1410.77平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过23.35亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。深度融入共建“一带一路”，积极参与西部陆海新通道建设，协同推动黄河流域生态保护和高质量发展，引领关中平原城市群协同发展，带动深化晋陕豫黄河金三角区域经济协作，加快西安—咸阳一体化进程，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，促进陕西西咸新区融合发展，加强中心城区与县城功能联动。持续加强秦岭生态屏障保护修复，修复渭河流域生态系统，加强荒山绿化，推动水土流失综合治理。保障现代都市农业空间需求，优化农业空间布局。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障先进制造业、高新技术产业和科技创新产业发展的空间需求，优化国际贸易、文化旅游和科研教育等现代服务业空间布局。提升国际航空、铁路枢纽功能，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。严格控制地下水开采利用。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，加强抗震减灾，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强秦始皇陵及兵马俑坑世界文化遗产和八路军西安办事处旧址等红色文化遗产保护，提升工业遗产保护和活化利用水平，严格地下文物埋藏区空间管控。加强对城市建筑高度、体量、色彩等空间要素的管控引导，整体保护“八水绕长安”的古都山水环境，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对西安市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。陕西省人民政府、自然资源部要指导督促西安市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。西安市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月17日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.149Z"},{"slug":"policy-20250122-09fa5bd5","title":"国务院关于《佛山市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕14号","publish_date":"2025-01-22","effective_date":"","status":"现行有效","level":"国家级","region":"佛山","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_7000443.htm","summary":"上级下达指标，其中2025年不超过23.44亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《佛山市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕14号 广东省人民政府、自然资源部： 你们关于报请批准《佛山市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《佛山市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是佛山市各类开发保护建设活动的基本依据，请认真组织实施。佛山是粤港澳大湾区重要的节点城市，国家历史文化名城。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥全国先进制造业基地、国际科技创新中心承载地等功能，奋力谱写中国式现代化佛山篇章。 二、筑牢安全发展的空间基础。到2035年，佛山市耕地保有量不低于27.86万亩，其中永久基本农田保护面积不低于24.66万亩；生态保护红线面积不低于323.06平方千米；城镇开发边界面积控制在1590.44平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过23.44亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。增强城市综合实力，积极共建粤港澳大湾区，纵深推进广佛同城化，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提高中心城区服务能级，加强南海区、顺德区与中心城区功能联动，推进高明区、三水区城镇集约紧凑布局。筑牢皂幕山、大南山等生态屏障，加强西江、北江流域生态保护修复，整体提升河流湖泊湿地生态系统的质量和稳定性，发挥好城镇组团间绿楔的生态功能。保障现代都市农业空间需求，拓展生态渔业、现代花卉等特色优势农产品生产空间，保护桑基鱼塘等传统农业空间。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障先进制造业和科技创新产业发展的空间需求，为推动粤港澳高端服务合作和珠江西岸先进装备制造产业带建设提供空间保障。强化与广州等周边城市在航空、铁路、公路等方面的功能协同，加强粤港澳大湾区港口群协调联动，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强自然保护地整体保护，加强佛山祖庙等文物和岭南文化保护。加强对汾江河沿岸建筑高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对佛山市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。广东省人民政府、自然资源部要指导督促佛山市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。佛山市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月18日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.178Z"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","type":"case","type_label":"案例","issuer":"文汇网","doc_no":"","publish_date":"2025-01-21","effective_date":"","status":"实践报道","level":"地方级","region":"上海","source_name":"文汇网（百家号官方账号）","source_url":"https://baijiahao.baidu.com/s?id=1821833824693888132&wfr=spider&for=pc","summary":"文汇网报道上海虹口欧阳路文化街区更新：全长1400米的欧阳路老旧公房高度集聚，2018年以来历经3次分段更新后完工，“百年欧阳”欧阳路文化街区焕新艺术展在朱屺瞻艺术馆开幕。更新以朱屺瞻艺术馆、环鲁迅公园艺文群落、欧邑小站等为节点，把工业遗存、名人故居与社区治理串接为街区记忆，属媒体报道而非政策原文。","themes":["历史文化街区","保护更新","城市更新","工业遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>欧阳路，虹口区一条全长仅1400米的小马路，老旧公房高度集聚。过去4年，欧阳路历经3次分段更新，于近日完工。今天，“百年欧阳”欧阳路文化街区焕新艺术展在朱屺瞻艺术馆拉开帷幕，图文并茂地记述了上世纪以来发生在这里的明媚瞬间。\u003c/p>\n\u003cp>依托这次更新，在这住了几年甚至几十年的居民，遇见了独属于欧阳路的街区记忆：能阅览鲁迅的名篇佳作，也能领略工业遗存之美；能听到刘良模在大洋彼岸传唱《义勇军进行曲》，也能窥见普通居民营造美好家园的努力；能读到画家朱屺瞻百岁入党申请书，也能看到儿童友好街区的生长……如果说在欧阳路大连西路路口的“起点”雕塑，以国歌旋律为灵感，寓意欧阳路的更新以发掘街区故事为起点；那么位于欧阳路临平北路路口的“华章”雕塑，则寓意书写当下华章的人们正向未来出发。\u003c/p>\n\u003cp>“欧阳路的更新，重现了百年历史记忆，更赋予了新的时代内涵。”欧阳路街道党工委书记程军说。欧阳路的更新不是一条路的外观变化，而是整个街区设施、产业、教育的变化，是内化的功能调整。聚焦社区生活，这场更新以街区记忆打开老旧城区蝶变新思路，让“15分钟社区生活圈”的承载愈发丰富，也让居民幸福感、归属感、自豪感油然而生。\u003c/p>\n\u003cp>“小小议事会”盘出“潜水艇”\u003c/p>\n\u003cp>在最近完成更新的欧阳路三期工程中，位于虹口区三中心幼儿园后门的新建游乐设施“潜水艇”颇受欢迎：孩子们透过“镜筒”观察外面的世界，路过的年轻人把内置攀爬网当“摇椅”休憩，周边居民在此晒太阳、遛狗逗猫……\u003c/p>\n\u003cp>“使用者想到更多玩法，赋予了装置新生命，更贴合‘社区生活向未来’的设计初衷。”欧阳路更新设计师张恺伦坦言，由于要兼顾安全性、实用性、娱乐性，这处“潜水艇”从酝酿到完工，足足用了一年半，“设计稿一改再改，但不变的核心，是要与这段街区产生强关联。”\u003c/p>\n\u003cp>不同于欧阳路一期更新着重挖掘红色故事、二期注重找寻工业记忆，位于四达路到临平北路之间的欧阳路三期工程，更聚焦儿童友好——在前期调研中，张恺伦发现，这里居民区一个连着一个，分布着两个幼儿园、两所小学，低龄孩子多，但由于小区配套设施有限，整条路上儿童玩乐设施匮乏。\u003c/p>\n\u003cp>经街道联络，张恺伦团队找到了三中心幼儿园负责人，邀请街道相关负责人、人大代表、政协委员、老师、家委会成员和孩子们开启“小小议事会”，讨论幼儿园后门老旧绿化的升级改造。会上，孩子们提出想要游乐设备，家长希望增加运动场地，老师提议开辟自然观察角，意见并不统一。更难的是，大家还提到绿化带靠近马路，得保障孩子游玩安全。\u003c/p>\n\u003cp>经过近一年的设计调整，“潜水艇”方案最终高票通过——好似艇舱的外结构圆润不可攀爬，避免使用者摔伤，内置网兜爬架及落地四面开口的设计，能让孩子在其间嬉戏奔跑，增加运动量；“潜水艇”所在地面铺上蓝色塑胶并形成斜坡，不仅与幼儿园操场主色调一致，还呼应流经街区的沙泾港水系，也方便儿童推车等无障碍通行；步道两侧预留植物盆栽位，可供种植观测，并与马路沿街处形成天然隔断。\u003c/p>\n\u003cp>“综合各方意见、平衡各方利益打造的‘潜水艇’，让孩子们有参与感、成就感，也让我们看到了这次更新的细心、用心。”家委会代表马先生说。\u003c/p>\n\u003cp>塘里版“清明上河图”留住烟火气\u003c/p>\n\u003cp>处在四达路与吉祥路之间的欧阳路三角地块，名为“塘里”。欧阳路更新设计师李云白考证，这里是欧阳路最早的居民集聚区。2021年，塘里完成旧改征收，如今正待新生。\u003c/p>\n\u003cp>这些年，美化旧改地块围墙在上海兴起。不同于风貌地块、网红街区，李云白觉得，这处围墙“应该把居民的记忆画出来”。从2021年起，李云白团队先后四次找到塘里及周边居民了解情况，听居民们拿着画作、照片、报纸等讲述着曾经。\u003c/p>\n\u003cp>在去年夏天落成的140米长卷上，95后画师留下了上世纪为人称道的童年回忆书店、公牛修车、小胖仔新衣坊，也画下了本世纪好评连连的社区食堂、祥云敬老院；留下了记忆里水门汀砌成的水斗、电子管二厂的木门，也画下了在欧阳路上学习、生活、工作了大半辈子的“行走党课”创始人张家禾。\u003c/p>\n\u003cp>在李云白看来，这就像塘里版的“清明上河图”，留住烟火气，流淌人情味。受此启发，在欧阳路沿街宣传位上，设计团队留下了10块“画布”，“让居民用有感而发的生活，把这些留白填满”。\u003c/p>\n\u003cp>“文化街区”孕育新故事\u003c/p>\n\u003cp>本世纪初，欧阳路起始处的围墙上，写的是“欧阳路文化活动街”。在居民们的见证下，这里焕新为“欧阳路文化街区”。从“街”到“街区”，正是城市更新辐射效应的体现。\u003c/p>\n\u003cp>一方面，为期四年的更新连点成片，将散落的故事、记忆幻化为连续的景观、装置，并带动交错马路的发展，形成了更大的更新效应。以贯穿欧阳路的祥德路为例，这里建成了大排长龙的“栖心小窝”社区食堂，引进了数家价廉物美的食品店、餐厅，打造了祥德坊科技养老产业园，成就了“欧阳街区高分烟火气”。今年，祥德路、欧阳路、甜爱路所环绕的虹口区254、255地块被纳入了全市城市更新示范项目，这一片区将再迎高阶跃升。\u003c/p>\n\u003cp>另一方面，过去4年间，欧阳路上的朱屺瞻艺术馆、欧邑小站等被纳入环鲁迅公园艺文群落，而欧阳路祥德路交叉处的3所学校被世外系吸收，社区治理迎来新生力量。同时，通过积极发掘社区达人、引进社会组织，以戏剧为媒，提升街区艺术氛围，渗透文化内涵。\u003c/p>\n\u003cp>在位于欧阳路中段的欧阳路街道中部片区党群服务中心，戏剧正成为黏合剂，吸引沪上年轻人到来。欧阳路街道居民王煜与戏剧爱好者成立“首望剧社”，定期来此排演；专业戏剧人与欧邑小站结成“欧邑小戏”戏剧孵化基地，把沿街空间变成戏剧工作坊，还带着小居民办了10期剧社活动。\u003c/p>\n\u003cp>“欧邑小戏”原创剧目《路》首演，讲述的正是20世纪初广东籍商人欧阳星南为抵抗英美租界“越界筑路”，出资修建欧阳路的故事。“居民需要什么，我就造什么，新的时代总有新的路。”《路》的主角是一名年轻设计师，他接着说，“我准备把欧阳路上那间空置的小仓库改成小剧场，再把这条路上的新故事写进剧本里……”\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"},{"slug":"case-20241201-51c8a196","title":"尼亚国家公园洞穴考古遗产（马来西亚）","publish_date":"2024-12-01"}],"updated_at":"2026-11-19T07:28:16.000Z"},{"slug":"policy-20250117-f8824b97","title":"国务院关于《拉萨市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕10号","publish_date":"2025-01-17","effective_date":"","status":"现行有效","level":"国家级","region":"拉萨","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_6999497.htm","summary":"西藏自治区首府，国家历史文化名城，全国性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《拉萨市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕10号 西藏自治区人民政府、自然资源部： 你们关于报请批准《拉萨市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《拉萨市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是拉萨市各类开发保护建设活动的基本依据，请认真组织实施。拉萨是西藏自治区首府，国家历史文化名城，全国性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥具有雪域高原特色的国际旅游目的地等功能，奋力谱写中国式现代化拉萨篇章。 二、筑牢安全发展的空间基础。到2035年，拉萨市耕地保有量不低于76.61万亩，其中永久基本农田保护面积不低于54.92万亩；生态保护红线面积不低于9674.59平方千米；城镇开发边界面积控制在230.55平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过7.37亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。深度融入共建“一带一路”，加强对接成渝地区双城经济圈，有力服务边境地区建设，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，促进拉萨河南部地区功能集聚和紧凑布局，辐射带动县城、小城镇发展，支持就近城镇化。保护好青藏高原生态，筑牢念青唐古拉山和郭喀拉日居山高原山体生态屏障，加强全域生态保护修复，整体提升拉萨河、拉鲁湿地、纳木错等河流湖泊生态系统的质量和稳定性，管理好黑颈鹤等高原高寒生物的栖息地和迁飞通道。拓展高原特色农牧业生产空间，保障高原现代农业空间需求。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障文化旅游等服务业发展空间需求。支持航空、铁路、公路基础设施建设，完善多向联通、多式联运的对外对内通道，做好重大基础设施的空间预留，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，加快建设国家清洁能源基地，积极稳步推进“平急两用”公共基础设施建设，优化防灾减灾救灾设施区域布局，适应减缓气候变化影响，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，增强基本公共服务的均衡性和可及性，完善城乡生活圈，促进职住平衡，提高群众生活品质；系统布局蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强拉萨布达拉宫历史建筑群世界文化遗产和纳木错—念青唐古拉山风景名胜区保护，保护城市内部及周边的林地草地。加强对八廓街历史文化街区及拉萨布达拉宫历史建筑群周边地区建筑高度、体量、色彩和景观视廊等空间要素的管控引导，构建文化资源、自然资源、景观资源整体保护的空间体系，塑造具有雪域高原和浓郁地域特色的城市特色风貌。 五、维护规划严肃性权威性。《规划》是对拉萨市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。西藏自治区人民政府、自然资源部要指导督促拉萨市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。拉萨市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月15日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.193Z"},{"slug":"policy-20250116-68aac374","title":"国务院关于《无锡市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕7号","publish_date":"2025-01-16","effective_date":"","status":"现行有效","level":"国家级","region":"无锡","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_6999060.htm","summary":"高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对无锡市国土空间作出的全局安排，是全市国土","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《无锡市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕7号 江苏省人民政府、自然资源部： 你们关于报请批准《无锡市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《无锡市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是无锡市各类开发保护建设活动的基本依据，请认真组织实施。无锡是长三角地区重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥全国先进制造业基地、区域性科技创新高地和文化创意基地、具有湖滨山水特色的风景旅游目的地等功能，奋力谱写中国式现代化无锡篇章。 二、筑牢安全发展的空间基础。到2035年，无锡市耕地保有量不低于116.95万亩，其中永久基本农田保护面积不低于104.88万亩；生态保护红线面积不低于840.28平方千米；城镇开发边界面积控制在1495.51平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过50.0亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。深度融入长江经济带发展、长三角一体化发展战略，主动融入上海大都市圈建设，促进环太湖地区城市、长江南北岸城市功能联动，加强苏锡常都市圈国土空间开发保护利用的区域协同，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，促进中心城区与江阴、宜兴协调联动发展。加快推进沿江岸线产业转型升级和岸线功能优化，系统推进太湖流域综合治理，改善太湖水环境质量，整体提升蠡湖、滆湖等湖荡水网生态系统的质量和稳定性，筑牢宜兴南部山区生态屏障。保障现代都市农业空间需求，优化农业空间布局。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障先进制造业、战略性新兴产业和环太湖地区科技创新产业发展的空间需求，优化文化创意等现代服务业布局，为推动传统产业转型升级提供土地政策保障。提升物流枢纽、航空枢纽功能，优化完善沪宁通道建设，深化沿江港口资源整合，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，加强洪涝灾害防治，优化防灾减灾救灾设施区域布局，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局与太湖、大运河交融的蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强大运河（江南运河无锡城区段）世界文化遗产和工业遗产保护利用。加强对城市建筑高度、体量、色彩等空间要素的管控引导，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对无锡市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。江苏省人民政府、自然资源部要指导督促无锡市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。无锡市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月12日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.220Z"},{"slug":"policy-20250116-f9431d40","title":"国务院关于《常州市国土空间总体规划（2021—2035年）》的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2025〕9号","publish_date":"2025-01-16","effective_date":"","status":"现行有效","level":"国家级","region":"常州","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202501/content_6999061.htm","summary":"文化遗产与自然遗产空间保护机制，加强大运河（江南运河常州城区段）世界文化遗产和红色文化遗产保护。加强对城市建筑高度、体量、色彩等空间要素的管控引导，重点保护淹城遗址，保护好历史城区和历史文化街区，构建","themes":["国土空间规划"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于《常州市国土空间总体规划 （2021—2035年）》的批复 国函〔2025〕9号 江苏省人民政府、自然资源部： 你们关于报请批准《常州市国土空间总体规划（2021—2035年）》的请示收悉。现批复如下： 一、原则同意自然资源部审查通过的《常州市国土空间总体规划（2021—2035年）》（以下简称《规划》）。《规划》是常州市各类开发保护建设活动的基本依据，请认真组织实施。常州是长三角地区重要的中心城市，国家历史文化名城。《规划》实施要坚持以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，完整准确全面贯彻新发展理念，坚持以人民为中心，统筹发展和安全，促进人与自然和谐共生，发挥全国先进制造业基地、区域性科技创新高地等功能，奋力谱写中国式现代化常州篇章。 二、筑牢安全发展的空间基础。到2035年，常州市耕地保有量不低于126.08万亩，其中永久基本农田保护面积不低于114.96万亩；生态保护红线面积不低于346.10平方千米；城镇开发边界面积控制在925.06平方千米以内；单位国内生产总值建设用地使用面积下降不少于40%；用水总量不超过上级下达指标，其中2025年不超过31.0亿立方米。明确自然灾害风险重点防控区域，划定洪涝、地震等风险控制线以及绿地系统线、水体保护线、历史文化保护线和基础设施建设控制线，落实战略性矿产资源等安全保障空间。 三、构建支撑新发展格局的国土空间体系。深度融入长江经济带发展、长三角一体化发展战略，主动融入上海大都市圈建设，强化与南京都市圈功能联动，促进长江南北岸城市功能联动，加强苏锡常都市圈国土空间开发保护利用的区域协同，促进形成主体功能明显、优势互补、高质量发展的国土空间开发保护新格局。 四、系统优化国土空间开发保护格局。加快构建区域协调、城乡融合的城镇体系，提升中心城区服务能级，加快主城区和金坛区同城化发展，推进中心城区和溧阳市一体化发展，提升小城镇空间品质。恢复长江岸线生态功能，协同推进太湖流域综合治理，整体提升长荡湖、滆湖等湖荡水网生态系统的质量和稳定性，加强南山、茅山等山体生态系统保护与修复。保障现代都市农业空间需求，优化农业空间布局。完善城市功能结构和空间布局，协调产业布局、综合交通、设施配置和土地使用，优先保障先进制造业和科技创新产业发展的空间需求，为推动传统产业转型升级提供土地政策保障。整体提升综合交通枢纽功能，优化完善沪宁通道建设，深化沿江港口资源整合，完善多向联通、多式联运的对外对内通道，建设安全便捷、绿色低碳的城市综合交通体系。统筹水利、能源、环境、通信、国防等基础设施空间，积极稳步推进“平急两用”公共基础设施建设，加强洪涝灾害防治，优化防灾减灾救灾设施区域布局，提升水安全保障水平，提高国土空间安全韧性。统筹安排城乡公共服务设施布局，完善城乡生活圈，促进职住平衡；系统布局水乡特色鲜明的蓝绿开放空间，营造更加宜业宜居宜乐宜游的人民城市。严格开发强度管控，提高土地节约集约利用水平，统筹地上地下空间利用，大力实施城市更新，有序实施土地综合整治。彰显城乡自然与文化特色，健全文化遗产与自然遗产空间保护机制，加强大运河（江南运河常州城区段）世界文化遗产和红色文化遗产保护。加强对城市建筑高度、体量、色彩等空间要素的管控引导，重点保护淹城遗址，保护好历史城区和历史文化街区，构建文化资源、自然资源、景观资源整体保护的空间体系。 五、维护规划严肃性权威性。《规划》是对常州市国土空间作出的全局安排，是全市国土空间保护、开发、利用、修复的政策和总纲，必须严格执行，任何部门和个人不得随意修改、违规变更。按照定期体检和五年一评估的要求，健全各级各类国土空间规划实施监测评估预警机制，将规划评估结果作为规划实施监督考核的重要依据。建立健全规划监督、执法、问责联动机制，实施规划全生命周期管理。 六、做好规划实施保障。江苏省人民政府、自然资源部要指导督促常州市人民政府加强组织领导，明确责任分工，健全工作机制，完善配套政策措施，做好《规划》印发和公开。常州市人民政府要依据经批准的总体规划编制专项规划和详细规划，依据详细规划核发规划许可，加强城市设计方法运用，建立国土空间相关专项规划统筹管理制度，强化对各专项规划的指导约束；按照“统一底图、统一标准、统一规划、统一平台”的要求，完善国土空间规划“一张图”系统和国土空间基础信息平台，建设国土空间规划实施监测网络；建立健全城市国土空间规划委员会制度。自然资源部要会同有关方面根据职责分工，密切协调配合，加强指导、监督和评估，确保实现《规划》确定的各项目标和任务。各有关部门要坚决贯彻党中央、国务院关于“多规合一”改革的决策部署，不在国土空间规划体系之外另设其他空间规划。《规划》实施中的重大事项要及时请示报告。 国务院 2025年1月13日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.244Z"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","type":"case","type_label":"案例","issuer":"新华网·新华日报电子版","doc_no":"","publish_date":"2024-12-17","effective_date":"","status":"入选典型案例","level":"地方级","region":"苏州","source_name":"新华网·新华日报电子版","source_url":"https://www.xhby.net/content/s67569662e4b09f022e598ed0.html","summary":"苏州姑苏区32号街坊保护更新项目入选中共中央宣传部习近平文化思想研究中心组织编写的《习近平文化思想实践案例选编（2024年）》，是“积极推进文化遗产保护传承”方面的典型案例。实践涉及道前街、干将西路、养育巷、学士街范围内的历史建筑修缮与功能置换，由苏州名城保护集团统筹推进，并在地下综合管廊建设中采用“明挖+顶管”组合方式。","themes":["历史文化街区","保护更新","文化遗产保护传承","城市更新"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>古城三十二号街坊新传——走进文化遗产保护传承“姑苏案例”_中国江苏网 英文版 电子报 + - 中国江苏网 &gt; 江苏要闻 &gt; 正文 古城三十二号街坊新传——走进文化遗产保护传承“姑苏案例” 1 放大镜 秋冬交替，苏州道前街的银杏迎来最佳观赏期，四面八方赶来的男女老少徜徉其中，享受古城美好时光。 以这条银杏大道为南向边界，北至干将西路，东、西分别到养育巷、学士街，是苏州古城32号街坊的四至范围，这里是明清时期官署集中地，明清以来的名称、走向、格局一直延续至今。近日，“赓续古城历史文脉 焕发江南文化魅力—江苏省苏州市姑苏区实施32号街坊保护更新项目”从全国数百个案例中遴选而出，成功入选《习近平文化思想实践案例选编（2024年）》，成为“积极推进文化遗产保护传承”的三大典型案例之一。 苏州市姑苏区实施的32号街坊保护更新项目，创造性将古城保护更新提升同保护文化遗产、提升群众生活品质统一起来，以“绣花功夫”走出一条传承与创新并举、历史与现代交融、文化与经济共生的古城复兴之路，是赓续城市历史文脉、传承弘扬中华优秀传统文化的有益探索，成为贯彻落实习近平文化思想的生动实践。 记者来到32号街坊，亲身感受文化遗产保护传承的“姑苏案例”。 机制支撑，个案保护迈向成片更新 “上有天堂，下有苏杭。这里满足了我对江南水乡的所有想象！”趁着年假，深圳90后姑娘Dicey来到苏州，打卡“种草”已久的畅园有熊酒店。 “城中尚有小园，以畅园、壶园为最。”庙堂巷内的畅园，始建于清代，园子规模虽小，但造园手法细腻、布局精巧，是江南典型的小型私家园林。32号街坊启动保护更新后，对畅园2.2亩园林本体进行最少干预的零星修缮并对外开放，外围东侧建筑则改造成酒店会客空间，营造沉浸式私家园林生活体验。去年底营业后常“一房难求”。 32号街坊历史文化遗存丰富，拥有省市文保单位7处，市控保建筑7处，古井、古桥、古树遍布。老祖宗留下的宝贝，有的在保护修缮中，多数如畅园这般，有了新的打开方式。 “相比单体建筑的修缮利用，更难的是成片建筑群的保护传承。”持续的关注、参与，让苏州规划设计研究院历史文化名城中心主任、32号街坊社区规划师沈佶平愈发强烈地感受到，对32号街坊的保护传承，已逐步从过去对古典园林、古建老宅等历史遗存的保护利用，拓展至成片区域的保护、修缮、整治、管理、运营。在沈佶平看来，这种转变的背后，是顶层体制机制在强势支撑。两年前，苏州市委挂牌成立市属国企——苏州名城保护集团，担当19.2平方公里历史城区保护更新工作的主要平台和实施主体，就是一次重要的机制创新。 自那时起，32号街坊开始由一个国资平台统筹全域保护更新工作，进入三位一体、三步推进、三资统筹模式，即古城保护、老旧小区改造、城市更新，产权整理、保护修缮、招商运营，资金使用、资源利用、资产集中和运营管理统筹推进，破题传统搬迁收储、保护修缮等各个环节分别对应负责方，容易造成力量分散、二次施工、资金负担等问题。 跟随苏州名城保护集团旗下苏州名城更新发展有限公司副总工程师邵春辉来到32号街坊剪金桥巷地下综合管廊工地，在约2米高、1.6米宽的下沉空间里，一台远程操控的“迷你版”盾构机正忙着“顶管”作业。 “春节前会‘洞通’！苏州历史城区范围内还没有这样的先例，可以说是一次‘破局’。”邵春辉解释，目前古城架空线整治和入地工程基本都是明挖施工，这种方式难度小、速度快，但对路宽有要求，在狭窄街弄难以实施。32号街坊尝试以“明挖+顶管”的方式施工，更关键的是为老街坊建造一个“中央处理器”，往后供电、通信电缆以及供水管道等的检修、增容都能入廊搞定。“当然难度也大，且不论资金投入，脆弱的老宅旧屋、错综复杂的管线，都要摸清楚、协调好。这时候策划、投资、建设、运营一体化的优势就显现出来了。”邵春辉说。 试点编制防火保障方案，破解街坊消防设计和验收瓶颈，为姑苏区“保护更新防火技术导则（试行）”提供样本；改变由用地性质划分控制地块的传统做法，将街坊划分成面向项目实施操作的保护更新管控单元和实施院落，满足现行消防、建筑密度等改造要求……保护更新的过程中，32号街坊不断创新体制机制，许多悬置未决的问题有了答案，许多左右为难的矛盾有了出路。 融入市场，文化遗产焕发新魅力 午后，漫步32号街坊，除了围坐在一起晒太阳、唠家常的老居民，你还很有可能偶遇捧着热咖啡Citywalk的金融界白领精英。 32号街坊正以“金融街坊”为产业定位，发展“院落经济”——在街坊内规划32处金融小院，招引金融机构、投资类企业入驻。当下，已有苏州基金、苏州银行、苏州资管、哇牛资本等26家金融投资类企业完成注册。 庙堂巷14号，一处坐北朝南、三进院的老宅，清末叶姓进士曾居于此。近段时间，专注于半导体等领域的新锐私募股权投资机构哇牛资本迎来送往十分热闹。“我们邀请股东、LP、被投企业来‘新家’体验，还在这里办了一期‘CEO大师班’，反响特别好。”哇牛资本赋能中心副总监徐黛瑛感慨，在“自家”宅院接待客人、办活动，和在星级酒店的感觉完全不一样，很松弛，有亲近感。徐黛瑛和同事也有幸福感：晴天，阳光透过院井照上工位；雨天，雨打屋檐的回响是最动人的背景乐。 使用是最好的保护。打开苏州市公共资源交易平台官网，点击进入“古保伙伴计划”专题，苏州古城内古建老宅的推介、挂牌、成交信息一目了然。这是去年6月苏州国家历史文化名城保护区、姑苏区启动的“古城保护更新伙伴计划”线上平台，以此邀请有文化情怀、责任担当、专业实力的“伙伴对象”入驻古城。 “一共上线了4批、70座古建老宅，其中21座来自占历史城区1.27%面积的32号街坊。”32号街坊地处姑苏区沧浪街道，街道党工委书记张卫认为，一方面体现了前期成片保护更新的效率和效果，一方面也反映了这项工作面临的新压力，活化利用要跟上节奏、更快行动。32号街坊的应对之策是融入市场、寻找“伙伴”，形成“政府主导、市场运作、多方参与”保护更新路径。 《赓续古城历史文脉 焕发江南文化魅力》一文中，有这样一句话：对于32号街坊保护更新项目，姑苏区委、区政府有一个明白账，算经济账、更算文化账，算短期账、更算长远账。身处其中，记者对这句话有了切身体会。32号街坊保护更新讲究效率，也坚持原则，活化利用项目优先考虑与街坊、宅院本身历史文化属性的匹配度，“金融街坊”如此，中医主题文化馆、绛书房等皆是这般。 古城是苏州的心脏，历史上也是苏州的金融中心。上个月，32号街坊联合苏州银行在其入驻的桃园举办“资本融通赋能新质”主题沙龙，共话“金融街坊”文化金融深融发展新策略。 瓣莲巷4号曹沧洲祠，是为纪念吴门医派代表人物曹沧洲仁医精神而建，现由吴门医派“老字号”企业雷允上“接手”，打造集医理展示、非遗体验、门诊坐堂于一体的中医主题文化馆。 女性主题书店绛书房本月初在剪金桥巷58号开业。“杨绛先生曾在附近庙堂巷度过青葱求学时光。一方书房，是后辈对先生的深深纪念。”书店主理人唐国良也曾居住于此，他坦言，回归32号街坊，是情怀，也是追随时代、追随市场，“一个会讲故事的地方，商气、人气不会差。” 以人为本，共创苏式生活好福气 从绛书房走出，经过剪金桥巷54号，手冲咖啡的香气扑鼻。“进来喝杯咖啡！”查嘉麟并不是咖啡店的老板，而是一位热情好客的房东，兴致来了他还会化身导游，带着游客、顾客参观自家的宅院。 查宅有不少“镇宅之宝”。咖啡店门面正上方的“光前裕后”砖刻门额，由李鸿章亲笔书写并赠与部下查氏，也就是查嘉麟的先祖。院子里还有一棵百年石榴树，每年丰收时节，查老都会邀请街坊邻居前来品尝。“上个月摘果的时候，院子里特别热闹，查老专门送来不少，被我做成特调限定，成为爆款。”主理人王燕才来不久，她说，那几个石榴，让她仿佛一下子融入了这个地方。 原住民是古城、历史街区、街坊的灵魂，他们的生活方式、民俗风情、待客之道等都是当地传统文化的重要组成。32号街坊有22栋零星居民楼和约300个传统民居大院。保护更新项目实施之前，这里普遍存在房屋建筑质量老旧、基础设施薄弱、公共空间品质低等问题。特别是居民大院，有的小院子十几户人家共用一个厕所、厨房。 在32号街坊，保护更新的过程，也是居民生活品质跃升的过程。 “大伙都知道‘老房子一栋也不能拆’，但有的房子已经到了根本住不了人的地步。”年过六旬的荣幼竹在盛家浜10号住了30多年，最害怕下雨天，“外面大雨、里面小雨，社区请人来修了好多次都没用。”32号街坊保护更新项目启动后，政府把留下或迁居的选择权交给居民，荣幼竹与院子里的十几户人家一起住上了电梯房，盛家浜10号被列入第一批“伙伴计划”。“老宅子有了更好的归宿，我们都很开心。”荣幼竹的故事，也被写进这个“姑苏案例”。 选择留下的居民，如何提高生活品质？32号街坊对老旧小区、零星楼及背街小巷开展整治，完善基础配套、提升人居环境。真实发生的几个小故事被津津乐道：征求意见时，有居民提到小时候家门口有一排樱花树，后来真给安排上了；有居民想要公共活动空间，24小时共享书房建起来了。以人为本、惠民利民，延续了古城的人情与文脉，老百姓对街坊保护更新的满意度、参与度更高了。 “老街坊”乐陶陶，“新街坊”笑盈盈。老字号“馀昌钟表”在剪金桥巷开的分店正在装修中，“一切交给时间”是副总经理谢天豪常说的“行话”，也表达了他对32号街坊发展的信心。因为外公外婆住在32号街坊，谢天豪从小是这里的常客，从这位90后的视角看这片熟悉的地方，黑白灰的古旧宅屋还是小时候的样子，但里面的生活早已地覆天翻。“人人向往的‘小桥、流水、人家’，以前说的是‘老苏州’的苏式生活，现在讲的是新老街坊共创共享当代苏式生活的美好。”谢天豪说。 去年7月6日，习近平总书记来到苏州平江历史文化街区考察调研，强调“住在这里很有福气，古色古香，到处都是古迹、到处都是名胜、到处都是文化。‘百步之内，必有芳草’，这句话可以用在这里。”眼下，以32号街坊为代表的保护更新项目在苏州古城实施推进，“百步之内，必有芳草”随处可及，苏式生活的好福气洋溢在古城街头巷尾。 记者 陈雨薇 标签： 责编：路航 特别推荐 新华日报电子版 党的二十届五中全会 C大调·绿洲中国 网络中国节·清明 锲而不舍落实中央八项规定精神 习近平法治思想“E起学习”平台 匠心江苏 学习雷锋好榜样 文明实践我行动 下载 本站不良内容举报信箱：jubao@jschina.com.cn 举报电话：（025）84737000 广告服务 | 网站律师 | 联系方式 苏ICP备07000608号 国新网许可证3212006001号 视听节目许可证1008318号 广播电视节目制作经营许可证苏字第394号 电信增值业务经营许可证苏B1,B2-20210399\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"},{"slug":"case-20241201-51c8a196","title":"尼亚国家公园洞穴考古遗产（马来西亚）","publish_date":"2024-12-01"}],"updated_at":"2026-11-16T09:05:28.286Z"},{"slug":"policy-20241216-2933897e","title":"国务院关于同意将江苏省兴化市列为国家历史文化名城的批复","type":"policy","type_label":"政策","issuer":"国务院","doc_no":"国函〔2024〕189号","publish_date":"2024-12-16","effective_date":"","status":"现行有效","level":"国家级","region":"兴化","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202412/content_6992787.htm","summary":"国务院关于同意将江苏省兴化市 列为国家历史文化名城的批复 国函〔2024〕189号 江苏省人民政府： 你省关于申报兴化市为国家历史文化名城的请示收悉。现批复如下： 一、同意将兴化市列为国家历史","themes":["历史文化名城"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国务院关于同意将江苏省兴化市 列为国家历史文化名城的批复 国函〔2024〕189号 江苏省人民政府： 你省关于申报兴化市为国家历史文化名城的请示收悉。现批复如下： 一、同意将兴化市列为国家历史文化名城。兴化市历史悠久、文化厚重，传统格局和历史风貌保存较好，地域特色鲜明，文物和文化遗产资源丰富，非物质文化遗产缤纷多彩、活态传承，具有重要的历史文化价值。 二、你省、泰州市及兴化市人民政府要以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届二中、三中全会精神，深入学习贯彻习近平文化思想，按照党中央、国务院决策部署，牢固树立保护历史文化遗产责任重大的观念，落实《中华人民共和国文物保护法》、《历史文化名城名镇名村保护条例》要求，深入研究发掘历史文化资源的内涵与价值，系统开展考古调查和史料研究，厘清兴化古城的空间格局和发展脉络，明确保护的原则和重点，强化历史文化资源的保护利用，传承弘扬中华优秀传统文化，讲好中国故事。编制实施好兴化市历史文化名城保护规划和文物保护等专项规划，制定并严格实施保护管理规定，明确各类保护对象的清单以及保护内容、要求和责任。正确处理城市建设与历史文化资源保护的关系，摸清文物资源家底，加强文物保护，完善“先调查、后建设”、“先考古、后出让”制度，重视保护城市格局和风貌管控，加强整体性保护、系统性保护；保护修复历史文化街区，补足配套基础设施和公共服务设施短板，不断提升人居环境品质；加强不可移动文物和历史建筑修缮保护，推动文物保护单位开放利用，充分发挥不可移动文物和历史建筑的使用价值。不得改变与名城相互依存的自然景观和环境，不得进行任何与名城环境和风貌不相协调的建设活动，不得损坏或者擅自迁移、拆除不可移动文物和历史建筑，涉及文物的建设项目要依法履行报批程序。进一步强化责任落实，对不履职尽责、保护不力，造成名城历史文化价值受到严重影响的行为，依法依规加大监督问责力度。 三、你省与住房城乡建设部、国家文物局要加强对兴化市国家历史文化名城保护工作的指导、监督和检查。 国务院 2024年12月12日 （此件公开发布）\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.260Z"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","type":"case","type_label":"案例","issuer":"福建日报（新福建）","doc_no":"","publish_date":"2024-12-13","effective_date":"","status":"入选典型案例","level":"地方级","region":"屏南","source_name":"福建日报（新福建）·文旅宁德","source_url":"https://share.fjdaily.com/displayTemplate/news/newsDetail/1161/2976236.html?isView=true","summary":"福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践入选《习近平文化思想实践案例选编（2024年）》，为宁德唯一入选案例。屏南现有中国传统村落25个、省级传统村落9个，占全县行政村的22.4%，并拥有中国历史文化名镇名村3个、省历史文化名镇名村6个。当地以文化产业发展为切入点，通过创新人才引育机制、活化闲置老屋资源、推动产业融合发展，打造龙潭、厦地、四坪、前汾溪等一批文化特色村。","themes":["传统村落","乡村振兴","文化遗产保护传承","文创赋能"],"featured":1,"attachments":[],"bodyHtml":"\u003cp>宁德1案例入选 近日，由中共中央宣传部习近平文化思想研究中心秘书处组织编写的《习近平文化思想实践案例选编（2024年）》正式出版，全书收录了以习近平文化思想的“十六个方面战略部署”为框架编写的45个典型案例。 宁德屏南实践案例《以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的新路径》入选。 图源|福建新华书讯 LOOK 图源|李锐/摄（已获授权，未经作者同意禁止转载） 屏南县现有中国传统村落25个、省级传统村落9个，占全县行政村的22.4%，数量居福建省前列 ；还拥有中国历史文化名镇名村3个，省历史文化名镇名村6个。但在城镇化浪潮下，与全国不少乡村一样，有近八成农村人口外流，乡村“空心化”、老屋荒废等情况突出。 为突破这一困境，屏南县切实扛起“把老祖宗留下来的文化遗产精心守护好”“把闽东之光传播开去”的政治责任、文化责任， 以文化产业发展为切入点，采用创新人才引育机制、活化闲置老屋资源、推动产业融合发展等做法，打造了龙潭、厦地、四坪、前汾溪等一批文化特色村 ，来自香港、北京、上海、深圳等地“新村民”纷至沓来，曾经偏远落后的“空心村”成为全国闻名的“网红村”，成为奔波、焦虑的城市人休憩和清醒的目的地，满足游客们对“诗和远方”的向往，让传统村落真正实现“见人、见物、见生活”。 这个冬天 到屏南传统村落 寻找那份最久远而温暖的乡愁吧~ 图源|小红书@安柒映画（摄影）（已获授权，未经博主同意禁止转载） 龙潭村 屏南传统村落之旅 龙潭村，至今已有600多年历史。四面环山，一条小溪从村中流过，溪水清澈见底，村中保留大量的古村落建筑群以及“国家级非遗”四平戏和“省级非遗”黄酒酿造技艺。村内目前有公益画室和酒博物馆、戏博物馆、美术馆、音乐厅等。定时举办“龙潭戏曲文化节”，活跃村落文化。秋冬季的龙潭村，古色古香的建筑加上柿子的点缀，随便一拍都是美图。 图源|谢舒婷/摄（已获授权，未经作者同意禁止转载） 四坪村 屏南传统村落之旅 四坪村与龙潭村相隔四公里，是中国传统村落和福建省级历史文化名村。一幢幢特色古民居依山而建，青石铺路、叠石流水，古韵悠悠。近几年，小毛驴四坪农园、爱故乡驿站、大树学堂、星空营地、爱故乡书吧、四坪公益艺术教育中心、南山音乐吧、平讲戏研习所等项目陆续建成投用，打造“四坪喜柿”特色IP，引发一波波“赏柿”热潮，四坪村成为广大游客追逐体验的“诗与远方”。 厦地村 屏南传统村落之旅 厦地村位于屏南县屏城乡东南部，距今已有800多年的历史，是“屏南四大书乡”之一。它藏在群山褶皱里，古民居依山势而建，仍然保持着明清时期的建筑风貌。村中小溪穿流而过，黄墙黛瓦，错落有致，傍山结庐，一处隐于乡野的世外桃源。南京先锋书店在此打造了福建省的第一家乡村书店——先锋厦地水田书店，成为特色地标。 基地大门|屏南县文体和旅游局供图 基地外立面|屏南县文体和旅游局供图 图源|小红书@黄33（独家授权，禁止转载） 前汾溪村 屏南传统村落之旅 前汾溪村位于屏南县屏城乡，是个有着近千年历史的传统村落，这里群山环绕、溪水潺潺、古木苍翠，土墙黑瓦的闽东北山地古建筑随处可见。前汾溪村是全省25个首批美育培育村之一。2019年10月，中国美术学院社会美育综合实践基地在前汾溪村落地运营，每年有上万人（次）到基地开展文艺创作、艺术交流、设计创新、教育培训、公益美育课堂等活动。2023年4月，“乡野艺校”联合福建大梦书屋旗下子品牌“大梦悦读”，打造一个集阅读学习、概念餐饮、美学生活、社区发展于一体的复合型空间，构建起一处融汇知识与生活的文化共享平台与多功能文化地标。 图源|屏南文旅供图 图源|屏南文旅供图 图源|屏南文旅供图 北墘村 屏南传统村落之旅 红粬黄酒第一村——北墘村位于屏南县代溪镇东南部，第三批中国传统村落。村落传统格局保持完整，传统建筑中大部分是古民居，同时种类丰富，有祠堂、庙宇、门楼、炮楼、歇亭、水碓房和廊桥等。北墘村从事红粬黄酒酿造农户占全村农户99%。近年来，北墘村立足本村实际，定期举办黄酒文化节，还先后与福建阳光学院、江夏学院、福建工程学院等院校合作，深入挖掘北墘村历史、黄酒等特色文化资源，强化特色文创产品研发，进一步打响北墘黄酒的知名度。 …… 炊烟袅袅，黛瓦爿爿 那一片柿红，那一碗酒香 那一缕乡愁，那一抹月光 在屏南乡村 走着走着 就走进了美妙的时光记忆中\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241201-51c8a196","title":"尼亚国家公园洞穴考古遗产（马来西亚）","publish_date":"2024-12-01"}],"updated_at":"2026-11-16T09:05:28.428Z"},{"slug":"policy-20241211-198fd8c3","title":"开封市《宋都古城国家文物保护利用示范区建设实施方案》（汴政〔2024〕14号）","type":"policy","type_label":"政策","issuer":"开封市人民政府","doc_no":"汴政〔2024〕14号","publish_date":"2024-12-11","effective_date":"2024-12-03","status":"现行有效","level":"地方级","region":"开封","source_name":"开封市人民政府（政府网站公开内容）","source_url":"https://www.kaifeng.gov.cn/kfsrmzfwz/gkwhycbhqk/pc/content/content_2000403706306490368.html","summary":"开封市人民政府以汴政〔2024〕14号印发《宋都古城国家文物保护利用示范区建设实施方案》，2024年12月3日成文、12月11日通过政府网站公开发布，是开封市推进宋都古城国家文物保护利用示范区建设、统筹历史文化保护与城市更新的综合性政策文件。","themes":["历史文化名城","文物保护利用示范区","宋都古城","城市更新"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>开封市人民政府关于印发河南开封宋都古城国家文物保护利用示范区建设实施方案的通知 - 开封市人民政府网站 网站支持IPv6 发展规划 优化营商环境 “十四五”规划 医疗保险 市政府 新闻动态 政务公开 政务服务 政民互动 走进开封 数据发布 您当前的位置： 11410200005317445G/0002858 汴政〔2024〕14号 2024-12-03 2024-12-11 通知 有效 发文机关 ： 开封市人民政府 废止日期 ： 开封市人民政府 关于印发河南开封宋都古城国家文物保护利用 示范区建设实施方案的通知 来源： 发布时间： 各县、区人民政府，市人民政府各部门及有关单位： 《河南开封宋都古城国家文物保护利用示范区建设实施方案》已经国家文物局原则同意，现印发给你们，请结合实际，认真贯彻落实。 2024年12月3日 （此件公开发布） 河南开封宋都古城国家文物保护利用示范区 建设实施方案 为全力推进河南省开封市创建宋都古城国家文物保护利用示范区工作，根据中共中央办公厅、国务院办公厅《关于加强文物保护利用改革的若干意见》以及《国家文物局关于印发〈国家文物保护利用示范区创建管理办法（试行）〉的通知》《国家文物局关于同意创建河南开封宋都古城国家文物保护利用示范区的函》等文件精神，结合开封市实际，制定本建设实施方案。 一、总体要求 （一）指导思想 以习近平新时代中国特色社会主义思想为指导，全面贯彻党的二十大和二十届历次全会精神，学习领会习近平总书记对文物、文化遗产、城市（镇）工作的重要论述和指示批示精神，贯彻落实中央、省关于文物保护利用工作的部署，践行“保护第一、加强管理、挖掘价值、有效利用、让文物活起来”的工作要求，坚持新发展理念，探索开封作为大型古今重叠型城市在大遗址考古展示、文物建筑活化利用、古城风貌更新保护等方面的新思路、新方法、新格局，构建具象化、沉浸式的多元立体保护展示体系，打造中华文化重要标志。统筹兼顾古城保护和经济社会发展，让文物和文化遗产保护成果更多惠及民生，让历史文化和现代生活融为一体。把宋都古城文物保护利用和文化遗产保护传承，作为践行习近平文化思想的生动实践典范，为铸牢中华民族共同体意识、建设文化强国和中华民族现代文明贡献力量。 （二）创建原则 1.坚持保护第一。秉持正确的古城保护理念，做好考古前置，以《北宋东京城遗址保护规划大纲》为统领，全面保护古城的各类文物和文化遗产，正确处理好古城保护和城市更新发展的关系，以对历史负责、对人民负责的态度，保护好宋都古城的真实性和完整性。 2.坚持深化改革。健全开封“文物+”协调机制，破解影响制约大遗址保护利用、古城有机更新、文物作用更好发挥的体制机制问题，研究出台拓宽示范区建设资金融资渠道、提高资源配置、利于调动社会力量积极性的创新举措，提升文物领域综合改革效能，激发文物事业发展活力。 3.坚持守正创新。分类评估、精准施策，在加强保护、深化研究的前提下拓展合理有效利用，在现代化建设中同步保护和弘扬优秀传统文化，不断提升文物和文化遗产活化利用水平，更好发挥文物和文化遗产见证历史、以史鉴今、启迪后人的作用。 4.坚持惠及民生。贯彻以人民为中心的发展理念，引导社会公众和资本积极参与，保障古城居民合法权益，激励原住民关心支持文物和文化遗产保护利用，推动从“要我保”转变为“我要保”，营造齐抓共管、自觉保护、共建共享的社会氛围。 （三）创建目标 全面加强文物保护利用和文化遗产保护传承，自觉担负起新的文化使命，将示范区打造成古今重叠型城市可持续发展的全国典范。遵循“老城不能再拆”的要求，统筹好古城地上地下文物整体全面保护、建筑有机更新、城市产业发展的关系，让市民在古城街巷也能过上舒适现代生活，创新“在保护中发展、在发展中保护”的可持续模式；深入挖掘开封4000多年建城史，做好“地下寻宋”考古工作，突出全面保护和重点展示，阐释好古城千年发展演变、文化绵延不绝、人民生生不息的内在历史根源与发展逻辑，展示好古城文物在实证中华文明突出特性中的重大历史价值，擦亮以北宋东京城为代表的开封宋都古城“金名片”。传承古城优良人文传统与民俗习惯，培育古城多元业态，创新发展与古城保护传承相适应、可赋能现代化建设和高质量发展的特色文物文化旅游，使“城河相依、生生不息”成为可知、可见、可感、可参与的活态历史场景。以示范区创建带动开封全域文物事业高质量发展，书写好中国式现代化文物新篇章的开封板块。 二、总体安排 （一）创建时间 2024年10月—2027年10月，共计3年时间。 （二）创建范围 宋都古城是以北宋东京城遗址为代表的各历史时期文化遗产的统称。其区域为开封市文物资源的重要集聚区、历史文化街区的汇集区、古都风貌的核心区、文化基因与城市记忆的贮存区；是提升开封城市形象气质、扩大城市影响力的关键区域。 核心区：开封城墙围合的13平方公里范围。 拓展区：北宋东京城外城遗址以内除去核心区的41平方公里范围（北宋东京城围合区域约54平方公里）。 （三）实施步骤 1.方案制定报批阶段（2024年1月—2024年9月） 做实开封市宋都古城国家文物保护利用示范区创建工作小组和办公室，组织编制《河南开封宋都古城国家文物保护利用示范区建设实施方案》（以下简称《方案》）及细则，明确目标任务。向国家文物局报告《方案》，并根据国家文物局反馈意见修改完善直至《方案》通过。 2.动员部署阶段（2024年10月—2024年11月） 根据国家文物局批复要求，召开全市创建工作动员部署会，下发《方案》及配套文件，明确目标任务、落实责任部门，通过各类媒体广泛开展创建宣传，增进市民、群众了解。 3.全面推进阶段（2024年12月—2027年4月） 贯彻“全面加强文物保护利用和文化遗产保护传承，自觉担负起新的文化使命，将示范区打造成古今重叠型城市可持续发展的全国典范”总体目标，落实《方案》各项工作，全面推进创建工作。推动示范项目建设、制度规范设计，并形成行之有效、可持续、可复制的保护传承活化利用新模式。 4.加速推进阶段（2027年5月—2027年7月） 依照《方案》对实际工作查漏补缺，落实整改措施，加快推进相关事项。 5.验收评估阶段（2027年8月—2027年10月） 对照《方案》，组织开展自查验收评估工作，并按期向国家文物局提交示范区创建验收报告，创成宋都古城国家文物保护利用示范区，持续推进，巩固提升创建成果。 三、主要任务和示范项目 （一）深入学习贯彻习近平总书记关于文物、文化遗产、城市（镇）工作的重要论述和指示批示 深入学习贯彻习近平总书记关于文物、文化遗产和城市（镇）工作重要论述和指示批示，深刻领会并把握核心要义与精神实质，不断增强对历史文物的敬畏之心，树牢保护历史文化遗产责任重大的观念、保护文物也是政绩的科学理念，统一思想，提高认识，把古城保护和现代化建设协调一致推进，以新时代开封文物工作高质量发展赋能人民群众美好生活；把示范区建设作为开封市增强“四个意识”、坚定“四个自信”、做到“两个维护”的重大实践检验，全面有力推动习近平新时代中国特色社会主义思想和习近平文化思想落地生根，开花结果，形成生动实践。 【重点示范项目1：将深入学习贯彻落实习近平总书记关于文物工作重要论述和重要指示批示纳入年度《县处级以上党委（党组）理论学习中心组分专题集体学习的安排意见》，在开封市委党校（市行政学院）开展专题讲座，分层分期对全市党员干部进行全覆盖式的学习培训，增强文物保护意识。】 （二）解放思想，改革创新示范区管理保护体制机制 将示范区建设纳入国民经济和社会发展规划，实现协调、可持续的发展目标。建立市、县（区）、乡（办事处）“文物+”工作调度协调机制，实现市内各部门围绕统一目标开展工作、协同联动，形成工作合力。推进文物工作治理体系和治理能力现代化，广泛动员社会力量参与，探索引进社会资本进入保护利用领域的有效途径，推进信息化和数字赋能，试点文物保护补偿政策，破解阻碍大遗址、文物建筑、文博场馆等良性发展的体制机制性问题。 【重点示范项目2：完善管理体制，挂牌成立开封市文物局。文物保护利用工作、文物安全工作相关指标纳入市、县（区）政府年度综合考核工作，利用考核目标驱动各部门共同投入文物保护利用事业。市委市政府组织研究、制订出台大遗址保护利用补偿机制、文物建筑活化利用奖补政策，完善文物保护工程管理办法，发布保护与活化利用优秀案例。研究出台非国有文物建筑、历史建筑修缮管理办法。】 （三）树立大保护理念，全面保护古城各类文化遗产 编制完善涉及宋都古城的各类保护规划并加强规划衔接，将《北宋东京城遗址保护规划大纲》纳入国土空间规划“一张图”，实施严格保护。严格落实“先调查、后建设”“先考古、后出让”制度，推动建立城市更新中文物资源调查和保护前置机制。做好第四次全国文物普查，补充、调整文物保护单位，实现保护对象应保尽保，依法加强各类各级文物及历史建筑产权梳理，全面摸排管理使用情况，完善不可移动文物资源管理制度，落实尚未核定公布为文物保护单位的不可移动文物保护管理措施。建立文物资源资产登记制度。加强非物质文化遗产保护，不断完善四级名录体系。加强古城内历史地段、工业遗产、古树名木、农业文化遗产、地名文化遗产保护，明确保护责任人和机构。推进古城数字资源保存与情景再现工程，建设文物资源大数据库，为数据互联互通和共享应用奠定基础，加强资源数据学术化研究、可视化展示、数字化利用。 做好文物安全风险评估、专人负责，将文物安全工作列入年度工作计划，纳入政府年度目标考核评价体系，分级分类签订目标责任书，深化责任公示制度，精准制定应急预案，开展文物消防安全轮训及安全宣传工作，采取“领导+专家+专班”模式，按照“双随机一公开”机制，实行明查暗访，定期组织“四查”行动，形成文物保护工程专项监管检查机制，有效遏制文物法人违法行为。 【重点示范项目3：以示范区为重点，开展第四次全国文物普查，重点完成古城各类不可移动文物资源的调查认定，建立名录。完成编制并公布《北宋东京城遗址保护规划大纲》。推进编制《开封市文化遗产保护利用总体规划》，构建历史文化保护体系。坚持多规合一、多规融合，实现宋都古城“文物保护一张图”。】 【重点示范项目4：实施宋都古城文物平安工程。分类评估古城内文物风险并提出化解对策，完善文物保护单位“三防”。汲取河南大学大礼堂火灾事故教训，建立健全文物安全责任体系，定期研究和协调解决文物安全突出问题。实行文物安全责任制公告公示和文物保护工程安全责任公示，形成完善的文物安全保护网络。按照“一址一案”要求完善安全应急预案，每季度开展一次应急演练。建立轮训机制，分级培训，提升安全工作能力。建立文物、应急、消防等部门互动协作机制，形成文物安全排查、交办、整改、核查闭环管理模式。签订文物保护工程“三级”安全承诺书，全过程开展文物保护工程监管工作。构建与公安、住建、规划等部门协同机制，严厉打击有效遏制文物法人违法行为，加大开封城墙粮食五库、万岁山未批先建违法行为查处整改工作力度，通过整改促进工作提升，推动执法制度完善。】 【重点示范项目5：实施数字化保护管理工程。开封宋塔数字化记录保存工程。宋代州桥数字化复原研究与活化展示项目。开封文物资源数字管理平台建设项目，将文物信息数据、勘察设计数据、工程维修档案、预防性保护数据、安全巡查数据、监测预警等结合为一体，建设综合性管理系统，实现全面、精确、灵活的文物资源数据分析和动态管理。】 （四）确立大考古观，示范古都大遗址考古工作模式 重新组建跨区域、跨学科、跨部门开封宋都考古队，多团队协作、多学科合作，高质高效一体化推进古城大遗址考古工作，以发掘为核心凝练重大学术课题，贯通田野发掘、科技保护、研究阐释、成果出版、展示利用、公众服务等全链条，加快考古成果转化利用。开展全链条考古研学体验，发挥区位优势，构建“考古实践教育”交流枢纽，打造国际考古旅游先行区。依托重要考古遗迹原状保护现场，建设考古遗址博物馆（展示点），发挥好考古遗迹和出土文物见证历史、启迪后人、凝聚共同体意识、促进人文交流的重大价值作用。 【重点示范项目6：新组建开封宋都考古队，充分利用“城市考古与保护国家文物局重点科研基地开封工作站”平台，由国家、省、市考古机构联合组队。建立由考古、科技、文保、公众考古等领域顶尖专家组成的咨询委员会，围绕北宋东京城布局关键节点，采取考古和文物保护团队联合攻关模式，科学考古、及时保护，现场打通考古发掘、科技考古、文物保护三大环节，最大限度保存文物，全面提取历史信息，定期发布研究成果。】 【重点示范项目7：强化“城市考古与保护国家文物局重点科研基地开封工作站”，依托迎宾路开封博物馆老馆原有场馆建筑，改善陈旧基础设施，提升考古整理基地和区域文物库房基本功能，整理出版北宋东京城考古勘探报告、顺天门遗址考古报告、州桥遗址发掘报告、开封明代城市发掘报告等。】 【重点示范项目8：编制考古工作规划，强化北宋东京城布局考古研究，系统对东京城布局的关键城门、水门、桥梁、河道水系、城墙分布、道路分布、宫殿分布等内容进行主动性考古勘探和发掘，抓重点和关键，争取列入“考古中国”项目；以课题意识指导城区小、散、碎的配合基本建设考古项目，丰富宋都古城历史文化内涵。以布局研究为总纲，建立城市考古“一张图”大数据平台，统一坐标、高精度测量、三维建模、采集聚合出土文物信息、GIS空间管理，以“抠地”考古精神和“七巧板”拼图思维，把出土文物资料信息拼接成五彩斑斓的北宋东京城、拼镶成形象立体的“城摞城”，启动创建北宋东京城国家考古遗址公园。】 【重点示范项目9：开展宋都古城公众考古与开封“城摞城”考古研学，与河南省文物考古研究院、河南省博物院、首都师范大学、郑州大学、河南大学等高校、研究机构公众考古团队合作，持续开展宋都古城公众考古计划，普及宣传城市考古成果知识；支持考古专业团队和相关企业合作开发具有自主知识产权、富有开封考古遗产特色的“城摞城”考古研学课程，推进州桥、顺天门等遗址打造成“露天”历史课堂，把符合条件的大型老建筑改造为国内一流的考古研学营地，让青少年和历史文物爱好者能深入体验奔流不息的黄河与生生不息的古城相依相生的历史故事。】 （五）赓续古城风貌，推进文物建筑保护活化利用 创新文物建筑活化利用机制和策略，与省内高校、专业保护研究机构合作，开展活化利用中的文物价值评估、利用风险化解等实用研究，提出“一址一策”的活化利用方案。以重点文物建筑为对象，试点开展预防性保护，把预防性保护过程变成文物建筑展示大课堂。用心用情管好用好革命文物，打造革命文物保护利用体系。鼓励和支持社会资本和自然人对国有和集体所有的低等级文物建筑和历史建筑“认养”，在依规修缮后让渡一定期限的使用权给领养人。适当探索“产权置换”或“长期租赁”制度创新与试点，为社会资本参与活化利用创造政策条件。增添古城人文气息、生活气息，恢复北宋东京夜市文化习俗历史光彩，使飞速发展的城市和深厚的历史文化遗产和谐相处、交相辉映。 【重点示范项目10：与郑州大学建筑学院、河南大学土木建筑学院、省文物建筑保护研究院等单位签订文物建筑保护利用战略协议，发挥专业团队支撑作用，推进繁塔—禹王台片区、相国寺片区保护传承项目，开展文物本体维修保护和周边环境整治，完善文物保护和展示利用基础设施，深入阐释繁塔、禹王台文化内涵。实施名人史迹和故居（旧居）保护工程，综合统筹展示利用。探索引入文物建筑购买安全保险服务，化解文物建筑活化利用过程中的潜在风险，强化金融机构保障监督作用。】 【重点示范项目11：实施红色基因传承工程，推动《河南省革命文物保护条例》落地见效，实施《河南省新时代革命文物保护管理利用三年行动计划（2023—2025年）》，让开封红色文物“活”起来，做好国共“黄河归故”谈判旧址、刘青霞故居等修缮利用，与学校合作，打造学生思想政治教育第二课堂。】 【重点示范项目12：推进“开封夜市文化习俗”申报列入省级以上非物质文化遗产名录，出版调查研究专著；规范古城夜市经营管理，在提升品质和体验的同时，不断挖掘和增加文化内涵。】 （六）上下联动，建立“城摞城”博物馆体系 发挥宋都古城地上文物建筑、历史建筑、特色民居众多的优势，改造建设特色行业、专题博物馆。依托地下古城层层相摞、文物埋藏丰富厚重的特点，新建一批考古遗址公园、博物馆、口袋公园、城市文化绿地等，提升优化开封博物馆功能，打造“结构有序、功能互补、整体优化、共建共享”博物馆城市，加强博物馆运行管理。依托重点文物博物馆场所打造“小而精、小而特”的文化产业创意园区，形成具有开封特色的“址、馆、园”三位一体的多元立体展示利用体系。稳定古城常住功能，引入文旅消费、创意设计、休闲度假、创意人才聚居、人文交往、教育研修、论坛会议等多元业态，以久久为功的态度建设“古城都市文博区”。 【重点示范项目13：大力打造博物馆城市，实施“开封博物馆+”业务统筹下的博物馆总分馆制度，聚合人才和文物资源，保持相对独立特色的同时提升聚合效能。加快重点国有博物馆建设，依托文物建筑、历史建筑、工业遗产等打造各类特色行业和专题博物馆。建成黄河悬河博物馆，打造河南省黄河文化地标和黄河国家文化公园，集中展示黄河开封段悬河的形成过程以及“城摞城”的历史演变，揭示开封独特的城河关系。汴河博物馆（一期）依托汴河及州桥遗址出土文物遗迹，建设州桥大运河国家文化公园，展示汴河漕运兴衰、古都变迁兴替历史，打造“一眼千年”的历史人文景观。顺天门遗址博物馆着重展示北宋外城城门建筑形制及历史沿革，讲述唐宋至明清外城城门兴替故事，使之成为开封宋代营城文化的集中展示区，体验开封“城摞城”的重要窗口。举办城市历史文脉重塑三大展览：以宋文化考古为核心，展示宋辽西夏金元文化融合与民族共同体演化形成；以明清开封城市河患与考古遗存，展示治河与理政间的重大历史关系；以城市考古出土的反映日常生活、商业贸易和文化习俗的文物，讲述“清明上河˙东京梦华”的古城故事。】 （七）传承千年历史文脉，完整保护古城风貌格局 牢记“城市是一个民族文化和情感记忆的载体，历史文化是城市魅力之关键”，秉持正确的古城保护理念，切实保护好其历史文化价值。处理好继承和发展、传统和现代的关系，把促进古城现代功能提升与文物和文化遗产保护相结合，把古城文化遗产活化利用和发展相关适宜产业相结合，更多采取微改造的“绣花”功夫，坚决避免“拆真建假”等干扰公众正确历史认知的建设行为，完成开封城墙粮食五库段风貌整改，系统保护古城的中轴线、水系、城墙、街巷肌理、历史街区、里坊、文物片区等，保存好历史文化名城的无形优良传统，传承好古城非物质文化遗产和特色民俗，让宋都古城更好地体现地域特征、民族特色和时代风貌。 【重点示范项目14：北宋东京城御街中轴线历经宋金元明清民国，沿用保留至今，作为城市历史空间的“脊柱”，是完整性的突出代表。通过对宋都御街—中山路进行功能调整，周边环境整治，修复保护“御街”景观视廊；通过考古工作，谋划打造展示节点，联动开封龙亭文物景区，形成展示“宋物”、体验“宋服”、品尝“宋食”、营造“宋韵”的历史文化全景沉浸体验空间，打造古城千年中轴线文旅融合地标。】 【重点示范项目15：加强开封城墙保护管理，配备专门养护队伍，做好巡查岁修。建设宋都古城环城墙保护展示带，实施开封明清城墙贯通和周边环境整治提升工程，开展大南门保护展示项目，强化城墙为代表的文化地标；实施开封城墙地下人防空间及城北粮食五库地下空间整体提升工程，支持开辟城墙根早市，展现市井文化，联动城墙周边景区，把环明清城墙文化带打造成闭环通畅、主客共享的文化、生态、商旅综合体验空间。建设北宋东京城外城（宋外城）环城生态文化公园，结合历年来城市拆迁改造、涉城墙空间腾退审批成果等，尊重现实、因地制宜，实施宋外城城墙遗址保护展示工程，采取布置展示馆、遗迹展示点、地表模拟展示、植被标识、统一标识体系等方式，构建比较完整的宋外城展示空间，形成遗址公园。结合周边景观环境整治、城市道路建设和绿化等，串联市民公共文化中心等其它文旅设施，建设城市步行廊道。实施好古城水系整治项目。】 【重点示范项目16：实施古城街区、厢坊保护复兴项目，马道街侧重对街区范围内文物建筑、历史建筑进行保护修复，改善基础设施，提升环境；增加非物质文化遗产展示展演活动，增设小型演艺剧场、研学体验馆等。书店街侧重对街区内全国重点文物保护单位山陕甘会馆，省级文物保护单位中共豫陕区委旧址、信昌银号金库旧址进行整体保护，加大活化利用力度，创新发展与历史风貌、文物建筑相适应的文化体验、旅游休闲和商业业态等。花井街重点对街区内地方历史名人贤达的故居、旧居进行修缮和利用，整治环境风貌，改善基础设施，增加现代舒适性，以文物保护、历史街区修缮与文旅产业发展推动街区内人民群众生活环境改善提升。复兴坊实施街区内文物修缮利用，尊重和保障原居民权益，留住街区老传统，融入“夜宿”“饮食”“夜娱”等业态，全面重现独属于开封古城的闲适与浪漫。】 【重点示范项目17：古城优秀非物质文化遗产和民俗传承项目，依托古城大量的历史空间，鼓励和支持富有开封本地特色的汴绣展示、朱仙镇木版年画体验、撂石锁、开封夜市文化习俗等非遗项目活态传承。】 （八）讲好中国故事，构建新时代文物展示交流传播体系 依托宋文化考古成果，加强阐释宋代历史，全面展示宋文化，不断增进文化认同和历史认同，铸牢中华民族共同体意识，讲好中华文明多元一体演进故事。打造宋都古城特色文物主题游径，依据历史事实，以不可移动文物为主体、串联其他相关文化遗产资源，挖掘阐释宋都古城多重价值。积极融入“东坡行旅”中国文物主题游径，实施北宋东京城（跟着苏轼游汴京）活化利用工程。充分发挥文物商店作为合法购销文物渠道的正确导向，规范和推动文物艺术品收藏交易市场发展。发挥好开封自贸区文化艺术品免税基地作用，实施“引进来”工程，依托移动端传播形成多渠道、立体化交流展示体系，推动对外开放和文明交流互鉴。 【重点示范项目18：邀请国内外宋代历史、考古、建筑、艺术等领域知名学者，高水平举办宋韵文化交流活动；组织拍摄宋都古城系列纪录片，鼓励拍摄各类反映宋都古城保护成果和历史风貌的小视频、小电影，利用互联网平台传播。】 【重点示范项目19：谋划“跟着东坡游汴京”主题游径，以北宋东京城遗址相关遗迹为核心，串联现存繁塔、祐国寺塔、州桥及汴河遗址、顺天门遗址、西水门遗址、御街、皇城城垣、内城城垣等，融入西园雅集行迹故事，展现苏轼在京师才华大显、官场风云、为官之治等典故，展现以苏轼为中心的北宋文人雅士，吟诗作赋、弹琴赏画、抚琴拨阮的文坛趣事。】 四、保障措施 1.加强组织领导。建立河南开封宋都古城国家文物保护利用示范区创建工作机制。坚持高位协调，研究细化河南开封宋都古城国家文物保护利用示范区创建任务分工，协调各成员单位合力推进创建工作。建立会议制度，由市委书记、市长召集，成员单位共同参与，每个月专题研究一次工作，听取建设进展情况汇报，统筹利用各部门资源，强化工作的整体性、系统性、协同性、可持续性。河南省文物局加强与开封市委、市政府的工作协同，开展对国家文物保护利用示范区的创建管理和业务指导。 2.加大支持力度。多措并举拓展古城综合性保护和建设资金来源渠道，积极争取国家发改委、国家文物局、省发改委、省文物局对示范区建设的项目支持和业务指导，统筹部署、整合资源、协同行动，集中攻克建设中的重点任务和难题。河南省文物局在示范区文物保护利用重大项目、文物科技保护、人才培养培训、安全防范等方面加大支持力度；在博物馆展览、国际交流合作等文物领域重要活动方面给予优先考虑；在国家文物保护专项资金和省级文物保护经费分配时，优先考虑示范区重点建设项目。开封市本级通过加大财政资金支持力度，保障示范区内相关项目的实施；探索包装发行文保文旅债券等方式确保示范区建设资金投入，与中原文保基金合作开展重大文物保护项目定向募捐，在健全审批和监督机制的基础上，尝试引入国有资本和社会资本开展国有文物建筑活化利用。加强资金的绩效管理和监督审计，提升资金使用效益。 3.加强队伍建设。加强文物保护机构队伍建设，强化、充实文物行政管理机构人员。成立开封市创建国家文物保护利用示范区专家咨询委员会，紧密联合国内考古、宋史研究、城市规划、文化遗产保护、数字化展示等方面专家，为示范区建设提供专业指导、技术支撑。加强开封市文化市场综合行政执法支队与文物、公安、消防、市场监管、自然资源规划、住建、应急管理等部门执法联动，切实维护文物保护管理秩序，深入开展打击文物违法犯罪专项行动，坚决遏制文物违法犯罪活动。 4.强化督促落实。加强谋划指导、专业指导、督促检查，强化建设实施方案落实的动态监测、节点管理、协调调度、进度评估。各相关单位建立历史文化资源网格化管理制度，切实履行主体责任，细化分解实施方案重点工作任务，明确时间表和路线图，积极推进各项工作。 5.有序宣传引导。将对文物保护法律法规、习近平总书记关于文物工作的重要论述和批示指示精神、国家文物保护利用示范区创建等学习纳入市委党校干部教育教学内容；利用城市公共文化空间举办国家文物保护利用示范区创建宣讲，形成全社会理解、支持、参与宋都古城国家文物保护利用示范区创建的社会氛围。进一步加大对各级文物保护单位保护范围和建设控制地带保护要求的宣传力度，做到相关单位自觉遵守，全社会共同维护。建立、完善社会力量参与文物保护利用的工作机制，引导更多热爱文物事业、有专业能力的社团组织、个人参与示范区建设。 【下载DOC】 【关闭窗口】 点击查看 文件下载 相关信息 政府信息公开指南 政府信息公开制度 法定主动公开内容 政府信息公开年报 依申请公开 给市长写信 我要咨询 中央人民政府门户网站 河南省人民政府网站 省内各市政府网站 市政府部门 县(区)政府 主办单位：开封市人民政府办公室 协办单位：开封日报社 豫ICP备14019204号 豫公网安备41021102000181号 政府网站标识码：4102000008 地址：开封市晋安路158号 邮编：475004\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:05:28.698Z"},{"slug":"case-20241201-51c8a196","title":"尼亚国家公园洞穴考古遗产（马来西亚）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2024-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"马来西亚","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1014","summary":"尼亚国家公园洞穴考古遗产位于马来西亚，2024年列入联合国教科文组织《世界遗产名录》，列入标准为(iii)(v)，遗产类型为文化遗产。名录坐标：北纬3.8043，东经113.7808。","themes":["文化遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：尼亚国家公园洞穴考古遗产 英文名称：The Archaeological Heritage of Niah National Park’s Caves Complex 国家/地区：马来西亚 列入年份：2024 世界遗产标准：(iii)(v) 遗产类型：文化遗产 所属区域：Asia and the Pacific 名录坐标：3.8042916667, 113.7807666667 名录编号：1014 官方页面：https://whc.unesco.org/en/list/1014\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;该遗产位于婆罗洲岛西海岸附近的尼亚（Niah）国家公园中心，由相互连接的巨型洞穴组成。这里保留了人类在雨林活动的已知最长记录，从更新世到全新世中期，时间跨度至少5万年。山丘北部边缘有丰富的考古遗迹，以及史前岩画和船棺墓葬，展示了这一时期的生物和人类活动，并极大地增进了人们对东南亚乃至全球范围内人类发展、适应、迁徙相关知识的了解。当地居民在洞穴中收集鸟粪和珍贵的食用燕窝时，仍遵奉古老的莫隆（molong）传统，意为“只取所需”。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.675Z"},{"slug":"case-20241201-8d6b9c9a","title":"巴丹吉林沙漠——沙山湖泊群（中国）","type":"case","type_label":"案例","issuer":"联合国教科文组织世界遗产中心","doc_no":"","publish_date":"2024-12-01","effective_date":"","status":"世界遗产","level":"国际级","region":"中国","source_name":"UNESCO 世界遗产中心（World Heritage Centre）","source_url":"https://whc.unesco.org/en/list/1638","summary":"巴丹吉林沙漠——沙山湖泊群位于中国，2024年列入联合国教科文组织《世界遗产名录》，列入标准为(vii)(viii)，遗产类型为自然遗产。名录坐标：北纬39.8897，东经102.2894。","themes":["自然遗产"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>遗产地名称：巴丹吉林沙漠——沙山湖泊群 英文名称：Badain Jaran Desert - Towers of Sand and Lakes 国家/地区：中国 列入年份：2024 世界遗产标准：(vii)(viii) 遗产类型：自然遗产 所属区域：Asia and the Pacific 名录坐标：39.8897222222, 102.2894444444 名录编号：1638 官方页面：https://whc.unesco.org/en/list/1638\u003c/p>\n\u003cp>【官方描述】 &lt;p&gt;巴丹吉林沙漠地处阿拉善高原，属中国西北极干旱的温带荒漠地区，是中国第三大沙漠和第二大流动沙漠。该地区以连绵起伏的高大沙山和丘间众多湖泊而闻名，展示了沙漠景观不断变换的地质和地貌特征，令人叹为观止，全球少有沙漠可以比肩。巴丹吉林沙漠的重要标志包括世界最高的固定沙山（相对高度达460米）、最密集的沙漠湖泊、最广阔的鸣沙区域，以及多样的风蚀地貌。如此多样化的景观展示了巴丹吉林沙漠非凡的自然美学价值，代表地球上重要、典型且持续的风沙地貌发展过程，从而也造就了丰富多彩的生物栖息地。&lt;/p&gt;\u003c/p>\n\u003cp>【突出普遍价值（英文原文节录）】\u003c/p>","related":[{"slug":"case-20260723-e444b19b","title":"宜兴丁蜀陶二厂文化街区更新：老厂房里的陶式生活","publish_date":"2026-07-23"},{"slug":"case-20260406-4359aa8c","title":"解码文化自信的城市样本丨与古为新尽风华——解码“一城宋韵”开封的文化自信样本","publish_date":"2026-04-06"},{"slug":"case-20250121-d2f5d42d","title":"上海虹口欧阳路文化街区更新：百年欧阳的街区记忆营造","publish_date":"2025-01-21"},{"slug":"case-20241217-1d991d1c","title":"苏州姑苏区32号街坊保护更新项目入选《习近平文化思想实践案例选编（2024年）》","publish_date":"2024-12-17"},{"slug":"case-20241213-1b5a1662","title":"以文创留住乡愁 激发传统村落新活力——福建省屏南县探索传统村落保护利用助推乡村文化振兴的实践","publish_date":"2024-12-13"}],"updated_at":"2026-11-18T07:49:12.032Z"},{"slug":"policy-20241128-a8642983","title":"中国气象局 国家文物局关于做好文物行业气象防灾减灾和第四次全国文物普查工作的通知","type":"policy","type_label":"政策","issuer":"中国气象局 国家文物局","doc_no":"气发〔2024〕119号","publish_date":"2024-11-28","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202411/content_6989761.htm","summary":"依法保护范畴。各级气象部门要按照《关于加强央属文物保护管理工作的意见》，加大对管理使用文物的保护力度，加强文物价值研究和阐释利用，重视气象文化历史传承，推进世界气象组织百年气象站申报和保护，做好《中国","themes":["文物保护","灾害防治"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中国气象局 国家文物局关于做好文物行业气象防灾减灾和第四次全国文物普查工作的通知 气发〔2024〕119号 各省（自治区、直辖市）气象局、文物局： 我国文物数量多，空间分布广，气象灾害类型多样且复杂。文物特别是不可移动文物对气象灾害较为敏感，暴雨、台风、大风、强对流、沙尘、高温、暴雪等均可能对文物保护造成不利影响。联合国教科文组织指出“气候变化已成为世界遗产面临的最重大威胁之一”，气候变化及与其相关的灾害性天气对我国文物和文化遗产保护提出了新的挑战。为深入贯彻落实习近平总书记关于文物工作和气象工作重要指示精神，强化灾害性天气预报预警和文物防灾减灾联防联动，共同做好文物行业气象防灾减灾工作，共同推进第四次全国文物普查工作，现就有关事项通知如下： 一、提高思想认识，压实防灾减灾工作责任 各级气象、文物部门要清醒认识到目前气候变化背景下文物气象防灾减灾工作所面临的严峻形势和挑战要求，进一步增强责任感、紧迫感，坚持底线思维和极限思维，牢固树立安全意识、风险意识和责任意识，强化抓安全抓防范的政治自觉、思想自觉、行动自觉。要超前部署、提前研判，细化监测预警、指挥调度、巡查防守、抢险救援各环节具体任务，责任落实到岗到人，确保文物气象防灾减灾工作抓紧抓细抓实。 二、畅通信息共享，加强天气预警互动联动 各省级气象部门要加强与文物部门的沟通对接，了解文物行业气象灾害防范整体需求，及时向当地文物部门通报有关气象灾害监测预报预警信息。技术条件成熟省份的气象和文物部门应加强信息和数据共享，结合地方气象灾害风险普查成果、文物分布情况和历史灾情，分析研判各级各类对文物有较大影响的气象灾害类别和风险阈值，探索推进国家级和省级文物气象灾害风险图绘制和区划划定，联合开展文物气象风险预报预警业务。各级气象部门可商文物部门将文物管理使用单位纳入当地气象灾害预警信息发布对象库，联合制定发布策略，逐步提高气象灾害预警的精准性。 三、完善应急预案，建立部门沟通合作机制 各级气象、文物部门要将文物行业气象防灾减灾纳入地方气象防灾减灾体系，积极考虑在世界文化遗产地、全国重点文物保护单位设置气象监测点位，推动建立以气象灾害预警为先导的应急联动机制，文物部门应组织重点防御单位制定气象灾害应急预案，气象部门应予以技术支持和指导。省级气象部门和文物部门要建立常态化沟通合作机制，定期组织会商。省级气象部门要做好面向文物部门的重大气象灾害过程气象保障服务，及时通报监测实况，做好防范提醒。各级气象、文物部门应适时组织联合应急演练，举办专题培训，对负责文物保护相关人员开展气象防灾减灾知识培训。各级文物部门可联合气象部门共同组织开展汛期检查和安全隐患排查，通过检查制度落实、应对策略、物资准备等情况，提高气象灾害防御能力。 四、做好气象部门文物普查工作 各级气象部门要积极配合同级文物行政部门，及时提供气象部门管理的文物资源信息和新发现文物线索清单，为普查队员现场调查等工作提供便利条件。各级文物行政部门对气象部门管理的不可移动文物进行全面复查，对气象部门提供的线索开展实地调查，符合文物认定标准的依法认定、登记和公布，纳入依法保护范畴。各级气象部门要按照《关于加强央属文物保护管理工作的意见》，加大对管理使用文物的保护力度，加强文物价值研究和阐释利用，重视气象文化历史传承，推进世界气象组织百年气象站申报和保护，做好《中国气象史》编撰工作，增强气象历史文化遗产系统性保护意识和保护氛围。 特此通知。 中国气象局 国家文物局 2024年11月20日\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.285Z"},{"slug":"policy-20241124-717f48ab","title":"国家文物局关于印发《石窟寺开放管理导则（试行）》的通知","type":"policy","type_label":"政策","issuer":"国家文物局","doc_no":"文物保发〔2024〕58号","publish_date":"2024-11-24","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·政策库","source_url":"https://www.gov.cn/zhengce/zhengceku/202411/content_6989128.htm","summary":"工作要求，深入挖掘和阐释石窟寺的历史内涵、文化价值、现实意义，落实意识形态工作责任制，保护传承弘扬中华优秀传统文化，避免过度商业化、娱乐化。 第四条 责任主体。石窟寺计划开放的，其所在地县级及以上地方","themes":["文物保护","文物开放"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>国家文物局关于印发《石窟寺开放管理导则（试行）》的通知 文物保发〔2024〕58号 各有关省（自治区、直辖市）文物局（文化和旅游厅/局）、新疆生产建设兵团文物局： 为贯彻落实《国务院办公厅关于加强石窟寺保护利用工作的指导意见》，指导石窟寺开放管理并规范石窟寺旅游开发活动，我局编制完成《石窟寺开放管理导则（试行）》，现印发给你们，请遵照执行。 特此通知。 国家文物局 2024年11月14日 石窟寺开放管理导则（试行） 第一条 目的依据。为贯彻落实《国务院办公厅关于加强石窟寺保护利用工作的指导意见》（国办发〔2020〕41号），深化石窟寺价值研究阐释，指导石窟寺开放管理工作，规范石窟寺旅游开发活动，根据相关法律法规和政策文件制定本导则。 第二条 适用范围。本导则所称“石窟寺”是指已依法核定公布为文物保护单位或已登记尚未核定公布为文物保护单位的不可移动文物的石窟和摩崖造像（以下简称“石窟寺”）。 本导则所称“开放”是指依照《中华人民共和国文物保护法》规定辟为参观游览场所，包括但不限于各级各类景区。 第三条 总体要求。石窟寺开放应当坚持保护第一、加强管理、挖掘价值、有效利用、让文物活起来的工作要求，深入挖掘和阐释石窟寺的历史内涵、文化价值、现实意义，落实意识形态工作责任制，保护传承弘扬中华优秀传统文化，避免过度商业化、娱乐化。 第四条 责任主体。石窟寺计划开放的，其所在地县级及以上地方人民政府应当明确保护管理机构，提供相应的必要保障，切实加强保护能力建设，使保护管理工作力量与其承担的职责和任务相适应，确保石窟寺安全。 石窟寺保护管理机构是石窟寺开放管理的直接责任单位，具体负责石窟寺开放各项准备工作，履行开放管理、应急管理、日常保养维护、安全巡查、监测反馈等各项工作职能。 地方各级文物行政部门负责监督、检查、指导石窟寺开放管理工作。 第五条 禁止行为。石窟寺不得转让、抵押，不得将石窟寺作为或者变相作为企业资产经营，不得将石窟寺保护管理机构作为企业的下属机构或者交由企业管理。 石窟寺开放应当按照有关法律法规的规定不新设宗教活动场所，不组织、举行宗教活动，不接受宗教性捐赠；对民众自发开展的封建迷信等活动，石窟寺保护管理机构应当予以及时劝阻和制止。 石窟寺开放区域内已依法设立登记的宗教活动场所，应当严格遵守《文物保护法》及其实施条例、《宗教事务条例》等法律法规的规定。 第六条 必要条件。石窟寺开放应当具备下列基本条件： （一）文物本体无重大险情，文物周边环境无重大安全隐患； （二）文物本体构成清晰、历史内涵准确、文化价值突出； （三）有具有独立法人资格的专门保护管理机构，有满足研究、解说、管理需求的专业人员； （四）有醒目、清晰的文物保护标志说明； （五）有规范、齐全的文物记录档案； （六）有齐全的日常保养维护制度，并有专人落实； （七）有与开放相适应的保护、安防、消防、展示、导览、道路、游客集散服务等开放配套服务和辅助设施； （八）有必要的人员、文物等安全防护设施及制度，经过安全风险评估，满足安全条件； （九）有必要的环境保护设施和生态保护措施。 以上基本条件，有法律法规具体规定、国家标准规范、行业标准规范或者行业规范性要求的，应当符合其规定；涉及价值评估、阐释的，应当充分听取多学科专家的意见。 第七条 准备工作。石窟寺开放应当事先按照本导则第六条所列各项基本条件开展可行性评估，确认具备开放基本条件后，尚应做好以下准备工作并对外公告： （一）明确界定开放区域，合理确定开放时间； （二）科学核定游客承载量和最大瞬时流量，并制定流量控制方案、应急预案； （三）科学设置开放路线，合理设立游览导向系统； （四）组织开展讲解员专业培训和讲解词专业论证，确定讲解方式和手段； （五）确定门票、讲解费等收费项目，依法举行听证会；明确经营收入用于文物保护的比例； （六）制定并签订石窟寺开放责任书，明晰权责； （七）加强应急能力建设，充分考虑可能发生的自然和人为损害，配备救援及应急物资，并定期进行应急演练； （八）改善石窟寺外部交通，增强可达性； （九）研究阐释石窟寺的历史内涵、文化价值和现实意义，形成科学、准确的研究成果； （十）宣传石窟寺及其承载的中华优秀传统文化，增进当地民众的文化认同。 第八条 建设活动。因石窟寺开放需要，在石窟寺保护范围或者建设控制地带内开展建设活动的，应当按照《中华人民共和国文物保护法》相关规定履行相应的审批手续。石窟寺展示应当以确保文物本体安全为前提，不得建设污染石窟寺及其环境的设施，不得进行可能影响文物保护单位安全及其环境的活动。 第九条 开放管理。鼓励采用限时限流、定制服务等方式引导参观活动，确保参观人数不突破最大瞬时流量。 列入《世界遗产名录》或者核定公布为全国重点文物保护单位的石窟寺，应当全面推广预约参观制。 鼓励有条件的石窟寺采取建设开放数字展厅、博物馆、陈列馆，提供智能导览服务、“云展览”服务，组织开展专家讲座、研学研修等，丰富石窟寺开放内容，提升石窟寺开放体验。 石窟寺开放应当尽可能创造条件提供除参观游览以外的问询、引导、安保、环卫、交通、停车、通信、寄存、医疗、文创销售和老弱病残孕服务，以及适当的餐饮、休憩服务。鼓励石窟寺扩大衍生服务，采取多种方式促进所在地民众增加收入。 第十条 应急管理。石窟寺应当在自然灾害、事故灾难、公共卫生事件和社会安全事件等突发事件发生时严格执行已制定的应急预案。 参观人数可能达到单日最大承载量时，石窟寺保护管理机构应当提前公告并同时向当地人民政府报告，石窟寺保护管理机构和当地人民政府应当及时采取疏导、分流等措施。 第十一条 日常保养。石窟寺应当加强日常养护。石窟寺保存环境监测指标超出安全阈值，或者文物本体、载体及赋存环境出现重大安全隐患的，应当局部或者全部暂停开放。 第十二条 安全巡查。石窟寺应当加强安全巡查，及时发现重大安全风险和隐患。 暂不具备开放条件的石窟寺，应当由石窟寺所在地县级以上地方人民政府及时向社会公告。 第十三条 监测反馈。石窟寺开放应当建立智慧监测平台，对人员、文物本体及其赋存环境进行监测。监测数据应当及时整理、研究，用于管理提升和保护修缮。 石窟寺开放应当建立游客监督、意见反馈、投诉受理、舆情监测机制，根据意见反馈情况，适时、适当调整开放方案，采取积极、有效措施改善服务质量，提升石窟寺开放效果和游客满意度。 附件：石窟寺开放参考流程\u003c/p>","related":[{"slug":"policy-20261020-c2d0d9fa","title":"住房城乡建设部关于印发《历史文化名城（镇、村）与历史建筑保护传承“十五五”规划》的通知","publish_date":"2026-10-20"},{"slug":"policy-20260929-8ddc2528","title":"中共中央办公厅、国务院办公厅印发《文化遗产保护传承“十五五”规划》","publish_date":"2026-09-29"},{"slug":"policy-20260921-3f963b7e","title":"文化和旅游部关于印发《非物质文化遗产保护传承“十五五”规划》的通知","publish_date":"2026-09-21"},{"slug":"policy-20260920-b9ea2a2c","title":"北京市规划和自然资源委员会关于印发《北京市既有建筑改造体检评估指南（试行）》的通知","publish_date":"2026-09-20"},{"slug":"policy-20260724-27e3e961","title":"国务院关于同意将山东省潍坊市列为国家历史文化名城的批复","publish_date":"2026-07-24"}],"updated_at":"2026-11-16T09:21:20.301Z"},{"slug":"regulation-20241023-061ceb25","title":"城市公共交通条例","type":"regulation","type_label":"法规","issuer":"国务院","doc_no":"国令第793号","publish_date":"2024-10-23","effective_date":"","status":"现行有效","level":"国家级","region":"全国","source_name":"中国政府网·国务院文件","source_url":"https://www.gov.cn/zhengce/zhengceku/202410/content_6982322.htm","summary":"中华人民共和国国务院令  第793号 《城市公共交通条例》已经2024年8月19日国务院第39次常务会议通过，现予公布，自2024年12月1日起施行。 总理　　李强　　　　　　　　 2024年10月","themes":["城市交通","城市更新"],"featured":0,"attachments":[],"bodyHtml":"\u003cp>中华人民共和国国务院令 第793号 《城市公共交通条例》已经2024年8月19日国务院第39次常务会议通过，现予公布，自2024年12月1日起施行。 总理 李强 2024年10月17日 城市公共交通条例 第一章 总 则 第一条 为了推动城市公共交通高质量发展，提升城市公共交通服务水平，保障城市公共交通安全，更好满足公众基本出行需求，促进城市现代化建设，制定本条例。 第二条 本条例所称城市公共交通，是指在城市人民政府确定的区域内，利用公共汽电车、城市轨道交通车辆等公共交通工具和有关系统、设施，按照核定的线路、站点、时间、票价等运营，为公众提供基本出行服务。 第三条 国家实施城市公共交通优先发展战略，综合采取规划、土地、财政、金融等方面措施，保障城市公共交通发展，增强城市公共交通竞争力和吸引力。 国家鼓励、引导公众优先选择公共交通作为机动化出行方式。 第四条 城市公共交通工作应当坚持中国共产党的领导，坚持以人民为中心，坚持城市公共交通公益属性，落实城市公共交通优先发展战略，构建安全、便捷、高效、绿色、经济的城市公共交通体系。 第五条 城市人民政府是发展城市公共交通的责任主体。 城市人民政府应当加强对城市公共交通工作的组织领导，落实城市公共交通发展保障措施，强化对城市公共交通安全的监督管理，统筹研究和协调解决城市公共交通工作中的重大问题。 国务院城市公共交通主管部门及其他有关部门和省、自治区人民政府应当加强对城市公共交通工作的指导。 第六条 城市人民政府应当根据城市功能定位、规模、空间布局、发展目标、公众出行需求等实际情况和特点，与城市土地和空间使用相协调，统筹各种交通方式，科学确定城市公共交通发展目标和发展模式，推动提升城市公共交通在机动化出行中的分担比例。 第七条 承担城市公共交通运营服务的企业（以下简称城市公共交通企业）由城市人民政府或者其城市公共交通主管部门依法确定。 第八条 国家鼓励和支持新技术、新能源、新装备在城市公共交通
