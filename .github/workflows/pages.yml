name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://stellamiracle.github.io/heritage-renewal-portal/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - name: Deploy via REST (bypass twirp artifact index lag)
        id: deployment
        # REST deploy is the primary path; a failure here must not redden the run,
        # because the deploy-pages@v4 fallback below still produces a live site.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BUILD_VERSION: ${{ github.sha }}
          SITE_URL: https://stellamiracle.github.io/heritage-renewal-portal/
        run: |
          bash .github/scripts/deploy-pages-rest.sh
      - name: Cool down before fallback
        if: failure() || steps.deployment.outcome == 'failure'
        run: sleep 90
      - name: Fallback deploy-pages@v4
        if: failure() || steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
